# Encargos a Meshy (valravnx, 10 nov: el arte del juego, con Meshy; herramientas/meshy/). Desde las sesiones no se llega a
# api.meshy.ai, así que los encargos van por aquí: se sube una rama meshy-pedido/<id> con el encargo en
# herramientas/meshy/pedido.json y esto lo hace con la clave MESHY_API_KEY (un secreto del repositorio que puso
# valravnx; nunca va en un archivo). Lo que sale vuelve por la rama meshy/<ejecución>.
# Lo que hace cada encargo, en herramientas/meshy/encargo.py.
name: meshy
run-name: ${{ github.ref_name }}
on:
  push:
    branches: ['meshy-pedido/**']
permissions:
  contents: write
jobs:
  encargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El encargo
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: python3 herramientas/meshy/encargo.py
      - name: Devolver lo que sale
        if: always()
        run: |
          mkdir -p salida
          git config user.name "meshy (GitHub Actions)"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan "meshy/${{ github.run_id }}"; git rm -rfq --cached . ; git add -f salida
          git commit -qm "Meshy: lo que sale de ${{ github.ref_name }}"; git push -q origin "HEAD:meshy/${{ github.run_id }}"
          git push -q origin --delete "${{ github.ref_name }}" || true
