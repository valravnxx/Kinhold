# Texturas libres (CC0) para el suelo (12 nov, hito «El aspecto»: el suelo con materiales). Desde las sesiones no se
# llega a las webs de texturas, así que van por aquí: se sube una rama texturas-pedido/<id> con
# herramientas/texturas/pedido.json y herramientas/texturas/bajar.py las busca, las baja y las deja en salida/, que
# vuelve por la rama texturas/<ejecución>. Solo de ambientCG (todas CC0, dominio público).
name: texturas
run-name: ${{ github.ref_name }}
on:
  push:
    branches: ['texturas-pedido/**']
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar
        run: pip install --quiet pillow && python3 herramientas/texturas/bajar.py
      - name: Devolver lo que sale
        if: always()
        run: |
          mkdir -p salida
          git config user.name "texturas (GitHub Actions)"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan "texturas/${{ github.run_id }}"; git rm -rfq --cached . ; git add -f salida
          git commit -qm "Texturas: lo que sale de ${{ github.ref_name }}"; git push -q origin "HEAD:texturas/${{ github.run_id }}"
          git push -q origin --delete "${{ github.ref_name }}" || true
