# Todas las pruebas de Kinhold en la nube, cada grupo en su máquina a la vez (lo pidió valravnx el 29 oct: aquí no hay
# tarjeta gráfica y la batería entera pasaba de hora y media). Gratis en un repositorio público: 4 núcleos y 16 GB por
# máquina, hasta 20 a la vez.
# No se lanza con cada subida (los avances cada 15 minutos la lanzarían sin parar): la lanza
#   node herramientas/pruebas_nube.mjs
# subiendo lo que se quiere probar a una rama nube-pedido/<id>/<grupos o «todos»>, que borra al acabar. Espera, trae
# las capturas y la salida de cada grupo y dice qué ha fallado. Los grupos salen de
# herramientas/probar_todo.sh --grupos, así que una prueba nueva añadida allí entra sola.
# Las capturas y la salida vuelven por una rama nube/<ejecución>-<grupo> (desde aquí no se pueden bajar los
# «artifacts»: están en un almacén al que no se llega). Desde las sesiones no se pueden borrar ramas, así que limpia la
# nube: cada ejecución borra su rama nube-pedido al acabar y, al acabar, también las nube/ y nube-pedido/ de más de 3 horas.
# En el PC de valravnx (lo pidió el 31 oct: su tarjeta gráfica, cuando él lo permite): las ramas pc-pedido/<id>/<grupos>
# mandan los grupos a su PC (máquina propia con la etiqueta kinhold-gpu, que solo está en marcha mientras tiene abierto
# herramientas/pc_grafica/); «todos» ahí son todos menos «logica» (esa va siempre a la nube). Si su PC no los coge,
# pruebas_nube.mjs cancela la ejecución y los manda a la nube.
name: pruebas
run-name: ${{ github.ref_name }}
on:
  push:
    branches: ['nube-pedido/**', 'pc-pedido/**']
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      grupos: ${{ steps.g.outputs.grupos }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          pedidos="${RAMA#*-pedido/*/}"
          if [ "$pedidos" = todos ] && [ "${RAMA%%/*}" = pc-pedido ]; then echo "grupos=$(bash herramientas/probar_todo.sh --grupos | python3 -c 'import json,sys; print(json.dumps([g for g in json.load(sys.stdin) if g != "logica"]))')" >> "$GITHUB_OUTPUT"
          elif [ "$pedidos" = todos ]; then echo "grupos=$(bash herramientas/probar_todo.sh --grupos)" >> "$GITHUB_OUTPUT"
          else echo "grupos=[\"${pedidos//+/\",\"}\"]" >> "$GITHUB_OUTPUT"; fi
  grupo:
    needs: lista
    strategy:
      fail-fast: false
      matrix:
        grupo: ${{ fromJSON(needs.lista.outputs.grupos) }}
    # en el PC de valravnx (Windows, con Git Bash) o en una máquina de la nube
    runs-on: ${{ startsWith(github.ref_name, 'pc-pedido/') && fromJSON('["self-hosted","kinhold-gpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    name: ${{ matrix.grupo }}
    defaults:
      run:
        shell: bash
    steps:
      # En Windows, Git solo pone Git\cmd en el PATH, no su bash: sin esto, todos los pasos con «shell: bash» fallaban
      # al empezar («bash: command not found», 31 oct). Este paso va en PowerShell, que siempre está.
      - name: El bash de Git en el PATH (en Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $git = @("$env:ProgramFiles\Git", "${env:ProgramFiles(x86)}\Git", "$env:LOCALAPPDATA\Programs\Git") | Where-Object { Test-Path "$_\bin\bash.exe" } | Select-Object -First 1
          if (-not $git) { Write-Output '::error::No encuentro el bash de Git en este PC (Git para Windows).'; exit 1 }
          Add-Content -Encoding ascii -Path $env:GITHUB_PATH -Value "$git\bin"
          Add-Content -Encoding ascii -Path $env:GITHUB_PATH -Value "$git\usr\bin"
          # y el Python que puso herramientas/pc_grafica (para su usuario), delante del atajo de la tienda de Windows
          $py = Get-ChildItem "$env:LOCALAPPDATA\Programs\Python\Python3*\python.exe", "$env:ProgramFiles\Python3*\python.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($py) { Add-Content -Encoding ascii -Path $env:GITHUB_PATH -Value $py.DirectoryName; Add-Content -Encoding ascii -Path $env:GITHUB_PATH -Value "$($py.DirectoryName)\Scripts"; Write-Output "python: $($py.FullName)" }
          # la salida de Python, en UTF-8 (en Windows sería cp1252 y fallaría con letras como → o ✓)
          Add-Content -Encoding ascii -Path $env:GITHUB_ENV -Value 'PYTHONUTF8=1'
          Write-Output "bash: $git\bin\bash.exe"
      - name: Sin cambiar los finales de línea (en Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # en el PC de valravnx, sin la caché de GitHub (npm ya guarda lo suyo allí; restaurarla llegó a tardar 10 min)
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
      # en Windows, setup-python necesita permisos de administrador: en el PC de valravnx, el Python que pone
      # herramientas/pc_grafica (para su usuario)
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Navegador y Python
        run: |
          python -m pip install -q playwright==1.63.0 pillow numpy
          if [ "$RUNNER_OS" = Windows ]; then python -m playwright install chromium; else python -m playwright install --with-deps chromium; fi
      - name: En el PC, python3 es python y la tarjeta gráfica de verdad
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$HOME/kinhold_bin" && printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/kinhold_bin/python3" && chmod +x "$HOME/kinhold_bin/python3"
          cygpath -w "$HOME/kinhold_bin" >> "$GITHUB_PATH"
          python herramientas/pc_grafica/elegir_gpu.py
      - name: Letra Inter por defecto (como en las sesiones, para que las capturas salgan iguales)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q fonts-inter
          mkdir -p ~/.config/fontconfig
          printf '<?xml version="1.0"?>\n<!DOCTYPE fontconfig SYSTEM "fonts.dtd">\n<fontconfig>\n%s</fontconfig>\n' "$(for f in sans-serif system-ui serif; do printf '<alias><family>%s</family><prefer><family>Inter</family></prefer></alias>\n' $f; done)" > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null; fc-match sans-serif; fc-match system-ui
      - name: Caddy (solo lógica)
        if: matrix.grupo == 'logica' && runner.os == 'Linux'
        run: sudo apt-get install -y -q caddy
      - name: Pruebas del grupo
        id: pruebas
        run: |
          set +e
          inicio=$(date +%s)
          bash herramientas/probar_todo.sh --grupo "${{ matrix.grupo }}" 2>&1 | tee /tmp/resumen.txt
          r=${PIPESTATUS[0]}
          echo "tardó $(( $(date +%s) - inicio )) s" | tee -a /tmp/resumen.txt
          [ -n "$KINHOLD_GPU_TARJETA" ] && echo "en el PC de valravnx, con su tarjeta: $KINHOLD_GPU_TARJETA" | tee -a /tmp/resumen.txt
          echo "r=$r" >> "$GITHUB_OUTPUT"
      - name: Devolver capturas y salida por una rama
        # (si las pruebas no llegaron a empezar, nada: en el PC quedarían las de otra vez, y sin su resumen el grupo
        # se repite en la nube)
        if: always() && steps.pruebas.outcome != 'skipped'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mv /tmp/kinhold_capturas/salida /tmp/kinhold_capturas/salida_${{ matrix.grupo }} 2>/dev/null || true
          rm -rf /tmp/vuelta; mkdir -p /tmp/vuelta && cp /tmp/resumen.txt /tmp/vuelta/resumen_${{ matrix.grupo }}.txt || true
          export O_CAPT=$(cygpath -m /tmp/kinhold_capturas 2>/dev/null || echo /tmp/kinhold_capturas) D_VUELTA=$(cygpath -m /tmp/vuelta 2>/dev/null || echo /tmp/vuelta)
          python - <<'EOF'
          import os
          from PIL import Image
          o, d = os.environ['O_CAPT'], os.environ['D_VUELTA']
          for raiz, _, fs in os.walk(o):
              for f in fs:
                  a = os.path.join(raiz, f); b = os.path.join(d, os.path.relpath(a, o)); os.makedirs(os.path.dirname(b), exist_ok=True)
                  if f.lower().endswith('.png'):
                      im = Image.open(a).convert('RGB')
                      if im.width > 1280: im = im.resize((1280, round(im.height * 1280 / im.width)), Image.LANCZOS)
                      im.save(b[:-4] + '.jpg', quality=88)
                  elif os.path.getsize(a) < 5_000_000:
                      with open(a, 'rb') as x, open(b, 'wb') as y: y.write(x.read())
          EOF
          cd /tmp/vuelta && git init -q && git checkout -q --orphan vuelta && git add -A
          git -c user.name=kinhold-nube -c user.email=nube@kinhold.invalid commit -qm "Pruebas en la nube: ${{ matrix.grupo }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/nube/${{ github.run_id }}-${{ matrix.grupo }}
      - name: Resultado
        run: exit ${{ steps.pruebas.outputs.r }}
  limpiar:
    needs: grupo
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Borrar ramas de pruebas viejas (más de 3 horas; al final, para no retrasar las pruebas)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          limite=$(( $(date +%s) - 3 * 3600 ))
          for prefijo in nube nube-pedido pc-pedido; do
            gh api "repos/${{ github.repository }}/git/matching-refs/heads/$prefijo/" --jq '.[] | "\(.ref) \(.object.sha)"' | while read -r ref sha; do
              [ "$ref" = "refs/heads/${{ github.ref_name }}" ] && continue
              fecha=$(gh api "repos/${{ github.repository }}/commits/$sha" --jq .commit.committer.date) || continue
              if [ "$(date -d "$fecha" +%s)" -lt "$limite" ]; then gh api -X DELETE "repos/${{ github.repository }}/git/${ref#refs/}" && echo "borrada $ref"; fi
            done
          done
          true
      - name: Borrar la rama del pedido
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}" || true
