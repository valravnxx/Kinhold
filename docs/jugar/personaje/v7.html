<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kinhold Personaje</title>
<style>
:root{ --panel: rgba(36,30,24,.86); --panel2: rgba(58,48,38,.92); --ink:#f1e8d8; --muted:#bfb19a; --acento:#d9a441; --linea: rgba(241,232,216,.15); color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c3d2d8;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(20,14,8,.85) 100%);opacity:0}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:7px 11px;cursor:pointer}
button.sel{background:var(--acento);color:#241b10;border-color:transparent;font-weight:600}
[hidden]{display:none!important}
#superior{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#superior > *{pointer-events:auto}
#estilos{display:flex;gap:6px;flex-wrap:wrap}
#medida{margin-left:auto;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
#resumen{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));max-width:min(380px,calc(100vw - 20px));background:var(--panel);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--muted)}
#inferior{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px)}
#notas{position:fixed;inset:auto 10px calc(64px + env(safe-area-inset-bottom,0px)) 10px;max-width:560px;margin:0 auto;max-height:60vh;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:13px}
#opciones{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 140px);overflow:auto;background:var(--panel);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
#opciones .grupo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#opciones .grupo span{width:100%;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#opciones button{padding:5px 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
#opciones i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #0006}
#cargando{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:10px 16px;border-radius:12px}
#notas ul{padding-left:18px;margin:6px 0 0} #notas li{margin:0 0 6px}
@media (max-width:600px){ #opciones{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));max-height:38vh;width:calc(100vw - 20px)} #medida{margin-left:0} #estilos button{padding:6px 8px;font-size:12.5px} #resumen{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))} }
.foco{position:fixed;left:0;right:0;pointer-events:none;display:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.foco.arriba{top:0;height:30%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.foco.abajo{bottom:0;height:26%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
body.desenfoque .foco{display:block}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="superior">
  <div id="estilos"><button id="btnOpciones" class="sel">Personalizar</button><button data-luz="manana">Mañana</button><button data-luz="tarde">Tarde</button></div>
  <div id="medida">midiendo…</div>
</div>
<div id="inferior"><button data-vista="cuerpo">Cuerpo</button><button data-vista="cara">Cara</button><button data-vista="perfil">Perfil</button><button data-vista="espalda">Espalda</button><button id="btnNotas">Notas</button></div>
<div id="notas" hidden></div>
<div id="opciones"></div>
<div id="cargando">Cargando personaje…</div>
