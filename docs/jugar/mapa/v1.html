<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kinhold Mapa</title>
<style>
:root{ --panel: rgba(36,30,24,.88); --panel2: rgba(58,48,38,.94); --ink:#f1e8d8; --muted:#bfb19a; --acento:#d9a441; --linea: rgba(241,232,216,.15); color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#405a6c;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button,input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:6px 10px;cursor:pointer}
input{width:96px;cursor:text}
button.on{background:#6b5534;border-color:var(--acento)}
[hidden]{display:none!important}
#superior{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#superior > *{pointer-events:auto}
.grupo{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border-radius:12px;padding:4px}
.grupo button{padding:5px 9px}
#datos{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:10px;padding:7px 11px;font-size:12.5px;max-width:min(560px,calc(100vw - 20px))}
#datos b{color:var(--acento);font-weight:600}
#btnLeyenda{display:none}
#leyenda{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:10px;padding:7px 10px;font-size:12px;max-width:220px}
#leyenda div{display:flex;align-items:center;gap:6px;margin:2px 0}
#leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
#cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,26,22,.55);font-size:15px}
#cargando div{background:var(--panel);padding:12px 18px;border-radius:12px;min-width:240px;text-align:center}
#barra{height:6px;background:#4a3f33;border-radius:3px;margin-top:8px;overflow:hidden}#barra span{display:block;height:100%;width:0;background:var(--acento)}
#notas{position:fixed;inset:auto 10px calc(70px + env(safe-area-inset-bottom,0px)) 10px;max-width:600px;margin:0 auto;max-height:60vh;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:13px;z-index:5}
#notas ul{padding-left:18px;margin:6px 0 0} #notas li{margin:0 0 6px}
@media (max-width:640px){
  #superior{gap:5px} .grupo button,button,input{padding:5px 7px;font-size:12px} input{width:74px}
  #btnLeyenda{display:inline-block}
  #leyenda{display:none;bottom:auto;top:calc(130px + env(safe-area-inset-top,0px));font-size:11px;max-width:170px;padding:5px 8px}
  body.conLeyenda #leyenda{display:block}
  #leyenda i{width:10px;height:10px}
}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="superior">
  <div class="grupo" id="fondos"><button data-fondo="relieve" class="on">Relieve</button><button data-fondo="biomas">Biomas</button><button data-fondo="roca">Roca</button></div>
  <div class="grupo" id="capas"><button data-capa="rios" class="on">Ríos</button><button data-capa="paises" class="on">Países</button><button data-capa="vetas">Vetas</button></div>
  <div class="grupo"><select id="lado" aria-label="Tamaño del mundo"><option value="188">188 km</option><option value="256">256 km</option></select><input id="semilla" inputmode="numeric" aria-label="Semilla" title="Semilla"><button id="btnOtra">Otra semilla</button><button id="btnLeyenda">Leyenda</button><button id="btnNotas">Notas</button><span id="idiomas"></span></div>
</div>
<div id="leyenda"></div>
<div id="datos">Toca el mapa para ver qué hay en cada sitio.</div>
<div id="cargando"><div><span id="fase">Generando el mundo…</span><div id="barra"><span></span></div></div></div>

n{tierraKm2:Math.round(k*h),fraccionTierra:k/d,separacionIsla:a.separacionIsla==null?null:Math.round(a.separacionIsla),cumbre:Math.round(f),areaPais:y.map(Math.round),bocas:q,vetas:a.vetas.reduce((D,E)=>(D[E.tipo]=(D[E.tipo]||0)+1,D),{})}}var Ba="Mapa del mundo \xB7 boceto v1",Fa=["v1: primer boceto del mundo, generado por semilla (la misma semilla da siempre el mismo mundo). Sin figuras fijas: la forma de las tierras se suma con muchas piezas al azar (colinas grandes para la masa del continente y peque\xF1as para pen\xEDnsulas, cabos e islas; sierras; fosas que abren golfos, r\xEDas y brazos de mar; hoyas que dejan mares interiores), con las distancias deformadas por ruido y un ruido fractal encima, porque las costas de verdad son irregulares a todas las escalas. Es el m\xE9todo de los generadores de mapas de fantas\xEDa m\xE1s conocidos.","v1: hay siempre una isla grande que es un pa\xEDs entero, a m\xE1s de 20 km de mar de cualquier otra costa (en las pruebas salen entre 30 y 60 km): solo se llega en barco, para que haya rutas de comercio por mar. Se forma con varias colinas en fila y su sierra, as\xED que sale alargada e irregular; mide unos 1.800 a 2.400 km\xB2, algo menos que los pa\xEDses del continente.","v1, propuesta: arriba se elige el tama\xF1o del mundo. Con 188 km (el del GDD) los pa\xEDses del continente salen de unos 3.000 km\xB2 (unos 55 \xD7 55 km) y la isla, de unos 900 km\xB2; con 256 km, de unos 5.700 km\xB2 (unos 75 \xD7 75) y la isla, de unos 2.000 km\xB2. Sale por defecto el de 256 para que la isla sea un pa\xEDs de verdad. Lo decide valravnx.","v1: el relieve sale del levantamiento de las cordilleras y de la erosi\xF3n de los r\xEDos (primero el agua, despu\xE9s el terreno, como dice el GDD). Las cumbres llegan a unos 3.000 m y los tramos bajos de cada sierra son los collados por donde cruzar. Algunas sierras salen hacia el mar y hacen pen\xEDnsulas largas con su espinazo.","v1: el ancho de cada r\xEDo sale del \xE1rea que drena, con la regla de los r\xEDos de verdad (el ancho crece con la ra\xEDz del caudal): arroyos de menos de 5 m, r\xEDos de 5 a 40 m y grandes r\xEDos de m\xE1s de 40 m. Con tierras de este tama\xF1o casi no salen grandes r\xEDos: hace falta una cuenca de unos 4.000 km\xB2.","v1: clima por latitud (fr\xEDo al norte, templado en medio, c\xE1lido y m\xE1s seco al sur) y por altura; la lluvia la trae el viento del oeste y cae al subir las sierras, as\xED que las laderas de levante quedan m\xE1s secas.","v1, provisional: cinco pa\xEDses que crecen desde un centro llano y se frenan en las cumbres y en los r\xEDos grandes (fronteras naturales), equilibrados para que midan parecido. Se llaman Pa\xEDs 1 a 5 hasta que valravnx les ponga nombre. Las islas peque\xF1as sueltas no son de nadie de momento.","v1: roca madre por provincias: granito y pizarra en el coraz\xF3n de las sierras, caliza en sus faldas y arenisca en las llanuras. Hierro de pantano (poco y malo) en las turberas; vetas de hierro donde el granito o la pizarra tocan la caliza; carb\xF3n en la arenisca al pie de las sierras.","v1: toca el mapa para ver la altura, el bioma, la roca, el pa\xEDs y el r\xEDo de ese punto. La semilla se puede cambiar; el enlace con ?semilla= abre ese mundo."];var Ga={Moj\u00F3n:"Boundary stone","v22, arreglo (valravnx: la cama se iba al altillo estando debajo): la decoraci\xF3n solo se apunta a los suelos y cimientos de la planta en la que est\xE1s, aunque el piso de arriba se vea en la pantalla por delante; arriba, fuera de los suelos de tu planta, no se pone.":"v22, fix (valravnx: the bed went onto the loft while standing below it): decorations only aim at the floors and foundations of the storey you are on, even if the floor above shows in front on screen; upstairs, off the floors of your storey, they are not placed.","v22: los cimientos y los suelos de troncos ya no dejan ver el suelo de debajo por las juntas entre tronco y tronco: llevan debajo un relleno oscuro que tapa del todo.":"v22: log foundations and log floors no longer let the ground below show through the joints between logs: they have a dark filling underneath that covers completely.","v17: en \xABConstruir\xBB, la decoraci\xF3n va al suelo de la planta en la que est\xE1s (ya no al piso de arriba) y los cimientos y suelos de troncos tapan del todo. Es la construcci\xF3n v22.":"v17: in \u201CBuild\u201D, decorations go on the floor of the storey you are on (no longer the floor above), and log foundations and floors cover completely. It is building v22.","Hito 1 \xB7 v22":"Milestone 1 \xB7 v22","Demo \xFAnica \xB7 v17 (decoraci\xF3n en el suelo de tu planta y suelos de troncos sin huecos)":"Single demo \xB7 v17 (decorations on your storey's floor and log floors without gaps)","v21: se construye por obras (decidido por valravnx el 26 oct). Colocar pone solo el marco de la pieza, que se ve tenue dentro de un armaz\xF3n de varas atadas y a\xFAn no cuesta nada. Junto a la obra, Usar (F) le lleva el material que le falta y te pones a construir; moverse lo para y se retoma con Usar. Cada pieza tarda 4 s m\xE1s 1 s por cada 20 kg (el GDD no da cifras: provisional); por ejemplo, un poste 7 s, un muro de troncos 19 s y un cimiento de piedra 24 s. Si te ayudan, se suman los segundos de todos y se acaba antes. La obra a medias guarda lo entregado y el trabajo, con qui\xE9n llev\xF3 cada cosa y qui\xE9n trabaj\xF3 cu\xE1nto.":"v21: building is done through works (decided by valravnx on 26 Oct). Placing only sets up the piece's frame, which shows faintly inside a scaffold of lashed poles and costs nothing yet. Next to the work, Use (F) brings it the material it still needs and you start building; moving stops it and Use resumes it. Each piece takes 4 s plus 1 s per 20 kg (the GDD gives no figures: provisional); for example, a post 7 s, a log wall 19 s and a stone foundation 24 s. If others help, everyone's seconds add up and it is finished sooner. An unfinished work keeps what was delivered and the work done, with who brought each thing and who worked how long.","v21: una obra a medias no sostiene nada (no se pone nada encima hasta terminarla), no corta el paso ni se puede pisar, y su peso ya cuenta al poner el marco, as\xED que al terminarla aguanta seguro. Una puerta en obras no se abre. Al desmontar una obra a medias se recupera entero lo que se le hab\xEDa llevado.":"v21: an unfinished work holds nothing up (nothing goes on top until it is finished), does not block the way and cannot be stood on, and its weight already counts when the frame is placed, so once finished it is sure to hold. A door under construction does not open. Dismantling an unfinished work gives back everything that had been brought to it.","v21: el material sale a\xFAn de la reserva com\xFAn, como antes; llevarlo a mano hasta la altura de la obra, el andamio y las poleas llegan en las tareas siguientes. Los muebles y el moj\xF3n se siguen poniendo al momento.":"v21: the material still comes from the shared stock, as before; carrying it by hand up to the height of the work, the scaffold and the pulleys come in the next tasks. Furniture and the boundary stone are still placed instantly.","Hito 1 \xB7 v21":"Milestone 1 \xB7 v21","v16: en \xABConstruir\xBB, se construye por obras: colocar pone el marco, Usar (F) junto a la obra le lleva el material y te pone a construir, y cada pieza tarda un tiempo seg\xFAn su peso. Es la construcci\xF3n v21.":"v16: in \u201CBuild\u201D, building is done through works: placing sets up the frame, Use (F) next to the work brings it the material and starts you building, and each piece takes a time according to its weight. It is building v21.","Demo \xFAnica \xB7 v16 (se construye por obras: marco, material y tiempo)":"Single demo \xB7 v16 (building through works: frame, material and time)","Esa pieza ya est\xE1 terminada.":"That piece is already finished.","A esa obra no le falta ese material.":"That work does not need that material.","Rato de trabajo no v\xE1lido.":"Invalid work time.","Primero hay que llevarle todo el material.":"First all the material has to be brought to it.","Est\xE1 en obras.":"It is under construction.","No hay obra ah\xED.":"There is no work there.","Marco puesto. Ac\xE9rcate y pulsa Usar (F) para llevarle el material y construirla.":"Frame placed. Go up to it and press Use (F) to bring it the material and build it.","Le falta":"It still needs","Material entregado.":"Material delivered.","Construyendo:":"Building:","terminada.":"finished.","Dejas la obra (vuelve con Usar).":"You leave the work (come back with Use).","Cimiento de piedra":"Stone foundation","Cimiento de troncos":"Log foundation","Suelo de troncos":"Log floor","Suelo de tablas":"Plank floor",Poste:"Post",Viga:"Beam","Muro de zarzo y barro":"Wattle and daub wall","Muro de troncos":"Log wall","Muro de troncos con puerta":"Log wall with doorway","Muro de troncos con ventana":"Log wall with window","Muro de entramado":"Timber-frame wall","Muro de tablas":"Plank wall","Muro de tablas con puerta":"Plank wall with doorway","Medio muro":"Half wall","Tejado de paja":"Thatch roof","Tejado de tablillas":"Shingle roof","Hastial (remate)":"Gable (end piece)","Escalera de mano":"Ladder","Puerta de varas":"Wattle door","Puerta de tablas":"Plank door","Cerca de varas":"Wattle fence","Demo \xFAnica \xB7 v8 (barandillas y portillo en \xABConstruir\xBB)":"Single demo \xB7 v8 (railings and gate in \u201CBuild\u201D)","v8: en \xABConstruir\xBB, el medio muro hace de barandilla en el borde de un suelo en alto (por ah\xED ya no se cae) y hay portillo de varas para la cerca, que se abre con Usar. Es la construcci\xF3n v13.":"v8: in \u201CBuild\u201D, the half wall works as a railing on the edge of a raised floor (you can no longer fall there) and there is a wattle gate for the fence, which opens with Use. It is construction v13.","Portillo de varas":"Wattle gate","Hito 1 \xB7 v12":"Milestone 1 \xB7 v12","v13: barandillas. El medio muro hace de barandilla en el borde de un suelo en alto o alrededor del hueco de una escalera de tablas: se apoya en el suelo de al lado (o en el muro de debajo) y no deja pasar, as\xED que por ah\xED ya no se cae. Por el lado por el que se sale de la escalera hay que dejarlo abierto.":"v13: railings. The half wall works as a railing on the edge of a raised floor or around the opening of a plank stairs: it rests on the floor next to it (or on the wall below) and blocks the way, so you can no longer fall there. The side where you step off the stairs has to be left open.","v13: portillo de varas para la cerca, para los corrales. Cuesta lo mismo que la puerta de varas (4 varas y 1 cuerda), porque el documento de sistemas no lo dice. Va en el suelo como la cerca y se abre y se cierra con Usar (F); abierto deja pasar.":"v13: wattle gate for the fence, for animal pens. It costs the same as the wattle door (4 rods and 1 rope), because the systems document does not say. It goes on the ground like the fence and opens and closes with Use (F); when open you can walk through.","Demo \xFAnica \xB7 v6 (el cintur\xF3n de la cota ce\xF1ido)":"Single demo \xB7 v6 (belt over the mail fitted)","v6: el cintur\xF3n de encima de la cota ya no sobresale hacia los brazos, en las tres partes. Es el personaje v14 (personajes del taller-v7), con la construcci\xF3n v11 y el combate v8.":"v6: the belt over the mail shirt no longer sticks out to the arms, in all three parts. It is character v14 (characters from taller-v7), with construction v11 and combat v8.","Personaje \xB7 v14 (el cintur\xF3n de la cota ya no se estira hacia los brazos)":"Character \xB7 v14 (the belt over the mail no longer stretches out to the arms)","v14: el cintur\xF3n de encima de la cota ya no sobresale hacia los lados hasta los brazos (valravnx lo vio en las fotos con los brazos abiertos). Al medir el contorno de la cintura se contaban tambi\xE9n las mangas, y las de la cota bajan hasta la mano, que cuelga a esa altura. Ahora solo cuentan el cuerpo y la falda de la prenda. Personajes en taller-v7; lo dem\xE1s, igual que la v13.":"v14: the belt over the mail shirt no longer sticks out sideways to the arms (valravnx saw it in the photos with the arms open). When measuring around the waist the sleeves were counted too, and the mail sleeves reach down to the hand, which hangs at that height. Now only the body and skirt of the garment count. Characters in taller-v7; everything else is the same as v13.",Empalizada:"Palisade","Puerta de empalizada":"Palisade gate","Cama de paja":"Straw bed","Cama de madera":"Wooden bed",Mesa:"Table",Banco:"Bench",Taburete:"Stool",Arc\u00F3n:"Chest",Barril:"Barrel",Estanter\u00EDa:"Shelf","Antorcha de pie":"Standing torch","Alfombra de piel":"Hide rug",Estandarte:"Banner","Espada larga":"Longsword","Espada y escudo":"Sword and shield",Palo:"Staff",Arco:"Bow",Piedras:"Stones",Lino:"Linen",Gambes\u00F3n:"Gambeson","Cota de malla":"Mail hauberk",Piedra:"Stone",Tronco:"Log",Vara:"Rod",Barro:"Clay",Paja:"Straw",Cuerda:"Rope",Tabla:"Plank",Clavo:"Nail",Hierro:"Iron",Alto:"High",Izquierda:"Left",Derecha:"Right",Bajo:"Low",Estocada:"Thrust",cabeza:"head",torso:"torso","brazo izquierdo":"left arm","brazo derecho":"right arm","pierna izquierda":"left leg","pierna derecha":"right leg",leve:"light",grave:"serious","muy grave":"critical",corte:"cut",perforante:"piercing",contundente:"blunt","Ya tienes un moj\xF3n.":"You already have a boundary stone.","Faltan materiales.":"Not enough materials.","Pieza no v\xE1lida.":"Invalid piece.","Primero coloca tu moj\xF3n.":"Place your boundary stone first.","Fuera de tu tierra.":"Outside your land.","Planta no permitida.":"Floor not allowed.","Esta pieza solo va en el suelo.":"This piece only goes on the ground.","En la planta baja usa un cimiento.":"On the ground floor, use a foundation.","Ese hueco ya est\xE1 ocupado.":"That slot is already taken.","La estructura no soporta ese peso.":"The structure can't bear that weight.","No existe.":"It doesn't exist.","No se puede desmontar: otra pieza quedar\xEDa sobrecargada.":"Can't dismantle: another piece would be overloaded.","No v\xE1lida.":"Invalid.","Un suelo en alto necesita muros o vigas debajo, o un suelo al lado que los tenga.":"A raised floor needs walls or beams below it, or a floor next to it that has them.","El poste necesita otro poste o un suelo debajo.":"The post needs another post or a floor below it.","El muro necesita un cimiento o suelo al lado, un muro debajo o postes en los dos extremos.":"The wall needs a foundation or floor next to it, a wall below it, or posts at both ends.","La viga necesita postes en los dos extremos o un muro debajo.":"The beam needs posts at both ends or a wall below it.","El tejado necesita muros o vigas debajo, o un tramo de tejado al lado que los tenga.":"The roof needs walls or beams below it, or a roof section next to it that has them.","El hastial va encima de un muro o una viga.":"The gable goes on top of a wall or a beam.","La puerta va en un muro con hueco de puerta.":"The door goes in a wall with a doorway.","La escalera necesita un suelo.":"The ladder needs a floor.","Sin apoyo.":"No support.","Inconsciente por un golpe en la cabeza":"Knocked out by a blow to the head","Herida mortal en la cabeza":"Mortal head wound",Desangrado:"Bled out","Punto d\xE9bil":"Weak point","Primera pieza: fija la rejilla de una construcci\xF3n nueva. Gira con R o el bot\xF3n Girar.":"First piece: it sets the grid of a new building. Rotate with R or the Rotate button.","recuperas el 75% del material":"you get back 75% of the material",caer\u00E1n:"will drop","caer\xE1 1 pieza que tiene encima (se destruye)":"will drop 1 piece on top of it (destroyed)","pieza destruida":"piece destroyed","piezas que tiene encima (se destruyen)":"pieces on top of it (destroyed)",Desmontado:"Dismantled","piezas destruidas":"pieces destroyed",Planta:"Floor","Planta 0":"Floor 0","No hay nada que usar cerca.":"Nothing to use nearby.","Abierta.":"Open.","Cerrada.":"Closed.","Subes a la planta":"You climb to floor","Bajas a la planta":"You go down to floor","No hay suelo arriba al que subir.":"There's no floor above to climb to.",Tierra:"Land",Base:"Base",Estructura:"Frame",Muros:"Walls",Tejados:"Roofs",Acceso:"Access",Exterior:"Outdoor",Decoraci\u00F3n:"Furnishing","Pulsa Construir \u2192 Tierra \u2192 Moj\xF3n para reclamar tu tierra.":"Press Build \u2192 Land \u2192 Boundary stone to claim your land.","\xBFSeguro? Pulsa otra vez para borrar todo.":"Sure? Press again to erase everything.","Pr\xE1cticas: poste a la izquierda, dianas a 10, 20 y 35 m.":"Practice: post on the left, targets at 10, 20 and 35 m.","Carga: el rival corre hacia ti desde 40 m. Dispara antes de que llegue.":"Charge: the opponent runs at you from 40 m. Shoot before he reaches you.","Duelo a distancia: mant\xE9n pulsado para tensar y suelta.":"Ranged duel: hold to draw and release.","Duelo. Haz clic o toca una zona de la rosa para golpear por ese lado.":"Duel. Click or tap a zone of the rose to strike from that side.","\xA1Contraataca!":"Counter now!","\xA1Para ahora!":"Parry now!","Golpe maestro: golpea ese lado":"Master strike: strike that side",Parando:"Parrying","Finta: cambias a {l}":"Feint: you switch to {l}","Contraataque: solo se para con una parada perfecta":"Counterattack: only a perfect parry stops it","Demasiado flojo: el tiro se cancela (hace falta tensar al menos la mitad)":"Too weak: the shot is cancelled (you must draw at least halfway)","Al echar a correr aflojas el arco":"You ease the bow as you break into a run","Poste: {l} a {z} \xB7 golpe {g} \xB7 fuerza {f}%":"Post: {l} to the {z} \xB7 {g} hit \xB7 force {f}%","Tu contraataque entra: {g} en {z}":"Your counterattack lands: {g} to the {z}","Hieres al rival: {g} en {z} (est\xE1 agotado y su parada cede)":"You wound the opponent: {g} to the {z} (he is exhausted and his parry gives way)","Hieres al rival: {g} en {z}":"You wound the opponent: {g} to the {z}","El rival para tu golpe":"The opponent parries your blow","El rival para en el momento justo: quedas descolocado":"The opponent parries at just the right moment: you are off balance","\xA1Golpe maestro del rival! Desv\xEDa el tuyo":"Master strike by the opponent! He deflects yours","Golpe al aire: fuera de alcance":"Blow in the air: out of reach","Te hieren: {g} en {z} (era un contraataque: solo lo para una parada perfecta)":"You are wounded: {g} to the {z} (it was a counterattack: only a perfect parry stops it)","Te hieren: {g} en {z} (est\xE1s agotado y tu parada cede)":"You are wounded: {g} to the {z} (you are exhausted and your parry gives way)","Te hieren: {g} en {z}":"You are wounded: {g} to the {z}","Paras el golpe":"You parry the blow","\xA1Parada perfecta! Contraataca ya":"Perfect parry! Counter now","\xA1Golpe maestro! Desv\xEDas su golpe y el tuyo entra":"Master strike! You deflect his blow and yours lands","El rival golpea al aire":"The opponent strikes the air","Aciertas: herida {g} en {z}":"Hit: {g} wound to the {z}","Te alcanza: herida {g} en {z}":"You are hit: {g} wound to the {z}","Tu escudo para la flecha":"Your shield stops the arrow","Tu escudo para la piedra":"Your shield stops the stone","El rival para tu flecha con el escudo":"The opponent stops your arrow with his shield","El rival para tu piedra con el escudo":"The opponent stops your stone with his shield","Diana a {d} m: {p} puntos":"Target at {d} m: {p} points","Al suelo a {d} m":"Into the ground at {d} m","Has vencido":"You have won","Has ca\xEDdo":"You have fallen","El rival: {m}.":"The opponent: {m}.",Cansancio:"Fatigue",Sangrado:"Bleeding","Pierdes sangre. Te queda {s}%.":"You are losing blood. {s}% left.","Herida {g}":"{g} wound",Descolocado:"Off balance","No puedes atacar ni parar un momento.":"You can't attack or parry for a moment.",parando:"parrying","golpes y tiros m\xE1s lentos y flojos":"slower, weaker blows and shots","algo m\xE1s lento":"a little slower","te mueves m\xE1s despacio":"you move more slowly","sangra mucho":"bleeds heavily","Como la tuya":"Same as yours",T\u00FA:"You",Rival:"Opponent",Duelo:"Duel","Carga desde 40 m":"Charge from 40 m","Pr\xE1cticas (poste y dianas)":"Practice (post and targets)","Aprendiz (lento, con avisos)":"Apprentice (slow, with cues)","Normal (solo ves el lado)":"Normal (you only see the side)","Realista (sin avisos)":"Realistic (no cues)","{c}%. Atacar, parar, fintar y fallar cansan; mantener la parada tambi\xE9n. Por encima del 70% tus golpes son m\xE1s lentos y al {r}% tu parada cede.":"{c}%. Attacking, parrying, feinting and missing tire you; so does holding a parry. Above 70% your blows are slower, and at {r}% your parry gives way.","Golpes lanzados":"Blows thrown","Heridas causadas":"Wounds dealt","Golpes parados":"Blows parried","Paradas perfectas":"Perfect parries","Golpes maestros":"Master strikes","Heridas recibidas":"Wounds taken",Tiros:"Shots",Aciertos:"Hits",Kinhold:"Kinhold","Kinhold Combate":"Kinhold Combat","+ Materiales":"+ Materials",Decisiones:"Decisions",Ayuda:"Help",Reiniciar:"Restart",Mover:"Move",Construir:"Build",Desmontar:"Dismantle",Girar:"Rotate",Colocar:"Place",Usar:"Use",Cancelar:"Cancel","Decisiones tomadas en este hito":"Decisions made in this milestone","C\xF3mo se juega este hito":"How to play this milestone","Pulsa <b>Construir</b>, pesta\xF1a <b>Tierra</b>, y coloca tu <b>moj\xF3n</b>: tu tierra es el c\xEDrculo claro de 20 m.":"Press <b>Build</b>, tab <b>Land</b>, and place your <b>boundary stone</b>: your land is the light 20 m circle.","Empieza por un <b>cimiento</b> (pesta\xF1a Base). Esa primera pieza fija la rejilla; puedes girarla antes de colocarla.":"Start with a <b>foundation</b> (Base tab). That first piece sets the grid; you can rotate it before placing it.","Pon <b>muros</b> junto al cimiento, un <b>suelo</b> en la planta 1 encima de los muros, y <b>tejado</b> arriba.":"Put <b>walls</b> next to the foundation, a <b>floor</b> on floor 1 on top of the walls, and a <b>roof</b> above.","Si algo no aguanta el peso, se marca en rojo la pieza d\xE9bil y no se coloca.":"If something can't bear the weight, the weak piece is marked in red and nothing is placed.","En <b>Desmontar</b>, la pieza se marca en naranja y lo que caer\xEDa encima en rojo. Recuperas el 75%.":"In <b>Dismantle</b>, the piece is marked in orange and whatever would fall on top in red. You get back 75%.","Las puertas y la escalera de mano se usan con <b>Usar</b>.":"Doors and the ladder are used with <b>Use</b>.","<kbd>W A S D</kbd> moverse \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n derecho: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> move \xB7 <kbd>Shift</kbd> run \xB7 <kbd>Q</kbd>/<kbd>E</kbd> or right button: turn camera \xB7 wheel: zoom","<kbd>B</kbd> construir \xB7 <kbd>X</kbd> desmontar \xB7 <kbd>R</kbd> girar pieza \xB7 <kbd>ReP\xE1g</kbd>/<kbd>AvP\xE1g</kbd> planta \xB7 <kbd>F</kbd> usar \xB7 <kbd>Esc</kbd> salir":"<kbd>B</kbd> build \xB7 <kbd>X</kbd> dismantle \xB7 <kbd>R</kbd> rotate piece \xB7 <kbd>PgUp</kbd>/<kbd>PgDn</kbd> floor \xB7 <kbd>F</kbd> use \xB7 <kbd>Esc</kbd> exit","Joystick abajo a la izquierda para moverte. Arrastra con un dedo para girar la c\xE1mara y pellizca para el zoom.":"Joystick at the bottom left to move. Drag with one finger to turn the camera and pinch to zoom.","Al construir, toca el suelo donde quieres la pieza y pulsa <b>Colocar</b>.":"When building, tap the ground where you want the piece and press <b>Place</b>.",'<label><input type="checkbox" id="chkSigue"> La pieza sigue al personaje (en vez de tocar el suelo)</label>':'<label><input type="checkbox" id="chkSigue"> The piece follows the character (instead of tapping the ground)</label>',Opciones:"Options",Modo:"Mode","Tu arma":"Your weapon","Tu ropa":"Your clothing","Ropa del rival":"Opponent's clothing","Arma del rival":"Opponent's weapon",Dificultad:"Difficulty",Sonido:"Sound","Der.":"Right","Izq.":"Left","Estoc.":"Thrust",Parar:"Parry","Otra vez":"Again","C\xF3mo se combate":"How to fight","<kbd>W A S D</kbd> moverte \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n central: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> move \xB7 <kbd>Shift</kbd> run \xB7 <kbd>Q</kbd>/<kbd>E</kbd> or middle button: turn camera \xB7 wheel: zoom","Cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean, siempre de cara.":"Near the opponent, forward and back close in or pull away, and the sides circle around him, always facing him.","<b>Atacar:</b> sobre el rival aparece una rosa de cinco zonas. Pon el cursor en la zona por la que quieres golpear y haz clic. El centro es la estocada. Tambi\xE9n <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> del teclado num\xE9rico.":"<b>Attack:</b> a rose of five zones appears over the opponent. Put the cursor on the zone you want to strike from and click. The centre is the thrust. Also <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> on the numeric keypad.","<b>Finta:</b> mientras preparas el golpe, haz clic en otra zona para cambiarlo (hasta la mitad de la preparaci\xF3n, cuesta aliento).":"<b>Feint:</b> while winding up the blow, click another zone to change it (up to halfway through the wind-up; it costs stamina).","<b>Parar:</b> mant\xE9n el bot\xF3n derecho o <kbd>Espacio</kbd>. No hace falta elegir lado.":"<b>Parry:</b> hold the right button or <kbd>Space</kbd>. You don't need to choose a side.","<b>Arco y piedras:</b> mant\xE9n el bot\xF3n izquierdo para tensar, apunta y suelta. El c\xEDrculo se cierra al tensar y se pone verde cuando est\xE1 listo; si aguantas demasiado tiembla.":"<b>Bow and stones:</b> hold the left button to draw, aim and release. The circle closes as you draw and turns green when ready; if you hold too long it shakes.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Dos dedos giran la c\xE1mara.":"Joystick on the left to move; near the opponent the sides circle around him. Two fingers turn the camera.","<b>Atacar:</b> toca una zona de la rosa que aparece sobre el rival. El centro es la estocada. Tocar otra zona mientras preparas es una finta.":"<b>Attack:</b> tap a zone of the rose that appears over the opponent. The centre is the thrust. Tapping another zone while winding up is a feint.","<b>Parar:</b> mant\xE9n el bot\xF3n Parar.":"<b>Parry:</b> hold the Parry button.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta.":"<b>Bow and stones:</b> hold your finger to draw, drag to aim and release.","Las tres capas de defensa":"The three layers of defence","<b>Parada:</b> mantener Parar detiene cualquier golpe, pero cansa. Agotado (95%), cede.":"<b>Parry:</b> holding Parry stops any blow, but it tires you. When exhausted (95%), it gives way.","<b>Escudo</b> (arma \xABEspada y escudo\xBB): al parar se levanta; para tambi\xE9n flechas y piedras que te vengan de frente y cansa menos que parar con la espada. La espada de una mano llega algo menos que la larga.":"<b>Shield</b> (weapon \u201CSword and shield\u201D): it rises when you parry; it also stops arrows and stones coming from the front and tires you less than parrying with the sword. The one-handed sword reaches a little less than the longsword.",'<b>Parada perfecta:</b> empieza a parar justo antes del impacto (zona en <span style="color:var(--verde)">verde</span> en aprendiz). El rival queda descolocado y tu contraataque sale r\xE1pido y solo se para con otra parada perfecta.':'<b>Perfect parry:</b> start parrying just before the impact (zone in <span style="color:var(--verde)">green</span> on apprentice). The opponent is thrown off balance and your counterattack comes out fast and can only be stopped by another perfect parry.','<b>Golpe maestro:</b> si ves venir un golpe por un lado (zona en <span style="color:var(--rojo)">rojo</span>), golpea t\xFA por ese mismo lado al principio de su preparaci\xF3n (borde dorado). Desv\xEDas su golpe y el tuyo entra.':'<b>Master strike:</b> if you see a blow coming from one side (zone in <span style="color:var(--rojo)">red</span>), strike from that same side early in his wind-up (golden edge). You deflect his blow and yours lands.',"En <b>aprendiz</b> los golpes son lentos y ves el lado y el momento. En <b>normal</b> solo ves el lado. En <b>realista</b> no hay avisos: hay que leer el cuerpo del rival.":"On <b>apprentice</b> blows are slow and you see the side and the timing. On <b>normal</b> you only see the side. On <b>realistic</b> there are no cues: you have to read the opponent's body.",Avisos:"Status","Los c\xEDrculos de la derecha avisan de cansancio, sangrado y heridas. T\xF3calos para ver qu\xE9 efecto tienen.":"The circles on the right warn of fatigue, bleeding and wounds. Tap them to see their effect.","Decisiones tomadas en el combate":"Decisions made in combat","Terreno llano en este hito. Las cuestas y su efecto en los cimientos llegan con el mundo generado.":"Flat terrain in this milestone. Slopes and their effect on foundations come with the generated world.","Los materiales vienen dados (y hay bot\xF3n para rellenar). Recolectarlos llega en el hito 2.":"Materials are given (and there's a button to refill them). Gathering them comes in milestone 2.","Para construir hace falta tu moj\xF3n; la tierra es un c\xEDrculo de 20 m (moj\xF3n de nivel 1). Subir de nivel el moj\xF3n llega m\xE1s adelante.":"Building requires your boundary stone; your land is a 20 m circle (level 1 stone). Upgrading the stone comes later.","La primera pieza estructural fija la rejilla: posici\xF3n donde apuntas y giro libre en pasos de 15\xB0. Toda pieza a menos de 6 m de una construcci\xF3n encaja en su rejilla.":"The first structural piece sets the grid: position where you aim and free rotation in 15\xB0 steps. Any piece within 6 m of a building snaps to its grid.","Los apoyos siguen un orden realista: un muro descansa primero en el muro o la viga de debajo, si no en postes en sus dos extremos, y si no en el suelo o cimiento de al lado.":"Supports follow a realistic order: a wall rests first on the wall or beam below it, otherwise on posts at both ends, and otherwise on the floor or foundation beside it.","La carga se reparte a partes iguales entre los apoyos de cada pieza.":"The load is shared equally among each piece's supports.","Al desmontar recuperas el 75% de esa pieza. Lo que cae en cascada encima se destruye sin devolver material.":"Dismantling gives back 75% of that piece. Whatever collapses on top of it is destroyed and returns no material.","Si al desmontar una pieza otra quedar\xEDa sobrecargada (no sin apoyo, sino con demasiado peso), el desmontaje se bloquea y se marca la pieza que fallar\xEDa.":"If dismantling a piece would overload another (not leave it unsupported, but carrying too much weight), the dismantling is blocked and the piece that would fail is marked.","Los muros que quedan debajo de un tejado se cierran solos hasta tocarlo, con su mismo material: ya no hace falta poner hastiales a mano (la pieza se ha quitado del men\xFA).":"Walls under a roof close up to it on their own, in the same material: gables no longer need to be placed by hand (the piece has been removed from the menu).","Cada tramo de tejado sube 1,2 m en sus 2 m. Tramos seguidos en la misma direcci\xF3n forman una sola pendiente continua; dos tramos enfrentados forman la cumbrera.":"Each roof section rises 1.2 m over its 2 m. Consecutive sections in the same direction form one continuous slope; two facing sections form the ridge.","Las piezas que no aguantan peso (cercas, empalizadas, medio muro) nunca cuentan como apoyo de otras. Un tramo de tejado solo puede sostener el tramo de tejado de al lado.":"Pieces that bear no weight (fences, palisades, half walls) never count as support for others. A roof section can only hold up the roof section next to it.","v4 (valravnx: \xABla madera es demasiado d\xE9bil\xBB): la madera aguanta bastante m\xE1s. Una casa de troncos de 2 plantas con tejado se hace sin trucos y sin pasar del 75% en ninguna pieza; 3 plantas piden cimiento de piedra; el zarzo no da para dos plantas.":"v4 (valravnx: \u201Cwood is too weak\u201D): wood now holds quite a lot more. A two-storey log house with a roof can be built without tricks and without any piece going over 75%; three storeys need a stone foundation; wattle can't carry two storeys.","v4: vano de una casilla. Un suelo en alto o un tramo de tejado sin muros debajo se apoya en el suelo o el tramo de al lado que s\xED los tenga. As\xED una casa de hasta 4\xD74 casillas no necesita vigas por dentro; de 5\xD75 en adelante, el centro s\xED.":"v4: one-cell span. A raised floor or roof section with no walls below rests on the neighbouring floor or section that does have them. So a house of up to 4\xD74 cells needs no beams inside; from 5\xD75 upwards, the centre does.","v4: lo que aguanta cada pieza (kg): cimiento de piedra 6000, de troncos 2000; muro de troncos 1200 (con puerta 850, con ventana 1000), entramado 1400, tablas 900 (con puerta 600), zarzo 250; poste 2000, viga 1000; suelo de troncos 900, de tablas 1000. Todo provisional, para que lo ajustes.":"v4: what each piece holds (kg): stone foundation 6000, log 2000; log wall 1200 (with doorway 850, with window 1000), timber frame 1400, planks 900 (with doorway 600), wattle 250; post 2000, beam 1000; log floor 900, plank floor 1000. All provisional, for you to adjust.","La decoraci\xF3n no suma peso a la estructura.":"Furnishings add no weight to the structure.","Escalera de mano: se usa con el bot\xF3n Usar para subir o bajar de planta si hay suelo arriba.":"Ladder: use it with the Use button to go up or down a floor if there's a floor above.","Los muros de troncos van en 10 hiladas de 25 cm: todos acaban a 2,5 m y sus troncos coinciden en altura. La puerta mide 2 m (8 hiladas) y la ventana va de 1 a 1,75 m.":"Log walls are laid in 10 courses of 25 cm: they all end at 2.5 m and their logs line up in height. The doorway is 2 m tall (8 courses) and the window runs from 1 to 1.75 m.","Las ventanas no tienen contraventana todav\xEDa.":"Windows don't have shutters yet.","La partida se guarda sola en el navegador (con bot\xF3n para reiniciar).":"The game saves itself in the browser (with a button to restart).","v2, por qu\xE9: en la v1 hab\xEDa que arrastrar el rat\xF3n para elegir el golpe y elegir tambi\xE9n la l\xEDnea de la parada, y la c\xE1mara y el movimiento iban a su aire. Se ha rehecho tomando lo que mejor funciona en los juegos de esgrima de referencia: rosa de golpes, parada perfecta, golpe maestro, contraataque, finta, parada sin direcci\xF3n en dificultad baja y peso f\xEDsico de los golpes.":"v2, why: in v1 you had to drag the mouse to choose the blow and also choose the parry line, and the camera and movement did their own thing. It has been redone taking what works best in reference fencing games: a rose of strikes, perfect parry, master strike, counterattack, feint, directionless parry at low difficulty and physical weight to the blows.","Atacar: sobre el rival aparece una rosa de cinco zonas (alto, izquierda, derecha, bajo y estocada en el centro). Apuntas con el cursor o tocas la zona y golpeas. Izquierda y derecha son las de tu pantalla.":"Attack: a rose of five zones appears over the opponent (high, left, right, low and thrust in the centre). You aim with the cursor or tap the zone and strike. Left and right are those of your screen.","Defensa en tres capas. Parada: mantener Parar detiene cualquier golpe sin elegir lado, pero cuesta aliento. Parada perfecta: empezar a parar en los \xFAltimos 0,25 s antes del impacto descoloca al rival 0,7 s y abre 0,8 s de contraataque.":"Defence in three layers. Parry: holding Parry stops any blow without choosing a side, but costs stamina. Perfect parry: starting to parry in the last 0.25 s before impact throws the opponent off balance for 0.7 s and opens 0.8 s for a counterattack.","El contraataque se prepara un 40% m\xE1s r\xE1pido y solo se para con otra parada perfecta.":"The counterattack winds up 40% faster and can only be stopped by another perfect parry.","Golpe maestro: si golpeas por el mismo lado por el que te viene el golpe durante la primera mitad de su preparaci\xF3n, desv\xEDas el suyo y el tuyo sale casi de inmediato (tambi\xE9n imparable salvo parada perfecta).":"Master strike: if you strike from the same side the blow is coming from during the first half of its wind-up, you deflect his and yours comes out almost at once (also unstoppable except by a perfect parry).","Finta: mientras preparas, elegir otra zona cambia el golpe, hasta el 60% de la preparaci\xF3n. Cuesta aliento. Sirve contra quien para demasiado pronto.":"Feint: while winding up, choosing another zone changes the blow, up to 60% of the wind-up. It costs stamina. It works against someone who parries too early.","Aliento: atacar, parar, fintar, mantener la parada y fallar golpes cansan. Por encima del 70% los golpes salen m\xE1s lentos; al 95% tu parada cede.":"Stamina: attacking, parrying, feinting, holding the parry and missing blows tire you. Above 70% blows come out slower; at 95% your parry gives way.","Dificultad = ritmo + ayudas. Aprendiz: golpes un 60% m\xE1s lentos y la rosa te ense\xF1a el lado del golpe que viene (rojo), cu\xE1ndo parar (verde) y cu\xE1ndo cabe el golpe maestro (borde dorado). Normal: un 25% m\xE1s lentos, solo ves el lado. Realista: velocidad real y sin avisos.":"Difficulty = pace + aids. Apprentice: blows 60% slower and the rose shows you the side of the incoming blow (red), when to parry (green) and when a master strike fits (golden edge). Normal: 25% slower, you only see the side. Realistic: real speed and no cues.","Movimiento encarado: cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean sin dejar de mirarle.":"Facing movement: near the opponent, forward and back close in or pull away, and the sides circle around him without looking away.","C\xE1mara con margen: solo se recoloca si el rival se sale bastante del encuadre, y te respeta 3 s despu\xE9s de que la gires t\xFA.":"Camera with slack: it only repositions if the opponent goes well out of frame, and leaves you alone for 3 s after you turn it yourself.","Peso de los golpes: pausa de 50 a 100 ms en cada choque, chispas al chocar aceros, sangre al herir, retroceso del golpeado, una sacudida leve de la c\xE1mara, estela de la hoja y sonidos sintetizados (se pueden quitar en Opciones).":"Weight of blows: a 50 to 100 ms pause on each clash, sparks when steel meets steel, blood on wounding, recoil of the one hit, a slight camera shake, a blade trail and synthesised sounds (they can be turned off in Options).","Las guardias de la v1 siguen en el c\xF3digo como modo avanzado pero no est\xE1n en el men\xFA: liaban m\xE1s de lo que aportaban en un primer contacto.":"The guards from v1 remain in the code as an advanced mode but are not in the menu: on first contact they confused more than they added.","Espada larga: tajo 1,9 m de alcance y 0,42 s de preparaci\xF3n a ritmo real; estocada 2,15 m y 0,32 s. Palo: 1,5 m, m\xE1s lento y contundente.":"Longsword: cut with 1.9 m reach and 0.42 s wind-up at real pace; thrust 2.15 m and 0.32 s. Staff: 1.5 m, slower and blunt.","Heridas por zona y gravedad (leve, grave, muy grave) sin barras de vida. Muy grave en la cabeza deja fuera de combate. El torso sangra mucho. Brazo de la espada herido: golpes m\xE1s lentos y flojos. Pierna herida: m\xE1s despacio y cojeando. Los cortes leves dejan de sangrar solos; los contundentes sangran poco pero aturden.":"Wounds by zone and severity (light, serious, critical) with no health bars. Critical to the head takes you out of the fight. The torso bleeds heavily. Wounded sword arm: slower, weaker blows. Wounded leg: slower and limping. Light cuts stop bleeding on their own; blunt blows bleed little but stun.","Armaduras: el gambes\xF3n reduce el tajo a la mitad; la malla casi lo anula, pero para peor la estocada y el golpe contundente.":"Armour: the gambeson halves a cut; mail almost cancels it, but stops thrusts and blunt blows less well.","v3, arreglo provisional del arco (pedido por valravnx tras probarlo): si sueltas por debajo de la mitad de tensi\xF3n el tiro se cancela sin disparar; echar a correr afloja el arco y no se puede empezar a tensar corriendo; despu\xE9s de cada disparo hay 0,8 s para sacar y encajar la siguiente flecha (0,5 s para coger otra piedra). Antes se pod\xEDa correr y disparar sin parar.":"v3, provisional bow fix (requested by valravnx after trying it): releasing below half draw cancels the shot without firing; breaking into a run eases the bow and you can't start drawing while running; after each shot there are 0.8 s to draw and nock the next arrow (0.5 s to pick up another stone). Before, you could run and shoot non-stop.","v4, escudo PROVISIONAL (pedido por valravnx; lo revisar\xE1 \xE9l): nueva arma \xABEspada y escudo\xBB. Espada de una mano: 1,7 m de alcance (la larga 1,9), estocada 1,9 m, se prepara algo m\xE1s r\xE1pido (0,38 s) y hiere algo menos. Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante.":"v4, PROVISIONAL shield (requested by valravnx; he will review it): new weapon \u201CSword and shield\u201D. One-handed sword: 1.7 m reach (longsword 1.9), thrust 1.9 m, winds up a little faster (0.38 s) and wounds a little less. Round plank shield with a leather rim and a boss, on the left arm; when parrying it rises in front.","v4: con escudo, Parar tambi\xE9n detiene flechas y piedras que vengan de frente (70\xB0 a cada lado de donde miras); por la espalda o de lado no. Parar con escudo cuesta un 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"v4: with a shield, Parry also stops arrows and stones coming from the front (70\xB0 to each side of where you face); from behind or the side it doesn't. Parrying with a shield costs 60% of the stamina it costs with the sword. The perfect parry and master strike work the same.","v4: nueva opci\xF3n \xABArma del rival\xBB (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"v4: new option \u201COpponent's weapon\u201D (same as yours, longsword, sword and shield or staff). An opponent with a shield raises it when you aim at him with a bow or sling and keeps it up while you reload.","Arco: tensar del todo tarda 1 s. El c\xEDrculo de punter\xEDa se cierra al tensar y se pone verde cuando est\xE1 a plena tensi\xF3n; si sueltas antes, la flecha se queda corta. A partir de 2,5 s tenso, el pulso tiembla y el c\xEDrculo se abre en rojo. Las flechas no se paran con la espada; con escudo, s\xED (v4).":"Bow: a full draw takes 1 s. The aiming circle closes as you draw and turns green at full draw; if you release earlier, the arrow falls short. After 2.5 s at full draw your hand shakes and the circle opens in red. Arrows can't be parried with the sword; with a shield, they can (v4).","El rival de la m\xE1quina tarda en reaccionar y seg\xFAn la dificultad lee mejor tus golpes, intenta paradas perfectas, golpes maestros y fintas. Se queda quieto mientras golpea y a veces retrocede despu\xE9s. Tu cinta es azul y la suya amarilla.":"The computer opponent takes time to react and, depending on difficulty, reads your blows better and tries perfect parries, master strikes and feints. He stands still while striking and sometimes steps back afterwards. Your band is blue and his is yellow.","Textos de la interfaz en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"Interface texts in Spanish and English (button at the top right); Russian is prepared and will come later.","Hito 1 \xB7 v5":"Milestone 1 \xB7 v5","Combate \xB7 v5":"Combat \xB7 v5","v5: textos en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"v5: texts in Spanish and English (button at the top right); Russian is prepared and will come later.","Quedan para m\xE1s adelante: adarve, chimenea y puentes (los puentes necesitan agua en el mapa).":"Left for later: wall walk, chimney and bridges (bridges need water on the map).","Hito 1 \xB7 v6":"Milestone 1 \xB7 v6","Escalera de tablas":"Plank stairs","La escalera de tablas sube a la planta de arriba: en la \xFAltima no cabe.":"Plank stairs go up to the floor above: they don't fit on the top floor.","Encima de la escalera tiene que quedar el hueco abierto: quita ese suelo.":"The opening above the stairs must stay open: remove that floor.","Ah\xED est\xE1 el hueco de una escalera.":"That's the opening of a staircase.","v6: escalera de tablas (6 tablas y 6 clavos, 100 kg). Ocupa una casilla y se sube andando, sin bot\xF3n: se entra por el lado bajo y se sale arriba a la casilla de al lado (gira con R hacia d\xF3nde sube). Encima tiene que quedar el hueco abierto, as\xED que no deja poner suelo ah\xED. Necesita cimiento o suelo debajo, o la tierra en la planta baja.":"v6: plank stairs (6 planks and 6 nails, 100 kg). They take one tile and you climb them by walking, no button: you step in on the low side and come out at the top onto the next tile (rotate with R to choose which way they rise). The opening above must stay open, so no floor can go there. They need a foundation or floor below, or bare ground on the ground floor.","v6: por el hueco de la escalera se puede caer a ella desde arriba; las barandillas para cerrarlo llegan en la tarea siguiente. Por debajo del tramo alto se puede pasar sin subir.":"v6: you can drop down onto the stairs through their opening from above; railings to close it come in the next task. You can walk under the high end without climbing.","v7: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). La escena no cambia.":"v7: also in English, with the ES/EN button at the top as in building and combat (it remembers the chosen language, including the website's). The scene is unchanged.","v10: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). El personaje no cambia.":"v10: also in English, with the ES/EN button at the top as in building and combat (it remembers the chosen language, including the website's). The character is unchanged.","Prueba de estilo \xB7 v7 (realismo en miniatura, con el personaje por c\xF3digo; tambi\xE9n en ingl\xE9s)":"Style test \xB7 v7 (miniature realism, with the code-made character; also in English)","Personaje \xB7 v10 (taller propio con MakeHuman, ropa por capas y armadura; tambi\xE9n en ingl\xE9s)":"Character \xB7 v10 (our own workshop with MakeHuman, layered clothing and armour; also in English)","v6, el personaje: hecho todo por c\xF3digo, como decidiste. Es una sola malla continua (sin piezas sueltas ni juntas): el cuerpo se describe como una suma suave de formas (cr\xE1neo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas, pies) y se convierte en malla, con m\xE1s detalle en la cara y las manos.":"v6, the character: made entirely in code, as you decided. It is a single continuous mesh (no loose pieces or seams): the body is described as a smooth sum of shapes (skull, face, nose, brows, ears, torso, arms, hands with thumbs, legs, feet) and turned into a mesh, with more detail in the face and hands.","Lleva esqueleto de 17 huesos y dos animaciones hechas por c\xF3digo: quieto (respira y se balancea un poco) y andar (bot\xF3n \xABQuieto/Andando\xBB: va y viene por el camino). Las vistas \xABPersonaje\xBB y \xABCara\xBB le siguen.":"It has a 17-bone skeleton and two code-made animations: idle (breathes and sways a little) and walk (\xABIdle/Walking\xBB button: goes back and forth along the path). The \xABCharacter\xBB and \xABFace\xBB views follow him.","Proporciones cre\xEDbles algo estilizadas: 1,72 m, cabeza un poco grande (1/7 de la altura) para que se lea en miniatura. Hombre adulto con barba corta.":"Believable, slightly stylised proportions: 1.72 m, head a little large (1/7 of the height) so it reads in miniature. Adult man with a short beard.","Ropa base pintada en la misma malla, provisional: camisa de lino, cintur\xF3n de cuero (con relieve), calzas de lana y zapatos. La ropa y la armadura por capas, que se ven puestas, son una tarea aparte.":"Base clothing painted on the same mesh, provisional: linen shirt, leather belt (with relief), woollen hose and shoes. Layered clothing and armour, visibly worn, are a separate task.","Colores apagados, oclusi\xF3n ambiental horneada (pliegues, axilas y entre las piernas m\xE1s oscuros) y ojos con un peque\xF1o brillo.":"Muted colours, baked ambient occlusion (folds, armpits and between the legs darker) and eyes with a small highlight.","Pendiente de mejorar, a la vista en las capturas de cerca: el pelo es un casquete liso, la cara a\xFAn es tosca de cerca y los bordes de color (cuello de la camisa, barba) son algo borrosos.":"Still to improve, visible in the close-up screenshots: the hair is a smooth cap, the face is still rough up close and the colour edges (shirt collar, beard) are somewhat blurry.","Presupuesto: el personaje son unos 10 mil tri\xE1ngulos (unos 20 mil con su sombra). El l\xEDmite de la escena sube de 50 mil a 72 mil. No comprobado en un m\xF3vil de verdad.":"Budget: the character is about 10 thousand triangles (about 20 thousand with its shadow). The scene limit goes up from 50 thousand to 72 thousand. Not checked on a real phone.","v5: copas de los \xE1rboles en racimos suaves y pinos con puntas. v4: texturas por c\xF3digo y mundo sin recortar. Se mantienen.":"v5: tree crowns in soft clusters and pointed pines. v4: code-made textures and an uncropped world. Both are kept.","Puedes girar la c\xE1mara arrastrando (un dedo en el m\xF3vil) y acercarte con la rueda o pellizcando.":"You can rotate the camera by dragging (one finger on a phone) and zoom with the wheel or by pinching.","v2, por qu\xE9: el personaje esculpido por c\xF3digo de la v1 daba grima. valravnx: nada de inventos, usar bases ya hechas. Se usan los paquetes libres (CC0, se pueden usar y vender sin pagar ni citar) de Quaternius: Universal Base Characters, Modular Character Outfits \u2013 Fantasy y Universal Animation Library. Licencias junto a los modelos, en recursos/personajes/v1/ de la web.":"v2, why: the code-sculpted character of v1 was creepy. valravnx: no inventions, use ready-made bases. The free packs (CC0: they can be used and sold without paying or crediting) by Quaternius are used: Universal Base Characters, Modular Character Outfits \u2013 Fantasy and Universal Animation Library. Licences next to the models, in recursos/personajes/v1/ on the website.","C\xF3mo se monta: de la base se usa solo la cabeza y el cuello (el resto lo tapa la ropa, como indica el propio paquete), m\xE1s la ropa, el pelo y la barba. Todo comparte el mismo esqueleto de 65 huesos, as\xED que la ropa y las armaduras que vengan despu\xE9s se ponen y se quitan como capas.":"How it is assembled: only the head and neck of the base are used (the clothing covers the rest, as the pack itself suggests), plus the clothing, hair and beard. Everything shares the same 65-bone skeleton, so clothing and armour added later are put on and taken off as layers.","Personalizaci\xF3n de prueba: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo, tono de piel y barba. El color de piel y de pelo se ti\xF1e sobre las texturas del paquete.":"Test customisation: man or woman, peasant or explorer clothing, hairstyle, hair colour, skin tone and beard. Skin and hair colour are tinted over the pack's textures.","Animaciones del paquete (no hechas a mano): quieto, andar, talar, en guardia, golpe de espada y andar cargando, entre otras 26.":"Animations from the pack (not hand-made): idle, walk, chop, on guard, sword strike and walk carrying, among 26 others.","Texturas reducidas para el navegador: 1024 px el color y 512 el relieve. Un personaje pesa unos 4 MB la primera vez (pelo, cabeza, ropa) m\xE1s 4,4 MB de animaciones compartidas por todos.":"Textures reduced for the browser: 1024 px for colour and 512 for relief. A character weighs about 4 MB the first time (hair, head, clothing) plus 4.4 MB of animations shared by all.","v3: en el m\xF3vil iba a 10 fps. Cambios: en pantallas t\xE1ctiles empieza en calidad \xABligera\xBB (material sencillo con el color, sin relieve ni brillo), resoluci\xF3n de partida 1\xD7 y puede bajar hasta 0,5\xD7; la ropa, el pelo y la barba comparten un solo esqueleto (antes cada malla calculaba el suyo).":"v3: it ran at 10 fps on the phone. Changes: on touch screens it starts in \xABlight\xBB quality (simple material with colour, no relief or shine), starting resolution 1\xD7 and it can drop to 0.5\xD7; clothing, hair and beard share a single skeleton (before, each mesh computed its own).","v3: interruptores de prueba de rendimiento (calidad, sombras, caba\xF1a y suelo) para ver en tu m\xF3vil qu\xE9 es lo que pesa, mirando los fps de arriba.":"v3: performance test switches (quality, shadows, hut and ground) to see on your phone what is heavy, watching the fps at the top.","v3: el traje de explorador ya no se ofrece: es demasiado de fantas\xEDa. Se buscan ropas de recreaci\xF3n hist\xF3rica.":"v3: the explorer outfit is no longer offered: it is too fantasy. Historical reenactment clothing is being sought.","v4: correcci\xF3n. \xABMe va de 10\xBB era que va perfecto, no 10 fps: vuelve la calidad alta por defecto tambi\xE9n en el m\xF3vil, con la resoluci\xF3n de antes. La calidad ligera y los interruptores siguen como opci\xF3n.":"v4: correction. \xABIt runs a 10\xBB meant it runs perfectly, not 10 fps: high quality is the default again on phones too, with the previous resolution. Light quality and the switches remain as options.","v5: nueva opci\xF3n \xABBase del personaje\xBB: adem\xE1s del paquete de Quaternius, el taller propio. El cuerpo es de MakeHuman (libre, CC0) y la ropa, el pelo, la barba, la cofia, la piel y los ojos est\xE1n hechos por c\xF3digo en el proyecto, sin paquetes de fuera. As\xED se puede hacer la ropa que queramos.":"v5: new \xABCharacter base\xBB option: besides the Quaternius pack, our own workshop. The body comes from MakeHuman (free, CC0) and the clothing, hair, beard, coif, skin and eyes are made in code in the project, without outside packs. That way we can make whatever clothing we want.","v5: el taller propio usa las mismas animaciones de Quaternius, pasadas a su esqueleto: el reposo de MakeHuman (brazos en \xABA\xBB) se lleva a la postura del origen y en cada fotograma se copia el giro de cada hueso respecto a su reposo. La pelvis copia adem\xE1s los botes y agachadas, escalados por la altura.":"v5: our own workshop uses the same Quaternius animations, retargeted to its skeleton: the MakeHuman rest pose (arms in an \xABA\xBB) is brought to the source pose, and on every frame each bone's rotation relative to its rest is copied. The pelvis also copies bounces and crouches, scaled by height.","v5, provisional: en el taller propio solo hay un hombre (t\xFAnica, calzas, barba pintada) y una mujer (vestido y cofia con toca); el pelo, la piel y la ropa a\xFAn no se pueden cambiar. valravnx: \xABdecente para usar de placeholder\xBB. Queda una claridad en la barbilla del hombre.":"v5, provisional: our own workshop only has a man (tunic, hose, painted beard) and a woman (dress and coif with veil); hair, skin and clothing cannot be changed yet. valravnx: \xABdecent to use as a placeholder\xBB. A light patch remains on the man's chin.","v6, arreglo: en calidad alta la ropa, el pelo y la cofia del taller propio se ve\xEDan del rev\xE9s (valravnx). El cargador de modelos deja sin escribir la profundidad en los materiales con transparencia, y la piel se pintaba encima. Ahora la escriben, y una prueba nueva lo vigila.":"v6, fix: in high quality the clothing, hair and coif from our own workshop looked inside out (valravnx). The model loader leaves depth unwritten on materials with transparency, and the skin was drawn on top. Now they write it, and a new test watches for it.","v7, taller propio (valravnx: \xABel hombre tiene tetas, el cuerpo doblado hacia delante, los hombros muy para atr\xE1s\xBB): las animaciones del paquete van con el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atr\xE1s, a juego con sus mu\xF1ecos de cabeza grande. Ahora se mide esa inclinaci\xF3n en la animaci\xF3n de estar quieto y se quita (deja un 30 %), los hombros ya no se igualan al paquete y los brazos se giran para colgar rectos. La t\xFAnica del hombre se alisa en el pecho para que caiga como tela y no marque.":"v7, our own workshop (valravnx: \xABthe man has breasts, the body bent forward, the shoulders too far back\xBB): the pack's animations have the torso and neck leaning forward and the arms hanging backwards, to suit its big-headed figures. Now that lean is measured in the idle animation and removed (30 % is kept), the shoulders are no longer matched to the pack and the arms are rotated to hang straight. The man's tunic is smoothed over the chest so it falls like cloth and does not cling.","v8: valravnx elige el taller propio como base de los personajes. Primera tanda de ropa por capas, hecha por c\xF3digo: debajo siempre la camisa de lino (en la mujer, larga hasta los tobillos), las calzas y los zapatos; encima, t\xFAnica (hombre) o vestido (mujer), y sobre todo el gambes\xF3n acolchado, con sus canales cosidos pintados. Cada capa va algo m\xE1s separada de la piel que la de debajo.":"v8: valravnx chooses our own workshop as the base for characters. First batch of layered clothing, made in code: underneath always the linen shirt (ankle-length on the woman), the hose and the shoes; over them, a tunic (man) or dress (woman), and over everything the padded gambeson, with its stitched channels painted. Each layer sits a little further from the skin than the one below.","v8, c\xF3mo se ven las capas: lo que queda tapado del todo no se dibuja (el cuerpo de una prenda se esconde si lleva otra encima, y su falda solo asoma si es m\xE1s larga), as\xED no se atraviesan al moverse y se ahorran tri\xE1ngulos. El cintur\xF3n va sobre la capa de m\xE1s fuera.":"v8, how layers are shown: whatever is fully covered is not drawn (a garment's body is hidden if another one is on top, and its skirt only shows if it is longer), so they don't poke through when moving and triangles are saved. The belt goes over the outermost layer.","v9: cota de malla (hasta la rodilla, mangas hasta medio antebrazo; anillas pintadas por c\xF3digo, metal a medias porque sin reflejos del entorno el metal puro sale negro) y sobreveste sin mangas de lana te\xF1ida, por encima de todo. Cada prenda va partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota.":"v9: mail hauberk (knee-length, sleeves to mid-forearm; rings painted in code, half-metallic because without environment reflections pure metal looks black) and a sleeveless surcoat of dyed wool, over everything. Each garment is split into body, sleeves and skirt: the surcoat lets the hauberk's sleeves and collar show.","Pendiente de decidir contigo: si el estilo de estas bases te vale como punto de partida para todo el juego (incluido el combate), y qu\xE9 ropa medieval falta (gambes\xF3n, cota de malla, capas).":"To decide with you: whether the style of these bases works as a starting point for the whole game (combat included), and what medieval clothing is missing (gambeson, mail hauberk, cloaks).","Paquete Quaternius":"Quaternius pack","Taller propio (MakeHuman)":"Own workshop (MakeHuman)",T\u00FAnica:"Tunic",Vestido:"Dress",Sobreveste:"Surcoat",Quieto:"Idle",Andar:"Walk",Correr:"Run",Talar:"Chop","En guardia":"On guard",Golpe:"Strike",Cargar:"Carry",Hombre:"Man",Mujer:"Woman",Campesino:"Peasant",Explorador:"Explorer","Raya al lado":"Side parting",Rapado:"Shaved",Largo:"Long",Mo\u00F1o:"Bun",Negro:"Black",Casta\u00F1o:"Brown","Casta\xF1o claro":"Light brown",Rubio:"Blond",Pelirrojo:"Red",Canoso:"Grey",Clara:"Light",Media:"Medium",Morena:"Tan",Oscura:"Dark","Con barba":"Bearded","Sin barba":"Clean-shaven",Andando:"Walking","{f} fps \xB7 resoluci\xF3n {r}\xD7 \xB7 {t} mil tri\xE1ngulos \xB7 {d} dibujados":"{f} fps \xB7 resolution {r}\xD7 \xB7 {t}k triangles \xB7 {d} draw calls","{f} fps \xB7 resoluci\xF3n {r}\xD7 \xB7 personaje {p} mil tri\xE1ngulos \xB7 escena {t} mil \xB7 {d} dibujados":"{f} fps \xB7 resolution {r}\xD7 \xB7 character {p}k triangles \xB7 scene {t}k \xB7 {d} draw calls","Ropa por capas (debajo siempre camisa, calzas y zapatos)":"Layered clothing (always a shirt, hose and shoes underneath)","Ropa por capas (debajo siempre camisa y zapatos)":"Layered clothing (always a shirt and shoes underneath)","Taller propio: pelo, piel y cara a\xFAn no se cambian.":"Own workshop: hair, skin and face can't be changed yet.","Prueba de rendimiento (mira los fps arriba)":"Performance test (watch the fps at the top)",Sombras:"Shadows","Caba\xF1a y suelo":"Hut and ground",Animaci\u00F3n:"Animation","No se pudo cargar el personaje: {e}":"Could not load the character: {e}","Base del personaje":"Character base",Cuerpo:"Body",Ropa:"Clothing",Pelo:"Hair","Color del pelo":"Hair colour",Piel:"Skin",Barba:"Beard",Calidad:"Quality",Alta:"High","Ligera (m\xF3vil)":"Light (phone)",Ma\u00F1ana:"Morning",Tarde:"Afternoon",Desenfoque:"Blur",General:"Overview",Caba\u00F1a:"Hut",Lado:"Side",Personaje:"Character",Cara:"Face",Notas:"Notes","midiendo\u2026":"measuring\u2026",Personalizar:"Customise",Perfil:"Profile",Espalda:"Back","Cargando personaje\u2026":"Loading character\u2026","Kinhold Estilo":"Kinhold Style","Kinhold Personaje":"Kinhold Character","Textos de la interfaz en espa\xF1ol, ingl\xE9s y ruso (botones arriba a la derecha; en el m\xF3vil, un desplegable con el idioma).":"Interface text in Spanish, English and Russian (buttons at the top right; on mobile, a drop-down with the language).","v6: tambi\xE9n en ruso; en el m\xF3vil, el idioma se elige en un desplegable.":"v6: also in Russian; on mobile, the language is chosen from a drop-down.","Prueba de estilo \xB7 v8 (realismo en miniatura, con el personaje por c\xF3digo; tambi\xE9n en ingl\xE9s y en ruso)":"Style test \xB7 v8 (miniature realism, with the code-made character; also in English and Russian)","Personaje \xB7 v11 (taller propio con MakeHuman, ropa por capas y armadura; tambi\xE9n en ingl\xE9s y en ruso)":"Character \xB7 v11 (own workshop with MakeHuman, layered clothing and armour; also in English and Russian)","Acci\xF3n no v\xE1lida.":"Invalid action.","Acci\xF3n sin autor.":"Action without an author.","Acci\xF3n desconocida.":"Unknown action.","Datos no v\xE1lidos.":"Invalid data.","Eso no se abre.":"That does not open.","Cantidad no v\xE1lida.":"Invalid amount.","El autor no est\xE1 en el combate.":"The author is not in the fight.","El autor est\xE1 fuera de combate.":"The author is out of the fight.","El objetivo no est\xE1 en el combate.":"The target is not in the fight.","Toda acci\xF3n que cambia el mundo (moj\xF3n, colocar, desmontar, muebles, abrir puertas) es un mensaje con autor que la l\xF3gica comprueba y anota; mientras no haya cuentas, el autor es \xABjugador:local\xBB y el registro vive solo en memoria durante la partida (el guardado no cambia).":"Every action that changes the world (boundary stone, placing, dismantling, furniture, opening doors) is a message with an author that the logic checks and records; until there are accounts, the author is \u201Cjugador:local\u201D and the log lives only in memory during the game (the save does not change).","Prueba de estilo \xB7 v9 (realismo en miniatura; sin el mu\xF1eco por c\xF3digo)":"Style test \xB7 v9 (miniature realism; without the code-made figure)","v9: se quita el mu\xF1eco hecho por c\xF3digo de la v6 (y sus vistas \xABPersonaje\xBB y \xABCara\xBB y el bot\xF3n \xABQuieto/Andando\xBB): los personajes salen ahora del taller y se ven en el visor de personaje. La escena no cambia; su l\xEDmite vuelve a 50 mil tri\xE1ngulos.":"v9: the code-made figure from v6 is removed (along with its \xABCharacter\xBB and \xABFace\xBB views and the \xABStanding/Walking\xBB button): characters now come from the workshop and are shown in the character viewer. The scene does not change; its limit goes back to 50 thousand triangles.","v7: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web).":"v7: also in English, with the ES/EN button at the top as in building and combat (it remembers the chosen language, the website's too).","Hito 1 \xB7 v9":"Milestone 1 \xB7 v9","Combate \xB7 v7":"Combat \xB7 v7","v9: escena com\xFAn del estilo elegido (src/mundo/): mismo cielo, sol, sombras blandas, niebla, suelo con textura, bosque, hierba, flores y rocas que la prueba de estilo. La hierba empieza a 16 m de la salida, porque dentro se construye y asomar\xEDa por los cimientos (provisional, hasta que la hierba se aparte sola bajo lo construido).":"v9: shared scene in the chosen style (src/mundo/): the same sky, sun, soft shadows, fog, textured ground, forest, grass, flowers and rocks as the style test. Grass starts 16 m from the starting point, because building happens inside that area and it would poke through the foundations (provisional, until grass clears itself under what is built).","v7: escena com\xFAn del estilo elegido (src/mundo/): mismo cielo, sol, sombras blandas, niebla, suelo con textura, bosque, hierba, flores y rocas que la prueba de estilo, con la liza de tierra pisada en el centro.":"v7: shared scene in the chosen style (src/mundo/): the same sky, sun, soft shadows, fog, textured ground, forest, grass, flowers and rocks as the style test, with a trodden-earth fighting ground in the middle.","Hito 1 \xB7 v10":"Milestone 1 \xB7 v10","Talas el \xE1rbol (de momento solo el gesto: la madera llega con la recolecci\xF3n).":"You fell the tree (just the motion for now: wood comes with gathering).","v10: el jugador es el personaje del taller propio (el de MakeHuman vestido por c\xF3digo), con camisa y calzas de lino, como se empieza seg\xFAn el GDD. Lleva zapatos aunque el GDD dice descalzo: el cuerpo del taller no tiene pies bajo los zapatos y sin ellos se ver\xEDa sin pies (queda como tarea del taller). Anda, corre y tala con las animaciones de Quaternius, que se aceleran con la velocidad hasta 1,6\xD7 (a la carrera los pies resbalan algo: el juego va m\xE1s r\xE1pido que la animaci\xF3n). Mientras carga se ve el mu\xF1eco de antes.":"v10: the player is the character from our own workshop (the MakeHuman body dressed by code), in a linen shirt and hose, as the GDD says you start. They wear shoes although the GDD says barefoot: the workshop body has no feet under the shoes, and without them it would look footless (left as a workshop task). They walk, run and chop with the Quaternius animations, which speed up with movement up to 1.6\xD7 (when running the feet slide a little: the game moves faster than the animation). While it loads, the old dummy is shown.","Combate \xB7 v8":"Combat \xB7 v8","v8: los dos luchadores son el personaje del taller propio (MakeHuman vestido por capas). La armadura del duelo son las capas del taller: lino = camisa y calzas, gambes\xF3n = gambes\xF3n, cota de malla = cota encima del gambes\xF3n. Mientras carga se ve el mu\xF1eco de antes.":"v8: both fighters are the in-house workshop character (MakeHuman dressed in layers). The duel armour is the workshop layers: linen = shirt and hose, gambeson = gambeson, mail = mail shirt over the gambeson. While it loads, the old mannequin is shown.","v8: las piernas y el cuerpo van con las animaciones del taller (guardia de espada quieto, andar y correr); los brazos se colocan cada fotograma con cinem\xE1tica inversa para que las manos agarren el arma donde la ponen las poses de siempre. Si el brazo no llega (estocada a fondo), el arma se queda en la mano en vez de flotar. La mano izquierda copia el pu\xF1o cerrado de la derecha. Los golpes siguen siendo los de antes; los de las cinco direcciones con animaci\xF3n propia son otra tarea del duelo.":"v8: legs and body use the workshop animations (sword guard when standing still, walk and run); the arms are placed every frame with inverse kinematics so the hands grip the weapon where the usual poses put it. If the arm cannot reach (full thrust), the weapon stays in the hand instead of floating. The left hand copies the closed fist of the right. The strikes are still the previous ones; the five-direction strikes with their own animation are another duel task.","v8: las heridas se pintan como antes (mancha de sangre o morat\xF3n, m\xE1s grande cuanto m\xE1s grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, as\xED que siguen al personaje al moverse. Las dos figuras son el hombre del taller; las distingue la cinta (azul la tuya, amarilla la del rival). Cojear ya no se ve: lo hac\xEDa el mu\xF1eco y las animaciones del taller no lo traen.":"v8: wounds are painted as before (a blood stain or bruise, bigger the more serious), but stuck to the surface of the body or the clothes where the blow lands and hung from the bone, so they follow the character as it moves. Both figures are the workshop man; the ribbon tells them apart (yours blue, the opponent's yellow). Limping is no longer visible: the mannequin did it and the workshop animations do not include it.",Men\u00FA:"Menu",KINHOLD:"KINHOLD","Demo: supervivencia medieval. Elige qu\xE9 quieres probar.":"Demo: medieval survival. Choose what you want to try.","Levanta una caba\xF1a: cimientos, suelos, muros, tejados y muebles.":"Raise a hut: foundations, floors, walls, roofs and furniture.","Combate de habilidad con espada o palo, pr\xE1cticas y carga a distancia.":"Skill-based combat with sword or staff, practice and charge from a distance.","Elige cuerpo y ropa por capas: es el que construye y el que lucha.":"Choose body and layered clothing: this is who builds and who fights.","Progreso del proyecto":"Project progress","A\xFAn no has elegido personaje: hombre con camisa y calzas de lino.":"No character chosen yet: a man in a linen shirt and hose.","Tu personaje: {s}, con {r}.":"Your character: {s}, wearing {r}.",mujer:"woman",hombre:"man","camisa y calzas":"shirt and hose","Demo \xFAnica \xB7 v1 (Construir, Duelo y Personaje en una sola p\xE1gina)":"Single demo \xB7 v1 (Build, Duel and Character on one page)","v1: una sola p\xE1gina con men\xFA: Construir, Duelo y Personaje. Cada parte es el \xFAltimo prototipo de cada cosa (construcci\xF3n v10, combate v8, personaje v11), con la misma escena y el mismo personaje del taller. Las versiones antiguas de cada prototipo siguen en la web.":"v1: a single page with a menu: Build, Duel and Character. Each part is the latest prototype of each thing (building v10, combat v8, character v11), with the same scene and the same workshop character. The old versions of each prototype stay on the website.","v1, c\xF3mo se cambia de parte: el bot\xF3n \xABMen\xFA\xBB de arriba vuelve al men\xFA y la p\xE1gina se recarga. As\xED cada parte empieza limpia y en el m\xF3vil nunca hay dos escenas a la vez gastando memoria. Lo construido, las opciones del duelo y el personaje se guardan en el navegador y siguen ah\xED al volver.":"v1, how you switch parts: the \xABMenu\xBB button at the top goes back to the menu and the page reloads. That way each part starts clean and a phone never has two scenes using memory at once. What you built, the duel options and the character are saved in the browser and are still there when you come back.","v1: el personaje que eliges en \xABPersonaje\xBB (hombre o mujer y su ropa por capas) es el que construye y el que lucha. Por ahora el taller solo cambia el cuerpo y la ropa; pelo, piel y cara vendr\xE1n con la personalizaci\xF3n.":"v1: the character you choose in \xABCharacter\xBB (man or woman and their layered clothing) is the one who builds and fights. For now the workshop only changes the body and the clothing; hair, skin and face will come with customisation.","v1, provisional: si nunca has elegido personaje, en la construcci\xF3n sales con camisa y calzas de lino, como empieza el GDD. Si lo has elegido, sales con la ropa que elegiste (aunque sea una cota de malla): es una demo para ver el personaje en todo, no la partida de supervivencia.":"v1, provisional: if you have never chosen a character, in building you start with a linen shirt and hose, as the GDD says. If you have chosen one, you start with the clothes you chose (even a mail shirt): this is a demo to see the character everywhere, not the survival game.","v1, provisional: en el duelo manda la armadura elegida en sus opciones, porque lo que se ve es lo que protege. Con \xABlino\xBB llevas tu ropa sin gambes\xF3n ni cota; con gambes\xF3n o cota, esas piezas y, si la elegiste, la sobreveste encima. El rival sigue siendo el hombre de siempre.":"v1, provisional: in the duel the armour chosen in its options rules, because what you see is what protects you. With \xABlinen\xBB you wear your clothes without gambeson or mail; with gambeson or mail, those pieces and, if you chose it, the surcoat on top. The opponent is still the usual man.",Rendimiento:"Performance","{f} fps":"{f} fps","este navegador no la dice":"this browser does not report it","{n} MB":"{n} MB",Fotogramas:"Frames","{f} por segundo":"{f} per second","Cada fotograma":"Each frame","{m} ms de media; el m\xE1s lento, {p} ms":"{m} ms on average; the slowest, {p} ms",Reso
