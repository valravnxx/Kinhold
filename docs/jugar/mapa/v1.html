madera, postes, largueros y cabecero de tablas, colch\xF3n y almohada de lino y manta. La mesa, tres tablas sobre dos caballetes; el banco, como el de la prueba; el taburete, una rodaja con tres patas abiertas; el arc\xF3n, tablas con flejes, clavos y cerradura de hierro; el barril, duelas abombadas con dos aros; la estanter\xEDa, con trasera de tablas, vasijas de barro, un cuenco y un rollo de pa\xF1o; la antorcha de pie, una vara entre piedras con un cesto de hierro y estopa; la alfombra, una piel curtida con su forma; el estandarte, un pa\xF1o con pliegues, dos puntas y una banda.":"v18: \u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5). \u0421\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0441\u0442\u0435\u043B\u044C \u2014 \u0440\u0430\u043C\u0430 \u0438\u0437 \u0431\u0440\u0451\u0432\u0435\u043D \u0441 \u043E\u0445\u0430\u043F\u043A\u043E\u0439 \u0441\u043E\u043B\u043E\u043C\u044B, \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0442\u044E\u0444\u044F\u043A \u0438 \u0448\u0435\u0440\u0441\u0442\u044F\u043D\u043E\u0435 \u043E\u0434\u0435\u044F\u043B\u043E; \u0434\u0435\u0440\u0435\u0432\u044F\u043D\u043D\u0430\u044F \u043A\u0440\u043E\u0432\u0430\u0442\u044C \u2014 \u0441\u0442\u043E\u043B\u0431\u0438\u043A\u0438, \u0431\u043E\u043A\u043E\u0432\u0438\u043D\u044B \u0438 \u0434\u043E\u0449\u0430\u0442\u043E\u0435 \u0438\u0437\u0433\u043E\u043B\u043E\u0432\u044C\u0435, \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u043C\u0430\u0442\u0440\u0430\u0441, \u043F\u043E\u0434\u0443\u0448\u043A\u0430 \u0438 \u043E\u0434\u0435\u044F\u043B\u043E. \u0421\u0442\u043E\u043B \u2014 \u0442\u0440\u0438 \u0434\u043E\u0441\u043A\u0438 \u043D\u0430 \u0434\u0432\u0443\u0445 \u043A\u043E\u0437\u043B\u0430\u0445; \u0441\u043A\u0430\u043C\u044C\u044F \u2014 \u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435; \u0442\u0430\u0431\u0443\u0440\u0435\u0442 \u2014 \u0441\u043F\u0438\u043B \u0431\u0440\u0435\u0432\u043D\u0430 \u043D\u0430 \u0442\u0440\u0451\u0445 \u0440\u0430\u0441\u0442\u043E\u043F\u044B\u0440\u0435\u043D\u043D\u044B\u0445 \u043D\u043E\u0436\u043A\u0430\u0445; \u0441\u0443\u043D\u0434\u0443\u043A \u2014 \u0434\u043E\u0441\u043A\u0438 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u043C\u0438 \u043F\u043E\u043B\u043E\u0441\u0430\u043C\u0438, \u0433\u0432\u043E\u0437\u0434\u044F\u043C\u0438 \u0438 \u0437\u0430\u043C\u043A\u043E\u043C; \u0431\u043E\u0447\u043A\u0430 \u2014 \u0432\u044B\u043F\u0443\u043A\u043B\u044B\u0435 \u043A\u043B\u0451\u043F\u043A\u0438 \u0438 \u0434\u0432\u0430 \u043E\u0431\u0440\u0443\u0447\u0430; \u043F\u043E\u043B\u043A\u0430 \u2014 \u0441 \u0434\u043E\u0449\u0430\u0442\u043E\u0439 \u0437\u0430\u0434\u043D\u0435\u0439 \u0441\u0442\u0435\u043D\u043A\u043E\u0439, \u0433\u043B\u0438\u043D\u044F\u043D\u044B\u043C\u0438 \u0433\u043E\u0440\u0448\u043A\u0430\u043C\u0438, \u043C\u0438\u0441\u043A\u043E\u0439 \u0438 \u0441\u0432\u0451\u0440\u0442\u043A\u043E\u043C \u0442\u043A\u0430\u043D\u0438; \u043D\u0430\u043F\u043E\u043B\u044C\u043D\u044B\u0439 \u0444\u0430\u043A\u0435\u043B \u2014 \u0448\u0435\u0441\u0442 \u0441\u0440\u0435\u0434\u0438 \u043A\u0430\u043C\u043D\u0435\u0439 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u043E\u0439 \u043A\u043E\u0440\u0437\u0438\u043D\u043A\u043E\u0439 \u0438 \u043F\u0430\u043A\u043B\u0435\u0439; \u043A\u043E\u0432\u0451\u0440 \u2014 \u0432\u044B\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u0448\u043A\u0443\u0440\u0430 \u0441\u043E \u0441\u0432\u043E\u0435\u0439 \u0444\u043E\u0440\u043C\u043E\u0439; \u0437\u043D\u0430\u043C\u044F \u2014 \u043F\u043E\u043B\u043E\u0442\u043D\u0438\u0449\u0435 \u0432 \u0441\u043A\u043B\u0430\u0434\u043A\u0430\u0445 \u0441 \u0434\u0432\u0443\u043C\u044F \u043A\u043E\u043D\u0446\u0430\u043C\u0438 \u0438 \u043F\u043E\u043B\u043E\u0441\u043E\u0439.","v13: en \xABConstruir\xBB, los muebles con el estilo v5. Es la construcci\xF3n v18.":"v13: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v18.","Hito 1 \xB7 v18":"\u042D\u0442\u0430\u043F 1 \xB7 v18","Demo \xFAnica \xB7 v13 (muebles con el estilo v5 en \xABConstruir\xBB)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v13 (\u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB)","Hito 1 \xB7 v19":"\u042D\u0442\u0430\u043F 1 \xB7 v19","Combate \xB7 v11":"\u0411\u043E\u0439 \xB7 v11","Demo \xFAnica \xB7 v14 (armas, hacha y pieza al construir con el estilo v5)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v14 (\u043E\u0440\u0443\u0436\u0438\u0435, \u0442\u043E\u043F\u043E\u0440 \u0438 \u0434\u0435\u0442\u0430\u043B\u044C \u043F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0432 \u0441\u0442\u0438\u043B\u0435 v5)","v19: lo que quedaba con el aspecto inicial, con el estilo elegido (el de la prueba de estilo v5). La pieza que se ve al construir ya no es un bloque verde o rojo: es la propia pieza, con su madera, su piedra o su paja, transl\xFAcida y con un velo verde si cabe o rojo si no. Al desmontar, lo que se quita y lo que caer\xEDa se ven igual, con un velo naranja o rojo. Al talar, el personaje lleva un hacha en la mano (mango de fresno y cabeza de hierro, como la del toc\xF3n de la prueba); solo sale mientras tala.":"v19: \u0442\u043E, \u0447\u0442\u043E \u0435\u0449\u0451 \u043E\u0441\u0442\u0430\u0432\u0430\u043B\u043E\u0441\u044C \u0432 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E\u043C \u0432\u0438\u0434\u0435, \u0442\u0435\u043F\u0435\u0440\u044C \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u0441\u0442\u0438\u043B\u044C \u043F\u0440\u043E\u0431\u044B v5). \u0414\u0435\u0442\u0430\u043B\u044C, \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0432\u0438\u0434\u043D\u043E \u043F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435, \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0437\u0435\u043B\u0451\u043D\u044B\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u044B\u0439 \u0431\u043B\u043E\u043A: \u044D\u0442\u043E \u0441\u0430\u043C\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u0441\u043E \u0441\u0432\u043E\u0438\u043C \u0434\u0435\u0440\u0435\u0432\u043E\u043C, \u043A\u0430\u043C\u043D\u0435\u043C \u0438\u043B\u0438 \u0441\u043E\u043B\u043E\u043C\u043E\u0439, \u043F\u043E\u043B\u0443\u043F\u0440\u043E\u0437\u0440\u0430\u0447\u043D\u0430\u044F, \u0441 \u0437\u0435\u043B\u0451\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E, \u0435\u0441\u043B\u0438 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F, \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439, \u0435\u0441\u043B\u0438 \u043D\u0435\u0442. \u041F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u0442\u043E, \u0447\u0442\u043E \u0441\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F, \u0438 \u0442\u043E, \u0447\u0442\u043E \u0443\u043F\u0430\u043B\u043E \u0431\u044B, \u0432\u044B\u0433\u043B\u044F\u0434\u044F\u0442 \u0442\u0430\u043A \u0436\u0435, \u0441 \u043E\u0440\u0430\u043D\u0436\u0435\u0432\u043E\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E. \u041A\u043E\u0433\u0434\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0440\u0443\u0431\u0438\u0442 \u0434\u0435\u0440\u0435\u0432\u043E, \u0443 \u043D\u0435\u0433\u043E \u0432 \u0440\u0443\u043A\u0435 \u0442\u043E\u043F\u043E\u0440 (\u044F\u0441\u0435\u043D\u0435\u0432\u043E\u0435 \u0442\u043E\u043F\u043E\u0440\u0438\u0449\u0435 \u0438 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u0439 \u043E\u0431\u0443\u0445, \u043A\u0430\u043A \u0443 \u0442\u043E\u043F\u043E\u0440\u0430 \u043D\u0430 \u043F\u043D\u0435 \u0432 \u043F\u0440\u043E\u0431\u0435); \u043E\u043D \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0440\u0443\u0431\u043A\u0438.","v11: las armas y lo de la liza con el estilo elegido (el de la prueba de estilo v5). Las espadas, con la hoja de secci\xF3n de rombo y su vaceo, el pu\xF1o forrado de cuero con su atadura, la cruz y el pomo de rueda de hierro; el palo, una vara descortezada con nudos; el arco, de una pieza, m\xE1s fino hacia las puntas y con el pu\xF1o de cuero; el escudo, seis tablas con veta, el canto forrado de cuero cosido y el umbo con clavos; la flecha, con punta de hierro y tres plumas atadas. El poste de pr\xE1ctica lleva dos haces de paja atados y piedras al pie; la diana es un haz de paja con un pa\xF1o pintado con tierras (ocre, almagre y carb\xF3n) en vez de los anillos de colores vivos. Las cintas que distinguen a los luchadores son ahora de pa\xF1o te\xF1ido, azul de glasto y amarillo de gualda, m\xE1s apagados.":"v11: \u043E\u0440\u0443\u0436\u0438\u0435 \u0438 \u0432\u0441\u0451 \u043D\u0430 \u0440\u0438\u0441\u0442\u0430\u043B\u0438\u0449\u0435 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u0441\u0442\u0438\u043B\u044C \u043F\u0440\u043E\u0431\u044B v5). \u0423 \u043C\u0435\u0447\u0435\u0439 \u043A\u043B\u0438\u043D\u043E\u043A \u0440\u043E\u043C\u0431\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u0441\u0435\u0447\u0435\u043D\u0438\u044F \u0441 \u0434\u043E\u043B\u043E\u043C, \u0440\u0443\u043A\u043E\u044F\u0442\u044C, \u043E\u0431\u0442\u044F\u043D\u0443\u0442\u0430\u044F \u043A\u043E\u0436\u0435\u0439 \u0441 \u043E\u0431\u043C\u043E\u0442\u043A\u043E\u0439, \u0436\u0435\u043B\u0435\u0437\u043D\u0430\u044F \u043A\u0440\u0435\u0441\u0442\u043E\u0432\u0438\u043D\u0430 \u0438 \u0434\u0438\u0441\u043A\u043E\u0432\u043E\u0435 \u043D\u0430\u0432\u0435\u0440\u0448\u0438\u0435; \u043F\u043E\u0441\u043E\u0445 \u2014 \u043E\u0448\u043A\u0443\u0440\u0435\u043D\u043D\u0430\u044F \u0436\u0435\u0440\u0434\u044C \u0441 \u0441\u0443\u0447\u043A\u0430\u043C\u0438; \u043B\u0443\u043A \u2014 \u0446\u0435\u043B\u044C\u043D\u044B\u0439, \u0442\u043E\u043D\u044C\u0448\u0435 \u043A \u043A\u043E\u043D\u0446\u0430\u043C, \u0441 \u043A\u043E\u0436\u0430\u043D\u043E\u0439 \u0440\u0443\u043A\u043E\u044F\u0442\u044C\u044E; \u0449\u0438\u0442 \u2014 \u0448\u0435\u0441\u0442\u044C \u0434\u043E\u0441\u043E\u043A \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439 \u0434\u0435\u0440\u0435\u0432\u0430, \u043E\u0431\u043E\u0434, \u043E\u0431\u0448\u0438\u0442\u044B\u0439 \u043A\u043E\u0436\u0435\u0439, \u0438 \u0443\u043C\u0431\u043E\u043D \u0441 \u0433\u0432\u043E\u0437\u0434\u044F\u043C\u0438; \u0441\u0442\u0440\u0435\u043B\u0430 \u2014 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u043C \u043D\u0430\u043A\u043E\u043D\u0435\u0447\u043D\u0438\u043A\u043E\u043C \u0438 \u0442\u0440\u0435\u043C\u044F \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u043C\u0438 \u043F\u0435\u0440\u044C\u044F\u043C\u0438. \u041D\u0430 \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043E\u0447\u043D\u043E\u043C \u0441\u0442\u043E\u043B\u0431\u0435 \u0434\u0432\u0430 \u043F\u0435\u0440\u0435\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u0441\u043D\u043E\u043F\u0430 \u0441\u043E\u043B\u043E\u043C\u044B \u0438 \u043A\u0430\u043C\u043D\u0438 \u0443 \u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0438\u044F; \u043C\u0438\u0448\u0435\u043D\u044C \u2014 \u0441\u043D\u043E\u043F \u0441\u043E\u043B\u043E\u043C\u044B \u0441 \u043F\u043E\u043B\u043E\u0442\u043D\u043E\u043C, \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u043D\u044B\u043C \u0437\u0435\u043C\u043B\u044F\u043D\u044B\u043C\u0438 \u043A\u0440\u0430\u0441\u043A\u0430\u043C\u0438 (\u043E\u0445\u0440\u0430, \u043A\u0440\u0430\u0441\u043D\u0430\u044F \u043E\u0445\u0440\u0430 \u0438 \u0443\u0433\u043E\u043B\u044C), \u0432\u043C\u0435\u0441\u0442\u043E \u044F\u0440\u043A\u0438\u0445 \u0446\u0432\u0435\u0442\u043D\u044B\u0445 \u043A\u043E\u043B\u0435\u0446. \u041B\u0435\u043D\u0442\u044B, \u043F\u043E \u043A\u043E\u0442\u043E\u0440\u044B\u043C \u0440\u0430\u0437\u043B\u0438\u0447\u0430\u044E\u0442 \u0431\u043E\u0439\u0446\u043E\u0432, \u0442\u0435\u043F\u0435\u0440\u044C \u0438\u0437 \u043A\u0440\u0430\u0448\u0435\u043D\u043E\u0433\u043E \u0441\u0443\u043A\u043D\u0430, \u0441\u0438\u043D\u0435\u0433\u043E (\u0432\u0430\u0439\u0434\u0430) \u0438 \u0436\u0451\u043B\u0442\u043E\u0433\u043E (\u0440\u0435\u0437\u0435\u0434\u0430), \u0431\u043E\u043B\u0435\u0435 \u043F\u0440\u0438\u0433\u043B\u0443\u0448\u0451\u043D\u043D\u044B\u0435.","v14: lo que quedaba con el aspecto inicial, con el estilo v5: en \xABConstruir\xBB, la pieza que se ve al colocar (la propia pieza, transl\xFAcida, con un velo verde o rojo), lo que se marca al desmontar y el hacha en la mano al talar; en \xABDuelo\xBB, las espadas, el palo, el arco, el escudo, la flecha, el poste de pr\xE1ctica y la diana. Es la construcci\xF3n v19 y el combate v11.":"v14: \u0442\u043E, \u0447\u0442\u043E \u0435\u0449\u0451 \u043E\u0441\u0442\u0430\u0432\u0430\u043B\u043E\u0441\u044C \u0432 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E\u043C \u0432\u0438\u0434\u0435, \u0442\u0435\u043F\u0435\u0440\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u2014 \u0434\u0435\u0442\u0430\u043B\u044C, \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0432\u0438\u0434\u043D\u043E \u043F\u0440\u0438 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0435 (\u0441\u0430\u043C\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u043F\u043E\u043B\u0443\u043F\u0440\u043E\u0437\u0440\u0430\u0447\u043D\u0430\u044F, \u0441 \u0437\u0435\u043B\u0451\u043D\u043E\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E), \u0442\u043E, \u0447\u0442\u043E \u0432\u044B\u0434\u0435\u043B\u044F\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435, \u0438 \u0442\u043E\u043F\u043E\u0440 \u0432 \u0440\u0443\u043A\u0435 \u043F\u0440\u0438 \u0440\u0443\u0431\u043A\u0435; \u0432 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043A\u0435\xBB \u2014 \u043C\u0435\u0447\u0438, \u043F\u043E\u0441\u043E\u0445, \u043B\u0443\u043A, \u0449\u0438\u0442, \u0441\u0442\u0440\u0435\u043B\u0430, \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043E\u0447\u043D\u044B\u0439 \u0441\u0442\u043E\u043B\u0431 \u0438 \u043C\u0438\u0448\u0435\u043D\u044C. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v19 \u0438 \u0431\u043E\u0439 v11.","v10: junto a un \xE1rbol, Usar (F) hace que el personaje tale; moverse lo para. De momento es solo el gesto (desde la v19, con el hacha en la mano), sin dar madera: recolectar llega con el hito 2.":"v10: \u0440\u044F\u0434\u043E\u043C \u0441 \u0434\u0435\u0440\u0435\u0432\u043E\u043C \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u0437\u0430\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0440\u0443\u0431\u0438\u0442\u044C \u0435\u0433\u043E; \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u0440\u0443\u0431\u043A\u0443. \u041F\u043E\u043A\u0430 \u044D\u0442\u043E \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 (\u0441 v19 \u2014 \u0441 \u0442\u043E\u043F\u043E\u0440\u043E\u043C \u0432 \u0440\u0443\u043A\u0435), \u0431\u0435\u0437 \u0434\u0440\u0435\u0432\u0435\u0441\u0438\u043D\u044B: \u0441\u0431\u043E\u0440 \u043F\u0440\u0438\u0434\u0451\u0442 \u0441 \u044D\u0442\u0430\u043F\u043E\u043C 2.","Cavar \xB7 v1 (prueba de rendimiento)":"\u041A\u043E\u043F\u0430\u043D\u0438\u0435 \xB7 v1 (\u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438)","v1: prueba de rendimiento de cavar con \xABv\xF3xeles suavizados\xBB (decidido por valravnx el 27 oct). La roca se divide en cubitos de 50 cm, en trozos de 8 m; cada golpe de pico (clic o toque sobre la roca) quita un pu\xF1ado redondeado de unos 80 cm de radio (galer\xEDas de algo m\xE1s de 1,5 m). La pared se dibuja lisa alrededor de los cubitos, con la rugosidad de la roca sacada de una semilla fija: todos ver\xEDan la misma cueva.":"v1: \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043A\u043E\u043F\u0430\u043D\u0438\u044F \u0441\u043E \xAB\u0441\u0433\u043B\u0430\u0436\u0435\u043D\u043D\u044B\u043C\u0438 \u0432\u043E\u043A\u0441\u0435\u043B\u044F\u043C\u0438\xBB (\u0440\u0435\u0448\u0435\u043D\u043E valravnx 27 \u043E\u043A\u0442.). \u041F\u043E\u0440\u043E\u0434\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043D\u0430 \u043A\u0443\u0431\u0438\u043A\u0438 \u043F\u043E 50 \u0441\u043C, \u043A\u0443\u0441\u043A\u0438 \u043F\u043E 8 \u043C; \u043A\u0430\u0436\u0434\u044B\u0439 \u0443\u0434\u0430\u0440 \u043A\u0438\u0440\u043A\u0438 (\u0449\u0435\u043B\u0447\u043E\u043A \u0438\u043B\u0438 \u043A\u0430\u0441\u0430\u043D\u0438\u0435 \u0441\u043A\u0430\u043B\u044B) \u0443\u0431\u0438\u0440\u0430\u0435\u0442 \u043E\u043A\u0440\u0443\u0433\u043B\u0443\u044E \u0433\u043E\u0440\u0441\u0442\u044C \u0440\u0430\u0434\u0438\u0443\u0441\u043E\u043C \u043E\u043A\u043E\u043B\u043E 80 \u0441\u043C (\u0448\u0442\u043E\u043B\u044C\u043D\u0438 \u0447\u0443\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 1,5 \u043C). \u0421\u0442\u0435\u043D\u0430 \u0440\u0438\u0441\u0443\u0435\u0442\u0441\u044F \u0433\u043B\u0430\u0434\u043A\u043E\u0439 \u0432\u043E\u043A\u0440\u0443\u0433 \u043A\u0443\u0431\u0438\u043A\u043E\u0432, \u0430 \u0448\u0435\u0440\u043E\u0445\u043E\u0432\u0430\u0442\u043E\u0441\u0442\u044C \u043A\u0430\u043C\u043D\u044F \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0438\u0437 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u043E\u0433\u043E \u0437\u0435\u0440\u043D\u0430: \u0432\u0441\u0435 \u0443\u0432\u0438\u0434\u0435\u043B\u0438 \u0431\u044B \u043E\u0434\u043D\u0443 \u0438 \u0442\u0443 \u0436\u0435 \u043F\u0435\u0449\u0435\u0440\u0443.","v1: arriba a la derecha se mide lo que tarda en rehacerse la malla de los trozos tocados en cada golpe (media y peor) y los fotogramas. \xABCavar t\xFAnel\xBB abre solo un t\xFAnel en la ladera para medir sin tener que tocar.":"v1: \u0441\u043F\u0440\u0430\u0432\u0430 \u0432\u0432\u0435\u0440\u0445\u0443 \u0438\u0437\u043C\u0435\u0440\u044F\u0435\u0442\u0441\u044F, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438 \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0441\u0435\u0442\u043A\u0438 \u0437\u0430\u0442\u0440\u043E\u043D\u0443\u0442\u044B\u0445 \u043A\u0443\u0441\u043A\u043E\u0432 \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u043C \u0443\u0434\u0430\u0440\u0435 (\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C \u0438 \u0432 \u0445\u0443\u0434\u0448\u0435\u043C \u0441\u043B\u0443\u0447\u0430\u0435), \u0438 \u0447\u0430\u0441\u0442\u043E\u0442\u0430 \u043A\u0430\u0434\u0440\u043E\u0432. \xAB\u0412\u044B\u043A\u043E\u043F\u0430\u0442\u044C \u0442\u0443\u043D\u043D\u0435\u043B\u044C\xBB \u0441\u0430\u043C\u0430 \u043F\u0440\u043E\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442 \u0442\u0443\u043D\u043D\u0435\u043B\u044C \u0432 \u0441\u043A\u043B\u043E\u043D\u0435, \u0447\u0442\u043E\u0431\u044B \u043C\u0435\u0440\u0438\u0442\u044C \u0431\u0435\u0437 \u043A\u0430\u0441\u0430\u043D\u0438\u0439.","v1, provisional: no hay personaje ni pico todav\xE 3E \u0433\u0434\u0435 \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0441\u044F.","Mar \xB7 {x}, {y} km":"\u041C\u043E\u0440\u0435 \xB7 {x}, {y} \u043A\u043C","{h} m de altura":"\u0432\u044B\u0441\u043E\u0442\u0430 {h} \u043C","{t} \xB0C de media":"\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C {t} \xB0C",Relieve:"\u0420\u0435\u043B\u044C\u0435\u0444",Biomas:"\u0411\u0438\u043E\u043C\u044B",Roca:"\u041F\u043E\u0440\u043E\u0434\u0430",R\u00EDos:"\u0420\u0435\u043A\u0438",Vetas:"\u0416\u0438\u043B\u044B","Otra semilla":"\u0414\u0440\u0443\u0433\u043E\u0435 \u0437\u0435\u0440\u043D\u043E",Semilla:"\u0417\u0435\u0440\u043D\u043E","Toca el mapa para ver qu\xE9 hay en cada sitio.":"\u041A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u043A\u0430\u0440\u0442\u044B, \u0447\u0442\u043E\u0431\u044B \u0443\u0432\u0438\u0434\u0435\u0442\u044C, \u0447\u0442\u043E \u0433\u0434\u0435 \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0441\u044F.","Generando el mundo\u2026":"\u0421\u043E\u0437\u0434\u0430\u0451\u043C \u043C\u0438\u0440\u2026","Kinhold Mapa":"Kinhold \u041A\u0430\u0440\u0442\u0430","188 km":"188 \u043A\u043C","256 km":"256 \u043A\u043C","v1: primer boceto del mundo, generado por semilla (la misma semilla da siempre el mismo mundo). Sin figuras fijas: la forma de las tierras se suma con muchas piezas al azar (colinas grandes para la masa del continente y peque\xF1as para pen\xEDnsulas, cabos e islas; sierras; fosas que abren golfos, r\xEDas y brazos de mar; hoyas que dejan mares interiores), con las distancias deformadas por ruido y un ruido fractal encima, porque las costas de verdad son irregulares a todas las escalas. Es el m\xE9todo de los generadores de mapas de fantas\xEDa m\xE1s conocidos.":"v1: \u043F\u0435\u0440\u0432\u044B\u0439 \u043D\u0430\u0431\u0440\u043E\u0441\u043E\u043A \u043C\u0438\u0440\u0430, \u0441\u043E\u0437\u0434\u0430\u043D\u043D\u044B\u0439 \u043F\u043E \u0437\u0435\u0440\u043D\u0443 (\u043E\u0434\u043D\u043E \u0438 \u0442\u043E \u0436\u0435 \u0437\u0435\u0440\u043D\u043E \u0432\u0441\u0435\u0433\u0434\u0430 \u0434\u0430\u0451\u0442 \u043E\u0434\u0438\u043D \u0438 \u0442\u043E\u0442 \u0436\u0435 \u043C\u0438\u0440). \u041D\u0438\u043A\u0430\u043A\u0438\u0445 \u0437\u0430\u0434\u0430\u043D\u043D\u044B\u0445 \u0444\u0438\u0433\u0443\u0440: \u0444\u043E\u0440\u043C\u0430 \u0441\u0443\u0448\u0438 \u0441\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0438\u0437 \u043C\u043D\u043E\u0436\u0435\u0441\u0442\u0432\u0430 \u0441\u043B\u0443\u0447\u0430\u0439\u043D\u044B\u0445 \u0447\u0430\u0441\u0442\u0435\u0439 (\u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0445\u043E\u043B\u043C\u044B \u2014 \u043E\u0441\u043D\u043E\u0432\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u043A\u0430, \u043C\u0430\u043B\u0435\u043D\u044C\u043A\u0438\u0435 \u2014 \u043F\u043E\u043B\u0443\u043E\u0441\u0442\u0440\u043E\u0432\u0430, \u043C\u044B\u0441\u044B \u0438 \u043E\u0441\u0442\u0440\u043E\u0432\u0430; \u0433\u043E\u0440\u043D\u044B\u0435 \u0445\u0440\u0435\u0431\u0442\u044B; \u0432\u043F\u0430\u0434\u0438\u043D\u044B, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0437\u0430\u043B\u0438\u0432\u044B, \u0431\u0443\u0445\u0442\u044B \u0438 \u043C\u043E\u0440\u0441\u043A\u0438\u0435 \u0440\u0443\u043A\u0430\u0432\u0430; \u043A\u043E\u0442\u043B\u043E\u0432\u0438\u043D\u044B, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u044E\u0442 \u0432\u043D\u0443\u0442\u0440\u0435\u043D\u043D\u0438\u0435 \u043C\u043E\u0440\u044F), \u0441 \u0438\u0441\u043A\u0430\u0436\u0451\u043D\u043D\u044B\u043C\u0438 \u0448\u0443\u043C\u043E\u043C \u0440\u0430\u0441\u0441\u0442\u043E\u044F\u043D\u0438\u044F\u043C\u0438 \u0438 \u0444\u0440\u0430\u043A\u0442\u0430\u043B\u044C\u043D\u044B\u043C \u0448\u0443\u043C\u043E\u043C \u0441\u0432\u0435\u0440\u0445\u0443, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0435 \u0431\u0435\u0440\u0435\u0433\u0430 \u043D\u0435\u0440\u043E\u0432\u043D\u044B\u0435 \u043D\u0430 \u043B\u044E\u0431\u043E\u043C \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0435. \u042D\u0442\u043E \u043C\u0435\u0442\u043E\u0434 \u0441\u0430\u043C\u044B\u0445 \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044B\u0445 \u0433\u0435\u043D\u0435\u0440\u0430\u0442\u043E\u0440\u043E\u0432 \u0444\u044D\u043D\u0442\u0435\u0437\u0438\u0439\u043D\u044B\u0445 \u043A\u0430\u0440\u0442.","v1: hay siempre una isla grande que es un pa\xEDs entero, a m\xE1s de 20 km de mar de cualquier otra costa (en las pruebas salen entre 30 y 60 km): solo se llega en barco, para que haya rutas de comercio por mar. Se forma con varias colinas en fila y su sierra, as\xED que sale alargada e irregular; mide unos 1.800 a 2.400 km\xB2, algo menos que los pa\xEDses del continente.":"v1: \u0432\u0441\u0435\u0433\u0434\u0430 \u0435\u0441\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u043E\u0439 \u043E\u0441\u0442\u0440\u043E\u0432 \u2014 \u0446\u0435\u043B\u0430\u044F \u0441\u0442\u0440\u0430\u043D\u0430, \u043E\u0442\u0434\u0435\u043B\u0451\u043D\u043D\u0430\u044F \u043E\u0442 \u043B\u044E\u0431\u043E\u0433\u043E \u0434\u0440\u0443\u0433\u043E\u0433\u043E \u0431\u0435\u0440\u0435\u0433\u0430 \u0431\u043E\u043B\u0435\u0435 \u0447\u0435\u043C 20 \u043A\u043C \u043C\u043E\u0440\u044F (\u0432 \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430\u0445 \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u043E\u0442 30 \u0434\u043E 60 \u043A\u043C): \u0442\u0443\u0434\u0430 \u043C\u043E\u0436\u043D\u043E \u043F\u043E\u043F\u0430\u0441\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 \u043A\u043E\u0440\u0430\u0431\u043B\u0435, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u044F\u0432\u0438\u043B\u0438\u0441\u044C \u043C\u043E\u0440\u0441\u043A\u0438\u0435 \u0442\u043E\u0440\u0433\u043E\u0432\u044B\u0435 \u043F\u0443\u0442\u0438. \u041E\u043D \u0441\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0438\u0437 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u0438\u0445 \u0445\u043E\u043B\u043C\u043E\u0432 \u0432 \u0440\u044F\u0434 \u0438 \u0441\u0432\u043E\u0435\u0433\u043E \u0445\u0440\u0435\u0431\u0442\u0430, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442\u0441\u044F \u0432\u044B\u0442\u044F\u043D\u0443\u0442\u044B\u043C \u0438 \u043D\u0435\u0440\u043E\u0432\u043D\u044B\u043C; \u043F\u043B\u043E\u0449\u0430\u0434\u044C \u043E\u043A\u043E\u043B\u043E 1 800\u20132 400 \u043A\u043C\xB2, \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u043C\u0435\u043D\u044C\u0448\u0435 \u0441\u0442\u0440\u0430\u043D \u043D\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u043A\u0435.","v1: el relieve sale del levantamiento de las cordilleras y de la erosi\xF3n de los r\xEDos (primero el agua, despu\xE9s el terreno, como dice el GDD). Las cumbres llegan a unos 3.000 m y los tramos bajos de cada sierra son los collados por donde cruzar. Algunas sierras salen hacia el mar y hacen pen\xEDnsulas largas con su espinazo.":"v1: \u0440\u0435\u043B\u044C\u0435\u0444 \u043F\u043E\u043B\u0443\u0447\u0430\u0435\u0442\u0441\u044F \u0438\u0437 \u043F\u043E\u0434\u043D\u044F\u0442\u0438\u044F \u0433\u043E\u0440\u043D\u044B\u0445 \u0445\u0440\u0435\u0431\u0442\u043E\u0432 \u0438 \u044D\u0440\u043E\u0437\u0438\u0438 \u0440\u0435\u043A (\u0441\u043D\u0430\u0447\u0430\u043B\u0430 \u0432\u043E\u0434\u0430, \u043F\u043E\u0442\u043E\u043C \u0440\u0435\u043B\u044C\u0435\u0444, \u043A\u0430\u043A \u0441\u043A\u0430\u0437\u0430\u043D\u043E \u0432 GDD). \u0412\u0435\u0440\u0448\u0438\u043D\u044B \u0434\u043E\u0441\u0442\u0438\u0433\u0430\u044E\u0442 \u043E\u043A\u043E\u043B\u043E 3 000 \u043C, \u0430 \u043D\u0438\u0437\u043A\u0438\u0435 \u0443\u0447\u0430\u0441\u0442\u043A\u0438 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0445\u0440\u0435\u0431\u0442\u0430 \u2014 \u043F\u0435\u0440\u0435\u0432\u0430\u043B\u044B. \u041D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0445\u0440\u0435\u0431\u0442\u044B \u0443\u0445\u043E\u0434\u044F\u0442 \u0432 \u043C\u043E\u0440\u0435 \u0438 \u043E\u0431\u0440\u0430\u0437\u0443\u044E\u0442 \u0434\u043B\u0438\u043D\u043D\u044B\u0435 \u043F\u043E\u043B\u0443\u043E\u0441\u0442\u0440\u043E\u0432\u0430 \u0441\u043E \u0441\u0432\u043E\u0438\u043C \u0433\u043E\u0440\u043D\u044B\u043C \u0445\u0440\u0435\u0431\u0442\u043E\u043C.","v1: el ancho de cada r\xEDo sale del \xE1rea que drena, con la regla de los r\xEDos de verdad (el ancho crece con la ra\xEDz del caudal): arroyos de menos de 5 m, r\xEDos de 5 a 40 m y grandes r\xEDos de m\xE1s de 40 m. Con tierras de este tama\xF1o casi no salen grandes r\xEDos: hace falta una cuenca de unos 4.000 km\xB2.":"v1: \u0448\u0438\u0440\u0438\u043D\u0430 \u043A\u0430\u0436\u0434\u043E\u0439 \u0440\u0435\u043A\u0438 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043E\u0442 \u043F\u043B\u043E\u0449\u0430\u0434\u0438, \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u043E\u043D\u0430 \u0441\u043E\u0431\u0438\u0440\u0430\u0435\u0442, \u043F\u043E \u043F\u0440\u0430\u0432\u0438\u043B\u0443 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0445 \u0440\u0435\u043A (\u0448\u0438\u0440\u0438\u043D\u0430 \u0440\u0430\u0441\u0442\u0451\u0442 \u043A\u0430\u043A \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u043D\u044B\u0439 \u043A\u043E\u0440\u0435\u043D\u044C \u0438\u0437 \u0440\u0430\u0441\u0445\u043E\u0434\u0430): \u0440\u0443\u0447\u044C\u0438 \u0443\u0436\u0435 5 \u043C, \u0440\u0435\u043A\u0438 \u043E\u0442 5 \u0434\u043E 40 \u043C \u0438 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0440\u0435\u043A\u0438 \u0448\u0438\u0440\u0435 40 \u043C. \u041D\u0430 \u0437\u0435\u043C\u043B\u044F\u0445 \u0442\u0430\u043A\u043E\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0440\u0435\u043A\u0438 \u043F\u043E\u0447\u0442\u0438 \u043D\u0435 \u043E\u0431\u0440\u0430\u0437\u0443\u044E\u0442\u0441\u044F: \u043D\u0443\u0436\u0435\u043D \u0431\u0430\u0441\u0441\u0435\u0439\u043D \u043E\u043A\u043E\u043B\u043E 4 000 \u043A\u043C\xB2.","v1: clima por latitud (fr\xEDo al norte, templado en medio, c\xE1lido y m\xE1s seco al sur) y por altura; la lluvia la trae el viento del oeste y cae al subir las sierras, as\xED que las laderas de levante quedan m\xE1s secas.":"v1: \u043A\u043B\u0438\u043C\u0430\u0442 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043E\u0442 \u0448\u0438\u0440\u043E\u0442\u044B (\u0445\u043E\u043B\u043E\u0434\u043D\u043E \u043D\u0430 \u0441\u0435\u0432\u0435\u0440\u0435, \u0443\u043C\u0435\u0440\u0435\u043D\u043D\u043E \u0432 \u0441\u0435\u0440\u0435\u0434\u0438\u043D\u0435, \u0442\u0435\u043F\u043B\u043E \u0438 \u0441\u0443\u0448\u0435 \u043D\u0430 \u044E\u0433\u0435) \u0438 \u043E\u0442 \u0432\u044B\u0441\u043E\u0442\u044B; \u0434\u043E\u0436\u0434\u044C \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u0437\u0430\u043F\u0430\u0434\u043D\u044B\u0439 \u0432\u0435\u0442\u0435\u0440, \u0438 \u043E\u043D \u0432\u044B\u043F\u0430\u0434\u0430\u0435\u0442 \u043D\u0430 \u043F\u043E\u0434\u044A\u0451\u043C\u0435 \u043A \u0445\u0440\u0435\u0431\u0442\u0430\u043C, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u0432\u043E\u0441\u0442\u043E\u0447\u043D\u044B\u0435 \u0441\u043A\u043B\u043E\u043D\u044B \u0441\u0443\u0448\u0435.","v1, provisional: cinco pa\xEDses que crecen desde un centro llano y se frenan en las cumbres y en los r\xEDos grandes (fronteras naturales), equilibrados para que midan parecido. Se llaman Pa\xEDs 1 a 5 hasta que valravnx les ponga nombre. Las islas peque\xF1as sueltas no son de nadie de momento.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u043F\u044F\u0442\u044C \u0441\u0442\u0440\u0430\u043D, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0440\u0430\u0441\u0442\u0443\u0442 \u043E\u0442 \u0440\u0430\u0432\u043D\u0438\u043D\u043D\u043E\u0433\u043E \u0446\u0435\u043D\u0442\u0440\u0430 \u0438 \u0437\u0430\u043C\u0435\u0434\u043B\u044F\u044E\u0442\u0441\u044F \u0443 \u0432\u0435\u0440\u0448\u0438\u043D \u0438 \u0431\u043E\u043B\u044C\u0448\u0438\u0445 \u0440\u0435\u043A (\u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0435 \u0433\u0440\u0430\u043D\u0438\u0446\u044B), \u0432\u044B\u0440\u043E\u0432\u043D\u0435\u043D\u043D\u044B\u0435 \u043F\u043E \u0440\u0430\u0437\u043C\u0435\u0440\u0443. \u041E\u043D\u0438 \u043D\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0421\u0442\u0440\u0430\u043D\u0430 1\u20135, \u043F\u043E\u043A\u0430 valravnx \u043D\u0435 \u0434\u0430\u0441\u0442 \u0438\u043C \u0438\u043C\u0435\u043D\u0430. \u041C\u0430\u043B\u0435\u043D\u044C\u043A\u0438\u0435 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0435 \u043E\u0441\u0442\u0440\u043E\u0432\u0430 \u043F\u043E\u043A\u0430 \u043D\u0438\u0447\u044C\u0438.","v1: roca madre por provincias: granito y pizarra en el coraz\xF3n de las sierras, caliza en sus faldas y arenisca en las llanuras. Hierro de pantano (poco y malo) en las turberas; vetas de hierro donde el granito o la pizarra tocan la caliza; carb\xF3n en la arenisca al pie de las sierras.":"v1: \u043A\u043E\u0440\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0440\u043E\u0434\u0430 \u043F\u043E \u043F\u0440\u043E\u0432\u0438\u043D\u0446\u0438\u044F\u043C: \u0433\u0440\u0430\u043D\u0438\u0442 \u0438 \u0441\u043B\u0430\u043D\u0435\u0446 \u0432 \u0441\u0435\u0440\u0434\u0446\u0435 \u0445\u0440\u0435\u0431\u0442\u043E\u0432, \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044F\u043A \u043D\u0430 \u0438\u0445 \u0441\u043A\u043B\u043E\u043D\u0430\u0445 \u0438 \u043F\u0435\u0441\u0447\u0430\u043D\u0438\u043A \u043D\u0430 \u0440\u0430\u0432\u043D\u0438\u043D\u0430\u0445. \u0411\u043E\u043B\u043E\u0442\u043D\u043E\u0435 \u0436\u0435\u043B\u0435\u0437\u043E (\u043C\u0430\u043B\u043E \u0438 \u043F\u043B\u043E\u0445\u043E\u0435) \u0432 \u0442\u043E\u0440\u0444\u044F\u043D\u0438\u043A\u0430\u0445; \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u0435 \u0436\u0438\u043B\u044B \u0442\u0430\u043C, \u0433\u0434\u0435 \u0433\u0440\u0430\u043D\u0438\u0442 \u0438\u043B\u0438 \u0441\u043B\u0430\u043D\u0435\u0446 \u0441\u043E\u043F\u0440\u0438\u043A\u0430\u0441\u0430\u044E\u0442\u0441\u044F \u0441 \u0438\u0437\u0432\u0435\u0441\u0442\u043D\u044F\u043A\u043E\u043C; \u0443\u0433\u043E\u043B\u044C \u0432 \u043F\u0435\u0441\u0447\u0430\u043D\u0438\u043A\u0435 \u0443 \u043F\u043E\u0434\u043D\u043E\u0436\u0438\u044F \u0445\u0440\u0435\u0431\u0442\u043E\u0432.","v1: toca el mapa para ver la altura, el bioma, la roca, el pa\xEDs y el r\xEDo de ese punto. La semilla se puede cambiar; el enlace con ?semilla= abre ese mundo.":"v1: \u043A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u043A\u0430\u0440\u0442\u044B, \u0447\u0442\u043E\u0431\u044B \u0443\u0432\u0438\u0434\u0435\u0442\u044C \u0432\u044B\u0441\u043E\u0442\u0443, \u0431\u0438\u043E\u043C, \u043F\u043E\u0440\u043E\u0434\u0443, \u0441\u0442\u0440\u0430\u043D\u0443 \u0438 \u0440\u0435\u043A\u0443 \u0432 \u044D\u0442\u043E\u0439 \u0442\u043E\u0447\u043A\u0435. \u0417\u0435\u0440\u043D\u043E \u043C\u043E\u0436\u043D\u043E \u043C\u0435\u043D\u044F\u0442\u044C; \u0441\u0441\u044B\u043B\u043A\u0430 \u0441 ?semilla= \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u044D\u0442\u043E\u0442 \u043C\u0438\u0440.",Leyenda:"\u041B\u0435\u0433\u0435\u043D\u0434\u0430","v1, propuesta: arriba se elige el tama\xF1o del mundo. Con 188 km (el del GDD) los pa\xEDses del continente salen de unos 3.000 km\xB2 (unos 55 \xD7 55 km) y la isla, de unos 900 km\xB2; con 256 km, de unos 5.700 km\xB2 (unos 75 \xD7 75) y la isla, de unos 2.000 km\xB2. Sale por defecto el de 256 para que la isla sea un pa\xEDs de verdad. Lo decide valravnx.":"v1, \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0435\u043D\u0438\u0435: \u0440\u0430\u0437\u043C\u0435\u0440 \u043C\u0438\u0440\u0430 \u0432\u044B\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0441\u0432\u0435\u0440\u0445\u0443. \u041F\u0440\u0438 188 \u043A\u043C (\u0440\u0430\u0437\u043C\u0435\u0440 \u0438\u0437 GDD) \u0441\u0442\u0440\u0430\u043D\u044B \u043D\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u043A\u0435 \u043F\u043E\u043B\u0443\u0447\u0430\u044E\u0442\u0441\u044F \u043E\u043A\u043E\u043B\u043E 3 000 \u043A\u043C\xB2 (\u043F\u0440\u0438\u043C\u0435\u0440\u043D\u043E 55 \xD7 55 \u043A\u043C), \u0430 \u043E\u0441\u0442\u0440\u043E\u0432 \u2014 \u043E\u043A\u043E\u043B\u043E 900 \u043A\u043C\xB2; \u043F\u0440\u0438 256 \u043A\u043C \u2014 \u043E\u043A\u043E\u043B\u043E 5 700 \u043A\u043C\xB2 (\u043F\u0440\u0438\u043C\u0435\u0440\u043D\u043E 75 \xD7 75), \u0430 \u043E\u0441\u0442\u0440\u043E\u0432 \u2014 \u043E\u043A\u043E\u043B\u043E 2 000 \u043A\u043C\xB2. \u041F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u0441\u0442\u043E\u0438\u0442 256, \u0447\u0442\u043E\u0431\u044B \u043E\u0441\u0442\u0440\u043E\u0432 \u0431\u044B\u043B \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0439 \u0441\u0442\u0440\u0430\u043D\u043E\u0439. \u0420\u0435\u0448\u0430\u0435\u0442 valravnx.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Arrastra un dedo por una zona libre para girar la c\xE1mara.":"\u0414\u0436\u043E\u0439\u0441\u0442\u0438\u043A \u0441\u043B\u0435\u0432\u0430 \u2014 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435; \u0440\u044F\u0434\u043E\u043C \u0441 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u2014 \u043E\u0431\u0445\u043E\u0434 \u0432\u043E\u043A\u0440\u0443\u0433 \u043D\u0435\u0433\u043E. \u041F\u0440\u043E\u0432\u0435\u0434\u0438\u0442\u0435 \u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C \u043F\u043E \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u043E\u043C\u0443 \u043C\u0435\u0441\u0442\u0443, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043A\u0430\u043C\u0435\u0440\u0443.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta. Si llevas el dedo cerca del borde, la c\xE1mara gira hacia ese lado.":"<b>\u041B\u0443\u043A \u0438 \u043A\u0430\u043C\u043D\u0438:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043F\u0430\u043B\u0435\u0446, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u044C, \u0432\u0435\u0434\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u0446\u0435\u043B\u0438\u0442\u044C\u0441\u044F, \u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u0435. \u0415\u0441\u043B\u0438 \u043F\u043E\u0434\u0432\u0435\u0441\u0442\u0438 \u043F\u0430\u043B\u0435\u0446 \u043A \u043A\u0440\u0430\u044E \u044D\u043A\u0440\u0430\u043D\u0430, \u043A\u0430\u043C\u0435\u0440\u0430 \u043F\u043E\u0432\u0435\u0440\u043D\u0451\u0442\u0441\u044F \u0432 \u0442\u0443 \u0441\u0442\u043E\u0440\u043E\u043D\u0443.","v12: c\xE1mara t\xE1ctil con un dedo, como dice el GDD. Arrastrar un dedo por una zona libre de la pantalla gira la c\xE1mara (antes hac\xEDan falta dos); un toque sin arrastrar no la mueve (cuenta como arrastre a partir de 10 px, decisi\xF3n provisional). Tocar la rosa sigue golpeando al instante. El dedo del joystick ya no cuenta como segundo dedo. Con arco o piedras, si al apuntar llevas el dedo m\xE1s all\xE1 del 35% desde el centro hacia un borde, la c\xE1mara gira hacia ese lado, m\xE1s deprisa cuanto m\xE1s cerca del borde (hasta 1,4 rad/s; valores provisionales).":"v12: \u043A\u0430\u043C\u0435\u0440\u0430 \u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C \u043D\u0430 \u0441\u0435\u043D\u0441\u043E\u0440\u043D\u043E\u043C \u044D\u043A\u0440\u0430\u043D\u0435, \u043A\u0430\u043A \u0441\u043A\u0430\u0437\u0430\u043D\u043E \u0432 GDD. \u0415\u0441\u043B\u0438 \u043F\u0440\u043E\u0432\u0435\u0441\u0442\u0438 \u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C \u043F\u043E \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u043E\u0439 \u0447\u0430\u0441\u0442\u0438 \u044D\u043A\u0440\u0430\u043D\u0430, \u043A\u0430\u043C\u0435\u0440\u0430 \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F (\u0440\u0430\u043D\u044C\u0448\u0435 \u043D\u0443\u0436\u043D\u043E \u0431\u044B\u043B\u043E \u0434\u0432\u0430); \u043A\u0430\u0441\u0430\u043D\u0438\u0435 \u0431\u0435\u0437 \u043F\u0435\u0440\u0435\u0442\u0430\u0441\u043A\u0438\u0432\u0430\u043D\u0438\u044F \u0435\u0451 \u043D\u0435 \u0434\u0432\u0438\u0433\u0430\u0435\u0442 (\u043F\u0435\u0440\u0435\u0442\u0430\u0441\u043A\u0438\u0432\u0430\u043D\u0438\u0435\u043C \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u0441\u0434\u0432\u0438\u0433 \u043E\u0442 10 px, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E\u0435 \u0440\u0435\u0448\u0435\u043D\u0438\u0435). \u041A\u0430\u0441\u0430\u043D\u0438\u0435 \u0440\u043E\u0437\u044B \u043F\u043E-\u043F\u0440\u0435\u0436\u043D\u0435\u043C\u0443 \u0441\u0440\u0430\u0437\u0443 \u043D\u0430\u043D\u043E\u0441\u0438\u0442 \u0443\u0434\u0430\u0440. \u041F\u0430\u043B\u0435\u0446 \u043D\u0430 \u0434\u0436\u043E\u0439\u0441\u0442\u0438\u043A\u0435 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0441\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F \u0432\u0442\u043E\u0440\u044B\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C. \u0421 \u043B\u0443\u043A\u043E\u043C \u0438\u043B\u0438 \u043A\u0430\u043C\u043D\u044F\u043C\u0438: \u0435\u0441\u043B\u0438 \u043F\u0440\u0438 \u043F\u0440\u0438\u0446\u0435\u043B\u0438\u0432\u0430\u043D\u0438\u0438 \u043E\u0442\u0432\u0435\u0441\u0442\u0438 \u043F\u0430\u043B\u0435\u0446 \u0434\u0430\u043B\u044C\u0448\u0435 35% \u043E\u0442 \u0446\u0435\u043D\u0442\u0440\u0430 \u043A \u043A\u0440\u0430\u044E, \u043A\u0430\u043C\u0435\u0440\u0430 \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0432 \u0442\u0443 \u0441\u0442\u043E\u0440\u043E\u043D\u0443, \u0442\u0435\u043C \u0431\u044B\u0441\u0442\u0440\u0435\u0435, \u0447\u0435\u043C \u0431\u043B\u0438\u0436\u0435 \u043A \u043A\u0440\u0430\u0
