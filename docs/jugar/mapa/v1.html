luci\u00F3n:"Resolution",Tri\u00E1ngulos:"Triangles","{t} mil por fotograma":"{t} thousand per frame","Llamadas de dibujo":"Draw calls","Memoria gr\xE1fica":"Graphics memory","{g} geometr\xEDas y {x} texturas":"{g} geometries and {x} textures","Memoria de JavaScript":"JavaScript memory","Personajes en escena":"Characters in the scene","Rendimiento en este aparato":"Performance on this device","Personajes de prueba:":"Test characters:","valravnx: dime los fps que ves en tu m\xF3vil (y qu\xE9 m\xF3vil es), en \xABConstruir\xBB y en \xABDuelo\xBB. Con eso se decide cu\xE1nto detalle aguanta.":"valravnx: tell me the fps you see on your phone (and which phone it is), in \u201CBuild\u201D and in \u201CDuel\u201D. That decides how much detail it can take.","Demo \xFAnica \xB7 v2 (los n\xFAmeros de rendimiento a la vista)":"Single demo \xB7 v2 (performance numbers in view)","v2: junto al bot\xF3n \xABMen\xFA\xBB salen los fotogramas por segundo de tu aparato; al pulsarlo se abre el detalle: lo que tarda cada fotograma (de media y el m\xE1s lento), la resoluci\xF3n, los tri\xE1ngulos y las llamadas de dibujo, la memoria gr\xE1fica y la de JavaScript (esta solo la dicen Chrome y los navegadores basados en \xE9l) y los personajes en escena. En el m\xF3vil, si junto a \xABMen\xFA\xBB no cabe, va a la izquierda de la pantalla.":"v2: next to the \u201CMenu\u201D button you see your device\u2019s frames per second; tap it to open the details: how long each frame takes (on average and the slowest), the resolution, the triangles and draw calls, graphics memory and JavaScript memory (only Chrome and Chrome-based browsers report the latter) and the characters in the scene. On a phone, if it doesn\u2019t fit next to \u201CMenu\u201D, it goes to the left of the screen.","v2, para medir con gente: en \xABConstruir\xBB, el detalle tiene \xABPersonajes de prueba\xBB (0, 4, 8 o 16): personajes del taller que pasean en corro a tu alrededor. Solo se dibujan; no son jugadores ni cambian nada. Medido en el navegador de pruebas (dibuja sin tarjeta gr\xE1fica, as\xED que sus fps no valen): cada personaje suma unos 37 mil tri\xE1ngulos por fotograma (contando su sombra), unas 10 geometr\xEDas y 12 texturas.":"v2, to measure with people around: in \u201CBuild\u201D, the details have \u201CTest characters\u201D (0, 4, 8 or 16): workshop characters who stroll in a ring around you. They are only drawn; they are not players and change nothing. Measured in the test browser (it draws without a graphics card, so its fps mean nothing): each character adds about 37 thousand triangles per frame (counting its shadow), about 10 geometries and 12 textures.","Hito 1 \xB7 v11":"Milestone 1 \xB7 v11","v11: en el m\xF3vil el aviso de abajo del men\xFA ya no tapa \xABReiniciar\xBB ni otros botones: se coloca seg\xFAn lo que mida de verdad el men\xFA de arriba (que en ingl\xE9s y en ruso ocupa m\xE1s filas) y a la izquierda de los botones de modo.":"v11: on mobile the notice under the menu no longer covers \xABReset\xBB or other buttons: it is placed according to the real size of the top menu (which takes more rows in English and Russian) and to the left of the mode buttons.","Prueba de estilo \xB7 v10 (realismo en miniatura; las notas no tapan las vistas)":"Style test \xB7 v10 (miniature realism; the notes don't cover the views)","v10: las notas se colocan justo encima de la barra de vistas, aunque en el m\xF3vil esta ocupe dos filas, y nunca suben por encima de la barra de arriba.":"v10: the notes sit just above the views bar, even when on mobile it takes two rows, and never rise above the top bar.","Demo \xFAnica \xB7 v3 (los avisos no tapan los men\xFAs en el m\xF3vil)":"Single demo \xB7 v3 (notices don't cover the menus on mobile)","v3: en el m\xF3vil, el aviso de \xABConstruir\xBB ya no tapa los botones del men\xFA de arriba (tampoco en ingl\xE9s y en ruso, ni con \xABMen\xFA\xBB y los fps). Es la construcci\xF3n v11.":"v3: on mobile, the \u201CBuild\u201D notice no longer covers the top menu buttons (also in English and Russian, and with \xABMenu\xBB and the fps). It is construction v11.","v12: correr m\xE1s natural (valravnx: \xABfea y exagerada\xBB). La carrera del paquete es de dibujo animado: zancada de 1,4 m, mucho braceo con los codos abiertos, cuerpo echado hacia delante y agachado, y 25 cm de bote. Se calma por c\xF3digo al pasarla al taller: cada hueso se mueve la mitad o algo m\xE1s de lo que se mov\xEDa (brazos 50 %, tronco 55 %, piernas 60 %), el tronco se endereza, los brazos se acercan al cuerpo como al andar y la pelvis bota menos (10 cm) y se agacha menos. Se puede ver con el bot\xF3n \xABCorrer\xBB. Personajes en recursos/personajes/taller-v5/ (lo dem\xE1s, igual que la v4).":"v12: more natural running (valravnx: \xABugly and exaggerated\xBB). The pack's run is cartoonish: a 1.4 m stride, lots of arm swing with the elbows out, the body thrown forward and crouched, and 25 cm of bounce. It is calmed down by code when it is passed to the workshop: each bone moves half or a bit more of what it used to (arms 50 %, trunk 55 %, legs 60 %), the trunk straightens, the arms come closer to the body as when walking and the pelvis bounces less (10 cm) and crouches less. You can see it with the \xABRun\xBB button. Characters in recursos/personajes/taller-v5/ (everything else, the same as v4).","v12, arreglo: el juego aceleraba la animaci\xF3n de correr como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s: a la velocidad del juego (3,6 m/s) los pies resbalaban y se ve\xEDa a c\xE1mara lenta con zancadas enormes. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar el personaje (la carrera nueva: 3,5 m/s el hombre y 2,9 la mujer; andar, 0,95 y 0,77).":"v12, fix: the game sped up the run animation as if its natural speed were 2.59 m/s, but measured with the planted foot it was 5.8 m/s: at the game's speed (3.6 m/s) the feet slid and it looked like slow motion with huge strides. Now the natural speed of walking and running is measured in the clip itself when the character loads (the new run: 3.5 m/s the man and 2.9 the woman; walking, 0.95 and 0.77).","v12, pendiente: corriendo deprisa (6 m/s, con la tecla May\xFAs) la animaci\xF3n va al tope de 1,6\xD7 y los pies a\xFAn resbalan algo, sobre todo la mujer. Si valravnx no la ve bien, el siguiente paso son carreras de captura de movimiento libres (Rokoko).":"v12, pending: running fast (6 m/s, with the Shift key) the animation hits the 1.6\xD7 cap and the feet still slide a little, especially the woman's. If valravnx doesn't like it, the next step is free motion-capture runs (Rokoko).","Personaje \xB7 v12 (carrera m\xE1s suave y natural)":"Character \xB7 v12 (smoother, more natural running)","v4: correr m\xE1s natural, en las tres partes. La carrera va suavizada por c\xF3digo (menos zancada, braceo, bote e inclinaci\xF3n, y los brazos m\xE1s pegados) y a su velocidad de verdad: antes los pies resbalaban y se ve\xEDa a c\xE1mara lenta. Personajes del taller-v5; es la construcci\xF3n v11, el combate v8 y el personaje v12. Corriendo deprisa (6 m/s, con la tecla May\xFAs) los pies a\xFAn resbalan algo.":"v4: more natural running, in all three parts. The run is softened by code (shorter stride, less arm swing, bounce and lean, and arms closer to the body) and plays at its real speed: before, the feet slid and it looked like slow motion. Workshop characters v5; it is construction v11, combat v8 and character v12. Running fast (6 m/s, with the Shift key) the feet still slide a little.","Demo \xFAnica \xB7 v4 (correr m\xE1s natural)":"Single demo \xB7 v4 (more natural running)","v12: los muros, los postes y las vigas con el estilo elegido (el de la caba\xF1a de la prueba de estilo v5): troncos redondos con su veta y las testas claras a la vista, un poco m\xE1s gruesos por un extremo; jambas, dintel, marco y alf\xE9izar en puertas y ventanas; el zarzo con estacas que asoman del barro; el entramado con riostra y relleno encalado; las tablas con durmiente y carrera. Los tejados, los suelos, las cercas y los muebles pasan al estilo en las tareas siguientes.":"v12: walls, posts and beams in the chosen style (that of the cabin in style test v5): round logs with their grain and the light log ends showing, a little thicker at one end; jambs, lintel, frame and sill on doors and windows; wattle with stakes sticking out of the daub; timber framing with a brace and limewashed infill; planks with sill plate and top plate. Roofs, floors, fences and furniture move to the style in the next tasks.","v13: los brazos al correr (valravnx: \xABtorcidos hacia delante, en pose nada natural\xBB). Ahora el brazo oscila alrededor de la vertical (el codo pasa por detr\xE1s del cuerpo), el antebrazo va un poco hacia arriba y hacia dentro, la mano va de canto con el pulgar arriba y la mu\xF1eca recta, en vez de los pu\xF1os girados hacia abajo delante de la tripa. Personajes en recursos/personajes/taller-v6/.":"v13: the arms when running (valravnx: \xABtwisted forward, in a pose that's not natural at all\xBB). Now the arm swings around the vertical (the elbow goes behind the body), the forearm points slightly up and inward, the hand is edge-on with the thumb up and the wrist straight, instead of the fists turned down in front of the belly. Characters in recursos/personajes/taller-v6/.","v5: los brazos al correr, m\xE1s naturales (valravnx los vio torcidos hacia delante): oscilan junto al cuerpo, con la mano de canto y la mu\xF1eca recta. Es el personaje v13, con la construcci\xF3n v11 y el combate v8.":"v5: more natural arms when running (valravnx saw them twisted forward): they swing next to the body, with the hand edge-on and the wrist straight. It is character v13, with construction v11 and combat v8.","Personaje \xB7 v13 (brazos naturales al correr)":"Character \xB7 v13 (natural arms when running)","Demo \xFAnica \xB7 v5 (brazos naturales al correr)":"Single demo \xB7 v5 (natural arms when running)","Se ha perdido el dibujo 3D (el aparato se qued\xF3 sin memoria gr\xE1fica).":"The 3D view was lost (the device ran out of graphics memory).","Ha vuelto a pasar: cierra otras pesta\xF1as o aplicaciones y recarga.":"It happened again: close other tabs or apps and reload.","Recargando\u2026 Lo construido est\xE1 guardado.":"Reloading\u2026 What you built is saved.",Recargar:"Reload","v12, arreglo importante (valravnx: pantalla en blanco en el m\xF3vil tras un rato construyendo, a m\xE1s de 80 fps): cada vez que se colocaba o se quitaba algo se rehac\xEDan todas las piezas y las viejas se quedaban ocupando la memoria gr\xE1fica (medido: con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas en memoria). Ahora se liberan y la cuenta no sube. Si aun as\xED el navegador pierde el dibujo 3D, sale un aviso y la p\xE1gina se recarga sola con lo construido guardado; si vuelve a pasar enseguida, ofrece un bot\xF3n en vez de recargar en bucle.":"v12, important fix (valravnx: blank screen on mobile after building for a while, at over 80 fps): every time something was placed or removed all the pieces were rebuilt and the old ones stayed in graphics memory (measured: with 9 pieces, 20 rebuilds went from 870 to 4,050 meshes in memory). Now they are freed and the count does not grow. If the browser still loses the 3D view, a notice appears and the page reloads by itself with what you built saved; if it happens again right away, it offers a button instead of reloading in a loop.","v9, arreglo: cada flecha disparada dejaba su malla ocupando memoria gr\xE1fica, y al empezar otra partida tambi\xE9n las dianas y los postes; ahora se liberan. Si el navegador pierde el dibujo 3D, aviso y recarga sola, como en la construcci\xF3n.":"v9, fix: every arrow fired left its mesh in graphics memory, and so did the targets and posts when starting another match; now they are freed. If the browser loses the 3D view, a notice and automatic reload, as in construction.","Combate \xB7 v9":"Combat \xB7 v9","v7: arreglo de la pantalla en blanco en el m\xF3vil (la construcci\xF3n dejaba la memoria gr\xE1fica llena al rehacer las piezas) y aviso con recarga si se pierde el dibujo 3D. Los muros, postes y vigas con el estilo elegido. Es la construcci\xF3n v12, el combate v9 y el personaje v14.":"v7: fix for the blank screen on mobile (construction filled graphics memory when rebuilding pieces) and a notice with reload if the 3D view is lost. Walls, posts and beams in the chosen style. It is construction v12, combat v9 and character v14.","Demo \xFAnica \xB7 v7 (sin pantalla en blanco; muros con el estilo)":"Single demo \xB7 v7 (no blank screen; walls in the style)","Hito 1 \xB7 v13":"Milestone 1 \xB7 v13","Hito 1 \xB7 v14":"Milestone 1 \xB7 v14","Combate \xB7 v10":"Combat \xB7 v10","Demo \xFAnica \xB7 v9 (escena con el estilo v5 en \xABConstruir\xBB y \xABDuelo\xBB)":"Single demo \xB7 v9 (scene in the v5 style in \u201CBuild\u201D and \u201CDuel\u201D)","v14: la escena como la prueba de estilo v5: hierba densa con flores tambi\xE9n en el centro, matorrales, calvas de tierra pisada, rocas m\xE1s cerca y algunos \xE1rboles de copa sueltos a partir de 22 m. Donde se construye en la planta baja, y bajo los muebles del suelo y el moj\xF3n, la hierba, las flores y las matas se esconden solas; si se quita la pieza, vuelven. Las matas escondidas no chocan.":"v14: the scene like the v5 style test: dense grass with flowers in the centre too, bushes, patches of trodden earth, rocks closer in and a few loose broadleaf trees from 22 m. Where you build on the ground floor, and under floor furniture and the boundary stone, grass, flowers and bushes hide themselves; if the piece is removed, they come back. Hidden bushes do not block.","v10: alrededor de la liza, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra pisada, rocas y algunos \xE1rboles de copa sueltos antes del bosque.":"v10: around the lists, the scene like the v5 style test: dense grass with flowers, bushes, patches of trodden earth, rocks and a few loose broadleaf trees before the forest.","v9: en \xABConstruir\xBB y en \xABDuelo\xBB, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra, rocas y \xE1rboles sueltos; la hierba ya no asoma por lo construido. Es la construcci\xF3n v14 y el combate v10.":"v9: in \u201CBuild\u201D and \u201CDuel\u201D, the scene like the v5 style test: dense grass with flowers, bushes, patches of earth, rocks and loose trees; grass no longer pokes through what you build. It is construction v14 and combat v10.","v16: los tejados con el estilo elegido (la caba\xF1a de la prueba de estilo v5). La paja va en dos hiladas gruesas y redondeadas, con mechones en el alero y la cumbrera redonda; las tablillas, en filas solapadas y desplazadas, con tabla de remate en los lados y caballete en la cumbrera. Bajo el tejado se cierra con tablas de pie (muros de troncos y de tablas), con barro y estacas (zarzo) o con encalado y postes (entramado). Los tramos de paja que van de lado se juntan sin surco. (La v15 pas\xF3 al estilo los cimientos, los suelos y las escaleras.)":"v16: roofs in the chosen style (the cabin from style test v5). Thatch comes in two thick, rounded courses, with tufts at the eaves and a rounded ridge; shingles come in overlapping, staggered rows, with a barge board on the sides and a ridge cap. Under the roof the gap is closed with upright boards (log and plank walls), with mud and stakes (wattle) or with whitewash and posts (timber frame). Thatch sections placed side by side join without a groove. (v15 brought foundations, floors and stairs to the style.)","v10: en \xABConstruir\xBB, los cimientos, los suelos y las escaleras con el estilo v5. Es la construcci\xF3n v15.":"v10: in \u201CBuild\u201D, foundations, floors and stairs in the v5 style. It is construction v15.","v11: en \xABConstruir\xBB, los tejados de paja y de tablillas, y lo que cierra bajo el tejado, con el estilo v5. Es la construcci\xF3n v16.":"v11: in \u201CBuild\u201D, thatched and shingle roofs, and what closes the gap under the roof, in the v5 style. It is construction v16.","Demo \xFAnica \xB7 v11 (tejados con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v11 (roofs in the v5 style in \u201CBuild\u201D)","Hito 1 \xB7 v16":"Milestone 1 \xB7 v16","v17: las puertas, la cerca, el portillo, la empalizada y su puerta, y el moj\xF3n con el estilo elegido (el de la prueba de estilo v5). La puerta de tablas es como la de la caba\xF1a de la prueba: cuatro tablas, peinazos por detr\xE1s, bisagras largas de hierro y tirador de argolla; la de varas lleva varas atadas con cuerda y tornapunta. La cerca y el portillo, postes redondos con el corte claro arriba y varas atadas; la empalizada, troncos descortezados de distinto alto con la punta tallada; su puerta, tablones con pletinas de hierro y argolla. El moj\xF3n, piedras apiladas y una vara con un trapo atado.":"v17: doors, the fence, the fence gate, the palisade and its gate, and the boundary stone in the chosen style (that of style test v5). The plank door is like the one on the test cabin: four planks, battens on the back, long iron hinges and a ring handle; the pole door has poles tied with rope and a diagonal brace. The fence and the gate have round posts with the light cut end on top and tied poles; the palisade, debarked logs of different heights with carved points; its gate, planks with iron straps and a ring. The boundary stone is a pile of stones and a pole with a rag tied to it.","v12: en \xABConstruir\xBB, las puertas, las cercas, el portillo, la empalizada y el moj\xF3n con el estilo v5. Es la construcci\xF3n v17.":"v12: in \u201CBuild\u201D, doors, fences, the fence gate, the palisade and the boundary stone in the v5 style. It is construction v17.","Hito 1 \xB7 v17":"Milestone 1 \xB7 v17","Demo \xFAnica \xB7 v12 (puertas, cercas, empalizada y moj\xF3n con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v12 (doors, fences, palisade and boundary stone in the v5 style in \u201CBuild\u201D)","v18: los muebles con el estilo elegido (el de la prueba de estilo v5). La cama de paja, un marco de troncos con la paja amontonada, un jerg\xF3n de lino y una manta de lana; la de madera, postes, largueros y cabecero de tablas, colch\xF3n y almohada de lino y manta. La mesa, tres tablas sobre dos caballetes; el banco, como el de la prueba; el taburete, una rodaja con tres patas abiertas; el arc\xF3n, tablas con flejes, clavos y cerradura de hierro; el barril, duelas abombadas con dos aros; la estanter\xEDa, con trasera de tablas, vasijas de barro, un cuenco y un rollo de pa\xF1o; la antorcha de pie, una vara entre piedras con un cesto de hierro y estopa; la alfombra, una piel curtida con su forma; el estandarte, un pa\xF1o con pliegues, dos puntas y una banda.":"v18: furniture in the chosen style (that of style test v5). The straw bed is a log frame with heaped straw, a linen pallet and a wool blanket; the wooden bed has posts, side rails and a plank headboard, a linen mattress and pillow and a blanket. The table is three planks on two trestles; the bench is like the one in the test; the stool is a log slice with three splayed legs; the chest is planks with iron straps, nails and a lock; the barrel has bulging staves and two hoops; the shelf has a plank back, clay jars, a bowl and a roll of cloth; the standing torch is a pole among stones with an iron basket and tow; the rug is a tanned hide with its natural shape; the banner is a folded cloth with two tails and a band.","v13: en \xABConstruir\xBB, los muebles con el estilo v5. Es la construcci\xF3n v18.":"v13: in \u201CBuild\u201D, furniture in the v5 style. It is construction v18.","Hito 1 \xB7 v18":"Milestone 1 \xB7 v18","Demo \xFAnica \xB7 v13 (muebles con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v13 (furniture in the v5 style in \u201CBuild\u201D)","Hito 1 \xB7 v19":"Milestone 1 \xB7 v19","Combate \xB7 v11":"Combat \xB7 v11","Demo \xFAnica \xB7 v14 (armas, hacha y pieza al construir con el estilo v5)":"Single demo \xB7 v14 (weapons, axe and build preview in the v5 style)","v19: lo que quedaba con el aspecto inicial, con el estilo elegido (el de la prueba de estilo v5). La pieza que se ve al construir ya no es un bloque verde o rojo: es la propia pieza, con su madera, su piedra o su paja, transl\xFAcida y con un velo verde si cabe o rojo si no. Al desmontar, lo que se quita y lo que caer\xEDa se ven igual, con un velo naranja o rojo. Al talar, el personaje lleva un hacha en la mano (mango de fresno y cabeza de hierro, como la del toc\xF3n de la prueba); solo sale mientras tala.":"v19: what was left with the initial look now has the chosen style (that of style test v5). The piece you see while building is no longer a green or red block: it is the piece itself, with its wood, stone or straw, see-through and with a green veil if it fits or a red one if it doesn't. When dismantling, what is removed and what would fall look the same, with an orange or red veil. When felling, the character holds an axe (ash handle and iron head, like the one on the stump in the test); it only appears while felling.","v11: las armas y lo de la liza con el estilo elegido (el de la prueba de estilo v5). Las espadas, con la hoja de secci\xF3n de rombo y su vaceo, el pu\xF1o forrado de cuero con su atadura, la cruz y el pomo de rueda de hierro; el palo, una vara descortezada con nudos; el arco, de una pieza, m\xE1s fino hacia las puntas y con el pu\xF1o de cuero; el escudo, seis tablas con veta, el canto forrado de cuero cosido y el umbo con clavos; la flecha, con punta de hierro y tres plumas atadas. El poste de pr\xE1ctica lleva dos haces de paja atados y piedras al pie; la diana es un haz de paja con un pa\xF1o pintado con tierras (ocre, almagre y carb\xF3n) en vez de los anillos de colores vivos. Las cintas que distinguen a los luchadores son ahora de pa\xF1o te\xF1ido, azul de glasto y amarillo de gualda, m\xE1s apagados.":"v11: the weapons and the things in the lists with the chosen style (that of style test v5). The swords have a diamond-section blade with its fuller, a leather-wrapped grip with its binding, and an iron cross and wheel pommel; the staff is a peeled rod with knots; the bow is a single piece, thinner towards the tips, with a leather grip; the shield has six grained planks, a stitched leather-covered rim and a boss with nails; the arrow has an iron head and three bound feathers. The practice post has two bound bundles of straw and stones at its foot; the target is a straw bundle with a cloth painted with earth pigments (ochre, red ochre and charcoal) instead of the bright coloured rings. The bands that tell the fighters apart are now dyed cloth, woad blue and weld yellow, more muted.","v14: lo que quedaba con el aspecto inicial, con el estilo v5: en \xABConstruir\xBB, la pieza que se ve al colocar (la propia pieza, transl\xFAcida, con un velo verde o rojo), lo que se marca al desmontar y el hacha en la mano al talar; en \xABDuelo\xBB, las espadas, el palo, el arco, el escudo, la flecha, el poste de pr\xE1ctica y la diana. Es la construcci\xF3n v19 y el combate v11.":"v14: what was left with the initial look, now in the v5 style: in \u201CBuild\u201D, the piece you see while placing (the piece itself, see-through, with a green or red veil), what is marked when dismantling and the axe in hand when felling; in \u201CDuel\u201D, the swords, the staff, the bow, the shield, the arrow, the practice post and the target. It is construction v19 and combat v11.","v10: junto a un \xE1rbol, Usar (F) hace que el personaje tale; moverse lo para. De momento es solo el gesto (desde la v19, con el hacha en la mano), sin dar madera: recolectar llega con el hito 2.":"v10: next to a tree, Use (F) makes the character fell it; moving stops it. For now it is only the motion (since v19, with the axe in hand), without giving wood: gathering comes with milestone 2.","Cavar \xB7 v1 (prueba de rendimiento)":"Digging \xB7 v1 (performance test)","v1: prueba de rendimiento de cavar con \xABv\xF3xeles suavizados\xBB (decidido por valravnx el 27 oct). La roca se divide en cubitos de 50 cm, en trozos de 8 m; cada golpe de pico (clic o toque sobre la roca) quita un pu\xF1ado redondeado de unos 80 cm de radio (galer\xEDas de algo m\xE1s de 1,5 m). La pared se dibuja lisa alrededor de los cubitos, con la rugosidad de la roca sacada de una semilla fija: todos ver\xEDan la misma cueva.":"v1: performance test for digging with \xABsmooth voxels\xBB (decided by valravnx on 27 Oct). The rock is split into 50 cm small cubes, in 8 m chunks; each pick stroke (click or tap on the rock) removes a rounded handful about 80 cm in radius (galleries a little over 1.5 m). The wall is drawn smooth around the cubes, with the rock's roughness taken from a fixed seed: everyone would see the same cave.","v1: arriba a la derecha se mide lo que tarda en rehacerse la malla de los trozos tocados en cada golpe (media y peor) y los fotogramas. \xABCavar t\xFAnel\xBB abre solo un t\xFAnel en la ladera para medir sin tener que tocar.":"v1: at the top right it measures how long it takes to rebuild the mesh of the touched chunks on each stroke (average and worst) and the frame rate. \xABDig tunnel\xBB opens a tunnel in the hillside by itself so you can measure without touching.","v1, provisional: no hay personaje ni pico todav\xEDa (se cava tocando la roca con la c\xE1mara libre), ni se oculta lo de encima, ni hay negro ni entibado: son las tareas siguientes del hito 1g.":"v1, provisional: there is no character or pick yet (you dig by touching the rock with the free camera), what is above is not hidden yet, and there is no black or timbering: those are the next tasks of milestone 1g.","{fps} fps \xB7 {tri} mil tri\xE1ngulos \xB7 malla por golpe: {media} ms de media, {peor} ms el peor ({n} golpes)":"{fps} fps \xB7 {tri}k triangles \xB7 mesh per stroke: {media} ms average, {peor} ms worst ({n} strokes)","Cavar t\xFAnel":"Dig tunnel","Toca o haz clic en la roca para cavar. Arrastra para girar la c\xE1mara.":"Tap or click on the rock to dig. Drag to turn the camera.","Mapa del mundo \xB7 boceto v1":"World map \xB7 sketch v1","Roca y nieve":"Rock and snow","Pasto alpino":"Alpine pasture","Bosque de con\xEDferas":"Conifer forest",Brezal:"Heath","Bosque caducifolio":"Deciduous forest","Bosque mixto con claros":"Mixed forest with clearings",Pradera:"Grassland",Encinar:"Holm oak woodland","Matorral seco":"Dry scrub",Turbera:"Peat bog",Granito:"Granite",Pizarra:"Slate",Caliza:"Limestone",Arenisca:"Sandstone","Hierro de pantano (poco y malo)":"Bog iron (scarce and poor)","Veta de hierro":"Iron vein",Carb\u00F3n:"Coal","Silueta del continente":"Shape of the land",Cordilleras:"Mountain ranges","R\xEDos y valles":"Rivers and valleys","Clima y biomas":"Climate and biomes",Pa\u00EDses:"Countries","Roca y vetas":"Rock and veins",Listo:"Done","arroyo de {a} m":"{a} m stream","r\xEDo de {a} m":"{a} m river","gran r\xEDo de {a} m":"{a} m great river","Gran r\xEDo (m\xE1s de 40 m)":"Great river (over 40 m)","R\xEDo (5 a 40 m)":"River (5 to 40 m)","Arroyo (menos de 5 m)":"Stream (under 5 m)","Pa\xEDs {n}":"Country {n}","isla sin pa\xEDs":"island with no country","Semilla {s} \xB7 mundo de {l} \xD7 {l} km \xB7 tierra {t} km\xB2 \xB7 cumbre m\xE1s alta {c} m \xB7 la isla est\xE1 a {i} km de la costa m\xE1s cercana \xB7 desembocan {g} grandes r\xEDos y {r} r\xEDos. Toca el mapa para ver qu\xE9 hay en cada sitio.":"Seed {s} \xB7 world of {l} \xD7 {l} km \xB7 land {t} km\xB2 \xB7 highest peak {c} m \xB7 the island is {i} km from the nearest coast \xB7 {g} great rivers and {r} rivers reach the sea. Tap the map to see what is in each place.","Mar \xB7 {x}, {y} km":"Sea \xB7 {x}, {y} km","{h} m de altura":"{h} m high","{t} \xB0C de media":"{t} \xB0C on average",Relieve:"Relief",Biomas:"Biomes",Roca:"Rock",R\u00EDos:"Rivers",Vetas:"Veins","Otra semilla":"Another seed",Semilla:"Seed","Toca el mapa para ver qu\xE9 hay en cada sitio.":"Tap the map to see what is in each place.","Generando el mundo\u2026":"Generating the world\u2026","Kinhold Mapa":"Kinhold Map","188 km":"188 km","256 km":"256 km","v1: primer boceto del mundo, generado por semilla (la misma semilla da siempre el mismo mundo). Sin figuras fijas: la forma de las tierras se suma con muchas piezas al azar (colinas grandes para la masa del continente y peque\xF1as para pen\xEDnsulas, cabos e islas; sierras; fosas que abren golfos, r\xEDas y brazos de mar; hoyas que dejan mares interiores), con las distancias deformadas por ruido y un ruido fractal encima, porque las costas de verdad son irregulares a todas las escalas. Es el m\xE9todo de los generadores de mapas de fantas\xEDa m\xE1s conocidos.":"v1: first sketch of the world, generated from a seed (the same seed always gives the same world). No fixed shapes: the shape of the land is built up from many random pieces (large hills for the bulk of the continent and small ones for peninsulas, capes and islands; mountain ranges; troughs that open gulfs, inlets and sea arms; basins that leave inland seas), with distances warped by noise and fractal noise on top, because real coastlines are irregular at every scale. It is the method used by the best-known fantasy map generators.","v1: hay siempre una isla grande que es un pa\xEDs entero, a m\xE1s de 20 km de mar de cualquier otra costa (en las pruebas salen entre 30 y 60 km): solo se llega en barco, para que haya rutas de comercio por mar. Se forma con varias colinas en fila y su sierra, as\xED que sale alargada e irregular; mide unos 1.800 a 2.400 km\xB2, algo menos que los pa\xEDses del continente.":"v1: there is always a large island that is a whole country, more than 20 km of sea from any other coast (between 30 and 60 km in the tests): it can only be reached by boat, so that there are sea trade routes. It is made of several hills in a row plus its own range, so it comes out elongated and irregular; it measures about 1,800 to 2,400 km\xB2, somewhat less than the mainland countries.","v1: el relieve sale del levantamiento de las cordilleras y de la erosi\xF3n de los r\xEDos (primero el agua, despu\xE9s el terreno, como dice el GDD). Las cumbres llegan a unos 3.000 m y los tramos bajos de cada sierra son los collados por donde cruzar. Algunas sierras salen hacia el mar y hacen pen\xEDnsulas largas con su espinazo.":"v1: the relief comes from the uplift of the mountain ranges and the erosion of the rivers (water first, then terrain, as the GDD says). Peaks reach about 3,000 m and the low stretches of each range are the passes to cross. Some ranges run out to sea and make long peninsulas with their spine.","v1: el ancho de cada r\xEDo sale del \xE1rea que drena, con la regla de los r\xEDos de verdad (el ancho crece con la ra\xEDz del caudal): arroyos de menos de 5 m, r\xEDos de 5 a 40 m y grandes r\xEDos de m\xE1s de 40 m. Con tierras de este tama\xF1o casi no salen grandes r\xEDos: hace falta una cuenca de unos 4.000 km\xB2.":"v1: the width of each river comes from the area it drains, following the rule of real rivers (width grows with the square root of discharge): streams under 5 m, rivers from 5 to 40 m and great rivers over 40 m. With lands of this size almost no great rivers form: they need a basin of about 4,000 km\xB2.","v1: clima por latitud (fr\xEDo al norte, templado en medio, c\xE1lido y m\xE1s seco al sur) y por altura; la lluvia la trae el viento del oeste y cae al subir las sierras, as\xED que las laderas de levante quedan m\xE1s secas.":"v1: climate by latitude (cold in the north, temperate in the middle, warm and drier in the south) and by altitude; rain comes with the west wind and falls as it climbs the ranges, so the eastern slopes are drier.","v1, provisional: cinco pa\xEDses que crecen desde un centro llano y se frenan en las cumbres y en los r\xEDos grandes (fronteras naturales), equilibrados para que midan parecido. Se llaman Pa\xEDs 1 a 5 hasta que valravnx les ponga nombre. Las islas peque\xF1as sueltas no son de nadie de momento.":"v1, provisional: five countries that grow from a flat centre and are slowed by peaks and great rivers (natural borders), balanced so they are similar in size. They are called Country 1 to 5 until valravnx names them. Small loose islands belong to no one for now.","v1: roca madre por provincias: granito y pizarra en el coraz\xF3n de las sierras, caliza en sus faldas y arenisca en las llanuras. Hierro de pantano (poco y malo) en las turberas; vetas de hierro donde el granito o la pizarra tocan la caliza; carb\xF3n en la arenisca al pie de las sierras.":"v1: bedrock by provinces: granite and slate at the heart of the ranges, limestone on their flanks and sandstone in the plains. Bog iron (scarce and poor) in the peat bogs; iron veins where granite or slate meets limestone; coal in the sandstone at the foot of the ranges.","v1: toca el mapa para ver la altura, el bioma, la roca, el pa\xEDs y el r\xEDo de ese punto. La semilla se puede cambiar; el enlace con ?semilla= abre ese mundo.":"v1: tap the map to see the altitude, biome, rock, country and river at that point. The seed can be changed; a link with ?semilla= opens that world.",Leyenda:"Legend","v1, propuesta: arriba se elige el tama\xF1o del mundo. Con 188 km (el del GDD) los pa\xEDses del continente salen de unos 3.000 km\xB2 (unos 55 \xD7 55 km) y la isla, de unos 900 km\xB2; con 256 km, de unos 5.700 km\xB2 (unos 75 \xD7 75) y la isla, de unos 2.000 km\xB2. Sale por defecto el de 256 para que la isla sea un pa\xEDs de verdad. Lo decide valravnx.":"v1, proposal: the world size is chosen at the top. With 188 km (the GDD size) the mainland countries come out at about 3,000 km\xB2 (about 55 \xD7 55 km) and the island at about 900 km\xB2; with 256 km, about 5,700 km\xB2 (about 75 \xD7 75) and the island about 2,000 km\xB2. 256 is the default so that the island is a real country. valravnx decides.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Arrastra un dedo por una zona libre para girar la c\xE1mara.":"Joystick on the left to move; near the opponent the sides circle around him. Drag one finger over an empty area to turn the camera.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta. Si llevas el dedo cerca del borde, la c\xE1mara gira hacia ese lado.":"<b>Bow and stones:</b> hold your finger to draw, drag to aim and release. If you take your finger near the edge, the camera turns that way.","v12: c\xE1mara t\xE1ctil con un dedo, como dice el GDD. Arrastrar un dedo por una zona libre de la pantalla gira la c\xE1mara (antes hac\xEDan falta dos); un toque sin arrastrar no la mueve (cuenta como arrastre a partir de 10 px, decisi\xF3n provisional). Tocar la rosa sigue golpeando al instante. El dedo del joystick ya no cuenta como segundo dedo. Con arco o piedras, si al apuntar llevas el dedo m\xE1s all\xE1 del 35% desde el centro hacia un borde, la c\xE1mara gira hacia ese lado, m\xE1s deprisa cuanto m\xE1s cerca del borde (hasta 1,4 rad/s; valores provisionales).":"v12: one-finger touch camera, as the GDD says. Dragging one finger over an empty part of the screen turns the camera (two were needed before); a tap without dragging does not move it (it counts as a drag from 10 px, a provisional decision). Tapping the rose still strikes at once. The joystick finger no longer counts as a second finger. With the bow or stones, if while aiming you take your finger more than 35% from the centre towards an edge, the camera turns that way, faster the closer to the edge (up to 1.4 rad/s; provisional values).","Combate \xB7 v12":"Combat \xB7 v12"};var Ua={Moj\u00F3n:"\u041C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C","v22, arreglo (valravnx: la cama se iba al altillo estando debajo): la decoraci\xF3n solo se apunta a los suelos y cimientos de la planta en la que est\xE1s, aunque el piso de arriba se vea en la pantalla por delante; arriba, fuera de los suelos de tu planta, no se pone.":"v22, \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 (valravnx: \u043A\u0440\u043E\u0432\u0430\u0442\u044C \u0443\u0445\u043E\u0434\u0438\u043B\u0430 \u043D\u0430 \u0430\u043D\u0442\u0440\u0435\u0441\u043E\u043B\u044C, \u043A\u043E\u0433\u0434\u0430 \u0441\u0442\u043E\u0438\u0448\u044C \u043F\u043E\u0434 \u043D\u0435\u0439): \u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 \u043F\u043E\u043B\u044B \u0438 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0442\u043E\u0433\u043E \u044D\u0442\u0430\u0436\u0430, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u043E\u043C \u0432\u044B \u0441\u0442\u043E\u0438\u0442\u0435, \u0434\u0430\u0436\u0435 \u0435\u0441\u043B\u0438 \u0432\u0435\u0440\u0445\u043D\u0438\u0439 \u043F\u043E\u043B \u0432\u0438\u0434\u0435\u043D \u043D\u0430 \u044D\u043A\u0440\u0430\u043D\u0435 \u0432\u043F\u0435\u0440\u0435\u0434\u0438; \u043D\u0430\u0432\u0435\u0440\u0445\u0443 \u0432\u043D\u0435 \u043F\u043E\u043B\u043E\u0432 \u0432\u0430\u0448\u0435\u0433\u043E \u044D\u0442\u0430\u0436\u0430 \u0438\u0445 \u043D\u0435 \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C.","v22: los cimientos y los suelos de troncos ya no dejan ver el suelo de debajo por las juntas entre tronco y tronco: llevan debajo un relleno oscuro que tapa del todo.":"v22: \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0438 \u043F\u043E\u043B\u044B \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442 \u0437\u0435\u043C\u043B\u044E \u0432 \u0449\u0435\u043B\u044F\u0445 \u043C\u0435\u0436\u0434\u0443 \u0431\u0440\u0451\u0432\u043D\u0430\u043C\u0438: \u043F\u043E\u0434 \u043D\u0438\u043C\u0438 \u0442\u0451\u043C\u043D\u0430\u044F \u0437\u0430\u0441\u044B\u043F\u043A\u0430, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u0432\u0441\u0451.","v17: en \xABConstruir\xBB, la decoraci\xF3n va al suelo de la planta en la que est\xE1s (ya no al piso de arriba) y los cimientos y suelos de troncos tapan del todo. Es la construcci\xF3n v22.":"v17: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u043D\u0430 \u043F\u043E\u043B \u044D\u0442\u0430\u0436\u0430, \u0433\u0434\u0435 \u0432\u044B \u0441\u0442\u043E\u0438\u0442\u0435 (\u0430 \u043D\u0435 \u043D\u0430 \u0432\u0435\u0440\u0445\u043D\u0438\u0439), \u0430 \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0438 \u043F\u043E\u043B\u044B \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0432\u0441\u0451. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v22.","Hito 1 \xB7 v22":"\u042D\u0442\u0430\u043F 1 \xB7 v22","Demo \xFAnica \xB7 v17 (decoraci\xF3n en el suelo de tu planta y suelos de troncos sin huecos)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v17 (\u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u043D\u0430 \u043F\u043E\u043B\u0443 \u0432\u0430\u0448\u0435\u0433\u043E \u044D\u0442\u0430\u0436\u0430 \u0438 \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u043F\u043E\u043B\u044B \u0431\u0435\u0437 \u0449\u0435\u043B\u0435\u0439)","v21: se construye por obras (decidido por valravnx el 26 oct). Colocar pone solo el marco de la pieza, que se ve tenue dentro de un armaz\xF3n de varas atadas y a\xFAn no cuesta nada. Junto a la obra, Usar (F) le lleva el material que le falta y te pones a construir; moverse lo para y se retoma con Usar. Cada pieza tarda 4 s m\xE1s 1 s por cada 20 kg (el GDD no da cifras: provisional); por ejemplo, un poste 7 s, un muro de troncos 19 s y un cimiento de piedra 24 s. Si te ayudan, se suman los segundos de todos y se acaba antes. La obra a medias guarda lo entregado y el trabajo, con qui\xE9n llev\xF3 cada cosa y qui\xE9n trabaj\xF3 cu\xE1nto.":"v21: \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443 (\u0440\u0435\u0448\u0435\u043D\u0438\u0435 valravnx \u043E\u0442 26 \u043E\u043A\u0442.). \xAB\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C\xBB \u0441\u0442\u0430\u0432\u0438\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u043A\u0430\u0440\u043A\u0430\u0441 \u0434\u0435\u0442\u0430\u043B\u0438: \u043E\u043D\u0430 \u0432\u0438\u0434\u043D\u0430 \u0431\u043B\u0435\u0434\u043D\u043E \u0432\u043D\u0443\u0442\u0440\u0438 \u043A\u0430\u0440\u043A\u0430\u0441\u0430 \u0438\u0437 \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u0436\u0435\u0440\u0434\u0435\u0439 \u0438 \u043F\u043E\u043A\u0430 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0441\u0442\u043E\u0438\u0442. \u0420\u044F\u0434\u043E\u043C \u0441\u043E \u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u043D\u0435\u0434\u043E\u0441\u0442\u0430\u044E\u0449\u0438\u0439 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B, \u0438 \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0441\u0442\u0440\u043E\u0438\u0442\u044C; \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043F\u0440\u0435\u0440\u044B\u0432\u0430\u0435\u0442 \u0440\u0430\u0431\u043E\u0442\u0443, \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0435\u0442 \u0435\u0451. \u041A\u0430\u0436\u0434\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F 4 \u0441 \u043F\u043B\u044E\u0441 1 \u0441 \u043D\u0430 \u043A\u0430\u0436\u0434\u044B\u0435 20 \u043A\u0433 (\u0432 GDD \u0446\u0438\u0444\u0440 \u043D\u0435\u0442: \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E); \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u0441\u0442\u043E\u043B\u0431 7 \u0441, \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 19 \u0441, \u043A\u0430\u043C\u0435\u043D\u043D\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442 24 \u0441. \u0415\u0441\u043B\u0438 \u043F\u043E\u043C\u043E\u0433\u0430\u044E\u0442, \u0441\u0435\u043A\u0443\u043D\u0434\u044B \u0432\u0441\u0435\u0445 \u0441\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u044E\u0442\u0441\u044F, \u0438 \u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0437\u0430\u043A\u0430\u043D\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0431\u044B\u0441\u0442\u0440\u0435\u0435. \u041D\u0435\u0434\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0445\u0440\u0430\u043D\u0438\u0442 \u043F\u0440\u0438\u043D\u0435\u0441\u0451\u043D\u043D\u043E\u0435 \u0438 \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0443\u044E \u0440\u0430\u0431\u043E\u0442\u0443: \u043A\u0442\u043E \u0447\u0442\u043E \u043F\u0440\u0438\u043D\u0451\u0441 \u0438 \u043A\u0442\u043E \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0431\u043E\u0442\u0430\u043B.","v21: una obra a medias no sostiene nada (no se pone nada encima hasta terminarla), no corta el paso ni se puede pisar, y su peso ya cuenta al poner el marco, as\xED que al terminarla aguanta seguro. Una puerta en obras no se abre. Al desmontar una obra a medias se recupera entero lo que se le hab\xEDa llevado.":"v21: \u043D\u0435\u0434\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u043D\u0438\u0447\u0435\u0433\u043E 43F\u043E\u0434\u043D\u0438\u043C\u0430\u0442\u044C \u0435\u0433\u043E \u0432\u0440\u0443\u0447\u043D\u0443\u044E \u043D\u0430 \u0432\u044B\u0441\u043E\u0442\u0443 \u0441\u0442\u0440\u043E\u0439\u043A\u0438, \u043B\u0435\u0441\u0430 \u0438 \u0431\u043B\u043E\u043A\u0438 \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0445 \u0437\u0430\u0434\u0430\u0447\u0430\u0445. \u041C\u0435\u0431\u0435\u043B\u044C \u0438 \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u043F\u043E-\u043F\u0440\u0435\u0436\u043D\u0435\u043C\u0443 \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u0441\u0440\u0430\u0437\u0443.","Hito 1 \xB7 v21":"\u042D\u0442\u0430\u043F 1 \xB7 v21","v16: en \xABConstruir\xBB, se construye por obras: colocar pone el marco, Usar (F) junto a la obra le lleva el material y te pone a construir, y cada pieza tarda un tiempo seg\xFAn su peso. Es la construcci\xF3n v21.":"v16: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443: \xAB\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C\xBB \u0441\u0442\u0430\u0432\u0438\u0442 \u043A\u0430\u0440\u043A\u0430\u0441, \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u0440\u044F\u0434\u043E\u043C \u0441\u043E \u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442 \u0440\u0430\u0431\u043E\u0442\u0443, \u0430 \u043A\u0430\u0436\u0434\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F \u0432\u0440\u0435\u043C\u044F \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043C\u043E\u0441\u0442\u0438 \u043E\u0442 \u0432\u0435\u0441\u0430. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v21.","Demo \xFAnica \xB7 v16 (se construye por obras: marco, material y tiempo)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v16 (\u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443: \u043A\u0430\u0440\u043A\u0430\u0441, \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u0432\u0440\u0435\u043C\u044F)","Esa pieza ya est\xE1 terminada.":"\u042D\u0442\u0430 \u0434\u0435\u0442\u0430\u043B\u044C \u0443\u0436\u0435 \u0437\u0430\u043A\u043E\u043D\u0447\u0435\u043D\u0430.","A esa obra no le falta ese material.":"\u042D\u0442\u043E\u0439 \u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u043D\u0435 \u043D\u0443\u0436\u0435\u043D \u044D\u0442\u043E\u0442 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B.","Rato de trabajo no v\xE1lido.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E\u0435 \u0432\u0440\u0435\u043C\u044F \u0440\u0430\u0431\u043E\u0442\u044B.","Primero hay que llevarle todo el material.":"\u0421\u043D\u0430\u0447\u0430\u043B\u0430 \u043D\u0443\u0436\u043D\u043E \u043F\u0440\u0438\u043D\u0435\u0441\u0442\u0438 \u0432\u0435\u0441\u044C \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B.","Est\xE1 en obras.":"\u042D\u0442\u043E \u0435\u0449\u0451 \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F.","No hay obra ah\xED.":"\u0422\u0430\u043C \u043D\u0435\u0442 \u0441\u0442\u0440\u043E\u0439\u043A\u0438.","Marco puesto. Ac\xE9rcate y pulsa Usar (F) para llevarle el material y construirla.":"\u041A\u0430\u0440\u043A\u0430\u0441 \u043F\u043E\u0441\u0442\u0430\u0432\u043B\u0435\u043D. \u041F\u043E\u0434\u043E\u0439\u0434\u0438\u0442\u0435 \u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F), \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0438\u043D\u0435\u0441\u0442\u0438 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u043F\u043E\u0441\u0442\u0440\u043E\u0438\u0442\u044C.","Le falta":"\u041D\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442","Material entregado.":"\u041C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u043F\u0440\u0438\u043D\u0435\u0441\u0451\u043D.","Construyendo:":"\u0421\u0442\u0440\u043E\u0438\u0442\u0441\u044F:","terminada.":"\u0433\u043E\u0442\u043E\u0432\u043E.","Dejas la obra (vuelve con Usar).":"\u0412\u044B \u043E\u0441\u0442\u0430\u0432\u0438\u043B\u0438 \u0441\u0442\u0440\u043E\u0439\u043A\u0443 (\u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C \u2014 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB).","Cimiento de piedra":"\u041A\u0430\u043C\u0435\u043D\u043D\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442","Cimiento de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442","Suelo de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0439 \u043F\u043E\u043B","Suelo de tablas":"\u0414\u043E\u0449\u0430\u0442\u044B\u0439 \u043F\u043E\u043B",Poste:"\u0421\u0442\u043E\u043B\u0431",Viga:"\u0411\u0430\u043B\u043A\u0430","Muro de zarzo y barro":"\u041F\u043B\u0435\u0442\u0435\u043D\u044C \u0441 \u0433\u043B\u0438\u043D\u043E\u0439","Muro de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430","Muro de troncos con puerta":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 \u0441 \u0434\u0432\u0435\u0440\u043D\u044B\u043C \u043F\u0440\u043E\u0451\u043C\u043E\u043C","Muro de troncos con ventana":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 \u0441 \u043E\u043A\u043D\u043E\u043C","Muro de entramado":"\u0424\u0430\u0445\u0432\u0435\u0440\u043A\u043E\u0432\u0430\u044F \u0441\u0442\u0435\u0 3D\u0435\u043B\u044C\u0437\u044F \u0443\u043F\u0430\u0441\u0442\u044C), \u0438 \u0435\u0441\u0442\u044C \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430 \u0434\u043B\u044F \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v13.","Portillo de varas":"\u041F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430","Hito 1 \xB7 v12":"\u042D\u0442\u0430\u043F 1 \xB7 v12","v13: barandillas. El medio muro hace de barandilla en el borde de un suelo en alto o alrededor del hueco de una escalera de tablas: se apoya en el suelo de al lado (o en el muro de debajo) y no deja pasar, as\xED que por ah\xED ya no se cae. Por el lado por el que se sale de la escalera hay que dejarlo abierto.":"v13: \u043F\u0435\u0440\u0438\u043B\u0430. \u041F\u043E\u043B\u0443\u0441\u0442\u0435\u043D\u0430 \u0441\u043B\u0443\u0436\u0438\u0442 \u043F\u0435\u0440\u0438\u043B\u0430\u043C\u0438 \u043D\u0430 \u043A\u0440\u0430\u044E \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043F\u043E\u043B\u0430 \u0438\u043B\u0438 \u0432\u043E\u043A\u0440\u0443\u0433 \u043F\u0440\u043E\u0451\u043C\u0430 \u0434\u043E\u0449\u0430\u0442\u043E\u0439 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B: \u043E\u043D\u0430 \u043E\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u043F\u043E\u043B (\u0438\u043B\u0438 \u043D\u0430 \u0441\u0442\u0435\u043D\u0443 \u043F\u043E\u0434 \u043D\u0435\u0439) \u0438 \u043D\u0435 \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0430\u0435\u0442, \u0442\u0430\u043A \u0447\u0442\u043E \u0443\u043F\u0430\u0441\u0442\u044C \u0442\u0430\u043C \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435\u043B\u044C\u0437\u044F. \u0421\u0442\u043E\u0440\u043E\u043D\u0443, \u0441 \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u0441\u0445\u043E\u0434\u044F\u0442 \u0441 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B, \u043D\u0443\u0436\u043D\u043E \u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u043E\u0442\u043A\u0440\u044B\u0442\u043E\u0439.","v13: portillo de varas para la cerca, para los corrales. Cuesta lo mismo que la puerta de varas (4 varas y 1 cuerda), porque el documento de sistemas no lo dice. Va en el suelo como la cerca y se abre y se cierra con Usar (F); abierto deja pasar.":"v13: \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430 \u0434\u043B\u044F \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u0434\u043B\u044F \u0437\u0430\u0433\u043E\u043D\u043E\u0432. \u0421\u0442\u043E\u0438\u0442 \u0441\u0442\u043E\u043B\u044C\u043A\u043E \u0436\u0435, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u0434\u0432\u0435\u0440\u044C (4 \u0436\u0435\u0440\u0434\u0438 \u0438 1 \u0432\u0435\u0440\u0451\u0432\u043A\u0430), \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0432 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0435 \u0441\u0438\u0441\u0442\u0435\u043C \u044D\u0442\u043E \u043D\u0435 \u0443\u043A\u0430\u0437\u0430\u043D\u043E. \u0421\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u043D\u0430 \u0437\u0435\u043C\u043B\u044E, \u043A\u0430\u043A \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u044C, \u0438 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0438 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F); \u043E\u0442\u043A\u0440\u044B\u0442\u0430\u044F \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0430\u0435\u0442.","Demo \xFAnica \xB7 v6 (el cintur\xF3n de la cota ce\xF1ido)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v6 (\u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u043F\u0440\u0438\u043B\u0435\u0433\u0430\u0435\u0442)","v6: el cintur\xF3n de encima de la cota ya no sobresale hacia los brazos, en las tres partes. Es el personaje v14 (personajes del taller-v7), con la construcci\xF3n v11 y el combate v8.":"v6: \u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u043E\u0440\u0447\u0438\u0442 \u043A \u0440\u0443\u043A\u0430\u043C, \u0432\u043E \u0432\u0441\u0435\u0445 \u0442\u0440\u0451\u0445 \u0447\u0430\u0441\u0442\u044F\u0445. \u042D\u0442\u043E \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v14 (\u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0438\u0437 taller-v7), \u0441\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E\u043C v11 \u0438 \u0431\u043E\u0435\u043C v8.","Personaje \xB7 v14 (el cintur\xF3n de la cota ya no se estira hacia los brazos)":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \xB7 v14 (\u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u044F\u043D\u0435\u0442\u0441\u044F \u043A \u0440\u0443\u043A\u0430\u043C)","v14: el cintur\xF3n de encima de la cota ya no sobresale hacia los lados hasta los brazos (valravnx lo vio en las fotos con los brazos abiertos). Al medir el contorno de la cintura se contaban tambi\xE9n las mangas, y las de la cota bajan hasta la mano, que cuelga a esa altura. Ahora solo cuentan el cuerpo y la falda de la prenda. Personajes en taller-v7; lo dem\xE1s, igual que la v13.":"v14: \u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u043E\u0440\u0447\u0438\u0442 \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u0434\u043E \u0440\u0443\u043A (valravnx \u0437\u0430\u043C\u0435\u0442\u0438\u043B \u044D\u0442\u043E \u043D\u0430 \u0444\u043E\u0442\u043E \u0441 \u0440\u0430\u0437\u0432\u0435\u0434\u0451\u043D\u043D\u044B\u043C\u0438 \u0440\u0443\u043A\u0430\u043C\u0438). \u041F\u0440\u0438 \u0438\u0437\u043C\u0435\u0440\u0435\u043D\u0438\u0438 \u043E\u0431\u0445\u0432\u0430\u0442\u0430 \u0442\u0430\u043B\u0438\u0438 \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u043B\u0438\u0441\u044C \u0438 \u0440\u0443\u043A\u0430\u0432\u0430, \u0430 \u0440\u0443\u043A\u0430\u0432\u0430 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0434\u043E\u0445\u043E\u0434\u044F\u0442 \u0434\u043E \u043A\u0438\u0441\u0442\u0438, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u0432\u0438\u0441\u0438\u0442 \u043D\u0430 \u044D\u0442\u043E\u0439 \u0432\u044B\u0441\u043E\u0442\u0435. \u0422\u0435\u043F\u0435\u0440\u044C \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043A\u043E\u0440\u043F\u0443\u0441 \u0438 \u043F\u043E\u0434\u043E\u043B \u043E\u0434\u0435\u0436\u0434\u044B. \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0432 taller-v7; \u043E\u0441\u0442\u0430\u043B\u044C\u043D\u043E\u0435 \u043A\u0430\u043A \u0432 v13.",Empalizada:"\u0427\u0430\u0441\u0442\u043E\u043A\u043E\u043B","Puerta de empalizada":"\u0412\u043E\u0440\u043E\u0442\u0430 \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B\u0430","Cama de paja":"\u0421\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0441\u0442\u0435\u043B\u044C","Cama de madera":"\u0414\u0435\u0440\u0435\u0432\u044F\u043D\u043D\u0430\u044F \u043A\u0440\u043E\u0432\u0430\u0442\u044C",Mesa:"\u0421\u0442\u043E\u043B",Banco:"\u0421\u043A\u0430\u043C\u044C\u044F",Taburete:"\u0422\u0430\u0431\u0443\u0440\u0435\u0442",Arc\u00F3n:"\u0421\u0443\u043D\u0434\u0443\u043A",Barril:"\u041 43B\u0435\u0441\u0442\u043D\u0438\u0446\u0430 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 <b>\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C</b>.","<kbd>W A S D</kbd> moverse \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n derecho: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> \u0438\u0434\u0442\u0438 \xB7 <kbd>Shift</kbd> \u0431\u0435\u0436\u0430\u0442\u044C \xB7 <kbd>Q</kbd>/<kbd>E</kbd> \u0438\u043B\u0438 \u043F\u0440\u0430\u0432\u0430\u044F \u043A\u043D\u043E\u043F\u043A\u0430: \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B \xB7 \u043A\u043E\u043B\u0435\u0441\u043E: \u043C\u0430\u0441\u0448\u0442\u0430\u0431","<kbd>B</kbd> construir \xB7 <kbd>X</kbd> desmontar \xB7 <kbd>R</kbd> girar pieza \xB7 <kbd>ReP\xE1g</kbd>/<kbd>AvP\xE1g</kbd> planta \xB7 <kbd>F</kbd> usar \xB7 <kbd>Esc</kbd> salir":"<kbd>B</kbd> \u0441\u0442\u0440\u043E\u0438\u0442\u044C \xB7 <kbd>X</kbd> \u0440\u0430\u0437\u043E\u0431\u0440\u0430\u0442\u044C \xB7 <kbd>R</kbd> \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u0434\u0435\u0442\u0430\u043B\u044C \xB7 <kbd>PgUp</kbd>/<kbd>PgDn</kbd> \u044D\u0442\u0430\u0436 \xB7 <kbd>F</kbd> \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \xB7 <kbd>Esc</kbd> \u0432\u044B\u0439\u0442\u0438","Joystick abajo a la izquierda para moverte. Arrastra con un dedo para girar la c\xE1mara y pellizca para el zoom.":"\u0414\u0436\u043E\u0439\u0441\u0442\u0438\u043A \u0441\u043B\u0435\u0432\u0430 \u0432\u043D\u0438\u0437\u0443 \u2014 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435. \u041F\u0440\u043E\u0432\u0435\u0434\u0438\u0442\u0435 \u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043A\u0430\u043C\u0435\u0440\u0443, \u0438 \u0441\u0432\u0435\u0434\u0438\u0442\u0435 \u0434\u0432\u0430 \u043F\u0430\u043B\u044C\u0446\u0430 \u0434\u043B\u044F \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0430.","Al construir, toca el suelo donde quieres la pieza y pulsa <b>Colocar</b>.":"\u041F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u043A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0437\u0435\u043C\u043B\u0438 \u0442\u0430\u043C, \u0433\u0434\u0435 \u043D\u0443\u0436\u043D\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 <b>\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C</b>.",'<label><input type="checkbox" id="chkSigue"> La pieza sigue al personaje (en vez de tocar el suelo)</label>':'<label><input type="checkbox" id="chkSigue"> \u0414\u0435\u0442\u0430\u043B\u044C \u0441\u043B\u0435\u0434\u0443\u0435\u0442 \u0437\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C (\u0432\u043C\u0435\u0441\u0442\u043E \u043A\u0430\u0441\u0430\u043D\u0438\u044F \u0437\u0435\u043C\u043B\u0438)</label>',Opciones:"\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438",Modo:"\u0420\u0435\u0436\u0438\u043C","Tu arma":"\u0412\u0430\u0448\u0435 \u043E\u0440\u0443\u0436\u0438\u0435","Tu ropa":"\u0412\u0430\u0448\u0430 \u043E\u0434\u0435\u0436\u0434\u0430","Ropa del rival":"\u041E\u0434\u0435\u0436\u0434\u0430 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430","Arma del rival":"\u041E\u0440\u0443\u0436\u0438\u0435 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430",Dificultad:"\u0421\u043B\u043E\u0436\u043D\u043E\u0441\u0442\u044C",Sonido:"\u0417\u0432\u0443\u043A","Der.":"\u041F\u0440\u0430\u0432.","Izq.":"\u041B\u0435\u0432.","Estoc.":"\u0423\u043A\u043E\u043B",Parar:"\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C","Otra vez":"\u0415\u0449\u0451 \u0440\u0430\u0437","C\xF3mo se combate":"\u041A\u0430\u043A \u0441\u0440\u0430\u0436\u0430\u0442\u044C\u0441\u044F","<kbd>W A S D</kbd> moverte \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n central: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> \u0438\u0434\u0442\u0438 \xB7 <kbd>Shift</kbd> \u0431\u0435\u0436\u0430\u0442\u044C \xB7 <kbd>Q</kbd>/<kbd>E</kbd> \u0438\u043B\u0438 \u0441\u0440\u0435\u0434\u043D\u044F\u044F \u043A\u043D\u043E\u043F\u043A\u0430: \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B \xB7 \u043A\u043E\u043B\u0435\u0441\u043E: \u043C\u0430\u0441\u0448\u0442\u0430\u0431","Cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean, siempre de cara.":"\u0420\u044F\u0434\u043E\u043C \u0441 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0432\u043F\u0435\u0440\u0451\u0434 \u0438 \u043D\u0430\u0437\u0430\u0434 \u2014 \u0441\u0431\u043B\u0438\u0436\u0435\u043D\u0438\u0435 \u0438 \u043E\u0442\u0445\u043E\u0434, \u0430 \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u2014 \u043E\u0431\u0445\u043E\u0434 \u0432\u043E\u043A\u0440\u0443\u0433 \u043D\u0435\u0433\u043E, \u0432\u0441\u0435\u0433\u0434\u0430 \u043B\u0438\u0446\u043E\u043C \u043A \u043D\u0435\u043C\u0443.","<b>Atacar:</b> sobre el rival aparece una rosa de cinco zonas. Pon el cursor en la zona por la que quieres golpear y haz clic. El centro es la estocada. Tambi\xE9n <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> del teclado num\xE9rico.":"<b>\u0410\u0442\u0430\u043A\u0430:</b> \u043D\u0430\u0434 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0440\u043E\u0437\u0430 \u0438\u0437 \u043F\u044F\u0442\u0438 \u0437\u043E\u043D. \u041D\u0430\u0432\u0435\u0434\u0438\u0442\u0435 \u043A\u0443\u0440\u0441\u043E\u0440 \u043D\u0430 \u0437\u043E\u043D\u0443, \u0441 \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u0445\u043E\u0442\u0438\u0442\u0435 \u0443\u0434\u0430\u0440\u0438\u0442\u044C, \u0438 \u0449\u0451\u043B\u043A\u043D\u0438\u0442\u0435. \u0426\u0435\u043D\u0442\u0440 \u2014 \u0443\u043A\u043E\u043B. \u0422\u0430\u043A\u0436\u0435 <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> \u043D\u0430 \u0446\u0438\u0444\u0440\u043E\u0432\u043E\u0439 \u043A\u043B\u0430\u0432\u0438\u0430\u0442\u0443\u0440\u0435.","<b>Finta:</b> mientras preparas el golpe, haz clic en otra zona para cambiarlo (hasta la mitad de la preparaci\xF3n, cuesta aliento).":"<b>\u0424\u0438\u043D\u0442:</b> \u043F\u043E\u043A\u0430 \u0433\u043E\u0442\u043E\u0432\u0438\u0442\u0435 \u0443\u0434\u0430\u0440, \u0449\u0451\u043B\u043A\u043D\u0438\u0442\u0435 \u043F\u043E \u0434\u0440\u0443\u0433\u043E\u0439 \u0437\u043E\u043D\u0435, \u0447\u0442\u043E\u0431\u044B \u0441\u043C\u0435\u043D\u0438\u0442\u044C \u0435\u0433\u043E (\u0434\u043E \u0441\u0435\u0440\u0435\u0434\u0438\u043D\u044B \u0437\u0430\u043C\u0430\u0445\u0430, \u0442\u0440\u0430\u0442\u0438\u0442 \u0434\u044B\u0445\u0430\u043D\u0438\u0435).","<b>Parar:</b> mant\xE9n el bot\xF3n derecho o <kbd>Espacio</kbd>. No hace falta elegir lado.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043F\u0440\u0430\u0432\u0443\u044E \u043A\u043D\u043E\u043F\u043A\u0443 \u0438\u043B\u0438 <kbd>\u041F\u0440\u043E\u0431\u0435\u043B</kbd>. \u0412\u044B\u0431\u0438\u0440\u0430\u0442\u044C \u0441\u0442\u043E\u0440\u043E\u043D\u0443 \u043D\u0435 \u043D\u0443\u0436\u043D\u043E.","<b>Arco y piedras:</b> mant\xE9n el bot\xF3n izquierdo para tensar, apunta y suelta. El c\xEDrculo se cierra al tensar y se pone verde cuando est\xE1 listo; si aguantas demasiado tiembla.":"<b>\u041B\u0443\u043A \u0438 \u043A\u0430\u043C\u043D\u0438:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043B\u0435\u0432\u0443\u044E \u043A\u043D\u043E\u043F\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u044C, \u043F\u0440\u0438\u0446\u0435\u043B\u044C\u0442\u0435\u0441\u044C \u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u0435. \u041A\u0440\u0443\u0433 \u0441\u0443\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u043D\u0430\u0442\u044F\u0436\u0435\u043D\u0438\u0438 \u0438 \u0437\u0435\u043B\u0435\u043D\u0435\u0435\u0442, \u043A\u043E\u0433\u0434\u0430 \u0433\u043E\u0442\u043E\u0432\u043E; \u0435\u0441\u043B\u0438 \u0434\u0435\u0440\u0436\u0430\u0442\u044C \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0434\u043E\u043B\u0433\u043E, \u043E\u043D \u0434\u0440\u043E\u0436\u0438\u0442.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Dos dedos giran la c\xE1mara.":"\u0414\u0436\u043E\u0439\u0441\u0442\u0438\u043A \u0441\u043B\u0435\u0432\u0430 \u2014 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435; \u0440\u044F\u0434\u043E\u043C \u0441 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u2014 \u043E\u0431\u0445\u043E\u0434 \u0432\u043E\u043A\u0440\u0443\u0433 \u043D\u0435\u0433\u043E. \u0414\u0432\u0443\u043C\u044F \u043F\u0430\u043B\u044C\u0446\u0430\u043C\u0438 \u2014 \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B.","<b>Atacar:</b> toca una zona de la rosa que aparece sobre el rival. El centro es la estocada. Tocar otra zona mientras preparas es una finta.":"<b>\u0410\u0442\u0430\u043A\u0430:</b> \u043A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0437\u043E\u043D\u044B \u0440\u043E\u0437\u044B, \u043F\u043E\u044F\u0432\u043B\u044F\u044E\u0449\u0435\u0439\u0441\u044F \u043D\u0430\u0434 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C. \u0426\u0435\u043D\u0442\u0440 \u2014 \u0443\u043A\u043E\u043B. \u041A\u0430\u0441\u0430\u043D\u0438\u0435 \u0434\u0440\u0443\u0433\u043E\u0439 \u0437\u043E\u043D\u044B \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0437\u0430\u043C\u0430\u0445\u0430 \u2014 \u0444\u0438\u043D\u0442.","<b>Parar:</b> mant\xE9n el bot\xF3n Parar.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043A\u043D\u043E\u043F\u043A\u0443 \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta.":"<b>\u041B\u0443\u043A \u0438 \u043A\u0430\u043C\u043D\u0438:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043F\u0430\u043B\u0435\u0446, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u044C, \u0432\u0435\u0434\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0438\u0446\u0435\u043B\u0438\u0442\u044C\u0441\u044F, \u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u0435.","Las tres capas de defensa":"\u0422\u0440\u0438 \u0443\u0440\u043E\u0432\u043D\u044F \u0437\u0430\u0449\u0438\u0442\u044B","<b>Parada:</b> mantener Parar detiene cualquier golpe, pero cansa. Agotado (95%), cede.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u0435 \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u043B\u044E\u0431\u043E\u0439 \u0443\u0434\u0430\u0440, \u043D\u043E \u0443\u0442\u043E\u043C\u043B\u044F\u0435\u0442. \u041F\u0440\u0438 \u0438\u0437\u043D\u0435\u043C\u043E\u0436\u0435\u043D\u0438\u0438 (95%) \u043E\u043D\u043E \u043D\u0435 \u0434\u0435\u0440\u0436\u0438\u0442.","<b>Escudo</b> (arma \xABEspada y escudo\xBB): al parar se levanta; para tambi\xE9n flechas y piedras que te vengan de frente y cansa menos que parar con la espada. La espada de una mano llega algo menos que la larga.":"<b>\u0429\u0438\u0442</b> (\u043E\u0440\u0443\u0436\u0438\u0435 \xAB\u041C\u0435\u0447 \u0438 \u0449\u0438\u0442\xBB): \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0438; \u0442\u0430\u043A\u0436\u0435 \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u0441\u0442\u0440\u0435\u043B\u044B \u0438 \u043A\u0430\u043C\u043D\u0438, \u043B\u0435\u0442\u044F\u0449\u0438\u0435 \u0441\u043F\u0435\u0440\u0435\u0434\u0438, \u0438 \u0443\u0442\u043E\u043C\u043B\u044F\u0435\u0442 \u043C\u0435\u043D\u044C\u0448\u0435, \u0447\u0435\u043C \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043C\u0435\u0447\u043E\u043C. \u041E\u0434\u043D\u043E\u0440\u0443\u0447\u043D\u044B\u0439 \u043C\u0435\u0447 \u0434\u043E\u0441\u0442\u0430\u0451\u0442 \u0447\u0443\u0442\u044C \u0431\u043B\u0438\u0436\u0435 \u0434\u043B\u0438\u043D\u043D\u043E\u0433\u043E.",'<b>Parada perfecta:</b> empieza a parar justo antes del impacto (zona en <span style="color:var(--verde)">verde</span> en aprendiz). El rival queda descolocado y tu contraataque sale r\xE1pido y solo se para con otra parada perfecta.':'<b>\u0418\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u043D\u0430\u0447\u043D\u0438\u0442\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u043F\u0440\u044F\u043C\u043E \u043F\u0435\u0440\u0435\u0434 \u0443\u0434\u0430\u0440\u043E\u043C (\u0437\u043E\u043D\u0430 <span style="color:var(--verde)">\u0437\u0435\u043B\u0451\u043D\u0430\u044F</span> \u043D\u0430 \u0443\u0440\u043E\u0432\u043D\u0435 \xAB\u0423\u0447\u0435\u043D\u0438\u043A\xBB). \u041F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u0442\u0435\u0440\u044F\u0435\u0442 \u0440\u0430\u0432\u043D\u043E\u0432\u0435\u0441\u0438\u0435, \u0430 \u0432\u0430\u0448\u0430 \u043A\u043E\u043D\u0442\u0440\u0430\u0442\u0430\u043A\u0430 \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u0431\u044B\u0441\u0442\u0440\u043E, \u0438 \u0435\u0451 \u043E\u0442\u0440\u0430\u0436\u0430\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0440\u0443\u0433\u043E\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435.','<b>Golpe maestro:</b> si ves venir un golpe por un lado (zona en <span style="color:var(--rojo)">rojo</span>), golpea t\xFA por ese mismo lado al principio de su preparaci\xF3n (borde dorado). Desv\xEDas su golpe y el tuyo entra.':'<b>\u041C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440:</b> \u0435\u0441\u043B\u0438 \u0432\u0438\u0434\u0438\u0442\u0435, \u0447\u0442\u043E \u0443\u0434\u0430\u0440 \u0438\u0434\u0451\u0442 \u0441 \u043E\u0434\u043D\u043E\u0439 \u0441\u0442\u043E\u0440\u043E\u043D\u044B (\u0437\u043E\u043D\u0430 <span style="color:var(--rojo)">\u043A\u0440\u0430\u0441\u043D\u0430\u044F</span>), \u0443\u0434\u0430\u0440\u044C\u0442\u0435 \u0441 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u0432 \u043D\u0430\u0447\u0430\u043B\u0435 \u0435\u0433\u043E \u0437\u0430\u043C\u0430\u0445\u0430 (\u0437\u043E\u043B\u043E\u0442\u0430\u044F \u043A\u0430\u0439\u043C\u0430). \u0412\u044B \u043E\u0442\u0432\u043E\u0434\u0438\u0442\u0435 \u0435\u0433\u043E \u0443\u0434\u0430\u0440, \u0438 \u0432\u0430\u0448 \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442.',"En <b>aprendiz</b> los golpes son lentos y ves el lado y el momento. En <b>normal</b> solo ves el lado. En <b>realista</b> no hay avisos: hay que leer el cuerpo del rival.":"\u041D\u0430 \u0443\u0440\u043E\u0432\u043D\u0435 <b>\xAB\u0423\u0447\u0435\u043D\u0438\u043A\xBB</b> \u0443\u0434\u0430\u0440\u044B \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0435, \u0438 \u0432\u0438\u0434\u043D\u044B \u0441\u0442\u043E\u0440\u043E\u043D\u0430 \u0438 \u043C\u043E\u043C\u0435\u043D\u0442. \u041D\u0430 <b>\u043E\u0431\u044B\u0447\u043D\u043E\u043C</b> \u0432\u0438\u0434\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0442\u043E\u0440\u043E\u043D\u0430. \u041D\u0430 <b>\u0440\u0435\u0430\u043B\u0438\u0441\u0442\u0438\u0447\u043D\u043E\u043C</b> \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043E\u043A \u043D\u0435\u0442: \u043D\u0443\u0436\u043D\u043E \u0447\u0438\u0442\u0430\u0442\u044C \u0442\u0435\u043B\u043E \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430.",Avisos:"\u0421\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435","Los c\xEDrculos de la derecha avisan de cansancio, sangrado y heridas. T\xF3calos para ver qu\xE9 efecto tienen.":"\u041A\u0440\u0443\u0433\u0438 \u0441\u043F\u0440\u0430\u0432\u0430 \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0430\u044E\u0442 \u043E\u0431 \u0443\u0441\u0442\u0430\u043B\u043E\u0441\u0442\u0438, \u043A\u0440\u043E\u0432\u043E\u0442\u0435\u0447\u0435\u043D\u0438\u0438 \u0438 \u0440\u0430\u043D\u0430\u0445. \u041A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0438\u0445, \u0447\u0442\u043E\u0431\u044B \u0443\u0437\u043D\u0430\u0442\u044C \u0438\u0445 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435.","Decisiones tomadas en el combate":"\u0420\u0435\u0448\u0435\u043D\u0438\u044F, \u043F\u0440\u0438\u043D\u044F\u0442\u044B\u0435 \u0434\u043B\u044F \u0431\u043E\u044F","Terreno llano en este hito. Las cuestas y su efecto en los cimientos llegan con el mundo generado.":"\u0412 \u044D\u0442\u043E\u043C \u044D\u0442\u0430\u043F\u0435 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u044C \u0440\u043E\u0432\u043D\u0430\u044F. \u0421\u043A\u043B\u043E\u043D\u044B \u0438 \u0438\u0445 \u0432\u043B\u0438\u044F\u043D\u0438\u0435 \u043D\u0430 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u0433\u0435\u043D\u0435\u0440\u0438\u0440\u0443\u0435\u043C\u044B\u043C \u043C\u0438\u0440\u043E\u043C.","Los materiales vienen dados (y hay bot\xF3n para rellenar). Recolectarlos llega en el hito 2.":"\u041C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B \u0432\u044B\u0434\u0430\u044E\u0442\u0441\u044F (\u0438 \u0435\u0441\u0442\u044C \u043A\u043D\u043E\u043F\u043A\u0430, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u044C \u0438\u0445). \u0418\u0445 \u0434\u043E\u0431\u044B\u0447\u0430 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0432 \u044D\u0442\u0430\u043F\u0435 2.","Para construir hace falta tu moj\xF3n; la tierra es un c\xEDrculo de 20 m (moj\xF3n de nivel 1). Subir de nivel el moj\xF3n llega m\xE1s adelante.":"\u0414\u043B\u044F \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0430 \u043D\u0443\u0436\u0435\u043D \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C; \u0437\u0435\u043C\u043B\u044F \u2014 \u043A\u0440\u0443\u0433 \u0440\u0430\u0434\u0438\u0443\u0441\u043E\u043C 20 \u043C (\u043A\u0430\u043C\u0435\u043D\u044C 1-\u0433\u043E \u0443\u0440\u043E\u0432\u043D\u044F). \u041F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u0435 \u0443\u0440\u043E\u0432\u043D\u044F \u043A\u0430\u043C\u043D\u044F \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043F\u043E\u0437\u0436\u0435.","La primera pieza estructural fija la rejilla: posici\xF3n donde apuntas y giro libre en pasos de 15\xB0. Toda pieza a menos de 6 m de una construcci\xF3n encaja en su rejilla.":"\u041F\u0435\u0440\u0432\u0430\u044F \u043D\u0435\u0441\u0443\u0449\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0437\u0430\u0434\u0430\u0451\u0442 \u0441\u0435\u0442\u043A\u0443: \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u2014 \u043A\u0443\u0434\u0430 \u0432\u044B \u0446\u0435\u043B\u0438\u0442\u0435\u0441\u044C, \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u044B\u0439, \u0448\u0430\u0433\u0430\u043C\u0438 \u043F\u043E 15\xB0. \u041B\u044E\u0431\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0431\u043B\u0438\u0436\u0435 6 \u043C \u043A \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u0432\u0441\u0442\u0430\u0451\u0442 \u043F\u043E \u0435\u0451 \u0441\u0435\u0442\u043A\u0435.","Los apoyos siguen un orden realista: un muro descansa primero en el muro o la viga de debajo, si no en postes en sus dos extremos, y si no en el suelo o cimiento de al lado.":"\u041E\u043F\u043E\u0440\u044B \u0441\u043B\u0435\u0434\u0443\u044E\u0442 \u0440\u0435\u0430\u043B\u0438\u0441\u0442\u0438\u0447\u043D\u043E\u043C\u0443 \u043F\u043E\u0440\u044F\u0434\u043A\u0443: \u0441\u0442\u0435\u043D\u0430 \u043E\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0441\u043D\u0430\u0447\u0430\u043B\u0430 \u043D\u0430 \u0441\u0442\u0435\u043D\u0443 \u0438\u043B\u0438 \u0431\u0430\u043B\u043A\u0443 \u043F\u043E\u0434 \u043D\u0435\u0439, \u0438\u043D\u0430\u0447\u0435 \u2014 \u043D\u0430 \u0441\u0442\u043E\u043B\u0431\u044B \u043D\u0430 \u043E\u0431\u043E\u0438\u0445 \u043A\u043E\u043D\u0446\u0430\u0445, \u0438\u043D\u0430\u0447\u0435 \u2014 \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u043F\u043E\u043B \u0438\u043B\u0438 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442.","La carga se reparte a partes iguales entre los apoyos de cada pieza.":"\u041D\u0430\u0433\u0440\u0443\u0437\u043A\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043F\u043E\u0440\u043E\u0432\u043D\u0443 \u043C\u0435\u0436\u0434\u0443 \u043E\u043F\u043E\u0440\u0430\u043C\u0438 \u043A\u0430\u0436\u0434\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438.","Al desmontar recuperas el 75% de esa pieza. Lo que cae en cascada encima se destruye sin devolver material.":"\u041F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u0432\u044B \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0435 75% \u044D\u0442\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438. \u0422\u043E, \u0447\u0442\u043E \u043E\u0431\u0440\u0443\u0448\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0441\u0432\u0435\u0440\u0445\u0443, \u0443\u043D\u0438\u0447\u0442\u043E\u0436\u0430\u0435\u0442\u0441\u044F \u0431\u0435\u0437 \u0432\u043E\u0437\u0432\u0440\u0430\u0442\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0430
