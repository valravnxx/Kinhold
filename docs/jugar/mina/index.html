cters in recursos/personajes/taller-v5/ (everything else, the same as v4).","v12, arreglo: el juego aceleraba la animaci\xF3n de correr como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s: a la velocidad del juego (3,6 m/s) los pies resbalaban y se ve\xEDa a c\xE1mara lenta con zancadas enormes. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar el personaje (la carrera nueva: 3,5 m/s el hombre y 2,9 la mujer; andar, 0,95 y 0,77).":"v12, fix: the game sped up the run animation as if its natural speed were 2.59 m/s, but measured with the planted foot it was 5.8 m/s: at the game's speed (3.6 m/s) the feet slid and it looked like slow motion with huge strides. Now the natural speed of walking and running is measured in the clip itself when the character loads (the new run: 3.5 m/s the man and 2.9 the woman; walking, 0.95 and 0.77).","v12, pendiente: corriendo deprisa (6 m/s, con la tecla May\xFAs) la animaci\xF3n va al tope de 1,6\xD7 y los pies a\xFAn resbalan algo, sobre todo la mujer. Si valravnx no la ve bien, el siguiente paso son carreras de captura de movimiento libres (Rokoko).":"v12, pending: running fast (6 m/s, with the Shift key) the animation hits the 1.6\xD7 cap and the feet still slide a little, especially the woman's. If valravnx doesn't like it, the next step is free motion-capture runs (Rokoko).","Personaje \xB7 v12 (carrera m\xE1s suave y natural)":"Character \xB7 v12 (smoother, more natural running)","v4: correr m\xE1s natural, en las tres partes. La carrera va suavizada por c\xF3digo (menos zancada, braceo, bote e inclinaci\xF3n, y los brazos m\xE1s pegados) y a su velocidad de verdad: antes los pies resbalaban y se ve\xEDa a c\xE1mara lenta. Personajes del taller-v5; es la construcci\xF3n v11, el combate v8 y el personaje v12. Corriendo deprisa (6 m/s, con la tecla May\xFAs) los pies a\xFAn resbalan algo.":"v4: more natural running, in all three parts. The run is softened by code (shorter stride, less arm swing, bounce and lean, and arms closer to the body) and plays at its real speed: before, the feet slid and it looked like slow motion. Workshop characters v5; it is construction v11, combat v8 and character v12. Running fast (6 m/s, with the Shift key) the feet still slide a little.","Demo \xFAnica \xB7 v4 (correr m\xE1s natural)":"Single demo \xB7 v4 (more natural running)","v12: los muros, los postes y las vigas con el estilo elegido (el de la caba\xF1a de la prueba de estilo v5): troncos redondos con su veta y las testas claras a la vista, un poco m\xE1s gruesos por un extremo; jambas, dintel, marco y alf\xE9izar en puertas y ventanas; el zarzo con estacas que asoman del barro; el entramado con riostra y relleno encalado; las tablas con durmiente y carrera. Los tejados, los suelos, las cercas y los muebles pasan al estilo en las tareas siguientes.":"v12: walls, posts and beams in the chosen style (that of the cabin in style test v5): round logs with their grain and the light log ends showing, a little thicker at one end; jambs, lintel, frame and sill on doors and windows; wattle with stakes sticking out of the daub; timber framing with a brace and limewashed infill; planks with sill plate and top plate. Roofs, floors, fences and furniture move to the style in the next tasks.","v13: los brazos al correr (valravnx: \xABtorcidos hacia delante, en pose nada natural\xBB). Ahora el brazo oscila alrededor de la vertical (el codo pasa por detr\xE1s del cuerpo), el antebrazo va un poco hacia arriba y hacia dentro, la mano va de canto con el pulgar arriba y la mu\xF1eca recta, en vez de los pu\xF1os girados hacia abajo delante de la tripa. Personajes en recursos/personajes/taller-v6/.":"v13: the arms when running (valravnx: \xABtwisted forward, in a pose that's not natural at all\xBB). Now the arm swings around the vertical (the elbow goes behind the body), the forearm points slightly up and inward, the hand is edge-on with the thumb up and the wrist straight, instead of the fists turned down in front of the belly. Characters in recursos/personajes/taller-v6/.","v5: los brazos al correr, m\xE1s naturales (valravnx los vio torcidos hacia delante): oscilan junto al cuerpo, con la mano de canto y la mu\xF1eca recta. Es el personaje v13, con la construcci\xF3n v11 y el combate v8.":"v5: more natural arms when running (valravnx saw them twisted forward): they swing next to the body, with the hand edge-on and the wrist straight. It is character v13, with construction v11 and combat v8.","Personaje \xB7 v13 (brazos naturales al correr)":"Character \xB7 v13 (natural arms when running)","Demo \xFAnica \xB7 v5 (brazos naturales al correr)":"Single demo \xB7 v5 (natural arms when running)","Se ha perdido el dibujo 3D (el aparato se qued\xF3 sin memoria gr\xE1fica).":"The 3D view was lost (the device ran out of graphics memory).","Ha vuelto a pasar: cierra otras pesta\xF1as o aplicaciones y recarga.":"It happened again: close other tabs or apps and reload.","Recargando\u2026 Lo construido est\xE1 guardado.":"Reloading\u2026 What you built is saved.",Recargar:"Reload","v12, arreglo importante (valravnx: pantalla en blanco en el m\xF3vil tras un rato construyendo, a m\xE1s de 80 fps): cada vez que se colocaba o se quitaba algo se rehac\xEDan todas las piezas y las viejas se quedaban ocupando la memoria gr\xE1fica (medido: con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas en memoria). Ahora se liberan y la cuenta no sube. Si aun as\xED el navegador pierde el dibujo 3D, sale un aviso y la p\xE1gina se recarga sola con lo construido guardado; si vuelve a pasar enseguida, ofrece un bot\xF3n en vez de recargar en bucle.":"v12, important fix (valravnx: blank screen on mobile after building for a while, at over 80 fps): every time something was placed or removed all the pieces were rebuilt and the old ones stayed in graphics memory (measured: with 9 pieces, 20 rebuilds went from 870 to 4,050 meshes in memory). Now they are freed and the count does not grow. If the browser still loses the 3D view, a notice appears and the page reloads by itself with what you built saved; if it happens again right away, it offers a button instead of reloading in a loop.","v9, arreglo: cada flecha disparada dejaba su malla ocupando memoria gr\xE1fica, y al empezar otra partida tambi\xE9n las dianas y los postes; ahora se liberan. Si el navegador pierde el dibujo 3D, aviso y recarga sola, como en la construcci\xF3n.":"v9, fix: every arrow fired left its mesh in graphics memory, and so did the targets and posts when starting another match; now they are freed. If the browser loses the 3D view, a notice and automatic reload, as in construction.","Combate \xB7 v9":"Combat \xB7 v9","v7: arreglo de la pantalla en blanco en el m\xF3vil (la construcci\xF3n dejaba la memoria gr\xE1fica llena al rehacer las piezas) y aviso con recarga si se pierde el dibujo 3D. Los muros, postes y vigas con el estilo elegido. Es la construcci\xF3n v12, el combate v9 y el personaje v14.":"v7: fix for the blank screen on mobile (construction filled graphics memory when rebuilding pieces) and a notice with reload if the 3D view is lost. Walls, posts and beams in the chosen style. It is construction v12, combat v9 and character v14.","Demo \xFAnica \xB7 v7 (sin pantalla en blanco; muros con el estilo)":"Single demo \xB7 v7 (no blank screen; walls in the style)","Hito 1 \xB7 v13":"Milestone 1 \xB7 v13","Hito 1 \xB7 v14":"Milestone 1 \xB7 v14","Combate \xB7 v10":"Combat \xB7 v10","Demo \xFAnica \xB7 v9 (escena con el estilo v5 en \xABConstruir\xBB y \xABDuelo\xBB)":"Single demo \xB7 v9 (scene in the v5 style in \u201CBuild\u201D and \u201CDuel\u201D)","v14: la escena como la prueba de estilo v5: hierba densa con flores tambi\xE9n en el centro, matorrales, calvas de tierra pisada, rocas m\xE1s cerca y algunos \xE1rboles de copa sueltos a partir de 22 m. Donde se construye en la planta baja, y bajo los muebles del suelo y el moj\xF3n, la hierba, las flores y las matas se esconden solas; si se quita la pieza, vuelven. Las matas escondidas no chocan.":"v14: the scene like the v5 style test: dense grass with flowers in the centre too, bushes, patches of trodden earth, rocks closer in and a few loose broadleaf trees from 22 m. Where you build on the ground floor, and under floor furniture and the boundary stone, grass, flowers and bushes hide themselves; if the piece is removed, they come back. Hidden bushes do not block.","v10: alrededor de la liza, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra pisada, rocas y algunos \xE1rboles de copa sueltos antes del bosque.":"v10: around the lists, the scene like the v5 style test: dense grass with flowers, bushes, patches of trodden earth, rocks and a few loose broadleaf trees before the forest.","v9: en \xABConstruir\xBB y en \xABDuelo\xBB, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra, rocas y \xE1rboles sueltos; la hierba ya no asoma por lo construido. Es la construcci\xF3n v14 y el combate v10.":"v9: in \u201CBuild\u201D and \u201CDuel\u201D, the scene like the v5 style test: dense grass with flowers, bushes, patches of earth, rocks and loose trees; grass no longer pokes through what you build. It is construction v14 and combat v10.","v16: los tejados con el estilo elegido (la caba\xF1a de la prueba de estilo v5). La paja va en dos hiladas gruesas y redondeadas, con mechones en el alero y la cumbrera redonda; las tablillas, en filas solapadas y desplazadas, con tabla de remate en los lados y caballete en la cumbrera. Bajo el tejado se cierra con tablas de pie (muros de troncos y de tablas), con barro y estacas (zarzo) o con encalado y postes (entramado). Los tramos de paja que van de lado se juntan sin surco. (La v15 pas\xF3 al estilo los cimientos, los suelos y las escaleras.)":"v16: roofs in the chosen style (the cabin from style test v5). Thatch comes in two thick, rounded courses, with tufts at the eaves and a rounded ridge; shingles come in overlapping, staggered rows, with a barge board on the sides and a ridge cap. Under the roof the gap is closed with upright boards (log and plank walls), with mud and stakes (wattle) or with whitewash and posts (timber frame). Thatch sections placed side by side join without a groove. (v15 brought foundations, floors and stairs to the style.)","v10: en \xABConstruir\xBB, los cimientos, los suelos y las escaleras con el estilo v5. Es la construcci\xF3n v15.":"v10: in \u201CBuild\u201D, foundations, floors and stairs in the v5 style. It is construction v15.","v11: en \xABConstruir\xBB, los tejados de paja y de tablillas, y lo que cierra bajo el tejado, con el estilo v5. Es la construcci\xF3n v16.":"v11: in \u201CBuild\u201D, thatched and shingle roofs, and what closes the gap under the roof, in the v5 style. It is construction v16.","Demo \xFAnica \xB7 v11 (tejados con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v11 (roofs in the v5 style in \u201CBuild\u201D)","Hito 1 \xB7 v16":"Milestone 1 \xB7 v16","v17: las puertas, la cerca, el portillo, la empalizada y su puerta, y el moj\xF3n con el estilo elegido (el de la prueba de estilo v5). La puerta de tablas es como la de la caba\xF1a de la prueba: cuatro tablas, peinazos por detr\xE1s, bisagras largas de hierro y tirador de argolla; la de varas lleva varas atadas con cuerda y tornapunta. La cerca y el portillo, postes redondos con el corte claro arriba y varas atadas; la empalizada, troncos descortezados de distinto alto con la punta tallada; su puerta, tablones con pletinas de hierro y argolla. El moj\xF3n, piedras apiladas y una vara con un trapo atado.":"v17: doors, the fence, the fence gate, the palisade and its gate, and the boundary stone in the chosen style (that of style test v5). The plank door is like the one on the test cabin: four planks, battens on the back, long iron hinges and a ring handle; the pole door has poles tied with rope and a diagonal brace. The fence and the gate have round posts with the light cut end on top and tied poles; the palisade, debarked logs of different heights with carved points; its gate, planks with iron straps and a ring. The boundary stone is a pile of stones and a pole with a rag tied to it.","v12: en \xABConstruir\xBB, las puertas, las cercas, el portillo, la empalizada y el moj\xF3n con el estilo v5. Es la construcci\xF3n v17.":"v12: in \u201CBuild\u201D, doors, fences, the fence gate, the palisade and the boundary stone in the v5 style. It is construction v17.","Hito 1 \xB7 v17":"Milestone 1 \xB7 v17","Demo \xFAnica \xB7 v12 (puertas, cercas, empalizada y moj\xF3n con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v12 (doors, fences, palisade and boundary stone in the v5 style in \u201CBuild\u201D)","v18: los muebles con el estilo elegido (el de la prueba de estilo v5). La cama de paja, un marco de troncos con la paja amontonada, un jerg\xF3n de lino y una manta de lana; la de madera, postes, largueros y cabecero de tablas, colch\xF3n y almohada de lino y manta. La mesa, tres tablas sobre dos caballetes; el banco, como el de la prueba; el taburete, una rodaja con tres patas abiertas; el arc\xF3n, tablas con flejes, clavos y cerradura de hierro; el barril, duelas abombadas con dos aros; la estanter\xEDa, con trasera de tablas, vasijas de barro, un cuenco y un rollo de pa\xF1o; la antorcha de pie, una vara entre piedras con un cesto de hierro y estopa; la alfombra, una piel curtida con su forma; el estandarte, un pa\xF1o con pliegues, dos puntas y una banda.":"v18: furniture in the chosen style (that of style test v5). The straw bed is a log frame with heaped straw, a linen pallet and a wool blanket; the wooden bed has posts, side rails and a plank headboard, a linen mattress and pillow and a blanket. The table is three planks on two trestles; the bench is like the one in the test; the stool is a log slice with three splayed legs; the chest is planks with iron straps, nails and a lock; the barrel has bulging staves and two hoops; the shelf has a plank back, clay jars, a bowl and a roll of cloth; the standing torch is a pole among stones with an iron basket and tow; the rug is a tanned hide with its natural shape; the banner is a folded cloth with two tails and a band.","v13: en \xABConstruir\xBB, los muebles con el estilo v5. Es la construcci\xF3n v18.":"v13: in \u201CBuild\u201D, furniture in the v5 style. It is construction v18.","Hito 1 \xB7 v18":"Milestone 1 \xB7 v18","Demo \xFAnica \xB7 v13 (muebles con el estilo v5 en \xABConstruir\xBB)":"Single demo \xB7 v13 (furniture in the v5 style in \u201CBuild\u201D)","Hito 1 \xB7 v19":"Milestone 1 \xB7 v19","Combate \xB7 v11":"Combat \xB7 v11","Demo \xFAnica \xB7 v14 (armas, hacha y pieza al construir con el estilo v5)":"Single demo \xB7 v14 (weapons, axe and build preview in the v5 style)","v19: lo que quedaba con el aspecto inicial, con el estilo elegido (el de la prueba de estilo v5). La pieza que se ve al construir ya no es un bloque verde o rojo: es la propia pieza, con su madera, su piedra o su paja, transl\xFAcida y con un velo verde si cabe o rojo si no. Al desmontar, lo que se quita y lo que caer\xEDa se ven igual, con un velo naranja o rojo. Al talar, el personaje lleva un hacha en la mano (mango de fresno y cabeza de hierro, como la del toc\xF3n de la prueba); solo sale mientras tala.":"v19: what was left with the initial look now has the chosen style (that of style test v5). The piece you see while building is no longer a green or red block: it is the piece itself, with its wood, stone or straw, see-through and with a green veil if it fits or a red one if it doesn't. When dismantling, what is removed and what would fall look the same, with an orange or red veil. When felling, the character holds an axe (ash handle and iron head, like the one on the stump in the test); it only appears while felling.","v11: las armas y lo de la liza con el estilo elegido (el de la prueba de estilo v5). Las espadas, con la hoja de secci\xF3n de rombo y su vaceo, el pu\xF1o forrado de cuero con su atadura, la cruz y el pomo de rueda de hierro; el palo, una vara descortezada con nudos; el arco, de una pieza, m\xE1s fino hacia las puntas y con el pu\xF1o de cuero; el escudo, seis tablas con veta, el canto forrado de cuero cosido y el umbo con clavos; la flecha, con punta de hierro y tres plumas atadas. El poste de pr\xE1ctica lleva dos haces de paja atados y piedras al pie; la diana es un haz de paja con un pa\xF1o pintado con tierras (ocre, almagre y carb\xF3n) en vez de los anillos de colores vivos. Las cintas que distinguen a los luchadores son ahora de pa\xF1o te\xF1ido, azul de glasto y amarillo de gualda, m\xE1s apagados.":"v11: the weapons and the things in the lists with the chosen style (that of style test v5). The swords have a diamond-section blade with its fuller, a leather-wrapped grip with its binding, and an iron cross and wheel pommel; the staff is a peeled rod with knots; the bow is a single piece, thinner towards the tips, with a leather grip; the shield has six grained planks, a stitched leather-covered rim and a boss with nails; the arrow has an iron head and three bound feathers. The practice post has two bound bundles of straw and stones at its foot; the target is a straw bundle with a cloth painted with earth pigments (ochre, red ochre and charcoal) instead of the bright coloured rings. The bands that tell the fighters apart are now dyed cloth, woad blue and weld yellow, more muted.","v14: lo que quedaba con el aspecto inicial, con el estilo v5: en \xABConstruir\xBB, la pieza que se ve al colocar (la propia pieza, transl\xFAcida, con un velo verde o rojo), lo que se marca al desmontar y el hacha en la mano al talar; en \xABDuelo\xBB, las espadas, el palo, el arco, el escudo, la flecha, el poste de pr\xE1ctica y la diana. Es la construcci\xF3n v19 y el combate v11.":"v14: what was left with the initial look, now in the v5 style: in \u201CBuild\u201D, the piece you see while placing (the piece itself, see-through, with a green or red veil), what is marked when dismantling and the axe in hand when felling; in \u201CDuel\u201D, the swords, the staff, the bow, the shield, the arrow, the practice post and the target. It is construction v19 and combat v11.","v10: junto a un \xE1rbol, Usar (F) hace que el personaje tale; moverse lo para. De momento es solo el gesto (desde la v19, con el hacha en la mano), sin dar madera: recolectar llega con el hito 2.":"v10: next to a tree, Use (F) makes the character fell it; moving stops it. For now it is only the motion (since v19, with the axe in hand), without giving wood: gathering comes with milestone 2.","Cavar \xB7 v1 (prueba de rendimiento)":"Digging \xB7 v1 (performance test)","v1: prueba de rendimiento de cavar con \xABv\xF3xeles suavizados\xBB (decidido por valravnx el 27 oct). La roca se divide en cubitos de 50 cm, en trozos de 8 m; cada golpe de pico (clic o toque sobre la roca) quita un pu\xF1ado redondeado de unos 80 cm de radio (galer\xEDas de algo m\xE1s de 1,5 m). La pared se dibuja lisa alrededor de los cubitos, con la rugosidad de la roca sacada de una semilla fija: todos ver\xEDan la misma cueva.":"v1: performance test for digging with \xABsmooth voxels\xBB (decided by valravnx on 27 Oct). The rock is split into 50 cm small cubes, in 8 m chunks; each pick stroke (click or tap on the rock) removes a rounded handful about 80 cm in radius (galleries a little over 1.5 m). The wall is drawn smooth around the cubes, with the rock's roughness taken from a fixed seed: everyone would see the same cave.","v1: arriba a la derecha se mide lo que tarda en rehacerse la malla de los trozos tocados en cada golpe (media y peor) y los fotogramas. \xABCavar t\xFAnel\xBB abre solo un t\xFAnel en la ladera para medir sin tener que tocar.":"v1: at the top right it measures how long it takes to rebuild the mesh of the touched chunks on each stroke (average and worst) and the frame rate. \xABDig tunnel\xBB opens a tunnel in the hillside by itself so you can measure without touching.","v1, provisional: no hay personaje ni pico todav\xEDa (se cava tocando la roca con la c\xE1mara libre), ni se oculta lo de encima, ni hay negro ni entibado: son las tareas siguientes del hito 1g.":"v1, provisional: there is no character or pick yet (you dig by touching the rock with the free camera), what is above is not hidden yet, and there is no black or timbering: those are the next tasks of milestone 1g.","{fps} fps \xB7 {tri} mil tri\xE1ngulos \xB7 malla por golpe: {media} ms de media, {peor} ms el peor ({n} golpes)":"{fps} fps \xB7 {tri}k triangles \xB7 mesh per stroke: {media} ms average, {peor} ms worst ({n} strokes)","Cavar t\xFAnel":"Dig tunnel","Toca o haz clic en la roca para cavar. Arrastra para girar la c\xE1mara.":"Tap or click on the rock to dig. Drag to turn the camera."};var iu={Moj\u00F3n:"\u041C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C","v22, arreglo (valravnx: la cama se iba al altillo estando debajo): la decoraci\xF3n solo se apunta a los suelos y cimientos de la planta en la que est\xE1s, aunque el piso de arriba se vea en la pantalla por delante; arriba, fuera de los suelos de tu planta, no se pone.":"v22, \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 (valravnx: \u043A\u0440\u043E\u0432\u0430\u0442\u044C \u0443\u0445\u043E\u0434\u0438\u043B\u0430 \u043D\u0430 \u0430\u043D\u0442\u0440\u0435\u0441\u043E\u043B\u044C, \u043A\u043E\u0433\u0434\u0430 \u0441\u0442\u043E\u0438\u0448\u044C \u043F\u043E\u0434 \u043D\u0435\u0439): \u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 \u043F\u043E\u043B\u044B \u0438 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0442\u043E\u0433\u043E \u044D\u0442\u0430\u0436\u0430, \u043D\u0430 \u043A\u043E\u0442\u043E\u0440\u043E\u043C \u0432\u044B \u0441\u0442\u043E\u0438\u0442\u0435, \u0434\u0430\u0436\u0435 \u0435\u0441\u043B\u0438 \u0432\u0435\u0440\u0445\u043D\u0438\u0439 \u043F\u043E\u043B \u0432\u0438\u0434\u0435\u043D \u043D\u0430 \u044D\u043A\u0440\u0430\u043D\u0435 \u0432\u043F\u0435\u0440\u0435\u0434\u0438; \u043D\u0430\u0432\u0435\u0440\u0445\u0443 \u0432\u043D\u0435 \u043F\u043E\u043B\u043E\u0432 \u0432\u0430\u0448\u0435\u0433\u043E \u044D\u0442\u0430\u0436\u0430 \u0438\u0445 \u043D\u0435 \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C.","v22: los cimientos y los suelos de troncos ya no dejan ver el suelo de debajo por las juntas entre tronco y tronco: llevan debajo un relleno oscuro que tapa del todo.":"v22: \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0438 \u043F\u043E\u043B\u044B \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442 \u0437\u0435\u043C\u043B\u044E \u0432 \u0449\u0435\u043B\u044F\u0445 \u043C\u0435\u0436\u0434\u0443 \u0431\u0440\u0451\u0432\u043D\u0430\u043C\u0438: \u043F\u043E\u0434 \u043D\u0438\u043C\u0438 \u0442\u0451\u043C\u043D\u0430\u044F \u0437\u0430\u0441\u044B\u043F\u043A\u0430, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u0432\u0441\u0451.","v17: en \xABConstruir\xBB, la decoraci\xF3n va al suelo de la planta en la que est\xE1s (ya no al piso de arriba) y los cimientos y suelos de troncos tapan del todo. Es la construcci\xF3n v22.":"v17: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u043D\u0430 \u043F\u043E\u043B \u044D\u0442\u0430\u0436\u0430, \u0433\u0434\u0435 \u0432\u044B \u0441\u0442\u043E\u0438\u0442\u0435 (\u0430 \u043D\u0435 \u043D\u0430 \u0432\u0435\u0440\u0445\u043D\u0438\u0439), \u0430 \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u0438 \u043F\u043E\u043B\u044B \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0432\u0441\u0451. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v22.","Hito 1 \xB7 v22":"\u042D\u0442\u0430\u043F 1 \xB7 v22","Demo \xFAnica \xB7 v17 (decoraci\xF3n en el suelo de tu planta y suelos de troncos sin huecos)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v17 (\u0443\u043A\u0440\u0430\u0448\u0435\u043D\u0438\u044F \u043D\u0430 \u043F\u043E\u043B\u0443 \u0432\u0430\u0448\u0435\u0433\u043E \u044D\u0442\u0430\u0436\u0430 \u0438 \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0435 \u043F\u043E\u043B\u044B \u0431\u0435\u0437 \u0449\u0435\u043B\u0435\u0439)","v21: se construye por obras (decidido por valravnx el 26 oct). Colocar pone solo el marco de la pieza, que se ve tenue dentro de un armaz\xF3n de varas atadas y a\xFAn no cuesta nada. Junto a la obra, Usar (F) le lleva el material que le falta y te pones a construir; moverse lo para y se retoma con Usar. Cada pieza tarda 4 s m\xE1s 1 s por cada 20 kg (el GDD no da cifras: provisional); por ejemplo, un poste 7 s, un muro de troncos 19 s y un cimiento de piedra 24 s. Si te ayudan, se suman los segundos de todos y se acaba antes. La obra a medias guarda lo entregado y el trabajo, con qui\xE9n llev\xF3 cada cosa y qui\xE9n trabaj\xF3 cu\xE1nto.":"v21: \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443 (\u0440\u0435\u0448\u0435\u043D\u0438\u0435 valravnx \u043E\u0442 26 \u043E\u043A\u0442.). \xAB\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C\xBB \u0441\u0442\u0430\u0432\u0438\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u043A\u0430\u0440\u043A\u0430\u0441 \u0434\u0435\u0442\u0430\u043B\u0438: \u043E\u043D\u0430 \u0432\u0438\u0434\u043D\u0430 \u0431\u043B\u0435\u0434\u043D\u043E \u0432\u043D\u0443\u0442\u0440\u0438 \u043A\u0430\u0440\u043A\u0430\u0441\u0430 \u0438\u0437 \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u0436\u0435\u0440\u0434\u0435\u0439 \u0438 \u043F\u043E\u043A\u0430 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0441\u0442\u043E\u0438\u0442. \u0420\u044F\u0434\u043E\u043C \u0441\u043E \u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u043D\u0435\u0434\u043E\u0441\u0442\u0430\u044E\u0449\u0438\u0439 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B, \u0438 \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0441\u0442\u0440\u043E\u0438\u0442\u044C; \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043F\u0440\u0435\u0440\u044B\u0432\u0430\u0435\u0442 \u0440\u0430\u0431\u043E\u0442\u0443, \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0430\u0435\u0442 \u0435\u0451. \u041A\u0430\u0436\u0434\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F 4 \u0441 \u043F\u043B\u044E\u0441 1 \u0441 \u043D\u0430 \u043A\u0430\u0436\u0434\u044B\u0435 20 \u043A\u0433 (\u0432 GDD \u0446\u0438\u0444\u0440 \u043D\u0435\u0442: \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E); \u043D\u0430\u043F\u0440\u0438\u043C\u0435\u0440, \u0441\u0442\u043E\u043B\u0431 7 \u0441, \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 19 \u0441, \u043A\u0430\u043C\u0435\u043D\u043D\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442 24 \u0441. \u0415\u0441\u043B\u0438 \u043F\u043E\u043C\u043E\u0433\u0430\u044E\u0442, \u0441\u0435\u043A\u0443\u043D\u0434\u044B \u0432\u0441\u0435\u0445 \u0441\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u044E\u0442\u0441\u044F, \u0438 \u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0437\u0430\u043A\u0430\u043D\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0431\u044B\u0441\u0442\u0440\u0435\u0435. \u041D\u0435\u0434\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0445\u0440\u0430\u043D\u0438\u0442 \u043F\u0440\u0438\u043D\u0435\u0441\u0451\u043D\u043D\u043E\u0435 \u0438 \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0443\u044E \u0440\u0430\u0431\u043E\u0442\u0443: \u043A\u0442\u043E \u0447\u0442\u043E \u043F\u0440\u0438\u043D\u0451\u0441 \u0438 \u043A\u0442\u043E \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0431\u043E\u0442\u0430\u043B.","v21: una obra a medias no sostiene nada (no se pone nada encima hasta terminarla), no corta el paso ni se puede pisar, y su peso ya cuenta al poner el marco, as\xED que al terminarla aguanta seguro. Una puerta en obras no se abre. Al desmontar una obra a medias se recupera entero lo que se le hab\xEDa llevado.":"v21: \u043D\u0435\u0434\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0434\u0435\u0440\u0436\u0438\u0442 (\u0441\u0432\u0435\u0440\u0445\u0443 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F, \u043F\u043E\u043A\u0430 \u0435\u0451 \u043D\u0435 \u0437\u0430\u043A\u043E\u043D\u0447\u0430\u0442), \u043D\u0435 \u0437\u0430\u0433\u043E\u0440\u0430\u0436\u0438\u0432\u0430\u0435\u0442 \u043F\u0443\u0442\u044C \u0438 \u043F\u043E \u043D\u0435\u0439 \u043D\u0435\u043B\u044C\u0437\u044F \u0445\u043E\u0434\u0438\u0442\u044C, \u0430 \u0435\u0451 \u0432\u0435\u0441 \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0443\u0436\u0435 \u043F\u0440\u0438 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0435 \u043A\u0430\u0440\u043A\u0430\u0441\u0430, \u0442\u0430\u043A \u0447\u0442\u043E \u0437\u0430\u043A\u043E\u043D\u0447\u0435\u043D\u043D\u0430\u044F \u043E\u043D\u0430 \u0442\u043E\u0447\u043D\u043E \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0442. \u0414\u0432\u0435\u0440\u044C \u043D\u0430 \u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u043D\u0435 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F. \u041F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u043D\u0435\u0434\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044F \u0432\u0441\u0451, \u0447\u0442\u043E \u043A \u043D\u0435\u0439 \u043F\u0440\u0438\u043D\u0435\u0441\u043B\u0438.","v21: el material sale a\xFAn de la reserva com\xFAn, como antes; llevarlo a mano hasta la altura de la obra, el andamio y las poleas llegan en las tareas siguientes. Los muebles y el moj\xF3n se siguen poniendo al momento.":"v21: \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u043F\u043E\u043A\u0430 \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0438\u0437 \u043E\u0431\u0449\u0435\u0433\u043E \u0437\u0430\u043F\u0430\u0441\u0430, \u043A\u0430\u043A \u0440\u0430\u043D\u044C\u0448\u0435; \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0442\u044C \u0435\u0433\u043E \u0432\u0440\u0443\u0447\u043D\u0443\u044E \u043D\u0430 \u0432\u044B\u0441\u043E\u0442\u0443 \u0441\u0442\u0440\u043E\u0439\u043A\u0438, \u043B\u0435\u0441\u0430 \u0438 \u0431\u043B\u043E\u043A\u0438 \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0445 \u0437\u0430\u0434\u0430\u0447\u0430\u0445. \u041C\u0435\u0431\u0435\u043B\u044C \u0438 \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u043F\u043E-\u043F\u0440\u0435\u0436\u043D\u0435\u043C\u0443 \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u0441\u0440\u0430\u0437\u0443.","Hito 1 \xB7 v21":"\u042D\u0442\u0430\u043F 1 \xB7 v21","v16: en \xABConstruir\xBB, se construye por obras: colocar pone el marco, Usar (F) junto a la obra le lleva el material y te pone a construir, y cada pieza tarda un tiempo seg\xFAn su peso. Es la construcci\xF3n v21.":"v16: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0438\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443: \xAB\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C\xBB \u0441\u0442\u0430\u0432\u0438\u0442 \u043A\u0430\u0440\u043A\u0430\u0441, \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u0440\u044F\u0434\u043E\u043C \u0441\u043E \u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442 \u0440\u0430\u0431\u043E\u0442\u0443, \u0430 \u043A\u0430\u0436\u0434\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F \u0432\u0440\u0435\u043C\u044F \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043C\u043E\u0441\u0442\u0438 \u043E\u0442 \u0432\u0435\u0441\u0430. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v21.","Demo \xFAnica \xB7 v16 (se construye por obras: marco, material y tiempo)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v16 (\u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0447\u0435\u0440\u0435\u0437 \u0441\u0442\u0440\u043E\u0439\u043A\u0443: \u043A\u0430\u0440\u043A\u0430\u0441, \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u0432\u0440\u0435\u043C\u044F)","Esa pieza ya est\xE1 terminada.":"\u042D\u0442\u0430 \u0434\u0435\u0442\u0430\u043B\u044C \u0443\u0436\u0435 \u0437\u0430\u043A\u043E\u043D\u0447\u0435\u043D\u0430.","A esa obra no le falta ese material.":"\u042D\u0442\u043E\u0439 \u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u043D\u0435 \u043D\u0443\u0436\u0435\u043D \u044D\u0442\u043E\u0442 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B.","Rato de trabajo no v\xE1lido.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E\u0435 \u0432\u0440\u0435\u043C\u044F \u0440\u0430\u0431\u043E\u0442\u044B.","Primero hay que llevarle todo el material.":"\u0421\u043D\u0430\u0447\u0430\u043B\u0430 \u043D\u0443\u0436\u043D\u043E \u043F\u0440\u0438\u043D\u0435\u0441\u0442\u0438 \u0432\u0435\u0441\u044C \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B.","Est\xE1 en obras.":"\u042D\u0442\u043E \u0435\u0449\u0451 \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F.","No hay obra ah\xED.":"\u0422\u0430\u043C \u043D\u0435\u0442 \u0441\u0442\u0440\u043E\u0439\u043A\u0438.","Marco puesto. Ac\xE9rcate y pulsa Usar (F) para llevarle el material y construirla.":"\u041A\u0430\u0440\u043A\u0430\u0441 \u043F\u043E\u0441\u0442\u0430\u0432\u043B\u0435\u043D. \u041F\u043E\u0434\u043E\u0439\u0434\u0438\u0442\u0435 \u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F), \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0438\u043D\u0435\u0441\u0442\u0438 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0438 \u043F\u043E\u0441\u0442\u0440\u043E\u0438\u0442\u044C.","Le falta":"\u041D\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442","Material entregado.":"\u041C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u043F\u0440\u0438\u043D\u0435\u0441\u0451\u043D.","Construyendo:":"\u0421\u0442\u0440\u043E\u0438\u0442\u0441\u044F:","terminada.":"\u0433\u043E\u0442\u043E\u0432\u043E.","Dejas la obra (vuelve con Usar).":"\u0412\u044B \u043E\u0441\u0442\u0430\u0432\u0438\u043B\u0438 \u0441\u0442\u0440\u043E\u0439\u043A\u0443 (\u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442\u044C \u2014 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB).","Cimiento de piedra":"\u041A\u0430\u043C\u0435\u043D\u043D\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442","Cimiento de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442","Suelo de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0439 \u043F\u043E\u043B","Suelo de tablas":"\u0414\u043E\u0449\u0430\u0442\u044B\u0439 \u043F\u043E\u043B",Poste:"\u0421\u0442\u043E\u043B\u0431",Viga:"\u0411\u0430\u043B\u043A\u0430","Muro de zarzo y barro":"\u041F\u043B\u0435\u0442\u0435\u043D\u044C \u0441 \u0433\u043B\u0438\u043D\u043E\u0439","Muro de troncos":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430","Muro de troncos con puerta":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 \u0441 \u0434\u0432\u0435\u0440\u043D\u044B\u043C \u043F\u0440\u043E\u0451\u043C\u043E\u043C","Muro de troncos con ventana":"\u0411\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 \u0441 \u043E\u043A\u043D\u043E\u043C","Muro de entramado":"\u0424\u0430\u0445\u0432\u0435\u0440\u043A\u043E\u0432\u0430\u044F \u0441\u0442\u0435\u043D\u0430","Muro de tablas":"\u0414\u043E\u0449\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430","Muro de tablas con puerta":"\u0414\u043E\u0449\u0430\u0442\u0430\u044F \u0441\u0442\u0435\u043D\u0430 \u0441 \u0434\u0432\u0435\u0440\u043D\u044B\u043C \u043F\u0440\u043E\u0451\u043C\u043E\u043C","Medio muro":"\u041F\u043E\u043B\u0443\u0441\u0442\u0435\u043D\u0430","Tejado de paja":"\u0421\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u0430\u044F \u043A\u0440\u044B\u0448\u0430","Tejado de tablillas":"\u041A\u0440\u044B\u0448\u0430 \u0438\u0437 \u0434\u0440\u0430\u043D\u043A\u0438","Hastial (remate)":"\u0424\u0440\u043E\u043D\u0442\u043E\u043D (\u0449\u0438\u043F\u0435\u0446)","Escalera de mano":"\u041F\u0440\u0438\u0441\u0442\u0430\u0432\u043D\u0430\u044F \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0430","Puerta de varas":"\u041F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u0434\u0432\u0435\u0440\u044C","Puerta de tablas":"\u0414\u043E\u0449\u0430\u0442\u0430\u044F \u0434\u0432\u0435\u0440\u044C","Cerca de varas":"\u041F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u044C","Demo \xFAnica \xB7 v8 (barandillas y portillo en \xABConstruir\xBB)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v8 (\u043F\u0435\u0440\u0438\u043B\u0430 \u0438 \u043A\u0430\u043B\u0438\u0442\u043A\u0430 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB)","v8: en \xABConstruir\xBB, el medio muro hace de barandilla en el borde de un suelo en alto (por ah\xED ya no se cae) y hay portillo de varas para la cerca, que se abre con Usar. Es la construcci\xF3n v13.":"v8: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u043F\u043E\u043B\u0443\u0441\u0442\u0435\u043D\u0430 \u0441\u043B\u0443\u0436\u0438\u0442 \u043F\u0435\u0440\u0438\u043B\u0430\u043C\u0438 \u043D\u0430 \u043A\u0440\u0430\u044E \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043F\u043E\u043B\u0430 (\u0442\u0430\u043C \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435\u043B\u044C\u0437\u044F \u0443\u043F\u0430\u0441\u0442\u044C), \u0438 \u0435\u0441\u0442\u044C \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430 \u0434\u043B\u044F \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v13.","Portillo de varas":"\u041F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430","Hito 1 \xB7 v12":"\u042D\u0442\u0430\u043F 1 \xB7 v12","v13: barandillas. El medio muro hace de barandilla en el borde de un suelo en alto o alrededor del hueco de una escalera de tablas: se apoya en el suelo de al lado (o en el muro de debajo) y no deja pasar, as\xED que por ah\xED ya no se cae. Por el lado por el que se sale de la escalera hay que dejarlo abierto.":"v13: \u043F\u0435\u0440\u0438\u043B\u0430. \u041F\u043E\u043B\u0443\u0441\u0442\u0435\u043D\u0430 \u0441\u043B\u0443\u0436\u0438\u0442 \u043F\u0435\u0440\u0438\u043B\u0430\u043C\u0438 \u043D\u0430 \u043A\u0440\u0430\u044E \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043F\u043E\u043B\u0430 \u0438\u043B\u0438 \u0432\u043E\u043A\u0440\u0443\u0433 \u043F\u0440\u043E\u0451\u043C\u0430 \u0434\u043E\u0449\u0430\u0442\u043E\u0439 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B: \u043E\u043D\u0430 \u043E\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u043F\u043E\u043B (\u0438\u043B\u0438 \u043D\u0430 \u0441\u0442\u0435\u043D\u0443 \u043F\u043E\u0434 \u043D\u0435\u0439) \u0438 \u043D\u0435 \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0430\u0435\u0442, \u0442\u0430\u043A \u0447\u0442\u043E \u0443\u043F\u0430\u0441\u0442\u044C \u0442\u0430\u043C \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435\u043B\u044C\u0437\u044F. \u0421\u0442\u043E\u0440\u043E\u043D\u0443, \u0441 \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u0441\u0445\u043E\u0434\u044F\u0442 \u0441 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B, \u043D\u0443\u0436\u043D\u043E \u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C \u043E\u0442\u043A\u0440\u044B\u0442\u043E\u0439.","v13: portillo de varas para la cerca, para los corrales. Cuesta lo mismo que la puerta de varas (4 varas y 1 cuerda), porque el documento de sistemas no lo dice. Va en el suelo como la cerca y se abre y se cierra con Usar (F); abierto deja pasar.":"v13: \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u043A\u0430\u043B\u0438\u0442\u043A\u0430 \u0434\u043B\u044F \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u0434\u043B\u044F \u0437\u0430\u0433\u043E\u043D\u043E\u0432. \u0421\u0442\u043E\u0438\u0442 \u0441\u0442\u043E\u043B\u044C\u043A\u043E \u0436\u0435, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043F\u043B\u0435\u0442\u0451\u043D\u0430\u044F \u0434\u0432\u0435\u0440\u044C (4 \u0436\u0435\u0440\u0434\u0438 \u0438 1 \u0432\u0435\u0440\u0451\u0432\u043A\u0430), \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0432 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0435 \u0441\u0438\u0441\u0442\u0435\u043C \u044D\u0442\u043E \u043D\u0435 \u0443\u043A\u0430\u0437\u0430\u043D\u043E. \u0421\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u043D\u0430 \u0437\u0435\u043C\u043B\u044E, \u043A\u0430\u043A \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u044C, \u0438 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u0438 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F); \u043E\u0442\u043A\u0440\u044B\u0442\u0430\u044F \u043F\u0440\u043E\u043F\u0443\u0441\u043A\u0430\u0435\u0442.","Demo \xFAnica \xB7 v6 (el cintur\xF3n de la cota ce\xF1ido)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v6 (\u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u043F\u0440\u0438\u043B\u0435\u0433\u0430\u0435\u0442)","v6: el cintur\xF3n de encima de la cota ya no sobresale hacia los brazos, en las tres partes. Es el personaje v14 (personajes del taller-v7), con la construcci\xF3n v11 y el combate v8.":"v6: \u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u043E\u0440\u0447\u0438\u0442 \u043A \u0440\u0443\u043A\u0430\u043C, \u0432\u043E \u0432\u0441\u0435\u0445 \u0442\u0440\u0451\u0445 \u0447\u0430\u0441\u0442\u044F\u0445. \u042D\u0442\u043E \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v14 (\u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0438\u0437 taller-v7), \u0441\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E\u043C v11 \u0438 \u0431\u043E\u0435\u043C v8.","Personaje \xB7 v14 (el cintur\xF3n de la cota ya no se estira hacia los brazos)":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \xB7 v14 (\u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u044F\u043D\u0435\u0442\u0441\u044F \u043A \u0440\u0443\u043A\u0430\u043C)","v14: el cintur\xF3n de encima de la cota ya no sobresale hacia los lados hasta los brazos (valravnx lo vio en las fotos con los brazos abiertos). Al medir el contorno de la cintura se contaban tambi\xE9n las mangas, y las de la cota bajan hasta la mano, que cuelga a esa altura. Ahora solo cuentan el cuerpo y la falda de la prenda. Personajes en taller-v7; lo dem\xE1s, igual que la v13.":"v14: \u043F\u043E\u044F\u0441 \u043F\u043E\u0432\u0435\u0440\u0445 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0442\u043E\u0440\u0447\u0438\u0442 \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u0434\u043E \u0440\u0443\u043A (valravnx \u0437\u0430\u043C\u0435\u0442\u0438\u043B \u044D\u0442\u043E \u043D\u0430 \u0444\u043E\u0442\u043E \u0441 \u0440\u0430\u0437\u0432\u0435\u0434\u0451\u043D\u043D\u044B\u043C\u0438 \u0440\u0443\u043A\u0430\u043C\u0438). \u041F\u0440\u0438 \u0438\u0437\u043C\u0435\u0440\u0435\u043D\u0438\u0438 \u043E\u0431\u0445\u0432\u0430\u0442\u0430 \u0442\u0430\u043B\u0438\u0438 \u0443\u0447\u0438\u0442\u044B\u0432\u0430\u043B\u0438\u0441\u044C \u0438 \u0440\u0443\u043A\u0430\u0432\u0430, \u0430 \u0440\u0443\u043A\u0430\u0432\u0430 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438 \u0434\u043E\u0445\u043E\u0434\u044F\u0442 \u0434\u043E \u043A\u0438\u0441\u0442\u0438, 430\u0448\u0435\u0439 \u0437\u0435\u043C\u043B\u0438.","Planta no permitida.":"\u042D\u0442\u0430\u0436 \u043D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C.","Esta pieza solo va en el suelo.":"\u042D\u0442\u0430 \u0434\u0435\u0442\u0430\u043B\u044C \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u043D\u0430 \u0437\u0435\u043C\u043B\u044E.","En la planta baja usa un cimiento.":"\u041D\u0430 \u043D\u0438\u0436\u043D\u0435\u043C \u044D\u0442\u0430\u0436\u0435 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442.","Ese hueco ya est\xE1 ocupado.":"\u042D\u0442\u043E \u043C\u0435\u0441\u0442\u043E \u0443\u0436\u0435 \u0437\u0430\u043D\u044F\u0442\u043E.","La estructura no soporta ese peso.":"\u041A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u044F \u043D\u0435 \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0442 \u0442\u0430\u043A\u043E\u0439 \u0432\u0435\u0441.","No existe.":"\u041D\u0435 \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443\u0435\u0442.","No se puede desmontar: otra pieza quedar\xEDa sobrecargada.":"\u041D\u0435\u043B\u044C\u0437\u044F \u0440\u0430\u0437\u043E\u0431\u0440\u0430\u0442\u044C: \u0434\u0440\u0443\u0433\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u043E\u043A\u0430\u0436\u0435\u0442\u0441\u044F \u043F\u0435\u0440\u0435\u0433\u0440\u0443\u0436\u0435\u043D\u0430.","No v\xE1lida.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E.","Un suelo en alto necesita muros o vigas debajo, o un suelo al lado que los tenga.":"\u041F\u043E\u043B \u043D\u0430\u0432\u0435\u0440\u0445\u0443 \u0442\u0440\u0435\u0431\u0443\u0435\u0442 \u0441\u0442\u0435\u043D \u0438\u043B\u0438 \u0431\u0430\u043B\u043E\u043A \u043F\u043E\u0434 \u0441\u043E\u0431\u043E\u0439 \u043B\u0438\u0431\u043E \u0441\u043E\u0441\u0435\u0434\u043D\u0435\u0433\u043E \u043F\u043E\u043B\u0430, \u0443 \u043A\u043E\u0442\u043E\u0440\u043E\u0433\u043E \u043E\u043D\u0438 \u0435\u0441\u0442\u044C.","El poste necesita otro poste o un suelo debajo.":"\u0421\u0442\u043E\u043B\u0431\u0443 \u043D\u0443\u0436\u0435\u043D \u0434\u0440\u0443\u0433\u043E\u0439 \u0441\u0442\u043E\u043B\u0431 \u0438\u043B\u0438 \u043F\u043E\u043B \u043F\u043E\u0434 \u043D\u0438\u043C.","El muro necesita un cimiento o suelo al lado, un muro debajo o postes en los dos extremos.":"\u0421\u0442\u0435\u043D\u0435 \u043D\u0443\u0436\u0435\u043D \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442 \u0438\u043B\u0438 \u043F\u043E\u043B \u0440\u044F\u0434\u043E\u043C, \u0441\u0442\u0435\u043D\u0430 \u043F\u043E\u0434 \u043D\u0435\u0439 \u0438\u043B\u0438 \u0441\u0442\u043E\u043B\u0431\u044B \u043D\u0430 \u043E\u0431\u043E\u0438\u0445 \u043A\u043E\u043D\u0446\u0430\u0445.","La viga necesita postes en los dos extremos o un muro debajo.":"\u0411\u0430\u043B\u043A\u0435 \u043D\u0443\u0436\u043D\u044B \u0441\u0442\u043E\u043B\u0431\u044B \u043D\u0430 \u043E\u0431\u043E\u0438\u0445 \u043A\u043E\u043D\u0446\u0430\u0445 \u0438\u043B\u0438 \u0441\u0442\u0435\u043D\u0430 \u043F\u043E\u0434 \u043D\u0435\u0439.","El tejado necesita muros o vigas debajo, o un tramo de tejado al lado que los tenga.":"\u041A\u0440\u044B\u0448\u0435 \u043D\u0443\u0436\u043D\u044B \u0441\u0442\u0435\u043D\u044B \u0438\u043B\u0438 \u0431\u0430\u043B\u043A\u0438 \u043F\u043E\u0434 \u043D\u0435\u0439 \u043B\u0438\u0431\u043E \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u0441\u043A\u0430\u0442 \u043A\u0440\u044B\u0448\u0438, \u0443 \u043A\u043E\u0442\u043E\u0440\u043E\u0433\u043E \u043E\u043D\u0438 \u0435\u0441\u0442\u044C.","El hastial va encima de un muro o una viga.":"\u0424\u0440\u043E\u043D\u0442\u043E\u043D \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u043D\u0430 \u0441\u0442\u0435\u043D\u0443 \u0438\u043B\u0438 \u0431\u0430\u043B\u043A\u0443.","La puerta va en un muro con hueco de puerta.":"\u0414\u0432\u0435\u0440\u044C \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u0432 5\u0440\u0436\u0438\u0432\u0430\u0435\u0442 \u0432\u0435\u0441, \u0441\u043B\u0430\u0431\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u043F\u043E\u0434\u0441\u0432\u0435\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u043A\u0440\u0430\u0441\u043D\u044B\u043C, \u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F.","En <b>Desmontar</b>, la pieza se marca en naranja y lo que caer\xEDa encima en rojo. Recuperas el 75%.":"\u0412 \u0440\u0435\u0436\u0438\u043C\u0435 <b>\u0420\u0430\u0437\u043E\u0431\u0440\u0430\u0442\u044C</b> \u0434\u0435\u0442\u0430\u043B\u044C \u043F\u043E\u0434\u0441\u0432\u0435\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u043E\u0440\u0430\u043D\u0436\u0435\u0432\u044B\u043C, \u0430 \u0442\u043E, \u0447\u0442\u043E \u0443\u043F\u0430\u0434\u0451\u0442 \u0441\u0432\u0435\u0440\u0445\u0443, \u2014 \u043A\u0440\u0430\u0441\u043D\u044B\u043C. \u0412\u044B \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0435 75%.","Las puertas y la escalera de mano se usan con <b>Usar</b>.":"\u0414\u0432\u0435\u0440\u0438 \u0438 \u043F\u0440\u0438\u0441\u0442\u0430\u0432\u043D\u0430\u044F \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0430 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u043E\u0439 <b>\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C</b>.","<kbd>W A S D</kbd> moverse \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n derecho: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> \u0438\u0434\u0442\u0438 \xB7 <kbd>Shift</kbd> \u0431\u0435\u0436\u0430\u0442\u044C \xB7 <kbd>Q</kbd>/<kbd>E</kbd> \u0438\u043B\u0438 \u043F\u0440\u0430\u0432\u0430\u044F \u043A\u043D\u043E\u043F\u043A\u0430: \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B \xB7 \u043A\u043E\u043B\u0435\u0441\u043E: \u043C\u0430\u0441\u0448\u0442\u0430\u0431","<kbd>B</kbd> construir \xB7 <kbd>X</kbd> desmontar \xB7 <kbd>R</kbd> girar pieza \xB7 <kbd>ReP\xE1g</kbd>/<kbd>AvP\xE1g</kbd> planta \xB7 <kbd>F</kbd> usar \xB7 <kbd>Esc</kbd> salir":"<kbd>B</kbd> \u0441\u0442\u0440\u043E\u0438\u0442\u044C \xB7 <kbd>X</kbd> \u0440\u0430\u0437\u043E\u0431\u0440\u0430\u0442\u044C \xB7 <kbd>R</kbd> \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u0434\u0435\u0442\u0430\u043B\u044C \xB7 <kbd>PgUp</kbd>/<kbd>PgDn</kbd> \u044D\u0442\u0430\u0436 \xB7 <kbd>F</kbd> \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \xB7 <kbd>Esc</kbd> \u0432\u044B\u0439\u0442\u0438","Joystick abajo a la izquierda para moverte. Arrastra con un dedo para girar la c\xE1mara y pellizca para el zoom.":"\u0414\u0436\u043E\u0439\u0441\u0442\u0438\u043A \u0441\u043B\u0435\u0432\u0430 \u0432\u043D\u0438\u0437\u0443 \u2014 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435. \u041F\u0440\u043E\u0432\u0435\u0434\u0438\u0442\u0435 \u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043A\u0430\u043C\u0435\u0440\u0443, \u0438 \u0441\u0432\u0435\u0434\u0438\u0442\u0435 \u0434\u0432\u0430 \u043F\u0430\u043B\u044C\u0446\u0430 \u0434\u043B\u044F \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0430.","Al construir, toca el suelo donde quieres la pieza y pulsa <b>Colocar</b>.":"\u041F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u043A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0437\u0435\u043C\u043B\u0438 \u0442\u0430\u043C, \u0433\u0434\u0435 \u043D\u0443\u0436\u043D\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u0438 \u043D\u0430\u0436\u043C\u0438\u0442\u0435 <b>\u041F\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C</b>.",'<label><input type="checkbox" id="chkSigue"> La pieza sigue al personaje (en vez de tocar el suelo)</label>':'<label><input type="checkbox" id="chkSigue"> \u0414\u0435\u0442\u0430\u043B\u044C \u0441\u043B\u0435\u0434\u0443\u0435\u0442 \u0437\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C (\u0432\u043C\u0435\u0441\u0442\u043E \u043A\u0430\u0441\u0430\u043D\u0438\u044F \u0437\u0435\u043C\u043B\u0438)</label>',Opciones:"\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438",Modo:"\u0420\u0435\u0436\u0438\u043C","Tu arma":"\u0412\u0430\u0448\u0435 \u043E\u0440\u0443\u0436\u0438\u0435","Tu ropa":"\u0412\u0430\u0448\u0430 \u043E\u0434\u0435\u0436\u0434\u0430","Ropa del rival":"\u041E\u0434\u0435\u0436\u0434\u0430 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430","Arma del rival":"\u041E\u0440\u0443\u0436\u0438\u0435 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430",Dificultad:"\u0421\u043B\u043E\u0436\u043D\u043E\u0441\u0442\u044C",Sonido:"\u0417\u0432\u0443\u043A","Der.":"\u041F\u0440\u0430\u0432.","Izq.":"\u041B\u0435\u0432.","Estoc.":"\u0423\u043A\u043E\u043B",Parar:"\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C","Otra vez":"\u0415\u0449\u0451 \u0440\u0430\u0437","C\xF3mo se combate":"\u041A\u0430\u043A \u0441\u0440\u0430\u0436\u0430\u0442\u044C\u0441\u044F","<kbd>W A S D</kbd> moverte \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n central: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> \u0438\u0434\u0442\u0438 \xB7 <kbd>Shift</kbd> \u0431\u0435\u0436\u0430\u0442\u044C \xB7 <kbd>Q</kbd>/<kbd>E</kbd> \u0438\u043B\u0438 \u0441\u0440\u0435\u0434\u043D\u044F\u044F \u043A\u043D\u043E\u043F\u043A\u0430: \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B \xB7 \u043A\u043E\u043B\u0435\u0441\u043E: \u043C\u0430\u0441\u0448\u0442\u0430\u0431","Cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean, siempre de cara.":"\u0420\u044F\u0434\u043E\u043C \u0441 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0432\u043F\u0435\u0440\u0451\u0434 \u0438 \u043D\u0430\u0437\u0430\u0434 \u2014 \u0441\u0431\u043B\u0438\u0436\u0435\u043D\u0438\u0435 \u0438 \u043E\u0442\u0445\u043E\u0434, \u0430 \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u2014 \u043E\u0431\u0445\u043E\u0434 \u0432\u043E\u043A\u0440\u0443\u0433 \u043D\u0435\u0433\u043E, \u0432\u0441\u0435\u0433\u0434\u0430 \u043B\u0438\u0446\u043E\u043C \u043A \u043D\u0435\u043C\u0443.","<b>Atacar:</b> sobre el rival aparece una rosa de cinco zonas. Pon el cursor en la zona por la que quieres golpear y haz clic. El centro es la estocada. Tambi\xE9n <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> del teclado num\xE9rico.":"<b>\u0410\u0442\u0430\u043A\u0430:</b> \u043D\u0430\u0434 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0440\u043E\u0437\u0430 \u0438\u0437 \u043F\u044F\u0442\u0438 \u0437\u043E\u043D. \u041D\u0430\u0432\u0435\u0434\u0438\u0442\u0435 \u043A\u0443\u0440\u0441\u043E\u0440 \u043D\u0430 \u0437\u043E\u043D\u0443, \u0441 \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u0445\u043E\u0442\u0438\u0442\u0435 \u0443\u0434\u0430\u0440\u0438\u0442\u044C, \u0438 \u0449\u0451\u043B\u043A\u043D\u0438\u0442\u0435. \u0426\u0435\u043D\u0442\u0440 \u2014 \u0443\u043A\u043E\u043B. \u0422\u0430\u043A\u0436\u0435 <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> \u043D\u0430 \u0446\u0438\u0444\u0440\u043E\u0432\u043E\u0439 \u043A\u043B\u0430\u0432\u0438\u0430\u0442\u0443\u0440\u0435.","<b>Finta:</b> mientras preparas el golpe, haz clic en otra zona para cambiarlo (hasta la mitad de la preparaci\xF3n, cuesta aliento).":"<b>\u0424\u0438\u043D\u0442:</b> \u043F\u043E\u043A\u0430 \u0433\u043E\u0442\u043E\u0432\u0438\u0442\u0435 \u0443\u0434\u0430\u0440, \u0449\u0451\u043B\u043A\u043D\u0438\u0442\u0435 \u043F\u043E \u0434\u0440\u0443\u0433\u043E\u0439 \u0437\u043E\u043D\u0435, \u0447\u0442\u043E\u0431\u044B \u0441\u043C\u0435\u043D\u0438\u0442\u044C \u0435\u0433\u043E (\u0434\u043E \u0441\u0435\u0440\u0435\u0434\u0438\u043D\u044B \u0437\u0430\u043C\u0430\u0445\u0430, \u0442\u0440\u0430\u0442\u0438\u0442 \u0434\u044B\u0445\u0430\u043D\u0438\u0435).","<b>Parar:</b> mant\xE9n el bot\xF3n derecho o <kbd>Espacio</kbd>. No hace falta elegir lado.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043F\u0440\u0430\u0432\u0443\u044E \u043A\u043D\u043E\u043F\u043A\u0443 \u0438\u043B\u0438 <kbd>\u041F\u0440\u043E\u0431\u0435\u043B</kbd>. \u0412\u044B\u0431\u0438\u0440\u0430\u0442\u044C \u0441\u0442\u043E\u0440\u043E\u043D\u0443 \u043D\u0435 \u043D\u0443\u0436\u043D\u043E.","<b>Arco y piedras:</b> mant\xE9n el bot\xF3n izquierdo para tensar, apunta y suelta. El c\xEDrculo se cierra al tensar y se pone verde cuando est\xE1 listo; si aguantas demasiado tiembla.":"<b>\u041B\u0443\u043A \u0438 \u043A\u0430\u043C\u043D\u0438:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043B\u0435\u0432\u0443\u044E \u043A\u043D\u043E\u043F\u043A\u0443, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u044C, \u043F\u0440\u0438\u0446\u0435\u043B\u044C\u0442\u0435\u0441\u044C \u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u0435. \u041A\u0440\u0443\u0433 \u0441\u0443\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u043D\u0430\u0442\u044F\u0436\u0435\u043D\u0438\u0438 \u0438 \u0437\u0435\u043B\u0435\u043D\u0435\u0435\u0442, \u043A\u043E\u0433\u0434\u0430 \u0433\u043E\u0442\u043E\u0432\u043E; \u0435\u0441\u043B\u0438 \u0434\u0435\u0440\u0436\u0430\u0442\u044C \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0434\u043E\u043B\u0433\u043E, \u043E\u043D \u0434\u0440\u043E\u0436\u0438\u0442.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Dos dedos giran la c\xE1mara.":"\u0414\u0436\u043E\u0439\u0441\u0442\u0438\u043A \u0441\u043B\u0435\u0432\u0430 \u2014 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435; \u0440\u044F\u0434\u043E\u043C \u0441 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u0432 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u2014 \u043E\u0431\u0445\u043E\u0434 \u0432\u043E\u043A\u0440\u0443\u0433 \u043D\u0435\u0433\u043E. \u0414\u0432\u0443\u043C\u044F \u043F\u0430\u043B\u044C\u0446\u0430\u043C\u0438 \u2014 \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u043C\u0435\u0440\u044B.","<b>Atacar:</b> toca una zona de la rosa que aparece sobre el rival. El centro es la estocada. Tocar otra zona mientras preparas es una finta.":"<b>\u0410\u0442\u0430\u043A\u0430:</b> \u043A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0437\u043E\u043D\u044B \u0440\u043E\u0437\u044B, \u043F\u043E\u044F\u0432\u043B\u044F\u044E\u0449\u0435\u0439\u0441\u044F \u043D\u0430\u0434 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C. \u0426\u0435\u043D\u0442\u0440 \u2014 \u0443\u043A\u043E\u043B. \u041A\u0430\u0441\u0430\u043D\u0438\u0435 \u0434\u0440\u0443\u0433\u043E\u0439 \u0437\u043E\u043D\u044B \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0437\u0430\u043C\u0430\u0445\u0430 \u2014 \u0444\u0438\u043D\u0442.","<b>Parar:</b> mant\xE9n el bot\xF3n Parar.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043A\u043D\u043E\u043F\u043A\u0443 \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta.":"<b>\u041B\u0443\u043A \u0438 \u043A\u0430\u043C\u043D\u0438:</b> \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0439\u0442\u0435 \u043F\u0430\u043B\u0435\u0446, \u0447\u0442\u043E\u0431\u044B \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u044C, \u0432\u0435\u0434\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0438\u0446\u0435\u043B\u0438\u0442\u044C\u0441\u044F, \u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u0435.","Las tres capas de defensa":"\u0422\u0440\u0438 \u0443\u0440\u043E\u0432\u043D\u044F \u0437\u0430\u0449\u0438\u0442\u044B","<b>Parada:</b> mantener Parar detiene cualquier golpe, pero cansa. Agotado (95%), cede.":"<b>\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u0443\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u0435 \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u043B\u044E\u0431\u043E\u0439 \u0443\u0434\u0430\u0440, \u043D\u043E \u0443\u0442\u043E\u043C\u043B\u044F\u0435\u0442. \u041F\u0440\u0438 \u0438\u0437\u043D\u0435\u043C\u043E\u0436\u0435\u043D\u0438\u0438 (95%) \u043E\u043D\u043E \u043D\u0435 \u0434\u0435\u0440\u0436\u0438\u0442.","<b>Escudo</b> (arma \xABEspada y escudo\xBB): al parar se levanta; para tambi\xE9n flechas y piedras que te vengan de frente y cansa menos que parar con la espada. La espada de una mano llega algo menos que la larga.":"<b>\u0429\u0438\u0442</b> (\u043E\u0440\u0443\u0436\u0438\u0435 \xAB\u041C\u0435\u0447 \u0438 \u0449\u0438\u0442\xBB): \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0438; \u0442\u0430\u043A\u0436\u0435 \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u0441\u0442\u0440\u0435\u043B\u044B \u0438 \u043A\u0430\u043C\u043D\u0438, \u043B\u0435\u0442\u044F\u0449\u0438\u0435 \u0441\u043F\u0435\u0440\u0435\u0434\u0438, \u0438 \u0443\u0442\u043E\u043C\u043B\u044F\u0435\u0442 \u043C\u0435\u043D\u044C\u0448\u0435, \u0447\u0435\u043C \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043C\u0435\u0447\u043E\u043C. \u041E\u0434\u043D\u043E\u0440\u0443\u0447\u043D\u044B\u0439 \u043C\u0435\u0447 \u0434\u043E\u0441\u0442\u0430\u0451\u0442 \u0447\u0443\u0442\u044C \u0431\u043B\u0438\u0436\u0435 \u0434\u043B\u0438\u043D\u043D\u043E\u0433\u043E.",'<b>Parada perfecta:</b> empieza a parar justo antes del impacto (zona en <span style="color:var(--verde)">verde</span> en aprendiz). El rival queda descolocado y tu contraataque sale r\xE1pido y solo se para con otra parada perfecta.':'<b>\u0418\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435:</b> \u043D\u0430\u0447\u043D\u0438\u0442\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u043F\u0440\u044F\u043C\u043E \u043F\u0435\u0440\u0435\u0434 \u0443\u0434\u0430\u0440\u043E\u043C (\u0437\u043E\u043D\u0430 <span style="color:var(--verde)">\u0437\u0435\u043B\u0451\u043D\u0430\u044F</span> \u043D\u0430 \u0443\u0440\u043E\u0432\u043D\u0435 \xAB\u0423\u0447\u0435\u043D\u0438\u043A\xBB). \u041F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u0442\u0435\u0440\u044F\u0435\u0442 \u0440\u0430\u0432\u043D\u043E\u0432\u0435\u0441\u0438\u0435, \u0430 \u0432\u0430\u0448\u0430 \u043A\u043E\u043D\u0442\u0440\u0430\u0442\u0430\u043A\u0430 \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u0431\u044B\u0441\u0442\u0440\u043E, \u0438 \u0435\u0451 \u043E\u0442\u0440\u0430\u0436\u0430\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0440\u0443\u0433\u043E\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435.','<b>Golpe maestro:</b> si ves venir un golpe por un lado (zona en <span style="color:var(--rojo)">rojo</span>), golpea t\xFA por ese mismo lado al principio de su preparaci\xF3n (borde dorado). Desv\xEDas su golpe y el tuyo entra.':'<b>\u041C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440:</b> \u0435\u0441\u043B\u0438 \u0432\u0438\u0434\u0438\u0442\u0435, \u0447\u0442\u043E \u0443\u0434\u0430\u0440 \u0438\u0434\u0451\u0442 \u0441 \u043E\u0434\u043D\u043E\u0439 \u0441\u0442\u043E\u0440\u043E\u043D\u044B (\u0437\u043E\u043D\u0430 <span style="color:var(--rojo)">\u043A\u0440\u0430\u0441\u043D\u0430\u044F</span>), \u0443\u0434\u0430\u0440\u044C\u0442\u0435 \u0441 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u0432 \u043D\u0430\u0447\u0430\u043B\u0435 \u0435\u0433\u043E \u0437\u0430\u043C\u0430\u0445\u0430 (\u0437\u043E\u043B\u043E\u0442\u0430\u044F \u043A\u0430\u0439\u043C\u0430). \u0412\u044B \u043E\u0442\u0432\u043E\u0434\u0438\u0442\u0435 \u0435\u0433\u043E \u0443\u0434\u0430\u0440, \u0438 \u0432\u0430\u0448 \u043F\u0440\u043E\u0445\u043E\u0434\u0438\u0442.',"En <b>aprendiz</b> los golpes son lentos y ves el lado y el momento. En <b>normal</b> solo ves el lado. En <b>realista</b> no hay avisos: hay que leer el cuerpo del rival.":"\u041D\u0430 \u0443\u0440\u043E\u0432\u043D\u0435 <b>\xAB\u0423\u0447\u0435\u043D\u0438\u043A\xBB</b> \u0443\u0434\u0430\u0440\u044B \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0435, \u0438 \u0432\u0438\u0434\u043D\u044B \u0441\u0442\u043E\u0440\u043E\u043D\u0430 \u0438 \u043C\u043E\u043C\u0435\u043D\u0442. \u041D\u0430 <b>\u043E\u0431\u044B\u0447\u043D\u043E\u043C</b> \u0432\u0438\u0434\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0442\u043E\u0440\u043E\u043D\u0430. \u041D\u0430 <b>\u0440\u0435\u0430\u043B\u0438\u0441\u0442\u0438\u0447\u043D\u043E\u043C</b> \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043E\u043A \u043D\u0435\u0442: \u043D\u0443\u0436\u043D\u043E \u0447\u0438\u0442\u0430\u0442\u044C \u0442\u0435\u043B\u043E \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430.",Avisos:"\u0421\u043E\u0441\u0442\u043E\u044F\u043D\u0438\u0435","Los c\xEDrculos de la derecha avisan de cansancio, sangrado y heridas. T\xF3calos para ver qu\xE9 efecto tienen.":"\u041A\u0440\u0443\u0433\u0438 \u0441\u043F\u0440\u0430\u0432\u0430 \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0436\u0434\u0430\u044E\u0442 \u043E\u0431 \u0443\u0441\u0442\u0430\u043B\u043E\u0441\u0442\u0438, \u043A\u0440\u043E\u0432\u043E\u0442\u0435\u0447\u0435\u043D\u0438\u0438 \u0438 \u0440\u0430\u043D\u0430\u0445. \u041A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0438\u0445, \u0447\u0442\u043E\u0431\u044B \u0443\u0437\u043D\u0430\u0442\u044C \u0438\u0445 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435.","Decisiones tomadas en el combate":"\u0420\u0435\u0448\u0435\u043D\u0438\u044F, \u043F\u0440\u0438\u043D\u044F\u0442\u044B\u0435 \u0434\u043B\u044F \u0431\u043E\u044F","Terreno llano en este hito. Las cuestas y su efecto en los cimientos llegan con el mundo generado.":"\u0412 \u044D\u0442\u043E\u043C \u044D\u0442\u0430\u043F\u0435 \u043C\u0435\u0441\u0442\u043D\u043E\u0441\u0442\u044C \u0440\u043E\u0432\u043D\u0430\u044F. \u0421\u043A\u043B\u043E\u043D\u044B \u0438 \u0438\u0445 \u0432\u043B\u0438\u044F\u043D\u0438\u0435 \u043D\u0430 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u0433\u0435\u043D\u0435\u0440\u0438\u0440\u0443\u0435\u043C\u044B\u043C \u043C\u0438\u0440\u043E\u043C.","Los materiales vienen dados (y hay bot\xF3n para rellenar). Recolectarlos llega en el hito 2.":"\u041C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B \u0432\u044B\u0434\u0430\u044E\u0442\u0441\u044F (\u0438 \u0435\u0441\u0442\u044C \u043A\u043D\u043E\u043F\u043A\u0430, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u044C \u0438\u0445). \u0418\u0445 \u0434\u043E\u0431\u044B\u0447\u0430 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0432 \u044D\u0442\u0430\u043F\u0435 2.","Para construir hace falta tu moj\xF3n; la tierra es un c\xEDrculo de 20 m (moj\xF3n de nivel 1). Subir de nivel el moj\xF3n llega m\xE1s adelante.":"\u0414\u043B\u044F \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0430 \u043D\u0443\u0436\u0435\u043D \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C; \u0437\u0435\u043C\u043B\u044F \u2014 \u043A\u0440\u0443\u0433 \u0440\u0430\u0434\u0438\u0443\u0441\u043E\u043C 20 \u043C (\u043A\u0430\u043C\u0435\u043D\u044C 1-\u0433\u043E \u0443\u0440\u043E\u0432\u043D\u044F). \u041F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u0435 \u0443\u0440\u043E\u0432\u043D\u044F \u043A\u0430\u043C\u043D\u044F \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043F\u043E\u0437\u0436\u0435.","La primera pieza estructural fija la rejilla: posici\xF3n donde apuntas y giro libre en pasos de 15\xB0. Toda pieza a menos de 6 m de una construcci\xF3n encaja en su rejilla.":"\u041F\u0435\u0440\u0432\u0430\u044F \u043D\u0435\u0441\u0443\u0449\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0437\u0430\u0434\u0430\u0451\u0442 \u0441\u0435\u0442\u043A\u0443: \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0435 \u2014 \u043A\u0443\u0434\u0430 \u0432\u044B \u0446\u0435\u043B\u0438\u0442\u0435\u0441\u044C, \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u044B\u0439, \u0448\u0430\u0433\u0430\u043C\u0438 \u043F\u043E 15\xB0. \u041B\u044E\u0431\u0430\u044F \u0434\u0435\u0442\u0430\u043B\u044C \u0431\u043B\u0438\u0436\u0435 6 \u043C \u043A \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0435 \u0432\u0441\u0442\u0430\u0451\u0442 \u043F\u043E \u0435\u0451 \u0441\u0435\u0442\u043A\u0435.","Los apoyos siguen un orden realista: un muro descansa primero en el muro o la viga de debajo, si no en postes en sus dos extremos, y si no en el suelo o cimiento de al lado.":"\u041E\u043F\u043E\u0440\u044B \u0441\u043B\u0435\u0434\u0443\u044E\u0442 \u0440\u0435\u0430\u043B\u0438\u0441\u0442\u0438\u0447\u043D\u043E\u043C\u0443 \u043F\u043E\u0440\u044F\u0434\u043A\u0443: \u0441\u0442\u0435\u043D\u0430 \u043E\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0441\u043D\u0430\u0447\u0430\u043B\u0430 \u043D\u0430 \u0441\u0442\u0435\u043D\u0443 \u0438\u043B\u0438 \u0431\u0430\u043B\u043A\u0443 \u043F\u043E\u0434 \u043D\u0435\u0439, \u0438\u043D\u0430\u0447\u0435 \u2014 \u043D\u0430 \u0441\u0442\u043E\u043B\u0431\u044B \u043D\u0430 \u043E\u0431\u043E\u0438\u0445 \u043A\u043E\u043D\u0446\u0430\u0445, \u0438\u043D\u0430\u0447\u0435 \u2014 \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u043F\u043E\u043B \u0438\u043B\u0438 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442.","La carga se reparte a partes iguales entre los apoyos de cada pieza.":"\u041D\u0430\u0433\u0440\u0443\u0437\u043A\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043F\u043E\u0440\u043E\u0432\u043D\u0443 \u043C\u0435\u0436\u0434\u0443 \u043E\u043F\u043E\u0440\u0430\u043C\u0438 \u043A\u0430\u0436\u0434\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438.","Al desmontar recuperas el 75% de esa pieza. Lo que cae en cascada encima se destruye sin devolver material.":"\u041F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u0432\u044B \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0435 75% \u044D\u0442\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438. \u0422\u043E, \u0447\u0442\u043E \u043E\u0431\u0440\u0443\u0448\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0441\u0432\u0435\u0440\u0445\u0443, \u0443\u043D\u0438\u0447\u0442\u043E\u0436\u0430\u0435\u0442\u0441\u044F \u0431\u0435\u0437 \u0432\u043E\u0437\u0432\u0440\u0430\u0442\u0430 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0430.","Si al desmontar una pieza otra quedar\xEDa sobrecargada (no sin apoyo, sino con demasiado peso), el desmontaje se bloquea y se marca la pieza que fallar\xEDa.":"\u0415\u0441\u043B\u0438 \u043F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u043E\u0434\u043D\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438 \u0434\u0440\u0443\u0433\u0430\u044F \u043E\u043A\u0430\u0436\u0435\u0442\u0441\u044F \u043F\u0435\u0440\u0435\u0433\u0440\u0443\u0436\u0435\u043D\u0430 (\u043D\u0435 \u0431\u0435\u0437 \u043E\u043F\u043E\u0440\u044B, \u0430 \u043F\u043E\u0434 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0431\u043E\u043B\u044C\u0448\u0438\u043C \u0432\u0435\u0441\u043E\u043C), \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0430 \u0431\u043B\u043E\u043A\u0438\u0440\u0443\u0435\u0442\u0441\u044F \u0438 \u043E\u0442\u043C\u0435\u0447\u0430\u0435\u0442\u0441\u044F \u0434\u0435\u0442\u0430\u043B\u044C, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043D\u0435 \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0442.","Los muros que quedan debajo de un tejado se cierran solos hasta tocarlo, con su mismo material: ya no hace falta poner hastiales a mano (la pieza se ha quitado del men\xFA).":"\u0421\u0442\u0435\u043D\u044B \u043F\u043E\u0434 \u043A\u0440\u044B\u0448\u0435\u0439 \u0441\u0430\u043C\u0438 \u0434\u043E\u0441\u0442\u0440\u0430\u0438\u0432\u0430\u044E\u0442\u0441\u044F \u0434\u043E \u043D\u0435\u0451 \u0438\u0437 \u0442\u043E\u0433\u043E \u0436\u0435 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0430: \u0444\u0440\u043E\u043D\u0442\u043E\u043D\u044B \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043D\u0443\u0436\u043D\u043E \u0441\u0442\u0430\u0432\u0438\u0442\u044C \u0432\u0440\u0443\u0447\u043D\u0443\u044E (\u0434\u0435\u0442\u0430\u043B\u044C \u0443\u0431\u0440\u0430\u043D\u0430 \u0438\u0437 \u043C\u0435\u043D\u044E).","Cada tramo de tejado sube 1,2 m en sus 2 m. Tramos seguidos en la misma direcci\xF3n forman una sola pendiente continua; dos tramos enfrentados forman la cumbrera.":"\u041A\u0430\u0436\u0434\u044B\u0439 \u0441\u043A\u0430\u0442 \u043A\u0440\u044B\u0448\u0438 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F \u043D\u0430 1,2 \u043C \u043D\u0430 \u0441\u0432\u043E\u0438\u0445 2 \u043C. \u0421\u043A\u0430\u0442\u044B \u043F\u043E\u0434\u0440\u044F\u0434 \u0432 \u043E\u0434\u043D\u043E\u043C \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0438 \u043E\u0431\u0440\u0430\u0437\u0443\u044E\u0442 \u043E\u0434\u0438\u043D \u0441\u043F\u043B\u043E\u0448\u043D\u043E\u0439 \u0441\u043A\u043B\u043E\u043D; \u0434\u0432\u0430 \u0432\u0441\u0442\u0440\u0435\u0447\u043D\u044B\u0445 \u0441\u043A\u0430\u0442\u0430 \u043E\u0431\u0440\u0430\u0437\u0443\u044E\u0442 \u043A\u043E\u043D\u0451\u043A.","Las piezas que no aguantan peso (cercas, empalizadas, medio muro) nunca cuentan como apoyo de otras. Un tramo de tejado solo puede sostener el tramo de tejado de al lado.":"\u0414\u0435\u0442\u0430\u043B\u0438, \u043D\u0435 \u043D\u0435\u0441\u0443\u0449\u0438\u0435 \u0432\u0435\u0441 (\u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B\u044B, \u043F\u043E\u043B\u0443\u0441\u0442\u0435\u043D\u044B), \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u0441\u0447\u0438\u0442\u0430\u044E\u0442\u0441\u044F \u043E\u043F\u043E\u0440\u043E\u0439 \u0434\u043B\u044F \u0434\u0440\u0443\u0433\u0438\u0445. \u0421\u043A\u0430\u0442 \u043A\u0440\u044B\u0448\u0438 \u043C\u043E\u0436\u0435\u0442 \u0434\u0435\u0440\u0436\u0430\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u0441\u043A\u0430\u0442 \u043A\u0440\u044B\u0448\u0438.","v4 (valravnx: \xABla madera es demasiado d\xE9bil\xBB): la madera aguanta bastante m\xE1s. Una casa de troncos de 2 plantas con tejado se hace sin trucos y sin pasar del 75% en ninguna pieza; 3 plantas piden cimiento de piedra; el zarzo no da para dos plantas.":"v4 (valravnx: \xAB\u0434\u0435\u0440\u0435\u0432\u043E \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0441\u043B\u0430\u0431\u043E\u0435\xBB): \u0434\u0435\u0440\u0435\u0432\u043E \u0442\u0435\u043F\u0435\u0440\u044C \u0434\u0435\u0440\u0436\u0438\u0442 \u0437\u0430\u043C\u0435\u0442\u043D\u043E \u0431\u043E\u043B\u044C\u0448\u0435. \u0414\u0432\u0443\u0445\u044D\u0442\u0430\u0436\u043D\u044B\u0439 \u0431\u0440\u0435\u0432\u0435\u043D\u0447\u0430\u0442\u044B\u0439 \u0434\u043E\u043C \u0441 \u043A\u0440\u044B\u0448\u0435\u0439 \u0441\u0442\u0440\u043E\u0438\u0442\u0441\u044F \u0431\u0435\u0437 \u0445\u0438\u0442\u0440\u043E\u0441\u0442\u0435\u0439 \u0438 \u0431\u0435\u0437 \u043F\u0440\u0435\u0432\u044B\u0448\u0435\u043D\u0438\u044F 75% \u043D\u0438 \u043D\u0430 \u043E\u0434\u043D\u043E\u0439 \u0434\u0435\u0442\u0430\u043B\u0438; \u0434\u043B\u044F 3 \u044D\u0442\u0430\u0436\u0435\u0439 \u043D\u0443\u0436\u0435\u043D \u043A\u0430\u043C\u0435\u043D\u043D\u044B\u0439 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442; \u043F\u043B\u0435\u0442\u0435\u043D\u044C \u0441 \u0433\u043B\u0438\u043D\u043E\u0439 \u043D\u0435 \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442 \u0434\u0432\u0443\u0445 \u044D\u0442\u0430\u0436\u0435\u0439.","v4: vano de una casilla. Un suelo en alto o un tramo de tejado sin muros debajo se apoya en el suelo o el tramo de al lado que s\xED los tenga. As\xED una casa de hasta 4\xD74 casillas no necesita vigas por dentro; de 5\xD75 en adelante, el centro s\xED.":"v4: \u043F\u0440\u043E\u043B\u0451\u0442 \u0432 \u043E\u0434\u043D\u0443 \u043A\u043B\u0435\u0442\u043A\u0443. \u041F\u043E\u043B \u043D\u0430\u0432\u0435\u0440\u0445\u0443 \u0438\u043B\u0438 \u0441\u043A\u0430\u0442 \u043A\u0440\u044B\u0448\u0438 \u0431\u0435\u0437 \u0441\u0442\u0435\u043D \u043F\u043E\u0434 \u043D\u0438\u043C\u0438 \u043E\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u0438\u0439 \u043F\u043E\u043B \u0438\u043B\u0438 \u0441\u043A\u0430\u0442, \u0443 \u043A\u043E\u0442\u043E\u0440\u043E\u0433\u043E \u043E\u043D\u0438 \u0435\u0441\u0442\u044C. \u0422\u0430\u043A \u0434\u043E\u043C\u0443 \u0434\u043E 4\xD74 \u043A\u043B\u0435\u0442\u043E\u043A \u043D\u0435 \u043D\u0443\u0436\u043D\u044B \u0431\u0430\u043B\u043A\u0438 \u0432\u043D\u0443\u0442\u0440\u0438; \u043E\u0442 5\xD75 \u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043E\u043D\u0438 \u043D\u0443\u0436\u043D\u044B \u0432 \u0446\u0435\u043D\u0442\u0440\u0435.","v4: lo que aguanta cada pieza (kg): cimiento de piedra 6000, de troncos 2000; muro de troncos 1200 (con puerta 850, con ventana 1000), entramado 1400, tablas 900 (con puerta 600), zarzo 250; poste 2000, viga 1000; suelo de troncos 900, de tablas 1000. Todo provisional, para que lo ajustes.":"v4: \u0441\u043A\u043E\u043B\u044C\u043A
