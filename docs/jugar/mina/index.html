u0441\u0442\u0440\u043E\u0439\u043A\u0430\u043C\u0438).","v7: escena com\xFAn del estilo elegido (src/mundo/): mismo cielo, sol, sombras blandas, niebla, suelo con textura, bosque, hierba, flores y rocas que la prueba de estilo, con la liza de tierra pisada en el centro.":"v7: \u043E\u0431\u0449\u0430\u044F \u0441\u0446\u0435\u043D\u0430 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (src/mundo/): \u0442\u043E \u0436\u0435 \u043D\u0435\u0431\u043E, \u0441\u043E\u043B\u043D\u0446\u0435, \u043C\u044F\u0433\u043A\u0438\u0435 \u0442\u0435\u043D\u0438, \u0442\u0443\u043C\u0430\u043D, \u0437\u0435\u043C\u043B\u044F \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439, \u043B\u0435\u0441, \u0442\u0440\u0430\u0432\u0430, \u0446\u0432\u0435\u0442\u044B \u0438 \u043A\u0430\u043C\u043D\u0438, \u0447\u0442\u043E \u0438 \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F, \u0441 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u043E\u0439 \u0443\u0442\u043E\u043F\u0442\u0430\u043D\u043D\u043E\u0439 \u0437\u0435\u043C\u043B\u0438 \u0434\u043B\u044F \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430 \u0432 \u0446\u0435\u043D\u0442\u0440\u0435.","Hito 1 \xB7 v10":"\u042D\u0442\u0430\u043F 1 \xB7 v10","Talas el \xE1rbol (de momento solo el gesto: la madera llega con la recolecci\xF3n).":"\u0412\u044B \u0440\u0443\u0431\u0438\u0442\u0435 \u0434\u0435\u0440\u0435\u0432\u043E (\u043F\u043E\u043A\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435: \u0434\u0440\u0435\u0432\u0435\u0441\u0438\u043D\u0430 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0441\u043E \u0441\u0431\u043E\u0440\u043E\u043C \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432).","v10: el jugador es el personaje del taller propio (el de MakeHuman vestido por c\xF3digo), con camisa y calzas de lino, como se empieza seg\xFAn el GDD. Lleva zapatos aunque el GDD dice descalzo: el cuerpo del taller no tiene pies bajo los zapatos y sin ellos se ver\xEDa sin pies (queda como tarea del taller). Anda, corre y tala con las animaciones de Quaternius, que se aceleran con la velocidad hasta 1,6\xD7 (a la carrera los pies resbalan algo: el juego va m\xE1s r\xE1pido que la animaci\xF3n). Mientras carga se ve el mu\xF1eco de antes.":"v10: \u0438\u0433\u0440\u043E\u043A \u2014 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0438\u0437 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (\u0442\u0435\u043B\u043E MakeHuman, \u043E\u0434\u0435\u0442\u043E\u0435 \u043A\u043E\u0434\u043E\u043C), \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445, \u043A\u0430\u043A \u043F\u043E GDD \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0441\u044F \u0438\u0433\u0440\u0430. \u041D\u0430 \u043D\u0451\u043C \u0431\u0430\u0448\u043C\u0430\u043A\u0438, \u0445\u043E\u0442\u044F \u043F\u043E GDD \u043E\u043D \u0431\u043E\u0441\u043E\u0439: \u0443 \u0442\u0435\u043B\u0430 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u043D\u0435\u0442 \u0441\u0442\u0443\u043F\u043D\u0435\u0439 \u043F\u043E\u0434 \u0431\u0430\u0448\u043C\u0430\u043A\u0430\u043C\u0438, \u0438 \u0431\u0435\u0437 \u043D\u0438\u0445 \u043E\u043D \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B \u0431\u044B \u0431\u0435\u0437 \u043D\u043E\u0433 (\u044D\u0442\u043E \u043E\u0441\u0442\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0434\u0430\u0447\u0435\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439). \u041E\u043D \u0445\u043E\u0434\u0438\u0442, \u0431\u0435\u0433\u0430\u0435\u0442 \u0438 \u0440\u0443\u0431\u0438\u0442 \u0441 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u043C\u0438 Quaternius, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0443\u0441\u043A\u043E\u0440\u044F\u044E\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441\u043E \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C\u044E \u0434\u043E 1,6\xD7 (\u043D\u0430 \u0431\u0435\u0433\u0443 \u043D\u043E\u0433\u0438 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0441\u043A\u043E\u043B\u044C\u0437\u044F\u0442: \u0438\u0433\u0440\u0430 \u0431\u044B\u0441\u0442\u0440\u0435\u0435 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0438). \u041F\u043E\u043A\u0430 \u043E\u043D \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u0432\u0438\u0434\u0435\u043D \u043F\u0440\u0435\u0436\u043D\u0438\u0439 \u043C\u0430\u043D\u0435\u043A\u0435\u043D.","Combate \xB7 v8":"\u0411\u043E\u0439 \xB7 v8","v8: los dos luchadores son el personaje del taller propio (MakeHuman vestido por capas). La armadura del duelo son las capas del taller: lino = camisa y calzas, gambes\xF3n = gambes\xF3n, cota de malla = cota encima del gambes\xF3n. Mientras carga se ve el mu\xF1eco de antes.":"v8: \u043E\u0431\u0430 \u0431\u043E\u0439\u0446\u0430 \u2014 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0438\u0437 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (MakeHuman, \u043E\u0434\u0435\u0442\u044B\u0439 \u0441\u043B\u043E\u044F\u043C\u0438). \u0414\u043E\u0441\u043F\u0435\u0445 \u0432 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0435 \u2014 \u044D\u0442\u043E \u0441\u043B\u043E\u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439: \u043B\u0451\u043D = \u0440\u0443\u0431\u0430\u0445\u0430 \u0438 \u0448\u043E\u0441\u0441\u044B, \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0430 = \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0430, \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 = \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0438. \u041F\u043E\u043A\u0430 \u043E\u043D \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u0432\u0438\u0434\u0435\u043D \u043F\u0440\u0435\u0436\u043D\u0438\u0439 \u043C\u0430\u043D\u0435\u043A\u0435\u043D.","v8: las piernas y el cuerpo van con las animaciones del taller (guardia de espada quieto, andar y correr); los brazos se colocan cada fotograma con cinem\xE1tica inversa para que las manos agarren el arma donde la ponen las poses de siempre. Si el brazo no llega (estocada a fondo), el arma se queda en la mano en vez de flotar. La mano izquierda copia el pu\xF1o cerrado de la derecha. Los golpes siguen siendo los de antes; los de las cinco direcciones con animaci\xF3n propia son otra tarea del duelo.":"v8: \u043D\u043E\u0433\u0438 \u0438 \u0442\u0435\u043B\u043E \u0434\u0432\u0438\u0433\u0430\u044E\u0442\u0441\u044F \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u043C\u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (\u0441\u0442\u043E\u0439\u043A\u0430 \u0441 \u043C\u0435\u0447\u043E\u043C \u043D\u0430 \u043C\u0435\u0441\u0442\u0435, \u0445\u043E\u0434\u044C\u0431\u0430 \u0438 \u0431\u0435\u0433); \u0440\u0443\u043A\u0438 \u043A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440 \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u043E\u0431\u0440\u0430\u0442\u043D\u043E\u0439 \u043A\u0438\u043D\u0435\u043C\u0430\u0442\u0438\u043A\u043E\u0439, \u0447\u0442\u043E\u0431\u044B \u043A\u0438\u0441\u0442\u0438 \u0434\u0435\u0440\u0436\u0430\u043B\u0438 \u043E\u0440\u0443\u0436\u0438\u0435 \u0442\u0430\u043C, \u0433\u0434\u0435 \u0435\u0433\u043E \u0441\u0442\u0430\u0432\u044F\u0442 \u043F\u0440\u0435\u0436\u043D\u0438\u0435 \u043F\u043E\u0437\u044B. \u0415\u0441\u043B\u0438 \u0440\u0443\u043A\u0430 \u043D\u0435 \u0434\u043E\u0442\u044F\u0433\u0438\u0432\u0430\u0435\u0442\u0441\u044F (\u0433\u043B\u0443\u0431\u043E\u043A\u0438\u0439 \u0443\u043A\u043E\u043B), \u043E\u0440\u0443\u0436\u0438\u0435 \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0432 \u0440\u0443\u043A\u0435, \u0430 \u043D\u0435 \u0432\u0438\u0441\u0438\u0442 \u0432 \u0432\u043E\u0437\u0434\u0443\u0445\u0435. \u041B\u0435\u0432\u0430\u044F \u043A\u0438\u0441\u0442\u044C \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442 \u0441\u0436\u0430\u0442\u044B\u0439 \u043A\u0443\u043B\u0430\u043A \u043F\u0440\u0430\u0432\u043E\u0439. \u0423\u0434\u0430\u0440\u044B \u043F\u043E\u043A\u0430 \u043F\u0440\u0435\u0436\u043D\u0438\u0435; \u0443\u0434\u0430\u0440\u044B \u0432 \u043F\u044F\u0442\u0438 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F\u0445 \u0441\u043E \u0441\u0432\u043E\u0435\u0439 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0435\u0439 \u2014 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u0430\u044F \u0437\u0430\u0434\u0430\u0447\u0430 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430.","v8: las heridas se pintan como antes (mancha de sangre o morat\xF3n, m\xE1s grande cuanto m\xE1s grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, as\xED que siguen al personaje al moverse. Las dos figuras son el hombre del taller; las distingue la cinta (azul la tuya, amarilla la del rival). Cojear ya no se ve: lo hac\xEDa el mu\xF1eco y las animaciones del taller no lo traen.":"v8: \u0440\u0430\u043D\u044B \u0440\u0438\u0441\u0443\u044E\u0442\u0441\u044F \u043A\u0430\u043A \u0440\u0430\u043D\u044C\u0448\u0435 (\u043F\u044F\u0442\u043D\u043E \u043A\u0440\u043E\u0432\u0438 \u0438\u043B\u0438 \u0441\u0438\u043D\u044F\u043A, \u0442\u0435\u043C \u0431\u043E\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u0442\u044F\u0436\u0435\u043B\u0435\u0435), \u043D\u043E \u043F\u0440\u0438\u043B\u0435\u043F\u043B\u0435\u043D\u044B \u043A \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u043E\u0441\u0442\u0438 \u0442\u0435\u043B\u0430 \u0438\u043B\u0438 \u043E\u0434\u0435\u0436\u0434\u044B \u0442\u0430\u043C, \u043A\u0443\u0434\u0430 \u043F\u0440\u0438\u0448\u0451\u043B\u0441\u044F \u0443\u0434\u0430\u0440, \u0438 \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u044B \u043A \u043A\u043E\u0441\u0442\u0438, \u0442\u0430\u043A \u0447\u0442\u043E \u0441\u043B\u0435\u0434\u0443\u044E\u0442 \u0437\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0432 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438. \u041E\u0431\u0435 \u0444\u0438\u0433\u0443\u0440\u044B \u2014 \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439; \u0440\u0430\u0437\u043B\u0438\u0447\u0430\u0435\u0442 \u0438\u0445 \u043B\u0435\u043D\u0442\u0430 (\u0442\u0432\u043E\u044F \u0441\u0438\u043D\u044F\u044F, \u0443 \u0441\u043E\u043F\u0435\u0440\u043D\u0438\u043A\u0430 \u0436\u0451\u043B\u0442\u0430\u044F). \u0425\u0440\u043E\u043C\u043E\u0442\u0430 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0432\u0438\u0434\u043D\u0430: \u0435\u0451 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u043B \u043C\u0430\u043D\u0435\u043A\u0435\u043D, \u0430 \u0432 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u0445 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u0435\u0451 \u043D\u0435\u0442.",Men\u00FA:"\u041C\u0435\u043D\u044E",KINHOLD:"KINHOLD","Demo: supervivencia medieval. Elige qu\xE9 quieres probar.":"\u0414\u0435\u043C\u043E: \u0441\u0440\u0435\u0434\u043D\u0435\u0432\u0435\u043A\u043E\u0432\u043E\u0435 \u0432\u044B\u0436\u0438\u0432\u0430\u043D\u0438\u0435. \u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435, \u0447\u0442\u043E \u0445\u043E\u0442\u0438\u0442\u0435 \u043F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C.","Levanta una caba\xF1a: cimientos, suelos, muros, tejados y muebles.":"\u041F\u043E\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0445\u0438\u0436\u0438\u043D\u0443: \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B, \u043F\u043E\u043B\u044B, \u0441\u0442\u0435\u043D\u044B, \u043A\u0440\u044B\u0448\u0438 \u0438 \u043C\u0435\u0431\u0435\u043B\u044C.","Combate de habilidad con espada o palo, pr\xE1cticas y carga a distancia.":"\u0411\u043E\u0439 \u043D\u0430 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u0442\u0432\u043E \u0441 \u043C\u0435\u0447\u043E\u043C \u0438\u043B\u0438 \u043F\u0430\u043B\u043A\u043E\u0439, \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043A\u0438 \u0438 \u0430\u0442\u0430\u043A\u0430 \u0441 \u0440\u0430\u0437\u0431\u0435\u0433\u0430.","Elige cuerpo y ropa por capas: es el que construye y el que lucha.":"\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0442\u0435\u043B\u043E \u0438 \u043E\u0434\u0435\u0436\u0434\u0443 \u043F\u043E \u0441\u043B\u043E\u044F\u043C: \u044D\u0442\u043E\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0441\u0442\u0440\u043E\u0438\u0442 \u0438 \u0441\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F.","Progreso del proyecto":"\u0425\u043E\u0434 \u043F\u0440\u043E\u0435\u043A\u0442\u0430","A\xFAn no has elegido personaje: hombre con camisa y calzas de lino.":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0435\u0449\u0451 \u043D\u0435 \u0432\u044B\u0431\u0440\u0430\u043D: \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445.","Tu personaje: {s}, con {r}.":"\u0412\u0430\u0448 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436: {s}, \u043E\u0434\u0435\u0436\u0434\u0430: {r}.",mujer:"\u0436\u0435\u043D\u0449\u0438\u043D\u0430",hombre:"\u043C\u0443\u0436\u0447\u0438\u043D\u0430","camisa y calzas":"\u0440\u0443\u0431\u0430\u0445\u0430 \u0438 \u0448\u043E\u0441\u0441\u044B","Demo \xFAnica \xB7 v1 (Construir, Duelo y Personaje en una sola p\xE1gina)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v1 (\u0421\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E, \u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A \u0438 \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u043D\u0430 \u043E\u0434\u043D\u043E\u0439 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0435)","v1: una sola p\xE1gina con men\xFA: Construir, Duelo y Personaje. Cada parte es el \xFAltimo prototipo de cada cosa (construcci\xF3n v10, combate v8, personaje v11), con la misma escena y el mismo personaje del taller. Las versiones antiguas de cada prototipo siguen en la web.":"v1: \u043E\u0434\u043D\u0430 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430 \u0441 \u043C\u0435\u043D\u044E: \u0421\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E, \u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A \u0438 \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436. \u041A\u0430\u0436\u0434\u0430\u044F \u0447\u0430\u0441\u0442\u044C \u2014 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0439 \u043F\u0440\u043E\u0442\u043E\u0442\u0438\u043F (\u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v10, \u0431\u043E\u0439 v8, \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v11), \u0441 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0446\u0435\u043D\u043E\u0439 \u0438 \u0442\u0435\u043C \u0436\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439. \u0421\u0442\u0430\u0440\u044B\u0435 \u0432\u0435\u0440\u0441\u0438\u0438 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u043F\u0440\u043E\u0442\u043E\u0442\u0438\u043F\u0430 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043D\u0430 \u0441\u0430\u0439\u0442\u0435.","v1, c\xF3mo se cambia de parte: el bot\xF3n \xABMen\xFA\xBB de arriba vuelve al men\xFA y la p\xE1gina se recarga. As\xED cada parte empieza limpia y en el m\xF3vil nunca hay dos escenas a la vez gastando memoria. Lo construido, las opciones del duelo y el personaje se guardan en el navegador y siguen ah\xED al volver.":"v1, \u043A\u0430\u043A \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u044C\u0441\u044F: \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u041C\u0435\u043D\u044E\xBB \u0432\u0432\u0435\u0440\u0445\u0443 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u0432 \u043C\u0435\u043D\u044E, \u0438 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F. \u0422\u0430\u043A \u043A\u0430\u0436\u0434\u0430\u044F \u0447\u0430\u0441\u0442\u044C \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0441\u044F \u0441 \u0447\u0438\u0441\u0442\u043E\u0433\u043E \u043B\u0438\u0441\u0442\u0430, \u0438 \u0432 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u0431\u044B\u0432\u0430\u0435\u0442 \u0434\u0432\u0443\u0445 \u0441\u0446\u0435\u043D \u0441\u0440\u0430\u0437\u0443, \u0437\u0430\u043D\u0438\u043C\u0430\u044E\u0449\u0438\u0445 \u043F\u0430\u043C\u044F\u0442\u044C. \u041F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u043E\u0435, \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430 \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0441\u043E\u0445\u0440\u0430\u043D\u044F\u044E\u0442\u0441\u044F \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u0438 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043F\u0440\u0438 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0435\u043D\u0438\u0438.","v1: el personaje que eliges en \xABPersonaje\xBB (hombre o mujer y su ropa por capas) es el que construye y el que lucha. Por ahora el taller solo cambia el cuerpo y la ropa; pelo, piel y cara vendr\xE1n con la personalizaci\xF3n.":"v1: \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436, \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u0432 \xAB\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\xBB (\u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0438\u043B\u0438 \u0436\u0435\u043D\u0449\u0438\u043D\u0430 \u0438 \u043E\u0434\u0435\u0436\u0434\u0430 \u043F\u043E \u0441\u043B\u043E\u044F\u043C), \u2014 \u044D\u0442\u043E \u0442\u043E\u0442, \u043A\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442 \u0438 \u0441\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F. \u041F\u043E\u043A\u0430 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F \u043C\u0435\u043D\u044F\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0442\u0435\u043B\u043E \u0438 \u043E\u0434\u0435\u0436\u0434\u0443; \u0432\u043E\u043B\u043E\u0441\u044B, \u043A\u043E\u0436\u0430 \u0438 \u043B\u0438\u0446\u043E \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \u0432\u043D\u0435\u0448\u043D\u043E\u0441\u0442\u0438.","v1, provisional: si nunca has elegido personaje, en la construcci\xF3n sales con camisa y calzas de lino, como empieza el GDD. Si lo has elegido, sales con la ropa que elegiste (aunque sea una cota de malla): es una demo para ver el personaje en todo, no la partida de supervivencia.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u0435\u0441\u043B\u0438 \u0432\u044B \u043D\u0438 \u0440\u0430\u0437\u0443 \u043D\u0435 \u0432\u044B\u0431\u0438\u0440\u0430\u043B\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430, \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445, \u043A\u0430\u043A \u0441\u043A\u0430\u0437\u0430\u043D\u043E \u0432 GDD. \u0415\u0441\u043B\u0438 \u0432\u044B\u0431\u0440\u0430\u043B\u0438, \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0439 \u043E\u0434\u0435\u0436\u0434\u0435 (\u0434\u0430\u0436\u0435 \u0432 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0435): \u044D\u0442\u043E \u0434\u0435\u043C\u043E, \u0447\u0442\u043E\u0431\u044B \u0432\u0438\u0434\u0435\u0442\u044C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0432\u0435\u0437\u0434\u0435, \u0430 \u043D\u0435 \u0438\u0433\u0440\u0430 \u043D\u0430 \u0432\u044B\u0436\u0438\u0432\u0430\u043D\u0438\u0435.","v1, provisional: en el duelo manda la armadura elegida en sus opciones, porque lo que se ve es lo que protege. Con \xABlino\xBB llevas tu ropa sin gambes\xF3n ni cota; con gambes\xF3n o cota, esas piezas y, si la elegiste, la sobreveste encima. El rival sigue siendo el hombre de siempre.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u0432 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0435 \u0433\u043B\u0430\u0432\u043D\u043E\u0435 \u2014 \u0434\u043E\u0441\u043F\u0435\u0445, \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u0432 \u0435\u0433\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0447\u0442\u043E \u0432\u0438\u0434\u043D\u043E, \u0442\u043E \u0438 \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442. \u0421 \xAB\u043B\u044C\u043D\u043E\u043C\xBB \u0432\u044B \u0432 \u0441\u0432\u043E\u0435\u0439 \u043E\u0434\u0435\u0436\u0434\u0435 \u0431\u0435\u0437 \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0438 \u0438 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438; \u0441\u043E \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u043E\u0439 \u0438\u043B\u0438 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u043E\u0439 \u2014 \u0432 \u043D\u0438\u0445 \u0438, \u0435\u0441\u043B\u0438 \u0432\u044B\u0431\u0440\u0430\u043B\u0438, \u0432 \u0441\u044E\u0440\u043A\u043E \u043F\u043E\u0432\u0435\u0440\u0445. \u0421\u043E\u043F\u0435\u0440\u043D\u0438\u043A \u2014 \u0432\u0441\u0451 \u0442\u043E\u0442 \u0436\u0435 \u043C\u0443\u0436\u0447\u0438\u043D\u0430.",Rendimiento:"\u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C","{f} fps":"{f} \u043A/\u0441","este navegador no la dice":"\u044D\u0442\u043E\u0442 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0435\u0451 \u043D\u0435 \u0441\u043E\u043E\u0431\u0449\u0430\u0435\u0442","{n} MB":"{n} \u041C\u0411",Fotogramas:"\u041A\u0430\u0434\u0440\u044B","{f} por segundo":"{f} \u0432 \u0441\u0435\u043A\u0443\u043D\u0434\u0443","Cada fotograma":"\u041A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440","{m} ms de media; el m\xE1s lento, {p} ms":"\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C {m} \u043C\u0441; \u0441\u0430\u043C\u044B\u0439 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0439 \u2014 {p} \u043C\u0441",Resoluci\u00F3n:"\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435",Tri\u00E1ngulos:"\u0422\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438","{t} mil por fotograma":"{t} \u0442\u044B\u0441. \u0437\u0430 \u043A\u0430\u0434\u0440","Llamadas de dibujo":"\u0412\u044B\u0437\u043E\u0432\u044B \u043E\u0442\u0440\u0438\u0441\u043E\u0432\u043A\u0438","Memoria gr\xE1fica":"\u0413\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0430\u043C\u044F\u0442\u044C","{g} geometr\xEDas y {x} texturas":"{g} \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u0439 \u0438 {x} \u0442\u0435\u043A\u0441\u0442\u0443\u0440","Memoria de JavaScript":"\u041F\u0430\u043C\u044F\u0442\u044C JavaScript","Personajes en escena":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439 \u0432 \u0441\u0446\u0435\u043D\u0435","Rendimiento en este aparato":"\u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C \u043D\u0430 \u044D\u0442\u043E\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435","Personajes de prueba:":"\u0422\u0435\u0441\u0442\u043E\u0432\u044B\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438:","valravnx: dime los fps que ves en tu m\xF3vil (y qu\xE9 m\xF3vil es), en \xABConstruir\xBB y en \xABDuelo\xBB. Con eso se decide cu\xE1nto detalle aguanta.":"valravnx, \u043D\u0430\u043F\u0438\u0448\u0438, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043A/\u0441 \u0442\u044B \u0432\u0438\u0434\u0438\u0448\u044C \u043D\u0430 \u0441\u0432\u043E\u0451\u043C \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 (\u0438 \u0447\u0442\u043E \u044D\u0442\u043E \u0437\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D) \u0432 \u0440\u0430\u0437\u0434\u0435\u043B\u0430\u0445 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0438 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A\xBB. \u041E\u0442 \u044D\u0442\u043E\u0433\u043E \u0437\u0430\u0432\u0438\u0441\u0438\u0442, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0434\u0435\u0442\u0430\u043B\u0435\u0439 \u043E\u043D \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0442.","Demo \xFAnica \xB7 v2 (los n\xFAmeros de rendimiento a la vista)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v2 (\u043F\u043E\u043A\u0430\u0437\u0430\u0442\u0435\u043B\u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043D\u0430 \u0432\u0438\u0434\u0443)","v2: junto al bot\xF3n \xABMen\xFA\xBB salen los fotogramas por segundo de tu aparato; al pulsarlo se abre el detalle: lo que tarda cada fotograma (de media y el m\xE1s lento), la resoluci\xF3n, los tri\xE1ngulos y las llamadas de dibujo, la memoria gr\xE1fica y la de JavaScript (esta solo la dicen Chrome y los navegadores basados en \xE9l) y los personajes en escena. En el m\xF3vil, si junto a \xABMen\xFA\xBB no cabe, va a la izquierda de la pantalla.":"v2: \u0440\u044F\u0434\u043E\u043C \u0441 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u041C\u0435\u043D\u044E\xBB \u043F\u043E\u043A\u0430\u0437\u0430\u043D\u043E \u0447\u0438\u0441\u043B\u043E \u043A\u0430\u0434\u0440\u043E\u0432 \u0432 \u0441\u0435\u043A\u0443\u043D\u0434\u0443 \u043D\u0430 \u0442\u0432\u043E\u0451\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435; \u043D\u0430\u0436\u043C\u0438 \u2014 \u043E\u0442\u043A\u0440\u043E\u044E\u0442\u0441\u044F \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0441\u0442\u0438: \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u0438\u0442\u0441\u044F \u043A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440 (\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C \u0438 \u0441\u0430\u043C\u044B\u0439 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0439), \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435, \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438 \u0438 \u0432\u044B\u0437\u043E\u0432\u044B \u043E\u0442\u0440\u0438\u0441\u043E\u0432\u043A\u0438, \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0430\u043C\u044F\u0442\u044C \u0438 \u043F\u0430\u043C\u044F\u0442\u044C JavaScript (\u0435\u0451 \u0441\u043E\u043E\u0431\u0449\u0430\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E Chrome \u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u044B \u043D\u0430 \u0435\u0433\u043E \u043E\u0441\u043D\u043E\u0432\u0435) \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0432 \u0441\u0446\u0435\u043D\u0435. \u041D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435, \u0435\u0441\u043B\u0438 \u0440\u044F\u0434\u043E\u043C \u0441 \xAB\u041C\u0435\u043D\u044E\xBB \u043D\u0435 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F, \u043A\u043D\u043E\u043F\u043A\u0430 \u0443\u0445\u043E\u0434\u0438\u0442 \u043A \u043B\u0435\u0432\u043E\u043C\u0443 \u043A\u0440\u0430\u044E \u044D\u043A\u0440\u0430\u043D\u0430.","v2, para medir con gente: en \xABConstruir\xBB, el detalle tiene \xABPersonajes de prueba\xBB (0, 4, 8 o 16): personajes del taller que pasean en corro a tu alrededor. Solo se dibujan; no son jugadores ni cambian nada. Medido en el navegador de pruebas (dibuja sin tarjeta gr\xE1fica, as\xED que sus fps no valen): cada personaje suma unos 37 mil tri\xE1ngulos por fotograma (contando su sombra), unas 10 geometr\xEDas y 12 texturas.":"v2, \u0447\u0442\u043E\u0431\u044B \u043C\u0435\u0440\u0438\u0442\u044C \u0441 \u043B\u044E\u0434\u044C\u043C\u0438 \u0432\u043E\u043A\u0440\u0443\u0433: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0432 \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0441\u0442\u044F\u0445 \u0435\u0441\u0442\u044C \xAB\u0422\u0435\u0441\u0442\u043E\u0432\u044B\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438\xBB (0, 4, 8 \u0438\u043B\u0438 16): \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0433\u0443\u043B\u044F\u044E\u0442 \u043F\u043E \u043A\u0440\u0443\u0433\u0443 \u0432\u043E\u043A\u0440\u0443\u0433 \u0442\u0435\u0431\u044F. \u041E\u043D\u0438 \u0442\u043E\u043B\u044C\u043A\u043E \u0440\u0438\u0441\u0443\u044E\u0442\u0441\u044F: \u044D\u0442\u043E \u043D\u0435 \u0438\u0433\u0440\u043E\u043A\u0438, \u0438 \u043E\u043D\u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u043C\u0435\u043D\u044F\u044E\u0442. \u0417\u0430\u043C\u0435\u0440\u0435\u043D\u043E \u0432 \u0442\u0435\u0441\u0442\u043E\u0432\u043E\u043C \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 (\u043E\u043D \u0440\u0438\u0441\u0443\u0435\u0442 \u0431\u0435\u0437 \u0432\u0438\u0434\u0435\u043E\u043A\u0430\u0440\u0442\u044B, \u0442\u0430\u043A \u0447\u0442\u043E \u0435\u0433\u043E \u043A/\u0441 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0437\u043D\u0430\u0447\u0430\u0442): \u043A\u0430\u0436\u0434\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0434\u043E\u0431\u0430\u0432\u043B\u044F\u0435\u0442 \u043E\u043A\u043E\u043B\u043E 37 \u0442\u044B\u0441. \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u043E\u0432 \u0437\u0430 \u043A\u0430\u0434\u0440 (\u0441 \u0443\u0447\u0451\u0442\u043E\u043C \u0442\u0435\u043D\u0438), \u043E\u043A\u043E\u043B\u043E 10 \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u0439 \u0438 12 \u0442\u0435\u043A\u0441\u0442\u0443\u0440.","Hito 1 \xB7 v11":"\u042D\u0442\u0430\u043F 1 \xB7 v11","v11: en el m\xF3vil el aviso de abajo del men\xFA ya no tapa \xABReiniciar\xBB ni otros botones: se coloca seg\xFAn lo que mida de verdad el men\xFA de arriba (que en ingl\xE9s y en ruso ocupa m\xE1s filas) y a la izquierda de los botones de modo.":"v11: \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0430 \u043F\u043E\u0434 \u043C\u0435\u043D\u044E \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \xAB\u041D\u0430\u0447\u0430\u0442\u044C \u0437\u0430\u043D\u043E\u0432\u043E\xBB \u0438 \u0434\u0440\u0443\u0433\u0438\u0435 \u043A\u043D\u043E\u043F\u043A\u0438: \u043E\u043D\u0430 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u043F\u043E \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u043C\u0443 \u0440\u0430\u0437\u043C\u0435\u0440\u0443 \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043C\u0435\u043D\u044E (\u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u043E\u043D\u043E \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u0431\u043E\u043B\u044C\u0448\u0435 \u0441\u0442\u0440\u043E\u043A) \u0438 \u0441\u043B\u0435\u0432\u0430 \u043E\u0442 \u043A\u043D\u043E\u043F\u043E\u043A \u0440\u0435\u0436\u0438\u043C\u043E\u0432.","Prueba de estilo \xB7 v10 (realismo en miniatura; las notas no tapan las vistas)":"\u041F\u0440\u043E\u0431\u0430 \u0441\u0442\u0438\u043B\u044F \xB7 v10 (\u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u043D\u044B\u0439 \u0440\u0435\u0430\u043B\u0438\u0437\u043C; \u0437\u0430\u043C\u0435\u0442\u043A\u0438 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0432\u0438\u0434\u044B)","v10: las notas se colocan justo encima de la barra de vistas, aunque en el m\xF3vil esta ocupe dos filas, y nunca suben por encima de la barra de arriba.":"v10: \u0437\u0430\u043C\u0435\u0442\u043A\u0438 \u0441\u0442\u043E\u044F\u0442 \u043F\u0440\u044F\u043C\u043E \u043D\u0430\u0434 \u043F\u0430\u043D\u0435\u043B\u044C\u044E \u0432\u0438\u0434\u043E\u0432, \u0434\u0430\u0436\u0435 \u043A\u043E\u0433\u0434\u0430 \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043E\u043D\u0430 \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u0434\u0432\u0435 \u0441\u0442\u0440\u043E\u043A\u0438, \u0438 \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u044E\u0442\u0441\u044F \u0432\u044B\u0448\u0435 \u0432\u0435\u0440\u0445\u043D\u0435\u0439 \u043F\u0430\u043D\u0435\u043B\u0438.","Demo \xFAnica \xB7 v3 (los avisos no tapan los men\xFAs en el m\xF3vil)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v3 (\u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0438 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u043C\u0435\u043D\u044E \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435)","v3: en el m\xF3vil, el aviso de \xABConstruir\xBB ya no tapa los botones del men\xFA de arriba (tampoco en ingl\xE9s y en ruso, ni con \xABMen\xFA\xBB y los fps). Es la construcci\xF3n v11.":"v3: \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0430 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043A\u043D\u043E\u043F\u043A\u0438 \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043C\u0435\u043D\u044E (\u0438 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u043C, \u0438 \u0441 \xAB\u041C\u0435\u043D\u044E\xBB \u0438 \u043A/\u0441). \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v11.","v12: correr m\xE1s natural (valravnx: \xABfea y exagerada\xBB). La carrera del paquete es de dibujo animado: zancada de 1,4 m, mucho braceo con los codos abiertos, cuerpo echado hacia delante y agachado, y 25 cm de bote. Se calma por c\xF3digo al pasarla al taller: cada hueso se mueve la mitad o algo m\xE1s de lo que se mov\xEDa (brazos 50 %, tronco 55 %, piernas 60 %), el tronco se endereza, los brazos se acercan al cuerpo como al andar y la pelvis bota menos (10 cm) y se agacha menos. Se puede ver con el bot\xF3n \xABCorrer\xBB. Personajes en recursos/personajes/taller-v5/ (lo dem\xE1s, igual que la v4).":"v12: \u0431\u0435\u0433 \u0441\u0442\u0430\u043B \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0435\u0435 (valravnx: \xAB\u043D\u0435\u043A\u0440\u0430\u0441\u0438\u0432\u044B\u0439 \u0438 \u043F\u0440\u0435\u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u043D\u044B\u0439\xBB). \u0411\u0435\u0433 \u0438\u0437 \u043D\u0430\u0431\u043E\u0440\u0430 \u043C\u0443\u043B\u044C\u0442\u044F\u0448\u043D\u044B\u0439: \u0448\u0430\u0433 1,4 \u043C, \u0441\u0438\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043C\u0430\u0445\u0438 \u0440\u0443\u043A\u0430\u043C\u0438 \u0441 \u0440\u0430\u0437\u0432\u0435\u0434\u0451\u043D\u043D\u044B\u043C\u0438 \u043B\u043E\u043A\u0442\u044F\u043C\u0438, \u043A\u043E\u0440\u043F\u0443\u0441 \u043D\u0430\u043A\u043B\u043E\u043D\u0451\u043D \u0432\u043F\u0435\u0440\u0451\u0434 \u0438 \u043F\u0440\u0438\u0441\u0435\u0432\u0448\u0438\u0439, \u043F\u043E\u0434\u043F\u0440\u044B\u0433\u0438\u0432\u0430\u043D\u0438\u0435 \u043D\u0430 25 \u0441\u043C. \u041F\u0440\u0438 \u043F\u0435\u0440\u0435\u043D\u043E\u0441\u0435 \u0432 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0443\u044E \u043E\u043D \u0441\u043C\u044F\u0433\u0447\u0430\u0435\u0442\u0441\u044F \u043A\u043E\u0434\u043E\u043C: \u043A\u0430\u0436\u0434\u0430\u044F \u043A\u043E\u0441\u0442\u044C \u0434\u0432\u0438\u0433\u0430\u0435\u0442\u0441\u044F \u0432\u0434\u0432\u043E\u0435 \u043C\u0435\u043D\u044C\u0448\u0435 \u0438\u043B\u0438 \u0447\u0443\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u044B \u043F\u0440\u0435\u0436\u043D\u0435\u0433\u043E (\u0440\u0443\u043A\u0438 50 %, \u043A\u043E\u0440\u043F\u0443\u0441 55 %, \u043D\u043E\u0433\u0438 60 %), \u043A\u043E\u0440\u043F\u0443\u0441 \u0432\u044B\u043F\u0440\u044F\u043C\u043B\u044F\u0435\u0442\u0441\u044F, \u0440\u0443\u043A\u0438 \u043F\u0440\u0438\u0436\u0438\u043C\u0430\u044E\u0442\u0441\u044F \u0431\u043B\u0438\u0436\u0435 \u043A \u0442\u0435\u043B\u0443, \u043A\u0430\u043A \u043F\u0440\u0438 \u0445\u043E\u0434\u044C\u0431\u0435, \u0430 \u0442\u0430\u0437 \u043C\u0435\u043D\u044C\u0448\u0435 \u043F\u043E\u0434\u043F\u0440\u044B\u0433\u0438\u0432\u0430\u0435\u0442 (10 \u0441\u043C) \u0438 \u043C\u0435\u043D\u044C\u0448\u0435 \u043F\u0440\u0438\u0441\u0435\u0434\u0430\u0435\u0442. \u041F\u043E\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043C\u043E\u0436\u043D\u043E \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0411\u0435\u0433\xBB. \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0432 recursos/personajes/taller-v5/ (\u0432\u0441\u0451 \u043E\u0441\u0442\u0430\u043B\u044C\u043D\u043E\u0435 \u043A\u0430\u043A \u0432 v4).","v12, arreglo: el juego aceleraba la animaci\xF3n de correr como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s: a la velocidad del juego (3,6 m/s) los pies resbalaban y se ve\xEDa a c\xE1mara lenta con zancadas enormes. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar el personaje (la carrera nueva: 3,5 m/s el hombre y 2,9 la mujer; andar, 0,95 y 0,77).":"v12, \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435: \u0438\u0433\u0440\u0430 \u0443\u0441\u043A\u043E\u0440\u044F\u043B\u0430 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044E \u0431\u0435\u0433\u0430 \u0442\u0430\u043A, \u0431\u0443\u0434\u0442\u043E \u0435\u0451 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C 2,59 \u043C/\u0441, \u043D\u043E, \u0435\u0441\u043B\u0438 \u043C\u0435\u0440\u0438\u0442\u044C \u043F\u043E \u043E\u043F\u043E\u0440\u043D\u043E\u0439 \u043D\u043E\u0433\u0435, \u043E\u043D\u0430 \u0431\u044B\u043B\u0430 5,8 \u043C/\u0441: \u043F\u0440\u0438 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u0438 \u0438\u0433\u0440\u044B (3,6 \u043C/\u0441) \u043D\u043E\u0433\u0438 \u0441\u043A\u043E\u043B\u044C\u0437\u0438\u043B\u0438 \u0438 \u0432\u0441\u0451 \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B\u043E \u043A\u0430\u043A \u0437\u0430\u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0430\u044F \u0441\u044A\u0451\u043C\u043A\u0430 \u0441 \u043E\u0433\u0440\u043E\u043C\u043D\u044B\u043C\u0438 \u0448\u0430\u0433\u0430\u043C\u0438. \u0422\u0435\u043F\u0435\u0440\u044C \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C \u0445\u043E\u0434\u044C\u0431\u044B \u0438 \u0431\u0435\u0433\u0430 \u0438\u0437\u043C\u0435\u0440\u044F\u0435\u0442\u0441\u044F \u043F\u043E \u0441\u0430\u043C\u043E\u043C\u0443 \u043A\u043B\u0438\u043F\u0443 \u043F\u0440\u0438 \u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 (\u043D\u043E\u0432\u044B\u0439 \u0431\u0435\u0433: 3,5 \u043C/\u0441 \u0443 \u043C\u0443\u0436\u0447\u0438\u043D\u044B \u0438 2,9 \u0443 \u0436\u0435\u043D\u0449\u0438\u043D\u044B; \u0445\u043E\u0434\u044C\u0431\u0430 \u2014 0,95 \u0438 0,77).","v12, pendiente: corriendo deprisa (6 m/s, con la tecla May\xFAs) la animaci\xF3n va al tope de 1,6\xD7 y los pies a\xFAn resbalan algo, sobre todo la mujer. Si valravnx no la ve bien, el siguiente paso son carreras de captura de movimiento libres (Rokoko).":"v12, \u043E\u0441\u0442\u0430\u043B\u043E\u0441\u044C: \u043F\u0440\u0438 \u0431\u044B\u0441\u0442\u0440\u043E\u043C \u0431\u0435\u0433\u0435 (6 \u043C/\u0441, \u0441 \u043A\u043B\u0430\u0432\u0438\u0448\u0435\u0439 Shift) \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F \u0443\u043F\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0432 \u043F\u0440\u0435\u0434\u0435\u043B 1,6\xD7 \u0438 \u043D\u043E\u0433\u0438 \u0435\u0449\u0451 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0441\u043A\u043E\u043B\u044C\u0437\u044F\u0442, \u043E\u0441\u043E\u0431\u0435\u043D\u043D\u043E \u0443 \u0436\u0435\u043D\u0449\u0438\u043D\u044B. \u0415\u0441\u043B\u0438 valravnx \u044D\u0442\u043E \u043D\u0435 \u043F\u043E\u043D\u0440\u0430\u0432\u0438\u0442\u0441\u044F, \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0439 \u0448\u0430\u0433 \u2014 \u0431\u0435\u0441\u043F\u043B\u0430\u0442\u043D\u044B\u0435 \u0437\u0430\u043F\u0438\u0441\u0438 \u0431\u0435\u0433\u0430 \u0441 \u0437\u0430\u0445\u0432\u0430\u0442\u043E\u043C \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u044F (Rokoko).","Personaje \xB7 v12 (carrera m\xE1s suave y natural)":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \xB7 v12 (\u0431\u0435\u0433 \u043F\u043B\u0430\u0432\u043D\u0435\u0435 \u0438 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0435\u0435)","v4: correr m\xE1s natural, en las tres partes. La carrera va suavizada por c\xF3digo (menos zancada, braceo, bote e inclinaci\xF3n, y los brazos m\xE1s pegados) y a su velocidad de verdad: antes los pies resbalaban y se ve\xEDa a c\xE1mara lenta. Personajes del taller-v5; es la construcci\xF3n v11, el combate v8 y el personaje v12. Corriendo deprisa (6 m/s, con la tecla May\xFAs) los pies a\xFAn resbalan algo.":"v4: \u0431\u0435\u0433 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0435\u0435 \u0432\u043E \u0432\u0441\u0435\u0445 \u0442\u0440\u0451\u0445 \u0447\u0430\u0441\u0442\u044F\u0445. \u0411\u0435\u0433 \u0441\u043C\u044F\u0433\u0447\u0451\u043D \u043A\u043E\u0434\u043E\u043C (\u043A\u043E\u0440\u043E\u0447\u0435 \u0448\u0430\u0433, \u043C\u0435\u043D\u044C\u0448\u0435 \u0432\u0437\u043C\u0430\u0445\u043E\u0432 \u0440\u0443\u043A\u0430\u043C\u0438, \u043F\u043E\u0434\u043F\u0440\u044B\u0433\u0438\u0432\u0430\u043D\u0438\u044F \u0438 \u043D\u0430\u043A\u043B\u043E\u043D\u0430, \u0440\u0443\u043A\u0438 \u0431\u043B\u0438\u0436\u0435 \u043A \u0442\u0435\u043B\u0443) \u0438 \u0438\u0434\u0451\u0442 \u0441\u043E \u0441\u0432\u043E\u0435\u0439 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0439 \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C\u044E: \u0440\u0430\u043D\u044C\u0448\u0435 \u043D\u043E\u0433\u0438 \u0441\u043A\u043E\u043B\u044C\u0437\u0438\u043B\u0438 \u0438 \u0432\u0441\u0451 \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B\u043E \u043A\u0430\u043A \u0437\u0430\u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0430\u044F \u0441\u044A\u0451\u043C\u043A\u0430. \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 v5; \u044D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v11, \u0431\u043E\u0439 v8 \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v12. \u041F\u0440\u0438 \u0431\u044B\u0441\u0442\u0440\u043E\u043C \u0431\u0435\u0433\u0435 (6 \u043C/\u0441, \u0441 \u043A\u043B\u0430\u0432\u0438\u0448\u0435\u0439 Shift) \u043D\u043E\u0433\u0438 \u0435\u0449\u0451 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0441\u043A\u043E\u043B\u044C\u0437\u044F\u0442.","Demo \xFAnica \xB7 v4 (correr m\xE1s natural)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v4 (\u0431\u0435\u0433 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0435\u0435)","v12: los muros, los postes y las vigas con el estilo elegido (el de la caba\xF1a de la prueba de estilo v5): troncos redondos con su veta y las testas claras a la vista, un poco m\xE1s gruesos por un extremo; jambas, dintel, marco y alf\xE9izar en puertas y ventanas; el zarzo con estacas que asoman del barro; el entramado con riostra y relleno encalado; las tablas con durmiente y carrera. Los tejados, los suelos, las cercas y los muebles pasan al estilo en las tareas siguientes.":"v12: \u0441\u0442\u0435\u043D\u044B, \u0441\u0442\u043E\u043B\u0431\u044B \u0438 \u0431\u0430\u043B\u043A\u0438 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u043A\u0430\u043A \u0438\u0437\u0431\u0430 \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5): \u043A\u0440\u0443\u0433\u043B\u044B\u0435 \u0431\u0440\u0451\u0432\u043D\u0430 \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439 \u0432\u043E\u043B\u043E\u043A\u043E\u043D \u0438 \u0441\u0432\u0435\u0442\u043B\u044B\u043C\u0438 \u0442\u043E\u0440\u0446\u0430\u043C\u0438 \u043D\u0430 \u0432\u0438\u0434\u0443, \u0447\u0443\u0442\u044C \u0442\u043E\u043B\u0449\u0435 \u0441 \u043E\u0434\u043D\u043E\u0433\u043E \u043A\u043E\u043D\u0446\u0430; \u043A\u043E\u0441\u044F\u043A\u0438, \u043F\u0435\u0440\u0435\u043C\u044B\u0447\u043A\u0430, \u0440\u0430\u043C\u0430 \u0438 \u043F\u043E\u0434\u043E\u043A\u043E\u043D\u043D\u0438\u043A \u0443 \u0434\u0432\u0435\u0440\u0435\u0439 \u0438 \u043E\u043A\u043E\u043D; \u043F\u043B\u0435\u0442\u0435\u043D\u044C \u0441 \u043A\u043E\u043B\u044C\u044F\u043C\u0438, \u0432\u044B\u0441\u0442\u0443\u043F\u0430\u044E\u0449\u0438\u043C\u0438 \u0438\u0437 \u0433\u043B\u0438\u043D\u044B; \u0444\u0430\u0445\u0432\u0435\u0440\u043A \u0441 \u0440\u0430\u0441\u043A\u043E\u0441\u043E\u043C \u0438 \u043F\u043E\u0431\u0435\u043B\u0451\u043D\u043D\u044B\u043C \u0437\u0430\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435\u043C; \u0434\u043E\u0441\u043A\u0438 \u0441 \u043D\u0438\u0436\u043D\u0435\u0439 \u0438 \u0432\u0435\u0440\u0445\u043D\u0435\u0439 \u043E\u0431\u0432\u044F\u0437\u043A\u043E\u0439. \u041A\u0440\u044B\u0448\u0438, \u043F\u043E\u043B\u044B, \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438 \u0438 \u043C\u0435\u0431\u0435\u043B\u044C \u043F\u0435\u0440\u0435\u0439\u0434\u0443\u0442 \u043D\u0430 \u044D\u0442\u043E\u0442 \u0441\u0442\u0438\u043B\u044C \u0432 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0445 \u0437\u0430\u0434\u0430\u0447\u0430\u0445.","v13: los brazos al correr (valravnx: \xABtorcidos hacia delante, en pose nada natural\xBB). Ahora el brazo oscila alrededor de la vertical (el codo pasa por detr\xE1s del cuerpo), el antebrazo va un poco hacia arriba y hacia dentro, la mano va de canto con el pulgar arriba y la mu\xF1eca recta, en vez de los pu\xF1os girados hacia abajo delante de la tripa. Personajes en recursos/personajes/taller-v6/.":"v13: \u0440\u0443\u043A\u0438 \u043F\u0440\u0438 \u0431\u0435\u0433\u0435 (valravnx: \xAB\u0432\u044B\u0432\u0435\u0440\u043D\u0443\u0442\u044B \u0432\u043F\u0435\u0440\u0451\u0434, \u0441\u043E\u0432\u0441\u0435\u043C \u043D\u0435\u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0437\u0430\xBB). \u0422\u0435\u043F\u0435\u0440\u044C \u0440\u0443\u043A\u0430 \u043A\u0430\u0447\u0430\u0435\u0442\u0441\u044F \u0432\u043E\u043A\u0440\u0443\u0433 \u0432\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u0438 (\u043B\u043E\u043A\u043E\u0442\u044C \u0443\u0445\u043E\u0434\u0438\u0442 \u0437\u0430 \u043A\u043E\u0440\u043F\u0443\u0441), \u043F\u0440\u0435\u0434\u043F\u043B\u0435\u0447\u044C\u0435 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043E \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0432\u0432\u0435\u0440\u0445 \u0438 \u0432\u043D\u0443\u0442\u0440\u044C, \u043A\u0438\u0441\u0442\u044C \u0441\u0442\u043E\u0438\u0442 \u0440\u0435\u0431\u0440\u043E\u043C, \u0431\u043E\u043B\u044C\u0448\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C \u0432\u0432\u0435\u0440\u0445, \u0437\u0430\u043F\u044F\u0441\u0442\u044C\u0435 \u043F\u0440\u044F\u043C\u043E\u0435 \u2014 \u0432\u043C\u0435\u0441\u0442\u043E \u043A\u0443\u043B\u0430\u043A\u043E\u0432, \u043F\u043E\u0432\u0451\u0440\u043D\u0443\u0442\u044B\u0445 \u0432\u043D\u0438\u0437 \u043F\u0435\u0440\u0435\u0434 \u0436\u0438\u0432\u043E\u0442\u043E\u043C. \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0432 recursos/personajes/taller-v6/.","v5: los brazos al correr, m\xE1s naturales (valravnx los vio torcidos hacia delante): oscilan junto al cuerpo, con la mano de canto y la mu\xF1eca recta. Es el personaje v13, con la construcci\xF3n v11 y el combate v8.":"v5: \u0440\u0443\u043A\u0438 \u043F\u0440\u0438 \u0431\u0435\u0433\u0435 \u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u0435\u0435 (valravnx \u0432\u0438\u0434\u0435\u043B \u0438\u0445 \u0432\u044B\u0432\u0435\u0440\u043D\u0443\u0442\u044B\u043C\u0438 \u0432\u043F\u0435\u0440\u0451\u0434): \u043A\u0430\u0447\u0430\u044E\u0442\u0441\u044F \u0432\u0434\u043E\u043B\u044C \u0442\u0435\u043B\u0430, \u043A\u0438\u0441\u0442\u044C \u0440\u0435\u0431\u0440\u043E\u043C, \u0437\u0430\u043F\u044F\u0441\u0442\u044C\u0435 \u043F\u0440\u044F\u043C\u043E\u0435. \u042D\u0442\u043E \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v13 \u0441\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E\u043C v11 \u0438 \u0431\u043E\u0435\u043C v8.","Personaje \xB7 v13 (brazos naturales al correr)":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \xB7 v13 (\u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0435 \u0440\u0443\u043A\u0438 \u043F\u0440\u0438 \u0431\u0435\u0433\u0435)","Demo \xFAnica \xB7 v5 (brazos naturales al correr)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v5 (\u0435\u0441\u0442\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0435 \u0440\u0443\u043A\u0438 \u043F\u0440\u0438 \u0431\u0435\u0433\u0435)","Se ha perdido el dibujo 3D (el aparato se qued\xF3 sin memoria gr\xE1fica).":"3D-\u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u043F\u043E\u0442\u0435\u0440\u044F\u043D\u043E (\u0443 \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 \u0437\u0430\u043A\u043E\u043D\u0447\u0438\u043B\u0430\u0441\u044C \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0430\u043C\u044F\u0442\u044C).","Ha vuelto a pasar: cierra otras pesta\xF1as o aplicaciones y recarga.":"\u042D\u0442\u043E \u043F\u043E\u0432\u0442\u043E\u0440\u0438\u043B\u043E\u0441\u044C: \u0437\u0430\u043A\u0440\u043E\u0439\u0442\u0435 \u0434\u0440\u0443\u0433\u0438\u0435 \u0432\u043A\u043B\u0430\u0434\u043A\u0438 \u0438\u043B\u0438 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u0438 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u0435.","Recargando\u2026 Lo construido est\xE1 guardado.":"\u041F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0430\u2026 \u041F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u043E\u0435 \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u043E.",Recargar:"\u041F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u0438\u0442\u044C","v12, arreglo importante (valravnx: pantalla en blanco en el m\xF3vil tras un rato construyendo, a m\xE1s de 80 fps): cada vez que se colocaba o se quitaba algo se rehac\xEDan todas las piezas y las viejas se quedaban ocupando la memoria gr\xE1fica (medido: con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas en memoria). Ahora se liberan y la cuenta no sube. Si aun as\xED el navegador pierde el dibujo 3D, sale un aviso y la p\xE1gina se recarga sola con lo construido guardado; si vuelve a pasar enseguida, ofrece un bot\xF3n en vez de recargar en bucle.":"v12, \u0432\u0430\u0436\u043D\u043E\u0435 \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 (valravnx: \u0431\u0435\u043B\u044B\u0439 \u044D\u043A\u0440\u0430\u043D \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043F\u043E\u0441\u043B\u0435 \u0442\u043E\u0433\u043E, \u043A\u0430\u043A \u043A\u0430\u043A\u043E\u0435-\u0442\u043E \u0432\u0440\u0435\u043C\u044F \u0441\u0442\u0440\u043E\u0438\u0448\u044C, \u043F\u0440\u0438 80+ fps): \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u0439 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0435 \u0438\u043B\u0438 \u0443\u0434\u0430\u043B\u0435\u043D\u0438\u0438 \u0432\u0441\u0435 \u0434\u0435\u0442\u0430\u043B\u0438 \u043F\u0435\u0440\u0435\u0441\u043E\u0437\u0434\u0430\u0432\u0430\u043B\u0438\u0441\u044C, \u0430 \u0441\u0442\u0430\u0440\u044B\u0435 \u043E\u0441\u0442\u0430\u0432\u0430\u043B\u0438\u0441\u044C \u0432 \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043F\u0430\u043C\u044F\u0442\u0438 (\u0438\u0437\u043C\u0435\u0440\u0435\u043D\u043E: \u0441 9 \u0434\u0435\u0442\u0430\u043B\u044F\u043C\u0438 20 \u043F\u0435\u0440\u0435\u0441\u0431\u043E\u0440\u043E\u043A \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u043B\u0438 \u0447\u0438\u0441\u043B\u043E \u0441\u0435\u0442\u043E\u043A \u0432 \u043F\u0430\u043C\u044F\u0442\u0438 \u0441 870 \u0434\u043E 4050). \u0422\u0435\u043F\u0435\u0440\u044C \u043E\u043D\u0438 \u043E\u0441\u0432\u043E\u0431\u043E\u0436\u0434\u0430\u044E\u0442\u0441\u044F, \u0438 \u0447\u0438\u0441\u043B\u043E \u043D\u0435 \u0440\u0430\u0441\u0442\u0451\u0442. \u0415\u0441\u043B\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0432\u0441\u0451 \u0436\u0435 \u0442\u0435\u0440\u044F\u0435\u0442 3D-\u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435, \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u0438 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430 \u0441\u0430\u043C\u0430 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u043F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u043E\u0435 \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u043E; \u0435\u0441\u043B\u0438 \u044D\u0442\u043E \u0441\u0440\u0430\u0437\u0443 \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442\u0441\u044F, \u0432\u043C\u0435\u0441\u0442\u043E \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0438 \u043F\u043E \u043A\u0440\u0443\u0433\u0443 \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u0442\u0441\u044F \u043A\u043D\u043E\u043F\u043A\u0430.","v9, arreglo: cada flecha disparada dejaba su malla ocupando memoria gr\xE1fica, y al empezar otra partida tambi\xE9n las dianas y los postes; ahora se liberan. Si el navegador pierde el dibujo 3D, aviso y recarga sola, como en la construcci\xF3n.":"v9, \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435: \u043A\u0430\u0436\u0434\u0430\u044F \u0432\u044B\u043F\u0443\u0449\u0435\u043D\u043D\u0430\u044F \u0441\u0442\u0440\u0435\u043B\u0430 \u043E\u0441\u0442\u0430\u0432\u043B\u044F\u043B\u0430 \u0441\u0432\u043E\u044E \u0441\u0435\u0442\u043A\u0443 \u0432 \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u043F\u0430\u043C\u044F\u0442\u0438, \u0430 \u043F\u0440\u0438 \u043D\u0430\u0447\u0430\u043B\u0435 \u043D\u043E\u0432\u043E\u0439 \u043F\u0430\u0440\u0442\u0438\u0438 \u2014 \u0442\u0430\u043A\u0436\u0435 \u043C\u0438\u0448\u0435\u043D\u0438 \u0438 \u0441\u0442\u043E\u043B\u0431\u044B; \u0442\u0435\u043F\u0435\u0440\u044C \u043E\u043D\u0438 \u043E\u0441\u0432\u043E\u0431\u043E\u0436\u0434\u0430\u044E\u0442\u0441\u044F. \u0415\u0441\u043B\u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0442\u0435\u0440\u044F\u0435\u0442 3D-\u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u2014 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u0438 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0430, \u043A\u0430\u043A \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435.","Combate \xB7 v9":"\u0411\u043E\u0439 \xB7 v9","v7: arreglo de la pantalla en blanco en el m\xF3vil (la construcci\xF3n dejaba la memoria gr\xE1fica llena al rehacer las piezas) y aviso con recarga si se pierde el dibujo 3D. Los muros, postes y vigas con el estilo elegido. Es la construcci\xF3n v12, el combate v9 y el personaje v14.":"v7: \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D \u0431\u0435\u043B\u044B\u0439 \u044D\u043A\u0440\u0430\u043D \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 (\u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E \u0437\u0430\u043F\u043E\u043B\u043D\u044F\u043B\u043E \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0443\u044E \u043F\u0430\u043C\u044F\u0442\u044C \u043F\u0440\u0438 \u043F\u0435\u0440\u0435\u0441\u0431\u043E\u0440\u043A\u0435 \u0434\u0435\u0442\u0430\u043B\u0435\u0439) \u0438 \u0434\u043E\u0431\u0430\u0432\u043B\u0435\u043D\u043E \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u0441 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0437\u043A\u043E\u0439 \u043F\u0440\u0438 \u043F\u043E\u0442\u0435\u0440\u0435 3D-\u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u044F. \u0421\u0442\u0435\u043D\u044B, \u0441\u0442\u043E\u043B\u0431\u044B \u0438 \u0431\u0430\u043B\u043A\u0438 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v12, \u0431\u043E\u0439 v9 \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v14.","Demo \xFAnica \xB7 v7 (sin pantalla en blanco; muros con el estilo)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v7 (\u0431\u0435\u0437 \u0431\u0435\u043B\u043E\u0433\u043E \u044D\u043A\u0440\u0430\u043D\u0430; \u0441\u0442\u0435\u043D\u044B \u0432 \u0441\u0442\u0438\u043B\u0435)","Hito 1 \xB7 v13":"\u042D\u0442\u0430\u043F 1 \xB7 v13","Hito 1 \xB7 v14":"\u042D\u0442\u0430\u043F 1 \xB7 v14","Combate \xB7 v10":"\u0411\u043E\u0439 \xB7 v10","Demo \xFAnica \xB7 v9 (escena con el estilo v5 en \xABConstruir\xBB y \xABDuelo\xBB)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v9 (\u0441\u0446\u0435\u043D\u0430 \u0432 \u0441\u0442\u0438\u043B\u0435 v5 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0438 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043A\u0435\xBB)","v14: la escena como la prueba de estilo v5: hierba densa con flores tambi\xE9n en el centro, matorrales, calvas de tierra pisada, rocas m\xE1s cerca y algunos \xE1rboles de copa sueltos a partir de 22 m. Donde se construye en la planta baja, y bajo los muebles del suelo y el moj\xF3n, la hierba, las flores y las matas se esconden solas; si se quita la pieza, vuelven. Las matas escondidas no chocan.":"v14: \u0441\u0446\u0435\u043D\u0430 \u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5: \u0433\u0443\u0441\u0442\u0430\u044F \u0442\u0440\u0430\u0432\u0430 \u0441 \u0446\u0432\u0435\u0442\u0430\u043C\u0438 \u0438 \u0432 \u0446\u0435\u043D\u0442\u0440\u0435, \u043A\u0443\u0441\u0442\u044B, \u043F\u044F\u0442\u043D\u0430 \u0443\u0442\u043E\u043F\u0442\u0430\u043D\u043D\u043E\u0439 \u0437\u0435\u043C\u043B\u0438, \u043A\u0430\u043C\u043D\u0438 \u0431\u043B\u0438\u0436\u0435 \u0438 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0445 \u043B\u0438\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0434\u0435\u0440\u0435\u0432\u044C\u0435\u0432 \u043D\u0430\u0447\u0438\u043D\u0430\u044F \u0441 22 \u043C. \u0422\u0430\u043C, \u0433\u0434\u0435 \u0441\u0442\u0440\u043E\u0438\u0448\u044C \u043D\u0430 \u043D\u0438\u0436\u043D\u0435\u043C \u044D\u0442\u0430\u0436\u0435, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043F\u043E\u0434 \u043C\u0435\u0431\u0435\u043B\u044C\u044E \u043D\u0430 \u0437\u0435\u043C\u043B\u0435 \u0438 \u043F\u043E\u0434 \u043C\u0435\u0436\u0435\u0432\u044B\u043C \u043A\u0430\u043C\u043D\u0435\u043C, \u0442\u0440\u0430\u0432\u0430, \u0446\u0432\u0435\u0442\u044B \u0438 \u043A\u0443\u0441\u0442\u044B \u0441\u0430\u043C\u0438 \u043F\u0440\u044F\u0447\u0443\u0442\u0441\u044F; \u0435\u0441\u043B\u0438 \u0443\u0431\u0440\u0430\u0442\u044C \u0434\u0435\u0442\u0430\u043B\u044C, \u043E\u043D\u0438 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u044E\u0442\u0441\u044F. \u0421\u043F\u0440\u044F\u0442\u0430\u043D\u043D\u044B\u0435 \u043A\u0443\u0441\u0442\u044B \u043D\u0435 \u043C\u0435\u0448\u0430\u044E\u0442 \u043F\u0440\u043E\u0445\u043E\u0434\u0443.","v10: alrededor de la liza, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra pisada, rocas y algunos \xE1rboles de copa sueltos antes del bosque.":"v10: \u0432\u043E\u043A\u0440\u0443\u0433 \u0440\u0438\u0441\u0442\u0430\u043B\u0438\u0449\u0430 \u0441\u0446\u0435\u043D\u0430 \u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5: \u0433\u0443\u0441\u0442\u0430\u044F \u0442\u0440\u0430\u0432\u0430 \u0441 \u0446\u0432\u0435\u0442\u0430\u043C\u0438, \u043A\u0443\u0441\u0442\u044B, \u043F\u044F\u0442\u043D\u0430 \u0443\u0442\u043E\u043F\u0442\u0430\u043D\u043D\u043E\u0439 \u0437\u0435\u043C\u043B\u0438, \u043A\u0430\u043C\u043D\u0438 \u0438 \u043D\u0435\u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0445 \u043B\u0438\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0434\u0435\u0440\u0435\u0432\u044C\u0435\u0432 \u043F\u0435\u0440\u0435\u0434 \u043B\u0435\u0441\u043E\u043C.","v9: en \xABConstruir\xBB y en \xABDuelo\xBB, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra, rocas y \xE1rboles sueltos; la hierba ya no asoma por lo construido. Es la construcci\xF3n v14 y el combate v10.":"v9: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0438 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043A\u0435\xBB \u0441\u0446\u0435\u043D\u0430 \u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5: \u0433\u0443\u0441\u0442\u0430\u044F \u0442\u0440\u0430\u0432\u0430 \u0441 \u0446\u0432\u0435\u0442\u0430\u043C\u0438, \u043A\u0443\u0441\u0442\u044B, \u043F\u044F\u0442\u043D\u0430 \u0437\u0435\u043C\u043B\u0438, \u043A\u0430\u043C\u043D\u0438 \u0438 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0435 \u0434\u0435\u0440\u0435\u0432\u044C\u044F; \u0442\u0440\u0430\u0432\u0430 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u0440\u043E\u0431\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0441\u043A\u0432\u043E\u0437\u044C \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0438. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v14 \u0438 \u0431\u043E\u0439 v10.","v16: los tejados con el estilo elegido (la caba\xF1a de la prueba de estilo v5). La paja va en dos hiladas gruesas y redondeadas, con mechones en el alero y la cumbrera redonda; las tablillas, en filas solapadas y desplazadas, con tabla de remate en los lados y caballete en la cumbrera. Bajo el tejado se cierra con tablas de pie (muros de troncos y de tablas), con barro y estacas (zarzo) o con encalado y postes (entramado). Los tramos de paja que van de lado se juntan sin surco. (La v15 pas\xF3 al estilo los cimientos, los suelos y las escaleras.)":"v16: \u043A\u0440\u044B\u0448\u0438 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u0445\u0438\u0436\u0438\u043D\u0430 \u0438\u0437 \u043F\u0440\u043E\u0431\u044B \u0441\u0442\u0438\u043B\u044F v5). \u0421\u043E\u043B\u043E\u043C\u0430 \u043B\u0435\u0436\u0438\u0442 \u0434\u0432\u0443\u043C\u044F \u0442\u043E\u043B\u0441\u0442\u044B\u043C\u0438 \u0441\u043A\u0440\u0443\u0433\u043B\u0451\u043D\u043D\u044B\u043C\u0438 \u0440\u044F\u0434\u0430\u043C\u0438, \u0441 \u043F\u0443\u0447\u043A\u0430\u043C\u0438 \u043D\u0430 \u0441\u0432\u0435\u0441\u0435 \u0438 \u043A\u0440\u0443\u0433\u043B\u044B\u043C \u043A\u043E\u043D\u044C\u043A\u043E\u043C; \u0434\u0440\u0430\u043D\u043A\u0430 \u2014 \u0432\u043D\u0430\u0445\u043B\u0451\u0441\u0442, \u0440\u044F\u0434\u0430\u043C\u0438 \u0441\u043E \u0441\u0434\u0432\u0438\u0433\u043E\u043C, \u0441 \u0442\u043E\u0440\u0446\u0435\u0432\u043E\u0439 \u0434\u043E\u0441\u043A\u043E\u0439 \u043F\u043E \u0431\u043E\u043A\u0430\u043C \u0438 \u043A\u043E\u043D\u044C\u043A\u043E\u0432\u044B\u043C \u0431\u0440\u0443\u0441\u043E\u043C. \u041F\u043E\u0434 \u043A\u0440\u044B\u0448\u0435\u0439 \u043F\u0440\u043E\u0451\u043C \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0441\u0442\u043E\u044F\u0447\u0438\u0435 \u0434\u043E\u0441\u043A\u0438 (\u0441\u0442\u0435\u043D\u044B \u0438\u0437 \u0431\u0440\u0451\u0432\u0435\u043D \u0438 \u0434\u043E\u0441\u043E\u043A), \u0433\u043B\u0438\u043D\u0430 \u0441 \u043A\u043E\u043B\u044C\u044F\u043C\u0438 (\u043F\u043B\u0435\u0442\u0435\u043D\u044C) \u0438\u043B\u0438 \u043F\u043E\u0431\u0435\u043B\u043A\u0430 \u0441\u043E \u0441\u0442\u043E\u0439\u043A\u0430\u043C\u0438 (\u0444\u0430\u0445\u0432\u0435\u0440\u043A). \u0421\u043E\u0441\u0435\u0434\u043D\u0438\u0435 \u0441\u0435\u043A\u0446\u0438\u0438 \u0441\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u043E\u0439 \u043A\u0440\u044B\u0448\u0438 \u0441\u0445\u043E\u0434\u044F\u0442\u0441\u044F \u0431\u0435\u0437 \u0448\u0432\u0430. (\u0412 v15 \u0432 \u044D\u0442\u043E\u0442 \u0441\u0442\u0438\u043B\u044C \u043F\u0435\u0440\u0435\u0448\u043B\u0438 \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B, \u043F\u043E\u043B\u044B \u0438 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B.)","v10: en \xABConstruir\xBB, los cimientos, los suelos y las escaleras con el estilo v5. Es la construcci\xF3n v15.":"v10: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B, \u043F\u043E\u043B\u044B \u0438 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B \u0432 \u0441\u0442\u0438\u043B\u0435 v5. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v15.","v11: en \xABConstruir\xBB, los tejados de paja y de tablillas, y lo que cierra bajo el tejado, con el estilo v5. Es la construcci\xF3n v16.":"v11: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0441\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u044B\u0435 \u043A\u0440\u044B\u0448\u0438 \u0438 \u043A\u0440\u044B\u0448\u0438 \u0438\u0437 \u0434\u0440\u0430\u043D\u043A\u0438, \u0430 \u0442\u0430\u043A\u0436\u0435 \u0442\u043E, \u0447\u0442\u043E \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043F\u0440\u043E\u0451\u043C \u043F\u043E\u0434 \u043A\u0440\u044B\u0448\u0435\u0439, \u0432 \u0441\u0442\u0438\u043B\u0435 v5. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v16.","Demo \xFAnica \xB7 v11 (tejados con el estilo v5 en \xABConstruir\xBB)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v11 (\u043A\u0440\u044B\u0448\u0438 \u0432 \u0441\u0442\u0438\u043B\u0435 v5 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB)","Hito 1 \xB7 v16":"\u042D\u0442\u0430\u043F 1 \xB7 v16","v17: las puertas, la cerca, el portillo, la empalizada y su puerta, y el moj\xF3n con el estilo elegido (el de la prueba de estilo v5). La puerta de tablas es como la de la caba\xF1a de la prueba: cuatro tablas, peinazos por detr\xE1s, bisagras largas de hierro y tirador de argolla; la de varas lleva varas atadas con cuerda y tornapunta. La cerca y el portillo, postes redondos con el corte claro arriba y varas atadas; la empalizada, troncos descortezados de distinto alto con la punta tallada; su puerta, tablones con pletinas de hierro y argolla. El moj\xF3n, piedras apiladas y una vara con un trapo atado.":"v17: \u0434\u0432\u0435\u0440\u0438, \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u044C, \u043A\u0430\u043B\u0438\u0442\u043A\u0430, \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B \u0438 \u0435\u0433\u043E \u0432\u043E\u0440\u043E\u0442\u0430, \u0430 \u0442\u0430\u043A\u0436\u0435 \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5). \u0414\u043E\u0449\u0430\u0442\u0430\u044F \u0434\u0432\u0435\u0440\u044C \u2014 \u043A\u0430\u043A \u0443 \u0438\u0437\u0431\u0443\u0448\u043A\u0438 \u0438\u0437 \u043F\u0440\u043E\u0431\u044B: \u0447\u0435\u0442\u044B\u0440\u0435 \u0434\u043E\u0441\u043A\u0438, \u043F\u043B\u0430\u043D\u043A\u0438 \u0441\u0437\u0430\u0434\u0438, \u0434\u043B\u0438\u043D\u043D\u044B\u0435 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u0435 \u043F\u0435\u0442\u043B\u0438 \u0438 \u043A\u043E\u043B\u044C\u0446\u043E-\u0440\u0443\u0447\u043A\u0430; \u0434\u0432\u0435\u0440\u044C \u0438\u0437 \u0436\u0435\u0440\u0434\u0435\u0439 \u2014 \u0436\u0435\u0440\u0434\u0438, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0435 \u0432\u0435\u0440\u0451\u0432\u043A\u043E\u0439, \u0441 \u043F\u043E\u0434\u043A\u043E\u0441\u043E\u043C. \u0423 \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438 \u0438 \u043A\u0430\u043B\u0438\u0442\u043A\u0438 \u2014 \u043A\u0440\u0443\u0433\u043B\u044B\u0435 \u0441\u0442\u043E\u043B\u0431\u044B \u0441\u043E \u0441\u0432\u0435\u0442\u043B\u044B\u043C \u0441\u0440\u0435\u0437\u043E\u043C \u0441\u0432\u0435\u0440\u0445\u0443 \u0438 \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0435 \u0436\u0435\u0440\u0434\u0438; \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B \u2014 \u043E\u043A\u043E\u0440\u0451\u043D\u043D\u044B\u0435 \u0431\u0440\u0451\u0432\u043D\u0430 \u0440\u0430\u0437\u043D\u043E\u0439 \u0432\u044B\u0441\u043E\u0442\u044B \u0441 \u0437\u0430\u0442\u0451\u0441\u0430\u043D\u043D\u044B\u043C\u0438 \u043E\u0441\u0442\u0440\u0438\u044F\u043C\u0438; \u0435\u0433\u043E \u0432\u043E\u0440\u043E\u0442\u0430 \u2014 \u0434\u043E\u0441\u043A\u0438 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u043C\u0438 \u043F\u043E\u043B\u043E\u0441\u0430\u043C\u0438 \u0438 \u043A\u043E\u043B\u044C\u0446\u043E\u043C. \u041C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u2014 \u0433\u0440\u0443\u0434\u0430 \u043A\u0430\u043C\u043D\u0435\u0439 \u0438 \u0448\u0435\u0441\u0442 \u0441 \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u043D\u043E\u0439 \u0442\u0440\u044F\u043F\u0438\u0446\u0435\u0439.","v12: en \xABConstruir\xBB, las puertas, las cercas, el portillo, la empalizada y el moj\xF3n con el estilo v5. Es la construcci\xF3n v17.":"v12: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0434\u0432\u0435\u0440\u0438, \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u043A\u0430\u043B\u0438\u0442\u043A\u0430, \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B \u0438 \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v17.","Hito 1 \xB7 v17":"\u042D\u0442\u0430\u043F 1 \xB7 v17","Demo \xFAnica \xB7 v12 (puertas, cercas, empalizada y moj\xF3n con el estilo v5 en \xABConstruir\xBB)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v12 (\u0434\u0432\u0435\u0440\u0438, \u0438\u0437\u0433\u043E\u0440\u043E\u0434\u0438, \u0447\u0430\u0441\u0442\u043E\u043A\u043E\u043B \u0438 \u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB)","v18: los muebles con el estilo elegido (el de la prueba de estilo v5). La cama de paja, un marco de troncos con la paja amontonada, un jerg\xF3n de lino y una manta de lana; la de madera, postes, largueros y cabecero de tablas, colch\xF3n y almohada de lino y manta. La mesa, tres tablas sobre dos caballetes; el banco, como el de la prueba; el taburete, una rodaja con tres patas abiertas; el arc\xF3n, tablas con flejes, clavos y cerradura de hierro; el barril, duelas abombadas con dos aros; la estanter\xEDa, con trasera de tablas, vasijas de barro, un cuenco y un rollo de pa\xF1o; la antorcha de pie, una vara entre piedras con un cesto de hierro y estopa; la alfombra, una piel curtida con su forma; el estandarte, un pa\xF1o con pliegues, dos puntas y una banda.":"v18: \u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F v5). \u0421\u043E\u043B\u043E\u043C\u0435\u043D\u043D\u0430\u044F \u043F\u043E\u0441\u0442\u0435\u043B\u044C \u2014 \u0440\u0430\u043C\u0430 \u0438\u0437 \u0431\u0440\u0451\u0432\u0435\u043D \u0441 \u043E\u0445\u0430\u043F\u043A\u043E\u0439 \u0441\u043E\u043B\u043E\u043C\u044B, \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0442\u044E\u0444\u044F\u043A \u0438 \u0448\u0435\u0440\u0441\u0442\u044F\u043D\u043E\u0435 \u043E\u0434\u0435\u044F\u043B\u043E; \u0434\u0435\u0440\u0435\u0432\u044F\u043D\u043D\u0430\u044F \u043A\u0440\u043E\u0432\u0430\u0442\u044C \u2014 \u0441\u0442\u043E\u043B\u0431\u0438\u043A\u0438, \u0431\u043E\u043A\u043E\u0432\u0438\u043D\u044B \u0438 \u0434\u043E\u0449\u0430\u0442\u043E\u0435 \u0438\u0437\u0433\u043E\u043B\u043E\u0432\u044C\u0435, \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u043C\u0430\u0442\u0440\u0430\u0441, \u043F\u043E\u0434\u0443\u0448\u043A\u0430 \u0438 \u043E\u0434\u0435\u044F\u043B\u043E. \u0421\u0442\u043E\u043B \u2014 \u0442\u0440\u0438 \u0434\u043E\u0441\u043A\u0438 \u043D\u0430 \u0434\u0432\u0443\u0445 \u043A\u043E\u0437\u043B\u0430\u0445; \u0441\u043A\u0430\u043C\u044C\u044F \u2014 \u043A\u0430\u043A \u0432 \u043F\u0440\u043E\u0431\u0435; \u0442\u0430\u0431\u0443\u0440\u0435\u0442 \u2014 \u0441\u043F\u0438\u043B \u0431\u0440\u0435\u0432\u043D\u0430 \u043D\u0430 \u0442\u0440\u0451\u0445 \u0440\u0430\u0441\u0442\u043E\u043F\u044B\u0440\u0435\u043D\u043D\u044B\u0445 \u043D\u043E\u0436\u043A\u0430\u0445; \u0441\u0443\u043D\u0434\u0443\u043A \u2014 \u0434\u043E\u0441\u043A\u0438 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u043C\u0438 \u043F\u043E\u043B\u043E\u0441\u0430\u043C\u0438, \u0433\u0432\u043E\u0437\u0434\u044F\u043C\u0438 \u0438 \u0437\u0430\u043C\u043A\u043E\u043C; \u0431\u043E\u0447\u043A\u0430 \u2014 \u0432\u044B\u043F\u0443\u043A\u043B\u044B\u0435 \u043A\u043B\u0451\u043F\u043A\u0438 \u0438 \u0434\u0432\u0430 \u043E\u0431\u0440\u0443\u0447\u0430; \u043F\u043E\u043B\u043A\u0430 \u2014 \u0441 \u0434\u043E\u0449\u0430\u0442\u043E\u0439 \u0437\u0430\u0434\u043D\u0435\u0439 \u0441\u0442\u0435\u043D\u043A\u043E\u0439, \u0433\u043B\u0438\u043D\u044F\u043D\u044B\u043C\u0438 \u0433\u043E\u0440\u0448\u043A\u0430\u043C\u0438, \u043C\u0438\u0441\u043A\u043E\u0439 \u0438 \u0441\u0432\u0451\u0440\u0442\u043A\u043E\u043C \u0442\u043A\u0430\u043D\u0438; \u043D\u0430\u043F\u043E\u043B\u044C\u043D\u044B\u0439 \u0444\u0430\u043A\u0435\u043B \u2014 \u0448\u0435\u0441\u0442 \u0441\u0440\u0435\u0434\u0438 \u043A\u0430\u043C\u043D\u0435\u0439 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u043E\u0439 \u043A\u043E\u0440\u0437\u0438\u043D\u043A\u043E\u0439 \u0438 \u043F\u0430\u043A\u043B\u0435\u0439; \u043A\u043E\u0432\u0451\u0440 \u2014 \u0432\u044B\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u0448\u043A\u0443\u0440\u0430 \u0441\u043E \u0441\u0432\u043E\u0435\u0439 \u0444\u043E\u0440\u043C\u043E\u0439; \u0437\u043D\u0430\u043C\u044F \u2014 \u043F\u043E\u043B\u043E\u0442\u043D\u0438\u0449\u0435 \u0432 \u0441\u043A\u043B\u0430\u0434\u043A\u0430\u0445 \u0441 \u0434\u0432\u0443\u043C\u044F \u043A\u043E\u043D\u0446\u0430\u043C\u0438 \u0438 \u043F\u043E\u043B\u043E\u0441\u043E\u0439.","v13: en \xABConstruir\xBB, los muebles con el estilo v5. Es la construcci\xF3n v18.":"v13: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v18.","Hito 1 \xB7 v18":"\u042D\u0442\u0430\u043F 1 \xB7 v18","Demo \xFAnica \xB7 v13 (muebles con el estilo v5 en \xABConstruir\xBB)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v13 (\u043C\u0435\u0431\u0435\u043B\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5 \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB)","Hito 1 \xB7 v19":"\u042D\u0442\u0430\u043F 1 \xB7 v19","Combate \xB7 v11":"\u0411\u043E\u0439 \xB7 v11","Demo \xFAnica \xB7 v14 (armas, hacha y pieza al construir con el estilo v5)":"\u0415\u0434\u0438\u043D\u0430\u044F \u0434\u0435\u043C\u043E \xB7 v14 (\u043E\u0440\u0443\u0436\u0438\u0435, \u0442\u043E\u043F\u043E\u0440 \u0438 \u0434\u0435\u0442\u0430\u043B\u044C \u043F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0432 \u0441\u0442\u0438\u043B\u0435 v5)","v19: lo que quedaba con el aspecto inicial, con el estilo elegido (el de la prueba de estilo v5). La pieza que se ve al construir ya no es un bloque verde o rojo: es la propia pieza, con su madera, su piedra o su paja, transl\xFAcida y con un velo verde si cabe o rojo si no. Al desmontar, lo que se quita y lo que caer\xEDa se ven igual, con un velo naranja o rojo. Al talar, el personaje lleva un hacha en la mano (mango de fresno y cabeza de hierro, como la del toc\xF3n de la prueba); solo sale mientras tala.":"v19: \u0442\u043E, \u0447\u0442\u043E \u0435\u0449\u0451 \u043E\u0441\u0442\u0430\u0432\u0430\u043B\u043E\u0441\u044C \u0432 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E\u043C \u0432\u0438\u0434\u0435, \u0442\u0435\u043F\u0435\u0440\u044C \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u0441\u0442\u0438\u043B\u044C \u043F\u0440\u043E\u0431\u044B v5). \u0414\u0435\u0442\u0430\u043B\u044C, \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0432\u0438\u0434\u043D\u043E \u043F\u0440\u0438 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435, \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0437\u0435\u043B\u0451\u043D\u044B\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u044B\u0439 \u0431\u043B\u043E\u043A: \u044D\u0442\u043E \u0441\u0430\u043C\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u0441\u043E \u0441\u0432\u043E\u0438\u043C \u0434\u0435\u0440\u0435\u0432\u043E\u043C, \u043A\u0430\u043C\u043D\u0435\u043C \u0438\u043B\u0438 \u0441\u043E\u043B\u043E\u043C\u043E\u0439, \u043F\u043E\u043B\u0443\u043F\u0440\u043E\u0437\u0440\u0430\u0447\u043D\u0430\u044F, \u0441 \u0437\u0435\u043B\u0451\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E, \u0435\u0441\u043B\u0438 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F, \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439, \u0435\u0441\u043B\u0438 \u043D\u0435\u0442. \u041F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435 \u0442\u043E, \u0447\u0442\u043E \u0441\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F, \u0438 \u0442\u043E, \u0447\u0442\u043E \u0443\u043F\u0430\u043B\u043E \u0431\u044B, \u0432\u044B\u0433\u043B\u044F\u0434\u044F\u0442 \u0442\u0430\u043A \u0436\u0435, \u0441 \u043E\u0440\u0430\u043D\u0436\u0435\u0432\u043E\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E. \u041A\u043E\u0433\u0434\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0440\u0443\u0431\u0438\u0442 \u0434\u0435\u0440\u0435\u0432\u043E, \u0443 \u043D\u0435\u0433\u043E \u0432 \u0440\u0443\u043A\u0435 \u0442\u043E\u043F\u043E\u0440 (\u044F\u0441\u0435\u043D\u0435\u0432\u043E\u0435 \u0442\u043E\u043F\u043E\u0440\u0438\u0449\u0435 \u0438 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u0439 \u043E\u0431\u0443\u0445, \u043A\u0430\u043A \u0443 \u0442\u043E\u043F\u043E\u0440\u0430 \u043D\u0430 \u043F\u043D\u0435 \u0432 \u043F\u0440\u043E\u0431\u0435); \u043E\u043D \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0440\u0443\u0431\u043A\u0438.","v11: las armas y lo de la liza con el estilo elegido (el de la prueba de estilo v5). Las espadas, con la hoja de secci\xF3n de rombo y su vaceo, el pu\xF1o forrado de cuero con su atadura, la cruz y el pomo de rueda de hierro; el palo, una vara descortezada con nudos; el arco, de una pieza, m\xE1s fino hacia las puntas y con el pu\xF1o de cuero; el escudo, seis tablas con veta, el canto forrado de cuero cosido y el umbo con clavos; la flecha, con punta de hie
