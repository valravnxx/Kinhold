rro y tres plumas atadas. El poste de pr\xE1ctica lleva dos haces de paja atados y piedras al pie; la diana es un haz de paja con un pa\xF1o pintado con tierras (ocre, almagre y carb\xF3n) en vez de los anillos de colores vivos. Las cintas que distinguen a los luchadores son ahora de pa\xF1o te\xF1ido, azul de glasto y amarillo de gualda, m\xE1s apagados.":"v11: \u043E\u0440\u0443\u0436\u0438\u0435 \u0438 \u0432\u0441\u0451 \u043D\u0430 \u0440\u0438\u0441\u0442\u0430\u043B\u0438\u0449\u0435 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (\u0441\u0442\u0438\u043B\u044C \u043F\u0440\u043E\u0431\u044B v5). \u0423 \u043C\u0435\u0447\u0435\u0439 \u043A\u043B\u0438\u043D\u043E\u043A \u0440\u043E\u043C\u0431\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u0441\u0435\u0447\u0435\u043D\u0438\u044F \u0441 \u0434\u043E\u043B\u043E\u043C, \u0440\u0443\u043A\u043E\u044F\u0442\u044C, \u043E\u0431\u0442\u044F\u043D\u0443\u0442\u0430\u044F \u043A\u043E\u0436\u0435\u0439 \u0441 \u043E\u0431\u043C\u043E\u0442\u043A\u043E\u0439, \u0436\u0435\u043B\u0435\u0437\u043D\u0430\u044F \u043A\u0440\u0435\u0441\u0442\u043E\u0432\u0438\u043D\u0430 \u0438 \u0434\u0438\u0441\u043A\u043E\u0432\u043E\u0435 \u043D\u0430\u0432\u0435\u0440\u0448\u0438\u0435; \u043F\u043E\u0441\u043E\u0445 \u2014 \u043E\u0448\u043A\u0443\u0440\u0435\u043D\u043D\u0430\u044F \u0436\u0435\u0440\u0434\u044C \u0441 \u0441\u0443\u0447\u043A\u0430\u043C\u0438; \u043B\u0443\u043A \u2014 \u0446\u0435\u043B\u044C\u043D\u044B\u0439, \u0442\u043E\u043D\u044C\u0448\u0435 \u043A \u043A\u043E\u043D\u0446\u0430\u043C, \u0441 \u043A\u043E\u0436\u0430\u043D\u043E\u0439 \u0440\u0443\u043A\u043E\u044F\u0442\u044C\u044E; \u0449\u0438\u0442 \u2014 \u0448\u0435\u0441\u0442\u044C \u0434\u043E\u0441\u043E\u043A \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439 \u0434\u0435\u0440\u0435\u0432\u0430, \u043E\u0431\u043E\u0434, \u043E\u0431\u0448\u0438\u0442\u044B\u0439 \u043A\u043E\u0436\u0435\u0439, \u0438 \u0443\u043C\u0431\u043E\u043D \u0441 \u0433\u0432\u043E\u0437\u0434\u044F\u043C\u0438; \u0441\u0442\u0440\u0435\u043B\u0430 \u2014 \u0441 \u0436\u0435\u043B\u0435\u0437\u043D\u044B\u043C \u043D\u0430\u043A\u043E\u043D\u0435\u0447\u043D\u0438\u043A\u043E\u043C \u0438 \u0442\u0440\u0435\u043C\u044F \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u043C\u0438 \u043F\u0435\u0440\u044C\u044F\u043C\u0438. \u041D\u0430 \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043E\u0447\u043D\u043E\u043C \u0441\u0442\u043E\u043B\u0431\u0435 \u0434\u0432\u0430 \u043F\u0435\u0440\u0435\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u0441\u043D\u043E\u043F\u0430 \u0441\u043E\u043B\u043E\u043C\u044B \u0438 \u043A\u0430\u043C\u043D\u0438 \u0443 \u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0438\u044F; \u043C\u0438\u0448\u0435\u043D\u044C \u2014 \u0441\u043D\u043E\u043F \u0441\u043E\u043B\u043E\u043C\u044B \u0441 \u043F\u043E\u043B\u043E\u0442\u043D\u043E\u043C, \u0440\u0430\u0441\u043F\u0438\u0441\u0430\u043D\u043D\u044B\u043C \u0437\u0435\u043C\u043B\u044F\u043D\u044B\u043C\u0438 \u043A\u0440\u0430\u0441\u043A\u0430\u043C\u0438 (\u043E\u0445\u0440\u0430, \u043A\u0440\u0430\u0441\u043D\u0430\u044F \u043E\u0445\u0440\u0430 \u0438 \u0443\u0433\u043E\u043B\u044C), \u0432\u043C\u0435\u0441\u0442\u043E \u044F\u0440\u043A\u0438\u0445 \u0446\u0432\u0435\u0442\u043D\u044B\u0445 \u043A\u043E\u043B\u0435\u0446. \u041B\u0435\u043D\u0442\u044B, \u043F\u043E \u043A\u043E\u0442\u043E\u0440\u044B\u043C \u0440\u0430\u0437\u043B\u0438\u0447\u0430\u044E\u0442 \u0431\u043E\u0439\u0446\u043E\u0432, \u0442\u0435\u043F\u0435\u0440\u044C \u0438\u0437 \u043A\u0440\u0430\u0448\u0435\u043D\u043E\u0433\u043E \u0441\u0443\u043A\u043D\u0430, \u0441\u0438\u043D\u0435\u0433\u043E (\u0432\u0430\u0439\u0434\u0430) \u0438 \u0436\u0451\u043B\u0442\u043E\u0433\u043E (\u0440\u0435\u0437\u0435\u0434\u0430), \u0431\u043E\u043B\u0435\u0435 \u043F\u0440\u0438\u0433\u043B\u0443\u0448\u0451\u043D\u043D\u044B\u0435.","v14: lo que quedaba con el aspecto inicial, con el estilo v5: en \xABConstruir\xBB, la pieza que se ve al colocar (la propia pieza, transl\xFAcida, con un velo verde o rojo), lo que se marca al desmontar y el hacha en la mano al talar; en \xABDuelo\xBB, las espadas, el palo, el arco, el escudo, la flecha, el poste de pr\xE1ctica y la diana. Es la construcci\xF3n v19 y el combate v11.":"v14: \u0442\u043E, \u0447\u0442\u043E \u0435\u0449\u0451 \u043E\u0441\u0442\u0430\u0432\u0430\u043B\u043E\u0441\u044C \u0432 \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E\u043C \u0432\u0438\u0434\u0435, \u0442\u0435\u043F\u0435\u0440\u044C \u0432 \u0441\u0442\u0438\u043B\u0435 v5: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u2014 \u0434\u0435\u0442\u0430\u043B\u044C, \u043A\u043E\u0442\u043E\u0440\u0443\u044E \u0432\u0438\u0434\u043D\u043E \u043F\u0440\u0438 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0435 (\u0441\u0430\u043C\u0430 \u0434\u0435\u0442\u0430\u043B\u044C, \u043F\u043E\u043B\u0443\u043F\u0440\u043E\u0437\u0440\u0430\u0447\u043D\u0430\u044F, \u0441 \u0437\u0435\u043B\u0451\u043D\u043E\u0439 \u0438\u043B\u0438 \u043A\u0440\u0430\u0441\u043D\u043E\u0439 \u0432\u0443\u0430\u043B\u044C\u044E), \u0442\u043E, \u0447\u0442\u043E \u0432\u044B\u0434\u0435\u043B\u044F\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0435, \u0438 \u0442\u043E\u043F\u043E\u0440 \u0432 \u0440\u0443\u043A\u0435 \u043F\u0440\u0438 \u0440\u0443\u0431\u043A\u0435; \u0432 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043A\u0435\xBB \u2014 \u043C\u0435\u0447\u0438, \u043F\u043E\u0441\u043E\u0445, \u043B\u0443\u043A, \u0449\u0438\u0442, \u0441\u0442\u0440\u0435\u043B\u0430, \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043E\u0447\u043D\u044B\u0439 \u0441\u0442\u043E\u043B\u0431 \u0438 \u043C\u0438\u0448\u0435\u043D\u044C. \u042D\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v19 \u0438 \u0431\u043E\u0439 v11.","v10: junto a un \xE1rbol, Usar (F) hace que el personaje tale; moverse lo para. De momento es solo el gesto (desde la v19, con el hacha en la mano), sin dar madera: recolectar llega con el hito 2.":"v10: \u0440\u044F\u0434\u043E\u043C \u0441 \u0434\u0435\u0440\u0435\u0432\u043E\u043C \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u0437\u0430\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0440\u0443\u0431\u0438\u0442\u044C \u0435\u0433\u043E; \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u0440\u0443\u0431\u043A\u0443. \u041F\u043E\u043A\u0430 \u044D\u0442\u043E \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 (\u0441 v19 \u2014 \u0441 \u0442\u043E\u043F\u043E\u0440\u043E\u043C \u0432 \u0440\u0443\u043A\u0435), \u0431\u0435\u0437 \u0434\u0440\u0435\u0432\u0435\u0441\u0438\u043D\u044B: \u0441\u0431\u043E\u0440 \u043F\u0440\u0438\u0434\u0451\u0442 \u0441 \u044D\u0442\u0430\u043F\u043E\u043C 2.","Cavar \xB7 v1 (prueba de rendimiento)":"\u041A\u043E\u043F\u0430\u043D\u0438\u0435 \xB7 v1 (\u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438)","v1: prueba de rendimiento de cavar con \xABv\xF3xeles suavizados\xBB (decidido por valravnx el 27 oct). La roca se divide en cubitos de 50 cm, en trozos de 8 m; cada golpe de pico (clic o toque sobre la roca) quita un pu\xF1ado redondeado de unos 80 cm de radio (galer\xEDas de algo m\xE1s de 1,5 m). La pared se dibuja lisa alrededor de los cubitos, con la rugosidad de la roca sacada de una semilla fija: todos ver\xEDan la misma cueva.":"v1: \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043A\u043E\u043F\u0430\u043D\u0438\u044F \u0441\u043E \xAB\u0441\u0433\u043B\u0430\u0436\u0435\u043D\u043D\u044B\u043C\u0438 \u0432\u043E\u043A\u0441\u0435\u043B\u044F\u043C\u0438\xBB (\u0440\u0435\u0448\u0435\u043D\u043E valravnx 27 \u043E\u043A\u0442.). \u041F\u043E\u0440\u043E\u0434\u0430 \u0434\u0435\u043B\u0438\u0442\u0441\u044F \u043D\u0430 \u043A\u0443\u0431\u0438\u043A\u0438 \u043F\u043E 50 \u0441\u043C, \u043A\u0443\u0441\u043A\u0438 \u043F\u043E 8 \u043C; \u043A\u0430\u0436\u0434\u044B\u0439 \u0443\u0434\u0430\u0440 \u043A\u0438\u0440\u043A\u0438 (\u0449\u0435\u043B\u0447\u043E\u043A \u0438\u043B\u0438 \u043A\u0430\u0441\u0430\u043D\u0438\u0435 \u0441\u043A\u0430\u043B\u044B) \u0443\u0431\u0438\u0440\u0430\u0435\u0442 \u043E\u043A\u0440\u0443\u0433\u043B\u0443\u044E \u0433\u043E\u0440\u0441\u0442\u044C \u0440\u0430\u0434\u0438\u0443\u0441\u043E\u043C \u043E\u043A\u043E\u043B\u043E 80 \u0441\u043C (\u0448\u0442\u043E\u043B\u044C\u043D\u0438 \u0447\u0443\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 1,5 \u043C). \u0421\u0442\u0435\u043D\u0430 \u0440\u0438\u0441\u0443\u0435\u0442\u0441\u044F \u0433\u043B\u0430\u0434\u043A\u043E\u0439 \u0432\u043E\u043A\u0440\u0443\u0433 \u043A\u0443\u0431\u0438\u043A\u043E\u0432, \u0430 \u0448\u0435\u0440\u043E\u0445\u043E\u0432\u0430\u0442\u043E\u0441\u0442\u044C \u043A\u0430\u043C\u043D\u044F \u0431\u0435\u0440\u0451\u0442\u0441\u044F \u0438\u0437 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u043E\u0433\u043E \u0437\u0435\u0440\u043D\u0430: \u0432\u0441\u0435 \u0443\u0432\u0438\u0434\u0435\u043B\u0438 \u0431\u044B \u043E\u0434\u043D\u0443 \u0438 \u0442\u0443 \u0436\u0435 \u043F\u0435\u0449\u0435\u0440\u0443.","v1: arriba a la derecha se mide lo que tarda en rehacerse la malla de los trozos tocados en cada golpe (media y peor) y los fotogramas. \xABCavar t\xFAnel\xBB abre solo un t\xFAnel en la ladera para medir sin tener que tocar.":"v1: \u0441\u043F\u0440\u0430\u0432\u0430 \u0432\u0432\u0435\u0440\u0445\u0443 \u0438\u0437\u043C\u0435\u0440\u044F\u0435\u0442\u0441\u044F, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0432\u0440\u0435\u043C\u0435\u043D\u0438 \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u043F\u0435\u0440\u0435\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0441\u0435\u0442\u043A\u0438 \u0437\u0430\u0442\u0440\u043E\u043D\u0443\u0442\u044B\u0445 \u043A\u0443\u0441\u043A\u043E\u0432 \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u043C \u0443\u0434\u0430\u0440\u0435 (\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C \u0438 \u0432 \u0445\u0443\u0434\u0448\u0435\u043C \u0441\u043B\u0443\u0447\u0430\u0435), \u0438 \u0447\u0430\u0441\u0442\u043E\u0442\u0430 \u043A\u0430\u0434\u0440\u043E\u0432. \xAB\u0412\u044B\u043A\u043E\u043F\u0430\u0442\u044C \u0442\u0443\u043D\u043D\u0435\u043B\u044C\xBB \u0441\u0430\u043C\u0430 \u043F\u0440\u043E\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442 \u0442\u0443\u043D\u043D\u0435\u043B\u044C \u0432 \u0441\u043A\u043B\u043E\u043D\u0435, \u0447\u0442\u043E\u0431\u044B \u043C\u0435\u0440\u0438\u0442\u044C \u0431\u0435\u0437 \u043A\u0430\u0441\u0430\u043D\u0438\u0439.","v1, provisional: no hay personaje ni pico todav\xEDa (se cava tocando la roca con la c\xE1mara libre), ni se oculta lo de encima, ni hay negro ni entibado: son las tareas siguientes del hito 1g.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0438 \u043A\u0438\u0440\u043A\u0438 \u0435\u0449\u0451 \u043D\u0435\u0442 (\u043A\u043E\u043F\u0430\u044E\u0442, \u043A\u0430\u0441\u0430\u044F\u0441\u044C \u0441\u043A\u0430\u043B\u044B \u043F\u0440\u0438 \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u043E\u0439 \u043A\u0430\u043C\u0435\u0440\u0435), \u0442\u043E, \u0447\u0442\u043E \u0441\u0432\u0435\u0440\u0445\u0443, \u043F\u043E\u043A\u0430 \u043D\u0435 \u0441\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F, \u043D\u0435\u0442 \u0447\u0435\u0440\u043D\u043E\u0442\u044B \u0438 \u043A\u0440\u0435\u043F\u0438: \u044D\u0442\u043E \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0435 \u0437\u0430\u0434\u0430\u0447\u0438 \u044D\u0442\u0430\u043F\u0430 1g.","{fps} fps \xB7 {tri} mil tri\xE1ngulos \xB7 malla por golpe: {media} ms de media, {peor} ms el peor ({n} golpes)":"{fps} \u043A/\u0441 \xB7 {tri} \u0442\u044B\u0441. \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u043E\u0432 \xB7 \u0441\u0435\u0442\u043A\u0430 \u0437\u0430 \u0443\u0434\u0430\u0440: \u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C {media} \u043C\u0441, \u0445\u0443\u0434\u0448\u0435\u0435 {peor} \u043C\u0441 ({n} \u0443\u0434\u0430\u0440\u043E\u0432)","Cavar t\xFAnel":"\u0412\u044B\u043A\u043E\u043F\u0430\u0442\u044C \u0442\u0443\u043D\u043D\u0435\u043B\u044C","Toca o haz clic en la roca para cavar. Arrastra para girar la c\xE1mara.":"\u041A\u043E\u0441\u043D\u0438\u0442\u0435\u0441\u044C \u0441\u043A\u0430\u043B\u044B \u0438\u043B\u0438 \u0449\u0451\u043B\u043A\u043D\u0438\u0442\u0435 \u043F\u043E \u043D\u0435\u0439, \u0447\u0442\u043E\u0431\u044B \u043A\u043E\u043F\u0430\u0442\u044C. \u0422\u044F\u043D\u0438\u0442\u0435, \u0447\u0442\u043E\u0431\u044B \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043A\u0430\u043C\u0435\u0440\u0443."};var lo={en:nu,ru:iu},ii=["es",...Object.keys(lo).filter(i=>Object.keys(lo[i]).length)],au={es:"ES",en:"EN",ru:"RU"},ou="kinhold_web_idioma";function Q0(){let i=new URLSearchParams(location.search).get("lang");if(ii.includes(i))return i;try{let t=localStorage.getItem(ou);if(ii.includes(t))return t}catch{}let e=(navigator.language||"es").slice(0,2);return ii.includes(e)?e:e==="es"||e==="ca"?"es":ii.includes("en")?"en":"es"}var Sn=typeof location>"u"?"es":Q0(),lu=new Set,ev=new Set(Sn==="es"?[]:Object.values(lo[Sn]));typeof window<"u"&&(window.__idioma={idioma:Sn,faltan:lu,DISPONIBLES:ii});function Zt(i,e){let t=i;if(Sn!=="es"&&i){let n=lo[Sn];n[i]!==void 0?t=n[i]:ev.has(i)||lu.add(i)}return e&&(t=t.replace(/\{(\w+)\}/g,(n,a)=>e[a]!==
