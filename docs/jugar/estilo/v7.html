<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kinhold Estilo</title>
<style>
:root{ --panel: rgba(36,30,24,.86); --panel2: rgba(58,48,38,.92); --ink:#f1e8d8; --muted:#bfb19a; --acento:#d9a441; --linea: rgba(241,232,216,.15); color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#c3d2d8;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#vineta{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(20,14,8,.85) 100%);opacity:0}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:7px 11px;cursor:pointer}
button.sel{background:var(--acento);color:#241b10;border-color:transparent;font-weight:600}
[hidden]{display:none!important}
#superior{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#superior > *{pointer-events:auto}
#estilos{display:flex;gap:6px;flex-wrap:wrap}
#medida{margin-left:auto;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
#resumen{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));max-width:min(380px,calc(100vw - 20px));background:var(--panel);border-radius:10px;padding:8px 11px;font-size:12.5px;color:var(--muted)}
#inferior{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px)}
#notas{position:fixed;inset:auto 10px calc(64px + env(safe-area-inset-bottom,0px)) 10px;max-width:560px;margin:0 auto;max-height:60vh;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:13px}
#notas ul{padding-left:18px;margin:6px 0 0} #notas li{margin:0 0 6px}
@media (max-width:600px){ #medida{margin-left:0} #estilos button,#inferior button{padding:6px 8px;font-size:12.5px} #resumen{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))} }
.foco{position:fixed;left:0;right:0;pointer-events:none;display:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.foco.arriba{top:0;height:30%;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.foco.abajo{bottom:0;height:26%;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
body.desenfoque .foco{display:block}
button.idioma{padding:6px 8px;font-weight:700}
@media (max-width:600px){ button.idioma.sel{display:none} } /* en el móvil solo se ve el botón del otro idioma */
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div class="foco arriba"></div><div class="foco abajo"></div>
<div id="superior">
  <div id="estilos"><button data-luz="manana">Mañana</button><button data-luz="tarde">Tarde</button><button id="btnDesenfoque">Desenfoque</button><button id="btnAndar">Quieto</button></div>
  <div id="medida">midiendo…</div>
</div>
<div id="inferior"><button data-vista="maqueta">General</button><button data-vista="cabana">Cabaña</button><button data-vista="lado">Lado</button><button data-vista="personaje">Personaje</button><button data-vista="cara">Cara</button><button id="btnNotas">Notas</button></div>
<div id="notas" hidden></div>

xB7 force {f}%","Tu contraataque entra: {g} en {z}":"Your counterattack lands: {g} to the {z}","Hieres al rival: {g} en {z} (est\xE1 agotado y su parada cede)":"You wound the opponent: {g} to the {z} (he is exhausted and his parry gives way)","Hieres al rival: {g} en {z}":"You wound the opponent: {g} to the {z}","El rival para tu golpe":"The opponent parries your blow","El rival para en el momento justo: quedas descolocado":"The opponent parries at just the right moment: you are off balance","\xA1Golpe maestro del rival! Desv\xEDa el tuyo":"Master strike by the opponent! He deflects yours","Golpe al aire: fuera de alcance":"Blow in the air: out of reach","Te hieren: {g} en {z} (era un contraataque: solo lo para una parada perfecta)":"You are wounded: {g} to the {z} (it was a counterattack: only a perfect parry stops it)","Te hieren: {g} en {z} (est\xE1s agotado y tu parada cede)":"You are wounded: {g} to the {z} (you are exhausted and your parry gives way)","Te hieren: {g} en {z}":"You are wounded: {g} to the {z}","Paras el golpe":"You parry the blow","\xA1Parada perfecta! Contraataca ya":"Perfect parry! Counter now","\xA1Golpe maestro! Desv\xEDas su golpe y el tuyo entra":"Master strike! You deflect his blow and yours lands","El rival golpea al aire":"The opponent strikes the air","Aciertas: herida {g} en {z}":"Hit: {g} wound to the {z}","Te alcanza: herida {g} en {z}":"You are hit: {g} wound to the {z}","Tu escudo para la flecha":"Your shield stops the arrow","Tu escudo para la piedra":"Your shield stops the stone","El rival para tu flecha con el escudo":"The opponent stops your arrow with his shield","El rival para tu piedra con el escudo":"The opponent stops your stone with his shield","Diana a {d} m: {p} puntos":"Target at {d} m: {p} points","Al suelo a {d} m":"Into the ground at {d} m","Has vencido":"You have won","Has ca\xEDdo":"You have fallen","El rival: {m}.":"The opponent: {m}.",Cansancio:"Fatigue",Sangrado:"Bleeding","Pierdes sangre. Te queda {s}%.":"You are losing blood. {s}% left.","Herida {g}":"{g} wound",Descolocado:"Off balance","No puedes atacar ni parar un momento.":"You can't attack or parry for a moment.",parando:"parrying","golpes y tiros m\xE1s lentos y flojos":"slower, weaker blows and shots","algo m\xE1s lento":"a little slower","te mueves m\xE1s despacio":"you move more slowly","sangra mucho":"bleeds heavily","Como la tuya":"Same as yours",T\u00FA:"You",Rival:"Opponent",Duelo:"Duel","Carga desde 40 m":"Charge from 40 m","Pr\xE1cticas (poste y dianas)":"Practice (post and targets)","Aprendiz (lento, con avisos)":"Apprentice (slow, with cues)","Normal (solo ves el lado)":"Normal (you only see the side)","Realista (sin avisos)":"Realistic (no cues)","{c}%. Atacar, parar, fintar y fallar cansan; mantener la parada tambi\xE9n. Por encima del 70% tus golpes son m\xE1s lentos y al {r}% tu parada cede.":"{c}%. Attacking, parrying, feinting and missing tire you; so does holding a parry. Above 70% your blows are slower, and at {r}% your parry gives way.","Golpes lanzados":"Blows thrown","Heridas causadas":"Wounds dealt","Golpes parados":"Blows parried","Paradas perfectas":"Perfect parries","Golpes maestros":"Master strikes","Heridas recibidas":"Wounds taken",Tiros:"Shots",Aciertos:"Hits",Kinhold:"Kinhold","Kinhold Combate":"Kinhold Combat","+ Materiales":"+ Materials",Decisiones:"Decisions",Ayuda:"Help",Reiniciar:"Restart",Mover:"Move",Construir:"Build",Desmontar:"Dismantle",Girar:"Rotate",Colocar:"Place",Usar:"Use",Cancelar:"Cancel","Decisiones tomadas en este hito":"Decisions made in this milestone","C\xF3mo se juega este hito":"How to play this milestone","Pulsa <b>Construir</b>, pesta\xF1a <b>Tierra</b>, y coloca tu <b>moj\xF3n</b>: tu tierra es el c\xEDrculo claro de 20 m.":"Press <b>Build</b>, tab <b>Land</b>, and place your <b>boundary stone</b>: your land is the light 20 m circle.","Empieza por un <b>cimiento</b> (pesta\xF1a Base). Esa primera pieza fija la rejilla; puedes girarla antes de colocarla.":"Start with a <b>foundation</b> (Base tab). That first piece sets the grid; you can rotate it before placing it.","Pon <b>muros</b> junto al cimiento, un <b>suelo</b> en la planta 1 encima de los muros, y <b>tejado</b> arriba.":"Put <b>walls</b> next to the foundation, a <b>floor</b> on floor 1 on top of the walls, and a <b>roof</b> above.","Si algo no aguanta el peso, se marca en rojo la pieza d\xE9bil y no se coloca.":"If something can't bear the weight, the weak piece is marked in red and nothing is placed.","En <b>Desmontar</b>, la pieza se marca en naranja y lo que caer\xEDa encima en rojo. Recuperas el 75%.":"In <b>Dismantle</b>, the piece is marked in orange and whatever would fall on top in red. You get back 75%.","Las puertas y la escalera de mano se usan con <b>Usar</b>.":"Doors and the ladder are used with <b>Use</b>.","<kbd>W A S D</kbd> moverse \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n derecho: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> move \xB7 <kbd>Shift</kbd> run \xB7 <kbd>Q</kbd>/<kbd>E</kbd> or right button: turn camera \xB7 wheel: zoom","<kbd>B</kbd> construir \xB7 <kbd>X</kbd> desmontar \xB7 <kbd>R</kbd> girar pieza \xB7 <kbd>ReP\xE1g</kbd>/<kbd>AvP\xE1g</kbd> planta \xB7 <kbd>F</kbd> usar \xB7 <kbd>Esc</kbd> salir":"<kbd>B</kbd> build \xB7 <kbd>X</kbd> dismantle \xB7 <kbd>R</kbd> rotate piece \xB7 <kbd>PgUp</kbd>/<kbd>PgDn</kbd> floor \xB7 <kbd>F</kbd> use \xB7 <kbd>Esc</kbd> exit","Joystick abajo a la izquierda para moverte. Arrastra con un dedo para girar la c\xE1mara y pellizca para el zoom.":"Joystick at the bottom left to move. Drag with one finger to turn the camera and pinch to zoom.","Al construir, toca el suelo donde quieres la pieza y pulsa <b>Colocar</b>.":"When building, tap the ground where you want the piece and press <b>Place</b>.",'<label><input type="checkbox" id="chkSigue"> La pieza sigue al personaje (en vez de tocar el suelo)</label>':'<label><input type="checkbox" id="chkSigue"> The piece follows the character (instead of tapping the ground)</label>',Opciones:"Options",Modo:"Mode","Tu arma":"Your weapon","Tu ropa":"Your clothing","Ropa del rival":"Opponent's clothing","Arma del rival":"Opponent's weapon",Dificultad:"Difficulty",Sonido:"Sound","Der.":"Right","Izq.":"Left","Estoc.":"Thrust",Parar:"Parry","Otra vez":"Again","C\xF3mo se combate":"How to fight","<kbd>W A S D</kbd> moverte \xB7 <kbd>May\xFAs</kbd> correr \xB7 <kbd>Q</kbd>/<kbd>E</kbd> o bot\xF3n central: girar c\xE1mara \xB7 rueda: zoom":"<kbd>W A S D</kbd> move \xB7 <kbd>Shift</kbd> run \xB7 <kbd>Q</kbd>/<kbd>E</kbd> or middle button: turn camera \xB7 wheel: zoom","Cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean, siempre de cara.":"Near the opponent, forward and back close in or pull away, and the sides circle around him, always facing him.","<b>Atacar:</b> sobre el rival aparece una rosa de cinco zonas. Pon el cursor en la zona por la que quieres golpear y haz clic. El centro es la estocada. Tambi\xE9n <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> del teclado num\xE9rico.":"<b>Attack:</b> a rose of five zones appears over the opponent. Put the cursor on the zone you want to strike from and click. The centre is the thrust. Also <kbd>8</kbd> <kbd>4</kbd> <kbd>6</kbd> <kbd>2</kbd> <kbd>5</kbd> on the numeric keypad.","<b>Finta:</b> mientras preparas el golpe, haz clic en otra zona para cambiarlo (hasta la mitad de la preparaci\xF3n, cuesta aliento).":"<b>Feint:</b> while winding up the blow, click another zone to change it (up to halfway through the wind-up; it costs stamina).","<b>Parar:</b> mant\xE9n el bot\xF3n derecho o <kbd>Espacio</kbd>. No hace falta elegir lado.":"<b>Parry:</b> hold the right button or <kbd>Space</kbd>. You don't need to choose a side.","<b>Arco y piedras:</b> mant\xE9n el bot\xF3n izquierdo para tensar, apunta y suelta. El c\xEDrculo se cierra al tensar y se pone verde cuando est\xE1 listo; si aguantas demasiado tiembla.":"<b>Bow and stones:</b> hold the left button to draw, aim and release. The circle closes as you draw and turns green when ready; if you hold too long it shakes.","Joystick a la izquierda para moverte; cerca del rival los lados le rodean. Dos dedos giran la c\xE1mara.":"Joystick on the left to move; near the opponent the sides circle around him. Two fingers turn the camera.","<b>Atacar:</b> toca una zona de la rosa que aparece sobre el rival. El centro es la estocada. Tocar otra zona mientras preparas es una finta.":"<b>Attack:</b> tap a zone of the rose that appears over the opponent. The centre is the thrust. Tapping another zone while winding up is a feint.","<b>Parar:</b> mant\xE9n el bot\xF3n Parar.":"<b>Parry:</b> hold the Parry button.","<b>Arco y piedras:</b> mant\xE9n el dedo para tensar, arrastra para apuntar y suelta.":"<b>Bow and stones:</b> hold your finger to draw, drag to aim and release.","Las tres capas de defensa":"The three layers of defence","<b>Parada:</b> mantener Parar detiene cualquier golpe, pero cansa. Agotado (95%), cede.":"<b>Parry:</b> holding Parry stops any blow, but it tires you. When exhausted (95%), it gives way.","<b>Escudo</b> (arma \xABEspada y escudo\xBB): al parar se levanta; para tambi\xE9n flechas y piedras que te vengan de frente y cansa menos que parar con la espada. La espada de una mano llega algo menos que la larga.":"<b>Shield</b> (weapon \u201CSword and shield\u201D): it rises when you parry; it also stops arrows and stones coming from the front and tires you less than parrying with the sword. The one-handed sword reaches a little less than the longsword.",'<b>Parada perfecta:</b> empieza a parar justo antes del impacto (zona en <span style="color:var(--verde)">verde</span> en aprendiz). El rival queda descolocado y tu contraataque sale r\xE1pido y solo se para con otra parada perfecta.':'<b>Perfect parry:</b> start parrying just before the impact (zone in <span style="color:var(--verde)">green</span> on apprentice). The opponent is thrown off balance and your counterattack comes out fast and can only be stopped by another perfect parry.','<b>Golpe maestro:</b> si ves venir un golpe por un lado (zona en <span style="color:var(--rojo)">rojo</span>), golpea t\xFA por ese mismo lado al principio de su preparaci\xF3n (borde dorado). Desv\xEDas su golpe y el tuyo entra.':'<b>Master strike:</b> if you see a blow coming from one side (zone in <span style="color:var(--rojo)">red</span>), strike from that same side early in his wind-up (golden edge). You deflect his blow and yours lands.',"En <b>aprendiz</b> los golpes son lentos y ves el lado y el momento. En <b>normal</b> solo ves el lado. En <b>realista</b> no hay avisos: hay que leer el cuerpo del rival.":"On <b>apprentice</b> blows are slow and you see the side and the timing. On <b>normal</b> you only see the side. On <b>realistic</b> there are no cues: you have to read the opponent's body.",Avisos:"Status","Los c\xEDrculos de la derecha avisan de cansancio, sangrado y heridas. T\xF3calos para ver qu\xE9 efecto tienen.":"The circles on the right warn of fatigue, bleeding and wounds. Tap them to see their effect.","Decisiones tomadas en el combate":"Decisions made in combat","Terreno llano en este hito. Las cuestas y su efecto en los cimientos llegan con el mundo generado.":"Flat terrain in this milestone. Slopes and their effect on foundations come with the generated world.","Los materiales vienen dados (y hay bot\xF3n para rellenar). Recolectarlos llega en el hito 2.":"Materials are given (and there's a button to refill them). Gathering them comes in milestone 2.","Para construir hace falta tu moj\xF3n; la tierra es un c\xEDrculo de 20 m (moj\xF3n de nivel 1). Subir de nivel el moj\xF3n llega m\xE1s adelante.":"Building requires your boundary stone; your land is a 20 m circle (level 1 stone). Upgrading the stone comes later.","La primera pieza estructural fija la rejilla: posici\xF3n donde apuntas y giro libre en pasos de 15\xB0. Toda pieza a menos de 6 m de una construcci\xF3n encaja en su rejilla.":"The first structural piece sets the grid: position where you aim and free rotation in 15\xB0 steps. Any piece within 6 m of a building snaps to its grid.","Los apoyos siguen un orden realista: un muro descansa primero en el muro o la viga de debajo, si no en postes en sus dos extremos, y si no en el suelo o cimiento de al lado.":"Supports follow a realistic order: a wall rests first on the wall or beam below it, otherwise on posts at both ends, and otherwise on the floor or foundation beside it.","La carga se reparte a partes iguales entre los apoyos de cada pieza.":"The load is shared equally among each piece's supports.","Al desmontar recuperas el 75% de esa pieza. Lo que cae en cascada encima se destruye sin devolver material.":"Dismantling gives back 75% of that piece. Whatever collapses on top of it is destroyed and returns no material.","Si al desmontar una pieza otra quedar\xEDa sobrecargada (no sin apoyo, sino con demasiado peso), el desmontaje se bloquea y se marca la pieza que fallar\xEDa.":"If dismantling a piece would overload another (not leave it unsupported, but carrying too much weight), the dismantling is blocked and the piece that would fail is marked.","Los muros que quedan debajo de un tejado se cierran solos hasta tocarlo, con su mismo material: ya no hace falta poner hastiales a mano (la pieza se ha quitado del men\xFA).":"Walls under a roof close up to it on their own, in the same material: gables no longer need to be placed by hand (the piece has been removed from the menu).","Cada tramo de tejado sube 1,2 m en sus 2 m. Tramos seguidos en la misma direcci\xF3n forman una sola pendiente continua; dos tramos enfrentados forman la cumbrera.":"Each roof section rises 1.2 m over its 2 m. Consecutive sections in the same direction form one continuous slope; two facing sections form the ridge.","Las piezas que no aguantan peso (cercas, empalizadas, medio muro) nunca cuentan como apoyo de otras. Un tramo de tejado solo puede sostener el tramo de tejado de al lado.":"Pieces that bear no weight (fences, palisades, half walls) never count as support for others. A roof section can only hold up the roof section next to it.","v4 (valravnx: \xABla madera es demasiado d\xE9bil\xBB): la madera aguanta bastante m\xE1s. Una casa de troncos de 2 plantas con tejado se hace sin trucos y sin pasar del 75% en ninguna pieza; 3 plantas piden cimiento de piedra; el zarzo no da para dos plantas.":"v4 (valravnx: \u201Cwood is too weak\u201D): wood now holds quite a lot more. A two-storey log house with a roof can be built without tricks and without any piece going over 75%; three storeys need a stone foundation; wattle can't carry two storeys.","v4: vano de una casilla. Un suelo en alto o un tramo de tejado sin muros debajo se apoya en el suelo o el tramo de al lado que s\xED los tenga. As\xED una casa de hasta 4\xD74 casillas no necesita vigas por dentro; de 5\xD75 en adelante, el centro s\xED.":"v4: one-cell span. A raised floor or roof section with no walls below rests on the neighbouring floor or section that does have them. So a house of up to 4\xD74 cells needs no beams inside; from 5\xD75 upwards, the centre does.","v4: lo que aguanta cada pieza (kg): cimiento de piedra 6000, de troncos 2000; muro de troncos 1200 (con puerta 850, con ventana 1000), entramado 1400, tablas 900 (con puerta 600), zarzo 250; poste 2000, viga 1000; suelo de troncos 900, de tablas 1000. Todo provisional, para que lo ajustes.":"v4: what each piece holds (kg): stone foundation 6000, log 2000; log wall 1200 (with doorway 850, with window 1000), timber frame 1400, planks 900 (with doorway 600), wattle 250; post 2000, beam 1000; log floor 900, plank floor 1000. All provisional, for you to adjust.","La decoraci\xF3n no suma peso a la estructura.":"Furnishings add no weight to the structure.","Escalera de mano: se usa con el bot\xF3n Usar para subir o bajar de planta si hay suelo arriba.":"Ladder: use it with the Use button to go up or down a floor if there's a floor above.","Los muros de troncos van en 10 hiladas de 25 cm: todos acaban a 2,5 m y sus troncos coinciden en altura. La puerta mide 2 m (8 hiladas) y la ventana va de 1 a 1,75 m.":"Log walls are laid in 10 courses of 25 cm: they all end at 2.5 m and their logs line up in height. The doorway is 2 m tall (8 courses) and the window runs from 1 to 1.75 m.","Las ventanas no tienen contraventana todav\xEDa.":"Windows don't have shutters yet.","La partida se guarda sola en el navegador (con bot\xF3n para reiniciar).":"The game saves itself in the browser (with a button to restart).","v2, por qu\xE9: en la v1 hab\xEDa que arrastrar el rat\xF3n para elegir el golpe y elegir tambi\xE9n la l\xEDnea de la parada, y la c\xE1mara y el movimiento iban a su aire. Se ha rehecho tomando lo que mejor funciona en los juegos de esgrima de referencia: rosa de golpes, parada perfecta, golpe maestro, contraataque, finta, parada sin direcci\xF3n en dificultad baja y peso f\xEDsico de los golpes.":"v2, why: in v1 you had to drag the mouse to choose the blow and also choose the parry line, and the camera and movement did their own thing. It has been redone taking what works best in reference fencing games: a rose of strikes, perfect parry, master strike, counterattack, feint, directionless parry at low difficulty and physical weight to the blows.","Atacar: sobre el rival aparece una rosa de cinco zonas (alto, izquierda, derecha, bajo y estocada en el centro). Apuntas con el cursor o tocas la zona y golpeas. Izquierda y derecha son las de tu pantalla.":"Attack: a rose of five zones appears over the opponent (high, left, right, low and thrust in the centre). You aim with the cursor or tap the zone and strike. Left and right are those of your screen.","Defensa en tres capas. Parada: mantener Parar detiene cualquier golpe sin elegir lado, pero cuesta aliento. Parada perfecta: empezar a parar en los \xFAltimos 0,25 s antes del impacto descoloca al rival 0,7 s y abre 0,8 s de contraataque.":"Defence in three layers. Parry: holding Parry stops any blow without choosing a side, but costs stamina. Perfect parry: starting to parry in the last 0.25 s before impact throws the opponent off balance for 0.7 s and opens 0.8 s for a counterattack.","El contraataque se prepara un 40% m\xE1s r\xE1pido y solo se para con otra parada perfecta.":"The counterattack winds up 40% faster and can only be stopped by another perfect parry.","Golpe maestro: si golpeas por el mismo lado por el que te viene el golpe durante la primera mitad de su preparaci\xF3n, desv\xEDas el suyo y el tuyo sale casi de inmediato (tambi\xE9n imparable salvo parada perfecta).":"Master strike: if you strike from the same side the blow is coming from during the first half of its wind-up, you deflect his and yours comes out almost at once (also unstoppable except by a perfect parry).","Finta: mientras preparas, elegir otra zona cambia el golpe, hasta el 60% de la preparaci\xF3n. Cuesta aliento. Sirve contra quien para demasiado pronto.":"Feint: while winding up, choosing another zone changes the blow, up to 60% of the wind-up. It costs stamina. It works against someone who parries too early.","Aliento: atacar, parar, fintar, mantener la parada y fallar golpes cansan. Por encima del 70% los golpes salen m\xE1s lentos; al 95% tu parada cede.":"Stamina: attacking, parrying, feinting, holding the parry and missing blows tire you. Above 70% blows come out slower; at 95% your parry gives way.","Dificultad = ritmo + ayudas. Aprendiz: golpes un 60% m\xE1s lentos y la rosa te ense\xF1a el lado del golpe que viene (rojo), cu\xE1ndo parar (verde) y cu\xE1ndo cabe el golpe maestro (borde dorado). Normal: un 25% m\xE1s lentos, solo ves el lado. Realista: velocidad real y sin avisos.":"Difficulty = pace + aids. Apprentice: blows 60% slower and the rose shows you the side of the incoming blow (red), when to parry (green) and when a master strike fits (golden edge). Normal: 25% slower, you only see the side. Realistic: real speed and no cues.","Movimiento encarado: cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean sin dejar de mirarle.":"Facing movement: near the opponent, forward and back close in or pull away, and the sides circle around him without looking away.","C\xE1mara con margen: solo se recoloca si el rival se sale bastante del encuadre, y te respeta 3 s despu\xE9s de que la gires t\xFA.":"Camera with slack: it only repositions if the opponent goes well out of frame, and leaves you alone for 3 s after you turn it yourself.","Peso de los golpes: pausa de 50 a 100 ms en cada choque, chispas al chocar aceros, sangre al herir, retroceso del golpeado, una sacudida leve de la c\xE1mara, estela de la hoja y sonidos sintetizados (se pueden quitar en Opciones).":"Weight of blows: a 50 to 100 ms pause on each clash, sparks when steel meets steel, blood on wounding, recoil of the one hit, a slight camera shake, a blade trail and synthesised sounds (they can be turned off in Options).","Las guardias de la v1 siguen en el c\xF3digo como modo avanzado pero no est\xE1n en el men\xFA: liaban m\xE1s de lo que aportaban en un primer contacto.":"The guards from v1 remain in the code as an advanced mode but are not in the menu: on first contact they confused more than they added.","Espada larga: tajo 1,9 m de alcance y 0,42 s de preparaci\xF3n a ritmo real; estocada 2,15 m y 0,32 s. Palo: 1,5 m, m\xE1s lento y contundente.":"Longsword: cut with 1.9 m reach and 0.42 s wind-up at real pace; thrust 2.15 m and 0.32 s. Staff: 1.5 m, slower and blunt.","Heridas por zona y gravedad (leve, grave, muy grave) sin barras de vida. Muy grave en la cabeza deja fuera de combate. El torso sangra mucho. Brazo de la espada herido: golpes m\xE1s lentos y flojos. Pierna herida: m\xE1s despacio y cojeando. Los cortes leves dejan de sangrar solos; los contundentes sangran poco pero aturden.":"Wounds by zone and severity (light, serious, critical) with no health bars. Critical to the head takes you out of the fight. The torso bleeds heavily. Wounded sword arm: slower, weaker blows. Wounded leg: slower and limping. Light cuts stop bleeding on their own; blunt blows bleed little but stun.","Armaduras: el gambes\xF3n reduce el tajo a la mitad; la malla casi lo anula, pero para peor la estocada y el golpe contundente.":"Armour: the gambeson halves a cut; mail almost cancels it, but stops thrusts and blunt blows less well.","v3, arreglo provisional del arco (pedido por valravnx tras probarlo): si sueltas por debajo de la mitad de tensi\xF3n el tiro se cancela sin disparar; echar a correr afloja el arco y no se puede empezar a tensar corriendo; despu\xE9s de cada disparo hay 0,8 s para sacar y encajar la siguiente flecha (0,5 s para coger otra piedra). Antes se pod\xEDa correr y disparar sin parar.":"v3, provisional bow fix (requested by valravnx after trying it): releasing below half draw cancels the shot without firing; breaking into a run eases the bow and you can't start drawing while running; after each shot there are 0.8 s to draw and nock the next arrow (0.5 s to pick up another stone). Before, you could run and shoot non-stop.","v4, escudo PROVISIONAL (pedido por valravnx; lo revisar\xE1 \xE9l): nueva arma \xABEspada y escudo\xBB. Espada de una mano: 1,7 m de alcance (la larga 1,9), estocada 1,9 m, se prepara algo m\xE1s r\xE1pido (0,38 s) y hiere algo menos. Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante.":"v4, PROVISIONAL shield (requested by valravnx; he will review it): new weapon \u201CSword and shield\u201D. One-handed sword: 1.7 m reach (longsword 1.9), thrust 1.9 m, winds up a little faster (0.38 s) and wounds a little less. Round plank shield with a leather rim and a boss, on the left arm; when parrying it rises in front.","v4: con escudo, Parar tambi\xE9n detiene flechas y piedras que vengan de frente (70\xB0 a cada lado de donde miras); por la espalda o de lado no. Parar con escudo cuesta un 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"v4: with a shield, Parry also stops arrows and stones coming from the front (70\xB0 to each side of where you face); from behind or the side it doesn't. Parrying with a shield costs 60% of the stamina it costs with the sword. The perfect parry and master strike work the same.","v4: nueva opci\xF3n \xABArma del rival\xBB (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"v4: new option \u201COpponent's weapon\u201D (same as yours, longsword, sword and shield or staff). An opponent with a shield raises it when you aim at him with a bow or sling and keeps it up while you reload.","Arco: tensar del todo tarda 1 s. El c\xEDrculo de punter\xEDa se cierra al tensar y se pone verde cuando est\xE1 a plena tensi\xF3n; si sueltas antes, la flecha se queda corta. A partir de 2,5 s tenso, el pulso tiembla y el c\xEDrculo se abre en rojo. Las flechas no se paran con la espada; con escudo, s\xED (v4).":"Bow: a full draw takes 1 s. The aiming circle closes as you draw and turns green at full draw; if you release earlier, the arrow falls short. After 2.5 s at full draw your hand shakes and the circle opens in red. Arrows can't be parried with the sword; with a shield, they can (v4).","El rival de la m\xE1quina tarda en reaccionar y seg\xFAn la dificultad lee mejor tus golpes, intenta paradas perfectas, golpes maestros y fintas. Se queda quieto mientras golpea y a veces retrocede despu\xE9s. Tu cinta es azul y la suya amarilla.":"The computer opponent takes time to react and, depending on difficulty, reads your blows better and tries perfect parries, master strikes and feints. He stands still while striking and sometimes steps back afterwards. Your band is blue and his is yellow.","Textos de la interfaz en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"Interface texts in Spanish and English (button at the top right); Russian is prepared and will come later.","Hito 1 \xB7 v5":"Milestone 1 \xB7 v5","Combate \xB7 v5":"Combat \xB7 v5","v5: textos en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"v5: texts in Spanish and English (button at the top right); Russian is prepared and will come later.","Quedan para m\xE1s adelante: adarve, chimenea y puentes (los puentes necesitan agua en el mapa).":"Left for later: wall walk, chimney and bridges (bridges need water on the map).","Hito 1 \xB7 v6":"Milestone 1 \xB7 v6","Escalera de tablas":"Plank stairs","La escalera de tablas sube a la planta de arriba: en la \xFAltima no cabe.":"Plank stairs go up to the floor above: they don't fit on the top floor.","Encima de la escalera tiene que quedar el hueco abierto: quita ese suelo.":"The opening above the stairs must stay open: remove that floor.","Ah\xED est\xE1 el hueco de una escalera.":"That's the opening of a staircase.","v6: escalera de tablas (6 tablas y 6 clavos, 100 kg). Ocupa una casilla y se sube andando, sin bot\xF3n: se entra por el lado bajo y se sale arriba a la casilla de al lado (gira con R hacia d\xF3nde sube). Encima tiene que quedar el hueco abierto, as\xED que no deja poner suelo ah\xED. Necesita cimiento o suelo debajo, o la tierra en la planta baja.":"v6: plank stairs (6 planks and 6 nails, 100 kg). They take one tile and you climb them by walking, no button: you step in on the low side and come out at the top onto the next tile (rotate with R to choose which way they rise). The opening above must stay open, so no floor can go there. They need a foundation or floor below, or bare ground on the ground floor.","v6: por el hueco de la escalera se puede caer a ella desde arriba; las barandillas para cerrarlo llegan en la tarea siguiente. Por debajo del tramo alto se puede pasar sin subir.":"v6: you can drop down onto the stairs through their opening from above; railings to close it come in the next task. You can walk under the high end without climbing.","v7: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). La escena no cambia.":"v7: also in English, with the ES/EN button at the top as in building and combat (it remembers the chosen language, including the website's). The scene is unchanged.","v10: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). El personaje no cambia.":"v10: also in English, with the ES/EN button at the top as in building and combat (it remembers the chosen language, including the website's). The character is unchanged.","Prueba de estilo \xB7 v7 (realismo en miniatura, con el personaje por c\xF3digo; tambi\xE9n en ingl\xE9s)":"Style test \xB7 v7 (miniature realism, with the code-made character; also in English)","Personaje \xB7 v10 (taller propio con MakeHuman, ropa por capas y armadura; tambi\xE9n en ingl\xE9s)":"Character \xB7 v10 (our own workshop with MakeHuman, layered clothing and armour; also in English)","v6, el personaje: hecho todo por c\xF3digo, como decidiste. Es una sola malla continua (sin piezas sueltas ni juntas): el cuerpo se describe como una suma suave de formas (cr\xE1neo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas, pies) y se convierte en malla, con m\xE1s detalle en la cara y las manos.":"v6, the character: made entirely in code, as you decided. It is a single continuous mesh (no loose pieces or seams): the body is described as a smooth sum of shapes (skull, face, nose, brows, ears, torso, arms, hands with thumbs, legs, feet) and turned into a mesh, with more detail in the face and hands.","Lleva esqueleto de 17 huesos y dos animaciones hechas por c\xF3digo: quieto (respira y se balancea un poco) y andar (bot\xF3n \xABQuieto/Andando\xBB: va y viene por el camino). Las vistas \xABPersonaje\xBB y \xABCara\xBB le siguen.":"It has a 17-bone skeleton and two code-made animations: idle (breathes and sways a little) and walk (\xABIdle/Walking\xBB button: goes back and forth along the path). The \xABCharacter\xBB and \xABFace\xBB views follow him.","Proporciones cre\xEDbles algo estilizadas: 1,72 m, cabeza un poco grande (1/7 de la altura) para que se lea en miniatura. Hombre adulto con barba corta.":"Believable, slightly stylised proportions: 1.72 m, head a little large (1/7 of the height) so it reads in miniature. Adult man with a short beard.","Ropa base pintada en la misma malla, provisional: camisa de lino, cintur\xF3n de cuero (con relieve), calzas de lana y zapatos. La ropa y la armadura por capas, que se ven puestas, son una tarea aparte.":"Base clothing painted on the same mesh, provisional: linen shirt, leather belt (with relief), woollen hose and shoes. Layered clothing and armour, visibly worn, are a separate task.","Colores apagados, oclusi\xF3n ambiental horneada (pliegues, axilas y entre las piernas m\xE1s oscuros) y ojos con un peque\xF1o brillo.":"Muted colours, baked ambient occlusion (folds, armpits and between the legs darker) and eyes with a small highlight.","Pendiente de mejorar, a la vista en las capturas de cerca: el pelo es un casquete liso, la cara a\xFAn es tosca de cerca y los bordes de color (cuello de la camisa, barba) son algo borrosos.":"Still to improve, visible in the close-up screenshots: the hair is a smooth cap, the face is still rough up close and the colour edges (shirt collar, beard) are somewhat blurry.","Presupuesto: el personaje son unos 10 mil tri\xE1ngulos (unos 20 mil con su sombra). El l\xEDmite de la escena sube de 50 mil a 72 mil. No comprobado en un m\xF3vil de verdad.":"Budget: the character is about 10 thousand triangles (about 20 thousand with its shadow). The scene limit goes up from 50 thousand to 72 thousand. Not checked on a real phone.","v5: copas de los \xE1rboles en racimos suaves y pinos con puntas. v4: texturas por c\xF3digo y mundo sin recortar. Se mantienen.":"v5: tree crowns in soft clusters and pointed pines. v4: code-made textures and an uncropped world. Both are kept.","Puedes girar la c\xE1mara arrastrando (un dedo en el m\xF3vil) y acercarte con la rueda o pellizcando.":"You can rotate the camera by dragging (one finger on a phone) and zoom with the wheel or by pinching.","v2, por qu\xE9: el personaje esculpido por c\xF3digo de la v1 daba grima. valravnx: nada de inventos, usar bases ya hechas. Se usan los paquetes libres (CC0, se pueden usar y vender sin pagar ni citar) de Quaternius: Universal Base Characters, Modular Character Outfits \u2013 Fantasy y Universal Animation Library. Licencias junto a los modelos, en recursos/personajes/v1/ de la web.":"v2, why: the code-sculpted character of v1 was creepy. valravnx: no inventions, use ready-made bases. The free packs (CC0: they can be used and sold without paying or crediting) by Quaternius are used: Universal Base Characters, Modular Character Outfits \u2013 Fantasy and Universal Animation Library. Licences next to the models, in recursos/personajes/v1/ on the website.","C\xF3mo se monta: de la base se usa solo la cabeza y el cuello (el resto lo tapa la ropa, como indica el propio paquete), m\xE1s la ropa, el pelo y la barba. Todo comparte el mismo esqueleto de 65 huesos, as\xED que la ropa y las armaduras que vengan despu\xE9s se ponen y se quitan como capas.":"How it is assembled: only the head and neck of the base are used (the clothing covers the rest, as the pack itself suggests), plus the clothing, hair and beard. Everything shares the same 65-bone skeleton, so clothing and armour added later are put on and taken off as layers.","Personalizaci\xF3n de prueba: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo, tono de piel y barba. El color de piel y de pelo se ti\xF1e sobre las texturas del paquete.":"Test customisation: man or woman, peasant or explorer clothing, hairstyle, hair colour, skin tone and beard. Skin and hair colour are tinted over the pack's textures.","Animaciones del paquete (no hechas a mano): quieto, andar, talar, en guardia, golpe de espada y andar cargando, entre otras 26.":"Animations from the pack (not hand-made): idle, walk, chop, on guard, sword strike and walk carrying, among 26 others.","Texturas reducidas para el navegador: 1024 px el color y 512 el relieve. Un personaje pesa unos 4 MB la primera vez (pelo, cabeza, ropa) m\xE1s 4,4 MB de animaciones compartidas por todos.":"Textures reduced for the browser: 1024 px for colour and 512 for relief. A character weighs about 4 MB the first time (hair, head, clothing) plus 4.4 MB of animations shared by all.","v3: en el m\xF3vil iba a 10 fps. Cambios: en pantallas t\xE1ctiles empieza en calidad \xABligera\xBB (material sencillo con el color, sin relieve ni brillo), resoluci\xF3n de partida 1\xD7 y puede bajar hasta 0,5\xD7; la ropa, el pelo y la barba comparten un solo esqueleto (antes cada malla calculaba el suyo).":"v3: it ran at 10 fps on the phone. Changes: on touch screens it starts in \xABlight\xBB quality (simple material with colour, no relief or shine), starting resolution 1\xD7 and it can drop to 0.5\xD7; clothing, hair and beard share a single skeleton (before, each mesh computed its own).","v3: interruptores de prueba de rendimiento (calidad, sombras, caba\xF1a y suelo) para ver en tu m\xF3vil qu\xE9 es lo que pesa, mirando los fps de arriba.":"v3: performance test switches (quality, shadows, hut and ground) to see on your phone what is heavy, watching the fps at the top.","v3: el traje de explorador ya no se ofrece: es demasiado de fantas\xEDa. Se buscan ropas de recreaci\xF3n hist\xF3rica.":"v3: the explorer outfit is no longer offered: it is too fantasy. Historical reenactment clothing is being sought.","v4: correcci\xF3n. \xABMe va de 10\xBB era que va perfecto, no 10 fps: vuelve la calidad alta por defecto tambi\xE9n en el m\xF3vil, con la resoluci\xF3n de antes. La calidad ligera y los interruptores siguen como opci\xF3n.":"v4: correction. \xABIt runs a 10\xBB meant it runs perfectly, not 10 fps: high quality is the default again on phones too, with the previous resolution. Light quality and the switches remain as options.","v5: nueva opci\xF3n \xABBase del personaje\xBB: adem\xE1s del paquete de Quaternius, el taller propio. El cuerpo es de MakeHuman (libre, CC0) y la ropa, el pelo, la barba, la cofia, la piel y los ojos est\xE1n hechos por c\xF3digo en el proyecto, sin paquetes de fuera. As\xED se puede hacer la ropa que queramos.":"v5: new \xABCharacter base\xBB option: besides the Quaternius pack, our own workshop. The body comes from MakeHuman (free, CC0) and the clothing, hair, beard, coif, skin and eyes are made in code in the project, without outside packs. That way we can make whatever clothing we want.","v5: el taller propio usa las mismas animaciones de Quaternius, pasadas a su esqueleto: el reposo de MakeHuman (brazos en \xABA\xBB) se lleva a la postura del origen y en cada fotograma se copia el giro de cada hueso respecto a su reposo. La pelvis copia adem\xE1s los botes y agachadas, escalados por la altura.":"v5: our own workshop uses the same Quaternius animations, retargeted to its skeleton: the MakeHuman rest pose (arms in an \xABA\xBB) is brought to the source pose, and on every frame each bone's rotation relative to its rest is copied. The pelvis also copies bounces and crouches, scaled by height.","v5, provisional: en el taller propio solo hay un hombre (t\xFAnica, calzas, barba pintada) y una mujer (vestido y cofia con toca); el pelo, la piel y la ropa a\xFAn no se pueden cambiar. valravnx: \xABdecente para usar de placeholder\xBB. Queda una claridad en la barbilla del hombre.":"v5, provisional: our own workshop only has a man (tunic, hose, painted beard) and a woman (dress and coif with veil); hair, skin and clothing cannot be changed yet. valravnx: \xABdecent to use as a placeholder\xBB. A light patch remains on the man's chin.","v6, arreglo: en calidad alta la ropa, el pelo y la cofia del taller propio se ve\xEDan del rev\xE9s (valravnx). El cargador de modelos deja sin escribir la profundidad en los materiales con transparencia, y la piel se pintaba encima. Ahora la escriben, y una prueba nueva lo vigila.":"v6, fix: in high quality the clothing, hair and coif from our own workshop looked inside out (valravnx). The model loader leaves depth unwritten on materials with transparency, and the skin was drawn on top. Now they write it, and a new test watches for it.","v7, taller propio (valravnx: \xABel hombre tiene tetas, el cuerpo doblado hacia delante, los hombros muy para atr\xE1s\xBB): las animaciones del paquete van con el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atr\xE1s, a juego con sus mu\xF1ecos de cabeza grande. Ahora se mide esa inclinaci\xF3n en la animaci\xF3n de estar quieto y se quita (deja un 30 %), los hombros ya no se igualan al paquete y los brazos se giran para colgar rectos. La t\xFAnica del hombre se alisa en el pecho para que caiga como tela y no marque.":"v7, our own workshop (valravnx: \xABthe man has breasts, the body bent forward, the shoulders too far back\xBB): the pack's animations have the torso and neck leaning forward and the arms hanging backwards, to suit its big-headed figures. Now that lean is measured in the idle animation and removed (30 % is kept), the shoulders are no longer matched to the pack and the arms are rotated to hang straight. The man's tunic is smoothed over the chest so it falls like cloth and does not cling.","v8: valravnx elige el taller propio como base de los personajes. Primera tanda de ropa por capas, hecha por c\xF3digo: debajo siempre la camisa de lino (en la mujer, larga hasta los tobillos), las calzas y los zapatos; encima, t\xFAnica (hombre) o vestido (mujer), y sobre todo el gambes\xF3n acolchado, con sus canales cosidos pintados. Cada capa va algo m\xE1s separada de la piel que la de debajo.":"v8: valravnx chooses our own workshop as the base for characters. First batch of layered clothing, made in code: underneath always the linen shirt (ankle-length on the woman), the hose and the shoes; over them, a tunic (man) or dress (woman), and over everything the padded gambeson, with its stitched channels painted. Each layer sits a little further from the skin than the one below.","v8, c\xF3mo se ven las capas: lo que queda tapado del todo no se dibuja (el cuerpo de una prenda se esconde si lleva otra encima, y su falda solo asoma si es m\xE1s larga), as\xED no se atraviesan al moverse y se ahorran tri\xE1ngulos. El cintur\xF3n va sobre la capa de m\xE1s fuera.":"v8, how layers are shown: whatever is fully covered is not drawn (a garment's body is hidden if another one is on top, and its skirt only shows if it is longer), so they don't poke through when moving and triangles are saved. The belt goes over the outermost layer.","v9: cota de malla (hasta la rodilla, mangas hasta medio antebrazo; anillas pintadas por c\xF3digo, metal a medias porque sin reflejos del entorno el metal puro sale negro) y sobreveste sin mangas de lana te\xF1ida, por encima de todo. Cada prenda va partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota.":"v9: mail hauberk (knee-length, sleeves to mid-forearm; rings painted in code, half-metallic because without environment reflections pure metal looks black) and a sleeveless surcoat of dyed wool, over everything. Each garment is split into body, sleeves and skirt: the surcoat lets the hauberk's sleeves and collar show.","Pendiente de decidir contigo: si el estilo de estas bases te vale como punto de partida para todo el juego (incluido el combate), y qu\xE9 ropa medieval falta (gambes\xF3n, cota de malla, capas).":"To decide with you: whether the style of these bases works as a starting point for the whole game (combat included), and what medieval clothing is missing (gambeson, mail hauberk, cloaks).","Paquete Quaternius":"Quaternius pack","Taller propio (MakeHuman)":"Own workshop (MakeHuman)",T\u00FAnica:"Tunic",Vestido:"Dress",Sobreveste:"Surcoat",Quieto:"Idle",Andar:"Walk",Talar:"Chop","En guardia":"On guard",Golpe:"Strike",Cargar:"Carry",Hombre:"Man",Mujer:"Woman",Campesino:"Peasant",Explorador:"Explorer","Raya al lado":"Side parting",Rapado:"Shaved",Largo:"Long",Mo\u00F1o:"Bun",Negro:"Black",Casta\u00F1o:"Brown","Casta\xF1o claro":"Light brown",Rubio:"Blond",Pelirrojo:"Red",Canoso:"Grey",Clara:"Light",Media:"Medium",Morena:"Tan",Oscura:"Dark","Con barba":"Bearded","Sin barba":"Clean-shaven",Andando:"Walking","{f} fps \xB7 resoluci\xF3n {r}\xD7 \xB7 {t} mil tri\xE1ngulos \xB7 {d} dibujados":"{f} fps \xB7 resolution {r}\xD7 \xB7 {t}k triangles \xB7 {d} draw calls","{f} fps \xB7 resoluci\xF3n {r}\xD7 \xB7 personaje {p} mil tri\xE1ngulos \xB7 escena {t} mil \xB7 {d} dibujados":"{f} fps \xB7 resolution {r}\xD7 \xB7 character {p}k triangles \xB7 scene {t}k \xB7 {d} draw calls","Ropa por capas (debajo siempre camisa, calzas y zapatos)":"Layered clothing (always a shirt, hose and shoes underneath)","Ropa por capas (debajo siempre camisa y zapatos)":"Layered clothing (always a shirt and shoes underneath)","Taller propio: pelo, piel y cara a\xFAn no se cambian.":"Own workshop: hair, skin and face can't be changed yet.","Prueba de rendimiento (mira los fps arriba)":"Performance test (watch the fps at the top)",Sombras:"Shadows","Caba\xF1a y suelo":"Hut and ground",Animaci\u00F3n:"Animation","No se pudo cargar el personaje: {e}":"Could not load the character: {e}","Base del personaje":"Character base",Cuerpo:"Body",Ropa:"Clothing",Pelo:"Hair","Color del pelo":"Hair colour",Piel:"Skin",Barba:"Beard",Calidad:"Quality",Alta:"High","Ligera (m\x
