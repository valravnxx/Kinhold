\u043E\u0435\u0439 \u0436\u0438\u0437\u043D\u044C\u044E. \u0411\u043E\u0439 \u043F\u0435\u0440\u0435\u0434\u0435\u043B\u0430\u043D \u0441 \u043E\u043F\u043E\u0440\u043E\u0439 \u043D\u0430 \u0442\u043E, \u0447\u0442\u043E \u043B\u0443\u0447\u0448\u0435 \u0432\u0441\u0435\u0433\u043E \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0442 \u0432 \u044D\u0442\u0430\u043B\u043E\u043D\u043D\u044B\u0445 \u0444\u0435\u0445\u0442\u043E\u0432\u0430\u043B\u044C\u043D\u044B\u0445 \u0438\u0433\u0440\u0430\u0445: \u0440\u043E\u0437\u0430 \u0443\u0434\u0430\u0440\u043E\u0432, \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435, \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440, \u043A\u043E\u043D\u0442\u0440\u0430\u0442\u0430\u043A\u0430, \u0444\u0438\u043D\u0442, \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0431\u0435\u0437 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F \u043D\u0430 \u043D\u0438\u0437\u043A\u043E\u0439 \u0441\u043B\u043E\u0436\u043D\u043E\u0441\u0442\u0438 \u0438 \u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0432\u0435\u0441 \u0443\u0434\u0430\u0440\u043E\u0432.","Atacar: sobre el rival aparece una rosa de cinco zonas (alto, izquierda, derecha, bajo y estocada en el centro). Apuntas con el cursor o tocas la zona y golpeas. Izquierda y derecha son las de tu pantalla.":"\u0410\u0442\u0430\u043A\u0430: \u043D\u0430\u0434 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u043E\u043C \u043F\u043E\u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0440\u043E\u0437\u0430 \u0438\u0437 \u043F\u044F\u0442\u0438 \u0437\u043E\u043D (\u0432\u0435\u0440\u0445, \u0441\u043B\u0435\u0432\u0430, \u0441\u043F\u0440\u0430\u0432\u0430, \u043D\u0438\u0437 \u0438 \u0443\u043A\u043E\u043B \u0432 \u0446\u0435\u043D\u0442\u0440\u0435). \u0412\u044B \u043D\u0430\u0432\u043E\u0434\u0438\u0442\u0435 \u043A\u0443\u0440\u0441\u043E\u0440 \u0438\u043B\u0438 \u043A\u0430\u0441\u0430\u0435\u0442\u0435\u0441\u044C \u0437\u043E\u043D\u044B \u0438 \u0431\u044C\u0451\u0442\u0435. \u041B\u0435\u0432\u043E \u0438 \u043F\u0440\u0430\u0432\u043E \u2014 \u043F\u043E \u0432\u0430\u0448\u0435\u043C\u0443 \u044D\u043A\u0440\u0430\u043D\u0443.","Defensa en tres capas. Parada: mantener Parar detiene cualquier golpe sin elegir lado, pero cuesta aliento. Parada perfecta: empezar a parar en los \xFAltimos 0,25 s antes del impacto descoloca al rival 0,7 s y abre 0,8 s de contraataque.":"\u0417\u0430\u0449\u0438\u0442\u0430 \u0432 \u0442\u0440\u0438 \u0443\u0440\u043E\u0432\u043D\u044F. \u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435: \u0443\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u0435 \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u043B\u044E\u0431\u043E\u0439 \u0443\u0434\u0430\u0440 \u0431\u0435\u0437 \u0432\u044B\u0431\u043E\u0440\u0430 \u0441\u0442\u043E\u0440\u043E\u043D\u044B, \u043D\u043E \u0442\u0440\u0430\u0442\u0438\u0442 \u0434\u044B\u0445\u0430\u043D\u0438\u0435. \u0418\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435: \u0435\u0441\u043B\u0438 \u043D\u0430\u0447\u0430\u0442\u044C \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C \u0432 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 0,25 \u0441 \u0434\u043E \u0443\u0434\u0430\u0440\u0430, \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u0442\u0435\u0440\u044F\u0435\u0442 \u0440\u0430\u0432\u043D\u043E\u0432\u0435\u0441\u0438\u0435 \u043D\u0430 0,7 \u0441 \u0438 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043E\u043A\u043D\u043E \u0434\u043B\u044F \u043A\u043E\u043D\u0442\u0440\u0430\u0442\u0430\u043A\u0438 \u0432 0,8 \u0441.","El contraataque se prepara un 40% m\xE1s r\xE1pido y solo se para con otra parada perfecta.":"\u041A\u043E\u043D\u0442\u0440\u0430\u0442\u0430\u043A\u0430 \u0433\u043E\u0442\u043E\u0432\u0438\u0442\u0441\u044F \u043D\u0430 40% \u0431\u044B\u0441\u0442\u0440\u0435\u0435, \u0438 \u0435\u0451 \u043E\u0442\u0440\u0430\u0436\u0430\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0440\u0443\u0433\u043E\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435.","Golpe maestro: si golpeas por el mismo lado por el que te viene el golpe durante la primera mitad de su preparaci\xF3n, desv\xEDas el suyo y el tuyo sale casi de inmediato (tambi\xE9n imparable salvo parada perfecta).":"\u041C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440: \u0435\u0441\u043B\u0438 \u0443\u0434\u0430\u0440\u0438\u0442\u044C \u0441 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0442\u043E\u0440\u043E\u043D\u044B, \u043E\u0442\u043A\u0443\u0434\u0430 \u0438\u0434\u0451\u0442 \u0443\u0434\u0430\u0440, \u0432 \u043F\u0435\u0440\u0432\u043E\u0439 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0435 \u0435\u0433\u043E \u0437\u0430\u043C\u0430\u0445\u0430, \u0432\u044B \u043E\u0442\u0432\u043E\u0434\u0438\u0442\u0435 \u0435\u0433\u043E \u0443\u0434\u0430\u0440, \u0430 \u0432\u0430\u0448 \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u043F\u043E\u0447\u0442\u0438 \u0441\u0440\u0430\u0437\u0443 (\u0435\u0433\u043E \u0442\u043E\u0436\u0435 \u043D\u0435 \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u043D\u0438\u0447\u0435\u043C, \u043A\u0440\u043E\u043C\u0435 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F).","Finta: mientras preparas, elegir otra zona cambia el golpe, hasta el 60% de la preparaci\xF3n. Cuesta aliento. Sirve contra quien para demasiado pronto.":"\u0424\u0438\u043D\u0442: \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0437\u0430\u043C\u0430\u0445\u0430 \u0432\u044B\u0431\u043E\u0440 \u0434\u0440\u0443\u0433\u043E\u0439 \u0437\u043E\u043D\u044B \u043C\u0435\u043D\u044F\u0435\u0442 \u0443\u0434\u0430\u0440 \u2014 \u0434\u043E 60% \u0437\u0430\u043C\u0430\u0445\u0430. \u0422\u0440\u0430\u0442\u0438\u0442 \u0434\u044B\u0445\u0430\u043D\u0438\u0435. \u041F\u043E\u043C\u043E\u0433\u0430\u0435\u0442 \u043F\u0440\u043E\u0442\u0438\u0432 \u0442\u043E\u0433\u043E, \u043A\u0442\u043E \u043F\u0430\u0440\u0438\u0440\u0443\u0435\u0442 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0440\u0430\u043D\u043E.","Aliento: atacar, parar, fintar, mantener la parada y fallar golpes cansan. Por encima del 70% los golpes salen m\xE1s lentos; al 95% tu parada cede.":"\u0414\u044B\u0445\u0430\u043D\u0438\u0435: \u0430\u0442\u0430\u043A\u0430, \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435, \u0444\u0438\u043D\u0442\u044B, \u0443\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u0435 \u0437\u0430\u0449\u0438\u0442\u044B \u0438 \u043F\u0440\u043E\u043C\u0430\u0445\u0438 \u0443\u0442\u043E\u043C\u043B\u044F\u044E\u0442. \u0412\u044B\u0448\u0435 70% \u0443\u0434\u0430\u0440\u044B \u0432\u044B\u0445\u043E\u0434\u044F\u0442 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435; \u043F\u0440\u0438 95% \u0432\u0430\u0448\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043D\u0435 \u0434\u0435\u0440\u0436\u0438\u0442.","Dificultad = ritmo + ayudas. Aprendiz: golpes un 60% m\xE1s lentos y la rosa te ense\xF1a el lado del golpe que viene (rojo), cu\xE1ndo parar (verde) y cu\xE1ndo cabe el golpe maestro (borde dorado). Normal: un 25% m\xE1s lentos, solo ves el lado. Realista: velocidad real y sin avisos.":"\u0421\u043B\u043E\u0436\u043D\u043E\u0441\u0442\u044C = \u0442\u0435\u043C\u043F + \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0438. \xAB\u0423\u0447\u0435\u043D\u0438\u043A\xBB: \u0443\u0434\u0430\u0440\u044B \u043D\u0430 60% \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435, \u0430 \u0440\u043E\u0437\u0430 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u0435\u0442 \u0441\u0442\u043E\u0440\u043E\u043D\u0443 \u043B\u0435\u0442\u044F\u0449\u0435\u0433\u043E \u0443\u0434\u0430\u0440\u0430 (\u043A\u0440\u0430\u0441\u043D\u044B\u043C), \u043A\u043E\u0433\u0434\u0430 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C (\u0437\u0435\u043B\u0451\u043D\u044B\u043C) \u0438 \u043A\u043E\u0433\u0434\u0430 \u0432\u043E\u0437\u043C\u043E\u0436\u0435\u043D \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440 (\u0437\u043E\u043B\u043E\u0442\u0430\u044F \u043A\u0430\u0439\u043C\u0430). \xAB\u041E\u0431\u044B\u0447\u043D\u0430\u044F\xBB: \u043D\u0430 25% \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435, \u0432\u0438\u0434\u043D\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0441\u0442\u043E\u0440\u043E\u043D\u0430. \xAB\u0420\u0435\u0430\u043B\u0438\u0441\u0442\u0438\u0447\u043D\u0430\u044F\xBB: \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0430\u044F \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C \u0438 \u0431\u0435\u0437 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043E\u043A.","Movimiento encarado: cerca del rival, adelante y atr\xE1s te acercan o alejan y los lados le rodean sin dejar de mirarle.":"\u0414\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043B\u0438\u0446\u043E\u043C \u043A \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0443: \u0432\u0431\u043B\u0438\u0437\u0438 \u0432\u043F\u0435\u0440\u0451\u0434 \u0438 \u043D\u0430\u0437\u0430\u0434 \u0441\u0431\u043B\u0438\u0436\u0430\u044E\u0442 \u0438 \u0440\u0430\u0437\u0440\u044B\u0432\u0430\u044E\u0442 \u0434\u0438\u0441\u0442\u0430\u043D\u0446\u0438\u044E, \u0430 \u0432\u0431\u043E\u043A \u2014 \u043E\u0431\u0445\u043E\u0434\u044F\u0442 \u0435\u0433\u043E, \u043D\u0435 \u0441\u0432\u043E\u0434\u044F \u0441 \u043D\u0435\u0433\u043E \u0433\u043B\u0430\u0437.","C\xE1mara con margen: solo se recoloca si el rival se sale bastante del encuadre, y te respeta 3 s despu\xE9s de que la gires t\xFA.":"\u041A\u0430\u043C\u0435\u0440\u0430 \u0441 \u0437\u0430\u043F\u0430\u0441\u043E\u043C: \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F, \u0442\u043E\u043B\u044C\u043A\u043E \u0435\u0441\u043B\u0438 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u0437\u0430\u043C\u0435\u0442\u043D\u043E \u0432\u044B\u0445\u043E\u0434\u0438\u0442 \u0438\u0437 \u043A\u0430\u0434\u0440\u0430, \u0438 \u043D\u0435 \u043C\u0435\u0448\u0430\u0435\u0442 3 s \u043F\u043E\u0441\u043B\u0435 \u0442\u043E\u0433\u043E, \u043A\u0430\u043A \u0432\u044B \u043F\u043E\u0432\u0435\u0440\u043D\u0443\u043B\u0438 \u0435\u0451 \u0441\u0430\u043C\u0438.","Peso de los golpes: pausa de 50 a 100 ms en cada choque, chispas al chocar aceros, sangre al herir, retroceso del golpeado, una sacudida leve de la c\xE1mara, estela de la hoja y sonidos sintetizados (se pueden quitar en Opciones).":"\u0412\u0435\u0441 \u0443\u0434\u0430\u0440\u043E\u0432: \u043F\u0430\u0443\u0437\u0430 \u043E\u0442 50 \u0434\u043E 100 ms \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u043C \u0441\u0442\u043E\u043B\u043A\u043D\u043E\u0432\u0435\u043D\u0438\u0438, \u0438\u0441\u043A\u0440\u044B \u043F\u0440\u0438 \u0443\u0434\u0430\u0440\u0435 \u0441\u0442\u0430\u043B\u0438 \u043E \u0441\u0442\u0430\u043B\u044C, \u043A\u0440\u043E\u0432\u044C \u043F\u0440\u0438 \u0440\u0430\u043D\u0435\u043D\u0438\u0438, \u043E\u0442\u0434\u0430\u0447\u0430 \u0443 \u043F\u043E\u043B\u0443\u0447\u0438\u0432\u0448\u0435\u0433\u043E \u0443\u0434\u0430\u0440, \u043B\u0451\u0433\u043A\u0430\u044F \u0442\u0440\u044F\u0441\u043A\u0430 \u043A\u0430\u043C\u0435\u0440\u044B, \u0441\u043B\u0435\u0434 \u043A\u043B\u0438\u043D\u043A\u0430 \u0438 \u0441\u0438\u043D\u0442\u0435\u0437\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0437\u0432\u0443\u043A\u0438 (\u0438\u0445 \u043C\u043E\u0436\u043D\u043E \u043E\u0442\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0432 \xAB\u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445\xBB).","Las guardias de la v1 siguen en el c\xF3digo como modo avanzado pero no est\xE1n en el men\xFA: liaban m\xE1s de lo que aportaban en un primer contacto.":"\u0421\u0442\u043E\u0439\u043A\u0438 \u0438\u0437 v1 \u043E\u0441\u0442\u0430\u043B\u0438\u0441\u044C \u0432 \u043A\u043E\u0434\u0435 \u043A\u0430\u043A \u043F\u0440\u043E\u0434\u0432\u0438\u043D\u0443\u0442\u044B\u0439 \u0440\u0435\u0436\u0438\u043C, \u043D\u043E \u0432 \u043C\u0435\u043D\u044E \u0438\u0445 \u043D\u0435\u0442: \u043F\u0440\u0438 \u043F\u0435\u0440\u0432\u043E\u043C \u0437\u043D\u0430\u043A\u043E\u043C\u0441\u0442\u0432\u0435 \u043E\u043D\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043F\u0443\u0442\u0430\u043B\u0438, \u0447\u0435\u043C \u043F\u043E\u043C\u043E\u0433\u0430\u043B\u0438.","Espada larga: tajo 1,9 m de alcance y 0,42 s de preparaci\xF3n a ritmo real; estocada 2,15 m y 0,32 s. Palo: 1,5 m, m\xE1s lento y contundente.":"\u0414\u043B\u0438\u043D\u043D\u044B\u0439 \u043C\u0435\u0447: \u0440\u0443\u0431\u044F\u0449\u0438\u0439 \u0443\u0434\u0430\u0440 \u2014 \u0434\u043E\u0441\u044F\u0433\u0430\u0435\u043C\u043E\u0441\u0442\u044C 1,9 m \u0438 \u0437\u0430\u043C\u0430\u0445 0,42 s \u0432 \u0440\u0435\u0430\u043B\u044C\u043D\u043E\u043C \u0442\u0435\u043C\u043F\u0435; \u043A\u043E\u043B\u044E\u0449\u0438\u0439 \u2014 2,15 m \u0438 0,32 s. \u041F\u043E\u0441\u043E\u0445: 1,5 m, \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435 \u0438 \u0442\u044F\u0436\u0435\u043B\u0435\u0435 \u0431\u044C\u0451\u0442.","Heridas por zona y gravedad (leve, grave, muy grave) sin barras de vida. Muy grave en la cabeza deja fuera de combate. El torso sangra mucho. Brazo de la espada herido: golpes m\xE1s lentos y flojos. Pierna herida: m\xE1s despacio y cojeando. Los cortes leves dejan de sangrar solos; los contundentes sangran poco pero aturden.":"\u0420\u0430\u043D\u044B \u043F\u043E \u043C\u0435\u0441\u0442\u0443 \u0438 \u0442\u044F\u0436\u0435\u0441\u0442\u0438 (\u043B\u0451\u0433\u043A\u0430\u044F, \u0442\u044F\u0436\u0451\u043B\u0430\u044F, \u043E\u0447\u0435\u043D\u044C \u0442\u044F\u0436\u0451\u043B\u0430\u044F) \u0431\u0435\u0437 \u043F\u043E\u043B\u043E\u0441\u043E\u043A \u0437\u0434\u043E\u0440\u043E\u0432\u044C\u044F. \u041E\u0447\u0435\u043D\u044C \u0442\u044F\u0436\u0451\u043B\u0430\u044F \u0440\u0430\u043D\u0430 \u0432 \u0433\u043E\u043B\u043E\u0432\u0443 \u0432\u044B\u0432\u043E\u0434\u0438\u0442 \u0438\u0437 \u0431\u043E\u044F. \u0422\u0443\u043B\u043E\u0432\u0438\u0449\u0435 \u0441\u0438\u043B\u044C\u043D\u043E \u043A\u0440\u043E\u0432\u043E\u0442\u043E\u0447\u0438\u0442. \u0420\u0430\u043D\u0435\u043D\u0430 \u0440\u0443\u043A\u0430 \u0441 \u043C\u0435\u0447\u043E\u043C \u2014 \u0443\u0434\u0430\u0440\u044B \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435 \u0438 \u0441\u043B\u0430\u0431\u0435\u0435. \u0420\u0430\u043D\u0435\u043D\u0430 \u043D\u043E\u0433\u0430 \u2014 \u0445\u043E\u0434\u044C\u0431\u0430 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u0435\u0435, \u0441 \u0445\u0440\u043E\u043C\u043E\u0442\u043E\u0439. \u041B\u0451\u0433\u043A\u0438\u0435 \u043F\u043E\u0440\u0435\u0437\u044B \u043F\u0435\u0440\u0435\u0441\u0442\u0430\u044E\u0442 \u043A\u0440\u043E\u0432\u043E\u0442\u043E\u0447\u0438\u0442\u044C \u0441\u0430\u043C\u0438; \u0434\u0440\u043E\u0431\u044F\u0449\u0438\u0435 \u0443\u0434\u0430\u0440\u044B \u043F\u043E\u0447\u0442\u0438 \u043D\u0435 \u0434\u0430\u044E\u0442 \u043A\u0440\u043E\u0432\u0438, \u043D\u043E \u043E\u0433\u043B\u0443\u0448\u0430\u044E\u0442.","Armaduras: el gambes\xF3n reduce el tajo a la mitad; la malla casi lo anula, pero para peor la estocada y el golpe contundente.":"\u0414\u043E\u0441\u043F\u0435\u0445\u0438: \u0433\u0430\u043C\u0431\u0435\u0437\u043E\u043D \u0432\u0434\u0432\u043E\u0435 \u043E\u0441\u043B\u0430\u0431\u043B\u044F\u0435\u0442 \u0440\u0443\u0431\u044F\u0449\u0438\u0439 \u0443\u0434\u0430\u0440; \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 \u043F\u043E\u0447\u0442\u0438 \u0441\u0432\u043E\u0434\u0438\u0442 \u0435\u0433\u043E \u043D\u0430 \u043D\u0435\u0442, \u043D\u043E \u0445\u0443\u0436\u0435 \u0434\u0435\u0440\u0436\u0438\u0442 \u043A\u043E\u043B\u044E\u0449\u0438\u0439 \u0438 \u0434\u0440\u043E\u0431\u044F\u0449\u0438\u0439 \u0443\u0434\u0430\u0440.","v3, arreglo provisional del arco (pedido por valravnx tras probarlo): si sueltas por debajo de la mitad de tensi\xF3n el tiro se cancela sin disparar; echar a correr afloja el arco y no se puede empezar a tensar corriendo; despu\xE9s de cada disparo hay 0,8 s para sacar y encajar la siguiente flecha (0,5 s para coger otra piedra). Antes se pod\xEDa correr y disparar sin parar.":"v3, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u0430\u044F \u043F\u0440\u0430\u0432\u043A\u0430 \u043B\u0443\u043A\u0430 (\u043F\u043E \u043F\u0440\u043E\u0441\u044C\u0431\u0435 \u041F\u0435\u0434\u0440\u043E \u043F\u043E\u0441\u043B\u0435 \u043F\u0440\u043E\u0431\u044B): \u0435\u0441\u043B\u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u044C \u0442\u0435\u0442\u0438\u0432\u0443, \u043D\u0435 \u043D\u0430\u0442\u044F\u043D\u0443\u0432 \u0435\u0451 \u0438 \u043D\u0430\u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443, \u0432\u044B\u0441\u0442\u0440\u0435\u043B \u043E\u0442\u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F; \u0435\u0441\u043B\u0438 \u043F\u0435\u0440\u0435\u0439\u0442\u0438 \u043D\u0430 \u0431\u0435\u0433, \u043B\u0443\u043A \u043E\u0441\u043B\u0430\u0431\u043B\u044F\u0435\u0442\u0441\u044F, \u0438 \u043D\u0430 \u0431\u0435\u0433\u0443 \u043D\u0430\u0442\u044F\u0433\u0438\u0432\u0430\u0442\u044C \u0435\u0433\u043E \u043D\u0435\u043B\u044C\u0437\u044F; \u043F\u043E\u0441\u043B\u0435 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0432\u044B\u0441\u0442\u0440\u0435\u043B\u0430 \u043D\u0443\u0436\u043D\u043E 0,8 s, \u0447\u0442\u043E\u0431\u044B \u0434\u043E\u0441\u0442\u0430\u0442\u044C \u0438 \u043D\u0430\u043B\u043E\u0436\u0438\u0442\u044C \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0443\u044E \u0441\u0442\u0440\u0435\u043B\u0443 (0,5 s \u2014 \u0447\u0442\u043E\u0431\u044B \u0432\u0437\u044F\u0442\u044C \u0434\u0440\u0443\u0433\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C). \u0420\u0430\u043D\u044C\u0448\u0435 \u043C\u043E\u0436\u043D\u043E \u0431\u044B\u043B\u043E \u0431\u0435\u0436\u0430\u0442\u044C \u0438 \u0441\u0442\u0440\u0435\u043B\u044F\u0442\u044C \u0431\u0435\u0437 \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u043A\u0438.","v4, escudo PROVISIONAL (pedido por valravnx; lo revisar\xE1 \xE9l): nueva arma \xABEspada y escudo\xBB. Espada de una mano: 1,7 m de alcance (la larga 1,9), estocada 1,9 m, se prepara algo m\xE1s r\xE1pido (0,38 s) y hiere algo menos. Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante.":"v4, \u0412\u0420\u0415\u041C\u0415\u041D\u041D\u042B\u0419 \u0449\u0438\u0442 (\u043F\u043E \u043F\u0440\u043E\u0441\u044C\u0431\u0435 \u041F\u0435\u0434\u0440\u043E; \u043E\u043D \u0435\u0433\u043E \u043F\u0440\u043E\u0432\u0435\u0440\u0438\u0442): \u043D\u043E\u0432\u043E\u0435 \u043E\u0440\u0443\u0436\u0438\u0435 \xAB\u041C\u0435\u0447 \u0438 \u0449\u0438\u0442\xBB. \u041E\u0434\u043D\u043E\u0440\u0443\u0447\u043D\u044B\u0439 \u043C\u0435\u0447: \u0434\u043E\u0441\u044F\u0433\u0430\u0435\u043C\u043E\u0441\u0442\u044C 1,7 m (\u0443 \u0434\u043B\u0438\u043D\u043D\u043E\u0433\u043E 1,9), \u0443\u043A\u043E\u043B 1,9 m, \u0437\u0430\u043C\u0430\u0445 \u0447\u0443\u0442\u044C \u0431\u044B\u0441\u0442\u0440\u0435\u0435 (0,38 s), \u0440\u0430\u043D\u0438\u0442 \u0447\u0443\u0442\u044C \u0441\u043B\u0430\u0431\u0435\u0435. \u041A\u0440\u0443\u0433\u043B\u044B\u0439 \u0434\u043E\u0449\u0430\u0442\u044B\u0439 \u0449\u0438\u0442 \u0441 \u043A\u043E\u0436\u0430\u043D\u043E\u0439 \u043E\u043A\u043E\u0432\u043A\u043E\u0439 \u043F\u043E \u043A\u0440\u0430\u044E \u0438 \u0443\u043C\u0431\u043E\u043D\u043E\u043C, \u043D\u0430 \u043B\u0435\u0432\u043E\u0439 \u0440\u0443\u043A\u0435; \u043F\u0440\u0438 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0438 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442\u0441\u044F \u043F\u0435\u0440\u0435\u0434 \u0441\u043E\u0431\u043E\u0439.","v4: con escudo, Parar tambi\xE9n detiene flechas y piedras que vengan de frente (70\xB0 a cada lado de donde miras); por la espalda o de lado no. Parar con escudo cuesta un 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"v4: \u0441\u043E \u0449\u0438\u0442\u043E\u043C \xAB\u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\xBB \u043E\u0441\u0442\u0430\u043D\u0430\u0432\u043B\u0438\u0432\u0430\u0435\u0442 \u0438 \u0441\u0442\u0440\u0435\u043B\u044B \u0441 \u043A\u0430\u043C\u043D\u044F\u043C\u0438, \u043B\u0435\u0442\u044F\u0449\u0438\u0435 \u0441\u043F\u0435\u0440\u0435\u0434\u0438 (\u043F\u043E 70\xB0 \u0432 \u043A\u0430\u0436\u0434\u0443\u044E \u0441\u0442\u043E\u0440\u043E\u043D\u0443 \u043E\u0442 \u0432\u0437\u0433\u043B\u044F\u0434\u0430); \u0441\u0437\u0430\u0434\u0438 \u0438\u043B\u0438 \u0441\u0431\u043E\u043A\u0443 \u2014 \u043D\u0435\u0442. \u041F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0449\u0438\u0442\u043E\u043C \u0441\u0442\u043E\u0438\u0442 60% \u0432\u044B\u043D\u043E\u0441\u043B\u0438\u0432\u043E\u0441\u0442\u0438 \u043E\u0442 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F \u043C\u0435\u0447\u043E\u043C. \u0418\u0434\u0435\u0430\u043B\u044C\u043D\u043E\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0439 \u0443\u0434\u0430\u0440 \u0440\u0430\u0431\u043E\u0442\u0430\u044E\u0442 \u0442\u0430\u043A \u0436\u0435.","v4: nueva opci\xF3n \xABArma del rival\xBB (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"v4: \u043D\u043E\u0432\u0430\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \xAB\u041E\u0440\u0443\u0436\u0438\u0435 \u043F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A\u0430\xBB (\u043A\u0430\u043A \u0443 \u0432\u0430\u0441, \u0434\u043B\u0438\u043D\u043D\u044B\u0439 \u043C\u0435\u0447, \u043C\u0435\u0447 \u0438 \u0449\u0438\u0442 \u0438\u043B\u0438 \u043F\u043E\u0441\u043E\u0445). \u041F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u0441\u043E \u0449\u0438\u0442\u043E\u043C \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0435\u0442 \u0435\u0433\u043E, \u043A\u043E\u0433\u0434\u0430 \u0432\u044B \u0446\u0435\u043B\u0438\u0442\u0435\u0441\u044C \u0432 \u043D\u0435\u0433\u043E \u0438\u0437 \u043B\u0443\u043A\u0430 \u0438\u043B\u0438 \u043F\u0440\u0430\u0449\u0438, \u0438 \u0434\u0435\u0440\u0436\u0438\u0442, \u043F\u043E\u043A\u0430 \u0432\u044B \u043F\u0435\u0440\u0435\u0437\u0430\u0440\u044F\u0436\u0430\u0435\u0442\u0435.","Arco: tensar del todo tarda 1 s. El c\xEDrculo de punter\xEDa se cierra al tensar y se pone verde cuando est\xE1 a plena tensi\xF3n; si sueltas antes, la flecha se queda corta. A partir de 2,5 s tenso, el pulso tiembla y el c\xEDrculo se abre en rojo. Las flechas no se paran con la espada; con escudo, s\xED (v4).":"\u041B\u0443\u043A: \u043F\u043E\u043B\u043D\u043E\u0435 \u043D\u0430\u0442\u044F\u0436\u0435\u043D\u0438\u0435 \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 1 s. \u041A\u0440\u0443\u0433 \u043F\u0440\u0438\u0446\u0435\u043B\u0430 \u0441\u0443\u0436\u0430\u0435\u0442\u0441\u044F \u043F\u0440\u0438 \u043D\u0430\u0442\u044F\u0436\u0435\u043D\u0438\u0438 \u0438 \u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0437\u0435\u043B\u0451\u043D\u044B\u043C \u043F\u0440\u0438 \u043F\u043E\u043B\u043D\u043E\u043C; \u0435\u0441\u043B\u0438 \u043E\u0442\u043F\u0443\u0441\u0442\u0438\u0442\u044C \u0440\u0430\u043D\u044C\u0448\u0435, \u0441\u0442\u0440\u0435\u043B\u0430 \u043D\u0435 \u0434\u043E\u043B\u0435\u0442\u0430\u0435\u0442. \u041F\u043E\u0441\u043B\u0435 2,5 s \u0432 \u043D\u0430\u0442\u044F\u043D\u0443\u0442\u043E\u043C \u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u0438 \u0440\u0443\u043A\u0430 \u0434\u0440\u043E\u0436\u0438\u0442, \u0438 \u043A\u0440\u0443\u0433 \u0440\u0430\u0441\u0448\u0438\u0440\u044F\u0435\u0442\u0441\u044F \u043A\u0440\u0430\u0441\u043D\u044B\u043C. \u0421\u0442\u0440\u0435\u043B\u044B \u043C\u0435\u0447\u043E\u043C \u043D\u0435 \u043E\u0442\u0431\u0438\u0442\u044C; \u0449\u0438\u0442\u043E\u043C \u2014 \u043C\u043E\u0436\u043D\u043E (v4).","El rival de la m\xE1quina tarda en reaccionar y seg\xFAn la dificultad lee mejor tus golpes, intenta paradas perfectas, golpes maestros y fintas. Se queda quieto mientras golpea y a veces retrocede despu\xE9s. Tu cinta es azul y la suya amarilla.":"\u041F\u0440\u043E\u0442\u0438\u0432\u043D\u0438\u043A \u043F\u043E\u0434 \u0443\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435\u043C \u043A\u043E\u043C\u043F\u044C\u044E\u0442\u0435\u0440\u0430 \u0440\u0435\u0430\u0433\u0438\u0440\u0443\u0435\u0442 \u0441 \u0437\u0430\u0434\u0435\u0440\u0436\u043A\u043E\u0439 \u0438, \u0432 \u0437\u0430\u0432\u0438\u0441\u0438\u043C\u043E\u0441\u0442\u0438 \u043E\u0442 \u0441\u043B\u043E\u0436\u043D\u043E\u0441\u0442\u0438, \u043B\u0443\u0447\u0448\u0435 \u0447\u0438\u0442\u0430\u0435\u0442 \u0432\u0430\u0448\u0438 \u0443\u0434\u0430\u0440\u044B, \u043F\u0440\u043E\u0431\u0443\u0435\u0442 \u0438\u0434\u0435\u0430\u043B\u044C\u043D\u044B\u0435 \u043F\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F, \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0438\u0435 \u0443\u0434\u0430\u0440\u044B \u0438 \u0444\u0438\u043D\u0442\u044B. \u041D\u0430\u043D\u043E\u0441\u044F \u0443\u0434\u0430\u0440, \u043E\u043D \u0441\u0442\u043E\u0438\u0442 \u043D\u0430 \u043C\u0435\u0441\u0442\u0435, \u0430 \u0438\u043D\u043E\u0433\u0434\u0430 \u043F\u043E\u0441\u043B\u0435 \u043D\u0435\u0433\u043E \u043E\u0442\u0441\u0442\u0443\u043F\u0430\u0435\u0442. \u0412\u0430\u0448\u0430 \u043F\u043E\u0432\u044F\u0437\u043A\u0430 \u0441\u0438\u043D\u044F\u044F, \u0435\u0433\u043E \u2014 \u0436\u0451\u043B\u0442\u0430\u044F.","Textos de la interfaz en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"\u0422\u0435\u043A\u0441\u0442\u044B \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u0430 \u043D\u0430 \u0438\u0441\u043F\u0430\u043D\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C (\u043A\u043D\u043E\u043F\u043A\u0430 \u0432\u0432\u0435\u0440\u0445\u0443 \u0441\u043F\u0440\u0430\u0432\u0430); \u0440\u0443\u0441\u0441\u043A\u0438\u0439 \u0433\u043E\u0442\u043E\u0432\u0438\u0442\u0441\u044F \u0438 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043F\u043E\u0437\u0436\u0435.","Hito 1 \xB7 v5":"\u042D\u0442\u0430\u043F 1 \xB7 v5","Combate \xB7 v5":"\u0411\u043E\u0439 \xB7 v5","v5: textos en espa\xF1ol e ingl\xE9s (bot\xF3n arriba a la derecha); el ruso est\xE1 preparado y llegar\xE1 m\xE1s adelante.":"v5: \u0442\u0435\u043A\u0441\u0442\u044B \u043D\u0430 \u0438\u0441\u043F\u0430\u043D\u0441\u043A\u043E\u043C \u0438 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C (\u043A\u043D\u043E\u043F\u043A\u0430 \u0432\u0432\u0435\u0440\u0445\u0443 \u0441\u043F\u0440\u0430\u0432\u0430); \u0440\u0443\u0441\u0441\u043A\u0438\u0439 \u0433\u043E\u0442\u043E\u0432\u0438\u0442\u0441\u044F \u0438 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043F\u043E\u0437\u0436\u0435.","Quedan para m\xE1s adelante: adarve, chimenea y puentes (los puentes necesitan agua en el mapa).":"\u041E\u0442\u043B\u043E\u0436\u0435\u043D\u043E \u043D\u0430 \u043F\u043E\u0442\u043E\u043C: \u0431\u043E\u0435\u0432\u043E\u0439 \u0445\u043E\u0434, \u043E\u0447\u0430\u0433 \u0441 \u0434\u044B\u043C\u043E\u0445\u043E\u0434\u043E\u043C \u0438 \u043C\u043E\u0441\u0442\u044B (\u0434\u043B\u044F \u043C\u043E\u0441\u0442\u043E\u0432 \u043D\u0443\u0436\u043D\u0430 \u0432\u043E\u0434\u0430 \u043D\u0430 \u043A\u0430\u0440\u0442\u0435).","Hito 1 \xB7 v6":"\u042D\u0442\u0430\u043F 1 \xB7 v6","Escalera de tablas":"\u0414\u043E\u0449\u0430\u0442\u0430\u044F \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0430","La escalera de tablas sube a la planta de arriba: en la \xFAltima no cabe.":"\u0414\u043E\u0449\u0430\u0442\u0430\u044F \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0430 \u0432\u0435\u0434\u0451\u0442 \u043D\u0430 \u044D\u0442\u0430\u0436 \u0432\u044B\u0448\u0435: \u043D\u0430 \u0432\u0435\u0440\u0445\u043D\u0435\u043C \u044D\u0442\u0430\u0436\u0435 \u043E\u043D\u0430 \u043D\u0435 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F.","Encima de la escalera tiene que quedar el hueco abierto: quita ese suelo.":"\u041D\u0430\u0434 \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0435\u0439 \u0434\u043E\u043B\u0436\u0435\u043D \u043E\u0441\u0442\u0430\u0442\u044C\u0441\u044F \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u0439 \u043F\u0440\u043E\u0451\u043C: \u0443\u0431\u0435\u0440\u0438\u0442\u0435 \u044D\u0442\u043E\u0442 \u043F\u043E\u043B.","Ah\xED est\xE1 el hueco de una escalera.":"\u0417\u0434\u0435\u0441\u044C \u043F\u0440\u043E\u0451\u043C \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B.","v6: escalera de tablas (6 tablas y 6 clavos, 100 kg). Ocupa una casilla y se sube andando, sin bot\xF3n: se entra por el lado bajo y se sale arriba a la casilla de al lado (gira con R hacia d\xF3nde sube). Encima tiene que quedar el hueco abierto, as\xED que no deja poner suelo ah\xED. Necesita cimiento o suelo debajo, o la tierra en la planta baja.":"v6: \u0434\u043E\u0449\u0430\u0442\u0430\u044F \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u0430 (6 \u0434\u043E\u0441\u043E\u043A \u0438 6 \u0433\u0432\u043E\u0437\u0434\u0435\u0439, 100 kg). \u0417\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u043E\u0434\u043D\u0443 \u043A\u043B\u0435\u0442\u043A\u0443, \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u0442\u044C\u0441\u044F \u043F\u043E \u043D\u0435\u0439 \u043C\u043E\u0436\u043D\u043E \u043F\u0440\u043E\u0441\u0442\u043E \u0438\u0434\u044F, \u0431\u0435\u0437 \u043A\u043D\u043E\u043F\u043A\u0438: \u0432\u0445\u043E\u0434 \u0441 \u043D\u0438\u0436\u043D\u0435\u0439 \u0441\u0442\u043E\u0440\u043E\u043D\u044B, \u0432\u044B\u0445\u043E\u0434 \u043D\u0430\u0432\u0435\u0440\u0445\u0443 \u043D\u0430 \u0441\u043E\u0441\u0435\u0434\u043D\u044E\u044E \u043A\u043B\u0435\u0442\u043A\u0443 (R \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u0435\u0442 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435 \u043F\u043E\u0434\u044A\u0451\u043C\u0430). \u041D\u0430\u0434 \u043D\u0435\u0439 \u0434\u043E\u043B\u0436\u0435\u043D \u043E\u0441\u0442\u0430\u0442\u044C\u0441\u044F \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u0439 \u043F\u0440\u043E\u0451\u043C, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043A\u043B\u0430\u0441\u0442\u044C \u0442\u0430\u043C \u043F\u043E\u043B \u043D\u0435\u043B\u044C\u0437\u044F. \u041F\u043E\u0434 \u043D\u0435\u0439 \u043D\u0443\u0436\u0435\u043D \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442 \u0438\u043B\u0438 \u043F\u043E\u043B, \u043B\u0438\u0431\u043E \u0437\u0435\u043C\u043B\u044F \u043D\u0430 \u043D\u0438\u0436\u043D\u0435\u043C \u044D\u0442\u0430\u0436\u0435.","v6: por el hueco de la escalera se puede caer a ella desde arriba; las barandillas para cerrarlo llegan en la tarea siguiente. Por debajo del tramo alto se puede pasar sin subir.":"v6: \u0447\u0435\u0440\u0435\u0437 \u043F\u0440\u043E\u0451\u043C \u043B\u0435\u0441\u0442\u043D\u0438\u0446\u044B \u043C\u043E\u0436\u043D\u043E \u0443\u043F\u0430\u0441\u0442\u044C \u043D\u0430 \u043D\u0435\u0451 \u0441\u0432\u0435\u0440\u0445\u0443; \u043F\u0435\u0440\u0438\u043B\u0430, \u0447\u0442\u043E\u0431\u044B \u0435\u0433\u043E \u0437\u0430\u043A\u0440\u044B\u0442\u044C, \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432 \u0441\u043B\u0435\u0434\u0443\u044E\u0449\u0435\u0439 \u0437\u0430\u0434\u0430\u0447\u0435. \u041F\u043E\u0434 \u0432\u044B\u0441\u043E\u043A\u0438\u043C \u043A\u043E\u043D\u0446\u043E\u043C \u043F\u0440\u043E\u043B\u0451\u0442\u0430 \u043C\u043E\u0436\u043D\u043E \u043F\u0440\u043E\u0439\u0442\u0438, \u043D\u0435 \u043F\u043E\u0434\u043D\u0438\u043C\u0430\u044F\u0441\u044C.","v7: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). La escena no cambia.":"v7: \u0442\u0435\u043F\u0435\u0440\u044C \u0438 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C, \u0441 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 ES/EN \u0432\u0432\u0435\u0440\u0445\u0443, \u043A\u0430\u043A \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0438 \u0431\u043E\u044E (\u0437\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u0435\u0442 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u044F\u0437\u044B\u043A, \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u043D\u0430 \u0441\u0430\u0439\u0442\u0435). \u0421\u0446\u0435\u043D\u0430 \u043D\u0435 \u0438\u0437\u043C\u0435\u043D\u0438\u043B\u0430\u0441\u044C.","v10: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web). El personaje no cambia.":"v10: \u0442\u0435\u043F\u0435\u0440\u044C \u0438 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C, \u0441 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 ES/EN \u0432\u0432\u0435\u0440\u0445\u0443, \u043A\u0430\u043A \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0438 \u0431\u043E\u044E (\u0437\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u0435\u0442 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u044F\u0437\u044B\u043A, \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u043D\u0430 \u0441\u0430\u0439\u0442\u0435). \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u043D\u0435 \u0438\u0437\u043C\u0435\u043D\u0438\u043B\u0441\u044F.","Prueba de estilo \xB7 v7 (realismo en miniatura, con el personaje por c\xF3digo; tambi\xE9n en ingl\xE9s)":"\u041F\u0440\u043E\u0431\u0430 \u0441\u0442\u0438\u043B\u044F \xB7 v7 (\u0440\u0435\u0430\u043B\u0438\u0437\u043C \u0432 \u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u0435, \u0441 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0438\u0437 \u043A\u043E\u0434\u0430; \u0442\u0430\u043A\u0436\u0435 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C)","Personaje \xB7 v10 (taller propio con MakeHuman, ropa por capas y armadura; tambi\xE9n en ingl\xE9s)":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \xB7 v10 (\u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F \u043D\u0430 MakeHuman, \u043E\u0434\u0435\u0436\u0434\u0430 \u0441\u043B\u043E\u044F\u043C\u0438 \u0438 \u0434\u043E\u0441\u043F\u0435\u0445\u0438; \u0442\u0430\u043A\u0436\u0435 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C)","v6, el personaje: hecho todo por c\xF3digo, como decidiste. Es una sola malla continua (sin piezas sueltas ni juntas): el cuerpo se describe como una suma suave de formas (cr\xE1neo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas, pies) y se convierte en malla, con m\xE1s detalle en la cara y las manos.":"v6, \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436: \u0446\u0435\u043B\u0438\u043A\u043E\u043C \u0441\u0434\u0435\u043B\u0430\u043D \u043A\u043E\u0434\u043E\u043C, \u043A\u0430\u043A \u0432\u044B \u0440\u0435\u0448\u0438\u043B\u0438. \u042D\u0442\u043E \u043E\u0434\u043D\u0430 \u0441\u043F\u043B\u043E\u0448\u043D\u0430\u044F \u0441\u0435\u0442\u043A\u0430 (\u0431\u0435\u0437 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u0445 \u0434\u0435\u0442\u0430\u043B\u0435\u0439 \u0438 \u0448\u0432\u043E\u0432): \u0442\u0435\u043B\u043E \u043E\u043F\u0438\u0441\u0430\u043D\u043E \u043A\u0430\u043A \u043F\u043B\u0430\u0432\u043D\u0430\u044F \u0441\u0443\u043C\u043C\u0430 \u0444\u043E\u0440\u043C (\u0447\u0435\u0440\u0435\u043F, \u043B\u0438\u0446\u043E, \u043D\u043E\u0441, \u0431\u0440\u043E\u0432\u0438, \u0443\u0448\u0438, \u0442\u0443\u043B\u043E\u0432\u0438\u0449\u0435, \u0440\u0443\u043A\u0438, \u043A\u0438\u0441\u0442\u0438 \u0441 \u0431\u043E\u043B\u044C\u0448\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C, \u043D\u043E\u0433\u0438, \u0441\u0442\u0443\u043F\u043D\u0438) \u0438 \u043F\u0440\u0435\u0432\u0440\u0430\u0449\u0435\u043D\u043E \u0432 \u0441\u0435\u0442\u043A\u0443, \u0441 \u0431\u043E\u043B\u044C\u0448\u0435\u0439 \u0434\u0435\u0442\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u0435\u0439 \u043B\u0438\u0446\u0430 \u0438 \u043A\u0438\u0441\u0442\u0435\u0439.","Lleva esqueleto de 17 huesos y dos animaciones hechas por c\xF3digo: quieto (respira y se balancea un poco) y andar (bot\xF3n \xABQuieto/Andando\xBB: va y viene por el camino). Las vistas \xABPersonaje\xBB y \xABCara\xBB le siguen.":"\u0423 \u043D\u0435\u0433\u043E \u0441\u043A\u0435\u043B\u0435\u0442 \u0438\u0437 17 \u043A\u043E\u0441\u0442\u0435\u0439 \u0438 \u0434\u0432\u0435 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0438, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u044B\u0435 \u043A\u043E\u0434\u043E\u043C: \u0441\u0442\u043E\u0439\u043A\u0430 \u043D\u0430 \u043C\u0435\u0441\u0442\u0435 (\u0434\u044B\u0448\u0438\u0442 \u0438 \u0441\u043B\u0435\u0433\u043A\u0430 \u043F\u043E\u043A\u0430\u0447\u0438\u0432\u0430\u0435\u0442\u0441\u044F) \u0438 \u0445\u043E\u0434\u044C\u0431\u0430 (\u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0421\u0442\u043E\u0438\u0442/\u0418\u0434\u0451\u0442\xBB: \u0445\u043E\u0434\u0438\u0442 \u0442\u0443\u0434\u0430-\u0441\u044E\u0434\u0430 \u043F\u043E \u0434\u043E\u0440\u043E\u0436\u043A\u0435). \u0412\u0438\u0434\u044B \xAB\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\xBB \u0438 \xAB\u041B\u0438\u0446\u043E\xBB \u0441\u043B\u0435\u0434\u0443\u044E\u0442 \u0437\u0430 \u043D\u0438\u043C.","Proporciones cre\xEDbles algo estilizadas: 1,72 m, cabeza un poco grande (1/7 de la altura) para que se lea en miniatura. Hombre adulto con barba corta.":"\u041F\u0440\u0430\u0432\u0434\u043E\u043F\u043E\u0434\u043E\u0431\u043D\u044B\u0435, \u0441\u043B\u0435\u0433\u043A\u0430 \u0441\u0442\u0438\u043B\u0438\u0437\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u043F\u0440\u043E\u043F\u043E\u0440\u0446\u0438\u0438: 1,72 m, \u0433\u043E\u043B\u043E\u0432\u0430 \u0447\u0443\u0442\u044C \u043A\u0440\u0443\u043F\u043D\u0435\u0435 (1/7 \u0440\u043E\u0441\u0442\u0430), \u0447\u0442\u043E\u0431\u044B \u0447\u0438\u0442\u0430\u043B\u0430\u0441\u044C \u0432 \u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u0435. \u0412\u0437\u0440\u043E\u0441\u043B\u044B\u0439 \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0441 \u043A\u043E\u0440\u043E\u0442\u043A\u043E\u0439 \u0431\u043E\u0440\u043E\u0434\u043E\u0439.","Ropa base pintada en la misma malla, provisional: camisa de lino, cintur\xF3n de cuero (con relieve), calzas de lana y zapatos. La ropa y la armadura por capas, que se ven puestas, son una tarea aparte.":"\u0411\u0430\u0437\u043E\u0432\u0430\u044F \u043E\u0434\u0435\u0436\u0434\u0430 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u0430 \u043D\u0430 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0435\u0442\u043A\u0435, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u043B\u044C\u043D\u044F\u043D\u0430\u044F \u0440\u0443\u0431\u0430\u0445\u0430, \u043A\u043E\u0436\u0430\u043D\u044B\u0439 \u043F\u043E\u044F\u0441 (\u0441 \u0440\u0435\u043B\u044C\u0435\u0444\u043E\u043C), \u0448\u0435\u0440\u0441\u0442\u044F\u043D\u044B\u0435 \u0448\u043E\u0441\u0441\u044B \u0438 \u0431\u0430\u0448\u043C\u0430\u043A\u0438. \u041E\u0434\u0435\u0436\u0434\u0430 \u0438 \u0434\u043E\u0441\u043F\u0435\u0445\u0438 \u0441\u043B\u043E\u044F\u043C\u0438, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u0438\u0434\u043D\u044B \u043D\u0430\u0434\u0435\u0442\u044B\u043C\u0438, \u2014 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u0430\u044F \u0437\u0430\u0434\u0430\u0447\u0430.","Colores apagados, oclusi\xF3n ambiental horneada (pliegues, axilas y entre las piernas m\xE1s oscuros) y ojos con un peque\xF1o brillo.":"\u041F\u0440\u0438\u0433\u043B\u0443\u0448\u0451\u043D\u043D\u044B\u0435 \u0446\u0432\u0435\u0442\u0430, \u0437\u0430\u043F\u0435\u0447\u0451\u043D\u043D\u043E\u0435 \u0444\u043E\u043D\u043E\u0432\u043E\u0435 \u0437\u0430\u0442\u0435\u043D\u0435\u043D\u0438\u0435 (\u0441\u043A\u043B\u0430\u0434\u043A\u0438, \u043F\u043E\u0434\u043C\u044B\u0448\u043A\u0438 \u0438 \u043F\u0440\u043E\u0441\u0442\u0440\u0430\u043D\u0441\u0442\u0432\u043E \u043C\u0435\u0436\u0434\u0443 \u043D\u043E\u0433\u0430\u043C\u0438 \u0442\u0435\u043C\u043D\u0435\u0435) \u0438 \u0433\u043B\u0430\u0437\u0430 \u0441 \u043D\u0435\u0431\u043E\u043B\u044C\u0448\u0438\u043C \u0431\u043B\u0438\u043A\u043E\u043C.","Pendiente de mejorar, a la vista en las capturas de cerca: el pelo es un casquete liso, la cara a\xFAn es tosca de cerca y los bordes de color (cuello de la camisa, barba) son algo borrosos.":"\u0415\u0449\u0451 \u043D\u0443\u0436\u043D\u043E \u0434\u043E\u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C, \u0432\u0438\u0434\u043D\u043E \u043D\u0430 \u043A\u0440\u0443\u043F\u043D\u044B\u0445 \u0441\u043D\u0438\u043C\u043A\u0430\u0445: \u0432\u043E\u043B\u043E\u0441\u044B \u2014 \u0433\u043B\u0430\u0434\u043A\u0430\u044F \u0448\u0430\u043F\u043E\u0447\u043A\u0430, \u043B\u0438\u0446\u043E \u0432\u0431\u043B\u0438\u0437\u0438 \u043F\u043E\u043A\u0430 \u0433\u0440\u0443\u0431\u043E\u0435, \u0430 \u0433\u0440\u0430\u043D\u0438\u0446\u044B \u0446\u0432\u0435\u0442\u0430 (\u0432\u043E\u0440\u043E\u0442 \u0440\u0443\u0431\u0430\u0445\u0438, \u0431\u043E\u0440\u043E\u0434\u0430) \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0440\u0430\u0437\u043C\u044B\u0442\u044B.","Presupuesto: el personaje son unos 10 mil tri\xE1ngulos (unos 20 mil con su sombra). El l\xEDmite de la escena sube de 50 mil a 72 mil. No comprobado en un m\xF3vil de verdad.":"\u0411\u044E\u0434\u0436\u0435\u0442: \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u2014 \u043E\u043A\u043E\u043B\u043E 10 \u0442\u044B\u0441\u044F\u0447 \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u043E\u0432 (\u043E\u043A\u043E\u043B\u043E 20 \u0442\u044B\u0441\u044F\u0447 \u0441 \u0442\u0435\u043D\u044C\u044E). \u041F\u0440\u0435\u0434\u0435\u043B \u0434\u043B\u044F \u0441\u0446\u0435\u043D\u044B \u043F\u043E\u0434\u043D\u044F\u0442 \u0441 50 \u0442\u044B\u0441\u044F\u0447 \u0434\u043E 72 \u0442\u044B\u0441\u044F\u0447. \u041D\u0430 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u043C \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u0435\u043D\u043E.","v5: copas de los \xE1rboles en racimos suaves y pinos con puntas. v4: texturas por c\xF3digo y mundo sin recortar. Se mantienen.":"v5: \u043A\u0440\u043E\u043D\u044B \u0434\u0435\u0440\u0435\u0432\u044C\u0435\u0432 \u0438\u0437 \u043C\u044F\u0433\u043A\u0438\u0445 \u0433\u0440\u043E\u0437\u0434\u044C\u0435\u0432 \u0438 \u0441\u043E\u0441\u043D\u044B \u0441 \u043E\u0441\u0442\u0440\u044B\u043C\u0438 \u0432\u0435\u0440\u0445\u0443\u0448\u043A\u0430\u043C\u0438. v4: \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u044B \u0438\u0437 \u043A\u043E\u0434\u0430 \u0438 \u043C\u0438\u0440 \u0431\u0435\u0437 \u043E\u0431\u0440\u0435\u0437\u043A\u0438. \u0412\u0441\u0451 \u044D\u0442\u043E \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u043E.","Puedes girar la c\xE1mara arrastrando (un dedo en el m\xF3vil) y acercarte con la rueda o pellizcando.":"\u041A\u0430\u043C\u0435\u0440\u0443 \u043C\u043E\u0436\u043D\u043E \u0432\u0440\u0430\u0449\u0430\u0442\u044C \u043F\u0435\u0440\u0435\u0442\u0430\u0441\u043A\u0438\u0432\u0430\u043D\u0438\u0435\u043C (\u043E\u0434\u043D\u0438\u043C \u043F\u0430\u043B\u044C\u0446\u0435\u043C \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435) \u0438 \u043F\u0440\u0438\u0431\u043B\u0438\u0436\u0430\u0442\u044C \u043A\u043E\u043B\u0451\u0441\u0438\u043A\u043E\u043C \u0438\u043B\u0438 \u0449\u0438\u043F\u043A\u043E\u043C.","v2, por qu\xE9: el personaje esculpido por c\xF3digo de la v1 daba grima. valravnx: nada de inventos, usar bases ya hechas. Se usan los paquetes libres (CC0, se pueden usar y vender sin pagar ni citar) de Quaternius: Universal Base Characters, Modular Character Outfits \u2013 Fantasy y Universal Animation Library. Licencias junto a los modelos, en recursos/personajes/v1/ de la web.":"v2, \u043F\u043E\u0447\u0435\u043C\u0443: \u0432\u044B\u043B\u0435\u043F\u043B\u0435\u043D\u043D\u044B\u0439 \u043A\u043E\u0434\u043E\u043C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0438\u0437 v1 \u0432\u044B\u0437\u044B\u0432\u0430\u043B \u043E\u0442\u0442\u043E\u0440\u0436\u0435\u043D\u0438\u0435. \u041F\u0435\u0434\u0440\u043E: \u043D\u0438\u043A\u0430\u043A\u0438\u0445 \u0441\u0430\u043C\u043E\u0434\u0435\u043B\u043E\u043A, \u0431\u0440\u0430\u0442\u044C \u0433\u043E\u0442\u043E\u0432\u044B\u0435 \u043E\u0441\u043D\u043E\u0432\u044B. \u0418\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442\u0441\u044F \u0441\u0432\u043E\u0431\u043E\u0434\u043D\u044B\u0435 \u043D\u0430\u0431\u043E\u0440\u044B (CC0: \u0438\u0445 \u043C\u043E\u0436\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0438 \u043F\u0440\u043E\u0434\u0430\u0432\u0430\u0442\u044C \u0431\u0435\u0437 \u043E\u043F\u043B\u0430\u0442\u044B \u0438 \u0443\u043A\u0430\u0437\u0430\u043D\u0438\u044F \u0430\u0432\u0442\u043E\u0440\u0430) \u043E\u0442 Quaternius: Universal Base Characters, Modular Character Outfits \u2013 Fantasy \u0438 Universal Animation Library. \u041B\u0438\u0446\u0435\u043D\u0437\u0438\u0438 \u043B\u0435\u0436\u0430\u0442 \u0440\u044F\u0434\u043E\u043C \u0441 \u043C\u043E\u0434\u0435\u043B\u044F\u043C\u0438, \u0432 recursos/personajes/v1/ \u043D\u0430 \u0441\u0430\u0439\u0442\u0435.","C\xF3mo se monta: de la base se usa solo la cabeza y el cuello (el resto lo tapa la ropa, como indica el propio paquete), m\xE1s la ropa, el pelo y la barba. Todo comparte el mismo esqueleto de 65 huesos, as\xED que la ropa y las armaduras que vengan despu\xE9s se ponen y se quitan como capas.":"\u041A\u0430\u043A \u044D\u0442\u043E \u0441\u043E\u0431\u0440\u0430\u043D\u043E: \u043E\u0442 \u043E\u0441\u043D\u043E\u0432\u044B \u0431\u0435\u0440\u0443\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0433\u043E\u043B\u043E\u0432\u0430 \u0438 \u0448\u0435\u044F (\u043E\u0441\u0442\u0430\u043B\u044C\u043D\u043E\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043E\u0434\u0435\u0436\u0434\u0430, \u043A\u0430\u043A \u0441\u043E\u0432\u0435\u0442\u0443\u0435\u0442 \u0441\u0430\u043C \u043D\u0430\u0431\u043E\u0440), \u043F\u043B\u044E\u0441 \u043E\u0434\u0435\u0436\u0434\u0430, \u0432\u043E\u043B\u043E\u0441\u044B \u0438 \u0431\u043E\u0440\u043E\u0434\u0430. \u0412\u0441\u0451 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043E\u0434\u0438\u043D \u0441\u043A\u0435\u043B\u0435\u0442 \u0438\u0437 65 \u043A\u043E\u0441\u0442\u0435\u0439, \u043F\u043E\u044D\u0442\u043E\u043C\u0443 \u043E\u0434\u0435\u0436\u0434\u0443 \u0438 \u0434\u043E\u0441\u043F\u0435\u0445\u0438, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u043F\u043E\u0437\u0436\u0435, \u043C\u043E\u0436\u043D\u043E \u043D\u0430\u0434\u0435\u0432\u0430\u0442\u044C \u0438 \u0441\u043D\u0438\u043C\u0430\u0442\u044C \u0441\u043B\u043E\u044F\u043C\u0438.","Personalizaci\xF3n de prueba: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo, tono de piel y barba. El color de piel y de pelo se ti\xF1e sobre las texturas del paquete.":"\u041F\u0440\u043E\u0431\u043D\u0430\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0432\u043D\u0435\u0448\u043D\u043E\u0441\u0442\u0438: \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0438\u043B\u0438 \u0436\u0435\u043D\u0449\u0438\u043D\u0430, \u043A\u0440\u0435\u0441\u0442\u044C\u044F\u043D\u0441\u043A\u0430\u044F \u043E\u0434\u0435\u0436\u0434\u0430 \u0438\u043B\u0438 \u043E\u0434\u0435\u0436\u0434\u0430 \u0441\u043B\u0435\u0434\u043E\u043F\u044B\u0442\u0430, \u043F\u0440\u0438\u0447\u0451\u0441\u043A\u0430, \u0446\u0432\u0435\u0442 \u0432\u043E\u043B\u043E\u0441, \u0442\u043E\u043D \u043A\u043E\u0436\u0438 \u0438 \u0431\u043E\u0440\u043E\u0434\u0430. \u0426\u0432\u0435\u0442 \u043A\u043E\u0436\u0438 \u0438 \u0432\u043E\u043B\u043E\u0441 \u043D\u0430\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u0435\u0442\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445 \u0442\u0435\u043A\u0441\u0442\u0443\u0440 \u043D\u0430\u0431\u043E\u0440\u0430.","Animaciones del paquete (no hechas a mano): quieto, andar, talar, en guardia, golpe de espada y andar cargando, entre otras 26.":"\u0410\u043D\u0438\u043C\u0430\u0446\u0438\u0438 \u0438\u0437 \u043D\u0430\u0431\u043E\u0440\u0430 (\u043D\u0435 \u0441\u0434\u0435\u043B\u0430\u043D\u044B \u0432\u0440\u0443\u0447\u043D\u0443\u044E): \u0441\u0442\u043E\u0439\u043A\u0430, \u0445\u043E\u0434\u044C\u0431\u0430, \u0440\u0443\u0431\u043A\u0430 \u0434\u0435\u0440\u0435\u0432\u0430, \u0431\u043E\u0435\u0432\u0430\u044F \u0441\u0442\u043E\u0439\u043A\u0430, \u0443\u0434\u0430\u0440 \u043C\u0435\u0447\u043E\u043C, \u0445\u043E\u0434\u044C\u0431\u0430 \u0441 \u043D\u043E\u0448\u0435\u0439 \u0438 \u0435\u0449\u0451 26 \u0434\u0440\u0443\u0433\u0438\u0445.","Texturas reducidas para el navegador: 1024 px el color y 512 el relieve. Un personaje pesa unos 4 MB la primera vez (pelo, cabeza, ropa) m\xE1s 4,4 MB de animaciones compartidas por todos.":"\u0422\u0435\u043A\u0441\u0442\u0443\u0440\u044B \u0443\u043C\u0435\u043D\u044C\u0448\u0435\u043D\u044B \u0434\u043B\u044F \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430: 1024 px \u0434\u043B\u044F \u0446\u0432\u0435\u0442\u0430 \u0438 512 \u0434\u043B\u044F \u0440\u0435\u043B\u044C\u0435\u0444\u0430. \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0432\u0435\u0441\u0438\u0442 \u043E\u043A\u043E\u043B\u043E 4 MB \u043F\u0440\u0438 \u043F\u0435\u0440\u0432\u043E\u0439 \u0437\u0430\u0433\u0440\u0443\u0437\u043A\u0435 (\u0432\u043E\u043B\u043E\u0441\u044B, \u0433\u043E\u043B\u043E\u0432\u0430, \u043E\u0434\u0435\u0436\u0434\u0430) \u043F\u043B\u044E\u0441 4,4 MB \u043E\u0431\u0449\u0438\u0445 \u0434\u043B\u044F \u0432\u0441\u0435\u0445 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0439.","v3: en el m\xF3vil iba a 10 fps. Cambios: en pantallas t\xE1ctiles empieza en calidad \xABligera\xBB (material sencillo con el color, sin relieve ni brillo), resoluci\xF3n de partida 1\xD7 y puede bajar hasta 0,5\xD7; la ropa, el pelo y la barba comparten un solo esqueleto (antes cada malla calculaba el suyo).":"v3: \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u0448\u043B\u043E \u043F\u0440\u0438 10 fps. \u0418\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F: \u043D\u0430 \u0441\u0435\u043D\u0441\u043E\u0440\u043D\u044B\u0445 \u044D\u043A\u0440\u0430\u043D\u0430\u0445 \u0441\u0440\u0430\u0437\u0443 \u0432\u043A\u043B\u044E\u0447\u0430\u0435\u0442\u0441\u044F \xAB\u043B\u0451\u0433\u043A\u043E\u0435\xBB \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u043E (\u043F\u0440\u043E\u0441\u0442\u043E\u0439 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B \u0441 \u0446\u0432\u0435\u0442\u043E\u043C, \u0431\u0435\u0437 \u0440\u0435\u043B\u044C\u0435\u0444\u0430 \u0438 \u0431\u043B\u0435\u0441\u043A\u0430), \u043D\u0430\u0447\u0430\u043B\u044C\u043D\u043E\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 1\xD7 \u0441 \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E\u0441\u0442\u044C\u044E \u043E\u043F\u0443\u0441\u0442\u0438\u0442\u044C\u0441\u044F \u0434\u043E 0,5\xD7; \u043E\u0434\u0435\u0436\u0434\u0430, \u0432\u043E\u043B\u043E\u0441\u044B \u0438 \u0431\u043E\u0440\u043E\u0434\u0430 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u044E\u0442 \u043E\u0431\u0449\u0438\u0439 \u0441\u043A\u0435\u043B\u0435\u0442 (\u0440\u0430\u043D\u044C\u0448\u0435 \u043A\u0430\u0436\u0434\u0430\u044F \u0441\u0435\u0442\u043A\u0430 \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u044B\u0432\u0430\u043B\u0430 \u0441\u0432\u043E\u0439).","v3: interruptores de prueba de rendimiento (calidad, sombras, caba\xF1a y suelo) para ver en tu m\xF3vil qu\xE9 es lo que pesa, mirando los fps de arriba.":"v3: \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u0435\u043B\u0438 \u0434\u043B\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 (\u043A\u0430\u0447\u0435\u0441\u0442\u0432\u043E, \u0442\u0435\u043D\u0438, \u0445\u0438\u0436\u0438\u043D\u0430 \u0438 \u0437\u0435\u043C\u043B\u044F), \u0447\u0442\u043E\u0431\u044B \u043D\u0430 \u0441\u0432\u043E\u0451\u043C \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u0443\u0432\u0438\u0434\u0435\u0442\u044C, \u0447\u0442\u043E \u043D\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442 \u0441\u0438\u043B\u044C\u043D\u0435\u0435 \u0432\u0441\u0435\u0433\u043E, \u0433\u043B\u044F\u0434\u044F \u043D\u0430 fps \u0432\u0432\u0435\u0440\u0445\u0443.","v3: el traje de explorador ya no se ofrece: es demasiado de fantas\xEDa. Se buscan ropas de recreaci\xF3n hist\xF3rica.":"v3: \u043A\u043E\u0441\u0442\u044E\u043C \u0441\u043B\u0435\u0434\u043E\u043F\u044B\u0442\u0430 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u0435\u0442\u0441\u044F: \u043E\u043D \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u0444\u044D\u043D\u0442\u0435\u0437\u0438\u0439\u043D\u044B\u0439. \u0418\u0449\u0435\u0442\u0441\u044F \u043E\u0434\u0435\u0436\u0434\u0430 \u0438\u0441\u0442\u043E\u0440\u0438\u0447\u0435\u0441\u043A\u043E\u0439 \u0440\u0435\u043A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0446\u0438\u0438.","v4: correcci\xF3n. \xABMe va de 10\xBB era que va perfecto, no 10 fps: vuelve la calidad alta por defecto tambi\xE9n en el m\xF3vil, con la resoluci\xF3n de antes. La calidad ligera y los interruptores siguen como opci\xF3n.":"v4: \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435. \xABMe va de 10\xBB \u043E\u0437\u043D\u0430\u0447\u0430\u043B\u043E \xAB\u0438\u0434\u0451\u0442 \u043E\u0442\u043B\u0438\u0447\u043D\u043E\xBB, \u0430 \u043D\u0435 10 fps: \u0432\u044B\u0441\u043E\u043A\u043E\u0435 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u043E \u0441\u043D\u043E\u0432\u0430 \u0432\u043A\u043B\u044E\u0447\u0435\u043D\u043E \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u0438 \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435, \u0441 \u043F\u0440\u0435\u0436\u043D\u0438\u043C \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435\u043C. \u041B\u0451\u0433\u043A\u043E\u0435 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u043E \u0438 \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u0435\u043B\u0438 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043A\u0430\u043A \u043E\u043F\u0446\u0438\u044F.","v5: nueva opci\xF3n \xABBase del personaje\xBB: adem\xE1s del paquete de Quaternius, el taller propio. El cuerpo es de MakeHuman (libre, CC0) y la ropa, el pelo, la barba, la cofia, la piel y los ojos est\xE1n hechos por c\xF3digo en el proyecto, sin paquetes de fuera. As\xED se puede hacer la ropa que queramos.":"v5: \u043D\u043E\u0432\u0430\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \xAB\u041E\u0441\u043D\u043E\u0432\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430\xBB: \u043F\u043E\u043C\u0438\u043C\u043E \u043D\u0430\u0431\u043E\u0440\u0430 Quaternius \u2014 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F. \u0422\u0435\u043B\u043E \u0432\u0437\u044F\u0442\u043E \u0438\u0437 MakeHuman (\u0441\u0432\u043E\u0431\u043E\u0434\u043D\u043E, CC0), \u0430 \u043E\u0434\u0435\u0436\u0434\u0430, \u0432\u043E\u043B\u043E\u0441\u044B, \u0431\u043E\u0440\u043E\u0434\u0430, \u0447\u0435\u043F\u0435\u0446, \u043A\u043E\u0436\u0430 \u0438 \u0433\u043B\u0430\u0437\u0430 \u0441\u0434\u0435\u043B\u0430\u043D\u044B \u043A\u043E\u0434\u043E\u043C \u0432 \u0441\u0430\u043C\u043E\u043C \u043F\u0440\u043E\u0435\u043A\u0442\u0435, \u0431\u0435\u0437 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0438\u0445 \u043D\u0430\u0431\u043E\u0440\u043E\u0432. \u0422\u0430\u043A \u043C\u043E\u0436\u043D\u043E \u0441\u0434\u0435\u043B\u0430\u0442\u044C \u043B\u044E\u0431\u0443\u044E \u043D\u0443\u0436\u043D\u0443\u044E \u043E\u0434\u0435\u0436\u0434\u0443.","v5: el taller propio usa las mismas animaciones de Quaternius, pasadas a su esqueleto: el reposo de MakeHuman (brazos en \xABA\xBB) se lleva a la postura del origen y en cada fotograma se copia el giro de cada hueso respecto a su reposo. La pelvis copia adem\xE1s los botes y agachadas, escalados por la altura.":"v5: \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u0442\u0435 \u0436\u0435 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0438 Quaternius, \u043F\u0435\u0440\u0435\u043D\u0435\u0441\u0451\u043D\u043D\u044B\u0435 \u043D\u0430 \u0435\u0451 \u0441\u043A\u0435\u043B\u0435\u0442: \u0438\u0441\u0445\u043E\u0434\u043D\u0430\u044F \u043F\u043E\u0437\u0430 MakeHuman (\u0440\u0443\u043A\u0438 \u0431\u0443\u043A\u0432\u043E\u0439 \xABA\xBB) \u043F\u0440\u0438\u0432\u043E\u0434\u0438\u0442\u0441\u044F \u043A \u043F\u043E\u0437\u0435 \u0438\u0441\u0442\u043E\u0447\u043D\u0438\u043A\u0430, \u0438 \u0432 \u043A\u0430\u0436\u0434\u043E\u043C \u043A\u0430\u0434\u0440\u0435 \u043A\u043E\u043F\u0438\u0440\u0443\u0435\u0442\u0441\u044F \u043F\u043E\u0432\u043E\u0440\u043E\u0442 \u043A\u0430\u0436\u0434\u043E\u0439 \u043A\u043E\u0441\u0442\u0438 \u043E\u0442\u043D\u043E\u0441\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u0435\u0451 \u0438\u0441\u0445\u043E\u0434\u043D\u043E\u0439 \u043F\u043E\u0437\u044B. \u0422\u0430\u0437 \u0434\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u043E \u043A\u043E\u043F\u0438\u0440\u0443\u0435\u0442 \u043F\u043E\u0434\u0441\u043A\u043E\u043A\u0438 \u0438 \u043F\u0440\u0438\u0441\u0435\u0434\u0430\u043D\u0438\u044F, \u043C\u0430\u0441\u0448\u0442\u0430\u0431\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u043F\u043E \u0440\u043E\u0441\u0442\u0443.","v5, provisional: en el taller propio solo hay un hombre (t\xFAnica, calzas, barba pintada) y una mujer (vestido y cofia con toca); el pelo, la piel y la ropa a\xFAn no se pueden cambiar. valravnx: \xABdecente para usar de placeholder\xBB. Queda una claridad en la barbilla del hombre.":"v5, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u0432 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u0435\u0441\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u043C\u0443\u0436\u0447\u0438\u043D\u0430 (\u0442\u0443\u043D\u0438\u043A\u0430, \u0448\u043E\u0441\u0441\u044B, \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u043D\u0430\u044F \u0431\u043E\u0440\u043E\u0434\u0430) \u0438 \u0436\u0435\u043D\u0449\u0438\u043D\u0430 (\u043F\u043B\u0430\u0442\u044C\u0435 \u0438 \u0447\u0435\u043F\u0435\u0446 \u0441 \u043F\u043E\u043A\u0440\u044B\u0432\u0430\u043B\u043E\u043C); \u0432\u043E\u043B\u043E\u0441\u044B, \u043A\u043E\u0436\u0443 \u0438 \u043E\u0434\u0435\u0436\u0434\u0443 \u043F\u043E\u043A\u0430 \u043C\u0435\u043D\u044F\u0442\u044C \u043D\u0435\u043B\u044C\u0437\u044F. \u041F\u0435\u0434\u0440\u043E: \xAB\u0441\u043E\u0439\u0434\u0451\u0442 \u043A\u0430\u043A \u0437\u0430\u0433\u043B\u0443\u0448\u043A\u0430\xBB. \u041D\u0430 \u043F\u043E\u0434\u0431\u043E\u0440\u043E\u0434\u043A\u0435 \u0443 \u043C\u0443\u0436\u0447\u0438\u043D\u044B \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0441\u0432\u0435\u0442\u043B\u043E\u0435 \u043F\u044F\u0442\u043D\u043E.","v6, arreglo: en calidad alta la ropa, el pelo y la cofia del taller propio se ve\xEDan del rev\xE9s (valravnx). El cargador de modelos deja sin escribir la profundidad en los materiales con transparencia, y la piel se pintaba encima. Ahora la escriben, y una prueba nueva lo vigila.":"v6, \u0438\u0441\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u0435: \u043F\u0440\u0438 \u0432\u044B\u0441\u043E\u043A\u043E\u043C \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u043E\u0434\u0435\u0436\u0434\u0430, \u0432\u043E\u043B\u043E\u0441\u044B \u0438 \u0447\u0435\u043F\u0435\u0446 \u0438\u0437 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B\u0438 \u0432\u044B\u0432\u0435\u0440\u043D\u0443\u0442\u044B\u043C\u0438 \u043D\u0430\u0438\u0437\u043D\u0430\u043D\u043A\u0443 (\u041F\u0435\u0434\u0440\u043E). \u0417\u0430\u0433\u0440\u0443\u0437\u0447\u0438\u043A \u043C\u043E\u0434\u0435\u043B\u0435\u0439 \u043D\u0435 \u0437\u0430\u043F\u0438\u0441\u044B\u0432\u0430\u0435\u0442 \u0433\u043B\u0443\u0431\u0438\u043D\u0443 \u0434\u043B\u044F \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u043E\u0432 \u0441 \u043F\u0440\u043E\u0437\u0440\u0430\u0447\u043D\u043E\u0441\u0442\u044C\u044E, \u0438 \u043A\u043E\u0436\u0430 \u0440\u0438\u0441\u043E\u0432\u0430\u043B\u0430\u0441\u044C \u043F\u043E\u0432\u0435\u0440\u0445. \u0422\u0435\u043F\u0435\u0440\u044C \u0433\u043B\u0443\u0431\u0438\u043D\u0430 \u0437\u0430\u043F\u0438\u0441\u044B\u0432\u0430\u0435\u0442\u0441\u044F, \u0438 \u0437\u0430 \u044D\u0442\u0438\u043C \u0441\u043B\u0435\u0434\u0438\u0442 \u043D\u043E\u0432\u0430\u044F \u043F\u0440\u043E\u0432\u0435\u0440\u043A\u0430.","v7, taller propio (valravnx: \xABel hombre tiene tetas, el cuerpo doblado hacia delante, los hombros muy para atr\xE1s\xBB): las animaciones del paquete van con el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atr\xE1s, a juego con sus mu\xF1ecos de cabeza grande. Ahora se mide esa inclinaci\xF3n en la animaci\xF3n de estar quieto y se quita (deja un 30 %), los hombros ya no se igualan al paquete y los brazos se giran para colgar rectos. La t\xFAnica del hombre se alisa en el pecho para que caiga como tela y no marque.":"v7, \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0430\u044F \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F (\u041F\u0435\u0434\u0440\u043E: \xAB\u0443 \u043C\u0443\u0436\u0447\u0438\u043D\u044B \u0433\u0440\u0443\u0434\u044C, \u0442\u0435\u043B\u043E \u0441\u043E\u0433\u043D\u0443\u0442\u043E \u0432\u043F\u0435\u0440\u0451\u0434, \u043F\u043B\u0435\u0447\u0438 \u0441\u043B\u0438\u0448\u043A\u043E\u043C \u043E\u0442\u0432\u0435\u0434\u0435\u043D\u044B \u043D\u0430\u0437\u0430\u0434\xBB): \u0432 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u0445 \u043D\u0430\u0431\u043E\u0440\u0430 \u0442\u0443\u043B\u043E\u0432\u0438\u0449\u0435 \u0438 \u0448\u0435\u044F \u043D\u0430\u043A\u043B\u043E\u043D\u0435\u043D\u044B \u0432\u043F\u0435\u0440\u0451\u0434, \u0430 \u0440\u0443\u043A\u0438 \u0432\u0438\u0441\u044F\u0442 \u043E\u0442\u0432\u0435\u0434\u0451\u043D\u043D\u044B\u043C\u0438 \u043D\u0430\u0437\u0430\u0434 \u2014 \u043F\u043E\u0434 \u0435\u0433\u043E \u0431\u043E\u043B\u044C\u0448\u0435\u0433\u043E\u043B\u043E\u0432\u044B\u0435 \u0444\u0438\u0433\u0443\u0440\u043A\u0438. \u0422\u0435\u043F\u0435\u0440\u044C \u044D\u0442\u043E\u0442 \u043D\u0430\u043A\u043B\u043E\u043D \u0438\u0437\u043C\u0435\u0440\u044F\u0435\u0442\u0441\u044F \u0432 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0438 \u0441\u0442\u043E\u0439\u043A\u0438 \u0438 \u0443\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044F (\u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F 30 %), \u043F\u043B\u0435\u0447\u0438 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u043F\u043E\u0434\u0433\u043E\u043D\u044F\u044E\u0442\u0441\u044F \u043F\u043E\u0434 \u043D\u0430\u0431\u043E\u0440, \u0430 \u0440\u0443\u043A\u0438 \u043F\u043E\u0432\u043E\u0440\u0430\u0447\u0438\u0432\u0430\u044E\u0442\u0441\u044F, \u0447\u0442\u043E\u0431\u044B \u0432\u0438\u0441\u0435\u0442\u044C \u043F\u0440\u044F\u043C\u043E. \u0422\u0443\u043D\u0438\u043A\u0430 \u043C\u0443\u0436\u0447\u0438\u043D\u044B \u0440\u0430\u0437\u0433\u043B\u0430\u0436\u0435\u043D\u0430 \u043D\u0430 \u0433\u0440\u0443\u0434\u0438, \u0447\u0442\u043E\u0431\u044B \u043D\u0438\u0441\u043F\u0430\u0434\u0430\u043B\u0430 \u043A\u0430\u043A \u0442\u043A\u0430\u043D\u044C \u0438 \u043D\u0435 \u043E\u0431\u043B\u0435\u0433\u0430\u043B\u0430.","v8: valravnx elige el taller propio como base de los personajes. Primera tanda de ropa por capas, hecha por c\xF3digo: debajo siempre la camisa de lino (en la mujer, larga hasta los tobillos), las calzas y los zapatos; encima, t\xFAnica (hombre) o vestido (mujer), y sobre todo el gambes\xF3n acolchado, con sus canales cosidos pintados. Cada capa va algo m\xE1s separada de la piel que la de debajo.":"v8: \u041F\u0435\u0434\u0440\u043E \u0432\u044B\u0431\u0438\u0440\u0430\u0435\u0442 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0443\u044E \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0443\u044E \u043E\u0441\u043D\u043E\u0432\u043E\u0439 \u0434\u043B\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439. \u041F\u0435\u0440\u0432\u0430\u044F \u043F\u0430\u0440\u0442\u0438\u044F \u043E\u0434\u0435\u0436\u0434\u044B \u0441\u043B\u043E\u044F\u043C\u0438, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u043A\u043E\u0434\u043E\u043C: \u0441\u043D\u0438\u0437\u0443 \u0432\u0441\u0435\u0433\u0434\u0430 \u043B\u044C\u043D\u044F\u043D\u0430\u044F \u0440\u0443\u0431\u0430\u0445\u0430 (\u0443 \u0436\u0435\u043D\u0449\u0438\u043D\u044B \u2014 \u0434\u043E \u0449\u0438\u043A\u043E\u043B\u043E\u0442\u043E\u043A), \u0448\u043E\u0441\u0441\u044B \u0438 \u0431\u0430\u0448\u043C\u0430\u043A\u0438; \u043F\u043E\u0432\u0435\u0440\u0445 \u2014 \u0442\u0443\u043D\u0438\u043A\u0430 (\u043C\u0443\u0436\u0447\u0438\u043D\u0430) \u0438\u043B\u0438 \u043F\u043B\u0430\u0442\u044C\u0435 (\u0436\u0435\u043D\u0449\u0438\u043D\u0430), \u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u0432\u0441\u0435\u0433\u043E \u2014 \u0441\u0442\u0451\u0433\u0430\u043D\u044B\u0439 \u0433\u0430\u043C\u0431\u0435\u0437\u043E\u043D \u0441 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u043D\u044B\u043C\u0438 \u043F\u0440\u043E\u0448\u0438\u0442\u044B\u043C\u0438 \u0448\u0432\u0430\u043C\u0438. \u041A\u0430\u0436\u0434\u044B\u0439 \u0441\u043B\u043E\u0439 \u043E\u0442\u0441\u0442\u043E\u0438\u0442 \u043E\u0442 \u043A\u043E\u0436\u0438 \u0447\u0443\u0442\u044C \u0434\u0430\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u043D\u0438\u0436\u043D\u0438\u0439.","v8, c\xF3mo se ven las capas: lo que queda tapado del todo no se dibuja (el cuerpo de una prenda se esconde si lleva otra encima, y su falda solo asoma si es m\xE1s larga), as\xED no se atraviesan al moverse y se ahorran tri\xE1ngulos. El cintur\xF3n va sobre la capa de m\xE1s fuera.":"v8, \u043A\u0430\u043A \u0432\u0438\u0434\u043D\u044B \u0441\u043B\u043E\u0438: \u0442\u043E, \u0447\u0442\u043E \u0437\u0430\u043A\u0440\u044B\u0442\u043E \u043F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E, \u043D\u0435 \u0440\u0438\u0441\u0443\u0435\u0442\u0441\u044F (\u043A\u043E\u0440\u043F\u0443\u0441 \u043E\u0434\u0435\u0436\u0434\u044B \u0441\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F, \u0435\u0441\u043B\u0438 \u043F\u043E\u0432\u0435\u0440\u0445 \u043D\u0430\u0434\u0435\u0442\u0430 \u0434\u0440\u0443\u0433\u0430\u044F, \u0430 \u0435\u0451 \u043F\u043E\u0434\u043E\u043B \u0432\u0438\u0434\u0435\u043D, \u0442\u043E\u043B\u044C\u043A\u043E \u0435\u0441\u043B\u0438 \u043E\u043D \u0434\u043B\u0438\u043D\u043D\u0435\u0435), \u0442\u0430\u043A \u0441\u043B\u043E\u0438 \u043D\u0435 \u043F\u0440\u043E\u0441\u0442\u0443\u043F\u0430\u044E\u0442 \u0434\u0440\u0443\u0433 \u0441\u043A\u0432\u043E\u0437\u044C \u0434\u0440\u0443\u0433\u0430 \u043F\u0440\u0438 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438 \u0438 \u044D\u043A\u043E\u043D\u043E\u043C\u044F\u0442\u0441\u044F \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438. \u041F\u043E\u044F\u0441 \u043D\u0430\u0434\u0435\u0432\u0430\u0435\u0442\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445 \u0441\u0430\u043C\u043E\u0433\u043E \u0432\u043D\u0435\u0448\u043D\u0435\u0433\u043E \u0441\u043B\u043E\u044F.","v9: cota de malla (hasta la rodilla, mangas hasta medio antebrazo; anillas pintadas por c\xF3digo, metal a medias porque sin reflejos del entorno el metal puro sale negro) y sobreveste sin mangas de lana te\xF1ida, por encima de todo. Cada prenda va partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota.":"v9: \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 (\u0434\u043E \u043A\u043E\u043B\u0435\u043D\u0430, \u0440\u0443\u043A\u0430\u0432\u0430 \u0434\u043E \u0441\u0435\u0440\u0435\u0434\u0438\u043D\u044B \u043F\u0440\u0435\u0434\u043F\u043B\u0435\u0447\u044C\u044F; \u043A\u043E\u043B\u044C\u0446\u0430 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u044B \u043A\u043E\u0434\u043E\u043C, \u043C\u0435\u0442\u0430\u043B\u043B\u0438\u0447\u043D\u043E\u0441\u0442\u044C \u043D\u0430\u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0431\u0435\u0437 \u043E\u0442\u0440\u0430\u0436\u0435\u043D\u0438\u0439 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F \u0447\u0438\u0441\u0442\u044B\u0439 \u043C\u0435\u0442\u0430\u043B\u043B \u0432\u044B\u0433\u043B\u044F\u0434\u0438\u0442 \u0447\u0451\u0440\u043D\u044B\u043C) \u0438 \u0441\u044E\u0440\u043A\u043E \u0431\u0435\u0437 \u0440\u0443\u043A\u0430\u0432\u043E\u0432 \u0438\u0437 \u043A\u0440\u0430\u0448\u0435\u043D\u043E\u0439 \u0448\u0435\u0440\u 441\u043A\u043E\u043C \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u043C)","Acci\xF3n no v\xE1lida.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435.","Acci\xF3n sin autor.":"\u0414\u0435\u0439\u0441\u0442\u0432\u0438\u0435 \u0431\u0435\u0437 \u0430\u0432\u0442\u043E\u0440\u0430.","Acci\xF3n desconocida.":"\u041D\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043D\u043E\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435.","Datos no v\xE1lidos.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435.","Eso no se abre.":"\u042D\u0442\u043E \u043D\u0435 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F.","Cantidad no v\xE1lida.":"\u041D\u0435\u0434\u043E\u043F\u0443\u0441\u0442\u0438\u043C\u043E\u0435 \u043A\u043E\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u043E.","El autor no est\xE1 en el combate.":"\u0410\u0432\u0442\u043E\u0440\u0430 \u043D\u0435\u0442 \u0432 \u0431\u043E\u044E.","El autor est\xE1 fuera de combate.":"\u0410\u0432\u0442\u043E\u0440 \u0432\u044B\u0431\u044B\u043B \u0438\u0437 \u0431\u043E\u044F.","El objetivo no est\xE1 en el combate.":"\u0426\u0435\u043B\u0438 \u043D\u0435\u0442 \u0432 \u0431\u043E\u044E.","Toda acci\xF3n que cambia el mundo (moj\xF3n, colocar, desmontar, muebles, abrir puertas) es un mensaje con autor que la l\xF3gica comprueba y anota; mientras no haya cuentas, el autor es \xABjugador:local\xBB y el registro vive solo en memoria durante la partida (el guardado no cambia).":"\u041A\u0430\u0436\u0434\u043E\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435, \u043C\u0435\u043D\u044F\u044E\u0449\u0435\u0435 \u043C\u0438\u0440 (\u043C\u0435\u0436\u0435\u0432\u043E\u0439 \u043A\u0430\u043C\u0435\u043D\u044C, \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0430, \u0440\u0430\u0437\u0431\u043E\u0440\u043A\u0430, \u043C\u0435\u0431\u0435\u043B\u044C, \u043E\u0442\u043A\u0440\u044B\u0442\u0438\u0435 \u0434\u0432\u0435\u0440\u0435\u0439), \u2014 \u044D\u0442\u043E \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0435 \u0441 \u0430\u0432\u0442\u043E\u0440\u043E\u043C, \u043A\u043E\u0442\u043E\u0440\u043E\u0435 \u043B\u043E\u0433\u0438\u043A\u0430 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u0435\u0442 \u0438 \u0437\u0430\u043F\u0438\u0441\u044B\u0432\u0430\u0435\u0442; \u043F\u043E\u043A\u0430 \u043D\u0435\u0442 \u0443\u0447\u0451\u0442\u043D\u044B\u0445 \u0437\u0430\u043F\u0438\u0441\u0435\u0439, \u0430\u0432\u0442\u043E\u0440 \u2014 \xABjugador:local\xBB, \u0430 \u0436\u0443\u0440\u043D\u0430\u043B \u0445\u0440\u0430\u043D\u0438\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u043F\u0430\u043C\u044F\u0442\u0438 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0438\u0433\u0440\u044B (\u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u043D\u0435 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F).","Prueba de estilo \xB7 v9 (realismo en miniatura; sin el mu\xF1eco por c\xF3digo)":"\u041F\u0440\u043E\u0431\u0430 \u0441\u0442\u0438\u043B\u044F \xB7 v9 (\u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u043D\u044B\u0439 \u0440\u0435\u0430\u043B\u0438\u0437\u043C; \u0431\u0435\u0437 \u0444\u0438\u0433\u0443\u0440\u044B, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u043E\u0439 \u043A\u043E\u0434\u043E\u043C)","v9: se quita el mu\xF1eco hecho por c\xF3digo de la v6 (y sus vistas \xABPersonaje\xBB y \xABCara\xBB y el bot\xF3n \xABQuieto/Andando\xBB): los personajes salen ahora del taller y se ven en el visor de personaje. La escena no cambia; su l\xEDmite vuelve a 50 mil tri\xE1ngulos.":"v9: \u0443\u0431\u0440\u0430\u043D\u0430 \u0444\u0438\u0433\u0443\u0440\u0430, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u043A\u043E\u0434\u043E\u043C \u0432 v6 (\u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u0432\u0438\u0434\u0430\u043C\u0438 \xAB\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\xBB \u0438 \xAB\u041B\u0438\u0446\u043E\xBB \u0438
