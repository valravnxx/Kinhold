\u0422\u0443\u043D\u0438\u043A\u0430 \u043C\u0443\u0436\u0447\u0438\u043D\u044B \u0440\u0430\u0437\u0433\u043B\u0430\u0436\u0435\u043D\u0430 \u043D\u0430 \u0433\u0440\u0443\u0434\u0438, \u0447\u0442\u043E\u0431\u044B \u043D\u0438\u0441\u043F\u0430\u0434\u0430\u043B\u0430 \u043A\u0430\u043A \u0442\u043A\u0430\u043D\u044C \u0438 \u043D\u0435 \u043E\u0431\u043B\u0435\u0433\u0430\u043B\u0430.","v8: valravnx elige el taller propio como base de los personajes. Primera tanda de ropa por capas, hecha por c\xF3digo: debajo siempre la camisa de lino (en la mujer, larga hasta los tobillos), las calzas y los zapatos; encima, t\xFAnica (hombre) o vestido (mujer), y sobre todo el gambes\xF3n acolchado, con sus canales cosidos pintados. Cada capa va algo m\xE1s separada de la piel que la de debajo.":"v8: \u041F\u0435\u0434\u0440\u043E \u0432\u044B\u0431\u0438\u0440\u0430\u0435\u0442 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u0443\u044E \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0443\u044E \u043E\u0441\u043D\u043E\u0432\u043E\u0439 \u0434\u043B\u044F \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439. \u041F\u0435\u0440\u0432\u0430\u044F \u043F\u0430\u0440\u0442\u0438\u044F \u043E\u0434\u0435\u0436\u0434\u044B \u0441\u043B\u043E\u044F\u043C\u0438, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u043A\u043E\u0434\u043E\u043C: \u0441\u043D\u0438\u0437\u0443 \u0432\u0441\u0435\u0433\u0434\u0430 \u043B\u044C\u043D\u044F\u043D\u0430\u044F \u0440\u0443\u0431\u0430\u0445\u0430 (\u0443 \u0436\u0435\u043D\u0449\u0438\u043D\u044B \u2014 \u0434\u043E \u0449\u0438\u043A\u043E\u043B\u043E\u0442\u043E\u043A), \u0448\u043E\u0441\u0441\u044B \u0438 \u0431\u0430\u0448\u043C\u0430\u043A\u0438; \u043F\u043E\u0432\u0435\u0440\u0445 \u2014 \u0442\u0443\u043D\u0438\u043A\u0430 (\u043C\u0443\u0436\u0447\u0438\u043D\u0430) \u0438\u043B\u0438 \u043F\u043B\u0430\u0442\u044C\u0435 (\u0436\u0435\u043D\u0449\u0438\u043D\u0430), \u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u0432\u0441\u0435\u0433\u043E \u2014 \u0441\u0442\u0451\u0433\u0430\u043D\u044B\u0439 \u0433\u0430\u043C\u0431\u0435\u0437\u043E\u043D \u0441 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u043D\u044B\u043C\u0438 \u043F\u0440\u043E\u0448\u0438\u0442\u044B\u043C\u0438 \u0448\u0432\u0430\u043C\u0438. \u041A\u0430\u0436\u0434\u044B\u0439 \u0441\u043B\u043E\u0439 \u043E\u0442\u0441\u0442\u043E\u0438\u0442 \u043E\u0442 \u043A\u043E\u0436\u0438 \u0447\u0443\u0442\u044C \u0434\u0430\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u043D\u0438\u0436\u043D\u0438\u0439.","v8, c\xF3mo se ven las capas: lo que queda tapado del todo no se dibuja (el cuerpo de una prenda se esconde si lleva otra encima, y su falda solo asoma si es m\xE1s larga), as\xED no se atraviesan al moverse y se ahorran tri\xE1ngulos. El cintur\xF3n va sobre la capa de m\xE1s fuera.":"v8, \u043A\u0430\u043A \u0432\u0438\u0434\u043D\u044B \u0441\u043B\u043E\u0438: \u0442\u043E, \u0447\u0442\u043E \u0437\u0430\u043A\u0440\u044B\u0442\u043E \u043F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E, \u043D\u0435 \u0440\u0438\u0441\u0443\u0435\u0442\u0441\u044F (\u043A\u043E\u0440\u043F\u0443\u0441 \u043E\u0434\u0435\u0436\u0434\u044B \u0441\u043A\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F, \u0435\u0441\u043B\u0438 \u043F\u043E\u0432\u0435\u0440\u0445 \u043D\u0430\u0434\u0435\u0442\u0430 \u0434\u0440\u0443\u0433\u0430\u044F, \u0430 \u0435\u0451 \u043F\u043E\u0434\u043E\u043B \u0432\u0438\u0434\u0435\u043D, \u0442\u043E\u043B\u044C\u043A\u043E \u0435\u0441\u043B\u0438 \u043E\u043D \u0434\u043B\u0438\u043D\u043D\u0435\u0435), \u0442\u0430\u043A \u0441\u043B\u043E\u0438 \u043D\u0435 \u043F\u0440\u043E\u0441\u0442\u0443\u043F\u0430\u044E\u0442 \u0434\u0440\u0443\u0433 \u0441\u043A\u0432\u043E\u0437\u044C \u0434\u0440\u0443\u0433\u0430 \u043F\u0440\u0438 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438 \u0438 \u044D\u043A\u043E\u043D\u043E\u043C\u044F\u0442\u0441\u044F \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438. \u041F\u043E\u044F\u0441 \u043D\u0430\u0434\u0435\u0432\u0430\u0435\u0442\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445 \u0441\u0430\u043C\u043E\u0433\u043E \u0432\u043D\u0435\u0448\u043D\u0435\u0433\u043E \u0441\u043B\u043E\u044F.","v9: cota de malla (hasta la rodilla, mangas hasta medio antebrazo; anillas pintadas por c\xF3digo, metal a medias porque sin reflejos del entorno el metal puro sale negro) y sobreveste sin mangas de lana te\xF1ida, por encima de todo. Cada prenda va partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota.":"v9: \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 (\u0434\u043E \u043A\u043E\u043B\u0435\u043D\u0430, \u0440\u0443\u043A\u0430\u0432\u0430 \u0434\u043E \u0441\u0435\u0440\u0435\u0434\u0438\u043D\u044B \u043F\u0440\u0435\u0434\u043F\u043B\u0435\u0447\u044C\u044F; \u043A\u043E\u043B\u044C\u0446\u0430 \u043D\u0430\u0440\u0438\u0441\u043E\u0432\u0430\u043D\u044B \u043A\u043E\u0434\u043E\u043C, \u043C\u0435\u0442\u0430\u043B\u043B\u0438\u0447\u043D\u043E\u0441\u0442\u044C \u043D\u0430\u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0431\u0435\u0437 \u043E\u0442\u0440\u0430\u0436\u0435\u043D\u0438\u0439 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F \u0447\u0438\u0441\u0442\u044B\u0439 \u043C\u0435\u0442\u0430\u043B\u043B \u0432\u044B\u0433\u043B\u044F\u0434\u0438\u0442 \u0447\u0451\u0440\u043D\u044B\u043C) \u0438 \u0441\u044E\u0440\u043A\u043E \u0431\u0435\u0437 \u0440\u0443\u043A\u0430\u0432\u043E\u0432 \u0438\u0437 \u043A\u0440\u0430\u0448\u0435\u043D\u043E\u0439 \u0448\u0435\u0440\u0441\u0442\u0438, \u043F\u043E\u0432\u0435\u0440\u0445 \u0432\u0441\u0435\u0433\u043E. \u041A\u0430\u0436\u0434\u0430\u044F \u0432\u0435\u0449\u044C \u0440\u0430\u0437\u0434\u0435\u043B\u0435\u043D\u0430 \u043D\u0430 \u043A\u043E\u0440\u043F\u0443\u0441, \u0440\u0443\u043A\u0430\u0432\u0430 \u0438 \u043F\u043E\u0434\u04 u0442 \u0443\u0447\u0451\u0442\u043D\u044B\u0445 \u0437\u0430\u043F\u0438\u0441\u0435\u0439, \u0430\u0432\u0442\u043E\u0440 \u2014 \xABjugador:local\xBB, \u0430 \u0436\u0443\u0440\u043D\u0430\u043B \u0445\u0440\u0430\u043D\u0438\u0442\u0441\u044F \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u043F\u0430\u043C\u044F\u0442\u0438 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u0438\u0433\u0440\u044B (\u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u0435 \u043D\u0435 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F).","Prueba de estilo \xB7 v9 (realismo en miniatura; sin el mu\xF1eco por c\xF3digo)":"\u041F\u0440\u043E\u0431\u0430 \u0441\u0442\u0438\u043B\u044F \xB7 v9 (\u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u043D\u044B\u0439 \u0440\u0435\u0430\u043B\u0438\u0437\u043C; \u0431\u0435\u0437 \u0444\u0438\u0433\u0443\u0440\u044B, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u043E\u0439 \u043A\u043E\u0434\u043E\u043C)","v9: se quita el mu\xF1eco hecho por c\xF3digo de la v6 (y sus vistas \xABPersonaje\xBB y \xABCara\xBB y el bot\xF3n \xABQuieto/Andando\xBB): los personajes salen ahora del taller y se ven en el visor de personaje. La escena no cambia; su l\xEDmite vuelve a 50 mil tri\xE1ngulos.":"v9: \u0443\u0431\u0440\u0430\u043D\u0430 \u0444\u0438\u0433\u0443\u0440\u0430, \u0441\u0434\u0435\u043B\u0430\u043D\u043D\u0430\u044F \u043A\u043E\u0434\u043E\u043C \u0432 v6 (\u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u0432\u0438\u0434\u0430\u043C\u0438 \xAB\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\xBB \u0438 \xAB\u041B\u0438\u0446\u043E\xBB \u0438 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u0421\u0442\u043E\u0438\u0442/\u0418\u0434\u0451\u0442\xBB): \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0442\u0435\u043F\u0435\u0440\u044C \u0434\u0435\u043B\u0430\u044E\u0442\u0441\u044F \u0432 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u0438 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0432 \u043F\u0440\u043E\u0441\u043C\u043E\u0442\u0440\u0449\u0438\u043A\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430. \u0421\u0446\u0435\u043D\u0430 \u043D\u0435 \u043C\u0435\u043D\u044F\u0435\u0442\u0441\u044F; \u0435\u0451 \u043F\u0440\u0435\u0434\u0435\u043B \u0441\u043D\u043E\u0432\u0430 50 \u0442\u044B\u0441\u044F\u0447 \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u043E\u0432.","v7: tambi\xE9n en ingl\xE9s, con el bot\xF3n ES/EN arriba como en la construcci\xF3n y el combate (recuerda el idioma elegido, tambi\xE9n el de la web).":"v7: \u0442\u0430\u043A\u0436\u0435 \u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C, \u0441 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 ES/EN \u0432\u0432\u0435\u0440\u0445\u0443, \u043A\u0430\u043A \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0438 \u0431\u043E\u044E (\u0437\u0430\u043F\u043E\u043C\u0438\u043D\u0430\u0435\u0442 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u044F\u0437\u044B\u043A, \u0438 \u044F\u0437\u044B\u043A \u0441\u0430\u0439\u0442\u0430 \u0442\u043E\u0436\u0435).","Hito 1 \xB7 v9":"\u042D\u0442\u0430\u043F 1 \xB7 v9","Combate \xB7 v7":"\u0411\u043E\u0439 \xB7 v7","v9: escena com\xFAn del estilo elegido (src/mundo/): mismo cielo, sol, sombras blandas, niebla, suelo con textura, bosque, hierba, flores y rocas que la prueba de estilo. La hierba empieza a 16 m de la salida, porque dentro se construye y asomar\xEDa por los cimientos (provisional, hasta que la hierba se aparte sola bajo lo construido).":"v9: \u043E\u0431\u0449\u0430\u044F \u0441\u0446\u0435\u043D\u0430 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (src/mundo/): \u0442\u043E \u0436\u0435 \u043D\u0435\u0431\u043E, \u0441\u043E\u043B\u043D\u0446\u0435, \u043C\u044F\u0433\u043A\u0438\u0435 \u0442\u0435\u043D\u0438, \u0442\u0443\u043C\u0430\u043D, \u0437\u0435\u043C\u043B\u044F \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439, \u043B\u0435\u0441, \u0442\u0440\u0430\u0432\u0430, \u0446\u0432\u0435\u0442\u044B \u0438 \u043A\u0430\u043C\u043D\u0438, \u0447\u0442\u043E \u0438 \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F. \u0422\u0440\u0430\u0432\u0430 \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0441\u044F \u0432 16 \u043C \u043E\u0442 \u043C\u0435\u0441\u0442\u0430 \u043F\u043E\u044F\u0432\u043B\u0435\u043D\u0438\u044F, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0432\u043D\u0443\u0442\u0440\u0438 \u0441\u0442\u0440\u043E\u044F\u0442, \u0438 \u043E\u043D\u0430 \u043F\u0440\u043E\u0441\u0442\u0443\u043F\u0430\u043B\u0430 \u0431\u044B \u0441\u043A\u0432\u043E\u0437\u044C \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B (\u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E, \u043F\u043E\u043A\u0430 \u0442\u0440\u0430\u0432\u0430 \u0441\u0430\u043C\u0430 \u043D\u0435 \u0431\u0443\u0434\u0435\u0442 \u0443\u0431\u0438\u0440\u0430\u0442\u044C\u0441\u044F \u043F\u043E\u0434 \u043F\u043E\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u043C\u0438).","v7: escena com\xFAn del estilo elegido (src/mundo/): mismo cielo, sol, sombras blandas, niebla, suelo con textura, bosque, hierba, flores y rocas que la prueba de estilo, con la liza de tierra pisada en el centro.":"v7: \u043E\u0431\u0449\u0430\u044F \u0441\u0446\u0435\u043D\u0430 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u043C \u0441\u0442\u0438\u043B\u0435 (src/mundo/): \u0442\u043E \u0436\u0435 \u043D\u0435\u0431\u043E, \u0441\u043E\u043B\u043D\u0446\u0435, \u043C\u044F\u0433\u043A\u0438\u0435 \u0442\u0435\u043D\u0438, \u0442\u0443\u043C\u0430\u043D, \u0437\u0435\u043C\u043B\u044F \u0441 \u0442\u0435\u043A\u0441\u0442\u0443\u0440\u043E\u0439, \u043B\u0435\u0441, \u0442\u0440\u0430\u0432\u0430, \u0446\u0432\u0435\u0442\u044B \u0438 \u043A\u0430\u043C\u043D\u0438, \u0447\u0442\u043E \u0438 \u0432 \u043F\u0440\u043E\u0431\u0435 \u0441\u0442\u0438\u043B\u044F, \u0441 \u043F\u043B\u043E\u0449\u0430\u0434\u043A\u043E\u0439 \u0443\u0442\u043E\u043F\u0442\u0430\u043D\u043D\u043E\u0439 \u0437\u0435\u043C\u043B\u0438 \u0434\u043B\u044F \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430 \u0432 \u0446\u0435\u043D\u0442\u0440\u0435.","Hito 1 \xB7 v10":"\u042D\u0442\u0430\u043F 1 \xB7 v10","Talas el \xE1rbol (de momento solo el gesto: la madera llega con la recolecci\xF3n).":"\u0412\u044B \u0440\u0443\u0431\u0438\u0442\u0435 \u0434\u0435\u0440\u0435\u0432\u043E (\u043F\u043E\u043A\u0430 \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435: \u0434\u0440\u0435\u0432\u0435\u0441\u0438\u043D\u0430 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u0441\u043E \u0441\u0431\u043E\u0440\u043E\u043C \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432).","v10: junto a un \xE1rbol, Usar (F) hace que el personaje tale; moverse lo para. De momento es solo el gesto, sin hacha en la mano y sin dar madera: recolectar llega con el hito 2.":"v10: \u0440\u044F\u0434\u043E\u043C \u0441 \u0434\u0435\u0440\u0435\u0432\u043E\u043C \xAB\u0418\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C\xBB (F) \u0437\u0430\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0440\u0443\u0431\u0438\u0442\u044C; \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u043F\u0440\u0435\u0440\u044B\u0432\u0430\u0435\u0442 \u044D\u0442\u043E. \u041F\u043E\u043A\u0430 \u044D\u0442\u043E \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435, \u0431\u0435\u0437 \u0442\u043E\u043F\u043E\u0440\u0430 \u0432 \u0440\u0443\u043A\u0435 \u0438 \u0431\u0435\u0437 \u0434\u0440\u0435\u0432\u0435\u0441\u0438\u043D\u044B: \u0441\u0431\u043E\u0440 \u0440\u0435\u0441\u0443\u0440\u0441\u043E\u0432 \u043F\u043E\u044F\u0432\u0438\u0442\u0441\u044F \u043D\u0430 \u044D\u0442\u0430\u043F\u0435 2.","v10: el jugador es el personaje del taller propio (el de MakeHuman vestido por c\xF3digo), con camisa y calzas de lino, como se empieza seg\xFAn el GDD. Lleva zapatos aunque el GDD dice descalzo: el cuerpo del taller no tiene pies bajo los zapatos y sin ellos se ver\xEDa sin pies (queda como tarea del taller). Anda, corre y tala con las animaciones de Quaternius, que se aceleran con la velocidad hasta 1,6\xD7 (a la carrera los pies resbalan algo: el juego va m\xE1s r\xE1pido que la animaci\xF3n). Mientras carga se ve el mu\xF1eco de antes.":"v10: \u0438\u0433\u0440\u043E\u043A \u2014 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0438\u0437 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (\u0442\u0435\u043B\u043E MakeHuman, \u043E\u0434\u0435\u0442\u043E\u0435 \u043A\u043E\u0434\u043E\u043C), \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445, \u043A\u0430\u043A \u043F\u043E GDD \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0441\u044F \u0438\u0433\u0440\u0430. \u041D\u0430 \u043D\u0451\u043C \u0431\u0430\u0448\u043C\u0430\u043A\u0438, \u0445\u043E\u0442\u044F \u043F\u043E GDD \u043E\u043D \u0431\u043E\u0441\u043E\u0439: \u0443 \u0442\u0435\u043B\u0430 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u043D\u0435\u0442 \u0441\u0442\u0443\u043F\u043D\u0435\u0439 \u043F\u043E\u0434 \u0431\u0430\u0448\u043C\u0430\u043A\u0430\u043C\u0438, \u0438 \u0431\u0435\u0437 \u043D\u0438\u0445 \u043E\u043D \u0432\u044B\u0433\u043B\u044F\u0434\u0435\u043B \u0431\u044B \u0431\u0435\u0437 \u043D\u043E\u0433 (\u044D\u0442\u043E \u043E\u0441\u0442\u0430\u043B\u043E\u0441\u044C \u0437\u0430\u0434\u0430\u0447\u0435\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439). \u041E\u043D \u0445\u043E\u0434\u0438\u0442, \u0431\u0435\u0433\u0430\u0435\u0442 \u0438 \u0440\u0443\u0431\u0438\u0442 \u0441 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u043C\u0438 Quaternius, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0443\u0441\u043A\u043E\u0440\u044F\u044E\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441\u043E \u0441\u043A\u043E\u0440\u043E\u0441\u0442\u044C\u044E \u0434\u043E 1,6\xD7 (\u043D\u0430 \u0431\u0435\u0433\u0443 \u043D\u043E\u0433\u0438 \u043D\u0435\u043C\u043D\u043E\u0433\u043E \u0441\u043A\u043E\u043B\u044C\u0437\u044F\u0442: \u0438\u0433\u0440\u0430 \u0431\u044B\u0441\u0442\u0440\u0435\u0435 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0438). \u041F\u043E\u043A\u0430 \u043E\u043D \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u0432\u0438\u0434\u0435\u043D \u043F\u0440\u0435\u0436\u043D\u0438\u0439 \u043C\u0430\u043D\u0435\u043A\u0435\u043D.","Combate \xB7 v8":"\u0411\u043E\u0439 \xB7 v8","v8: los dos luchadores son el personaje del taller propio (MakeHuman vestido por capas). La armadura del duelo son las capas del taller: lino = camisa y calzas, gambes\xF3n = gambes\xF3n, cota de malla = cota encima del gambes\xF3n. Mientras carga se ve el mu\xF1eco de antes.":"v8: \u043E\u0431\u0430 \u0431\u043E\u0439\u0446\u0430 \u2014 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0438\u0437 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (MakeHuman, \u043E\u0434\u0435\u0442\u044B\u0439 \u0441\u043B\u043E\u044F\u043C\u0438). \u0414\u043E\u0441\u043F\u0435\u0445 \u0432 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0435 \u2014 \u044D\u0442\u043E \u0441\u043B\u043E\u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439: \u043B\u0451\u043D = \u0440\u0443\u0431\u0430\u0445\u0430 \u0438 \u0448\u043E\u0441\u0441\u044B, \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0430 = \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0430, \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 = \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0430 \u043F\u043E\u0432\u0435\u0440\u0445 \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0438. \u041F\u043E\u043A\u0430 \u043E\u043D \u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F, \u0432\u0438\u0434\u0435\u043D \u043F\u0440\u0435\u0436\u043D\u0438\u0439 \u043C\u0430\u043D\u0435\u043A\u0435\u043D.","v8: las piernas y el cuerpo van con las animaciones del taller (guardia de espada quieto, andar y correr); los brazos se colocan cada fotograma con cinem\xE1tica inversa para que las manos agarren el arma donde la ponen las poses de siempre. Si el brazo no llega (estocada a fondo), el arma se queda en la mano en vez de flotar. La mano izquierda copia el pu\xF1o cerrado de la derecha. Los golpes siguen siendo los de antes; los de las cinco direcciones con animaci\xF3n propia son otra tarea del duelo.":"v8: \u043D\u043E\u0433\u0438 \u0438 \u0442\u0435\u043B\u043E \u0434\u0432\u0438\u0433\u0430\u044E\u0442\u0441\u044F \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u043C\u0438 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 (\u0441\u0442\u043E\u0439\u043A\u0430 \u0441 \u043C\u0435\u0447\u043E\u043C \u043D\u0430 \u043C\u0435\u0441\u0442\u0435, \u0445\u043E\u0434\u044C\u0431\u0430 \u0438 \u0431\u0435\u0433); \u0440\u0443\u043A\u0438 \u043A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440 \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u043E\u0431\u0440\u0430\u0442\u043D\u043E\u0439 \u043A\u0438\u043D\u0435\u043C\u0430\u0442\u0438\u043A\u043E\u0439, \u0447\u0442\u043E\u0431\u044B \u043A\u0438\u0441\u0442\u0438 \u0434\u0435\u0440\u0436\u0430\u043B\u0438 \u043E\u0440\u0443\u0436\u0438\u0435 \u0442\u0430\u043C, \u0433\u0434\u0435 \u0435\u0433\u043E \u0441\u0442\u0430\u0432\u044F\u0442 \u043F\u0440\u0435\u0436\u043D\u0438\u0435 \u043F\u043E\u0437\u044B. \u0415\u0441\u043B\u0438 \u0440\u0443\u043A\u0430 \u043D\u0435 \u0434\u043E\u0442\u044F\u0433\u0438\u0432\u0430\u0435\u0442\u0441\u044F (\u0433\u043B\u0443\u0431\u043E\u043A\u0438\u0439 \u0443\u043A\u043E\u043B), \u043E\u0440\u0443\u0436\u0438\u0435 \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0432 \u0440\u0443\u043A\u0435, \u0430 \u043D\u0435 \u0432\u0438\u0441\u0438\u0442 \u0432 \u0432\u043E\u0437\u0434\u0443\u0445\u0435. \u041B\u0435\u0432\u0430\u044F \u043A\u0438\u0441\u0442\u044C \u043F\u043E\u0432\u0442\u043E\u0440\u044F\u0435\u0442 \u0441\u0436\u0430\u0442\u044B\u0439 \u043A\u0443\u043B\u0430\u043A \u043F\u0440\u0430\u0432\u043E\u0439. \u0423\u0434\u0430\u0440\u044B \u043F\u043E\u043A\u0430 \u043F\u0440\u0435\u0436\u043D\u0438\u0435; \u0443\u0434\u0430\u0440\u044B \u0432 \u043F\u044F\u0442\u0438 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u0438\u044F\u0445 \u0441\u043E \u0441\u0432\u043E\u0435\u0439 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u0435\u0439 \u2014 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u0430\u044F \u0437\u0430\u0434\u0430\u0447\u0430 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430.","v8: las heridas se pintan como antes (mancha de sangre o morat\xF3n, m\xE1s grande cuanto m\xE1s grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, as\xED que siguen al personaje al moverse. Las dos figuras son el hombre del taller; las distingue la cinta (azul la tuya, amarilla la del rival). Cojear ya no se ve: lo hac\xEDa el mu\xF1eco y las animaciones del taller no lo traen.":"v8: \u0440\u0430\u043D\u044B \u0440\u0438\u0441\u0443\u044E\u0442\u0441\u044F \u043A\u0430\u043A \u0440\u0430\u043D\u044C\u0448\u0435 (\u043F\u044F\u0442\u043D\u043E \u043A\u0440\u043E\u0432\u0438 \u0438\u043B\u0438 \u0441\u0438\u043D\u044F\u043A, \u0442\u0435\u043C \u0431\u043E\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u0442\u044F\u0436\u0435\u043B\u0435\u0435), \u043D\u043E \u043F\u0440\u0438\u043B\u0435\u043F\u043B\u0435\u043D\u044B \u043A \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u043E\u0441\u0442\u0438 \u0442\u0435\u043B\u0430 \u0438\u043B\u0438 \u043E\u0434\u0435\u0436\u0434\u044B \u0442\u0430\u043C, \u043A\u0443\u0434\u0430 \u043F\u0440\u0438\u0448\u0451\u043B\u0441\u044F \u0443\u0434\u0430\u0440, \u0438 \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u044B \u043A \u043A\u043E\u0441\u0442\u0438, \u0442\u0430\u043A \u0447\u0442\u043E \u0441\u043B\u0435\u0434\u0443\u044E\u0442 \u0437\u0430 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0432 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438. \u041E\u0431\u0435 \u0444\u0438\u0433\u0443\u0440\u044B \u2014 \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439; \u0440\u0430\u0437\u043B\u0438\u0447\u0430\u0435\u0442 \u0438\u0445 \u043B\u0435\u043D\u0442\u0430 (\u0442\u0432\u043E\u044F \u0441\u0438\u043D\u044F\u044F, \u0443 \u0441\u043E\u043F\u0435\u0440\u043D\u0438\u043A\u0430 \u0436\u0451\u043B\u0442\u0430\u044F). \u0425\u0440\u043E\u043C\u043E\u0442\u0430 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0432\u0438\u0434\u043D\u0430: \u0435\u0451 \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u043B \u043C\u0430\u043D\u0435\u043A\u0435\u043D, \u0430 \u0432 \u0430\u043D\u0438\u043C\u0430\u0446\u0438\u044F\u0445 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439 \u0435\u0451 \u043D\u0435\u0442.",Men\u00FA:"\u041C\u0435\u043D\u044E",KINHOLD:"KINHOLD","Demo: supervivencia medieval. Elige qu\xE9 quieres probar.":"\u0414\u0435\u043C\u043E: \u0441\u0440\u0435\u0434\u043D\u0435\u0432\u0435\u043A\u043E\u0432\u043E\u0435 \u0432\u044B\u0436\u0438\u0432\u0430\u043D\u0438\u0435. \u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435, \u0447\u0442\u043E \u0445\u043E\u0442\u0438\u0442\u0435 \u043F\u043E\u043F\u0440\u043E\u0431\u043E\u0432\u0430\u0442\u044C.","Levanta una caba\xF1a: cimientos, suelos, muros, tejados y muebles.":"\u041F\u043E\u0441\u0442\u0440\u043E\u0439\u0442\u0435 \u0445\u0438\u0436\u0438\u043D\u0443: \u0444\u0443\u043D\u0434\u0430\u043C\u0435\u043D\u0442\u044B, \u043F\u043E\u043B\u044B, \u0441\u0442\u0435\u043D\u044B, \u043A\u0440\u044B\u0448\u0438 \u0438 \u043C\u0435\u0431\u0435\u043B\u044C.","Combate de habilidad con espada o palo, pr\xE1cticas y carga a distancia.":"\u0411\u043E\u0439 \u043D\u0430 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u0442\u0432\u043E \u0441 \u043C\u0435\u0447\u043E\u043C \u0438\u043B\u0438 \u043F\u0430\u043B\u043A\u043E\u0439, \u0442\u0440\u0435\u043D\u0438\u0440\u043E\u0432\u043A\u0438 \u0438 \u0430\u0442\u0430\u043A\u0430 \u0441 \u0440\u0430\u0437\u0431\u0435\u0433\u0430.","Elige cuerpo y ropa por capas: es el que construye y el que lucha.":"\u0412\u044B\u0431\u0435\u0440\u0438\u0442\u0435 \u0442\u0435\u043B\u043E \u0438 \u043E\u0434\u0435\u0436\u0434\u0443 \u043F\u043E \u0441\u043B\u043E\u044F\u043C: \u044D\u0442\u043E\u0442 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0441\u0442\u0440\u043E\u0438\u0442 \u0438 \u0441\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F.","Progreso del proyecto":"\u0425\u043E\u0434 \u043F\u0440\u043E\u0435\u043A\u0442\u0430","A\xFAn no has elegido personaje: hombre con camisa y calzas de lino.":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0435\u0449\u0451 \u043D\u0435 \u0432\u044B\u0431\u0440\u0430\u043D: \u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445.","Tu personaje: {s}, con {r}.":"\u0412\u0430\u0448 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436: {s}, \u043E\u0434\u0435\u0436\u0434\u0430: {r}.",mujer:"\u0436\u0435\u043D\u0449\u0438\u043D\u0430",hombre:"\u043C\u0443\u0436\u0447\u0438\u043D\u0430","camisa y calzas":"\u0440\u0443\u0431\u0430\u0445\u0430 \u0438 \u0448\u043E\u0441\u0441\u044B","Demo \xFAnica \xB7 v1 (Construir, Duelo y Personaje en una sola p\xE1gina)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v1 (\u0421\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E, \u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A \u0438 \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u043D\u0430 \u043E\u0434\u043D\u043E\u0439 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0435)","v1: una sola p\xE1gina con men\xFA: Construir, Duelo y Personaje. Cada parte es el \xFAltimo prototipo de cada cosa (construcci\xF3n v10, combate v8, personaje v11), con la misma escena y el mismo personaje del taller. Las versiones antiguas de cada prototipo siguen en la web.":"v1: \u043E\u0434\u043D\u0430 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430 \u0441 \u043C\u0435\u043D\u044E: \u0421\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E, \u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A \u0438 \u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436. \u041A\u0430\u0436\u0434\u0430\u044F \u0447\u0430\u0441\u0442\u044C \u2014 \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0439 \u043F\u0440\u043E\u0442\u043E\u0442\u0438\u043F (\u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E v10, \u0431\u043E\u0439 v8, \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 v11), \u0441 \u0442\u043E\u0439 \u0436\u0435 \u0441\u0446\u0435\u043D\u043E\u0439 \u0438 \u0442\u0435\u043C \u0436\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u043C \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439. \u0421\u0442\u0430\u0440\u044B\u0435 \u0432\u0435\u0440\u0441\u0438\u0438 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u043F\u0440\u043E\u0442\u043E\u0442\u0438\u043F\u0430 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043D\u0430 \u0441\u0430\u0439\u0442\u0435.","v1, c\xF3mo se cambia de parte: el bot\xF3n \xABMen\xFA\xBB de arriba vuelve al men\xFA y la p\xE1gina se recarga. As\xED cada parte empieza limpia y en el m\xF3vil nunca hay dos escenas a la vez gastando memoria. Lo construido, las opciones del duelo y el personaje se guardan en el navegador y siguen ah\xED al volver.":"v1, \u043A\u0430\u043A \u043F\u0435\u0440\u0435\u043A\u043B\u044E\u0447\u0430\u0442\u044C\u0441\u044F: \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u041C\u0435\u043D\u044E\xBB \u0432\u0432\u0435\u0440\u0445\u0443 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442 \u0432 \u043C\u0435\u043D\u044E, \u0438 \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u0430 \u043F\u0435\u0440\u0435\u0437\u0430\u0433\u0440\u0443\u0436\u0430\u0435\u0442\u0441\u044F. \u0422\u0430\u043A \u043A\u0430\u0436\u0434\u0430\u044F \u0447\u0430\u0441\u0442\u044C \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0441\u044F \u0441 \u0447\u0438\u0441\u0442\u043E\u0433\u043E \u043B\u0438\u0441\u0442\u0430, \u0438 \u0432 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u0431\u044B\u0432\u0430\u0435\u0442 \u0434\u0432\u0443\u0445 \u0441\u0446\u0435\u043D \u0441\u0440\u0430\u0437\u0443, \u0437\u0430\u043D\u0438\u043C\u0430\u044E\u0449\u0438\u0445 \u043F\u0430\u043C\u044F\u0442\u044C. \u041F\u043E\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u043E\u0435, \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0430 \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0441\u043E\u0445\u0440\u0430\u043D\u044F\u044E\u0442\u0441\u044F \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 \u0438 \u043E\u0441\u0442\u0430\u044E\u0442\u0441\u044F \u043F\u0440\u0438 \u0432\u043E\u0437\u0432\u0440\u0430\u0449\u0435\u043D\u0438\u0438.","v1: el personaje que eliges en \xABPersonaje\xBB (hombre o mujer y su ropa por capas) es el que construye y el que lucha. Por ahora el taller solo cambia el cuerpo y la ropa; pelo, piel y cara vendr\xE1n con la personalizaci\xF3n.":"v1: \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436, \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u0432 \xAB\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\xBB (\u043C\u0443\u0436\u0447\u0438\u043D\u0430 \u0438\u043B\u0438 \u0436\u0435\u043D\u0449\u0438\u043D\u0430 \u0438 \u043E\u0434\u0435\u0436\u0434\u0430 \u043F\u043E \u0441\u043B\u043E\u044F\u043C), \u2014 \u044D\u0442\u043E \u0442\u043E\u0442, \u043A\u0442\u043E \u0441\u0442\u0440\u043E\u0438\u0442 \u0438 \u0441\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F. \u041F\u043E\u043A\u0430 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u0430\u044F \u043C\u0435\u043D\u044F\u0435\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0442\u0435\u043B\u043E \u0438 \u043E\u0434\u0435\u0436\u0434\u0443; \u0432\u043E\u043B\u043E\u0441\u044B, \u043A\u043E\u0436\u0430 \u0438 \u043B\u0438\u0446\u043E \u043F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u043E\u0439 \u0432\u043D\u0435\u0448\u043D\u043E\u0441\u0442\u0438.","v1, provisional: si nunca has elegido personaje, en la construcci\xF3n sales con camisa y calzas de lino, como empieza el GDD. Si lo has elegido, sales con la ropa que elegiste (aunque sea una cota de malla): es una demo para ver el personaje en todo, no la partida de supervivencia.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u0435\u0441\u043B\u0438 \u0432\u044B \u043D\u0438 \u0440\u0430\u0437\u0443 \u043D\u0435 \u0432\u044B\u0431\u0438\u0440\u0430\u043B\u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430, \u0432 \u0441\u0442\u0440\u043E\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u0435 \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0432 \u043B\u044C\u043D\u044F\u043D\u043E\u0439 \u0440\u0443\u0431\u0430\u0445\u0435 \u0438 \u0448\u043E\u0441\u0441\u0430\u0445, \u043A\u0430\u043A \u0441\u043A\u0430\u0437\u0430\u043D\u043E \u0432 GDD. \u0415\u0441\u043B\u0438 \u0432\u044B\u0431\u0440\u0430\u043B\u0438, \u0432\u044B \u043D\u0430\u0447\u0438\u043D\u0430\u0435\u0442\u0435 \u0432 \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u043E\u0439 \u043E\u0434\u0435\u0436\u0434\u0435 (\u0434\u0430\u0436\u0435 \u0432 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0435): \u044D\u0442\u043E \u0434\u0435\u043C\u043E, \u0447\u0442\u043E\u0431\u044B \u0432\u0438\u0434\u0435\u0442\u044C \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0430 \u0432\u0435\u0437\u0434\u0435, \u0430 \u043D\u0435 \u0438\u0433\u0440\u0430 \u043D\u0430 \u0432\u044B\u0436\u0438\u0432\u0430\u043D\u0438\u0435.","v1, provisional: en el duelo manda la armadura elegida en sus opciones, porque lo que se ve es lo que protege. Con \xABlino\xBB llevas tu ropa sin gambes\xF3n ni cota; con gambes\xF3n o cota, esas piezas y, si la elegiste, la sobreveste encima. El rival sigue siendo el hombre de siempre.":"v1, \u0432\u0440\u0435\u043C\u0435\u043D\u043D\u043E: \u0432 \u043F\u043E\u0435\u0434\u0438\u043D\u043A\u0435 \u0433\u043B\u0430\u0432\u043D\u043E\u0435 \u2014 \u0434\u043E\u0441\u043F\u0435\u0445, \u0432\u044B\u0431\u0440\u0430\u043D\u043D\u044B\u0439 \u0432 \u0435\u0433\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430\u0445, \u043F\u043E\u0442\u043E\u043C\u0443 \u0447\u0442\u043E \u0447\u0442\u043E \u0432\u0438\u0434\u043D\u043E, \u0442\u043E \u0438 \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442. \u0421 \xAB\u043B\u044C\u043D\u043E\u043C\xBB \u0432\u044B \u0432 \u0441\u0432\u043E\u0435\u0439 \u043E\u0434\u0435\u0436\u0434\u0435 \u0431\u0435\u0437 \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u0438 \u0438 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u0438; \u0441\u043E \u0441\u0442\u0451\u0433\u0430\u043D\u043A\u043E\u0439 \u0438\u043B\u0438 \u043A\u043E\u043B\u044C\u0447\u0443\u0433\u043E\u0439 \u2014 \u0432 \u043D\u0438\u0445 \u0438, \u0435\u0441\u043B\u0438 \u0432\u044B\u0431\u0440\u0430\u043B\u0438, \u0432 \u0441\u044E\u0440\u043A\u043E \u043F\u043E\u0432\u0435\u0440\u0445. \u0421\u043E\u043F\u0435\u0440\u043D\u0438\u043A \u2014 \u0432\u0441\u0451 \u0442\u043E\u0442 \u0436\u0435 \u043C\u0443\u0436\u0447\u0438\u043D\u0430.",Rendimiento:"\u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C","{f} fps":"{f} \u043A/\u0441","este navegador no la dice":"\u044D\u0442\u043E\u0442 \u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0435\u0451 \u043D\u0435 \u0441\u043E\u043E\u0431\u0449\u0430\u0435\u0442","{n} MB":"{n} \u041C\u0411",Fotogramas:"\u041A\u0430\u0434\u0440\u044B","{f} por segundo":"{f} \u0432 \u0441\u0435\u043A\u0443\u043D\u0434\u0443","Cada fotograma":"\u041A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440","{m} ms de media; el m\xE1s lento, {p} ms":"\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C {m} \u043C\u0441; \u0441\u0430\u043C\u044B\u0439 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0439 \u2014 {p} \u043C\u0441",Resoluci\u00F3n:"\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435",Tri\u00E1ngulos:"\u0422\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438","{t} mil por fotograma":"{t} \u0442\u044B\u0441. \u0437\u0430 \u043A\u0430\u0434\u0440","Llamadas de dibujo":"\u0412\u044B\u0437\u043E\u0432\u044B \u043E\u0442\u0440\u0438\u0441\u043E\u0432\u043A\u0438","Memoria gr\xE1fica":"\u0413\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0430\u043C\u044F\u0442\u044C","{g} geometr\xEDas y {x} texturas":"{g} \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u0439 \u0438 {x} \u0442\u0435\u043A\u0441\u0442\u0443\u0440","Memoria de JavaScript":"\u041F\u0430\u043C\u044F\u0442\u044C JavaScript","Personajes en escena":"\u041F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0435\u0439 \u0432 \u0441\u0446\u0435\u043D\u0435","Rendimiento en este aparato":"\u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u044C \u043D\u0430 \u044D\u0442\u043E\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435","Personajes de prueba:":"\u0422\u0435\u0441\u0442\u043E\u0432\u044B\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438:","valravnx: dime los fps que ves en tu m\xF3vil (y qu\xE9 m\xF3vil es), en \xABConstruir\xBB y en \xABDuelo\xBB. Con eso se decide cu\xE1nto detalle aguanta.":"\u041F\u0435\u0434\u0440\u043E, \u043D\u0430\u043F\u0438\u0448\u0438, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043A/\u0441 \u0442\u044B \u0432\u0438\u0434\u0438\u0448\u044C \u043D\u0430 \u0441\u0432\u043E\u0451\u043C \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 (\u0438 \u0447\u0442\u043E \u044D\u0442\u043E \u0437\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D) \u0432 \u0440\u0430\u0437\u0434\u0435\u043B\u0430\u0445 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0438 \xAB\u041F\u043E\u0435\u0434\u0438\u043D\u043E\u043A\xBB. \u041E\u0442 \u044D\u0442\u043E\u0433\u043E \u0437\u0430\u0432\u0438\u0441\u0438\u0442, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0434\u0435\u0442\u0430\u043B\u0435\u0439 \u043E\u043D \u0432\u044B\u0434\u0435\u0440\u0436\u0438\u0442.","Demo \xFAnica \xB7 v2 (los n\xFAmeros de rendimiento a la vista)":"\u0415\u0434\u0438\u043D\u043E\u0435 \u0434\u0435\u043C\u043E \xB7 v2 (\u043F\u043E\u043A\u0430\u0437\u0430\u0442\u0435\u043B\u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0441\u0442\u0438 \u043D\u0430 \u0432\u0438\u0434\u0443)","v2: junto al bot\xF3n \xABMen\xFA\xBB salen los fotogramas por segundo de tu aparato; al pulsarlo se abre el detalle: lo que tarda cada fotograma (de media y el m\xE1s lento), la resoluci\xF3n, los tri\xE1ngulos y las llamadas de dibujo, la memoria gr\xE1fica y la de JavaScript (esta solo la dicen Chrome y los navegadores basados en \xE9l) y los personajes en escena. En el m\xF3vil, si junto a \xABMen\xFA\xBB no cabe, va a la izquierda de la pantalla.":"v2: \u0440\u044F\u0434\u043E\u043C \u0441 \u043A\u043D\u043E\u043F\u043A\u043E\u0439 \xAB\u041C\u0435\u043D\u044E\xBB \u043F\u043E\u043A\u0430\u0437\u0430\u043D\u043E \u0447\u0438\u0441\u043B\u043E \u043A\u0430\u0434\u0440\u043E\u0432 \u0432 \u0441\u0435\u043A\u0443\u043D\u0434\u0443 \u043D\u0430 \u0442\u0432\u043E\u0451\u043C \u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0435; \u043D\u0430\u0436\u043C\u0438 \u2014 \u043E\u0442\u043A\u0440\u043E\u044E\u0442\u0441\u044F \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0441\u0442\u0438: \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u0438\u0442\u0441\u044F \u043A\u0430\u0436\u0434\u044B\u0439 \u043A\u0430\u0434\u0440 (\u0432 \u0441\u0440\u0435\u0434\u043D\u0435\u043C \u0438 \u0441\u0430\u043C\u044B\u0439 \u043C\u0435\u0434\u043B\u0435\u043D\u043D\u044B\u0439), \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435, \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u0438 \u0438 \u0432\u044B\u0437\u043E\u0432\u044B \u043E\u0442\u0440\u0438\u0441\u043E\u0432\u043A\u0438, \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u043F\u0430\u043C\u044F\u0442\u044C \u0438 \u043F\u0430\u043C\u044F\u0442\u044C JavaScript (\u0435\u0451 \u0441\u043E\u043E\u0431\u0449\u0430\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E Chrome \u0438 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u044B \u043D\u0430 \u0435\u0433\u043E \u043E\u0441\u043D\u043E\u0432\u0435) \u0438 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0432 \u0441\u0446\u0435\u043D\u0435. \u041D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435, \u0435\u0441\u043B\u0438 \u0440\u044F\u0434\u043E\u043C \u0441 \xAB\u041C\u0435\u043D\u044E\xBB \u043D\u0435 \u043F\u043E\u043C\u0435\u0449\u0430\u0435\u0442\u0441\u044F, \u043A\u043D\u043E\u043F\u043A\u0430 \u0443\u0445\u043E\u0434\u0438\u0442 \u043A \u043B\u0435\u0432\u043E\u043C\u0443 \u043A\u0440\u0430\u044E \u044D\u043A\u0440\u0430\u043D\u0430.","v2, para medir con gente: en \xABConstruir\xBB, el detalle tiene \xABPersonajes de prueba\xBB (0, 4, 8 o 16): personajes del taller que pasean en corro a tu alrededor. Solo se dibujan; no son jugadores ni cambian nada. Medido en el navegador de pruebas (dibuja sin tarjeta gr\xE1fica, as\xED que sus fps no valen): cada personaje suma unos 37 mil tri\xE1ngulos por fotograma (contando su sombra), unas 10 geometr\xEDas y 12 texturas.":"v2, \u0447\u0442\u043E\u0431\u044B \u043C\u0435\u0440\u0438\u0442\u044C \u0441 \u043B\u044E\u0434\u044C\u043C\u0438 \u0432\u043E\u043A\u0440\u0443\u0433: \u0432 \xAB\u0421\u0442\u0440\u043E\u0438\u0442\u044C\xBB \u0432 \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0441\u0442\u044F\u0445 \u0435\u0441\u0442\u044C \xAB\u0422\u0435\u0441\u0442\u043E\u0432\u044B\u0435 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438\xBB (0, 4, 8 \u0438\u043B\u0438 16): \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436\u0438 \u0438\u0437 \u043C\u0430\u0441\u0442\u0435\u0440\u0441\u043A\u043E\u0439, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0433\u0443\u043B\u044F\u044E\u0442 \u043F\u043E \u043A\u0440\u0443\u0433\u0443 \u0432\u043E\u043A\u0440\u0443\u0433 \u0442\u0435\u0431\u044F. \u041E\u043D\u0438 \u0442\u043E\u043B\u044C\u043A\u043E \u0440\u0438\u0441\u0443\u044E\u0442\u0441\u044F: \u044D\u0442\u043E \u043D\u0435 \u0438\u0433\u0440\u043E\u043A\u0438, \u0438 \u043E\u043D\u0438 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u043C\u0435\u043D\u044F\u044E\u0442. \u0417\u0430\u043C\u0435\u0440\u0435\u043D\u043E \u0432 \u0442\u0435\u0441\u0442\u043E\u0432\u043E\u043C \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0435 (\u043E\u043D \u0440\u0438\u0441\u0443\u0435\u0442 \u0431\u0435\u0437 \u0432\u0438\u0434\u0435\u043E\u043A\u0430\u0440\u0442\u044B, \u0442\u0430\u043A \u0447\u0442\u043E \u0435\u0433\u043E \u043A/\u0441 \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0437\u043D\u0430\u0447\u0430\u0442): \u043A\u0430\u0436\u0434\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u0436 \u0434\u043E\u0431\u0430\u0432\u043B\u044F\u0435\u0442 \u043E\u043A\u043E\u043B\u043E 37 \u0442\u044B\u0441. \u0442\u0440\u0435\u0443\u0433\u043E\u043B\u044C\u043D\u0438\u043A\u043E\u0432 \u0437\u0430 \u043A\u0430\u0434\u0440 (\u0441 \u0443\u0447\u0451\u0442\u043E\u043C \u0442\u0435\u043D\u0438), \u043E\u043A\u043E\u043B\u043E 10 \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u0439 \u0438 12 \u0442\u0435\u043A\u0441\u0442\u0443\u0440.","Hito 1 \xB7 v11":"\u042D\u0442\u0430\u043F 1 \xB7 v11","v11: en el m\xF3vil el aviso de abajo del men\xFA ya no tapa \xABReiniciar\xBB ni otros botones: se coloca seg\xFAn lo que mida de verdad el men\xFA de arriba (que en ingl\xE9s y en ruso ocupa m\xE1s filas) y a la izquierda de los botones de modo.":"v11: \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435 \u043F\u043E\u0434\u0441\u043A\u0430\u0437\u043A\u0430 \u043F\u043E\u0434 \u043C\u0435\u043D\u044E \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \xAB\u041D\u0430\u0447\u0430\u0442\u044C \u0437\u0430\u043D\u043E\u0432\u043E\xBB \u0438 \u0434\u0440\u0443\u0433\u0438\u0435 \u043A\u043D\u043E\u043F\u043A\u0438: \u043E\u043D\u0430 \u0441\u0442\u0430\u0432\u0438\u0442\u0441\u044F \u043F\u043E \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u043C\u0443 \u0440\u0430\u0437\u043C\u0435\u0440\u0443 \u0432\u0435\u0440\u0445\u043D\u0435\u0433\u043E \u043C\u0435\u043D\u044E (\u043D\u0430 \u0430\u043D\u0433\u043B\u0438\u0439\u0441\u043A\u043E\u043C \u0438 \u0440\u0443\u0441\u0441\u043A\u043E\u043C \u043E\u043D\u043E \u0437\u0430\u043D\u0438\u043C\u0430\u0435\u0442 \u0431\u043E\u043B\u044C\u0448\u0435 \u0441\u0442\u0440\u043E\u043A) \u0438 \u0441\u043B\u0435\u0432\u0430 \u043E\u0442 \u043A\u043D\u043E\u043F\u043E\u043A \u0440\u0435\u0436\u0438\u043C\u043E\u0432.","Prueba de estilo \xB7 v10 (realismo en miniatura; las notas no tapan las vistas)":"\u041F\u0440\u043E\u0431\u0430 \u0441\u0442\u0438\u043B\u044F \xB7 v10 (\u043C\u0438\u043D\u0438\u0430\u0442\u044E\u0440\u043D\u044B\u0439 \u0440\u0435\u0430\u043B\u0438\u0437\u043C; \u0437\u0430\u043C\u0435\u0442\u043A\u0438 \u043D\u0435 \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0432\u0438\u0434\u044B)","v10: las notas se colocan justo encima de la barra de vistas, aunque en el m\xF3vil esta ocupe dos filas, y nunca suben por encima de la barra de arriba.":"v10: \u0437\u0430\u043C\u0435\u0442\u043A\u0438 \u0441\u0442\u043E\u044F\u0442 \u043F\u0440\u044F\u043C\u043E \u043D\u0430\u0434 \u043F\u0430\u043D\u0435\
