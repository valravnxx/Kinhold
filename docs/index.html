pturas: sin zapatos se ve sin pies, porque el cuerpo del taller no los tiene debajo. Tarea nueva en el hito de arte para los pies descalzos.","Decisión provisional: las velocidades del juego (3,6 m/s andando y 6 con Mayús) no se cambian; con ellas se usa la animación de correr y a 6 m/s los pies resbalan algo. Anotado en el registro del prototipo.","Las pruebas de navegador de la construcción y de idiomas sirven las páginas por HTTP, como en la web, para poder cargar el modelo.","Construcción v10 publicada; las versiones anteriores siguen en la web."],"pruebas":"Todas correctas con probar_todo.sh, PC y móvil, salvo la de idiomas, que fallaba porque abría la construcción sin servidor y el modelo no se carga así; servida por HTTP, pasa entera (repetida aparte). La prueba nueva del personaje se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas de cerca miradas: quieto, de espaldas, corriendo, talando y en el móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (es la tarea de rendimiento de este hito); la prueba de idiomas no se rompió a propósito tras el cambio (solo cambia cómo se sirven las páginas).","capturas":"capturas/construccion-v10","estado":"ok"},{"inicio":"2026-10-25T21:20:16+00:00","fin":"2026-10-25T22:52:11+00:00","titulo":"Hito 1d: el personaje del taller en el combate","hito":"unificacion","hecho":["Los dos luchadores del duelo son el personaje del taller propio en vez del muñeco de cubos; mientras carga (o si no carga) se ve el muñeco de antes.","La armadura del duelo es la ropa por capas del taller: lino = camisa y calzas, gambesón = gambesón, cota de malla = cota encima del gambesón. Lo que protege sigue en la lógica de combate, que no cambia.","Piernas y cuerpo con las animaciones del taller (guardia de espada quieto, andar y correr). Los brazos se colocan cada fotograma con cinemática inversa de dos huesos para que las manos agarren el arma donde la ponen las poses de siempre; si el brazo no llega, el arma se queda en la mano. Con escudo, la mano izquierda lo coge por el asa; con arco, una mano en el arco y otra en la cuerda.","El arma sube o baja con los hombros del personaje: las poses estaban hechas para hombros a 1,48 m y el del taller los tiene más bajos, y más aún agachado en guardia.","La mano izquierda venía abierta en la animación de guardia (es de espada de una mano): ahora copia el puño cerrado de la derecha.","Las heridas se pintan como antes (sangre o moratón, más grande cuanto más grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, así que siguen al personaje. En la cara, más pequeñas.","La cinta azul o amarilla va en el pecho, encima de la ropa: los dos luchadores son el mismo hombre del taller y es lo que los distingue.","Decisión provisional, anotada en el registro del combate: cojear ya no se ve; lo hacía el muñeco y las animaciones del taller no lo traen.","La prueba de navegador del combate sirve la página por HTTP, como en la web, y tiene comprobaciones nuevas: los dos son el personaje del taller, llevan las capas de su armadura, el muñeco no se ve, las manos están en el puño en guardia y en las cinco líneas de golpe, el escudo se agarra por el asa y cada herida se pega en su hueso.","Combate v8 publicado; las versiones anteriores siguen en la web."],"pruebas":"Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, navegador de construcción, combate, estilo, personaje, recursos, idiomas y web), en PC y móvil. La prueba nueva del combate se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas miradas: de cerca en guardia, golpes de las cinco líneas, heridas, cara, rival con cota, escudo, palo y arco; y el duelo entero en PC y móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (cada luchador tiene unos 16.000 a 18.000 triángulos; es la tarea de rendimiento de este hito). A medio golpe las cinco líneas se ven parecidas: es el movimiento de antes, y los golpes con animación propia son otra tarea del duelo.","capturas":"capturas/combate-v8","estado":"ok"},{"inicio":"2026-10-25T23:20:38+00:00","fin":"2026-10-26T00:17:59+00:00","titulo":"Hito 1d: demo única","hito":"unificacion","hecho":["Demo única publicada (jugar/demo/v1): una página con menú y tres partes, Construir, Duelo y Personaje, que son los últimos prototipos de cada cosa (construcción v10, combate v8, personaje v11). three.js va una sola vez: la página pesa 1,2 MB, frente a 1 MB de cada prototipo suelto.","Cada parte se abre con ?modo= y el botón «Menú» de arriba vuelve al menú recargando la página, para que nunca haya dos escenas ni dos WebGL a la vez en el móvil. Lo construido, las opciones del duelo y el personaje siguen guardados en el navegador al volver.","El personaje elegido en «Personaje» (hombre o mujer y su ropa por capas) es el que construye y el que lucha; el menú resume cuál es. Las próximas versiones de los prototipos sueltos también lo leerán (las ya publicadas no cambian).","Decisiones provisionales, anotadas en el registro de la demo: sin personaje elegido, en la construcción se sale con camisa y calzas de lino (GDD); en el duelo manda la armadura de sus opciones (con lino, tu ropa sin gambesón ni cota; con gambesón o cota, esas piezas y la sobreveste si la elegiste); el rival sigue siendo el hombre de siempre.","La web pone la demo única la primera en «Jugar»; las versiones antiguas de cada prototipo se quedan.","Prueba nueva de navegador de la demo (menú, las tres partes, el botón Menú, el personaje elegido en construcción y duelo, menú en inglés y ruso), metida en probar_todo.sh."],"pruebas":"Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, textos traducidos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web), en PC y móvil. La prueba nueva de la demo se rompió a propósito (MUTAR=1 borra lo guardado al cambiar de parte) y falló como debía. Capturas miradas del menú, el personaje, la construcción y el duelo con la mujer de vestido y gambesón, en PC y móvil, y el menú en ruso. Visto en las capturas: en el móvil el aviso de la construcción sigue tapando «Reiniciar», y con el botón «Menú» la barra de arriba ocupa una fila más; es la tarea siguiente del hito. No comprobado: los fotogramas con tarjeta gráfica ni en un móvil de verdad (es la tarea de rendimiento).","capturas":"capturas/demo-v1","estado":"ok"},{"inicio":"2026-10-26T00:21:01+00:00","fin":"2026-10-26T01:28:05+00:00","titulo":"Hito 1d: rendimiento de la demo única","hito":"unificacion","hecho":["Medida de rendimiento común (src/mundo/rendimiento.js): cada parte registra su renderer y se cuentan los fotogramas por segundo, el tiempo medio y el peor de cada fotograma, los triángulos y las llamadas de dibujo, la memoria gráfica (geometrías y texturas), la de JavaScript (solo en Chrome y similares) y los personajes en escena.","Demo única v2 publicada (jugar/demo/v2): los fps salen en un botón junto a «Menú» y al pulsarlo se abre el detalle con una nota para valravnx. En el móvil, si junto a «Menú» no cabe sin añadir otra fila de botones, va suelto a la izquierda de la pantalla.","En «Construir», «Personajes de prueba» (0, 4, 8 o 16): personajes del taller que pasean en corro alrededor del jugador, solo para medir con gente; no cambian el mundo.","Medido en el navegador de pruebas (dibujo por software, sus fps no valen): personaje 89 mil triángulos y 41 dibujos; construcción con 1 personaje 130 mil triángulos y 29 dibujos; con 9 personajes 426 mil y 185 (cada personaje suma unos 37 mil triángulos contando su sombra, unas 10 geometrías y 12 texturas); duelo con 2 personajes 143 mil y 72.","Pregunta añadida a valravnx en las decisiones pendientes: los fps en su móvil.","Prueba de la demo ampliada: botón de fps libre, panel con los números, cuenta de personajes en cada parte, más triángulos con 8 personajes de prueba y que el botón no tape el menú; con MUTAR_REND=1 falla como debe."],"pruebas":"Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas de la demo miradas en PC y móvil","capturas":"capturas/demo-v2","estado":"ok"},{"inicio":"2026-10-26T02:20:16+00:00","fin":"2026-10-26T03:59:26+00:00","titulo":"Hito 1d: los avisos y las notas ya no tapan los menús en el móvil","hito":"unificacion","hecho":["En el móvil, el aviso de la construcción se coloca según lo que mide de verdad el menú de arriba (que en inglés y en ruso ocupa más filas, y en la demo lleva también «Menú» y los fps) y a la izquierda de los botones de modo: ya no tapa «Reiniciar» ni ningún otro botón. En PC sigue centrado, justo debajo del menú.","Las notas de la prueba de estilo se colocan justo encima de la barra de vistas, aunque esta ocupe dos filas, y nunca suben por encima de la barra de arriba.","Pruebas nuevas: en la de idiomas, que el aviso no tapa ningún botón (en inglés y en ruso, PC y móvil); en la de estilo, que las notas no tapan las barras, también con la barra de vistas estrechada a dos filas. Con MUTAR_SOLAPE=1 (aviso y notas a la altura fija de antes) fallan las dos, como deben.","Publicadas construcción v11, prueba de estilo v10 y demo única v3 (con la construcción v11).","No comprobado: en un móvil de verdad; solo en el navegador de pruebas a 390×844 (y a 320 de ancho en una prueba aparte)."],"pruebas":"Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas miradas en PC y móvil","capturas":"capturas/demo-v3","estado":"ok"},{"inicio":"2026-10-26T05:09:48+01:00","fin":"2026-10-26T06:36:44+01:00","titulo":"Correr más natural (personaje v12)","hito":"arte","hecho":["La carrera del paquete se suaviza por código al pasarla al taller: cada hueso se mueve menos alrededor de su postura media (brazos 50 %, tronco 55 %, piernas 60 %), el tronco se endereza, los brazos se acercan al cuerpo como al andar y la pelvis bota 10 cm en vez de 25.","Las demás animaciones salen idénticas (comprobado: diferencia máxima de 2·10⁻⁷ en sus datos).","Encontrado un fallo de antes: el juego trataba la carrera como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s; a 3,6 m/s los pies resbalaban y se veía a cámara lenta. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar (carrera nueva: 3,5 m/s el hombre y 2,9 la mujer).","Personajes nuevos en recursos/personajes/taller-v5/ (la ropa, igual que la v4); la construcción, el duelo y el visor ya los usan.","Botón «Correr» en el visor de personaje y prueba nueva: zancada natural y poco bote (falla con la carrera de antes).","Personaje v12 publicado. La demo única recoge la carrera nueva en su próxima versión."],"pruebas":"Lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, idiomas y unión correctos; navegador: construcción, combate, demo, estilo, personaje e idiomas correctos en PC y móvil. La prueba nueva falla con MUTAR=1. No comprobado: cómo se ve en un móvil de verdad.","capturas":"capturas/personaje-v12","estado":"ok"},{"inicio":"2026-10-26T04:19:56+00:00","fin":"2026-10-26T05:14:30+00:00","titulo":"Hito 1d: revisión completa","hito":"unificacion","hecho":["Pasadas todas las pruebas del proyecto con probar_todo.sh: lógica, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo única, recursos, idiomas y web.","Revisadas las capturas de la demo única en PC y móvil (menú en español, inglés y ruso, Construir, Duelo y Personaje), de la construcción, del combate y de la web: el mismo personaje del taller y la misma escena en todo, y ningún aviso tapa los menús.","Sin versión jugable nueva: desde la demo v3 no ha cambiado nada que se juegue.","Los fps de las capturas (1 a 4) son del navegador de pruebas sin tarjeta gráfica, no de un dispositivo de verdad; en su móvil valravnx dijo que van bien.","El hito 1d queda en revisión, esperando a valravnx."],"pruebas":"Todas correctas (bash herramientas/probar_todo.sh), PC y móvil; capturas miradas.","capturas":"","estado":"ok"},{"inicio":"2026-10-26T05:20:32+00:00","fin":"2026-10-26T06:58:46+00:00","titulo":"Hito 1c: barandillas y portillo (sin publicar)","hito":"construccion-mas","hecho":["Portillo de varas para la cerca (4 varas y 1 cuerda, como la puerta de varas): va en el suelo y se abre y se cierra con Usar; abierto deja pasar.","Las piezas que se abren se leen ahora de la marca «portón» de cada pieza, no de una lista fija.","El medio muro sirve de barandilla en el borde de un suelo en alto y alrededor del hueco de la escalera: comprobado en el navegador que con él no se cae y sin él sí.","Pruebas nuevas de lógica (17) y de navegador (barandilla y portillo), rotas a propósito una vez: fallan como deben.","Todo queda en la rama trabajo/20261026-0519, ya unida con main."],"pruebas":"Lógica 81/81, modelos, acciones, idiomas, navegador de construcción (PC y móvil), estilo, personaje, demo, recursos, inglés y web correctos. FALLA el navegador de combate: «soltar flojo no dispara y avisa» y «la retícula se cierra a plena tensión». Falla igual en main sin mis cambios (desde la unión de la carrera nueva); aislado, soltar flojo sí avisa, así que parece de tiempos de la prueba. No comprobado: la causa exacta.","capturas":"","estado":"fallo"},{"inicio":"2026-10-26T06:49:24+01:00","fin":"2026-10-26T07:04:12+01:00","titulo":"Demo única v4: la carrera nueva en todo","hito":"unificacion","hecho":["valravnx pidió integrar la carrera nueva y todo en la demo única.","Demo única v4 publicada: construcción v11, combate v8 y personaje v12, con los personajes del taller-v5 (carrera suavizada y a su velocidad natural).","Prueba nueva en la demo: en «Construir» el personaje corre con la carrera nueva a su ritmo natural (falla con MUTAR=1)."],"pruebas":"Demo única correcta en PC y móvil (menú, construir, duelo, personaje, idiomas); textos traducidos correctos. Las demás pruebas, correctas en la sesión anterior con el mismo código. No comprobado: cómo se ve en un móvil de verdad.","capturas":"capturas/demo-v4","estado":"ok"},{"inicio":"2026-10-26T07:51:47+01:00","fin":"2026-10-26T08:59:26+01:00","titulo":"Brazos naturales al correr (personaje v13, demo v5)","hito":"arte","hecho":["valravnx: los brazos de la carrera nueva van torcidos hacia delante, en pose nada natural; arreglado eso, la aprueba (pregunta de la carrera cerrada: no hacen falta las de Rokoko).","Los brazos se corrigen por código en la misma carrera: el brazo oscila alrededor de la vertical (de unos 25° atrás a unos 18° delante), el antebrazo va un poco hacia arriba y hacia dentro, la mano de canto con el pulgar arriba y la muñeca recta.","Personajes en recursos/personajes/taller-v6/ (las demás animaciones salen idénticas: diferencia máxima de 2·10⁻⁷).","Personaje v13 y demo única v5 publicados."],"pruebas":"Todas correctas en PC y móvil. La prueba del combate falló una vez con el servidor cargado (tiempos del arco y la pausa de impacto, que se miden en tiempo real) y pasó entera al repetirla sola. No comprobado: cómo se ve en un móvil de verdad.","capturas":"capturas/personaje-v13","estado":"ok"},{"inicio":"2026-10-26T07:37:25+00:00","fin":"2026-10-26T09:12:28+00:00","titulo":"Cinturón de la cota ceñido (taller-v7)","hito":"arte","hecho":["valravnx aprobó el hito 1d (una sola demo).","El cinturón de encima de la cota del hombre se estiraba hasta los brazos (0,32 m de medio ancho frente a 0,18 de la cota): al medir el contorno de la cintura se contaban también las mangas, y las de la cota bajan hasta la mano. Ahora solo cuentan el cuerpo y la falda de la prenda.","Personajes nuevos en recursos/personajes/taller-v7, encima de la v6 de los brazos al correr: solo cambia ese cinturón (comprobado malla a malla); las animaciones salen idénticas.","Prueba nueva de los cinturones de todos los personajes y comprobación en el visor con el hombre y la cota; las dos fallan con la taller-v6.","Portado el arreglo de tiempos de la prueba del combate de la sesión automática (sin él fallaba el arco a 2 fps).","Personaje v14 y demo única v6 publicados."],"pruebas":"Todas correctas con probar_todo.sh salvo el combate, que pasó aparte con los márgenes portados. Fotos del taller antes y después, y visor y demo en PC y móvil mirados.","capturas":"capturas/personaje-v14","estado":"ok"},{"inicio":"2026-10-26T07:58:22+01:00","fin":"2026-10-26T11:58:37+01:00","titulo":"Pantalla en blanco en el móvil arreglada; muros con el estilo (construcción v12)","hito":"construccion-mas","hecho":["valravnx: la pantalla se queda en blanco jugando (con los botones vivos y a más de 80 fps) y sigue así aunque recargue.","Causa encontrada y medida: al colocar o quitar algo se rehacían todas las piezas y las viejas no se liberaban de la memoria gráfica (con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas). Con una casa grande, cada pieza colocada dejaba miles, hasta agotar la memoria del móvil.","Arreglado: las piezas, el mojón, el anillo de la tierra y la pieza fantasma se liberan al quitarlos (la cuenta queda igual tras 20 reconstrucciones). En el duelo, las flechas, dianas y postes también.","Si aun así el navegador pierde el dibujo 3D: aviso, recarga sola con lo construido guardado y, si vuelve a pasar enseguida, botón «Recargar» en vez de recargar en bucle.","Muros, postes y vigas con el estilo elegido (troncos redondos con testas, zarzo, entramado y tablas), cada pieza en una malla por textura. Muestrario nuevo para fotos de cerca (herramientas/muestrario/).","Publicados construcción v12, combate v9 y demo única v7. Se colaron en el repositorio dos enlaces a node_modules (de una copia de trabajo): quitados y ahora ignorados."],"pruebas":"Todas correctas en PC y móvil. Pruebas nuevas, que fallan al romperlas: memoria gráfica estable al rehacer las piezas (MUTAR_FUGA=1: 822 → 16.672 geometrías), aviso y recarga al perder el dibujo 3D, huecos de puertas y ventanas mirados triángulo a triángulo. No comprobado: en el móvil de valravnx.","capturas":"capturas/construccion-v12","estado":"ok"},{"inicio":"2026-10-26T12:06:00+01:00","fin":"2026-10-26T12:13:41+01:00","titulo":"Decisiones de valravnx: mundo a escala real, agua y nado, y obras con materiales (GDD v0.8)","hito":"construccion-mas","hecho":["valravnx aprueba («sí, todo») la propuesta del mundo, el nado y las obras.","Mundo a escala real: cordilleras como los Pirineos (cumbres de unos 3.000 m, valles de unos 1.000 m, collados), llanuras en las cuencas, ríos de tres gruesos según el agua que recogen, bosques frondosos, pendientes que frenan y obligan a nivelar. Se genera primero la red de ríos y después el terreno.","Agua y nado (no estaba en el GDD): se vadea andando, en el agua honda se nada despacio y cansa, no con armadura o mucha carga, la corriente de los ríos grandes arrastra; los carros solo cruzan por vados y puentes.","Obras: marco, materiales y tiempo; clases de peso (ligero, pesado, muy pesado); escalera, varas para rodar troncos, andamio, polea, polipasto con torno y grúa de rueda. Solo o en pareja, una cabaña de troncos; en grupo, la piedra.","GDD v0.8 en español, inglés y ruso. Cinco tareas nuevas en el hito 1c (las obras, antes de las piezas nuevas, y los muros de piedra con grúa) y el hito 10 (Mundo) puesto al día."],"pruebas":"Web y textos traducidos correctos. Sin cambios de código.","capturas":"","estado":"ok"},{"inicio":"2026-10-26T08:25:29+01:00","fin":"2026-10-26T14:00:24+01:00","titulo":"Hito 1c: barandillas y portillo publicados (construcción v13, demo v8)","hito":"construccion-mas","hecho":["Arreglada la prueba del combate que impedía publicar: no era un fallo del juego sino de tiempos. Sin tarjeta gráfica el navegador de pruebas va a 2 fps y el juego limita cada paso a 0,05 s, así que el tiempo de juego corre hasta 10 veces más lento que el real; la prueba esperaba como mucho 3 a 6 s reales a que se encajara la flecha o se tensara el arco. Ahora espera a esas condiciones con margen amplio (30 s), sin tiempos fijos.","Unida la rama de la sesión anterior (barandillas y portillo) con main, tres veces, porque mientras pasaban las pruebas las sesiones de chat publicaron la carrera, los brazos, el cinturón, los muros con el estilo y el arreglo de la pantalla en blanco.","Publicadas la construcción v13 y la demo única v8: el medio muro hace de barandilla en el borde de un suelo en alto y junto al hueco de la escalera, y hay portillo de varas para la cerca que se abre con Usar.","Mirado en las capturas que el portillo y la barandilla quedan bien junto a los muros nuevos con el estilo, en PC y en móvil."],"pruebas":"Todas correctas con probar_todo.sh sobre el código final: lógica 81/81, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web. Un intento de pasar las pruebas de navegador en paralelo falló por falta de máquina (2 núcleos) y se descartó. No comprobado: cómo se ve en un móvil de verdad.","capturas":"capturas/construccion-v13","estado":"ok"},{"inicio":"2026-10-26T13:38:41+00:00","fin":"2026-10-26T14:27:09+00:00","titulo":"Capa, botas y tocados en el taller (a medias)","hito":"arte","hecho":["Taller: capa de lana abierta por delante, botas de cuero hasta debajo de la rodilla, capucha con esclavina, sombrero de paja (malla propia en el hueso de la cabeza) y, en la mujer, toca. Las orejas van en una malla aparte para esconderlas bajo la capucha y la toca.","Cargador y visor: los tocados van de uno en uno, las botas sustituyen a los zapatos y la capa deja ver la ropa y el cinturón de debajo; en el duelo se conservan con cualquier armadura.","Prueba nueva de las piezas en los modelos (prueba_prendas.mjs: 10 correctas; con la taller-v7 falla, como debe) y comprobaciones nuevas en la prueba del visor.","Falla y no se publica: en las fotos, la capucha deja un hueco con forma de oreja y el borde de la cara sale en escalones. La capa parece un sobretodo abierto: no cae por encima de los brazos. El sombrero y las botas se ven bien.","Todo el avance está en la rama trabajo/20261026-1338 para la sesión siguiente (taller-v8 sin publicar)."],"pruebas":"Lógica, modelos, acciones, cinturones, piezas nuevas, idiomas y navegador de construcción correctos. No comprobado: navegador de combate, personaje, demo y web (cortadas por tiempo).","capturas":"","estado":"fallo"},{"inicio":"2026-10-26T14:34:09+00:00","fin":"2026-10-26T17:08:57+00:00","titulo":"Hito 1e: la escena común como la prueba de estilo v5","hito":"estilo","hecho":["Escena común (src/mundo/decorado.js) más cerca de la prueba de estilo v5: hierba densa con flores también en el centro, matorrales de tres bultos de hojas, calvas de tierra pisada, rocas más cerca y árboles de copa sueltos antes del bosque.","En la construcción la hierba, las flores y las matas se esconden solas bajo lo construido en la planta baja, los muebles del suelo y el mojón, y vuelven al quitarlo; las matas escondidas dejan de chocar.","Los árboles sueltos son solo de copa: con pinos cerca, sus ramas bajas tapaban la cámara al talar.","Publicadas construcción v14, combate v10 y demo única v9, con comparación lado a lado con la v5 en las capturas.","Pruebas nuevas: ninguna planta asoma por los cimientos (rota a propósito con MUTAR_HIERBA=1: falla) y al quitarlo todo vuelven todas (rota a propósito sin despejar: falla).","Algunas pruebas de navegador esperaban tiempos fijos y fallaban con el navegador de pruebas a 1-2 fps; ahora esperan a la condición con márgenes amplios (golpe maestro, rodeo lateral, parada normal, arranque en el móvil, dibujo 3D perdido).","Rendimiento medido solo en el navegador de pruebas sin tarjeta gráfica: en «Construir» con 8 personajes de prueba, 503 mil triángulos y 191 llamadas de dibujo (antes 426 mil y 185). No comprobado en un móvil de verdad."],"pruebas":"Lógica 81/81, modelos 22/22, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos e idioma correctos en PC y móvil.","capturas":"capturas/construccion-v14","estado":"ok"},{"inicio":"2026-10-26T17:20:52+00:00","fin":"2026-10-26T18:16:06+00:00","titulo":"Hito 1e: cimientos, suelos y escaleras con el estilo v5","hito":"estilo","hecho":["Cimiento de piedra rehecho como el zócalo de la cabaña de la prueba v5: macizo de mortero, 16 losas con juntas y un tono distinto cada una, y una hilada de piedras redondeadas en los costados.","Cimiento de troncos, suelo de troncos (troncos partidos sobre dos durmientes de corteza) y suelo de tablas (tablas con veta a lo largo sobre dos rastreles) con las texturas por código y la oclusión horneada de la v5; lo que se pisa sigue a la misma altura.","Escalera de mano de varas descortezadas y escalera de tablas con zancas y peldaños con veta; cada pieza es ahora una sola malla por textura en vez de hasta 17 sueltas.","Prueba nueva en prueba_modelos.mjs: cimientos y suelos se pisan a la altura de la lógica, no salen de su casilla y las seis piezas están hechas con el estilo v5 (rota a propósito con MUTAR_SUELO=1: falla).","Publicadas construcción v15 y demo única v10, con fotos de cerca de cada pieza y una comparación lado a lado con la prueba v5.","Triángulos por pieza medidos en node: cimiento de piedra 2476 (antes 588), suelo de tablas 1080 (antes 108), escalera de tablas 1404 (antes 156); llamadas de dibujo por pieza de 6-17 a 1-3. No comprobado en un móvil de verdad."],"pruebas":"Todas correctas con probar_todo.sh: lógica 81/81, modelos 36/36, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.","capturas":"capturas/construccion-v15","estado":"ok"},{"inicio":"2026-10-26T18:20:41+00:00","fin":"2026-10-26T19:33:32+00:00","titulo":"Hito 1e: tejados de paja y de tablillas y hastiales con el estilo v5","hito":"estilo","hecho":["Tejado de paja como el de la cabaña de la prueba v5: dos hiladas gruesas con el canto redondeado (la del alero monta sobre la de arriba), una fila de manojos de paja asomando en el alero y la cumbrera redonda con sus remates.","Las hiladas de paja tienen los lados planos: los tramos que van de lado se juntan sin surco y el tejado grande ya no se ve a cuadros. Solo vuelan 20 cm los lados que no tienen otro tramo al lado.","Tejado de tablillas: tablazón debajo y filas de tablillas solapadas, desplazadas media tablilla y con el pie levantado; tabla de remate en los lados que vuelan y caballete en la cumbrera.","Lo que cierra bajo el tejado (los hastiales automáticos): tablas de pie cortadas con la pendiente en muros de troncos y de tablas; barro con estacas en el zarzo y encalado con postes en el entramado. El hastial suelto antiguo también, con tablas de pie.","La lógica (geometriaTejados) dice ahora qué lados de cada tramo vuelan, qué tramo pone la cumbrera (uno solo de los dos) y su paridad; el dibujo lo usa.","Muestrario nuevo de casas con tejado (herramientas/muestrario/tejados.js, fotos.py casas=1) para sacar fotos de cerca.","Pruebas nuevas: cumbrera de un solo tramo, lados que vuelan y paridad (lógica, rotas a propósito: fallan); tejados con el estilo v5, nada por debajo del plano del tejado, lados planos de la paja (rota con MUTAR_TEJADO=1: falla) y rellenos que llegan al tejado sin atravesarlo (modelos).","Publicadas construcción v16 y demo única v11, con comparación lado a lado con la prueba v5.","Triángulos por tramo medidos en node: paja 2072 (2520 con cumbrera), tablillas 2244, relleno de tablas 108 (antes unos 48 el tramo). No comprobado en un móvil de verdad."],"pruebas":"Todas correctas con probar_todo.sh: lógica 86/86, modelos 47/47, combate, acciones, cinturones, unión, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.","capturas":"capturas/construccion-v16","estado":"ok"},{"inicio":"2026-10-26T20:20:25+00:00","fin":"2026-10-26T21:47:46+00:00","titulo":"Hito 1e: puertas, cercas, portillo, empalizada y mojón con el estilo v5","hito":"estilo","hecho":["Puertas con el estilo v5: la de tablas como la de la cabaña de la prueba (cuatro tablas, peinazos por detrás, bisagras largas de hierro con clavos y tirador de argolla); la de varas, varas atadas con cuerda a dos travesaños, con tornapunta.","Cerca de varas como la de la prueba v5: postes redondos con el corte claro arriba, dos varas atadas con lazadas de cuerda que llegan al borde de la casilla.","Portillo: postes más gruesos y hoja de varas con tornapunta, ataduras y lazos de cuerda que hacen de bisagra.","Empalizada: troncos descortezados como los de los muros, de distinto alto y algo torcidos, con la punta tallada clara y dos traviesas detrás. Su puerta: tablones con punta, traviesas por detrás, pletinas de hierro con clavos y argolla.","Mojón: piedras apiladas de caras planas, como las de los cimientos, y una vara con un trapo atado.","Lo que se abre (puertas, portillo y puerta de la empalizada) va en su propia malla, que gira en las bisagras; el resto, junto en una malla por textura como las demás piezas del estilo.","Las barandillas son el medio muro de troncos, que ya tenía el estilo desde la construcción v12.","El muestrario de piezas acepta «tipo@abierta» (hoja abierta) y «mojon».","Pruebas nuevas de modelos: estas piezas y el mojón hechos con el estilo v5, la hoja aparte, la puerta cabe en el hueco del muro y abierta lo deja libre (rota con MUTAR_PUERTA=1: falla), las varas de la cerca llegan al borde y el alto de la empalizada.","Publicadas construcción v17 y demo única v12, con comparación lado a lado con la prueba v5.","Triángulos por pieza medidos en node: puerta de varas 936, puerta de tablas 1180, cerca 552, portillo 640, empalizada 426, puerta de empalizada 2112, mojón 440. No comprobado en un móvil de verdad."],"pruebas":"Todas correctas con probar_todo.sh: lógica 86/86, modelos 64/64, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.","capturas":"capturas/construccion-v17","estado":"ok"},{"inicio":"2026-10-26T22:19:48+00:00","fin":"2026-10-26T23:42:06+00:00","titulo":"Hito 1e: muebles con el estilo v5","hito":"estilo","hecho":["Los once muebles rehechos con el estilo v5, como el banco, el barril y el tocón de la prueba: madera con veta, cortes claros, hierro oscuro y oclusión horneada, juntos en una malla por textura.","Cama de paja: marco de cuatro troncos con las testas a la vista, paja amontonada con mechones que asoman, jergón de lino y manta de lana doblada. Cama de madera: postes, largueros y cabecero de tablas, somier de tablas, colchón y almohada de lino, manta con el embozo vuelto.","Mesa de tres tablas sobre dos caballetes con patas en tijera y travesaño; banco como el de la prueba, con la espiga pasante a ras; taburete de una rodaja (se ve el corte) con tres patas abiertas.","Arcón de tablas con patines, flejes, clavos, cerradura y aldaba de hierro; barril de catorce duelas abombadas con juntas, dos aros y tapa de tablas; estantería con trasera de tablas, vasijas de barro torneadas, un cuenco, un rollo de paño y un manojo.","Antorcha de pie: vara entre piedras con un cesto de hierro y estopa; la llama va aparte, brilla y no da sombra. Alfombra: piel curtida con su forma (patas y cuello) y el lomo más oscuro. Estandarte: asta con regatón entre piedras, travesaño atado y paño en pliegues con dos puntas y una banda.","Textura nueva por código para los paños (tejido de lino y lana) y colores de lino, lana, paño, piel y barro en la paleta.","Mismo tamaño y apoyo que antes: la lógica y los guardados no cambian.","Pruebas nuevas de modelos: cada mueble hecho con el estilo v5, apoyado en el suelo y dentro de su sitio, y la llama de la antorcha (rota con MUTAR_MUEBLE=1: falla). La de navegador pone los once muebles en fila y saca fotos de cerca.","Publicadas construcción v18 y demo única v13, con comparación lado a lado con la prueba v5.","Triángulos por mueble medidos en node: cama de paja 1356, cama de madera 3224, mesa 676, banco 540, taburete 154, arcón 2388, barril 1272, estantería 1824, antorcha 720, alfombra 552, estandarte 1720. No comprobado en un móvil de verdad."],"pruebas":"Todas correctas con probar_todo.sh: lógica 86/86, modelos 88/88, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.","capturas":"capturas/construccion-v18","estado":"ok"},{"inicio":"2026-10-27T00:20:20+00:00","fin":"2026-10-27T02:51:05+00:00","titulo":"Hito 1e: armas, hacha, pieza fantasma y resaltados con el estilo v5","hito":"estilo","hecho":["Armas del duelo rehechas con el estilo v5: espadas con la hoja de sección de rombo y su vaceo, puño forrado de cuero con atadura, cruz y pomo de rueda de hierro; palo de vara descortezada con nudos y los cortes a la vista; arco de una pieza que adelgaza hacia las puntas, con puño de cuero.","Escudo de seis tablas con veta que llenan el círculo, canto forrado de cuero cosido y umbo con su aro y clavos; flecha con punta de hierro y tres plumas atadas; piedra de honda con textura de piedra.","Poste de práctica con dos haces de paja atados con cuerda y piedras calzando el pie; diana de paja con un paño pintado con tierras (ocre, almagre y carbón) en vez de los anillos azul, rojo y amarillo vivos. Las cintas de los luchadores, de paño teñido y más apagadas.","La pieza fantasma al construir ya no es un bloque verde o rojo: es la propia pieza con su textura y su color, translúcida, con un velo verde si cabe o rojo si no. Lo marcado al desmontar (naranja lo que se quita, rojo lo que caería) también conserva su textura.","Hacha en la mano al talar, como la del tocón de la prueba v5: mango de fresno con veta y cabeza de hierro con la pala abierta y el filo más claro. Se coloca con los huesos de la mano (mango atravesado a los dedos, filo hacia los nudillos) y solo se ve mientras tala.","Lo que se lleva en la mano echa sombra pero no la recibe: con una hoja de 9 mm el mapa de sombras la sombreaba entera y se veía negra.","Quitadas de modelos.js las funciones del aspecto inicial que ya no usaba nada (árbol, roca, cajas y cilindros de color plano); los recursos del suelo (árboles y rocas) ya eran los del decorado con el estilo v5.","Prueba nueva en prueba_modelos.mjs: armas, escudo, flecha, piedra, poste, diana y hacha hechos con el estilo v5, la hoja llega a la punta que marca el arma, las tablas del escudo llenan el círculo y el hacha mide lo que debe (rota a propósito con MUTAR_ARMA=1: falla).","El muestrario de piezas saca también fotos de las armas (armas=…). Publicadas construcción v19, combate v11 y demo única v14, con fotos de cerca y una comparación lado a lado con la prueba v5.","No cambiado: el anillo claro que marca la tierra del mojón (es una marca del juego, no una pieza) y el muñeco que se ve un instante mientras carga el personaje."],"pruebas":"Todas las pruebas de herramientas/probar_todo.sh correctas (modelos 104/104, construcción, combate, estilo, personaje, demo, idiomas y web en el navegador); capturas revisadas en PC y móvil","capturas":"capturas/combate-v11","estado":"ok"}],"capturas":{"capturas/demo-v1":["movil_construir.jpg","movil_duelo.jpg","movil_menu.jpg","movil_menu_en.jpg","movil_menu_ru.jpg","movil_personaje.jpg","pc_construir.jpg","pc_duelo.jpg","pc_menu.jpg","pc_personaje.jpg"],"capturas/demo-v2":["movil_construir.jpg","movil_construir_rendimiento.jpg","movil_duelo.jpg","movil_duelo_rendimiento.jpg","movil_menu.jpg","movil ,"pc_15_doc_analisis_ru.jpg","pc_15_doc_gdd_ru.jpg","pc_15_doc_sistemas_ru.jpg"]},"idiomas":{"en":{"Infraestructura":"Infrastructure","Repositorio en GitHub, web de progreso y trabajo automático por horas.":"GitHub repository, progress website and hourly automatic work.","Idiomas: español, inglés y ruso en el juego, la web y los documentos de diseño.":"Languages: Spanish, English and Russian in the game, the website and the design documents.","Repositorio, web de progreso y tarea programada":"Repository, progress website and scheduled task","Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos":"Progress website in English: ES/EN switch and the whole roadmap and log translated","Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma":"Design documents in English (GDD, systems and analysis), with a language switch","Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso":"Game in English: prototype texts with a language switch, ready for adding Russian","Prueba de estilo y visor de personaje en inglés, con el mismo módulo de idioma":"Style test and character viewer in English, with the same language module","Ruso: traducir el juego y la web (el archivo de ruso está vacío), con la misma comprobación que el inglés":"Russian: translate the game and the site (the Russian file is empty), with the same check as English","Documentos de diseño en ruso (GDD, sistemas y análisis), con selector de idioma; mientras tanto, la web en ruso enlaza a los documentos en inglés":"Design documents in Russian (GDD, systems and analysis), with a language selector; meanwhile, the Russian website links to the English documents","Bases técnicas":"Technical foundations","Nada nuevo a la vista: el proyecto queda preparado para el online y para trabajar varias sesiones a la vez sin pisarse.":"Nothing new to see: the project is ready for online play and for several sessions to work at once without clashing.","Salió del análisis del 25 oct (pedido de valravnx). Va antes que lo demás porque cuanto más código se escriba sin esto, más cuesta arreglarlo.":"Came out of the 25 Oct analysis (valravnx's request). It goes before everything else because the more code is written without this, the more it costs to fix.","Acciones con autor: toda acción que cambia el mundo (construir, desmontar, golpear, herir) pasa por la lógica pura como un mensaje con autor (quién, qué, dónde), se valida y se guarda en un registro; pruebas que lo comprueban y que fallan si una acción se salta el registro":"Actions with an author: every action that changes the world (build, dismantle, strike, wound) goes through the pure logic as a message with an author (who, what, where), is validated and kept in a log; tests that check it and fail if an action skips the log","Quitar código muerto: el personaje esculpido abandonado (cuerpo, campos de distancia, datos horneados y su herramienta y prueba) y el muñeco de la prueba de estilo, sin tocar las versiones ya publicadas":"Remove dead code: the abandoned sculpted character (body, distance fields, baked data and its tool and test) and the style test's figure, without touching the versions already published","Taller con versiones fijadas: anotar y comprobar al empezar la versión de Blender, el commit de MPFB2 y los paquetes, con una guía para volver a montarlo desde cero":"Workshop with pinned versions: record and check at start the Blender version, the MPFB2 commit and the packages, with a guide to set it up again from scratch","Diario y traducciones sin choques: una herramienta que une diario.json y en.json al fusionar ramas de varias sesiones, y su regla en CLAUDE.md":"Diary and translations without clashes: a tool that merges diario.json and en.json when merging branches from several sessions, and its rule in CLAUDE.md","Revisión completa y publicación":"Full review and publication","Una sola demo":"A single demo","Una sola página con construcción, duelo y personaje, con la misma escena del estilo elegido y el mismo personaje del taller en todo.":"A single page with building, duel and character, with the same scene in the chosen style and the same workshop character everywhere.","Plan de unificación (pedido de valravnx, 25 oct): hoy son cuatro prototipos que no se hablan y cada mejora se queda en uno. Va antes que el resto del arte y de las piezas de construcción.":"Unification plan (valravnx's request, 25 Oct): today there are four prototypes that do not talk to each other and every improvement stays in one. It goes before the rest of the art and the building pieces.","Escena común (src/mundo/): cielo, luz, niebla, suelo y decorado con el estilo v5 en un solo módulo, que usan la construcción, el combate y el visor de personaje":"Shared scene (src/mundo/): sky, light, fog, ground and scenery in the v5 style in a single module, used by building, combat and the character viewer","Personaje del taller en la construcción: sustituye al muñeco inicial; anda, corre y tala con sus animaciones, y empieza con camisa y calzas de lino como dice el GDD":"Workshop character in building: it replaces the initial figure; it walks, runs and chops with its animations, and starts with a linen shirt and hose as the GDD says","Personaje del taller en el combate: los dos luchadores con su ropa por capas (la armadura del duelo pasa a ser gambesón y cota del taller), con las animaciones que hay y las heridas pintadas como ahora":"Workshop character in combat: both fighters with their layered clothing (the duel's armour becomes the workshop's gambeson and mail), with the existing animations and wounds painted as now","Demo única: una página con menú (Construir, Duelo, Personaje); el personaje que eliges y su ropa se usan en todo; la web enlaza a ella y las versiones antiguas se quedan":"Single demo: one page with a menu (Build, Duel, Character); the character you choose and their clothing are used everywhere; the site links to it and the old versions stay","Rendimiento de la demo única: medir fotogramas, triángulos y memoria con la escena y varios personajes, dejar los números a la vista y pedir a valravnx los fps en su móvil":"Single demo performance: measure frames, triangles and memory with the scene and several characters, show the numbers, and ask valravnx for the fps on his phone","En el móvil, ningún aviso ni panel tapa los menús: el aviso de la construcción tapa «Reiniciar» (más en inglés y en ruso) y las notas de la prueba de estilo tapan la barra de vistas cuando esta ocupa dos filas":"On mobile, no notice or panel covers the menus: the building notice covers «Restart» (more so in English and Russian) and the style test notes cover the view bar when it takes two rows","Construcción":"Building","Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.":"Move with a free camera (PC and touch) and build on an anchored grid with load limits, cascading dismantling with 75% recovery, and free decoration.","Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron).":"Done on 24 Oct between about 15:55 and 16:40 (taken from file dates; exact times for this part were not recorded).","Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada":"Logic: anchored grid, supports, load, cascading dismantling","Piezas low-poly por código y personaje":"Low-poly pieces built in code, and the character","Cámara libre y controles PC y táctil":"Free camera and PC and touch controls","v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente":"v2: walls close up to the roof and consecutive roofs form a single slope","v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)":"v3: all walls reach exactly 2.5 m (10 courses of 25 cm)","El estilo de la prueba v5 en todo":"The style of style test v5 everywhere","Todo lo que se ve (suelo, árboles, piezas de construcción, muebles y objetos) con el aspecto de la prueba de estilo v5 que aprobó valravnx, en la construcción, el duelo y la demo única.":"Everything you see (ground, trees, building pieces, furniture and objects) with the look of style test v5 that valravnx approved, in building, the duel and the single demo.","Pedido de valravnx el 26 oct: solo se habían pasado al estilo los muros de troncos. Va antes que el resto del arte y que las piezas nuevas; reúne las tareas de estilo que estaban en el hito 1c.":"Requested by valravnx on 26 Oct: only the log walls had been moved to the style. It comes before the rest of the art and before new pieces; it gathers the style tasks that were in milestone 1c.","Escena común igual que la prueba de estilo v5: suelo con hierba densa, flores, matorrales, piedras y tierra pisada, y los árboles de la v5 (hoy el suelo de la construcción y del duelo es un llano verde con matas sueltas)":"Shared scene matching style test v5: ground with dense grass, flowers, bushes, rocks and trodden earth, and the v5 trees (today the building and duel ground is a flat green plain with scattered tufts)","Estilo elegido en las piezas: cimientos de piedra y de troncos, suelos de troncos y de tablas, y escaleras de mano y de tablas, como la prueba de estilo v5":"Chosen style on the pieces: stone and log foundations, log and plank floors, and ladders and plank stairs, like style test v5","Estilo elegido en las piezas: tejados de paja (con mechones) y de tablillas, y hastiales, como la prueba de estilo v5":"Chosen style on the pieces: thatched roofs (with tufts) and shingle roofs, and gables, like style test v5","Estilo elegido en las piezas: puertas de varas y de tablas, cerca de varas, empalizada y su puerta, mojón, y las barandillas y el portillo nuevos, como la prueba de estilo v5":"Chosen style on the pieces: pole and plank doors, pole fence, palisade and its gate, boundary stone, and the new railings and gate, like style test v5","Estilo elegido en los muebles: camas de paja y de madera, mesa, banco, taburete, arcón, barril, estantería, antorcha de pie, alfombra de piel y estandarte, como los enseres de la prueba de estilo v5":"Chosen style on the furniture: straw and wooden beds, table, bench, stool, chest, barrel, shelf, standing torch, fur rug and banner, like the household items in style test v5","Estilo elegido en todo lo demás que se ve en la construcción, el duelo y el visor: recursos del suelo, la pieza fantasma al construir, herramientas y armas en la mano y cualquier pieza que siga con el aspecto inicial, como la prueba de estilo v5":"Chosen style in everything else you see in building, the duel and the viewer: ground resources, the ghost piece when building, tools and weapons in hand, and any piece that still has the initial look, like style test v5","Revisión completa y publicación: cada vista de cada prototipo y de la demo única, en PC y en móvil, comparada en capturas lado a lado con la prueba de estilo v5; lo que no se vea igual se arregla antes de cerrar el hito":"Full review and release: every view of every prototype and of the single demo, on PC and mobile, compared side by side in screenshots with style test v5; anything that doesn't look the same is fixed before closing the milestone","Prueba online mínima":"Minimal online test","Dos jugadores en el mismo mundo desde dos dispositivos, construyendo y peleando, con el mundo guardado en un servidor sencillo; sin cuentas completas ni administración todavía.":"Two players in the same world from two devices, building and fighting, with the world saved on a simple server; no full accounts or administration yet.","Pedido de valravnx el 26 oct: lo multijugador es el mayor riesgo del proyecto y se comprueba pronto, justo después del estilo v5, antes de seguir ampliando piezas, ropa y sistemas.":"Requested by valravnx on 26 Oct: multiplayer is the project's biggest risk and is checked early, right after the v5 style, before adding more pieces, clothing and systems.","Planificar el hito: leer lo que el GDD dice de servidor, cuentas y PvP, y desglosar la prueba online en tareas de una sesión":"Plan the milestone: read what the GDD says about the server, accounts and PvP, and break the online test down into one-session tasks","Medir el servidor con 100 jugadores simulados (bots que andan, construyen y pelean): CPU, memoria y tráfico por jugador, para saber qué servidor hace falta y cuánto cuesta al mes":"Measure the server with 100 simulated players (bots that walk, build and fight): CPU, memory and traffic per player, to know which server is needed and what it costs per month","Dirección de arte y personajes":"Art direction and characters","Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.":"A character with realistic proportions and detail, customisation (body, face, hair, skin) and clothing and armour that show when worn; restrained light, materials and palette; terrain and building pieces with more detail. Low-poly built in code, but good-looking and able to run on mobile.","Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.":"High priority: before adding more pieces or systems, so they don't have to be redone in the new style later.","Correr más natural (valravnx: «la animación de correr me parece fea y exagerada»): primero suavizar por código la del paquete (menos braceo, rebote e inclinación); después probar carreras de captura de movimiento libres para uso comercial (Rokoko o CMU) si valravnx las baja":"More natural running (valravnx: «the running animation looks ugly and exaggerated»): first soften the pack's one by code (less arm swing, bounce and lean); then try free motion-capture runs cleared for commercial use (Rokoko or CMU) if valravnx downloads them","Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que valravnx elija":"Three style tests (character and a scene with a cabin) with different lighting, materials and level of detail, for valravnx to choose from","Rehacer las pruebas de estilo (revisión de valravnx: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio":"Redo the style tests (valravnx's review: B and C are very slow and the character doesn't work): a single light, stylised style (cheap toon or Lambert material, palette in a small texture, one light with a 1024 shadow, adaptive resolution), measured budget: scene ≤ 30k triangles and ≤ 60 draw calls, 60 fps on a mid-range phone","Prueba de estilo v3, «maqueta en miniatura» (elegido por valravnx): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto":"Style test v3, \"miniature diorama\" (chosen by valravnx): clean, rounded shapes, soft light with contact shadows, blurred background; continuous stone foundation (not loose stones); same budget","Prueba de estilo v4, «realismo en miniatura» (pedido por valravnx): la v3 con texturas por código y el mundo sin recortar":"Style test v4, \"miniature realism\" (requested by valravnx): v3 with code-generated textures and an uncropped world","Prueba de estilo v5: árboles rehechos (valravnx: «los árboles fatal, se ven como rayajos raros; la casa está bien»)":"Style test v5: trees redone (valravnx: \"the trees are awful, they look like weird scribbles; the house is fine\")","Personaje nuevo por código (decidido por valravnx), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas":"New character built in code (valravnx's decision), eye-catching and in the diorama style: a single continuous mesh with skeleton and animation, believable, slightly stylised proportions","Personaje base articulado con el estilo elegido (también el rival del combate) (hecho con el personaje nuevo por código)":"Articulated base character in the chosen style (also the combat opponent) (done with the new code-made character)","Personaje v2 con bases libres (CC0) ya hechas en vez de esculpirlo por código (valravnx: «horripilante»): cabeza, ropa, pelo y animaciones del paquete, con personalización":"Character v2 from ready-made free (CC0) bases instead of sculpting it in code (valravnx: \"horrifying\"): head, clothing, hair and animations from the pack, with customisation","Personaje v3: rendimiento en el móvil (iba a 10 fps) y fuera el traje de explorador por ser de fantasía":"Character v3: mobile performance (it ran at 10 fps) and the ranger outfit removed for being too fantasy","Recursos de personaje v2: todo comprimido (las animaciones bajan de 4,4 MB a unos 0,7 MB) y el personaje con las 39 animaciones extra (trabajos, arco, espada ligera y pesada, bloqueo, vendarse, pasos en todas direcciones)":"Character assets v2: everything compressed (animations drop from 4.4 MB to about 0.7 MB) and the character with the 39 extra animations (work, bow, light and heavy sword, block, bandaging, steps in every direction)","Taller propio sin pantalla (Blender por pip) para reasignar animaciones, reducir mallas y probar a crear cuerpos y caras propios con MakeHuman (MPFB2), con su esqueleto compatible":"Our own headless workshop (Blender via pip) to retarget animations, reduce meshes and try creating our own bodies and faces with MakeHuman (MPFB2), whose skeleton is compatible","Taller: ropa por capas, primera tanda — camisa de lino bajo la túnica y gambesón acolchado encima, hechos por código sobre el cuerpo de MakeHuman, que se ponen y se quitan como capas":"Workshop: layered clothing, first batch — linen shirt under the tunic and a padded gambeson over it, made by code on the MakeHuman body, put on and taken off as layers","Taller: cota de malla (anillas por código) y sobreveste encima, como capas":"Workshop: mail (rings made by code) and a surcoat over it, as layers","Taller: el cinturón de encima de la cota sobresale hacia los lados hasta la altura de los brazos (se ve en las fotos del taller con los brazos abiertos; ya estaba en los recursos taller-v4)":"Workshop: the belt worn over the mail shirt sticks out sideways as far as the arms (visible in the workshop photos with the arms spread; it was already in the taller-v4 assets)","Taller: capa con capucha, calzado y tocados (capucha suelta, sombrero de paja, toca)":"Workshop: hooded cloak, footwear and headwear (loose hood, straw hat, coif)","Taller: personalización — altura, complexión y cara con los ajustes de MakeHuman, tono de piel, color de ojos, peinado y barba":"Workshop: customization — height, build and face with the MakeHuman settings, skin tone, eye colour, hairstyle and beard","Taller: más peinados (melena, coleta, trenzas) y barbas (corta, larga, perilla), y arreglar la claridad de la barbilla":"Workshop: more hairstyles (long, ponytail, braids) and beards (short, long, goatee), and fix the light patch on the chin","Taller: pies descalzos. El cuerpo no tiene pies bajo los zapatos (se quitan al vestir) y el GDD dice que se empieza descalzo: hace falta el cuerpo con pies cuando no lleva zapatos":"Workshop: bare feet. The body has no feet under the shoes (they are removed when dressing) and the GDD says you start barefoot: the body needs feet when it wears no shoes","Taller: pasar también las 39 animaciones extra (trabajos, arco, espada, bloqueo, vendarse, pasos) al esqueleto de MakeHuman":"Workshop: also transfer the 39 extra animations (jobs, bow, sword, block, bandaging, steps) to the MakeHuman skeleton","Personalización en el juego de toda la ropa y la armadura (pedido de valravnx): color o tinte de cada prenda, blasón o dibujo en la sobreveste, y qué capas lleva. Para eso las texturas de la ropa pasan a ir en gris con el color aparte, que se cambia sin rehacer el modelo":"In-game customization of all clothing and armour (valravnx's request): colour or dye of each garment, a coat of arms or design on the surcoat, and which layers are worn. For this the clothing textures become grey with the colour kept separately, so it can be changed without rebuilding the model","Ropa y armadura crafteables por capas (camisa, gambesón, cota de malla, sobreveste): cada pieza fabricada cambia su aspecto según material, corte, tejido y tinte (sin calidades), sobre el mismo esqueleto":"Craftable layered clothing and armour (shirt, gambeson, mail, surcoat): each crafted piece changes its look according to material, cut, weave and dye (no quality tiers), on the same skeleton","Heridas y sangrado visibles en el personaje: corte, golpe y estocada se pintan donde entran (también rompen y manchan la ropa), el sangrado se extiende con el tiempo y el vendaje se ve puesto":"Visible wounds and bleeding on the character: cuts, blows and thrusts are painted where they land (they also tear and stain the clothing), bleeding spreads over time and bandages show when applied","Terreno, hierba, árboles y luz con el estilo elegido, ya por trozos que se cargan y se descargan alrededor del jugador (para el mundo grande)":"Terrain, grass, trees and light in the chosen style, already in chunks that load and unload around the player (for the big world)","Niveles de detalle del personaje del taller: versiones reducidas para verlo de lejos, cambio automático por distancia y texturas juntas; medido con 20 personajes en pantalla":"Levels of detail for the workshop character: reduced versions to see it from afar, automatic switching by distance and merged textures; measured with 20 characters on screen","Rendimiento en móvil: medir y ajustar el nivel de detalle":"Mobile performance: measure and adjust the level of detail","Más piezas de construcción":"More building pieces","Piezas y muebles con el estilo elegido; obras con marco, materiales y tiempo, andamio, polea y polipasto; escaleras, barandillas, contraventanas, tejas, remates, chimenea, adarve y decoración; muros de piedra con grúa de rueda.":"Pieces and furniture in the chosen style; building works with frame, materials and time, scaffold, pulley and block and tackle; stairs, railings, shutters, tiles, ridges, chimney, wall-walk and decoration; stone walls with a treadwheel crane.","La primera tarea (madera más resistente) se adelantó el 24 oct porque la casa de dos plantas de valravnx y su pareja no admitía el tejado en las esquinas. Planificado el 25 oct a petición de valravnx por el chat, en paralelo a la sesión de la ropa. Los puentes de troncos no entran: necesitan agua en el mapa y llegan con el hito Mundo.":"The first task (sturdier wood) was brought forward on 24 Oct because valravnx and his partner's two-storey house would not accept the roof at the corners. Planned on 25 Oct at valravnx's request in the chat, in parallel with the clothing session. Log bridges are not included: they need water on the map and come with the World milestone.","Arreglo (pedido de valravnx): en PC no se pueden quitar muebles ni piezas, porque al mover el ratón hacia «Confirmar» se pierde lo elegido. Lo elegido con clic se queda fijo hasta confirmar o cancelar":"Fix (valravnx’s request): on PC furniture and pieces cannot be removed, because moving the mouse towards «Confirm» loses the selection. What you click now stays selected until you confirm or cancel","Más resistencia en la madera (valravnx: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa":"More strength for wood (valravnx: \"wood is too weak, it won't allow 2 storeys with a roof\"): a 2-storey house with a roof made only of basic wooden pieces (log foundation, walls and floor) must be buildable without tricks; building shouldn't drive you mad, but you should be able to do things. A logic test that guarantees it, and screenshots of the house","Planificar el hito: lista de piezas sacada del GDD y del documento de sistemas":"Plan the milestone: list of pieces taken from the GDD and the systems document","Escalera de tablas (N2: 6 tablas y clavos): ocupa una casilla, sube una planta y se sube andando, sin botón; deja el hueco abierto en el suelo de arriba. Pruebas de lógica (apoyos y hueco) y de navegador (subir y bajar andando)":"Plank staircase (T2: 6 planks and nails): takes one tile, climbs one floor and is walked up, no button needed; leaves the hole open in the floor above. Logic tests (supports and hole) and browser tests (walking up and down)","Barandillas y vallas: medio muro como barandilla en el borde de un suelo en alto (no se puede caer por ahí) y portillo para la cerca de varas (corrales), que se abre con Usar como las puertas":"Railings and fences: half wall as a railing on the edge of a raised floor (you cannot fall off there) and a gate for the stick fence (pens), opened with Use like doors","Estilo elegido en las piezas (valravnx: «los muebles y la construcción son los low-poly iniciales, no lo de la prueba visual»; va antes de añadir más piezas): muros de troncos (también con puerta y ventana), de zarzo y barro, de entramado y de tablas, medio muro, postes y vigas, con los troncos, la corteza, las testas y las texturas por código de la cabaña de la prueba de estilo v5":"Chosen style on the pieces (valravnx: «the furniture and building are the initial low-poly ones, not what was in the visual test»; it comes before adding more pieces): walls of logs (also with door and window), of wattle and daub, of timber framing and of planks, half wall, posts and beams, with the logs, bark, log ends and code-made textures of the cabin in style test v5","Obras (decidido por valravnx el 26 oct): poner el marco de la pieza, que se ve como un armazón; llevarle los materiales y construirla con un tiempo según la pieza; si te ayudan, tarda menos. Todo en la lógica pura, con el autor de cada entrega y de cada rato de trabajo":"Building works (decided by valravnx on 26 Oct): place the frame of the piece, which looks like a framework; bring it the materials and build it with a time depending on the piece; if others help, it takes less. All in the pure logic, with the author of each delivery and each stint of work","Obras: clase de peso de cada material (ligero, pesado, muy pesado) y llevar el material hasta la altura de la obra: lo ligero a mano por escalera; los troncos de muro entre dos, o uno solo rodándolos por dos varas con una cuerda (más despacio)":"Building works: weight class of each material (light, heavy, very heavy) and bringing the material up to the height of the work: light things by hand up a ladder; wall logs between two people, or one alone rolling them up two poles with a rope (slower)","Obras: andamio pegado al muro (trabajar y dejar material por encima de la primera planta) y polea simple en una viga (pesos medios, una persona)":"Building works: scaffold against the wall (working and leaving material above the first floor) and a single pulley on a beam (medium weights, one person)","Obras: polipasto con torno para vigas grandes y sillares (uno tira y otro guía)":"Building works: block and tackle with a windlass for big beams and ashlars (one pulls and one guides)","Contraventana y trampilla (N2: 2 tablas y clavos): la contraventana cierra la ventana de un muro y la trampilla tapa el hueco de una escalera; las dos se abren y cierran con Usar. Añadir también el muro de tablas con ventana, que falta":"Shutter and trapdoor (T2: 2 planks and nails): the shutter closes a wall's window and the trapdoor covers a staircase hole; both open and close with Use. Also add the plank wall with window, which is missing","Tejado de teja (N2: 10 tejas y vigas, pesa 200 kg, no se pudre ni arde fácil): material nuevo «teja» y su prueba de carga":"Tile roof (T2: 10 tiles and beams, weighs 200 kg, does not rot or burn easily): new «tile» material and its load test","Remate de tejado: cumbrera y esquinas, para que los tejados de dos tramos que se cruzan en una esquina queden cerrados":"Roof finishing: ridge and corners, so that two-section roofs meeting at a corner are closed","Chimenea u hogar interior (N2: piedras y barro, 600 kg): solo sobre cimiento de piedra, con fuego, luz y humo que sale por el tejado":"Chimney or indoor hearth (T2: stones and mud, 600 kg): only on a stone foundation, with fire, light and smoke coming out through the roof","Adarve (pasarela por detrás de la empalizada: tablas y postes, sostiene 300 kg), al que se sube por escalera de mano o de tablas":"Wall walk (walkway behind the palisade: planks and posts, holds 300 kg), reached by a ladder or a plank staircase","Decoración que falta del documento de sistemas: tinaja, antorcha de pared, tapiz y ganchos para herramientas":"Missing decoration from the systems document: storage jar, wall torch, tapestry and tool hooks","Muros de piedra (mampostería) y grúa de rueda para subir la piedra en grupo: una o dos personas andando en la rueda y alguien guiando; la grúa se sube de planta según crece la obra":"Stone walls (masonry) and a treadwheel crane to lift stone as a group: one or two people walking in the wheel and someone guiding; the crane is raised a floor as the work grows","Equipo y carga por huecos":"Equipment and slot-based carrying","Panel de inventario, cinturones, leñero y otras mochilas; tala, transporte y ralentización por cargar.":"Inventory panel, belts, firewood frame and other backpacks; felling, hauling and slowing down when carrying.","Planificar el hito: lista de tareas sacada del GDD y del documento de sistemas":"Plan the milestone: task list taken from the GDD and the systems document","Datos de cada prenda en la lógica pura (zonas que cubre, protección por tipo de golpe, abrigo, peso), unidos a la ropa por capas del taller: lo que se ve y lo que protege salen de lo mismo":"Data for each garment in the pure logic (zones covered, protection by type of blow, warmth, weight), linked to the workshop's layered clothing: what is seen and what protects come from the same thing","Estaciones y crafting":"Workstations and crafting","Primeras estaciones, recetas, desbloqueo por práctica, durabilidad y reparación.":"First workstations, recipes, unlocking through practice, durability and repair.","Supervivencia":"Survival","Necesidades con avisos, ropa contra el frío, cama ligada y muerte con saqueo parcial.":"Needs with warnings, clothing against the cold, bound bed, and death with partial looting.","Duelo":"Duel","Esgrima contra un bot con heridas.":"Fencing against a bot, with wounds.","El campo de pruebas de combate se adelantó para probar el sistema antes del resto. v1 y v2 hechas el 24 oct entre las 16:45 y las 17:25 aprox.":"The combat test ground was brought forward to try the system before everything else. v1 and v2 done on 24 Oct between about 16:45 and 17:25.","Combate v1: líneas de golpe, guardias, heridas, arco":"Combat v1: strike lines, guards, wounds, bow","Combate v2: rosa de golpes, parada perfecta, golpe maestro, fintas, peso de los golpes":"Combat v2: strike rose, perfect parry, master strike, feints, weight of blows","Arreglo del arco: no soltar antes del 50% de tensión, correr cancela el tensado, 0,8 s para encajar otra flecha (piedras 0,5 s), con pruebas":"Bow fix: no release below 50% draw, running cancels the draw, 0.8 s to nock another arrow (stones 0.5 s), with tests","Escudo provisional: opción «Espada y escudo» (espada de una mano), para flechas y piedras de frente, parada más barata, se ve en el brazo izquierdo y se levanta al parar; también para el rival":"Provisional shield: \"Sword and shield\" option (one-handed sword), stops arrows and stones from the front, cheaper parry, visible on the left arm and raised when parrying; also for the opponent","Cámara táctil con un dedo durante el combate":"One-finger touch camera during combat","Curación de heridas":"Wound healing","Prueba de golpes en las cinco direcciones de la rosa con el personaje del taller: el brazo va hacia el objetivo (cinemática inversa) sobre una animación base, porque el paquete solo trae unos pocos golpes; si no convence, buscar otra vía antes de seguir":"Test of strikes in the rose's five directions with the workshop character: the arm goes towards the target (inverse kinematics) over a base animation, because the pack only has a few strikes; if it does not convince, find another way before going on","Asedio, fuego y mantenimiento":"Siege, fire and upkeep","Ariete, daño por fuego, mojón con materiales.":"Battering ram, fire damage, boundary stone with materials.","Fauna y caza":"Wildlife and hunting","Animales realistas.":"Realistic animals.","Caballos":"Horses","Domar, montar, cuadra y pasto.":"Taming, riding, stable and pasture.","Granja y estaciones del año":"Farming and seasons","Siembras por franja, ganado.":"Sowing by climate band, livestock.","Mundo":"World","Pseudo-Europa por semilla a escala real: cordilleras como los Pirineos, valles y collados, ríos de tres gruesos (arroyos que se vadean, ríos con pocos vados, grandes ríos con barca o puente), bosques frondosos, pendientes que frenan; agua y nado; 5 países con estilo propio, caminos por uso, puentes.":"Seed-based pseudo-Europe at real scale: mountain ranges like the Pyrenees, valleys and passes, rivers of three sizes (streams you can ford, rivers with few fords, great rivers with a boat or bridge), dense forests, slopes that slow you down; water and swimming; 5 countries with their own style, paths through use, bridges.","Servidor y cuentas":"Server and accounts","Registro e inicio de sesión seguros, recuperación de cuenta, creación de personaje, mundo persistente con servidor autoritativo.":"Secure registration and login, account recovery, character creation, persistent world with an authoritative server.","Prioridad alta. Contraseñas con hash, conexión cifrada, límite de intentos, copias de seguridad.":"High priority. Hashed passwords, encrypted connection, attempt limits, backups.","Comparar alojamientos y costes para el servidor y la base de datos, y llevar las opciones a valravnx (la elección es suya)":"Compare hosting options and costs for the server and database, and take the options to valravnx (the choice is his)","Administración, registros y seguridad":"Administration, logs and security","Roles (jugador, moderador, administrador) para la cuenta de valravnx y las que él decida; panel de administración; registros consultables de lo que pasa en el mundo (comercio, saqueos, construcción y destrucción, muertes, conexiones); detección de trampas en el servidor (velocidad, alcance, acciones imposibles); sanciones (aviso, silencio, expulsión, bloqueo) y registro de lo que hace cada administrador.":"Roles (player, moderator, administrator) for valravnx's account and those he chooses; admin panel; searchable logs of what happens in the world (trade, looting, building and destruction, deaths, connections); server-side cheat detection (speed, reach, impossible actions); sanctions (warning, mute, kick, ban) and a log of what each administrator does.","Prioridad alta: es un juego online persistente. Desde ya, toda acción que cambia el mundo pasa por la lógica con autor, para poder registrarla después.":"High priority: this is a persistent online game. From now on, every action that changes the world goes through the logic with an author, so it can be logged later.","PvP online y protección offline":"Online PvP and offline protection","Combate y asedio entre jugadores; reglas de guerra.":"Combat and sieges between players; rules of war.","Tierras y familias":"Lands and families","Mojones, radio de exclusión, peajes, conquista, familias, vasallajes, alianzas, escudos de armas.":"Boundary stones, exclusion radius, tolls, conquest, families, vassalage, alliances, coats of arms.","Economía y NPCs":"Economy and NPCs","Encargos y moneda, puestos sin conexión, tomos, NPCs ambulantes a sueldo, centinelas y mensajeros.":"Commissions and currency, offline stalls, tomes, hired travelling NPCs, sentries and messengers.","Combate a caballo y a distancia":"Mounted and ranged combat","Arcos, ballestas, lanzas de caballería.":"Bows, crossbows, cavalry lances.","Navegación":"Sailing","Astillero, barcos, navegar con otros.":"Shipyard, ships, sailing with others.","Cartografía":"Cartography","Mesa de cartógrafo y mapas como objetos.":"Cartographer's table and maps as objects.","Demo única":"Single demo","Todo en una página: construir, duelo y personaje, con el mismo personaje del taller y la misma escena.":"Everything on one page: building, duel and character, with the same workshop character and the same scene.","Primera demo única: menú con Construir, Duelo y Personaje; el personaje que eliges (cuerpo y ropa) es el que construye y el que lucha":"First single demo: menu with Build, Duel and Character; the character you choose (body and clothing) is the one who builds and fights","Los fps de tu aparato junto a «Menú» y, al pulsarlos, el detalle (tiempo de cada fotograma, triángulos, memoria y personajes en escena); en «Construir», personajes de prueba para medir con gente":"Your device’s fps next to “Menu” and, when tapped, the details (time per frame, triangles, memory and characters in the scene); in “Build”, test characters to measure with people around","En el móvil, el aviso de «Construir» ya no tapa los botones del menú de arriba (tampoco en inglés y en ruso, ni con «Menú» y los fps). Lleva la construcción v11.":"On mobile, the «Build» notice no longer covers the top menu buttons (also in English and Russian, and with «Menu» and the fps). It carries construction v11.","Correr más natural en las tres partes: la carrera suavizada (menos zancada, braceo, bote e inclinación) y a su velocidad de verdad, sin resbalar ni cámara lenta. Es la construcción v11, el combate v8 y el personaje v12.":"More natural running in all three parts: the softened run (shorter stride, less arm swing, bounce and lean) at its real speed, with no sliding or slow motion. It is construction v11, combat v8 and character v12.","Brazos naturales al correr en las tres partes (personaje v13).":"Natural arms when running in all three parts (character v13).","El cinturón de la cota ceñido, en las tres partes (personaje v14, taller-v7).":"The belt over the mail fitted, in all three parts (character v14, taller-v7).","Sin pantalla en blanco en el móvil (fuga de memoria gráfica arreglada), aviso si se pierde el dibujo 3D y muros con el estilo elegido.":"No blank screen on mobile (graphics memory leak fixed), a notice if the 3D view is lost, and walls in the chosen style.","Barandillas y portillo en «Construir» (construcción v13).":"Railings and gate in “Build” (construction v13).","Escena con el estilo v5 en «Construir» y «Duelo» (construcción v14, combate v10)":"Scene in the v5 style in “Build” and “Duel” (construction v14, combat v10)","Cimientos, suelos y escaleras con el estilo de la prueba v5, como en la construcción v15.":"Foundations, floors and stairs in the v5 style test look, as in building v15.","Construcción v16: tejados de paja y de tablillas, y lo que cierra bajo el tejado, con el estilo v5":"Construction v16: thatched and shingle roofs, and what closes the gap under the roof, in the v5 style","Construcción v17: puertas, cercas, portillo, empalizada y mojón con el estilo v5":"Construction v17: doors, fences, fence gate, palisade and boundary stone in the v5 style","Construcción v18: los muebles con el estilo v5":"Construction v18: furniture in the v5 style","Construcción v19 y combate v11: pieza fantasma con su textura, hacha al talar y armas, escudo, poste y diana con el estilo v5":"Construction v19 and combat v11: ghost piece with its texture, axe when felling, and weapons, shield, post and target in the v5 style","Construye una cabaña: cimientos, suelos, muros, tejados y muebles, con límite de carga.":"Build a cabin: foundations, floors, walls, roofs and furniture, with load limits.","Muros exactos a 2,5 m por hiladas.":"Walls exactly 2.5 m high, built in courses.","Madera más resistente: casa de 2 plantas con tejado de troncos; vano de una casilla en suelos y tejados.":"Stronger wood: a 2-storey log house with a roof; one-cell span for floors and roofs.","Juego en inglés: botón ES/EN arriba a la derecha (recuerda el idioma elegido, también el de la web) y todos los textos traducidos; la partida no se pierde al cambiar.":"Game in English: ES/EN button at the top right (remembers the chosen language, including the website's) and all texts translated; your game isn't lost when switching.","Escalera de tablas: ocupa una casilla y se sube andando, sin botón; encima deja el hueco abierto.":"Plank stairs: they take one tile and you climb them by walking, no button; they leave the opening above open.","v7: también en ruso (botón RU arriba; en el móvil, el idioma se elige en un desplegable y los botones de modo se colocan debajo del menú).":"v7: also in Russian (RU button at the top; on mobile, the language is chosen from a drop-down and the mode buttons sit below the menu).","Quitar muebles y piezas con el ratón: lo que eliges con clic se queda elegido hasta confirmar o cancelar, aunque muevas el ratón hasta el botón":"Removing furniture and pieces with the mouse: what you click stays selected until you confirm or cancel, even if you move the mouse to the button","Escena común del estilo elegido: cielo, luz, sombras blandas, suelo con textura, bosque, hierba, flores y rocas":"Shared scene in the chosen style: sky, light, soft shadows, textured ground, forest, grass, flowers and rocks","El jugador es el personaje del taller propio (camisa y calzas de lino): anda, corre y tala con sus animaciones":"The player is the character from our own workshop (linen shirt and hose): they walk, run and chop with their animations","En el móvil, el aviso de abajo del menú ya no tapa «Reiniciar» ni otros botones (tampoco en inglés y en ruso): se coloca según lo que mide el menú de arriba y a la izquierda de los botones de modo.":"On mobile, the notice under the menu no longer covers «Reset» or other buttons (also in English and Russian): it is placed according to the size of the top menu and to the left of the mode buttons.","Arreglo de la pantalla en blanco en el móvil: al colocar o quitar piezas ya no se llena la memoria gráfica. Aviso y recarga si se pierde el dibujo 3D. Muros, postes y vigas con el estilo elegido.":"Fix for the blank screen on mobile: placing or removing pieces no longer fills graphics memory. Notice and reload if the 3D view is lost. Walls, posts and beams in the chosen style.","Barandillas y portillo: el medio muro hace de barandilla en el borde de un suelo en alto y alrededor del hueco de la escalera (por ahí ya no se cae), y portillo de varas para la cerca, que se abre y se cierra con Usar.":"Railings and gate: the half wall works as a railing on the edge of a raised floor and around the stair opening (you can no longer fall there), and a wattle gate for the fence, which opens and closes with Use.","Escena como la prueba de estilo v5: hierba densa con flores también en el centro, matorrales, calvas de tierra pisada, rocas y árboles de copa sueltos; la hierba se esconde bajo lo construido y vuelve al quitarlo":"Scene like the v5 style test: dense grass with flowers in the centre too, bushes, patches of trodden earth, rocks and loose broadleaf trees; grass hides under what you build a
