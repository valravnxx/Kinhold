co y el tejado grande ya no se ve a cuadros. Solo vuelan 20 cm los lados que no tienen otro tramo al lado.":"The thatch courses have flat sides: sections placed side by side join without a groove and a large roof no longer looks quilted. Only sides with no other section next to them overhang, by 20 cm.","Tejado de tablillas: tablazón debajo y filas de tablillas solapadas, desplazadas media tablilla y con el pie levantado; tabla de remate en los lados que vuelan y caballete en la cumbrera.":"Shingle roof: boarding underneath and rows of overlapping shingles, offset by half a shingle and with the butt raised; barge board on the overhanging sides and a ridge cap.","Lo que cierra bajo el tejado (los hastiales automáticos): tablas de pie cortadas con la pendiente en muros de troncos y de tablas; barro con estacas en el zarzo y encalado con postes en el entramado. El hastial suelto antiguo también, con tablas de pie.":"What closes the gap under the roof (the automatic gables): upright boards cut to the slope on log and plank walls; mud with stakes on wattle and whitewash with posts on timber frame. The old standalone gable too, with upright boards.","La lógica (geometriaTejados) dice ahora qué lados de cada tramo vuelan, qué tramo pone la cumbrera (uno solo de los dos) y su paridad; el dibujo lo usa.":"The logic (geometriaTejados) now says which sides of each section overhang, which section puts on the ridge (only one of the two) and its parity; the drawing uses it.","Muestrario nuevo de casas con tejado (herramientas/muestrario/tejados.js, fotos.py casas=1) para sacar fotos de cerca.":"New showcase of houses with roofs (herramientas/muestrario/tejados.js, fotos.py casas=1) for close-up photos.","Pruebas nuevas: cumbrera de un solo tramo, lados que vuelan y paridad (lógica, rotas a propósito: fallan); tejados con el estilo v5, nada por debajo del plano del tejado, lados planos de la paja (rota con MUTAR_TEJADO=1: falla) y rellenos que llegan al tejado sin atravesarlo (modelos).":"New tests: ridge from a single section, overhanging sides and parity (logic, broken on purpose: they fail); roofs in the v5 style, nothing below the roof plane, flat sides on the thatch (broken with MUTAR_TEJADO=1: fails) and fills that reach the roof without going through it (models).","Publicadas construcción v16 y demo única v11, con comparación lado a lado con la prueba v5.":"Published construction v16 and single demo v11, with a side-by-side comparison with style test v5.","Triángulos por tramo medidos en node: paja 2072 (2520 con cumbrera), tablillas 2244, relleno de tablas 108 (antes unos 48 el tramo). No comprobado en un móvil de verdad.":"Triangles per section measured in node: thatch 2072 (2520 with ridge), shingles 2244, board fill 108 (before, about 48 per section). Not checked on a real phone.","Hito 1e: puertas, cercas, portillo, empalizada y mojón con el estilo v5":"Milestone 1e: doors, fences, fence gate, palisade and boundary stone in the v5 style","Todas correctas con probar_todo.sh: lógica 86/86, modelos 64/64, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"All passing with probar_todo.sh: logic 86/86, models 64/64, combat 69/69, actions 25/25, belts, workshop, merge, languages; browser tests for construction, combat, style, character, demo, assets, language and website, on PC and mobile.","Puertas con el estilo v5: la de tablas como la de la cabaña de la prueba (cuatro tablas, peinazos por detrás, bisagras largas de hierro con clavos y tirador de argolla); la de varas, varas atadas con cuerda a dos travesaños, con tornapunta.":"Doors in the v5 style: the plank door like the one on the test cabin (four planks, battens on the back, long iron hinges with nails and a ring handle); the pole door, poles tied with rope to two crossbars, with a diagonal brace.","Cerca de varas como la de la prueba v5: postes redondos con el corte claro arriba, dos varas atadas con lazadas de cuerda que llegan al borde de la casilla.":"Pole fence like the one in test v5: round posts with the light cut end on top, two poles tied with rope loops that reach the edge of the tile.","Portillo: postes más gruesos y hoja de varas con tornapunta, ataduras y lazos de cuerda que hacen de bisagra.":"Fence gate: thicker posts and a leaf of poles with a diagonal brace, lashings and rope loops that act as hinges.","Empalizada: troncos descortezados como los de los muros, de distinto alto y algo torcidos, con la punta tallada clara y dos traviesas detrás. Su puerta: tablones con punta, traviesas por detrás, pletinas de hierro con clavos y argolla.":"Palisade: debarked logs like those of the walls, of different heights and slightly crooked, with the light carved point and two rails behind. Its gate: pointed planks, rails on the back, iron straps with nails and a ring.","Mojón: piedras apiladas de caras planas, como las de los cimientos, y una vara con un trapo atado.":"Boundary stone: stacked flat-faced stones, like those of the foundations, and a pole with a rag tied to it.","Lo que se abre (puertas, portillo y puerta de la empalizada) va en su propia malla, que gira en las bisagras; el resto, junto en una malla por textura como las demás piezas del estilo.":"What opens (doors, fence gate and palisade gate) goes in its own mesh, which turns on the hinges; the rest is merged into one mesh per texture like the other pieces in the style.","Las barandillas son el medio muro de troncos, que ya tenía el estilo desde la construcción v12.":"The railings are the half log wall, which already had the style since construction v12.","El muestrario de piezas acepta «tipo@abierta» (hoja abierta) y «mojon».":"The piece showcase accepts «type@abierta» (open leaf) and «mojon».","Pruebas nuevas de modelos: estas piezas y el mojón hechos con el estilo v5, la hoja aparte, la puerta cabe en el hueco del muro y abierta lo deja libre (rota con MUTAR_PUERTA=1: falla), las varas de la cerca llegan al borde y el alto de la empalizada.":"New model tests: these pieces and the boundary stone made in the v5 style, the leaf separate, the door fits in the wall opening and when open leaves it clear (broken with MUTAR_PUERTA=1: fails), the fence poles reach the edge and the palisade height.","Publicadas construcción v17 y demo única v12, con comparación lado a lado con la prueba v5.":"Published construction v17 and single demo v12, with a side-by-side comparison with style test v5.","Triángulos por pieza medidos en node: puerta de varas 936, puerta de tablas 1180, cerca 552, portillo 640, empalizada 426, puerta de empalizada 2112, mojón 440. No comprobado en un móvil de verdad.":"Triangles per piece measured in node: pole door 936, plank door 1180, fence 552, fence gate 640, palisade 426, palisade gate 2112, boundary stone 440. Not checked on a real phone.","Hito 1e: muebles con el estilo v5":"Milestone 1e: furniture in the v5 style","Todas correctas con probar_todo.sh: lógica 86/86, modelos 88/88, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"All passing with probar_todo.sh: logic 86/86, models 88/88, combat 69/69, actions 25/25, belts, workshop, merge, languages; browser tests for construction, combat, style, character, demo, assets, language and website, on PC and mobile.","Los once muebles rehechos con el estilo v5, como el banco, el barril y el tocón de la prueba: madera con veta, cortes claros, hierro oscuro y oclusión horneada, juntos en una malla por textura.":"All eleven pieces of furniture remade in the v5 style, like the bench, barrel and stump in the test: grained wood, light cut ends, dark iron and baked occlusion, merged into one mesh per texture.","Cama de paja: marco de cuatro troncos con las testas a la vista, paja amontonada con mechones que asoman, jergón de lino y manta de lana doblada. Cama de madera: postes, largueros y cabecero de tablas, somier de tablas, colchón y almohada de lino, manta con el embozo vuelto.":"Straw bed: a frame of four logs with the ends showing, heaped straw with tufts poking out, a linen pallet and a folded wool blanket. Wooden bed: posts, side rails and a plank headboard, plank slats, linen mattress and pillow, a blanket with the top folded back.","Mesa de tres tablas sobre dos caballetes con patas en tijera y travesaño; banco como el de la prueba, con la espiga pasante a ras; taburete de una rodaja (se ve el corte) con tres patas abiertas.":"Table of three planks on two trestles with splayed legs and a stretcher; bench like the one in the test, with the through-tenon flush; stool made from a log slice (the cut shows) with three splayed legs.","Arcón de tablas con patines, flejes, clavos, cerradura y aldaba de hierro; barril de catorce duelas abombadas con juntas, dos aros y tapa de tablas; estantería con trasera de tablas, vasijas de barro torneadas, un cuenco, un rollo de paño y un manojo.":"Plank chest with skids, iron straps, nails, lock and hasp; barrel of fourteen bulging staves with gaps, two hoops and a plank lid; shelf with a plank back, turned clay jars, a bowl, a roll of cloth and a bundle.","Antorcha de pie: vara entre piedras con un cesto de hierro y estopa; la llama va aparte, brilla y no da sombra. Alfombra: piel curtida con su forma (patas y cuello) y el lomo más oscuro. Estandarte: asta con regatón entre piedras, travesaño atado y paño en pliegues con dos puntas y una banda.":"Standing torch: a pole among stones with an iron basket and tow; the flame is separate, glows and casts no shadow. Rug: a tanned hide with its shape (legs and neck) and a darker back. Banner: a pole with an iron tip among stones, a tied crossbar and a folded cloth with two tails and a band.","Textura nueva por código para los paños (tejido de lino y lana) y colores de lino, lana, paño, piel y barro en la paleta.":"New code-generated texture for cloth (linen and wool weave) and linen, wool, cloth, hide and clay colours in the palette.","Mismo tamaño y apoyo que antes: la lógica y los guardados no cambian.":"Same size and footprint as before: the logic and the saves do not change.","Pruebas nuevas de modelos: cada mueble hecho con el estilo v5, apoyado en el suelo y dentro de su sitio, y la llama de la antorcha (rota con MUTAR_MUEBLE=1: falla). La de navegador pone los once muebles en fila y saca fotos de cerca.":"New model tests: every piece of furniture made in the v5 style, resting on the ground and within its spot, and the torch flame (broken with MUTAR_MUEBLE=1: it fails). The browser test places all eleven in a row and takes close-up shots.","Publicadas construcción v18 y demo única v13, con comparación lado a lado con la prueba v5.":"Published construction v18 and single demo v13, with a side-by-side comparison with test v5.","Triángulos por mueble medidos en node: cama de paja 1356, cama de madera 3224, mesa 676, banco 540, taburete 154, arcón 2388, barril 1272, estantería 1824, antorcha 720, alfombra 552, estandarte 1720. No comprobado en un móvil de verdad.":"Triangles per piece of furniture measured in node: straw bed 1356, wooden bed 3224, table 676, bench 540, stool 154, chest 2388, barrel 1272, shelf 1824, torch 720, rug 552, banner 1720. Not checked on a real phone.","Hito 1e: armas, hacha, pieza fantasma y resaltados con el estilo v5":"Milestone 1e: weapons, axe, ghost piece and highlights in the v5 style","Todas las pruebas de herramientas/probar_todo.sh correctas (modelos 104/104, construcción, combate, estilo, personaje, demo, idiomas y web en el navegador); capturas revisadas en PC y móvil":"All tests in herramientas/probar_todo.sh pass (models 104/104, construction, combat, style, character, demo, languages and website in the browser); screenshots checked on PC and mobile","Armas del duelo rehechas con el estilo v5: espadas con la hoja de sección de rombo y su vaceo, puño forrado de cuero con atadura, cruz y pomo de rueda de hierro; palo de vara descortezada con nudos y los cortes a la vista; arco de una pieza que adelgaza hacia las puntas, con puño de cuero.":"Duel weapons remade in the v5 style: swords with a diamond-section blade and its fuller, a leather-wrapped grip with binding, an iron cross and wheel pommel; the staff a peeled rod with knots and visible cut ends; the bow a single piece that thins towards the tips, with a leather grip.","Escudo de seis tablas con veta que llenan el círculo, canto forrado de cuero cosido y umbo con su aro y clavos; flecha con punta de hierro y tres plumas atadas; piedra de honda con textura de piedra.":"Shield of six grained planks that fill the circle, a stitched leather-covered rim and a boss with its ring and nails; arrow with an iron head and three bound feathers; sling stone with a stone texture.","Poste de práctica con dos haces de paja atados con cuerda y piedras calzando el pie; diana de paja con un paño pintado con tierras (ocre, almagre y carbón) en vez de los anillos azul, rojo y amarillo vivos. Las cintas de los luchadores, de paño teñido y más apagadas.":"Practice post with two bundles of straw bound with rope and stones wedging its foot; straw target with a cloth painted with earth pigments (ochre, red ochre and charcoal) instead of the bright blue, red and yellow rings. The fighters' bands are dyed cloth and more muted.","La pieza fantasma al construir ya no es un bloque verde o rojo: es la propia pieza con su textura y su color, translúcida, con un velo verde si cabe o rojo si no. Lo marcado al desmontar (naranja lo que se quita, rojo lo que caería) también conserva su textura.":"The ghost piece while building is no longer a green or red block: it is the piece itself with its texture and colour, see-through, with a green veil if it fits or a red one if not. What is marked when dismantling (orange what is removed, red what would fall) also keeps its texture.","Hacha en la mano al talar, como la del tocón de la prueba v5: mango de fresno con veta y cabeza de hierro con la pala abierta y el filo más claro. Se coloca con los huesos de la mano (mango atravesado a los dedos, filo hacia los nudillos) y solo se ve mientras tala.":"Axe in hand when felling, like the one on the stump in the v5 test: grained ash handle and an iron head with a flaring blade and a lighter edge. It is placed using the hand bones (handle across the fingers, edge towards the knuckles) and is only visible while felling.","Lo que se lleva en la mano echa sombra pero no la recibe: con una hoja de 9 mm el mapa de sombras la sombreaba entera y se veía negra.":"What is held in the hand casts shadow but does not receive it: with a 9 mm blade the shadow map shaded all of it and it looked black.","Quitadas de modelos.js las funciones del aspecto inicial que ya no usaba nada (árbol, roca, cajas y cilindros de color plano); los recursos del suelo (árboles y rocas) ya eran los del decorado con el estilo v5.":"Removed from modelos.js the initial-look functions that nothing used any more (tree, rock, flat-coloured boxes and cylinders); the ground resources (trees and rocks) were already the v5-style scenery ones.","Prueba nueva en prueba_modelos.mjs: armas, escudo, flecha, piedra, poste, diana y hacha hechos con el estilo v5, la hoja llega a la punta que marca el arma, las tablas del escudo llenan el círculo y el hacha mide lo que debe (rota a propósito con MUTAR_ARMA=1: falla).":"New test in prueba_modelos.mjs: weapons, shield, arrow, stone, post, target and axe made in the v5 style, the blade reaches the point the weapon marks, the shield planks fill the circle and the axe has the right size (broken on purpose with MUTAR_ARMA=1: it fails).","El muestrario de piezas saca también fotos de las armas (armas=…). Publicadas construcción v19, combate v11 y demo única v14, con fotos de cerca y una comparación lado a lado con la prueba v5.":"The piece showcase also takes photos of the weapons (armas=…). Published construction v19, combat v11 and single demo v14, with close-up photos and a side-by-side comparison with the v5 test.","No cambiado: el anillo claro que marca la tierra del mojón (es una marca del juego, no una pieza) y el muñeco que se ve un instante mientras carga el personaje.":"Not changed: the light ring that marks the waystone's land (it is a game marker, not a piece) and the dummy seen for a moment while the character loads."},"ru":{"Infraestructura":"Инфраструктура","Repositorio en GitHub, web de progreso y trabajo automático por horas.":"Репозиторий на GitHub, сайт с ходом работы и автоматическая работа каждый час.","Idiomas: español, inglés y ruso en el juego, la web y los documentos de diseño.":"Языки: испанский, английский и русский — в игре, на сайте и в дизайн-документах.","Repositorio, web de progreso y tarea programada":"Репозиторий, сайт с ходом работы и запланированная задача","Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos":"Сайт с ходом работы на английском: переключатель ES/EN, весь роадмап и дневник переведены","Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma":"Дизайн-документы на английском (GDD, системы и анализ), с переключателем языка","Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso":"Игра на английском: тексты прототипов с переключателем языка, готово к добавлению русского","Prueba de estilo y visor de personaje en inglés, con el mismo módulo de idioma":"Тест стиля и просмотрщик персонажа на английском, с тем же языковым модулем","Ruso: traducir el juego y la web (el archivo de ruso está vacío), con la misma comprobación que el inglés":"Русский: перевести игру и сайт (файл русского языка пуст), с той же проверкой, что и для английского","Documentos de diseño en ruso (GDD, sistemas y análisis), con selector de idioma; mientras tanto, la web en ruso enlaza a los documentos en inglés":"Дизайн-документы на русском (GDD, системы и разбор) с выбором языка; пока что сайт на русском ссылается на английские документы","Bases técnicas":"Технические основы","Nada nuevo a la vista: el proyecto queda preparado para el online y para trabajar varias sesiones a la vez sin pisarse.":"Внешне ничего нового: проект готов к онлайну и к тому, чтобы несколько сессий работали одновременно, не мешая друг другу.","Salió del análisis del 25 oct (pedido de valravnx). Va antes que lo demás porque cuanto más código se escriba sin esto, más cuesta arreglarlo.":"Появилось из анализа 25 окт. (просьба valravnx). Идёт раньше всего остального, потому что чем больше кода пишется без этого, тем дороже потом исправлять.","Acciones con autor: toda acción que cambia el mundo (construir, desmontar, golpear, herir) pasa por la lógica pura como un mensaje con autor (quién, qué, dónde), se valida y se guarda en un registro; pruebas que lo comprueban y que fallan si una acción se salta el registro":"Действия с автором: каждое действие, меняющее мир (строить, разбирать, бить, ранить), проходит через чистую логику как сообщение с автором (кто, что, где), проверяется и сохраняется в журнале; тесты, которые это проверяют и падают, если действие обходит журнал","Quitar código muerto: el personaje esculpido abandonado (cuerpo, campos de distancia, datos horneados y su herramienta y prueba) y el muñeco de la prueba de estilo, sin tocar las versiones ya publicadas":"Убрать мёртвый код: заброшенного скульптурного персонажа (тело, поля расстояний, запечённые данные, его инструмент и тест) и фигурку из теста стиля, не трогая уже опубликованные версии","Taller con versiones fijadas: anotar y comprobar al empezar la versión de Blender, el commit de MPFB2 y los paquetes, con una guía para volver a montarlo desde cero":"Мастерская с зафиксированными версиями: записывать и проверять при запуске версию Blender, коммит MPFB2 и пакеты, с инструкцией, как собрать всё заново с нуля","Diario y traducciones sin choques: una herramienta que une diario.json y en.json al fusionar ramas de varias sesiones, y su regla en CLAUDE.md":"Дневник и переводы без конфликтов: инструмент, который объединяет diario.json и en.json при слиянии веток нескольких сессий, и правило для него в CLAUDE.md","Revisión completa y publicación":"Полная проверка и публикация","Una sola demo":"Единое демо","Una sola página con construcción, duelo y personaje, con la misma escena del estilo elegido y el mismo personaje del taller en todo.":"Одна страница со строительством, поединком и персонажем, везде с одной и той же сценой в выбранном стиле и одним и тем же персонажем из мастерской.","Plan de unificación (pedido de valravnx, 25 oct): hoy son cuatro prototipos que no se hablan y cada mejora se queda en uno. Va antes que el resto del arte y de las piezas de construcción.":"План объединения (просьба valravnx, 25 окт.): сейчас это четыре прототипа, которые не связаны между собой, и каждое улучшение остаётся в одном из них. Идёт раньше остального арта и строительных деталей.","Escena común (src/mundo/): cielo, luz, niebla, suelo y decorado con el estilo v5 en un solo módulo, que usan la construcción, el combate y el visor de personaje":"Общая сцена (src/mundo/): небо, свет, туман, земля и декорации в стиле v5 в одном модуле, которым пользуются строительство, бой и просмотрщик персонажа","Personaje del taller en la construcción: sustituye al muñeco inicial; anda, corre y tala con sus animaciones, y empieza con camisa y calzas de lino como dice el GDD":"Персонаж из мастерской в строительстве: заменяет начальную фигурку; ходит, бегает и рубит со своими анимациями и начинает в льняной рубахе и шоссах, как сказано в GDD","Personaje del taller en el combate: los dos luchadores con su ropa por capas (la armadura del duelo pasa a ser gambesón y cota del taller), con las animaciones que hay y las heridas pintadas como ahora":"Персонаж из мастерской в бою: оба бойца в своей многослойной одежде (доспех поединка становится гамбезоном и кольчугой из мастерской), с имеющимися анимациями и ранами, нарисованными как сейчас","Demo única: una página con menú (Construir, Duelo, Personaje); el personaje que eliges y su ropa se usan en todo; la web enlaza a ella y las versiones antiguas se quedan":"Единое демо: одна страница с меню (Строить, Поединок, Персонаж); выбранный персонаж и его одежда используются везде; сайт ссылается на неё, а старые версии остаются","Rendimiento de la demo única: medir fotogramas, triángulos y memoria con la escena y varios personajes, dejar los números a la vista y pedir a valravnx los fps en su móvil":"Производительность единого демо: измерить кадры, треугольники и память со сценой и несколькими персонажами, вывести числа на экран и попросить valravnx сообщить fps на его телефоне","En el móvil, ningún aviso ni panel tapa los menús: el aviso de la construcción tapa «Reiniciar» (más en inglés y en ruso) y las notas de la prueba de estilo tapan la barra de vistas cuando esta ocupa dos filas":"На телефоне ни одно сообщение и ни одна панель не закрывают меню: сообщение в строительстве закрывает «Начать заново» (сильнее на английском и русском), а примечания теста стиля закрывают панель видов, когда она занимает две строки","Construcción":"Строительство","Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.":"Передвижение со свободной камерой (ПК и сенсорный экран) и строительство на привязанной сетке с нагрузкой, каскадной разборкой с возвратом 75% и свободным декором.","Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron).":"Сделано 24 окт. примерно с 15:55 до 16:40 (по датам файлов; точное время этой части не записывалось).","Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada":"Логика: привязанная сетка, опоры, нагрузка, каскадная разборка","Piezas low-poly por código y personaje":"Low-poly детали из кода и персонаж","Cámara libre y controles PC y táctil":"Свободная камера и управление на ПК и сенсорном экране","v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente":"v2: стены доходят до крыши, а соседние крыши образуют один общий скат","v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)":"v3: все стены доходят ровно до 2,5 м (10 рядов по 25 см)","El estilo de la prueba v5 en todo":"Стиль пробы v5 во всём","Todo lo que se ve (suelo, árboles, piezas de construcción, muebles y objetos) con el aspecto de la prueba de estilo v5 que aprobó valravnx, en la construcción, el duelo y la demo única.":"Всё, что видно (земля, деревья, строительные детали, мебель и предметы), выглядит как проба стиля v5, которую одобрил valravnx: в строительстве, дуэли и единой демо.","Pedido de valravnx el 26 oct: solo se habían pasado al estilo los muros de troncos. Va antes que el resto del arte y que las piezas nuevas; reúne las tareas de estilo que estaban en el hito 1c.":"Просьба valravnx от 26 окт.: в новый стиль были переведены только бревенчатые стены. Идёт раньше остального арта и новых деталей; сюда собраны задачи по стилю из этапа 1c.","Escena común igual que la prueba de estilo v5: suelo con hierba densa, flores, matorrales, piedras y tierra pisada, y los árboles de la v5 (hoy el suelo de la construcción y del duelo es un llano verde con matas sueltas)":"Общая сцена как в пробе стиля v5: земля с густой травой, цветами, кустами, камнями и утоптанной землёй, и деревья из v5 (сейчас земля в строительстве и дуэли — ровная зелёная равнина с редкими пучками травы)","Estilo elegido en las piezas: cimientos de piedra y de troncos, suelos de troncos y de tablas, y escaleras de mano y de tablas, como la prueba de estilo v5":"Выбранный стиль на деталях: фундаменты из камня и брёвен, полы из брёвен и досок, приставные и дощатые лестницы, как в пробе стиля v5","Estilo elegido en las piezas: tejados de paja (con mechones) y de tablillas, y hastiales, como la prueba de estilo v5":"Выбранный стиль на деталях: соломенные крыши (с пучками) и крыши из дранки, а также фронтоны, как в пробе стиля v5","Estilo elegido en las piezas: puertas de varas y de tablas, cerca de varas, empalizada y su puerta, mojón, y las barandillas y el portillo nuevos, como la prueba de estilo v5":"Выбранный стиль на деталях: двери из жердей и досок, изгородь из жердей, частокол и его ворота, межевой камень, а также новые перила и калитка, как в пробе стиля v5","Estilo elegido en los muebles: camas de paja y de madera, mesa, banco, taburete, arcón, barril, estantería, antorcha de pie, alfombra de piel y estandarte, como los enseres de la prueba de estilo v5":"Выбранный стиль на мебели: кровати из соломы и дерева, стол, скамья, табурет, сундук, бочка, полка, напольный факел, меховой ковёр и знамя, как утварь в пробе стиля v5","Estilo elegido en todo lo demás que se ve en la construcción, el duelo y el visor: recursos del suelo, la pieza fantasma al construir, herramientas y armas en la mano y cualquier pieza que siga con el aspecto inicial, como la prueba de estilo v5":"Выбранный стиль во всём остальном, что видно в строительстве, дуэли и просмотрщике: ресурсы на земле, призрачная деталь при строительстве, инструменты и оружие в руке и любые детали с прежним видом — как в пробе стиля v5","Revisión completa y publicación: cada vista de cada prototipo y de la demo única, en PC y en móvil, comparada en capturas lado a lado con la prueba de estilo v5; lo que no se vea igual se arregla antes de cerrar el hito":"Полная проверка и публикация: каждый вид каждого прототипа и единой демо на ПК и телефоне сравнивается на скриншотах рядом с пробой стиля v5; всё, что выглядит иначе, исправляется до закрытия этапа","Prueba online mínima":"Минимальная онлайн-проверка","Dos jugadores en el mismo mundo desde dos dispositivos, construyendo y peleando, con el mundo guardado en un servidor sencillo; sin cuentas completas ni administración todavía.":"Два игрока в одном мире с двух устройств строят и сражаются, мир сохраняется на простом сервере; полноценных аккаунтов и администрирования пока нет.","Pedido de valravnx el 26 oct: lo multijugador es el mayor riesgo del proyecto y se comprueba pronto, justo después del estilo v5, antes de seguir ampliando piezas, ropa y sistemas.":"Просьба valravnx от 26 окт.: мультиплеер — главный риск проекта, его проверяют рано, сразу после стиля v5, прежде чем добавлять новые детали, одежду и системы.","Planificar el hito: leer lo que el GDD dice de servidor, cuentas y PvP, y desglosar la prueba online en tareas de una sesión":"Спланировать этап: прочитать, что GDD говорит о сервере, аккаунтах и PvP, и разбить онлайн-проверку на задачи по одной сессии","Medir el servidor con 100 jugadores simulados (bots que andan, construyen y pelean): CPU, memoria y tráfico por jugador, para saber qué servidor hace falta y cuánto cuesta al mes":"Измерить сервер со 100 симулированными игроками (боты ходят, строят и сражаются): процессор, память и трафик на игрока, чтобы понять, какой нужен сервер и сколько он стоит в месяц","Dirección de arte y personajes":"Арт-дирекция и персонажи","Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.":"Персонаж с реалистичными пропорциями и детализацией, настройкой внешности (тело, лицо, волосы, кожа) и одеждой и доспехами, которые видны надетыми; сдержанные свет, материалы и палитра; более детальные местность и строительные детали. Low-poly из кода, но чтобы смотрелось хорошо и тянуло на телефоне.","Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.":"Высокий приоритет: раньше, чем добавлять новые детали или системы, чтобы потом не переделывать их под новый стиль.","Correr más natural (valravnx: «la animación de correr me parece fea y exagerada»): primero suavizar por código la del paquete (menos braceo, rebote e inclinación); después probar carreras de captura de movimiento libres para uso comercial (Rokoko o CMU) si valravnx las baja":"Более естественный бег (valravnx: «анимация бега некрасивая и преувеличенная»): сначала смягчить кодом анимацию из набора (меньше размаха рук, подпрыгивания и наклона); затем попробовать бесплатные записи захвата движения с правом коммерческого использования (Rokoko или CMU), если valravnx их скачает","Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que valravnx elija":"Три теста стиля (персонаж и сцена с хижиной) с разным светом, материалами и уровнем детализации, чтобы valravnx выбрал","Rehacer las pruebas de estilo (revisión de valravnx: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio":"Переделать тесты стиля (отзыв valravnx: B и C очень тормозят, а персонаж не годится): один лёгкий стилизованный стиль (дешёвый материал типа toon или Lambert, палитра в маленькой текстуре, один источник света с тенью 1024, адаптивное разрешение), измеренный бюджет: сцена ≤ 30 тыс. треугольников и ≤ 60 вызовов отрисовки, 60 fps на среднем телефоне","Prueba de estilo v3, «maqueta en miniatura» (elegido por valravnx): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto":"Тест стиля v3, «миниатюрный макет» (выбран valravnx): чистые скруглённые формы, мягкий свет с контактными тенями, размытый фон; сплошной каменный фундамент (не отдельные камни); тот же бюджет","Prueba de estilo v4, «realismo en miniatura» (pedido por valravnx): la v3 con texturas por código y el mundo sin recortar":"Тест стиля v4, «миниатюрный реализм» (по просьбе valravnx): v3 с текстурами из кода и мир без обрезки","Prueba de estilo v5: árboles rehechos (valravnx: «los árboles fatal, se ven como rayajos raros; la casa está bien»)":"Тест стиля v5: деревья переделаны (valravnx: «деревья ужасные, выглядят как странные каракули; дом нормальный»)","Personaje nuevo por código (decidido por valravnx), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas":"Новый персонаж из кода (решение valravnx), эффектный и в стиле макета: одна сплошная сетка со скелетом и анимацией, правдоподобные, слегка стилизованные пропорции","Personaje base articulado con el estilo elegido (también el rival del combate) (hecho con el personaje nuevo por código)":"Базовый шарнирный персонаж в выбранном стиле (он же соперник в бою) (сделан на новом персонаже из кода)","Personaje v2 con bases libres (CC0) ya hechas en vez de esculpirlo por código (valravnx: «horripilante»): cabeza, ropa, pelo y animaciones del paquete, con personalización":"Персонаж v2 на готовых свободных основах (CC0) вместо лепки из кода (valravnx: «жуткий»): голова, одежда, волосы и анимации из пакета, с настройкой внешности","Personaje v3: rendimiento en el móvil (iba a 10 fps) y fuera el traje de explorador por ser de fantasía":"Персонаж v3: производительность на телефоне (было 10 fps) и убран костюм следопыта как слишком фэнтезийный","Recursos de personaje v2: todo comprimido (las animaciones bajan de 4,4 MB a unos 0,7 MB) y el personaje con las 39 animaciones extra (trabajos, arco, espada ligera y pesada, bloqueo, vendarse, pasos en todas direcciones)":"Ресурсы персонажа v2: всё сжато (анимации уменьшились с 4,4 МБ примерно до 0,7 МБ), и у персонажа 39 дополнительных анимаций (работы, лук, лёгкий и тяжёлый меч, блок, перевязка, шаги во всех направлениях)","Taller propio sin pantalla (Blender por pip) para reasignar animaciones, reducir mallas y probar a crear cuerpos y caras propios con MakeHuman (MPFB2), con su esqueleto compatible":"Собственная мастерская без экрана (Blender через pip), чтобы переносить анимации, упрощать сетки и пробовать создавать свои тела и лица в MakeHuman (MPFB2) с совместимым скелетом","Taller: ropa por capas, primera tanda — camisa de lino bajo la túnica y gambesón acolchado encima, hechos por código sobre el cuerpo de MakeHuman, que se ponen y se quitan como capas":"Мастерская: многослойная одежда, первая партия — льняная рубаха под туникой и стёганый гамбезон поверх, сделанные кодом на теле из MakeHuman, надеваются и снимаются как слои","Taller: cota de malla (anillas por código) y sobreveste encima, como capas":"Мастерская: кольчуга (кольца из кода) и сюрко поверх, как слои","Taller: el cinturón de encima de la cota sobresale hacia los lados hasta la altura de los brazos (se ve en las fotos del taller con los brazos abiertos; ya estaba en los recursos taller-v4)":"Мастерская: пояс поверх кольчуги выступает в стороны до уровня рук (видно на фотографиях мастерской с разведёнными руками; так было уже в ресурсах taller-v4)","Taller: capa con capucha, calzado y tocados (capucha suelta, sombrero de paja, toca)":"Мастерская: плащ с капюшоном, обувь и головные уборы (отдельный капюшон, соломенная шляпа, чепец)","Taller: personalización — altura, complexión y cara con los ajustes de MakeHuman, tono de piel, color de ojos, peinado y barba":"Мастерская: настройка внешности — рост, телосложение и лицо через параметры MakeHuman, тон кожи, цвет глаз, причёска и борода","Taller: más peinados (melena, coleta, trenzas) y barbas (corta, larga, perilla), y arreglar la claridad de la barbilla":"Мастерская: больше причёсок (длинные волосы, хвост, косы) и бород (короткая, длинная, эспаньолка) и исправить светлое пятно на подбородке","Taller: pies descalzos. El cuerpo no tiene pies bajo los zapatos (se quitan al vestir) y el GDD dice que se empieza descalzo: hace falta el cuerpo con pies cuando no lleva zapatos":"Мастерская: босые ноги. У тела нет ступней под башмаками (они удаляются при одевании), а по GDD игра начинается босиком: телу нужны ступни, когда на нём нет башмаков","Taller: pasar también las 39 animaciones extra (trabajos, arco, espada, bloqueo, vendarse, pasos) al esqueleto de MakeHuman":"Мастерская: перенести на скелет MakeHuman и 39 дополнительных анимаций (работы, лук, меч, блок, перевязка, шаги)","Personalización en el juego de toda la ropa y la armadura (pedido de valravnx): color o tinte de cada prenda, blasón o dibujo en la sobreveste, y qué capas lleva. Para eso las texturas de la ropa pasan a ir en gris con el color aparte, que se cambia sin rehacer el modelo":"Настройка в игре всей одежды и доспехов (просьба valravnx): цвет или краска каждой вещи, герб или рисунок на сюрко и какие слои надеты. Для этого текстуры одежды становятся серыми, а цвет хранится отдельно и меняется без пересборки модели","Ropa y armadura crafteables por capas (camisa, gambesón, cota de malla, sobreveste): cada pieza fabricada cambia su aspecto según material, corte, tejido y tinte (sin calidades), sobre el mismo esqueleto":"Изготовляемая многослойная одежда и доспехи (рубаха, стёганка, кольчуга, сюрко): внешний вид каждой вещи зависит от материала, кроя, ткани и краски (без уровней качества), на том же скелете","Heridas y sangrado visibles en el personaje: corte, golpe y estocada se pintan donde entran (también rompen y manchan la ropa), el sangrado se extiende con el tiempo y el vendaje se ve puesto":"Видимые раны и кровотечение на персонаже: порезы, удары и уколы рисуются там, куда попали (а также рвут и пачкают одежду), кровотечение со временем расходится, а повязка видна надетой","Terreno, hierba, árboles y luz con el estilo elegido, ya por trozos que se cargan y se descargan alrededor del jugador (para el mundo grande)":"Местность, трава, деревья и свет в выбранном стиле, сразу по кускам, которые подгружаются и выгружаются вокруг игрока (для большого мира)","Niveles de detalle del personaje del taller: versiones reducidas para verlo de lejos, cambio automático por distancia y texturas juntas; medido con 20 personajes en pantalla":"Уровни детализации персонажа из мастерской: упрощённые версии для вида издалека, автоматическое переключение по расстоянию и объединённые текстуры; замерено с 20 персонажами на экране","Rendimiento en móvil: medir y ajustar el nivel de detalle":"Производительность на телефоне: измерить и настроить уровень детализации","Más piezas de construcción":"Больше строительных деталей","Piezas y muebles con el estilo elegido; obras con marco, materiales y tiempo, andamio, polea y polipasto; escaleras, barandillas, contraventanas, tejas, remates, chimenea, adarve y decoración; muros de piedra con grúa de rueda.":"Детали и мебель в выбранном стиле; стройка с каркасом, материалами и временем, леса, блок и полиспаст; лестницы, перила, ставни, черепица, коньки, очаг, боевой ход и декор; каменные стены с краном с топчаковым колесом.","La primera tarea (madera más resistente) se adelantó el 24 oct porque la casa de dos plantas de valravnx y su pareja no admitía el tejado en las esquinas. Planificado el 25 oct a petición de valravnx por el chat, en paralelo a la sesión de la ropa. Los puentes de troncos no entran: necesitan agua en el mapa y llegan con el hito Mundo.":"Первую задачу (более прочное дерево) сделали раньше 24 окт., потому что двухэтажный дом valravnx и его партнёрши не позволял поставить крышу на углах. Спланировано 25 окт. по просьбе valravnx в чате, параллельно с сессией по одежде. Мосты из брёвен не входят: им нужна вода на карте, они появятся с этапом «Мир».","Arreglo (pedido de valravnx): en PC no se pueden quitar muebles ni piezas, porque al mover el ratón hacia «Confirmar» se pierde lo elegido. Lo elegido con clic se queda fijo hasta confirmar o cancelar":"Исправление (просьба valravnx): на ПК нельзя убрать мебель и детали, потому что при движении мыши к «Подтвердить» выбор теряется. Выбранное щелчком теперь остаётся, пока не подтвердишь или не отменишь","Más resistencia en la madera (valravnx: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa":"Больше прочности дереву (valravnx: «дерево слишком слабое, не даёт сделать 2 этажа с крышей»): двухэтажный дом с крышей только из базовых деревянных деталей (бревенчатые фундамент, стены и пол) должен строиться без ухищрений; строить без мучений, но чтобы можно было что-то сделать. Тест логики, который это гарантирует, и скриншоты дома","Planificar el hito: lista de piezas sacada del GDD y del documento de sistemas":"Спланировать этап: список деталей по GDD и документу систем","Escalera de tablas (N2: 6 tablas y clavos): ocupa una casilla, sube una planta y se sube andando, sin botón; deja el hueco abierto en el suelo de arriba. Pruebas de lógica (apoyos y hueco) y de navegador (subir y bajar andando)":"Лестница из досок (N2: 6 досок и гвозди): занимает одну клетку, поднимается на один этаж, по ней ходят без кнопки; оставляет открытый проём в полу сверху. Тесты логики (опоры и проём) и браузера (подъём и спуск пешком)","Barandillas y vallas: medio muro como barandilla en el borde de un suelo en alto (no se puede caer por ahí) y portillo para la cerca de varas (corrales), que se abre con Usar como las puertas":"Перила и ограды: полстены как перила на краю приподнятого пола (оттуда не упасть) и калитка для изгороди из жердей (загоны), открывается через «Использовать», как двери","Estilo elegido en las piezas (valravnx: «los muebles y la construcción son los low-poly iniciales, no lo de la prueba visual»; va antes de añadir más piezas): muros de troncos (también con puerta y ventana), de zarzo y barro, de entramado y de tablas, medio muro, postes y vigas, con los troncos, la corteza, las testas y las texturas por código de la cabaña de la prueba de estilo v5":"Выбранный стиль на деталях (valravnx: «мебель и постройки — это первоначальный low-poly, а не то, что было в визуальной пробе»; делается до добавления новых деталей): стены из брёвен (также с дверью и окном), из плетня с глиной, фахверковые и дощатые, полустена, столбы и балки — с брёвнами, корой, торцами и текстурами из кода, как у избы в пробе стиля v5","Obras (decidido por valravnx el 26 oct): poner el marco de la pieza, que se ve como un armazón; llevarle los materiales y construirla con un tiempo según la pieza; si te ayudan, tarda menos. Todo en la lógica pura, con el autor de cada entrega y de cada rato de trabajo":"Стройка (решено valravnx 26 окт.): поставить каркас детали, который выглядит как остов; принести к нему материалы и построить за время, зависящее от детали; если помогают, быстрее. Всё в чистой логике, с автором каждой доставки и каждого отрезка работы","Obras: clase de peso de cada material (ligero, pesado, muy pesado) y llevar el material hasta la altura de la obra: lo ligero a mano por escalera; los troncos de muro entre dos, o uno solo rodándolos por dos varas con una cuerda (más despacio)":"Стройка: класс веса каждого материала (лёгкий, тяжёлый, очень тяжёлый) и доставка материала на высоту стройки: лёгкое — руками по лестнице; брёвна для стен — вдвоём или в одиночку, закатывая по двум жердям с верёвкой (медленнее)","Obras: andamio pegado al muro (trabajar y dejar material por encima de la primera planta) y polea simple en una viga (pesos medios, una persona)":"Стройка: леса у стены (работать и оставлять материал выше первого этажа) и простой блок на балке (средние грузы, один человек)","Obras: polipasto con torno para vigas grandes y sillares (uno tira y otro guía)":"Стройка: полиспаст с воротом для больших балок и каменных блоков (один тянет, другой направляет)","Contraventana y trampilla (N2: 2 tablas y clavos): la contraventana cierra la ventana de un muro y la trampilla tapa el hueco de una escalera; las dos se abren y cierran con Usar. Añadir también el muro de tablas con ventana, que falta":"Ставня и люк (N2: 2 доски и гвозди): ставня закрывает окно в стене, а люк закрывает проём лестницы; оба открываются и закрываются через «Использовать». Также добавить недостающую дощатую стену с окном","Tejado de teja (N2: 10 tejas y vigas, pesa 200 kg, no se pudre ni arde fácil): material nuevo «teja» y su prueba de carga":"Черепичная крыша (N2: 10 черепиц и балки, весит 200 кг, не гниёт и плохо горит): новый материал «черепица» и тест нагрузки для неё","Remate de tejado: cumbrera y esquinas, para que los tejados de dos tramos que se cruzan en una esquina queden cerrados":"Завершение крыши: конёк и углы, чтобы двускатные крыши, сходящиеся на углу, были закрыты","Chimenea u hogar interior (N2: piedras y barro, 600 kg): solo sobre cimiento de piedra, con fuego, luz y humo que sale por el tejado":"Дымоход или внутренний очаг (N2: камни и глина, 600 кг): только на каменном фундаменте, с огнём, светом и дымом, выходящим через крышу","Adarve (pasarela por detrás de la empalizada: tablas y postes, sostiene 300 kg), al que se sube por escalera de mano o de tablas":"Боевой ход (мостки за частоколом: доски и столбы, выдерживает 300 кг), на который поднимаются по приставной или дощатой лестнице","Decoración que falta del documento de sistemas: tinaja, antorcha de pared, tapiz y ganchos para herramientas":"Недостающий декор из документа систем: кувшин для хранения, настенный факел, гобелен и крючки для инструментов","Muros de piedra (mampostería) y grúa de rueda para subir la piedra en grupo: una o dos personas andando en la rueda y alguien guiando; la grúa se sube de planta según crece la obra":"Каменные стены (кладка) и кран с топчаковым колесом, чтобы поднимать камень сообща: один-два человека идут в колесе, кто-то направляет; кран поднимают на этаж выше по мере роста стройки","Equipo y carga por huecos":"Снаряжение и переноска по ячейкам","Panel de inventario, cinturones, leñero y otras mochilas; tala, transporte y ralentización por cargar.":"Панель инвентаря, пояса, дровяная заплечная рама и другие мешки за спиной; рубка, переноска и замедление от груза.","Planificar el hito: lista de tareas sacada del GDD y del documento de sistemas":"Спланировать этап: список задач по GDD и документу систем","Datos de cada prenda en la lógica pura (zonas que cubre, protección por tipo de golpe, abrigo, peso), unidos a la ropa por capas del taller: lo que se ve y lo que protege salen de lo mismo":"Данные каждой вещи в чистой логике (какие зоны закрывает, защита по типу удара, тепло, вес), связанные с многослойной одеждой из мастерской: то, что видно, и то, что защищает, берутся из одного источника","Estaciones y crafting":"Станки и крафт","Primeras estaciones, recetas, desbloqueo por práctica, durabilidad y reparación.":"Первые станки, рецепты, открытие через практику, прочность и ремонт.","Supervivencia":"Выживание","Necesidades con avisos, ropa contra el frío, cama ligada y muerte con saqueo parcial.":"Потребности с предупреждениями, одежда от холода, привязанная кровать и смерть с частичным разграблением.","Duelo":"Поединок","Esgrima contra un bot con heridas.":"Фехтование против бота с ранами.","El campo de pruebas de combate se adelantó para probar el sistema antes del resto. v1 y v2 hechas el 24 oct entre las 16:45 y las 17:25 aprox.":"Полигон для боя сделали раньше, чтобы опробовать систему до всего остального. v1 и v2 сделаны 24 окт. примерно с 16:45 до 17:25.","Combate v1: líneas de golpe, guardias, heridas, arco":"Бой v1: линии ударов, стойки, раны, лук","Combate v2: rosa de golpes, parada perfecta, golpe maestro, fintas, peso de los golpes":"Бой v2: роза ударов, идеальное парирование, мастерский удар, финты, вес ударов","Arreglo del arco: no soltar antes del 50% de tensión, correr cancela el tensado, 0,8 s para encajar otra flecha (piedras 0,5 s), con pruebas":"Исправление лука: нельзя отпустить раньше 50% натяжения, бег отменяет натяжение, 0,8 с на то, чтобы наложить новую стрелу (камни 0,5 с), с тестами","Escudo provisional: opción «Espada y escudo» (espada de una mano), para flechas y piedras de frente, parada más barata, se ve en el brazo izquierdo y se levanta al parar; también para el rival":"Временный щит: вариант «Меч и щит» (одноручный меч), против стрел и камней спереди, более дешёвое парирование, виден на левой руке и поднимается при парировании; также у соперника","Cámara táctil con un dedo durante el combate":"Сенсорная камера одним пальцем во время боя","Curación de heridas":"Лечение ран","Prueba de golpes en las cinco direcciones de la rosa con el personaje del taller: el brazo va hacia el objetivo (cinemática inversa) sobre una animación base, porque el paquete solo trae unos pocos golpes; si no convence, buscar otra vía antes de seguir":"Тест ударов в пяти направлениях розы с персонажем из мастерской: рука тянется к цели (инверсная кинематика) поверх базовой анимации, потому что в пакете всего несколько ударов; если не убедит, найти другой путь, прежде чем продолжать","Asedio, fuego y mantenimiento":"Осада, огонь и обслуживание","Ariete, daño por fuego, mojón con materiales.":"Таран, урон от огня, межевой камень с материалами.","Fauna y caza":"Фауна и охота","Animales realistas.":"Реалистичные животные.","Caballos":"Лошади","Domar, montar, cuadra y pasto.":"Приручение, езда верхом, конюшня и пастбище.","Granja y estaciones del año":"Ферма и времена года","Siembras por franja, ganado.":"Посевы по климатическим поясам, скот.","Mundo":"Мир","Pseudo-Europa por semilla a escala real: cordilleras como los Pirineos, valles y collados, ríos de tres gruesos (arroyos que se vadean, ríos con pocos vados, grandes ríos con barca o puente), bosques frondosos, pendientes que frenan; agua y nado; 5 países con estilo propio, caminos por uso, puentes.":"Псевдо-Европа из зерна в реальном масштабе: хребты вроде Пиренеев, долины и перевалы, реки трёх размеров (ручьи вброд, реки с редкими бродами, большие реки с лодкой или мостом), густые леса, замедляющие склоны; вода и плавание; 5 стран со своим стилем, дороги от хождения, мосты.","Servidor y cuentas":"Сервер и учётные записи","Registro e inicio de sesión seguros, recuperación de cuenta, creación de personaje, mundo persistente con servidor autoritativo.":"Безопасная регистрация и вход, восстановление учётной записи, создание персонажа, постоянный мир с авторитетным сервером.","Prioridad alta. Contraseñas con hash, conexión cifrada, límite de intentos, copias de seguridad.":"Высокий приоритет. Хеширование паролей, шифрованное соединение, ограничение попыток, резервные копии.","Comparar alojamientos y costes para el servidor y la base de datos, y llevar las opciones a valravnx (la elección es suya)":"Сравнить хостинги и стоимость для сервера и базы данных и представить варианты valravnx (выбор за ним)","Administración, registros y seguridad":"Администрирование, журналы и безопасность","Roles (jugador, moderador, administrador) para la cuenta de valravnx y las que él decida; panel de administración; registros consultables de lo que pasa en el mundo (comercio, saqueos, construcción y destrucción, muertes, conexiones); detección de trampas en el servidor (velocidad, alcance, acciones imposibles); sanciones (aviso, silencio, expulsión, bloqueo) y registro de lo que hace cada administrador.":"Роли (игрок, модератор, администратор) для учётной записи valravnx и тех, кого он выберет; панель администрирования; журналы с поиском о том, что происходит в мире (торговля, грабежи, строительство и разрушение, смерти, подключения); обнаружение читов на сервере (скорость, дальность, невозможные действия); наказания (предупреждение, заглушка, исключение, бан) и журнал действий каждого администратора.","Prioridad alta: es un juego online persistente. Desde ya, toda acción que cambia el mundo pasa por la lógica con autor, para poder registrarla después.":"Высокий приоритет: это постоянная онлайн-игра. Уже сейчас каждое действие, меняющее мир, проходит через логику с указанием автора, чтобы потом его можно было записывать в журнал.","PvP online y protección offline":"Онлайн-PvP и защита в офлайне","Combate y asedio entre jugadores; reglas de guerra.":"Бои и осады между игроками; правила войны.","Tierras y familias":"Земли и семьи","Mojones, radio de exclusión, peajes, conquista, familias, vasallajes, alianzas, escudos de armas.":"Межевые камни, радиус исключения, пошлины, завоевание, семьи, вассалитет, союзы, гербы.","Economía y NPCs":"Экономика и NPC","Encargos y moneda, puestos sin conexión, tomos, NPCs ambulantes a sueldo, centinelas y mensajeros.":"Заказы и деньги, лавки без подключения, тома, странствующие наёмные NPC, часовые и гонцы.","Combate a caballo y a distancia":"Конный и дальний бой","Arcos, ballestas, lanzas de caballería.":"Луки, арбалеты, кавалерийские копья.","Navegación":"Мореплавание","Astillero, barcos, navegar con otros.":"Верфь, корабли, плавание вместе с другими.","Cartografía":"Картография","Mesa de cartógrafo y mapas como objetos.":"Стол картографа и карты как предметы.","Demo única":"Единое демо","Todo en una página: construir, duelo y personaje, con el mismo personaje del taller y la misma escena.":"Всё на одной странице: строительство, поединок и персонаж, с тем же персонажем из мастерской и той же сценой.","Primera demo única: menú con Construir, Duelo y Personaje; el personaje que eliges (cuerpo y ropa) es el que construye y el que lucha":"Первое единое демо: меню со Строительством, Поединком и Персонажем; выбранный персонаж (тело и одежда) — тот, кто строит и сражается","Los fps de tu aparato junto a «Menú» y, al pulsarlos, el detalle (tiempo de cada fotograma, triángulos, memoria y personajes en escena); en «Construir», personajes de prueba para medir con gente":"К/с твоего устройства рядом с «Меню», а по нажатию — подробности (время кадра, треугольники, память и персонажи в сцене); в «Строить» — тестовые персонажи для замеров с людьми вокруг","En el móvil, el aviso de «Construir» ya no tapa los botones del menú de arriba (tampoco en inglés y en ruso, ni con «Menú» y los fps). Lleva la construcción v11.":"На телефоне подсказка в «Строить» больше не закрывает кнопки верхнего меню (и по-английски и по-русски, и с «Меню» и к/с). В нём строительство v11.","Correr más natural en las tres partes: la carrera suavizada (menos zancada, braceo, bote e inclinación) y a su velocidad de verdad, sin resbalar ni cámara lenta. Es la construcción v11, el combate v8 y el personaje v12.":"Бег естественнее во всех трёх частях: смягчённый бег (короче шаг, меньше взмахов руками, подпрыгивания и наклона) с его настоящей скоростью, без скольжения и замедленной съёмки. Это строительство v11, бой v8 и персонаж v12.","Brazos naturales al correr en las tres partes (personaje v13).":"Естественные руки при беге во всех трёх частях (персонаж v13).","El cinturón de la cota ceñido, en las tres partes (personaje v14, taller-v7).":"Пояс поверх кольчуги прилегает, во всех трёх частях (персонаж v14, taller-v7).","Sin pantalla en blanco en el móvil (fuga de memoria gráfica arreglada), aviso si se pierde el dibujo 3D y muros con el estilo elegido.":"Без белого экрана на телефоне (утечка графической памяти исправлена), сообщение при потере 3D-изображения и стены в выбранном стиле.","Barandillas y portillo en «Construir» (construcción v13).":"Перила и калитка в «Строить» (строительство v13).","Escena con el estilo v5 en «Construir» y «Duelo» (construcción v14, combate v10)":"Сцена в стиле v5 в «Строительстве» и «Поединке» (строительство v14, бой v10)","Cimientos, suelos y escaleras con el estilo de la prueba v5, como en la construcción v15.":"Фундаменты, полы и лестницы в стиле пробы v5, как в строительстве v15.","Construcción v16: tejados de paja y de tablillas, y lo que cierra bajo el tejado, con el estilo v5":"Строительство v16: соломенные крыши и крыши из дранки, а также то, что закрывает проём под крышей, в стиле v5","Construcción v17: puertas, cercas, portillo, empalizada y mojón con el estilo v5":"Строительство v17: двери, изгороди, калитка, частокол и межевой камень в стиле v5","Construcción v18: los muebles con el estilo v5":"Строительство v18: мебель в стиле v5","Construcción v19 y combate v11: pieza fantasma con su textura, hacha al talar y armas, escudo, poste y diana con el estilo v5":"Строительство v19 и бой v11: призрачная деталь со своей текстурой, топор при рубке, а также оружие, щит, столб и мишень в стиле v5","Construye una cabaña: cimientos, suelos, muros, tejados y muebles, con límite de carga.":"Постройте хижину: фундамент, полы, стены, крыши и мебель, с пределом нагрузки.","Muros exactos a 2,5 m por hiladas.":"Стены ровно 2,5 м, по рядам кладки.","Madera más resistente: casa de 2 plantas con tejado de troncos; vano de una casilla en suelos y tejados.":"Более прочное дерево: двухэтажный дом с крышей из брёвен; пролёт в одну клетку для полов и крыш.","Juego en inglés: botón ES/EN arriba a la derecha (recuerda el idioma elegido, también el de la web) y todos los textos traducidos; la partida no se pierde al cambiar.":"Игра на английском: кнопка ES/EN вверху справа (запоминает выбранный язык, в том числе на сайте), все тексты переведены; при переключении игра не теряется.","Escalera de tablas: ocupa una casilla y se sube andando, sin botón; encima deja el hueco abierto.":"Лестница из досок: занимает одну клетку, по ней поднимаются просто шагом, без кнопки; проём над ней остаётся открытым.","v7: también en ruso (botón RU arriba; en el móvil, el idioma se elige en un desplegable y los botones de modo se colocan debajo del menú).":"v7: теперь и на русском (кнопка RU вверху; на телефоне язык выбирается в выпадающем списке, а кнопки режимов стоят под меню).","Quitar muebles y piezas con el ratón: lo que eliges con clic se queda elegido hasta confirmar o cancelar, aunque muevas el ratón hasta el botón":"Убрать мебель и детали мышью: выбранное щелчком остаётся выбранным до подтверждения или отмены, даже если двигать мышь к кнопке","Escena común del estilo elegido: cielo, luz, sombras blandas, suelo con textura, bosque, hierba, flores y rocas":"Общая сцена в выбранном стиле: небо, свет, мягкие тени, земля с текстурой, лес, трава, цветы и камни","El jugador es el personaje del taller propio (camisa y calzas de lino): anda, corre y tala con sus animaciones":"Игрок — персонаж из собственной мастерской (льняная рубаха и шоссы): он ходит, бегает и рубит со своими анимациями","En el móvil, el aviso de abajo del menú ya no tapa «Reiniciar» ni otros botones (tampoco en inglés y en ruso): se coloca según lo que mide el menú de arriba y a la izquierda de los botones de modo.":"На телефоне подсказка под меню больше не закрывает «Начать заново» и другие кнопки (и по-английски и по-русски): она ставится по размеру верхнего меню и слева от кнопок режимов.","Arreglo de la pantalla en blanco en el móvil: al colocar o quitar piezas ya no se llena la memoria gráfica. Aviso y recarga si se pierde el dibujo 3D. Muros, postes y vigas con el estilo elegido.":"Исправлен белый экран на телефоне: установка и удаление деталей больше не заполняют графическую память. Сообщение и перезагрузка при потере 3D-изображения. Стены, столбы и балки в выбранном стиле.","Barandillas y portillo: el medio muro hace de barandilla en el borde de un suelo en alto y alrededor del hueco de la escalera (por ahí ya no se cae), y portillo de varas para la cerca, que se abre y se cierra con Usar.":"Перила и калитка: полустена служит перилами на краю поднятого пола и вокруг проёма лестницы (там больше нельзя упасть), и калитка из жердей для изгороди, которая открывается и закрывается кнопкой «Использовать».","Escena como la prueba de estilo v5: hierba densa con flores también en el centro, matorrales, calvas de tierra pisada, rocas y árboles de copa sueltos; la hierba se esconde bajo lo construido y vuelve al quitarlo":"Сцена как в пробе стиля v5: густая трава с цветами и в центре, кусты, пятна утоптанной земли, камни и отдельные лиственные деревья; трава прячется под постройками и возвращается, когда их убирают","Cimientos de piedra y de troncos, suelos de troncos y de tablas y escaleras de mano y de tablas con el estilo de la prueba v5: losas sobre mortero con piedras en los costados, troncos con las testas claras, tablas con veta y rastreles, y varas descortezadas.":"Каменные и бревенчатые фундаменты, полы из брёвен и досок, приставные и дощатые лестницы в стиле пробы v5: плиты на растворе с камнями по бокам, брёвна со светлыми торцами, доски с волокнами на лагах и окорённые жерди.","Tejados de paja (dos hiladas, mechones en el alero y cumbrera redonda) y de tablillas (filas solapadas, tabla de remate y caballete) con el estilo v5; bajo el tejado se cierra con tablas de pie, barro y estacas o encalado y postes":"Соломенные крыши (два ряда, пучки на свесе и круглый конёк) и крыши из дранки (ряды внахлёст, торцевая доска и коньковый брус) в стиле v5; под крышей проём закрывают стоячие доски, глина с кольями или побелка со стойками","Puertas de varas y de tablas, cerca, portillo, empalizada y su puerta, y mojón con el estilo v5: tablas con peinazos y bisagras de hierro, varas atadas con cuerda, postes con el corte claro, troncos descortezados con la punta tallada y piedras apiladas":"Двери из жердей и из досок, изгородь, калитка, частокол и его ворота, а также межевой камень в стиле v5: доски с планками и железными петлями, жерди, связанные верёвкой, столбы со светлым срезом, окорённые брёвна с затёсанными остриями и сложенные камни","Los muebles con el estilo elegido (prueba de estilo v5): camas de paja y de madera, mesa de caballetes, banco, taburete, arcón, barril, estantería, antorcha de pie, alfombra de piel y estandarte":"Мебель в выбранном стиле (проба стиля v5): соломенная постель и деревянная кровать, стол на козлах, скамья, табурет, сундук, бочка, полка, напольный факел, ковёр из шкуры и знамя","Pieza fantasma y resaltados con la textura de la pieza (velo verde, rojo o naranja) y hacha en la mano al talar, con el estilo v5":"Призрачная деталь и выделения с текстурой детали (зелёная, красная или оранжевая вуаль) и топор в руке при рубке, в стиле v5","Combate":"Бой","Campo de pruebas: duelo con espada o palo, prácticas con poste y dianas, carga a distancia.":"Испытательная площадка: дуэль на мечах или палках, тренировка со столбом и мишенями, дальний бой.","Rosa de golpes y defensa en tres capas.":"Роза ударов и трёхслойная защита.","Arco arreglado: tensión mínima, sin tensar corriendo y 0,8 s para encajar flecha.":"Лук исправлен: минимальное натяжение, нельзя натягивать на бегу, 0,8 с на то, чтобы наложить стрелу.","Escudo provisional: nueva arma «Espada y escudo» (espada de una mano, 1,7 m de alcance). Al parar se levanta el escudo, que detiene también flechas y piedras de frente y cansa menos que parar con la espada. Nueva opción «Arma del rival»: el rival con escudo lo levanta cuando le apuntas.":"Временный щит: новое оружие «Меч и щит» (одноручный меч, досягаемость 1,7 м). При защите поднимается щит, который также останавливает стрелы и камни спереди и утомляет меньше, чем защита мечом. Новая настройка «Оружие противника»: противник со щитом поднимает его, когда вы в него целитесь.","Combate en inglés: botón ES/EN arriba a la derecha y todos los textos traducidos (ayuda, avisos, registro, menús y decisiones). En el móvil, el panel de opciones ya no tapa el menú.":"Бой на английском: кнопка ES/EN вверху справа, все тексты переведены (справка, подсказки, журнал, меню и решения). На телефоне панель настроек больше не закрывает меню.","v6: también en ruso, con el mismo selector de idioma.":"v6: теперь и на русском, с тем же выбором языка.","Escena común del estilo elegido: cielo, luz, sombras blandas, suelo con textura, bosque, hierba, flores y rocas, con la liza de tierra en el centro":"Общая сцена в выбранном стиле: небо, свет, мягкие тени, земля с текстурой, лес, трава, цветы и камни, с площадкой утоптанной земли в центре","Los dos luchadores son el personaje del taller: la armadura es su ropa por capas (lino, gambesón, cota sobre gambesón), los brazos agarran el arma con cinemática inversa y las heridas se pegan al cuerpo donde entra el golpe":"Оба бойца — персонаж из мастерской: доспех — его одежда слоями (лён, стёганка, кольчуга поверх стёганки), руки держат оружие с помощью обратной кинематики, а раны прилипают к телу там, куда пришёлся удар","Las flechas, dianas y postes ya no dejan memoria gráfica ocupada; aviso y recarga si se pierde el dibujo 3D.":"Стрелы, мишени и столбы больше не занимают графическую память; сообщение и перезагрузка при потере 3D-изображения.","Alrededor de la liza, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra, rocas y árboles de copa sueltos":"Вокруг ристалища сцена как в пробе стиля v5: густая трава с цветами, кусты, пятна земли, камни и отдельные лиственные деревья","Espadas, palo, arco, escudo, flecha, poste de práctica y diana con el estilo v5; cintas de paño teñido más apagadas":"Мечи, посох, лук, щит, стрела, тренировочный столб и мишень в стиле v5; более приглушённые ленты из крашеного сукна","Prueba de estilo":"Проба стиля","Cabaña en un claro con el estilo propuesto: realismo en miniatura.":"Хижина на поляне в предложенном стиле: миниатюрный реализм.","Tres estilos (A plano, B suave, C texturas) con cabaña y personaje: elige uno.":"Три стиля (A плоский, B мягкий, C с текстурами) с хижиной и персонажем: выберите один.","Un solo estilo estilizado y ligero: 30 mil triángulos y 12 dibujados, sin personaje (espera tu decisión).":"Один лёгкий стилизованный стиль: 30 тыс. треугольников и 12 вызовов отрисовки, без персонажа (ждёт вашего решения).","Maqueta en miniatura: formas redondeadas, luz suave, sombras de contacto y desenfoque; zócalo de piedra continuo.":"Миниатюрный макет: скруглённые формы, мягкий свет, контактные тени и размытие; сплошной каменный цоколь.","Realismo en miniatura: la maqueta con texturas por código y el mundo sin recortar.":"Миниатюрный реализм: макет с текстурами, созданными кодом, и мир без обрезки.","Árboles rehechos: copas suaves en racimos y pinos con puntas, sin rayajos.":"Деревья переделаны: мягкие кроны гроздьями и сосны с острыми верхушками, без каракулей.","Personaje por código: una sola malla con esqueleto, quieto y andando; vistas Personaje y Cara":"Персонаж из кода: одна сетка со скелетом, стоит и ходит; виды «Персонаж» и «Лицо»","Prueba de estilo en inglés: botón ES/EN arriba (recuerda el idioma elegido, también el de la web); la escena no cambia.":"Проба стиля на английском: кнопка ES/EN вверху (запоминает выбранный язык, в том числе на сайте); сцена не меняется.","v8: también en ruso. La escena no cambia.":"v8: теперь и на русском. Сцена не изменилась.","Sin el muñeco hecho por código (el personaje está ahora en el visor de personaje); la escena no cambia":"Без фигуры, сделанной кодом (персонаж теперь в просмотрщике персонажа); сцена не меняется","Las notas se colocan justo encima de la barra de vistas, aunque en el móvil esta ocupe dos filas.":"Заметки стоят прямо над панелью видов, даже когда на телефоне она занимает две строки.","Personaje":"Персонаж","Personajes del taller propio: cuerpo de MakeHuman con la ropa por capas hecha por código (camisa, túnica o vestido, gambesón, cota, sobreveste), andando delante de la cabaña.":"Персонажи собственной мастерской: тело MakeHuman со слоистой одеждой, сделанной кодом (рубаха, туника или платье, стёганка, кольчуга, сюрко), идут перед хижиной.","Personaje esculpido por código: cara, manos, ropa por capas, esqueleto y andar.":"Персонаж, вылепленный кодом: лицо, руки, многослойная одежда, скелет и ходьба.","Personaje con bases libres (CC0) ya hechas y personalización: hombre o mujer, ropa, peinado, color de pelo, piel y barba.":"Персонаж на готовых свободных основах (CC0) с настройкой внешности: мужчина или женщина, одежда, причёска, цвет волос, кожа и борода.","Más ligero en el móvil (calidad ligera, un solo esqueleto, menos resolución) con interruptores para medir; sin el traje de explorador.":"Легче на телефоне (лёгкое качество, один скелет, меньшее разрешение) с переключателями для замеров; без костюма следопыта.","Vuelve la calidad alta por defecto en el móvil (iba perfecto); la ligera sigue como opción.":"На телефоне снова высокое качество по умолчанию (работало отлично); лёгкое остаётся как вариант.","Nueva opción «Base del personaje»: el taller propio (cuerpo de MakeHuman con ropa, pelo y barba hechos por código) ya anda, tala y lucha con las animaciones de Quaternius pasadas a su esqueleto.":"Новая настройка «Основа персонажа»: собственная мастерская (тело MakeHuman с одеждой, волосами и бородой, сделанными кодом) уже ходит, рубит и сражается с анимациями Quaternius, перенесёнными на её скелет.","Arreglo: en calidad alta la ropa, el pelo y la cofia del taller propio se veían del revés (la piel se pintaba encima). Prueba nueva que lo vigila.":"Исправление: при высоком качестве одежда, волосы и чепец собственной мастерской выглядели вывернутыми наизнанку (кожа рисовалась поверх). Новый тест следит за этим.","Taller propio: postura arreglada (tronco recto, hombros en su sitio, brazos colgando rectos) y túnica del hombre que ya no marca pecho.":"Собственная мастерская: исправлена осанка (прямой корпус, плечи на месте, руки свисают прямо), мужская туника больше не обрисовывает грудь.","El taller propio pasa a ser la base (elegido por valravnx) y sale por defecto. Ropa por capas: camisa de lino, calzas y zapatos siempre; encima túnica o vestido y gambesón acolchado, que se ponen y se quitan con botones.":"Собственная мастерская становится основой (выбор valravnx) и используется по умолчанию. Многослойная одежда: льняная рубаха, шоссы и башмаки всегда; поверх — туника или платье и стёганый гамбезон, которые надеваются и снимаются кнопками.","Cota de malla y sobreveste como capas del taller propio, sobre la camisa, la túnica o el vestido y el gambesón.":"Кольчуга и сюрко как слои собственной мастерской поверх рубахи, туники или платья и гамбезона.","Visor de personaje en inglés: botón ES/EN arriba (recuerda el idioma elegido, también el de la web); el personaje no cambia.":"Просмотр персонажа на английском: кнопка ES/EN вверху (запоминает выбранный язык, в том числе на сайте); персонаж не меняется.","v11: también en ruso; en el móvil, el panel de opciones se coloca encima de la barra de vistas aunque esta ocupe dos filas.":"v11: теперь и на русском; на телефоне панель настроек стоит над панелью видов, даже если та занимает две строки.","Correr más natural: la carrera del paquete, suavizada por código (menos zancada, braceo, bote e inclinación, y los brazos más pegados), y a su velocidad de verdad: antes los pies resbalaban y se veía a cámara lenta. Botón «Correr» en Animación.":"Бег естественнее: бег из набора, смягчённый кодом (короче шаг, меньше взмахов руками, подпрыгивания и наклона, руки ближе к телу), и с его настоящей скоростью: раньше ноги скользили и всё выглядело как замедленная съёмка. Кнопка «Бег» в разделе «Анимация».","Brazos naturales al correr: oscilan junto al cuerpo, con la mano de canto y la muñeca recta, en vez de ir torcidos hacia delante.":"Естественные руки при беге: качаются вдоль тела, кисть ребром, запястье прямое, а не вывернуты вперёд.","El cinturón de encima de la cota ya no sobresale hacia los brazos (personajes del taller-v7).":"Пояс поверх кольчуги больше не торчит к рукам (персонажи из taller-v7).","Hito 1: construcción (v1 a v3)":"Этап 1: строительство (v1–v3)","Lógica 35/35, modelos 21/21, navegador PC y móvil correctos.":"Логика 35/35, модели 21/21, браузер на ПК и телефоне — без ошибок.","Rejilla anclada a la primera pieza, módulo de 2 m × 2,5 m, apoyos y reparto de carga.":"Сетка, привязанная к первой детали, модуль 2 м × 2,5 м, опоры и распределение нагрузки.","Desmontaje en cascada con 75% de recuperación, bloqueado si sobrecarga otra pieza.":"Каскадный разбор с возвратом 75%, запрещён, если перегружает другую деталь.","v2: los muros se rellenan hasta el tejado y los tejados seguidos forman una pendiente continua.":"v2: стены заполняются до крыши, а соседние крыши образуют сплошной скат.","v3: muros de 10 hiladas de 25 cm, todos exactos a 2,5 m.":"v3: стены из 10 рядов по 25 см, все ровно 2,5 м.","Campo de pruebas de combate v1 y v2":"Испытательная площадка боя v1 и v2","Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.":"Логика 52/52 (с мутациями, которые проваливаются, как и должны); браузер на ПК и телефоне: всё в порядке.","v1: cinco líneas de golpe, guardias, heridas por zona sin barras de vida, arco con balística.":"v1: пять линий удара, стойки, ранения по зонам без полосок здоровья, лук с баллистикой.","Comparado con juegos de esgrima de referencia: la v1 era poco intuitiva (arrastrar para golpear, elegir lado al parar, cámara a su aire).":"В сравнении с эталонными фехтовальными играми v1 была неинтуитивной (удар перетаскиванием, выбор стороны при защите, камера живёт своей жизнью).","v2: rosa de golpes sobre el rival, parada sin lado + parada perfecta + golpe maestro, fintas, aliento.":"v2: роза ударов над противником, защита без выбора стороны + идеальная защита + мастерский удар, финты, дыхание.","Movimiento encarado (los lados rodean al rival), cámara con margen, pausa de impacto, chispas, sangre, sonido y estela.":"Движение лицом к противнику (шаги в сторону — по кругу вокруг него), камера с запасом, пауза при ударе, искры, кровь, звук и след клинка.","Dificultad = ritmo + ayudas: aprendiz (lento, con avisos), normal, realista (sin avisos).":"Сложность = темп + подсказки: ученик (медленно, с подсказками), обычная, реалистичная (без подсказок).","Sesión duplicada: arreglo del arco hecho dos veces":"Дублированная сессия: исправление лука сделано дважды","No aplica (trabajo descartado).":"Неприменимо (работа отброшена).","Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.":"Эта сессия началась одновременно с другой (19:13 по Мадриду), и обе взяли одну и ту же задачу: исправление лука.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).":"Другая первой опубликовала бой v3; когда я стал загружать свою, в репозитории она уже была. Отбрасываю свою версию, чтобы не затереть опубликованную (версии никогда не перезаписываются).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.":"Моя копия тоже проходила все тесты (бой 63/63, браузер без ошибок); она не добавляет ничего, чего нет в опубликованной v3.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen.":"Внимание: над репозиторием одновременно работают две автоматические задачи. Лучше оставить одну, чтобы они не повторяли работу и не мешали друг другу.","Infraestructura: repositorio, web de progreso y trabajo automático":"Инфраструктура: репозиторий, сайт прогресса и автоматическая работа","Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.":"Все тесты проекта зелёные (логика, модели, бой, браузер на ПК и телефоне, сайт). Исправлен тест боя, который иногда падал, если противник убивал вас до нажатия на панели.","Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.":"Репозиторий valravnxx/kinhold с кодом, дизайн-документами и правилами работы.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.":"Сайт прогресса на GitHub Pages: игра, roadmap, дневник, время, решения и документы.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.":"Задача по расписанию в :19 каждого часа: выполняет одну задачу roadmap за сессию и останавливается в конце каждого этапа, чтобы вы проверили.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso.":"Ждёт вас: включить GitHub Pages (Settings → Pages → ветка main, папка /docs); отсюда у меня нет прав.","Alcance del proyecto: arte y seguridad al roadmap":"Масштаб проекта: графика и безопасность в roadmap","Web regenerada y probada en PC y móvil.":"Сайт пересобран и проверен на ПК и телефоне.","Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.":"Новый этап 1b «Арт-дирекция и персонажи», приоритетнее новых деталей: реалистичный персонаж, настройка внешности и видимая броня. Начинается с трёх проб стиля, из которых вы выберете.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.":"Новый этап 11b «Администрирование, журналы и безопасность»: роли, панель администратора, журналы, обнаружение читов и санкции.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.":"Расширен этап 11 (защищённые аккаунты) и закреплено в правилах: у каждого действия, меняющего мир, есть автор, чтобы его можно было записать в журнал.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil.":"В правилах работы закреплена визуальная планка: сдержанно и реалистично в рамках low-poly, никакой детской эстетики, и чтобы тянул телефон.","Hito 1b: tres pruebas de estilo":"Этап 1b: три пробы стиля","Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 52/52; браузер: строительство, бой, пробы стиля (ПК и телефон, с намеренной поломкой MUTAR=1, которая проваливается, как и должна) и сайт — всё в порядке.","Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.":"Новый прототип «Пробы стиля» (v1): одна и та же сцена (бревенчатая хижина с соломенной крышей, дрова, пень с топором, бочка, изгородь, деревья) и один и тот же персонаж в трёх стилях.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.":"A · Сдержанный плоский: плоские грани, мало деталей, полуденный свет. B · Мягкий и естественный: мягкое затенение, запечённое в вершины затенение окружения, больше деталей, кинематографичные тона. C · Рисованные текстуры: текстуры, созданные кодом, низкий вечерний свет, туман и тёплая цветокоррекция.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.":"Новый персонаж ростом 1,76 м с суставами: льняная рубаха, шерстяная туника, пояс с кошелём, шоссы, обмотки на ногах, кожаные башмаки, короткие волосы и борода; лицо с веками, бровями, носом, ушами и ртом.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).":"Замерено в тестовом браузере: A — 16 тыс. треугольников, B — 39 тыс., C — 86 тыс.;
