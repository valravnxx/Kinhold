e: it fails.","Hito 1c: escalera de tablas":"Milestone 1c: plank stairs","Todas con herramientas/probar_todo.sh: lógica de construcción 63/63 (17 nuevas de la escalera), modelos 21/21, combate 69/69, personaje 11/11, textos traducidos, y navegador de construcción (subir y bajar andando, hueco, pasar por debajo), combate, estilo, personaje, recursos, inglés y web correctos. Las pruebas nuevas se rompieron a propósito una vez (sin hueco, sin giro, sin subir andando) y fallaron.":"All with herramientas/probar_todo.sh: building logic 63/63 (17 new for the stairs), models 21/21, combat 69/69, character 11/11, translated texts, and browser tests for building (walking up and down, the opening, passing underneath), combat, style, character, assets, English and website all correct. The new tests were broken on purpose once (no opening, no rotation, no walking up) and failed.","Pieza nueva «Escalera de tablas» (6 tablas y 6 clavos, 100 kg, en Acceso): ocupa una casilla y sube una planta.":"New piece «Plank stairs» (6 planks and 6 nails, 100 kg, under Access): takes one tile and goes up one floor.","Se sube y se baja andando, sin botón: se entra por el lado bajo y se sale arriba a la casilla de al lado; gira con R hacia dónde sube.":"You go up and down by walking, no button: you step in on the low side and come out at the top onto the next tile; rotate with R to choose which way it rises.","Encima queda el hueco abierto: no deja poner suelo sobre la escalera, ni la escalera bajo un suelo; en la última planta no cabe.":"The opening above stays open: no floor can go over the stairs, nor stairs under a floor; they don't fit on the top floor.","Se apoya en el cimiento o suelo de su casilla (o en la tierra en la planta baja) y suma su peso; si se quita ese suelo, cae.":"They rest on the foundation or floor of their tile (or the ground on the ground floor) and add their weight; if that floor is removed, they fall.","Por debajo del tramo alto se puede pasar sin subir. Por el hueco se puede caer a la escalera desde arriba: las barandillas llegan en la tarea siguiente (anotado en el registro de decisiones).":"You can walk under the high end without climbing. You can drop onto the stairs through the opening from above: railings come in the next task (noted in the decision log).","Construcción v6 publicada.":"Building v6 published.","Análisis del estado del proyecto, GDD v0.7 y plan para unificar las demos":"Analysis of the project's state, GDD v0.7 and plan to unify the demos","Web regenerada y comprobada (enlaces, inglés y documentos). Sin cambios de código del juego.":"Site rebuilt and checked (links, English and documents). No game code changes.","Análisis pedido por valravnx: lo hecho frente al GDD, lo que falta y los problemas del desarrollo.":"Analysis requested by valravnx: what has been done against the GDD, what is missing and the problems in development.","Problemas encontrados: las acciones aún no llevan autor (lo pide CLAUDE.md para el servidor); cuatro prototipos separados (construcción y combate siguen con muñecos hechos a mano y sin el estilo elegido); los golpes por dirección del combate no tienen animaciones; falta medir el rendimiento con mucha gente y en un móvil de verdad; el mundo grande por trozos y el servidor no están empezados; la ropa por capas aún no protege ni abriga; el GDD se había quedado atrás; el taller depende de versiones sin fijar; choques al fusionar el diario entre sesiones; código muerto del personaje esculpido; el ruso está sin empezar.":"Problems found: actions do not carry an author yet (CLAUDE.md requires it for the server); four separate prototypes (building and combat still use hand-made figures and lack the chosen style); combat's directional strikes have no animations; performance with many people and on a real phone has not been measured; the big world in chunks and the server have not started; layered clothing does not protect or keep warm yet; the GDD had fallen behind; the workshop depends on unpinned versions; clashes when merging the diary between sessions; dead code from the sculpted character; Russian has not started.","Hito nuevo 0b «Bases técnicas»: acciones con autor y registro, quitar código muerto, taller con versiones fijadas y diario sin choques. Va primero.":"New milestone 0b «Technical foundations»: actions with author and log, removing dead code, workshop with pinned versions and diary without clashes. It goes first.","Hito nuevo 1d «Una sola demo»: escena común con el estilo v5, personaje del taller en la construcción y en el combate, una página con menú y medida de rendimiento. Va antes que el resto del arte y de las piezas de construcción.":"New milestone 1d «A single demo»: shared scene in the v5 style, workshop character in building and combat, one page with a menu, and performance measurement. It goes before the rest of the art and the building pieces.","Tareas nuevas en otros hitos: ruso (infraestructura), prueba de golpes en cinco direcciones con el personaje nuevo (duelo), niveles de detalle del personaje y terreno por trozos (arte), datos de cada prenda (equipo) y comparar alojamientos para el servidor (servidor).":"New tasks in other milestones: Russian (infrastructure), test of strikes in five directions with the new character (duel), character levels of detail and terrain in chunks (art), data for each garment (equipment) and comparing hosting for the server (server).","GDD v0.7: estilo y personajes decididos, ropa por capas personalizable, combate con la rosa y las decisiones de hoy (cámara táctil, curación, fuego amigo), acciones con autor, escena común, mundo por trozos y los hitos 0b, 1b, 1c, 1d y 11b. También en inglés.":"GDD v0.7: style and characters decided, customizable layered clothing, combat with the rose and today's decisions (touch camera, healing, friendly fire), actions with an author, shared scene, world in chunks and milestones 0b, 1b, 1c, 1d and 11b. Also in English.","Prueba de estilo y visor de personaje en inglés":"Style test and character viewer in English","Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 321/321, navegador de construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil":"All passing with probar_todo.sh (logic, models, combat, baked character, translated texts 321/321, browser tests for building, combat, style, character, assets, English and website), PC and phone","La prueba de estilo (v7) y el visor de personaje (v10) usan el mismo módulo de idioma que la construcción y el combate: botón ES/EN arriba, que recuerda el idioma elegido (también el de la web).":"The style test (v7) and the character viewer (v10) use the same language module as building and combat: ES/EN button at the top, which remembers the chosen language (including the website's).","Traducidos al inglés todos sus textos: botones, vistas, opciones del personaje (base, cuerpo, capas de ropa, pelo, piel, barba, calidad, animación), la medida de fps y las notas de cada versión (99 textos nuevos).":"All their texts translated into English: buttons, views, character options (base, body, clothing layers, hair, skin, beard, quality, animation), the fps readout and the notes of each version (99 new texts).","Las opciones del visor de personaje pasan a src/personaje/textos.js para que la prueba de idiomas las lea sin navegador.":"The character viewer's options move to src/personaje/textos.js so the language test can read them without a browser.","Prueba de idiomas ampliada a estilo y personaje; la de navegador del inglés recorre ahora también las vistas y las notas de los dos, en PC y móvil. Rota a propósito (quitando dos traducciones) falla donde debe.":"Language test extended to style and character; the English browser test now also goes through the views and notes of both, on PC and phone. Broken on purpose (removing two translations), it fails where it should.","Las pruebas de navegador de estilo y personaje se abren con el navegador en español, para que sus capturas sigan en español; el inglés lo prueba la de idiomas.":"The style and character browser tests open with the browser in Spanish, so their screenshots stay in Spanish; English is covered by the language test.","Capturas de la prueba de estilo en capturas/estilo-v7.":"Style test screenshots in capturas/estilo-v7.","Juego y web en ruso":"Game and website in Russian","Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 322/322 en inglés y ruso, navegador de construcción, combate, estilo, personaje, recursos, inglés y ruso, y web), PC y móvil":"All pass with probar_todo.sh (logic, models, combat, baked character, translated texts 322/322 in English and Russian, browser tests for building, combat, style, character, assets, English and Russian, and website), PC and mobile","Los cuatro prototipos (construcción v7, combate v6, prueba de estilo v8 y personaje v11) están también en ruso: 398 textos del juego en src/idiomas/ru.json.":"The four prototypes (building v7, combat v6, style test v8 and character v11) are now also in Russian: 398 game texts in src/idiomas/ru.json.","La web de progreso tiene botón RU: textos fijos, roadmap y diario en ruso (427 textos en proyecto/idiomas/ru.json); construir_web.mjs exige ahora el ruso completo, igual que el inglés.":"The progress website has an RU button: fixed texts, roadmap and log in Russian (427 texts in proyecto/idiomas/ru.json); construir_web.mjs now requires Russian to be complete, like English.","Los documentos de diseño aún no están en ruso: la web en ruso enlaza a los de inglés. Queda como tarea nueva del hito de infraestructura.":"The design documents are not in Russian yet: the Russian website links to the English ones. Added as a new task in the infrastructure milestone.","En el móvil no cabían tres botones de idioma: ahora hay un desplegable con el idioma (en PC siguen los botones ES · EN · RU).":"Three language buttons didn't fit on » (it already happened in English) and the style test notes cover the view bar.","No comprobado: la prueba de navegador del ruso y la de la web rotas a propósito (MUTAR=1); las traducciones al ruso no las ha revisado una persona que hable ruso.":"Not checked: the Russian browser test and the website test broken on purpose (MUTAR=1); the Russian translations have not been reviewed by a Russian speaker.","Documentos de diseño en ruso":"Design documents in Russian","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, personaje 11, textos traducidos, navegador de los cuatro prototipos, idiomas y web 109 comprobaciones), PC y móvil; la prueba nueva de los documentos en ruso se rompió a propósito una vez y falló":"All passing with probar_todo.sh (logic 63, models 21, combat 69, character 11, translated texts, browser tests of the four prototypes, languages and website 109 checks), PC and mobile; the new Russian documents test was broken on purpose once and failed","El GDD, el documento de sistemas y el de análisis están en ruso, en diseno/ru/, con la huella del original como los de inglés.":"The GDD, the systems document and the analysis are in Russian, in diseno/ru/, with the original's fingerprint like the English ones.","Cada documento tiene arriba el selector ES · EN · RU, y la web en ruso enlaza ya a los documentos en ruso (antes iban al inglés).":"Each document has the ES · EN · RU selector at the top, and the website in Russian now links to the Russian documents (they used to go to the English ones).","construir_web.mjs comprueba también el ruso: falla si falta una traducción o si el español ha cambiado desde que se tradujo.":"construir_web.mjs also checks Russian: it fails if a translation is missing or if the Spanish has changed since it was translated.","Con esto se terminan las tareas del hito de infraestructura: queda en revisión para valravnx.":"This finishes the tasks of the infrastructure milestone: it is now in review for valravnx.","No comprobado: las traducciones al ruso no las ha revisado una persona que hable ruso.":"Not checked: the Russian translations have not been reviewed by a Russian speaker.","Hito 0b: acciones con autor":"Milestone 0b: actions with an author","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, personaje 11, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil; la prueba nueva de acciones se rompió a propósito una vez y falló":"All passing with probar_todo.sh (logic 63, models 21, combat 69, actions 25, character 11, translated texts, browser for the four prototypes, assets, languages and website), PC and mobile; the new actions test was broken on purpose once and failed","Nuevo módulo de lógica pura src/logica/acciones.js: cada acción es un mensaje con autor, tipo y datos sencillos; se comprueba, se aplica y se anota en un registro, salga bien o mal (con el motivo).":"New pure-logic module src/logica/acciones.js: every action is a message with an author, a type and plain data; it is checked, applied and recorded in a log, whether it succeeds or not (with the reason).","Construcción: el mojón, colocar y desmontar piezas, poner y quitar muebles, abrir y cerrar puertas y el botón de materiales pasan ya por las acciones. Con el registro se rehace el mismo mundo desde cero, como hará el servidor.":"Building: the boundary stone, placing and dismantling pieces, placing and removing furniture, opening and closing doors and the materials button now go through actions. The log rebuilds the same world from scratch, as the server will.","Combate: cada golpe cuerpo a cuerpo y cada disparo son acciones con autor y objetivo; la herida de una flecha se anota como impacto del mismo autor. Quien no está en el combate o ya ha caído no puede herir.":"Combat: every melee strike and every shot is an action with an author and a target; an arrow wound is recorded as an impact by the same author. Someone who is not in the fight or has already fallen cannot wound.","Prueba nueva (prueba_acciones.mjs, 25 comprobaciones): falla si una acción se salta el registro, porque el mundo rehecho ya no coincide, y revisa el código del juego para que nada fuera de la lógica pura cambie el mundo directamente.":"New test (prueba_acciones.mjs, 25 checks): it fails if an action skips the log, because the rebuilt world no longer matches, and it scans the game code so that nothing outside the pure logic changes the world directly.","Decisión provisional (anotada en el registro de decisiones de la construcción): mientras no haya cuentas, el autor es «jugador:local» y el registro vive solo en memoria; el guardado no cambia de formato.":"Provisional decision (noted in the building decision log): until there are accounts, the author is “jugador:local” and the log lives only in memory; the save format does not change.","Sin versión jugable nueva: no cambia nada a la vista.":"No new playable version: nothing visible changes.","No comprobado: las dos comprobaciones nuevas de navegador (registro de acciones en la construcción y en el combate) no se rompieron a propósito; la prueba de lógica sí (MUTAR=1 falla en 2 comprobaciones).":"Not verified: the two new browser checks (action log in building and in combat) were not broken on purpose; the logic test was (MUTAR=1 fails 2 checks).","Hito 0b: quitar código muerto":"Milestone 0b: removing dead code","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil":"All passing with probar_todo.sh (logic 63, models 21, combat 69, actions 25, translated texts, browser for all four prototypes, assets, languages and website), PC and mobile","Quitado el personaje esculpido abandonado: cuerpo, campos de distancia, datos horneados (560 KB), la herramienta que los horneaba y su prueba. Nada del juego los usaba.":"Removed the abandoned sculpted character: body, distance fields, baked data (560 KB), the tool that baked them and its test. Nothing in the game used them.","Quitado el muñeco por código de la prueba de estilo, con sus vistas «Personaje» y «Cara» y el botón «Quieto/Andando». La escena no cambia y su límite vuelve a 50 mil triángulos (usa 49,1 mil).":"Removed the code-made figure from the style test, along with its «Character» and «Face» views and the «Standing/Walking» button. The scene does not change and its limit goes back to 50 thousand triangles (it uses 49.1 thousand).","Los guardados de la prueba de estilo se adaptan: si se había quedado en una vista de personaje, vuelve a la general.":"Style test saves are adapted: if it was left on a character view, it goes back to the general view.","Prueba de estilo v9 publicada; las versiones anteriores (con el muñeco) siguen en la web sin tocar.":"Style test v9 published; the earlier versions (with the figure) remain on the website untouched.","La prueba de estilo comprueba ahora que no queda nada del muñeco y que un guardado de la v8 se adapta; rota a propósito una vez (MUTAR=1) y falló.":"The style test now checks that nothing of the figure remains and that a v8 save is adapted; broken on purpose once (MUTAR=1) and it failed.","Hito 0b: taller con versiones fijadas":"Milestone 0b: workshop with pinned versions","Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Después solo cambiaron roadmap, diario y traducciones: repetidas web y traducciones. Sin cambios jugables: no hay versión nueva. No comprobado: que las texturas salgan idénticas píxel a píxel, ni que el commit de MPFB2 sea exactamente el usado al principio (es el último del 24 oct, anterior a montar el taller).":"All tests passed (logic 63, models 21, combat 69, actions 25, workshop, translations and browser: building, combat, style, character, assets, English and website). Afterwards only the roadmap, diary and translations changed: website and translation tests repeated. No playable changes: no new version. Not checked: that the textures come out identical pixel by pixel, nor that the MPFB2 commit is exactly the one used at first (it is the latest from 24 Oct, before the workshop was set up).","Versiones del taller fijadas en herramientas/taller/versiones.json: Python 3.13, Blender por pip (bpy 5.2.3), numpy, Pillow, MPFB2 en su commit exacto (versión 2.0.18) y los paquetes de node.":"Workshop versions pinned in herramientas/taller/versiones.json: Python 3.13, Blender via pip (bpy 5.2.3), numpy, Pillow, MPFB2 at its exact commit (version 2.0.18) and the node packages.","Los programas del taller comprueban las versiones al empezar: si algo no coincide, paran y dicen qué; lo encontrado queda anotado junto a los personajes que salen.":"The workshop programs check the versions when they start: if anything does not match, they stop and say what; what was found is recorded next to the characters they produce.","Guía para montarlo desde cero (herramientas/taller/LEEME.md) y un programa que lo monta solo con esas versiones.":"A guide to set it up from scratch (herramientas/taller/LEEME.md) and a program that sets it up by itself with those versions.","Comprobado montándolo desde cero en una máquina vacía: los dos personajes salen con las mismas 47 mallas (mismos vértices y tamaño) que los recursos publicados taller-v4.":"Checked by setting it up from scratch on an empty machine: both characters come out with the same 47 meshes (same vertices and size) as the published taller-v4 assets.","Visto en las fotos del taller: el cinturón de encima de la cota sobresale hacia los lados (ya estaba publicado así); queda como tarea en el hito de arte.":"Seen in the workshop photos: the belt over the mail shirt sticks out sideways (it was already published like that); it is left as a task in the art milestone.","Prueba nueva sin Blender (formato de las versiones y que una diferencia se detecta), rota a propósito una vez (MUTAR=1): falla.":"New test without Blender (version format and that a difference is detected), broken on purpose once (MUTAR=1): it fails.","Hito 0b: diario y traducciones sin choques":"Milestone 0b: log and translations without clashes","Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Sin cambios jugables ni visuales: no hay versión nueva ni capturas. No comprobado: el orden exacto del diario en una fusión antigua, donde la entrada se había colocado a mano fuera de su hora.":"All tests pass (logic 63, models 21, combat 69, actions 25, merge 19, workshop, translations and browser: building, combat, style, character, assets, English and website). No playable or visual changes: no new version or screenshots. Not checked: the exact log order in one old merge, where the entry had been placed by hand out of its time.","Herramienta nueva (herramientas/unir_json.mjs) que une diario.json y las traducciones al fusionar ramas: entran las entradas y los textos de las dos ramas, y el diario queda en orden de hora.":"New tool (herramientas/unir_json.mjs) that merges diario.json and the translations when merging branches: entries and texts from both branches go in, and the log stays in time order.","Git la usa sola al fusionar (se activa en cada clon con --instalar); solo se para si dos ramas cambian distinto la misma entrada o traducción.":"Git uses it automatically when merging (enabled in each clone with --instalar); it only stops if two branches change the same entry or translation differently.","Comprobado rehaciendo las cuatro fusiones anteriores de main: el diario y las traducciones salen con el mismo contenido que se unió a mano y sin conflictos en esos archivos.":"Checked by redoing the four previous merges into main: the log and translations come out with the same content that was merged by hand, and without conflicts in those files.","Regla en CLAUDE.md: activarla al empezar cada sesión, y si choca la web generada, volver a generarla en vez de unirla a mano.":"Rule in CLAUDE.md: enable it at the start of every session, and if the generated website clashes, regenerate it instead of merging it by hand.","Prueba nueva con casos pequeños y un caso real con git de dos sesiones en paralelo; rota a propósito una vez (MUTAR=1): falla.":"New test with small cases and a real git case of two parallel sessions; broken on purpose once (MUTAR=1): it fails.","Hito 0b: revisión completa":"Milestone 0b: full review","Todas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil. Construcción y combate repetidas tras el arreglo de la prueba.":"All passing (logic 63, models 21, combat 69, actions 25, merge 19, workshop, translations and browser: building, combat, style, character, assets, English and website), PC and mobile. Building and combat re-run after the test fix.","Pasadas todas las pruebas del proyecto con probar_todo.sh: las cuatro demos en PC y móvil, inglés, recursos de personaje, taller, traducciones y web.":"Ran every project test with probar_todo.sh: the four demos on PC and mobile, English, character assets, workshop, translations and website.","Revisadas las capturas de construcción, combate, estilo, personaje y web: todo se ve como antes del hito, que no cambia nada a la vista.":"Checked the screenshots of building, combat, style, character and website: everything looks as before the milestone, which changes nothing visible.","Quedaba sin comprobar que las pruebas de navegador del registro de acciones fallan si una acción no se anota: comprobado quitando el apunte en el registro; la de la construcción y las dos del combate fallan.":"It was still unchecked that the browser tests of the action log fail if an action is not recorded: checked by removing the log write; the building one and both combat ones fail.","Arreglada la del combate: con el registro vacío rompía la prueba entera en vez de fallar esa comprobación y seguir.":"Fixed the combat one: with an empty log it crashed the whole test instead of failing that check and carrying on.","Sin versión jugable nueva: el hito prepara el proyecto, no cambia nada a la vista.":"No new playable version: the milestone prepares the project and changes nothing visible.","El hito 0b queda en revisión, esperando a valravnx.":"Milestone 0b is now in review, waiting for valravnx.","Arreglo: quitar muebles con el ratón":"Fix: removing furniture with the mouse","Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de los cuatro prototipos, recursos, inglés y web), PC y móvil. No comprobado: en una pantalla táctil de verdad (el toque no cambia: elige y pide confirmar como antes).":"All passing with probar_todo.sh (logic, models, combat, actions, merge, workshop, translations and browser for the four prototypes, assets, English and website), PC and mobile. Not checked: on a real touch screen (touch is unchanged: it selects and asks to confirm as before).","valravnx: en PC no se podían quitar muebles; al mover el ratón hacia el botón de confirmar se perdía lo elegido.":"valravnx: on PC furniture could not be removed; moving the mouse towards the confirm button lost the selection.","Causa: en Desmontar, pasar el ratón volvía a elegir lo que hubiera debajo y escondía el botón. Pasaba también con las piezas.":"Cause: in Dismantle, hovering re-selected whatever was under the mouse and hid the button. It also happened with pieces.","Ahora el clic elige y lo elegido se queda fijo hasta confirmar o cancelar; sin nada elegido, pasar el ratón sigue resaltando lo que se quitaría.":"Now a click selects and the selection stays until you confirm or cancel; with nothing selected, hovering still highlights what would be removed.","Prueba nueva con el ratón de verdad: clic en un barril, mover el ratón hasta el botón y confirmar. Con el código de antes falla, como le pasaba a valravnx.":"New test with the real mouse: click a barrel, move the mouse to the button and confirm. With the old code it fails, just as it did for valravnx.","Construcción v8 publicada; las versiones anteriores siguen en la web.":"Building v8 published; earlier versions remain on the site.","Hito 1d: escena común (src/mundo/)":"Milestone 1d: shared scene (src/mundo/)","Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de construcción, combate, estilo, personaje, inglés y ruso, y web), PC y móvil; la de recursos de personaje falló por una ruta de importación y, arreglada, pasó repetida. Medido sin tarjeta gráfica (aquí no hay otra): construcción 346 ms por fotograma frente a 142 de la v8, combate 280 frente a 145 de la v6. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil de valravnx (es la tarea de rendimiento de este hito). Las comprobaciones de la prueba de combate cambiadas son las mismas (solo cambia la espera), no se rompieron a propósito.":"All passing with probar_todo.sh (logic, models, combat, actions, merge, workshop, translations and browser tests for building, combat, style, character, English and Russian, and the website), desktop and mobile; the character assets test failed because of an import path and, once fixed, passed when repeated. Measured without a graphics card (none here): building 346 ms per frame versus 142 for v8, combat 280 versus 145 for v6. Not checked: frame times with a graphics card or on valravnx's phone (that is this milestone's performance task). The combat test checks that changed are the same checks (only the wait changes); they were not broken on purpose.","Escena común en src/mundo/: estilos.js (paleta, luces, texturas por código), ambiente.js (cielo, sol con sombras blandas, luz del cielo, niebla y gradación ACES) y decorado.js (suelo hasta el horizonte, bosque instanciado, hierba, flores y rocas).":"Shared scene in src/mundo/: estilos.js (palette, lights, code-generated textures), ambiente.js (sky, sun with soft shadows, sky light, fog and ACES grading) and decorado.js (ground to the horizon, instanced forest, grass, flowers and rocks).","La construcción y el combate dejan su cielo azul liso, su suelo de color y sus árboles de conos y usan la escena del estilo v5. El combate tiene la liza de tierra pisada en el centro.":"Building and combat drop their flat blue sky, coloured ground and cone trees and use the style v5 scene. Combat has a trodden-earth fighting ground in the middle.","La prueba de estilo y el visor de personaje usan los mismos módulos; se ven igual que antes (la prueba de estilo difiere de su captura publicada solo por la compresión JPG).":"The style test and the character viewer use the same modules; they look the same as before (the style test differs from its published screenshot only by JPG compression).","La sombra sigue al jugador. Los cientos de árboles van instanciados: unas pocas llamadas de dibujo en vez de cerca de 900 de la construcción anterior.":"The shadow follows the player. The hundreds of trees are instanced: a few draw calls instead of nearly 900 in the previous building version.","Decisión provisional: en la construcción la hierba empieza a 16 m de la salida, porque dentro se construye y asomaría por los cimientos. Anotada en el registro del prototipo.":"Provisional decision: in building, grass starts 16 m from the starting point, because building happens inside that area and grass would poke through the foundations. Noted in the prototype's log.","Decisión provisional por rendimiento: en la construcción y el combate el suelo va sin relieve ni filtrado anisótropo, los árboles lejanos no echan sombra y el cielo lo pinta la página. Medido sin tarjeta gráfica: el relieve del suelo era lo que más costaba.":"Provisional decision for performance: in building and combat the ground has no relief or anisotropic filtering, distant trees cast no shadow and the page paints the sky. Measured without a graphics card: the ground relief was the most expensive part.","La prueba de combate espera a que la flecha acabe su vuelo en vez de un tiempo fijo; con fotogramas más lentos fallaba sin que el juego fallase.":"The combat test waits for the arrow to finish its flight instead of a fixed time; with slower frames it failed without the game failing.","Construcción v9 y combate v7 publicados; las versiones anteriores siguen en la web.":"Building v9 and combat v7 published; earlier versions stay on the website.","Hito 1d: el personaje del taller en la construcción":"Milestone 1d: the workshop character in building","Todas correctas con probar_todo.sh, PC y móvil, salvo la de idiomas, que fallaba porque abría la construcción sin servidor y el modelo no se carga así; servida por HTTP, pasa entera (repetida aparte). La prueba nueva del personaje se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas de cerca miradas: quieto, de espaldas, corriendo, talando y en el móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (es la tarea de rendimiento de este hito); la prueba de idiomas no se rompió a propósito tras el cambio (solo cambia cómo se sirven las páginas).":"All passed with probar_todo.sh, PC and mobile, except the language test, which failed because it opened the building game without a server and the model cannot load that way; served over HTTP, it passes in full (rerun separately). The new character test was broken on purpose (MUTAR=1, models in a folder that does not exist) and failed as it should. Close-up screenshots checked: idle, from behind, running, chopping and on mobile. Not checked: frame rates with a graphics card or on the phone (that is this milestone's performance task); the language test was not broken on purpose after the change (only how the pages are served changed).","El jugador de la construcción es el personaje del taller propio (cuerpo de MakeHuman vestido por código) en vez del muñeco: camisa y calzas de lino, sin túnica.":"The building game's player is the character from our own workshop (MakeHuman body dressed by code) instead of the dummy: linen shirt and hose, no tunic.","Anda, corre y tala con las animaciones de Quaternius pasadas a su esqueleto. Medida la velocidad natural de las animaciones con el pie en un ciclo: andar 0,97 m/s y correr 2,59 m/s; se aceleran con la velocidad del juego hasta 1,6×.":"They walk, run and chop with the Quaternius animations retargeted to their skeleton. Natural animation speed measured from the foot over one cycle: walking 0.97 m/s and running 2.59 m/s; they speed up with the game's movement speed up to 1.6×.","Talar: junto a un árbol del bosque, Usar (F) hace el gesto de talar y moverse lo para. Solo el gesto: sin hacha en la mano y sin madera, que llega con la recolección del hito 2.":"Chopping: next to a forest tree, Use (F) plays the chopping motion and moving stops it. Only the motion: no axe in hand and no wood, which comes with gathering in milestone 2.","Mientras carga el personaje (o si no se puede cargar) se ve el muñeco de antes, así el juego no se queda sin jugador.":"While the character loads (or if it cannot load) the old dummy is shown, so the game is never left without a player.","Decisión provisional: lleva zapatos aunque el GDD dice que se empieza descalzo. Comprobado en las capturas: sin zapatos se ve sin pies, porque el cuerpo del taller no los tiene debajo. Tarea nueva en el hito de arte para los pies descalzos.":"Provisional decision: they wear shoes although the GDD says you start barefoot. Checked in the screenshots: without shoes they look footless, because the workshop body has no feet underneath. New task in the art milestone for bare feet.","Decisión provisional: las velocidades del juego (3,6 m/s andando y 6 con Mayús) no se cambian; con ellas se usa la animación de correr y a 6 m/s los pies resbalan algo. Anotado en el registro del prototipo.":"Provisional decision: the game's speeds (3.6 m/s walking and 6 with Shift) are unchanged; at those speeds the running animation is used, and at 6 m/s the feet slide a little. Noted in the prototype's log.","Las pruebas de navegador de la construcción y de idiomas sirven las páginas por HTTP, como en la web, para poder cargar el modelo.":"The browser tests for building and languages serve the pages over HTTP, as on the website, so the model can load.","Construcción v10 publicada; las versiones anteriores siguen en la web.":"Building v10 published; earlier versions remain on the website.","Hito 1d: el personaje del taller en el combate":"Milestone 1d: the workshop character in combat","Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, navegador de construcción, combate, estilo, personaje, recursos, idiomas y web), en PC y móvil. La prueba nueva del combate se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas miradas: de cerca en guardia, golpes de las cinco líneas, heridas, cara, rival con cota, escudo, palo y arco; y el duelo entero en PC y móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (cada luchador tiene unos 16.000 a 18.000 triángulos; es la tarea de rendimiento de este hito). A medio golpe las cinco líneas se ven parecidas: es el movimiento de antes, y los golpes con animación propia son otra tarea del duelo.":"All passing with probar_todo.sh (logic 63/63, models 21/21, combat 69/69, actions 25/25, browser tests for building, combat, style, character, assets, languages and website), on PC and mobile. The new combat test was broken on purpose (MUTAR=1, models in a folder that does not exist) and failed as it should. Screenshots checked: close-ups in guard, strikes on the five lines, wounds, face, opponent in mail, shield, staff and bow; and the whole duel on PC and mobile. Not checked: frame rate with a graphics card or on mobile (each fighter has about 16,000 to 18,000 triangles; that is this milestone's performance task). Mid-strike the five lines look similar: it is the previous movement, and strikes with their own animation are another duel task.","Los dos luchadores del duelo son el personaje del taller propio en vez del muñeco de cubos; mientras carga (o si no carga) se ve el muñeco de antes.":"Both duel fighters are the in-house workshop character instead of the block mannequin; while it loads (or if it fails to load) the old mannequin is shown.","La armadura del duelo es la ropa por capas del taller: lino = camisa y calzas, gambesón = gambesón, cota de malla = cota encima del gambesón. Lo que protege sigue en la lógica de combate, que no cambia.":"The duel armour is the workshop's layered clothing: linen = shirt and hose, gambeson = gambeson, mail = mail shirt over the gambeson. What it protects stays in the combat logic, which does not change.","Piernas y cuerpo con las animaciones del taller (guardia de espada quieto, andar y correr). Los brazos se colocan cada fotograma con cinemática inversa de dos huesos para que las manos agarren el arma donde la ponen las poses de siempre; si el brazo no llega, el arma se queda en la mano. Con escudo, la mano izquierda lo coge por el asa; con arco, una mano en el arco y otra en la cuerda.":"Legs and body use the workshop animations (sword guard when standing still, walk and run). The arms are placed every frame with two-bone inverse kinematics so the hands grip the weapon where the usual poses put it; if the arm cannot reach, the weapon stays in the hand. With a shield, the left hand holds it by the grip; with a bow, one hand on the bow and the other on the string.","El arma sube o baja con los hombros del personaje: las poses estaban hechas para hombros a 1,48 m y el del taller los tiene más bajos, y más aún agachado en guardia.":"The weapon rises or drops with the character's shoulders: the poses were made for shoulders at 1.48 m and the workshop character has them lower, and lower still when crouched in guard.","La mano izquierda venía abierta en la animación de guardia (es de espada de una mano): ahora copia el puño cerrado de la derecha.":"The left hand came open in the guard animation (it is for a one-handed sword): it now copies the closed fist of the right.","Las heridas se pintan como antes (sangre o moratón, más grande cuanto más grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, así que siguen al personaje. En la cara, más pequeñas.":"Wounds are painted as before (blood or a bruise, bigger the more serious), but stuck to the surface of the body or clothes where the blow lands and hung from the bone, so they follow the character. On the face they are smaller.","La cinta azul o amarilla va en el pecho, encima de la ropa: los dos luchadores son el mismo hombre del taller y es lo que los distingue.":"The blue or yellow ribbon is on the chest, over the clothes: both fighters are the same workshop man and this is what tells them apart.","Decisión provisional, anotada en el registro del combate: cojear ya no se ve; lo hacía el muñeco y las animaciones del taller no lo traen.":"Provisional decision, noted in the combat log: limping is no longer visible; the mannequin did it and the workshop animations do not include it.","La prueba de navegador del combate sirve la página por HTTP, como en la web, y tiene comprobaciones nuevas: los dos son el personaje del taller, llevan las capas de su armadura, el muñeco no se ve, las manos están en el puño en guardia y en las cinco líneas de golpe, el escudo se agarra por el asa y cada herida se pega en su hueso.":"The combat browser test serves the page over HTTP, as on the website, and has new checks: both are the workshop character, wear the layers of their armour, the mannequin is hidden, the hands are on the grip in guard and on the five strike lines, the shield is held by its grip and each wound sticks to its bone.","Combate v8 publicado; las versiones anteriores siguen en la web.":"Combat v8 published; the earlier versions remain on the website.","Hito 1d: demo única":"Milestone 1d: single demo","Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, textos traducidos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web), en PC y móvil. La prueba nueva de la demo se rompió a propósito (MUTAR=1 borra lo guardado al cambiar de parte) y falló como debía. Capturas miradas del menú, el personaje, la construcción y el duelo con la mujer de vestido y gambesón, en PC y móvil, y el menú en ruso. Visto en las capturas: en el móvil el aviso de la construcción sigue tapando «Reiniciar», y con el botón «Menú» la barra de arriba ocupa una fila más; es la tarea siguiente del hito. No comprobado: los fotogramas con tarjeta gráfica ni en un móvil de verdad (es la tarea de rendimiento).":"All passing with probar_todo.sh (logic 63/63, models 21/21, combat 69/69, actions 25/25, translated texts, browser tests for building, combat, style, character, demo, resources, languages and website), on PC and mobile. The new demo test was broken on purpose (MUTAR=1 clears what is saved when switching parts) and failed as it should. Screenshots checked of the menu, the character, building and the duel with the woman in dress and gambeson, on PC and mobile, and the menu in Russian. Seen in the screenshots: on mobile the building notice still covers «Restart», and with the «Menu» button the top bar takes one more row; that is the next task of the milestone. Not checked: frame rate with a graphics card or on a real phone (that is the performance task).","Demo única publicada (jugar/demo/v1): una página con menú y tres partes, Construir, Duelo y Personaje, que son los últimos prototipos de cada cosa (construcción v10, combate v8, personaje v11). three.js va una sola vez: la página pesa 1,2 MB, frente a 1 MB de cada prototipo suelto.":"Single demo published (jugar/demo/v1): one page with a menu and three parts, Build, Duel and Character, which are the latest prototype of each thing (building v10, combat v8, character v11). three.js is included only once: the page weighs 1.2 MB, compared with 1 MB for each separate prototype.","Cada parte se abre con ?modo= y el botón «Menú» de arriba vuelve al menú recargando la página, para que nunca haya dos escenas ni dos WebGL a la vez en el móvil. Lo construido, las opciones del duelo y el personaje siguen guardados en el navegador al volver.":"Each part opens with ?modo= and the «Menu» button at the top returns to the menu by reloading the page, so a phone never has two scenes or two WebGL contexts at once. What you built, the duel options and the character stay saved in the browser when you come back.","El personaje elegido en «Personaje» (hombre o mujer y su ropa por capas) es el que construye y el que lucha; el menú resume cuál es. Las próximas versiones de los prototipos sueltos también lo leerán (las ya publicadas no cambian).":"The character chosen in «Character» (man or woman and their layered clothing) is the one who builds and fights; the menu summarises which one it is. The next versions of the separate prototypes will read it too (the ones already published do not change).","Decisiones provisionales, anotadas en el registro de la demo: sin personaje elegido, en la construcción se sale con camisa y calzas de lino (GDD); en el duelo manda la armadura de sus opciones (con lino, tu ropa sin gambesón ni cota; con gambesón o cota, esas piezas y la sobreveste si la elegiste); el rival sigue siendo el hombre de siempre.":"Provisional decisions, noted in the demo log: with no character chosen, building starts in a linen shirt and hose (GDD); in the duel the armour from its options rules (with linen, your clothes without gambeson or mail; with gambeson or mail, those pieces and the surcoat if you chose it); the opponent is still the usual man.","La web pone la demo única la primera en «Jugar»; las versiones antiguas de cada prototipo se quedan.":"The website puts the single demo first under «Play»; the old versions of each prototype stay.","Prueba nueva de navegador de la demo (menú, las tres partes, el botón Menú, el personaje elegido en construcción y duelo, menú en inglés y ruso), metida en probar_todo.sh.":"New browser test for the demo (menu, the three parts, the Menu button, the chosen character in building and duel, menu in English and Russian), added to probar_todo.sh.","Hito 1d: rendimiento de la demo única":"Milestone 1d: single demo performance","Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas de la demo miradas en PC y móvil":"All passing (bash herramientas/probar_todo.sh): logic, models, combat, actions, workshop, merge, texts, browser tests for building, combat, style, character, demo, assets, languages and website; demo screenshots checked on PC and phone","Medida de rendimiento común (src/mundo/rendimiento.js): cada parte registra su renderer y se cuentan los fotogramas por segundo, el tiempo medio y el peor de cada fotograma, los triángulos y las llamadas de dibujo, la memoria gráfica (geometrías y texturas), la de JavaScript (solo en Chrome y similares) y los personajes en escena.":"Shared performance measurement (src/mundo/rendimiento.js): each part registers its renderer and it counts frames per second, the average and worst time of each frame, triangles and draw calls, graphics memory (geometries and textures), JavaScript memory (only in Chrome and similar) and the characters in the scene.","Demo única v2 publicada (jugar/demo/v2): los fps salen en un botón junto a «Menú» y al pulsarlo se abre el detalle con una nota para valravnx. En el móvil, si junto a «Menú» no cabe sin añadir otra fila de botones, va suelto a la izquierda de la pantalla.":"Single demo v2 published (jugar/demo/v2): the fps show on a button next to “Menu”, and tapping it opens the details with a note for valravnx. On a phone, if it doesn’t fit next to “Menu” without adding another row of buttons, it sits on its own at the left of the screen.","En «Construir», «Personajes de prueba» (0, 4, 8 o 16): personajes del taller que pasean en corro alrededor del jugador, solo para medir con gente; no cambian el mundo.":"In “Build”, “Test characters” (0, 4, 8 or 16): workshop characters who stroll in a ring around the player, only for measuring with people around; they don’t change the world.","Medido en el navegador de pruebas (dibujo por software, sus fps no valen): personaje 89 mil triángulos y 41 dibujos; construcción con 1 personaje 130 mil triángulos y 29 dibujos; con 9 personajes 426 mil y 185 (cada personaje suma unos 37 mil triángulos contando su sombra, unas 10 geometrías y 12 texturas); duelo con 2 personajes 143 mil y 72.":"Measured in the test browser (software rendering, its fps mean nothing): character viewer 89 thousand triangles and 41 draw calls; building with 1 character 130 thousand triangles and 29 draw calls; with 9 characters 426 thousand and 185 (each character adds about 37 thousand triangles counting its shadow, about 10 geometries and 12 textures); duel with 2 characters 143 thousand and 72.","Pregunta añadida a valravnx en las decisiones pendientes: los fps en su móvil.":"Question for valravnx added to the pending decisions: the fps on his phone.","Prueba de la demo ampliada: botón de fps libre, panel con los números, cuenta de personajes en cada parte, más triángulos con 8 personajes de prueba y que el botón no tape el menú; con MUTAR_REND=1 falla como debe.":"Demo test extended: fps button unobstructed, panel with the numbers, character count in each part, more triangles with 8 test characters and the button not covering the menu; with MUTAR_REND=1 it fails as it should.","Hito 1d: los avisos y las notas ya no tapan los menús en el móvil":"Milestone 1d: notices and notes no longer cover the menus on mobile","Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas miradas en PC y móvil":"All passing (bash herramientas/probar_todo.sh): logic, models, combat, actions, workshop, merging, texts, browser tests for construction, combat, style, character, demo, assets, languages and website; screenshots checked on PC and mobile","En el móvil, el aviso de la construcción se coloca según lo que mide de verdad el menú de arriba (que en inglés y en ruso ocupa más filas, y en la demo lleva también «Menú» y los fps) y a la izquierda de los botones de modo: ya no tapa «Reiniciar» ni ningún otro botón. En PC sigue centrado, justo debajo del menú.":"On mobile, the construction notice is placed according to the real size of the top menu (which takes more rows in English and Russian, and in the demo also holds «Menu» and the fps) and to the left of the mode buttons: it no longer covers «Reset» or any other button. On PC it stays centred, just below the menu.","Las notas de la prueba de estilo se colocan justo encima de la barra de vistas, aunque esta ocupe dos filas, y nunca suben por encima de la barra de arriba.":"The style test notes sit just above the views bar, even when it takes two rows, and never rise above the top bar.","Pruebas nuevas: en la de idiomas, que el aviso no tapa ningún botón (en inglés y en ruso, PC y móvil); en la de estilo, que las notas no tapan las barras, también con la barra de vistas estrechada a dos filas. Con MUTAR_SOLAPE=1 (aviso y notas a la altura fija de antes) fallan las dos, como deben.":"New tests: in the language test, that the notice covers no button (in English and Russian, PC and mobile); in the style test, that the notes don't cover the bars, also with the views bar narrowed to two rows. With MUTAR_SOLAPE=1 (notice and notes at the old fixed height) both fail, as they should.","Publicadas construcción v11, prueba de estilo v10 y demo única v3 (con la construcción v11).":"Published construction v11, style test v10 and single demo v3 (with construction v11).","No comprobado: en un móvil de verdad; solo en el navegador de pruebas a 390×844 (y a 320 de ancho en una prueba aparte).":"Not checked: on a real phone; only in the test browser at 390×844 (and at 320 wide in a separate check).","Correr más natural (personaje v12)":"More natural running (character v12)","Lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, idiomas y unión correctos; navegador: construcción, combate, demo, estilo, personaje e idiomas correctos en PC y móvil. La prueba nueva falla con MUTAR=1. No comprobado: cómo se ve en un móvil de verdad.":"Logic 63/63, models 21/21, combat 69/69, actions 25/25, languages and merge correct; browser: construction, combat, demo, style, character and languages correct on PC and mobile. The new test fails with MUTAR=1. Not checked: how it looks on a real phone.","La carrera del paquete se suaviza por código al pasarla al taller: cada hueso se mueve menos alrededor de su postura media (brazos 50 %, tronco 55 %, piernas 60 %), el tronco se endereza, los brazos se acercan al cuerpo como al andar y la pelvis bota 10 cm en vez de 25.":"The pack's run is softened by code when it is passed to the workshop: each bone moves less around its mean pose (arms 50 %, trunk 55 %, legs 60 %), the trunk straightens, the arms come closer to the body as when walking and the pelvis bounces 10 cm instead of 25.","Las demás animaciones salen idénticas (comprobado: diferencia máxima de 2·10⁻⁷ en sus datos).":"The other animations come out identical (checked: maximum difference of 2·10⁻⁷ in their data).","Encontrado un fallo de antes: el juego trataba la carrera como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s; a 3,6 m/s los pies resbalaban y se veía a cámara lenta. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar (carrera nueva: 3,5 m/s el hombre y 2,9 la mujer).":"Found an old bug: the game treated the run as if its natural speed were 2.59 m/s, but measured with the planted foot it was 5.8 m/s; at 3.6 m/s the feet slid and it looked like slow motion. Now the natural speed of walking and running is measured in the clip itself on load (new run: 3.5 m/s the man and 2.9 the woman).","Personajes nuevos en recursos/personajes/taller-v5/ (la ropa, igual que la v4); la construcción, el duelo y el visor ya los usan.":"New characters in recursos/personajes/taller-v5/ (clothes the same as v4); construction, the duel and the viewer already use them.","Botón «Correr» en el visor de personaje y prueba nueva: zancada natural y poco bote (falla con la carrera de antes).":"«Run» button in the character viewer and a new test: natural stride and little bounce (it fails with the old run).","Personaje v12 publicado. La demo única recoge la carrera nueva en su próxima versión.":"Character v12 published. The single demo picks up the new run in its next version.","Hito 1d: revisión completa":"Milestone 1d: full review","Todas correctas (bash herramientas/probar_todo.sh), PC y móvil; capturas miradas.":"All passed (bash herramientas/probar_todo.sh), PC and mobile; screenshots checked.","Pasadas todas las pruebas del proyecto con probar_todo.sh: lógica, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo única, recursos, idiomas y web.":"All project tests passed with probar_todo.sh: logic, models, combat, actions, workshop, merging, texts, and browser tests for building, combat, style, character, single demo, assets, languages and website.","Revisadas las capturas de la demo única en PC y móvil (menú en español, inglés y ruso, Construir, Duelo y Personaje), de la construcción, del combate y de la web: el mismo personaje del taller y la misma escena en todo, y ningún aviso tapa los menús.":"Reviewed the screenshots of the single demo on PC and mobile (menu in Spanish, English and Russian, Build, Duel and Character), of building, combat and the website: the same workshop character and the same scene everywhere, and no notice covers the menus.","Sin versión jugable nueva: desde la demo v3 no ha cambiado nada que se juegue.":"No new playable version: nothing playable has changed since demo v3.","Los fps de las capturas (1 a 4) son del navegador de pruebas sin tarjeta gráfica, no de un dispositivo de verdad; en su móvil valravnx dijo que van bien.":"The fps in the screenshots (1 to 4) come from the test browser without a graphics card, not from a real device; valravnx said they run fine on his phone.","El hito 1d queda en revisión, esperando a valravnx.":"Milestone 1d is now in review, waiting for valravnx.","Hito 1c: barandillas y portillo (sin publicar)":"Milestone 1c: railings and gate (not published)","Lógica 81/81, modelos, acciones, idiomas, navegador de construcción (PC y móvil), estilo, personaje, demo, recursos, inglés y web correctos. FALLA el navegador de combate: «soltar flojo no dispara y avisa» y «la retícula se cierra a plena tensión». Falla igual en main sin mis cambios (desde la unión de la carrera nueva); aislado, soltar flojo sí avisa, así que parece de tiempos de la prueba. No comprobado: la causa exacta.":"Logic 81/81, models, actions, languages, construction browser test (PC and mobile), style, character, demo, assets, English and website all pass. The combat browser test FAILS: “releasing a weak draw does not shoot and warns” and “the reticle closes at full draw”. It fails the same way on main without my changes (since the new run was merged); on its own, releasing a weak draw does warn, so it looks like test timing. Not verified: the exact cause.","Portillo de varas para la cerca (4 varas y 1 cuerda, como la puerta de varas): va en el suelo y se abre y se cierra con Usar; abierto deja pasar.":"Wattle gate for the fence (4 rods and 1 rope, like the wattle door): it goes on the ground and opens and closes with Use; when open you can walk through.","Las piezas que se abren se leen ahora de la marca «portón» de cada pieza, no de una lista fija.":"Which pieces open is now read from each piece’s “gate” mark, not from a fixed list.","El medio muro sirve de barandilla en el borde de un suelo en alto y alrededor del hueco de la escalera: comprobado en el navegador que con él no se cae y sin él sí.":"The half wall works as a railing on the edge of a raised floor and around the stair opening: checked in the browser that with it you do not fall and without it you do.","Pruebas nuevas de lógica (17) y de navegador (barandilla y portillo), rotas a propósito una vez: fallan como deben.":"New logic tests (17) and browser tests (railing and gate), broken on purpose once: they fail as they should.","Todo queda en la rama trabajo/20261026-0519, ya unida con main.":"Everything stays on the branch trabajo/20261026-0519, already merged with main.","Demo única v4: la carrera nueva en todo":"Single demo v4: the new run everywhere","Demo única correcta en PC y móvil (menú, construir, duelo, personaje, idiomas); textos traducidos correctos. Las demás pruebas, correctas en la sesión anterior con el mismo código. No comprobado: cómo se ve en un móvil de verdad.":"Single demo correct on PC and mobile (menu, build, duel, character, languages); translated texts correct. The other tests, correct in the previous session with the same code. Not checked: how it looks on a real phone.","valravnx pidió integrar la carrera nueva y todo en la demo única.":"valravnx asked to integrate the new run and everything into the single demo.","Demo única v4 publicada: construcción v11, combate v8 y personaje v12, con los personajes del taller-v5 (carrera suavizada y a su velocidad natural).":"Single demo v4 published: construction v11, combat v8 and character v12, with the workshop v5 characters (softened run at its natural speed).","Prueba nueva en la demo: en «Construir» el personaje corre con la carrera nueva a su ritmo natural (falla con MUTAR=1).":"New test in the demo: in «Build» the character runs with the new run at its natural pace (it fails with MUTAR=1).","Brazos naturales al correr (personaje v13, demo v5)":"Natural arms when running (character v13, demo v5)","Todas correctas en PC y móvil. La prueba del combate falló una vez con el servidor cargado (tiempos del arco y la pausa de impacto, que se miden en tiempo real) y pasó entera al repetirla sola. No comprobado: cómo se ve en un móvil de verdad.":"All correct on PC and mobile. The combat test failed once with the server under load (bow timings and the impact pause, which are measured in real time) and passed fully when repeated alone. Not checked: how it looks on a real phone.","valravnx: los brazos de la carrera nueva van torcidos hacia delante, en pose nada natural; arreglado eso, la aprueba (pregunta de la carrera cerrada: no hacen falta las de Rokoko).":"valravnx: the arms in the new run are twisted forward, in an unnatural pose; with that fixed, he approves it (the run question is closed: the Rokoko ones are not needed).","Los brazos se corrigen por código en la misma carrera: el brazo oscila alrededor de la vertical (de unos 25° atrás a unos 18° delante), el antebrazo va un poco hacia arriba y hacia dentro, la mano de canto con el pulgar arriba y la muñeca recta.":"The arms are corrected by code in the same run: the arm swings around the vertical (from about 25° back to about 18° forward), the forearm points slightly up and inward, the hand is edge-on with the thumb up and the wrist straight.","Personajes en recursos/personajes/taller-v6/ (las demás animaciones salen idénticas: diferencia máxima de 2·10⁻⁷).":"Characters in recursos/personajes/taller-v6/ (the other animations come out identical: maximum difference of 2·10⁻⁷).","Personaje v13 y demo única v5 publicados.":"Character v13 and single demo v5 published.","Cinturón de la cota ceñido (taller-v7)":"Shirt-of-mail belt fitted (taller-v7)","Todas correctas con probar_todo.sh salvo el combate, que pasó aparte con los márgenes portados. Fotos del taller antes y después, y visor y demo en PC y móvil mirados.":"All pass with probar_todo.sh except combat, which passed separately with the ported margins. Workshop photos before and after, and viewer and demo on PC and mobile, reviewed.","valravnx aprobó el hito 1d (una sola demo).":"valravnx approved milestone 1d (single demo).","El cinturón de encima de la cota del hombre se estiraba hasta los brazos (0,32 m de medio ancho frente a 0,18 de la cota): al medir el contorno de la cintura se contaban también las mangas, y las de la cota bajan hasta la mano. Ahora solo cuentan el cuerpo y la falda de la prenda.":"The belt over the man’s mail shirt stretched out to the arms (0.32 m half-width versus 0.18 for the mail): when measuring around the waist the sleeves were counted too, and the mail sleeves reach down to the hand. Now only the body and skirt of the garment count.","Personajes nuevos en recursos/personajes/taller-v7, encima de la v6 de los brazos al correr: solo cambia ese cinturón (comprobado malla a malla); las animaciones salen idénticas.":"New characters in recursos/personajes/taller-v7, on top of v6 with the running arms: only that belt changes (checked mesh by mesh); the animations come out identical.","Prueba nueva de los cinturones de todos los personajes y comprobación en el visor con el hombre y la cota; las dos fallan con la taller-v6.":"New test of the belts of all characters and a check in the viewer with the man and the mail; both fail with taller-v6.","Portado el arreglo de tiempos de la prueba del combate de la sesión automática (sin él fallaba el arco a 2 fps).":"Ported the timing fix for the combat test from the automatic session (without it the bow failed at 2 fps).","Personaje v14 y demo única v6 publicados.":"Character v14 and single demo v6 published.","Pantalla en blanco en el móvil arreglada; muros con el estilo (construcción v12)":"Blank screen on mobile fixed; walls in the style (construction v12)","Todas correctas en PC y móvil. Pruebas nuevas, que fallan al romperlas: memoria gráfica estable al rehacer las piezas (MUTAR_FUGA=1: 822 → 16.672 geometrías), aviso y recarga al perder el dibujo 3D, huecos de puertas y ventanas mirados triángulo a triángulo. No comprobado: en el móvil de valravnx.":"All correct on PC and mobile. New tests, which fail when broken: graphics memory stable when rebuilding pieces (MUTAR_FUGA=1: 822 → 16,672 geometries), notice and reload when the 3D view is lost, door and window openings checked triangle by triangle. Not checked: on valravnx's phone.","valravnx: la pantalla se queda en blanco jugando (con los botones vivos y a más de 80 fps) y sigue así aunque recargue.":"valravnx: the screen goes blank while playing (with the buttons still working and at over 80 fps) and stays that way even after reloading.","Causa encontrada y medida: al colocar o quitar algo se rehacían todas las piezas y las viejas no se liberaban de la memoria gráfica (con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas). Con una casa grande, cada pieza colocada dejaba miles, hasta agotar la memoria del móvil.":"Cause found and measured: placing or removing anything rebuilt all the pieces and the old ones were not freed from graphics memory (with 9 pieces, 20 rebuilds went from 870 to 4,050 meshes). With a big house, every piece placed left thousands, until the phone's memory ran out.","Arreglado: las piezas, el mojón, el anillo de la tierra y la pieza fantasma se liberan al quitarlos (la cuenta queda igual tras 20 reconstrucciones). En el duelo, las flechas, dianas y postes también.":"Fixed: pieces, the boundary stone, the land ring and the ghost piece are freed when removed (the count stays the same after 20 rebuilds). In the duel, arrows, targets and posts too.","Si aun así el navegador pierde el dibujo 3D: aviso, recarga sola con lo construido guardado y, si vuelve a pasar enseguida, botón «Recargar» en vez de recargar en bucle.":"If the browser still loses the 3D view: a notice, automatic reload with what you built saved and, if it happens again right away, a «Reload» button instead of reloading in a loop.","Muros, postes y vigas con el estilo elegido (troncos redondos con testas, zarzo, entramado y tablas), cada pieza en una malla por textura. Muestrario nuevo para fotos de cerca (herramientas/muestrario/).":"Walls, posts and beams in the chosen style (round logs with log ends, wattle, timber framing and planks), each piece in one mesh per texture. New sample board for close-up photos (herramientas/muestrario/).","Publicados construcción v12, combate v9 y demo única v7. Se colaron en el repositorio dos enlaces a node_modules (de una copia de trabajo): quitados y ahora ignorados.":"Construction v12, combat v9 and single demo v7 published. Two links to node_modules (from a working copy) slipped into the repository: removed and now ignored.","Decisiones de valravnx: mundo a escala real, agua y nado, y obras con materiales (GDD v0.8)":"valravnx's decisions: real-scale world, water and swimming, and building works with materials (GDD v0.8)","Web y textos traducidos correctos. Sin cambios de código.":"Web and translated texts correct. No code changes.","valravnx aprueba («sí, todo») la propuesta del mundo, el nado y las obras.":"valravnx approves («yes, everything») the proposal for the world, swimming and building works.","Mundo a escala real: cordilleras como los Pirineos (cumbres de unos 3.000 m, valles de unos 1.000 m, collados), llanuras en las cuencas, ríos de tres gruesos según el agua que recogen, bosques frondosos, pendientes que frenan y obligan a nivelar. Se genera primero la red de ríos y después el terreno.":"Real-scale world: mountain ranges like the Pyrenees (peaks of about 3,000 m, valleys of about 1,000 m, passes), plains in the basins, rivers of three sizes depending on the water they gather, dense forests, slopes that slow you down and force levelling. The river network is generated first and then the terrain.","Agua y nado (no estaba en el GDD): se vadea andando, en el agua honda se nada despacio y cansa, no con armadura o mucha carga, la corriente de los ríos grandes arrastra; los carros solo cruzan por vados y puentes.":"Water and swimming (it was not in the GDD): you ford on foot, in deep water you swim slowly and it tires you, not in armour or heavily loaded, the current of great rivers drags you; carts only cross at fords and bridges.","Obras: marco, materiales y tiempo; clases de peso (ligero, pesado, muy pesado); escalera, varas para rodar troncos, andamio, polea, polipasto con torno y grúa de rueda. Solo o en pareja, una cabaña de troncos; en grupo, la piedra.":"Building works: frame, materials and time; weight classes (light, heavy, very heavy); ladder, poles for rolling logs, scaffold, pulley, block and tackle with windlass and treadwheel crane. Alone or as a couple, a log cabin; as a group, stone.","GDD v0.8 en español, inglés y ruso. Cinco tareas nuevas en el hito 1c (las obras, antes de las piezas nuevas, y los muros de piedra con grúa) y el hito 10 (Mundo) puesto al día.":"GDD v0.8 in Spanish, English and Russian. Five new tasks in milestone 1c (building works, before the new pieces, and stone walls with a crane) and milestone 10 (World) brought up to date.","Hito 1c: barandillas y portillo publicados (construcción v13, demo v8)":"Milestone 1c: railings and gate published (construction v13, demo v8)","Todas correctas con probar_todo.sh sobre el código final: lógica 81/81, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web. Un intento de pasar las pruebas de navegador en paralelo falló por falta de máquina (2 núcleos) y se descartó. No comprobado: cómo se ve en un móvil de verdad.":"All passing with probar_todo.sh on the final code: logic 81/81, models, combat, actions, workshop, merge, texts and browser tests for building, combat, style, character, demo, assets, languages and website. An attempt to run the browser tests in parallel failed for lack of machine (2 cores) and was dropped. Not checked: how it looks on a real phone.","Arreglada la prueba del combate que impedía publicar: no era un fallo del juego sino de tiempos. Sin tarjeta gráfica el navegador de pruebas va a 2 fps y el juego limita cada paso a 0,05 s, así que el tiempo de juego corre hasta 10 veces más lento que el real; la prueba esperaba como mucho 3 a 6 s reales a que se encajara la flecha o se tensara el arco. Ahora espera a esas condiciones con margen amplio (30 s), sin tiempos fijos.":"Fixed the combat test that blocked publishing: it was not a game bug but a timing one. Without a graphics card the test browser runs at 2 fps and the game caps each step at 0.05 s, so game time runs up to 10 times slower than real time; the test waited at most 3 to 6 real seconds for the arrow to be nocked or the bow drawn. It now waits for those conditions with a wide margin (30 s), with no fixed times.","Unida la rama de la sesión anterior (barandillas y portillo) con main, tres veces, porque mientras pasaban las pruebas las sesiones de chat publicaron la carrera, los brazos, el cinturón, los muros con el estilo y el arreglo de la pantalla en blanco.":"Merged the previous session's branch (railings and gate) with main, three times, because while the tests ran the chat sessions published the run, the arms, the belt, the styled walls and the blank-screen fix.","Publicadas la construcción v13 y la demo única v8: el medio muro hace de barandilla en el borde de un suelo en alto y junto al hueco de la escalera, y hay portillo de varas para la cerca que se abre con Usar.":"Published construction v13 and single demo v8: the half wall works as a railing on the edge of a raised floor and next to the stair opening, and there is a wattle gate for the fence that opens with Use.","Mirado en las capturas que el portillo y la barandilla quedan bien junto a los muros nuevos con el estilo, en PC y en móvil.":"Checked in the screenshots that the gate and the railing look right next to the new styled walls, on PC and on mobile.","Capa, botas y tocados en el taller (a medias)":"Cloak, boots and headwear in the workshop (half done)","Lógica, modelos, acciones, cinturones, piezas nuevas, idiomas y navegador de construcción correctos. No comprobado: navegador de combate, personaje, demo y web (cortadas por tiempo).":"Logic, models, actions, belts, new pieces, languages and the building browser test pass. Not checked: combat, character, demo and website browser tests (cut short for time).","Taller: capa de lana abierta por delante, botas de cuero hasta debajo de la rodilla, capucha con esclavina, sombrero de paja (malla propia en el hueso de la cabeza) y, en la mujer, toca. Las orejas van en una malla aparte para esconderlas bajo la capucha y la toca.":"Workshop: a wool cloak open at the front, leather boots up to below the knee, a hood with a shoulder cape, a straw hat (its own mesh on the head bone) and, for the woman, a wimple. The ears are a separate mesh so they can be hidden under the hood and the wimple.","Cargador y visor: los tocados van de uno en uno, las botas sustituyen a los zapatos y la capa deja ver la ropa y el cinturón de debajo; en el duelo se conservan con cualquier armadura.":"Loader and viewer: headwear goes one at a time, boots replace the shoes and the cloak leaves the clothes and belt underneath visible; in the duel they stay on with any armour.","Prueba nueva de las piezas en los modelos (prueba_prendas.mjs: 10 correctas; con la taller-v7 falla, como debe) y comprobaciones nuevas en la prueba del visor.":"New test of the pieces in the models (prueba_prendas.mjs: 10 passing; with taller-v7 it fails, as it should) and new checks in the viewer test.","Falla y no se publica: en las fotos, la capucha deja un hueco con forma de oreja y el borde de la cara sale en escalones. La capa parece un sobretodo abierto: no cae por encima de los brazos. El sombrero y las botas se ven bien.":"Fails and is not published: in the photos the hood leaves an ear-shaped hole and the edge around the face comes out stepped. The cloak looks like an open overcoat: it does not fall over the arms. The hat and the boots look fine.","Todo el avance está en la rama trabajo/20261026-1338 para la sesión siguiente (taller-v8 sin publicar).":"All the progress is on the branch trabajo/20261026-1338 for the next session (taller-v8 not published).","Hito 1e: la escena común como la prueba de estilo v5":"Milestone 1e: the shared scene like the v5 style test","Lógica 81/81, modelos 22/22, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos e idioma correctos en PC y móvil.":"Logic 81/81, models 22/22, combat 69/69, actions 25/25, belts 8/8, merge 19/19, languages, workshop; browser tests for construction, combat, style, character, demo, assets and language pass on PC and mobile.","Escena común (src/mundo/decorado.js) más cerca de la prueba de estilo v5: hierba densa con flores también en el centro, matorrales de tres bultos de hojas, calvas de tierra pisada, rocas más cerca y árboles de copa sueltos antes del bosque.":"Shared scene (src/mundo/decorado.js) closer to the v5 style test: dense grass with flowers in the centre too, bushes of three leafy clumps, patches of trodden earth, rocks closer in and loose broadleaf trees before the forest.","En la construcción la hierba, las flores y las matas se esconden solas bajo lo construido en la planta baja, los muebles del suelo y el mojón, y vuelven al quitarlo; las matas escondidas dejan de chocar.":"In construction, grass, flowers and bushes hide themselves under what is built on the ground floor, floor furniture and the boundary stone, and come back when it is removed; hidden bushes stop blocking.","Los árboles sueltos son solo de copa: con pinos cerca, sus ramas bajas tapaban la cámara al talar.":"The loose trees are broadleaf only: with pines nearby, their low branches covered the camera when chopping.","Publicadas construcción v14, combate v10 y demo única v9, con comparación lado a lado con la v5 en las capturas.":"Published construction v14, combat v10 and single demo v9, with a side-by-side comparison with v5 in the screenshots.","Pruebas nuevas: ninguna planta asoma por los cimientos (rota a propósito con MUTAR_HIERBA=1: falla) y al quitarlo todo vuelven todas (rota a propósito sin despejar: falla).":"New tests: no plant pokes through the foundations (broken on purpose with MUTAR_HIERBA=1: fails) and after removing everything they all come back (broken on purpose without clearing: fails).","Algunas pruebas de navegador esperaban tiempos fijos y fallaban con el navegador de pruebas a 1-2 fps; ahora esperan a la condición con márgenes amplios (golpe maestro, rodeo lateral, parada normal, arranque en el móvil, dibujo 3D perdido).":"Some browser tests waited fixed times and failed with the test browser at 1-2 fps; now they wait for the condition with wide margins (master strike, side circling, normal parry, mobile start-up, lost 3D view).","Rendimiento medido solo en el navegador de pruebas sin tarjeta gráfica: en «Construir» con 8 personajes de prueba, 503 mil triángulos y 191 llamadas de dibujo (antes 426 mil y 185). No comprobado en un móvil de verdad.":"Performance measured only in the test browser without a graphics card: in “Build” with 8 test characters, 503 thousand triangles and 191 draw calls (before, 426 thousand and 185). Not checked on a real phone.","Hito 1e: cimientos, suelos y escaleras con el estilo v5":"Milestone 1e: foundations, floors and stairs in the v5 style","Todas correctas con probar_todo.sh: lógica 81/81, modelos 36/36, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"All passing with probar_todo.sh: logic 81/81, models 36/36, combat 69/69, actions 25/25, belts 8/8, merge 19/19, languages, workshop; browser tests for building, combat, style, character, demo, assets, language and website, on PC and mobile.","Cimiento de piedra rehecho como el zócalo de la cabaña de la prueba v5: macizo de mortero, 16 losas con juntas y un tono distinto cada una, y una hilada de piedras redondeadas en los costados.":"Stone foundation remade like the cabin plinth in the v5 style test: a mortar core, 16 flagstones with joints and a slightly different shade each, and a course of rounded stones along the sides.","Cimiento de troncos, suelo de troncos (troncos partidos sobre dos durmientes de corteza) y suelo de tablas (tablas con veta a lo largo sobre dos rastreles) con las texturas por código y la oclusión horneada de la v5; lo que se pisa sigue a la misma altura.":"Log foundation, log floor (split logs on two bark sleepers) and plank floor (planks with lengthwise grain on two battens) with the v5 procedural textures and baked occlusion; the walking surface stays at the same height.","Escalera de mano de varas descortezadas y escalera de tablas con zancas y peldaños con veta; cada pieza es ahora una sola malla por textura en vez de hasta 17 sueltas.":"Ladder of peeled poles and plank stairs with grained stringers and treads; each piece is now a single mesh per texture instead of up to 17 separate ones.","Prueba nueva en prueba_modelos.mjs: cimientos y suelos se pisan a la altura de la lógica, no salen de su casilla y las seis piezas están hechas con el estilo v5 (rota a propósito con MUTAR_SUELO=1: falla).":"New test in prueba_modelos.mjs: foundations and floors are walked on at the height the logic expects, stay inside their cell, and all six pieces use the v5 style (deliberately broken with MUTAR_SUELO=1: it fails).","Publicadas construcción v15 y demo única v10, con fotos de cerca de cada pieza y una comparación lado a lado con la prueba v5.":"Published building v15 and single demo v10, with close-up photos of each piece and a side-by-side comparison with the v5 test.","Triángulos por pieza medidos en node: cimiento de piedra 2476 (antes 588), suelo de tablas 1080 (antes 108), escalera de tablas 1404 (antes 156); llamadas de dibujo por pieza de 6-17 a 1-3. No comprobado en un móvil de verdad.":"Triangles per piece measured in node: stone foundation 2476 (was 588), plank floor 1080 (was 108), plank stairs 1404 (was 156); draw calls per piece down from 6-17 to 1-3. Not checked on a real phone.","Hito 1e: tejados de paja y de tablillas y hastiales con el estilo v5":"Milestone 1e: thatched and shingle roofs and gables in the v5 style","Todas correctas con probar_todo.sh: lógica 86/86, modelos 47/47, combate, acciones, cinturones, unión, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"All passing with probar_todo.sh: logic 86/86, models 47/47, combat, actions, belts, merge, languages, workshop; browser tests for construction, combat, style, character, demo, assets, language and website, on PC and mobile.","Tejado de paja como el de la cabaña de la prueba v5: dos hiladas gruesas con el canto redondeado (la del alero monta sobre la de arriba), una fila de manojos de paja asomando en el alero y la cumbrera redonda con sus remates.":"Thatched roof like the one on the cabin in style test v5: two thick courses with rounded edges (the eave course rides over the one above), a row of straw bundles poking out at the eaves and a rounded ridge with its end caps.","Las hiladas de paja tienen los lados planos: los tramos que van de lado se juntan sin sur
