<style>
:root{
  --fondo:#1b1712; --panel:#26201a; --panel2:#30281f; --tinta:#f1e8d8; --suave:#bfb19a; --tenue:#8c806d;
  --acento:#d9a441; --verde:#7ccf86; --rojo:#e0574f; --azul:#7fb2d9; --naranja:#e89a3c; --linea:rgba(241,232,216,.12);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acento)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.01em}
.envoltura{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:38px;color:var(--acento)}
header p{margin:2px 0 0;color:var(--suave)}
header .marca{display:flex;align-items:center;gap:14px}
header .marca img{width:64px;height:64px;flex:none}
#resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.dato{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.dato b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.dato span{color:var(--suave);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--fondo);display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--linea);overflow-x:auto}
nav button{font:inherit;color:var(--suave);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.sel{background:var(--panel2);color:var(--tinta);font-weight:600}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--acento);color:#241b10;font-size:12px;font-weight:700}
section{display:none;padding-top:18px} section.sel{display:block}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tarjeta img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.tarjeta .cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tarjeta h3{margin:0;font-size:20px}
.tarjeta p{margin:0;color:var(--suave);font-size:14px}
.boton{display:inline-block;text-align:center;background:var(--acento);color:#241b10;font-weight:700;text-decoration:none;padding:10px 14px;border-radius:10px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;color:var(--tinta);background:var(--panel2);border:1px solid var(--linea);border-radius:9px;padding:7px 9px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--suave);white-space:nowrap}
.chip.hecho{background:rgba(124,207,134,.16);color:var(--verde)}
.chip.en_curso{background:rgba(127,178,217,.16);color:var(--azul)}
.chip.revision{background:rgba(217,164,65,.2);color:var(--acento)}
.chip.espera_decision{background:rgba(232,154,60,.16);color:var(--naranja)}
.chip.fallo{background:rgba(224,87,79,.16);color:var(--rojo)}
.hito{background:var(--panel);border:1px solid var(--linea);border-radius:12px;margin-bottom:10px}
.hito > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.hito > summary::-webkit-details-marker{display:none}
.hito .num{font-family:Georgia,serif;font-size:20px;color:var(--tenue);text-align:center}
.hito.activo{border-color:rgba(127,178,217,.5)}
.hito h3{margin:0;font-size:17px}
.barra{height:6px;border-radius:3px;background:rgba(241,232,216,.08);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:3px}
.hito .det{padding:0 14px 14px 68px;color:var(--suave);font-size:14px}
.hito ul{margin:8px 0 0;padding:0;list-style:none}
.hito li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:5px 0;border-top:1px solid var(--linea);color:var(--tinta)}
.hito li em{font-style:normal;color:var(--tenue);font-size:12.5px;white-space:nowrap}
.entrada{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.entrada h3{margin:0 0 2px;font-size:17px}
.entrada .meta{color:var(--tenue);font-size:13px}
.entrada ul{margin:8px 0;padding-left:18px}
.entrada li{margin:3px 0}
.miniaturas{display:flex;gap:6px;overflow-x:auto;padding-top:4px}
.miniaturas a{flex:0 0 auto}
.miniaturas img{height:84px;border-radius:7px;display:block;border:1px solid var(--linea)}
.decision{background:var(--panel);border:1px solid rgba(232,154,60,.35);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.decision .meta{color:var(--tenue);font-size:13px;margin-top:4px}
.nota{color:var(--suave);font-size:14px;background:var(--panel);border-radius:12px;padding:12px 14px;border:1px dashed var(--linea)}
.docs a{display:block;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--tinta)}
.docs a span{display:block;color:var(--suave);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-bottom:1px solid var(--linea);text-align:left}
th{color:var(--suave);font-weight:600}
td.n{text-align:right}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:12px;z-index:20}
#visor img{max-width:100%;max-height:100%;border-radius:8px}
[hidden]{display:none!important}
footer{color:var(--tenue);font-size:13px;margin-top:30px}
#idiomas{display:flex;gap:4px}
#idiomas button{font:inherit;font-size:12.5px;font-weight:700;color:var(--suave);background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:4px 9px;cursor:pointer}
#idiomas button.sel{background:var(--acento);color:#241b10;border-color:transparent}
.derecha{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:640px){
  header h1{font-size:30px}
  header .marca img{width:52px;height:52px}
  #resumen{grid-template-columns:repeat(2,1fr)}
  .hito > summary{grid-template-columns:32px 1fr;}
  .hito > summary .chip{grid-column:2;justify-self:start}
  .hito .det{padding-left:14px}
  .derecha{align-items:flex-start}
}
</style>
</head>

<script>
const DATOS = {"roadmap":{"hitos":[{"id":"infra","num":"0","nombre":"Infraestructura","jugable":"Repositorio en GitHub, web de progreso y trabajo automático por horas.","estado":"hecho","tareas":[{"nombre":"Repositorio, web de progreso y tarea programada","estado":"hecho","fin":"2026-10-24T18:19:37+02:00","inicio":"2026-10-24T18:04:00+02:00"},{"nombre":"Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos","estado":"hecho","inicio":"2026-10-24T22:06:00+02:00","fin":"2026-10-24T22:11:29+02:00"},{"nombre":"Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma","estado":"hecho","inicio":"2026-10-24T22:19:24+02:00","fin":"2026-10-24T22:43:43+02:00"},{"nombre":"Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso","estado":"hecho","inicio":"2026-10-25T01:20:28+02:00","fin":"2026-10-25T02:03:30+02:00"},{"nombre":"Prueba de estilo y visor de personaje en inglés, con el mismo módulo de idioma","estado":"hecho","inicio":"2026-10-25T10:19:28+00:00","fin":"2026-10-25T11:09:16+00:00"},{"nombre":"Ruso: traducir el juego y la web (el archivo de ruso está vacío), con la misma comprobación que el inglés","estado":"hecho","inicio":"2026-10-25T11:21:12+00:00","fin":"2026-10-25T12:15:21+00:00"},{"nombre":"Documentos de diseño en ruso (GDD, sistemas y análisis), con selector de idioma; mientras tanto, la web en ruso enlaza a los documentos en inglés","estado":"hecho","inicio":"2026-10-25T12:20:58+00:00","fin":"2026-10-25T12:55:37+00:00"}],"nota":"Idiomas: español, inglés y ruso en el juego, la web y los documentos de diseño."},{"id":"base","num":"0b","nombre":"Bases técnicas","estado":"hecho","jugable":"Nada nuevo a la vista: el proyecto queda preparado para el online y para trabajar varias sesiones a la vez sin pisarse.","nota":"Salió del análisis del 25 oct (pedido de valravnx). Va antes que lo demás porque cuanto más código se escriba sin esto, más cuesta arreglarlo.","tareas":[{"nombre":"Acciones con autor: toda acción que cambia el mundo (construir, desmontar, golpear, herir) pasa por la lógica pura como un mensaje con autor (quién, qué, dónde), se valida y se guarda en un registro; pruebas que lo comprueban y que fallan si una acción se salta el registro","estado":"hecho","inicio":"2026-10-25T13:20:40+00:00","fin":"2026-10-25T14:03:35+00:00"},{"nombre":"Quitar código muerto: el personaje esculpido abandonado (cuerpo, campos de distancia, datos horneados y su herramienta y prueba) y el muñeco de la prueba de estilo, sin tocar las versiones ya publicadas","estado":"hecho","inicio":"2026-10-25T14:20:18+00:00","fin":"2026-10-25T14:59:27+00:00"},{"nombre":"Taller con versiones fijadas: anotar y comprobar al empezar la versión de Blender, el commit de MPFB2 y los paquetes, con una guía para volver a montarlo desde cero","estado":"hecho","inicio":"2026-10-25T15:05:18+00:00","fin":"2026-10-25T15:57:44+00:00"},{"nombre":"Diario y traducciones sin choques: una herramienta que une diario.json y en.json al fusionar ramas de varias sesiones, y su regla en CLAUDE.md","estado":"hecho","inicio":"2026-10-25T16:05:19+00:00","fin":"2026-10-25T16:42:46+00:00"},{"nombre":"Revisión completa y publicación","estado":"hecho","inicio":"2026-10-25T17:04:32+00:00","fin":"2026-10-25T17:43:19+00:00"}]},{"id":"unificacion","num":"1d","nombre":"Una sola demo","estado":"hecho","jugable":"Una sola página con construcción, duelo y personaje, con la misma escena del estilo elegido y el mismo personaje del taller en todo.","nota":"Plan de unificación (pedido de valravnx, 25 oct): hoy son cuatro prototipos que no se hablan y cada mejora se queda en uno. Va antes que el resto del arte y de las piezas de construcción.","tareas":[{"nombre":"Escena común (src/mundo/): cielo, luz, niebla, suelo y decorado con el estilo v5 en un solo módulo, que usan la construcción, el combate y el visor de personaje","estado":"hecho","inicio":"2026-10-25T18:20:48+00:00","fin":"2026-10-25T19:45:09+00:00"},{"nombre":"Personaje del taller en la construcción: sustituye al muñeco inicial; anda, corre y tala con sus animaciones, y empieza con camisa y calzas de lino como dice el GDD","estado":"hecho","inicio":"2026-10-25T19:54:00+00:00","fin":"2026-10-25T21:07:17+00:00"},{"nombre":"Personaje del taller en el combate: los dos luchadores con su ropa por capas (la armadura del duelo pasa a ser gambesón y cota del taller), con las animaciones que hay y las heridas pintadas como ahora","estado":"hecho","inicio":"2026-10-25T21:20:16+00:00","fin":"2026-10-25T22:52:11+00:00"},{"nombre":"Demo única: una página con menú (Construir, Duelo, Personaje); el personaje que eliges y su ropa se usan en todo; la web enlaza a ella y las versiones antiguas se quedan","estado":"hecho","inicio":"2026-10-25T23:20:38+00:00","fin":"2026-10-26T00:17:59+00:00"},{"nombre":"Rendimiento de la demo única: medir fotogramas, triángulos y memoria con la escena y varios personajes, dejar los números a la vista y pedir a valravnx los fps en su móvil","estado":"hecho","inicio":"2026-10-26T00:21:01+00:00","fin":"2026-10-26T01:28:05+00:00"},{"nombre":"En el móvil, ningún aviso ni panel tapa los menús: el aviso de la construcción tapa «Reiniciar» (más en inglés y en ruso) y las notas de la prueba de estilo tapan la barra de vistas cuando esta ocupa dos filas","estado":"hecho","inicio":"2026-10-26T02:20:16+00:00","fin":"2026-10-26T03:59:26+00:00"},{"nombre":"Revisión completa y publicación","estado":"hecho","inicio":"2026-10-26T04:19:56+00:00","fin":"2026-10-26T05:14:30+00:00"}]},{"id":"construccion","num":"1","nombre":"Construcción","jugable":"Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.","estado":"hecho","tareas":[{"nombre":"Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada","estado":"hecho"},{"nombre":"Piezas low-poly por código y personaje","estado":"hecho"},{"nombre":"Cámara libre y controles PC y táctil","estado":"hecho"},{"nombre":"v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente","estado":"hecho"},{"nombre":"v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)","estado":"hecho"}],"nota":"Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron)."},{"id":"estilo","num":"1e","nombre":"El estilo de la prueba v5 en todo","estado":"en_curso","jugable":"Todo lo que se ve (suelo, árboles, piezas de construcción, muebles y objetos) con el aspecto de la prueba de estilo v5 que aprobó valravnx, en la construcción, el duelo y la demo única.","nota":"Pedido de valravnx el 26 oct: solo se habían pasado al estilo los muros de troncos. Va antes que el resto del arte y que las piezas nuevas; reúne las tareas de estilo que estaban en el hito 1c.","tareas":[{"nombre":"Escena común igual que la prueba de estilo v5: suelo con hierba densa, flores, matorrales, piedras y tierra pisada, y los árboles de la v5 (hoy el suelo de la construcción y del duelo es un llano verde con matas sueltas)","estado":"hecho","inicio":"2026-10-26T14:34:09+00:00","fin":"2026-10-26T17:08:57+00:00"},{"nombre":"Estilo elegido en las piezas: cimientos de piedra y de troncos, suelos de troncos y de tablas, y escaleras de mano y de tablas, como la prueba de estilo v5","estado":"hecho","inicio":"2026-10-26T17:20:52+00:00","fin":"2026-10-26T18:16:06+00:00"},{"nombre":"Estilo elegido en las piezas: tejados de paja (con mechones) y de tablillas, y hastiales, como la prueba de estilo v5","estado":"hecho","inicio":"2026-10-26T18:20:41+00:00","fin":"2026-10-26T19:33:32+00:00"},{"nombre":"Estilo elegido en las piezas: puertas de varas y de tablas, cerca de varas, empalizada y su puerta, mojón, y las barandillas y el portillo nuevos, como la prueba de estilo v5","estado":"hecho","inicio":"2026-10-26T20:20:25+00:00","fin":"2026-10-26T21:47:46+00:00"},{"nombre":"Estilo elegido en los muebles: camas de paja y de madera, mesa, banco, taburete, arcón, barril, estantería, antorcha de pie, alfombra de piel y estandarte, como los enseres de la prueba de estilo v5","estado":"hecho","inicio":"2026-10-26T22:19:48+00:00","fin":"2026-10-26T23:42:06+00:00"},{"nombre":"Estilo elegido en todo lo demás que se ve en la construcción, el duelo y el visor: recursos del suelo, la pieza fantasma al construir, herramientas y armas en la mano y cualquier pieza que siga con el aspecto inicial, como la prueba de estilo v5","estado":"hecho","inicio":"2026-10-27T00:20:20+00:00","fin":"2026-10-27T02:51:05+00:00"},{"nombre":"Revisión completa y publicación: cada vista de cada prototipo y de la demo única, en PC y en móvil, comparada en capturas lado a lado con la prueba de estilo v5; lo que no se vea igual se arregla antes de cerrar el hito","estado":"pendiente"}]},{"id":"prueba-online","num":"1f","nombre":"Prueba online mínima","estado":"en_curso","jugable":"Dos jugadores en el mismo mundo desde dos dispositivos, construyendo y peleando, con el mundo guardado en un servidor sencillo; sin cuentas completas ni administración todavía.","nota":"Pedido de valravnx el 26 oct: lo multijugador es el mayor riesgo del proyecto y se comprueba pronto, justo después del estilo v5, antes de seguir ampliando piezas, ropa y sistemas.","tareas":[{"nombre":"Planificar el hito: leer lo que el GDD dice de servidor, cuentas y PvP, y desglosar la prueba online en tareas de una sesión","estado":"pendiente"},{"nombre":"Medir el servidor con 100 jugadores simulados (bots que andan, construyen y pelean): CPU, memoria y tráfico por jugador, para saber qué servidor hace falta y cuánto cuesta al mes","estado":"pendiente"},{"nombre":"Revisión completa y publicación","estado":"pendiente"}]},{"id":"arte","num":"1b","nombre":"Dirección de arte y personajes","estado":"en_curso","jugable":"Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.","nota":"Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.","tareas":[{"nombre":"Correr más natural (valravnx: «la animación de correr me parece fea y exagerada»): primero suavizar por código la del paquete (menos braceo, rebote e inclinación); después probar carreras de captura de movimiento libres para uso comercial (Rokoko o CMU) si valravnx las baja","estado":"hecho","inicio":"2026-10-26T05:09:48+01:00","fin":"2026-10-26T06:36:44+01:00"},{"nombre":"Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que valravnx elija","estado":"hecho","inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00"},{"nombre":"Rehacer las pruebas de estilo (revisión de valravnx: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio","estado":"hecho","inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00"},{"nombre":"Prueba de estilo v3, «maqueta en miniatura» (elegido por valravnx): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto","estado":"hecho","inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00"},{"nombre":"Prueba de estilo v4, «realismo en miniatura» (pedido por valravnx): la v3 con texturas por código y el mundo sin recortar","estado":"hecho","inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00"},{"nombre":"Prueba de estilo v5: árboles rehechos (valravnx: «los árboles fatal, se ven como rayajos raros; la casa es "titulo":"Hito 1: construcción (v1 a v3)","hito":"construccion","hecho":["Rejilla anclada a la primera pieza, módulo de 2 m × 2,5 m, apoyos y reparto de carga.","Desmontaje en cascada con 75% de recuperación, bloqueado si sobrecarga otra pieza.","v2: los muros se rellenan hasta el tejado y los tejados seguidos forman una pendiente continua.","v3: muros de 10 hiladas de 25 cm, todos exactos a 2,5 m."],"pruebas":"Lógica 35/35, modelos 21/21, navegador PC y móvil correctos.","capturas":"capturas/construccion-v3","estado":"ok"},{"inicio":"2026-10-24T16:45:00+02:00","fin":"2026-10-24T17:25:00+02:00","aprox":true,"titulo":"Campo de pruebas de combate v1 y v2","hito":"duelo","hecho":["v1: cinco líneas de golpe, guardias, heridas por zona sin barras de vida, arco con balística.","Comparado con juegos de esgrima de referencia: la v1 era poco intuitiva (arrastrar para golpear, elegir lado al parar, cámara a su aire).","v2: rosa de golpes sobre el rival, parada sin lado + parada perfecta + golpe maestro, fintas, aliento.","Movimiento encarado (los lados rodean al rival), cámara con margen, pausa de impacto, chispas, sangre, sonido y estela.","Dificultad = ritmo + ayudas: aprendiz (lento, con avisos), normal, realista (sin avisos)."],"pruebas":"Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.","capturas":"capturas/combate-v2","estado":"ok"},{"inicio":"2026-10-24T17:20:03+00:00","fin":"2026-10-24T17:44:04+00:00","titulo":"Sesión duplicada: arreglo del arco hecho dos veces","hito":"duelo","hecho":["Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen."],"pruebas":"No aplica (trabajo descartado).","capturas":"","estado":"fallo"},{"inicio":"2026-10-24T18:04:00+02:00","fin":"2026-10-24T18:19:37+02:00","titulo":"Infraestructura: repositorio, web de progreso y trabajo automático","hito":"infra","hecho":["Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso."],"pruebas":"Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:36:00+02:00","fin":"2026-10-24T18:37:25+02:00","titulo":"Alcance del proyecto: arte y seguridad al roadmap","hito":"infra","hecho":["Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil."],"pruebas":"Web regenerada y probada en PC y móvil.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00","titulo":"Hito 1b: tres pruebas de estilo","hito":"arte","hecho":["Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil."],"pruebas":"Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v1","estado":"ok"},{"inicio":"2026-10-24T19:13:50+02:00","fin":"2026-10-24T19:23:09+02:00","titulo":"Hito 5: arreglo del arco (combate v3)","hito":"duelo","hecho":["Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.","capturas":"capturas/combate-v3","estado":"ok"},{"inicio":"2026-10-24T19:23:09+02:00","fin":"2026-10-24T19:24:41+02:00","titulo":"Revisión de las pruebas de estilo: investigación y replanteo","hito":"arte","hecho":["valravnx: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido."],"pruebas":"Sin cambios de código en esta parte.","capturas":null,"estado":"ok","aprox":true},{"inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00","titulo":"Hito 1b: prueba de estilo v2, ligera y estilizada","hito":"arte","hecho":["Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v2","estado":"ok"},{"inicio":"2026-10-24T20:20:27+02:00","fin":"2026-10-24T20:36:27+02:00","titulo":"Hito 5: escudo provisional (combate v4)","hito":"duelo","hecho":["Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.","Los guardados de opciones anteriores siguen valiendo: si no tienen arma del rival, se usa «Como la tuya»."],"pruebas":"Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos","capturas":"capturas/combate-v4","estado":"ok"},{"inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00","titulo":"Hito 1b: prueba de estilo v3, maqueta en miniatura","hito":"arte","hecho":["Tu revisión de la v2: recordaba a juegos gratuitos de motor genérico y las piedras del cimiento se veían sueltas. Elegiste «maqueta en miniatura».","La escena es un pedazo de tierra redondo con el corte de tierra visto, sobre fondo liso con degradado. Cámara de teleobjetivo y desenfoque arriba y abajo (se puede quitar).","Formas redondeadas: cantos suaves, troncos con puntas abombadas, tejado de paja en tres hiladas gruesas, copas redondas, matorrales y flores de colores apagados.","Zócalo de piedra continuo: núcleo de mortero con dos hiladas de piedras bien juntas.","Luz suave, sombras de bordes blandos y sombras de contacto horneadas en el suelo.","Medido: 47 mil triángulos (con la pasada de sombra) y 6 dibujados. Subido el presupuesto de 30 a 50 mil por los cantos redondeados; los dibujados bajan de 12 a 6.","Decidido por ti en el chat: los personajes se hacen por código. La tarea del personaje pasa a pendiente.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v3 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v3","estado":"ok"},{"inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00","titulo":"Hito 1b: prueba de estilo v4, realismo en miniatura","hito":"arte","hecho":["Tu revisión de la v3: te gusta, pero el mundo no estará recortado; pediste probar el «realismo en miniatura» con algo de textura.","Texturas hechas por código, en gris, que dan detalle y relieve: veta, anillos de los cortes, paja en hebras, piedra, corteza, hojas y suelo. El color sigue saliendo de la paleta.","Las texturas van a escala real: la veta sigue el largo de cada tronco y tabla, la paja baja por la pendiente y los anillos se centran en cada corte.","El suelo sigue con lomas hasta el horizonte, con bosque lejano instanciado y niebla del color del cielo.","Medido: 47 mil triángulos y 21 dibujados (una malla por textura), dentro del presupuesto de 50 mil y 60.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v4 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v4","estado":"ok"},{"inicio":"2026-10-24T20:53:26+02:00","fin":"2026-10-24T21:01:31+02:00","titulo":"Hito 1b: prueba de estilo v5, árboles rehechos","hito":"arte","hecho":["Tu revisión de la v4: la casa bien, los árboles fatal, con rayajos raros.","Causa: la textura de hojas se proyectaba cara a cara sobre las copas y salían trazos cortados en cada cara.","Copas nuevas: bolas suaves con bultos, como racimos, más claras arriba y oscuras por dentro, con una textura de manchas redondas que envuelve la copa sin costuras.","Pinos: cada piso acaba en puntas caídas, como ramas, en vez de un cono liso.","Medido: 49 mil triángulos y 21 dibujados (algo menos de hierba para no pasar de 50 mil)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v5 y web: todo correcto.","capturas":"capturas/estilo-v5","estado":"ok"},{"inicio":"2026-10-24T21:13:13+02:00","fin":"2026-10-24T21:20:45+02:00","titulo":"Hito 1b: personaje por código (avance, sin publicar)","hito":"arte","hecho":["Cuerpo hecho por secciones con perfil real (cintura, pecho, muslo, rodilla, pantorrilla, deltoides, codo) en una sola malla con esqueleto de 17 huesos: anda y respira sin abrirse en las articulaciones.","Manos con palma, cuatro dedos recogidos y pulgar; zapatos de una pieza; túnica con pliegues en la falda que sigue a los muslos al andar; camisa en cuello y puños; cinto con hebilla; vendas en las piernas.","Cabeza: esfera moldeada (mandíbula, mentón, ceja, cuencas, pómulos, nariz, boca) con pelo y barba como abultamiento de la misma malla. No da el nivel: de cerca la cara se ve blanda y rara. No se publica.","Siguiente paso propuesto: hacer la cabeza a partir de una malla base con planos marcados (frente, cuencas, pómulos, nariz, mandíbula), escrita como datos en el código, en vez de deformar una esfera.","Personaje: 5,9 mil triángulos."],"pruebas":"Sin prueba de navegador propia todavía (no publicado). Lo demás sin cambios.","capturas":null,"estado":"fallo"},{"inicio":"2026-10-24T21:19:25+02:00","fin":"2026-10-24T21:41:55+02:00","titulo":"Hito 1b: personaje nuevo por código (prueba de estilo v6)","hito":"arte","hecho":["Personaje hecho todo por código, como decidiste: una sola malla continua, sin piezas sueltas. El cuerpo es una suma suave de formas (cráneo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas y pies) que se convierte en malla.","Más detalle donde se ve: la rejilla es más fina en la cara y las manos. Medido: 9.836 triángulos y 5.611 vértices.","Esqueleto de 17 huesos con pesos calculados por cercanía a las formas de cada hueso. Dos animaciones por código: quieto (respira y se balancea) y andar (va y viene por el camino).","Hombre adulto de 1,72 m con barba corta; ropa base pintada en la malla (camisa de lino, cinturón con relieve, calzas y zapatos), provisional hasta la tarea de ropa por capas.","Oclusión ambiental horneada en los vértices y ojos con brillo. Vistas nuevas «Personaje» y «Cara» que le siguen, y botón Quieto/Andando (se recuerda al recargar).","El presupuesto de la escena sube de 50 mil a 72 mil triángulos (con el personaje y su sombra son 68,8 mil). Anotado en el registro.","Se ve tosco de cerca: pelo como casquete liso, cara aún simple y bordes de color algo borrosos en el cuello de la camisa y la barba. Queda preguntado en las decisiones.","No comprobado: los fps en un móvil de verdad (aquí, sin tarjeta gráfica, no sirve medirlos).","Coincidió con otra sesión (21:13–21:20) que avanzó el personaje por otro camino (src/personaje/, por secciones, sin publicar). Se conservan las dos; esta es la que se publica en la prueba de estilo v6."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v6 (con pruebas nuevas del personaje; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v6","estado":"ok"},{"inicio":"2026-10-24T22:05:00+02:00","fin":"2026-10-24T22:40:12+02:00","aprox":true,"titulo":"Hito 1b: personaje esculpido por código (v1)","hito":"arte","hecho":["Tu revisión: el avance anterior no valía; pediste investigar y hacerlo de la forma óptima, costase lo que costase.","Investigado: la técnica que da criaturas orgánicas solo con código es esculpir con campos de distancia (formas simples fundidas con mezcla suave sobre el esqueleto), pasar a malla fina, simplificar y pesar al esqueleto por cercanía. Es lo que usa un proyecto abierto de animales procedurales para three.js.","Hecho así: unas 120 formas (cráneo, frente, cejas, pómulos, maxilar, mandíbula, mentón, nariz con aletas y fosas, labios, cuencas con párpados, orejas; músculos del tronco, brazos y piernas; manos con dedos). Ojos aparte con iris y pupila.","Ropa, pelo y barba como capas que siguen al cuerpo (camisa, túnica con pliegues, cinto, calzas, vendas, zapatos). La falda sigue a los muslos al andar.","Horneado al construir (herramientas/hornear_personaje.mjs): rejilla de 3 mm, superficie por surface nets, simplificación con meshoptimizer (la cabeza con más presupuesto), normales y oclusión sacadas del campo. Tarda 95 s; en el juego carga al instante.","Medido: cerca 22,8 mil triángulos y lejos 4 mil; 17 huesos.","Pendiente de pulir: el pelo es algo áspero, la barba tiene el borde irregular, un bulto en el dorso de la muñeca y el cuello de la camisa queda grueso. No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69, personaje horneado 11/11 (nuevas, fallan con MUTAR=1); navegador construcción, combate, estilo, personaje (nueva, falla con MUTAR=1) y web: todo correcto.","capturas":"capturas/personaje-v1","estado":"ok"},{"inicio":"2026-10-24T22:06:00+02:00","fin":"2026-10-24T22:11:29+02:00","titulo":"Web de progreso en inglés","hito":"infra","hecho":["Selector ES / EN arriba a la derecha; se recuerda al volver y se puede abrir directamente con ?lang=en.","Traducidos al inglés los 206 textos del roadmap, el diario, las decisiones y las notas de versión, y todos los textos fijos de la web.","Las traducciones viven en proyecto/idiomas/en.json; la web no se genera si falta alguna, así que todo lo nuevo saldrá también en inglés.","Preparado para el ruso: basta con añadir proyecto/idiomas/ru.json y sus textos fijos.","Nuevas tareas: documentos de diseño en inglés y el juego en inglés."],"pruebas":"Web en PC y móvil, en español y en inglés (botón, recargar, ?lang=en): todo correcto; quitar una traducción a propósito hace fallar la generación de la web.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T22:16:00+02:00","fin":"2026-10-24T22:32:23+02:00","titulo":"Construcción v4: madera más resistente y casa de dos plantas","hito":"construccion-mas","hecho":["Causa del tejado que no entraba en las esquinas: el cimiento de troncos de cada esquina carga con dos muros por planta y con la segunda planta se pasaba (1320 kg de 1200).","Más aguante en todas las piezas de madera y piedra. Una casa de troncos de 2 plantas con tejado ya entra entera y ninguna pieza pasa del 75%.","Siguen existiendo límites: 3 plantas piden cimiento de piedra y el zarzo no da para dos plantas.","Vano de una casilla: un suelo en alto o un tramo de tejado sin muros debajo se apoya en el de al lado. Hasta 4×4 casillas no hacen falta vigas por dentro; en 5×5 el centro sí las pide.","Los valores nuevos están en Decisiones dentro del juego, como provisionales."],"pruebas":"Construcción 46/46 (11 nuevas con casas de 2 y 3 plantas; fallan con MUTAR=1), modelos 21/21, combate 69/69; navegador de construcción (casa de 4×4 de dos plantas con tejado a dos aguas), combate, estilo y web: todo correcto.","capturas":"capturas/construccion-v4","estado":"ok"},{"inicio":"2026-10-24T22:19:24+02:00","fin":"2026-10-24T22:43:43+02:00","titulo":"Documentos de diseño en inglés","hito":"infra","hecho":["GDD, sistemas y análisis traducidos enteros al inglés, en diseno/en/, con la misma estructura que el original.","Cada documento tiene arriba un selector ES · EN; la web en inglés enlaza directamente a la versión inglesa.","Cada traducción guarda la huella del original en español: si el español cambia y no se vuelve a traducir, la web no se genera y dice qué archivo falta.","Decisión provisional: los documentos traducidos son archivos aparte (no van en en.json), porque son textos largos con tablas."],"pruebas":"Todas correctas: construcción 46/46 (ya con la v4 de otra sesión), modelos 21/21, combate 69/69, navegador de construcción, combate, estilo y web (PC y móvil, documentos en los dos idiomas). Romper a propósito los enlaces o la traducción hace fallar la prueba de la web; cambiar el español sin retraducir hace fallar la generación.","capturas":"capturas/documentos-en","estado":"ok"},{"inicio":"2026-10-24T23:05:00+02:00","fin":"2026-10-24T23:31:24+02:00","titulo":"Personaje v2: bases libres ya hechas en lugar de esculpirlo por código","hito":"arte","hecho":["Se abandona el personaje esculpido por código (daba grima). Investigado cómo lo resuelven otros proyectos de navegador: parten de bases de personajes ya hechas y libres.","Elegidos los paquetes CC0 de Quaternius (se pueden usar y vender sin pagar ni citar): cuerpos base, ropa modular por piezas sobre el mismo esqueleto, y librería de animaciones. Licencias y procedencia junto a los modelos.","Personaje montado con la cabeza de la base (solo cabeza y cuello, el resto lo tapa la ropa), la ropa, el pelo y la barba, atados al mismo esqueleto de 65 huesos. La ropa y las armaduras futuras irán por capas sobre ese esqueleto.","Personalización: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo (6), tono de piel (4) y barba. Animaciones del paquete: quieto, andar, talar, en guardia, golpe y cargar.","Modelos preparados para el navegador: texturas reducidas y un archivo por pieza. Un personaje carga unos 4 MB la primera vez más 4,4 MB de animaciones compartidas.","No comprobado: los fps en un móvil de verdad (aquí no hay tarjeta gráfica). Un personaje tiene entre 20 y 33 mil triángulos según la ropa."],"pruebas":"Construcción 46/46, modelos 21/21, combate 69/69; navegador: construcción, combate, estilo, personaje v2 (vistas, animación, tres variantes y botones, PC y móvil; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/personaje-v2","estado":"ok"},{"inicio":"2026-10-24T23:38:00+02:00","fin":"2026-10-24T23:49:54+02:00","titulo":"Personaje v3: más ligero en el móvil","hito":"arte","hecho":["valravnx: en su móvil el personaje v2 iba a 10 fps y el traje de explorador es demasiado de fantasía.","En pantallas táctiles empieza en calidad ligera: material sencillo con el color, sin relieve ni brillo. Resolución de partida 1× y puede bajar hasta 0,5×.","La ropa, el pelo y la barba comparten un solo esqueleto; antes cada malla calculaba el suyo en cada fotograma.","Interruptores de prueba (calidad, sombras, cabaña y suelo) para ver en el móvil qué pesa, con los fps arriba. En el móvil el panel empieza cerrado para no tapar al personaje.","Quitado el traje de explorador de las opciones.","No comprobado: si con esto llega a fps buenos en el móvil de valravnx. Aquí no hay tarjeta gráfica y las medidas no se parecen a un móvil."],"pruebas":"Personaje en navegador PC y móvil (vistas, animación, variantes, calidad ligera, esqueleto compartido, interruptores): todo correcto.","capturas":"capturas/personaje-v3","estado":"ok"},{"inicio":"2026-10-24T23:58:00+02:00","fin":"2026-10-25T00:07:59+02:00","titulo":"Personaje v4 y primera prueba del taller propio con MakeHuman","hito":"arte","hecho":["Malentendido corregido: «me va de 10» significaba que iba perfecto, no a 10 fps. Vuelve la calidad alta por defecto también en el móvil; la ligera solo si la eliges tú.","Taller propio montado: Blender sin pantalla (instalado con pip) con MakeHuman (MPFB2) desde su repositorio. Crea humanos por código con edad, sexo, músculo, peso, altura y rasgos de la cara, y les pone esqueleto para juegos.","Primera prueba: tres personas distintas (hombre de mediana edad, mujer joven, anciano) fotografiadas en arcilla. Proporciones y caras anatómicas, y la edad se nota.","Lo que falta para usarlo: ojos, pieles, pelo, cejas y barbas vienen en paquetes libres de MakeHuman que solo se bajan de su web (los tiene que bajar valravnx). Su ropa es moderna, no medieval. Cada cuerpo tiene 26,8 mil triángulos y habría que reducirlo para el móvil."],"pruebas":"Personaje v4 en navegador PC y móvil: todo correcto. Taller: tres humanos creados y exportables sin errores.","capturas":"capturas/taller-makehuman","estado":"ok"},{"inicio":"2026-10-25T00:13:00+02:00","fin":"2026-10-25T01:12:00+02:00","titulo":"Taller propio: vestir y acabar por código un humano de MakeHuman","hito":"arte","hecho":["Ropa y acabado hechos por código encima del cuerpo de MakeHuman, sin paquetes de fuera: túnica, calzas, zapatos, cinturón, vestido largo y cofia con toca de lino.","Cada prenda sale de las mallas de ayuda que trae la propia base (malla ceñida y falda), así que hereda los pesos de los huesos y se moverá con el esqueleto sin pintar nada a mano.","Piel, cejas, labios, rojeces, pelo corto y barba pintados en texturas calculadas punto a punto; los bordes del pelo, la barba, el escote y las mangas salen suaves, sin escalones.","Se quita la piel que tapa la ropa: unos 19 mil triángulos por personaje (la base sola tenía 26,8 mil).","Comprobado también en three.js, con la luz y la cabaña de la prueba de estilo: se carga y se ve igual que en Blender.","Falta: que se mueva (el esqueleto de MakeHuman está en otra postura que las animaciones de Quaternius y hay que pasarlas de uno a otro), caras más finas y más tipos de pelo."],"pruebas":"Prueba de taller, no publicada como versión jugable: dos personajes exportados sin errores, vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.","capturas":"capturas/taller-vestir","estado":"ok"},{"inicio":"2026-10-25T01:20:28+02:00","fin":"2026-10-25T02:03:30+02:00","titulo":"Juego en inglés: construcción y combate con botón ES/EN","hito":"infra","hecho":["Módulo de idioma común (src/idioma.js): el texto en español es la clave y src/idiomas/en.json da la traducción; el ruso está preparado (ru.json vacío) y se ofrece en cuanto tenga textos.","Botón ES/EN arriba a la derecha en la construcción (v5) y en el combate (v5). Recuerda el idioma con la misma clave que la web: si eliges inglés en la web, el juego sale en inglés. Sin elección, manda el idioma del navegador.","Traducidos todos los textos: botones, ayuda, avisos, motivos de la lógica, piezas, materiales, armas, heridas, registro de combate, pantalla final y decisiones (unos 290).","Cambiar de idioma recarga la página sin perder la partida guardada.","En el móvil solo se ve el botón del otro idioma, para que el menú no crezca; el panel de opciones del combate baja para no tapar el menú.","Pruebas nuevas: prueba_idiomas.mjs (todo texto del código tiene traducción y las mismas variables) y prueba_idioma_navegador.py (PC y móvil, sin textos sin traducir ni palabras en español a la vista, el botón cambia, recuerda y no borra la partida). Las dos se rompieron a propósito una vez (MUTAR=1) y fallaron.","Decisión provisional: las pruebas de estilo y el personaje quedan en español hasta que valravnx revise el personaje (ninguna otra sesión toca su código); queda como tarea en espera.","Capturas de la construcción en capturas/construccion-v5."],"pruebas":"Todas correctas (probar_todo.sh): lógica 46/46, modelos 21/21, combate 69/69, personaje horneado, textos traducidos 231/231, navegador construcción, combate, estilo, personaje, juego en inglés (PC y móvil) y web. Capturas en inglés miradas en PC y móvil. No comprobado: en un móvil real.","capturas":"capturas/combate-v5","estado":"ok"},{"inicio":"2026-10-25T02:20:44+01:00","fin":"2026-10-25T02:48:34+01:00","titulo":"Recursos de personaje v2: comprimidos y con las 39 animaciones extra","hito":"arte","hecho":["Recursos v2 del personaje: los mismos modelos de la v1, con la geometría y las animaciones comprimidas (meshopt) y las texturas en WebP. La v1 publicada no se toca.","Un personaje (hombre campesino con pelo, barba y animaciones) baja 1,7 MB en vez de 8,1 MB; las animaciones, de 4,4 MB a 0,7 MB.","Las posiciones de los vértices no se comprimen: así la ropa, el pelo y la barba siguen compartiendo un solo esqueleto, como en la v3 del personaje.","El cargador de personajes abre los archivos comprimidos y, si se le pide, las 39 animaciones extra (vendarse, arco, minar, campo, pesca, espada ligera y pesada, escudo, pasos en todas direcciones, trepar, tumbarse…), cada una con un nombre en español.","Cinco extra se llaman igual que una básica (bloqueo, escudo, comer, brazos cruzados, empujón): la básica se queda como estaba y la extra va aparte, para no cambiar nada sin querer.","Prueba nueva en navegador: la v2 se ve igual que la v1 (diferencia media menor de 1 sobre 255), mismos triángulos y esqueletos, y cada animación extra mueve el cuerpo. Hoja con las 39 poses en las capturas.","No se ha cambiado el prototipo del personaje (REVISION.md pide que solo lo toque la sesión del chat hasta que valravnx lo revise): pasarlo a la v2 y añadir el selector de animaciones queda como tarea en espera.","No comprobado: cuánto tarda en bajar en un móvil real."],"pruebas":"Todas correctas: construcción 46/46, modelos 21/21, combate 69/69, personaje horneado 11/11, textos traducidos, navegador de construcción, combate, estilo, personaje, recursos v2 (PC y móvil), inglés y web. La prueba de recursos falla a propósito con MUTAR=1 (12 fallos).","capturas":"capturas/recursos-personaje-v2","estado":"ok"},{"inicio":"2026-10-25T05:42:02+01:00","fin":"2026-10-25T06:35:50+01:00","titulo":"Taller MakeHuman: barba pintada, labios más finos y fotos de la cabeza entera","hito":"arte","hecho":["La barba ya no es una cáscara encima de la cara: va pintada en la piel, con bordes difusos y pelillos, y el bigote baja por las comisuras hasta unirse a la barba.","Labios más finos y menos salidos (altura, profundidad y anchura de la boca). Medido: el ajuste de «volumen» de MakeHuman casi no cambia nada; lo que sirve es la altura y la profundidad.","Fallo de las fotos corregido (lo vio valravnx): el encuadre de la cara cortaba la barbilla. Ahora sale la cabeza entera, del pelo al cuello, en Blender y en three.js.","Con el encuadre nuevo se veían dos fallos que antes quedaban fuera, ya arreglados: un hueco oscuro en el escote de la túnica y el borde dentado de la toca."],"pruebas":"Prueba de taller, no publicada como versión jugable: dos personajes exportados y vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.","capturas":"capturas/taller-vestir-2","estado":"ok"},{"inicio":"2026-10-25T06:39:00+01:00","fin":"2026-10-25T07:16:00+01:00","titulo":"Personaje v5: el personaje del taller propio ya se mueve","hito":"arte","hecho":["Las animaciones de Quaternius se pasan al esqueleto de MakeHuman con un programa propio: el reposo de MakeHuman (brazos en «A») se lleva a la postura del original y en cada fotograma se copia el giro de cada hueso respecto a su reposo; la pelvis copia también los botes, escalados por la altura.","Probado con las nueve animaciones que usa el juego: quieto, andar, correr, talar, en guardia, golpe, parar, andar cargando y recoger. Los dos personajes las hacen bien, también la mujer con el vestido.","Personaje v5 publicado: en el visor hay una opción nueva, «Base del personaje», para elegir entre el paquete de Quaternius y el taller propio y compararlos.","Cada personaje del taller pesa unos 530 KB con ropa, texturas y animaciones (comprimido con WebP y meshopt) y tiene unos 19 mil triángulos.","Pruebas nuevas del taller en el visor: carga, se ve el cuerpo y la cara, y al andar se mueven piernas y brazos. Rotas a propósito: fallan como deben."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v5","estado":"ok"},{"inicio":"2026-10-25T07:37:00+01:00","fin":"2026-10-25T08:14:46+01:00","titulo":"Personaje v6: arreglada la ropa del taller vista del revés","hito":"arte","hecho":["Fallo que vio valravnx en la v5: en calidad alta la túnica, el vestido, el pelo y la cofia del taller propio se veían del revés, con manchas, y el pelo desaparecía.","Causa: el cargador de modelos apaga la escritura de profundidad en los materiales con transparencia; al pasarlos a recorte no se volvía a encender, y la piel se pintaba encima. En calidad ligera no pasaba, y las pruebas solo miraban esa.","Arreglado y con prueba nueva: en calidad alta todo el personaje del taller tiene que escribir profundidad. Rota a propósito: falla como debe.","Revisadas las capturas de los dos personajes en calidad alta, en PC y en móvil."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.","capturas":"capturas/personaje-v6","estado":"ok"},{"inicio":"2026-10-25T08:22:00+01:00","fin":"2026-10-25T09:07:48+01:00","titulo":"Personaje v7: postura y pecho del taller propio","hito":"arte","hecho":["valravnx: el hombre marcaba pecho, el cuerpo iba doblado hacia delante y los hombros muy para atrás.","Causa de la postura: las animaciones del paquete llevan el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atrás, a juego con sus muñecos de cabeza grande; además, al igualar la pelvis y las clavículas a las del paquete, la cadera se giraba 35° y los hombros se iban atrás.","Arreglo: solo los brazos se igualan al paquete; la inclinación del tronco, el cuello y las clavículas se mide en la animación de estar quieto y se quita en todas (queda un 30 %); y los brazos se giran desde el hombro para colgar rectos.","La túnica del hombre se alisa en el pecho para que caiga como tela, sin meterse dentro del cuerpo.","Recursos nuevos en recursos/personajes/taller-v2 (los de la v1 publicada no se tocan).","Prueba nueva de postura: cabeza y hombros sobre la pelvis y brazos sin irse atrás. Con los modelos de la v6 falla, como debe."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.","capturas":"capturas/personaje-v7","estado":"ok"},{"inicio":"2026-10-25T09:15:48+01:00","fin":"2026-10-25T09:15:48+01:00","titulo":"Decisión de valravnx: el taller propio es la base de los personajes","hito":"arte","hecho":["valravnx, tras ver el personaje v7: «lo veo bien, sigue», y elige el taller propio (cuerpo de MakeHuman con ropa hecha por código) como base de los personajes del juego. El paquete de Quaternius queda solo para comparar y como fuente de animaciones.","Se cierran las decisiones del personaje y de la ropa: la ropa histórica se hace por código en el taller; no hace falta comprar paquetes ni encargarla.","Las tareas del hito de arte se rehacen para el taller, de una sesión cada una: ropa por capas (camisa y gambesón; cota de malla y sobreveste; capa, calzado y tocados), personalización, más peinados y barbas, las 39 animaciones extra, ropa fabricable y heridas visibles."],"pruebas":"Sin cambios de código.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:15:48+01:00","fin":"2026-10-25T09:54:03+01:00","titulo":"Personaje v8: ropa por capas en el taller propio","hito":"arte","hecho":["Primera tanda de ropa por capas hecha por código sobre el cuerpo de MakeHuman: camisa de lino (en la mujer, larga hasta los tobillos), calzas y zapatos siempre puestos; encima túnica (hombre) o vestido (mujer); y sobre todo, el gambesón acolchado, con los canales cosidos pintados en vertical en el cuerpo y en anillos en las mangas.","Cada capa va algo más separada de la piel que la de debajo, y lo que queda tapado del todo no se dibuja: el cuerpo de una prenda se esconde si lleva otra encima y su falda solo asoma si es más larga. Así no se atraviesan al moverse y se ahorran triángulos (unos 16 a 20 mil por personaje según lo que lleve).","Un cinturón por capa; solo se ve el de la capa de más fuera.","En el visor, botones «Túnica», «Vestido» y «Gambesón» para poner y quitar capas. El taller propio sale por defecto.","Arreglos vistos en las capturas: las calzas asomaban por la camisa y el vestido por la tripa del gambesón; ya no.","Pruebas nuevas: el gambesón se pone encima y tapa el cuerpo de la prenda de debajo, y al quitarlo vuelve como estaba; el taller sale por defecto. Rotas a propósito: fallan."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v8","estado":"ok"},{"inicio":"2026-10-25T09:39:58+01:00","fin":"2026-10-25T09:42:16+01:00","titulo":"Hito 1c: planificación de las piezas nuevas","hito":"construccion-mas","hecho":["valravnx, por el chat: «puedes hacer, están haciendo los modelados de ropa; haz algo no relacionado». Elige planificar el hito de construcción, que no toca el personaje. Se hace aunque el hito de arte bloquee empezar hitos nuevos, porque lo pide él.","Comparadas las piezas del documento de sistemas con las que ya hay en el juego. Faltan: escalera de tablas, contraventana, trampilla, tejado de teja, remate de tejado, chimenea, adarve, puente de troncos y parte de la decoración.","Hito desglosado en 9 tareas de una sesión: escalera de tablas, barandillas y vallas, contraventana y trampilla, tejado de teja, remate de tejado, chimenea, adarve, decoración que falta y revisión final.","Los puentes de troncos se dejan para el hito Mundo, porque necesitan agua en el mapa.","Esta sesión no toca proyecto/sesion.json, que es de la sesión de la ropa."],"pruebas":"Sin cambios de código. Web reconstruida sin errores.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:58:47+01:00","fin":"2026-10-25T09:58:47+01:00","titulo":"Decisiones de valravnx: estilo, cámara táctil, curación y fuego amigo","hito":"arte","hecho":["Estilo del mundo: el «realismo en miniatura» de la prueba de estilo v5 es la base. Se desbloquean terreno, hierba, árboles, más detalle en las piezas de construcción y el rendimiento en el móvil.","Cámara táctil en el combate: arrastrar un dedo por zona libre gira la cámara, tocar sin arrastrar sigue golpeando, y con el arco la cámara sigue sola a donde apuntas.","Curación: base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso); en pleno combate se puede, pero lento y quedando vendido.","Fuego amigo: sigue al PvP, como dice el diseño (PvP activo, desactivado dentro de la familia): a alguien de tu familia un tajo no le hace nada; a cualquier otro le hiere como un golpe normal.","Ya no queda ninguna decisión pendiente: todas las tareas en espera pasan a pendientes."],"pruebas":"Sin cambios de código.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:59:09+01:00","fin":"2026-10-25T10:57:23+01:00","titulo":"Personaje v9: cota de malla y sobreveste","hito":"arte","hecho":["Cota de malla como capa, sobre el gambesón: hasta la rodilla, mangas hasta medio antebrazo (asoma el gambesón por debajo) y anillas pintadas por código en filas cruzadas, del mismo tamaño en el cuerpo, las mangas y la falda.","El metal va a medias: sin reflejos del entorno, el metal puro salía casi negro en el juego.","Sobreveste sin mangas de lana teñida, por encima de todo, hasta media pierna (en la mujer, hasta los tobillos).","Cada prenda va ahora partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota y del gambesón; las mangas de debajo solo se dibujan si asoman.","Arreglos vistos en las capturas: con la cota se abrían agujeros en lo alto de los hombros (el corte del cuello llegaba hasta ahí) y quedaban huecos entre el cuerpo y las mangas; ya no.","Prueba nueva: con la sobreveste se ven las mangas y el cuello de la cota. Rota a propósito: falla."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. Unos 1,5 MB por personaje con todas las prendas. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v9","estado":"ok"},{"inicio":"2026-10-25T10:19:54+01:00","fin":"2026-10-25T10:48:43+01:00","titulo":"Hito 1c: escalera de tablas","hito":"construccion-mas","hecho":["Pieza nueva «Escalera de tablas» (6 tablas y 6 clavos, 100 kg, en Acceso): ocupa una casilla y sube una planta.","Se sube y se baja andando, sin botón: se entra por el lado bajo y se sale arriba a la casilla de al lado; gira con R hacia dónde sube.","Encima queda el hueco abierto: no deja poner suelo sobre la escalera, ni la escalera bajo un suelo; en la última planta no cabe.","Se apoya en el cimiento o suelo de su casilla (o en la tierra en la planta baja) y suma su peso; si se quita ese suelo, cae.","Por debajo del tramo alto se puede pasar sin subir. Por el hueco se puede caer a la escalera desde arriba: las barandillas llegan en la tarea siguiente (anotado en el registro de decisiones).","Construcción v6 publicada."],"pruebas":"Todas con herramientas/probar_todo.sh: lógica de construcción 63/63 (17 nuevas de la escalera), modelos 21/21, combate 69/69, personaje 11/11, textos traducidos, y navegador de construcción (subir y bajar andando, hueco, pasar por debajo), combate, estilo, personaje, recursos, inglés y web correctos. Las pruebas nuevas se rompieron a propósito una vez (sin hueco, sin giro, sin subir andando) y fallaron.","capturas":"capturas/construccion-v6","estado":"ok"},{"inicio":"2026-10-25T11:10:00+01:00","fin":"2026-10-25T11:15:40+01:00","titulo":"Análisis del estado del proyecto, GDD v0.7 y plan para unificar las demos","hito":"infra","hecho":["Análisis pedido por valravnx: lo hecho frente al GDD, lo que falta y los problemas del desarrollo.","Problemas encontrados: las acciones aún no llevan autor (lo pide CLAUDE.md para el servidor); cuatro prototipos separados (construcción y combate siguen con muñecos hechos a mano y sin el estilo elegido); los golpes por dirección del combate no tienen animaciones; falta medir el rendimiento con mucha gente y en un móvil de verdad; el mundo grande por trozos y el servidor no están empezados; la ropa por capas aún no protege ni abriga; el GDD se había quedado atrás; el taller depende de versiones sin fijar; choques al fusionar el diario entre sesiones; código muerto del personaje esculpido; el ruso está sin empezar.","Hito nuevo 0b «Bases técnicas»: acciones con autor y registro, quitar código muerto, taller con versiones fijadas y diario sin choques. Va primero.","Hito nuevo 1d «Una sola demo»: escena común con el estilo v5, personaje del taller en la construcción y en el combate, una página con menú y medida de rendimiento. Va antes que el resto del arte y de las piezas de construcción.","Tareas nuevas en otros hitos: ruso (infraestructura), prueba de golpes en cinco direcciones con el personaje nuevo (duelo), niveles de detalle del personaje y terreno por trozos (arte), datos de cada prenda (equipo) y comparar alojamientos para el servidor (servidor).","GDD v0.7: estilo y personajes decididos, ropa por capas personalizable, combate con la rosa y las decisiones de hoy (cámara táctil, curación, fuego amigo), acciones con autor, escena común, mundo por trozos y los hitos 0b, 1b, 1c, 1d y 11b. También en inglés."],"pruebas":"Web regenerada y comprobada (enlaces, inglés y documentos). Sin cambios de código del juego.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T10:19:28+00:00","fin":"2026-10-25T11:09:16+00:00","titulo":"Prueba de estilo y visor de personaje en inglés","hito":"infra","hecho":["La prueba de estilo (v7) y el visor de personaje (v10) usan el mismo módulo de idioma que la construcción y el combate: botón ES/EN arriba, que recuerda el idioma elegido (también el de la web).","Traducidos al inglés todos sus textos: botones, vistas, opciones del personaje (base, cuerpo, capas de ropa, pelo, piel, barba, calidad, animación), la medida de fps y las notas de cada versión (99 textos nuevos).","Las opciones del visor de personaje pasan a src/personaje/textos.js para que la prueba de idiomas las lea sin navegador.","Prueba de idiomas ampliada a estilo y personaje; la de navegador del inglés recorre ahora también las vistas y las notas de los dos, en PC y móvil. Rota a propósito (quitando dos traducciones) falla donde debe.","Las pruebas de navegador de estilo y personaje se abren con el navegador en español, para que sus capturas sigan en español; el inglés lo prueba la de idiomas.","Capturas de la prueba de estilo en capturas/estilo-v7."],"pruebas":"Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 321/321, navegador de construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil","capturas":"capturas/personaje-v10","estado":"ok"},{"inicio":"2026-10-25T11:21:12+00:00","fin":"2026-10-25T12:15:21+00:00","titulo":"Juego y web en ruso","hito":"infra","hecho":["Los cuatro prototipos (construcción v7, combate v6, prueba de estilo v8 y personaje v11) están también en ruso: 398 textos del juego en src/idiomas/ru.json.","La web de progreso tiene botón RU: textos fijos, roadmap y diario en ruso (427 textos en proyecto/idiomas/ru.json); construir_web.mjs exige ahora el ruso completo, igual que el inglés.","Los documentos de diseño aún no están en ruso: la web en ruso enlaza a los de inglés. Queda como tarea nueva del hito de infraestructura.","En el móvil no cabían tres botones de idioma: ahora hay un desplegable con el idioma (en PC siguen los botones ES · EN · RU).","En el móvil, los botones de modo de la construcción se colocan debajo del menú de arriba según lo que mide de verdad (en ruso el menú ocupa tres filas y los tapaba), y el panel de opciones del personaje se coloca encima de la barra de vistas aunque esta ocupe dos filas.","En ruso, el botón «Parar» del combate (Парировать) va con letra algo más pequeña para que quepa en el círculo.","La prueba de idiomas comprueba también el ruso (que no falte ningún texto, que las variables coincidan y que esté en cirílico); rota a propósito con MUTAR=ru, falla donde debe.","La prueba de navegador de idiomas recorre todas las vistas de los cuatro prototipos en ruso, en PC y móvil: sin textos sin traducir, sin español ni inglés a la vista, nada que se salga por los lados y el menú que no tapa los botones de modo. La de la web prueba el botón RU.","Visto en las capturas y apuntado como tarea: en el móvil, el aviso de la construcción tapa «Reiniciar» (ya pasaba en inglés) y las notas de la prueba de estilo tapan la barra de vistas.","No comprobado: la prueba de navegador del ruso y la de la web rotas a propósito (MUTAR=1); las traducciones al ruso no las ha revisado una persona que hable ruso."],"pruebas":"Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 322/322 en inglés y ruso, navegador de construcción, combate, estilo, personaje, recursos, inglés y ruso, y web), PC y móvil","capturas":"capturas/construccion-v7","estado":"ok"},{"inicio":"2026-10-25T12:20:58+00:00","fin":"2026-10-25T12:55:37+00:00","titulo":"Documentos de diseño en ruso","hito":"infra","hecho":["El GDD, el documento de sistemas y el de análisis están en ruso, en diseno/ru/, con la huella del original como los de inglés.","Cada documento tiene arriba el selector ES · EN · RU, y la web en ruso enlaza ya a los documentos en ruso (antes iban al inglés).","construir_web.mjs comprueba también el ruso: falla si falta una traducción o si el español ha cambiado desde que se tradujo.","Con esto se terminan las tareas del hito de infraestructura: queda en revisión para valravnx.","No comprobado: las traducciones al ruso no las ha revisado una persona que hable ruso."],"pruebas":"Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, personaje 11, textos traducidos, navegador de los cuatro prototipos, idiomas y web 109 comprobaciones), PC y móvil; la prueba nueva de los documentos en ruso se rompió a propósito una vez y falló","capturas":"capturas/diseno-ru","estado":"ok"},{"inicio":"2026-10-25T13:20:40+00:00","fin":"2026-10-25T14:03:35+00:00","titulo":"Hito 0b: acciones con autor","hito":"base","hecho":["Nuevo módulo de lógica pura src/logica/acciones.js: cada acción es un mensaje con autor, tipo y datos sencillos; se comprueba, se aplica y se anota en un registro, salga bien o mal (con el motivo).","Construcción: el mojón, colocar y desmontar piezas, poner y quitar muebles, abrir y cerrar puertas y el botón de materiales pasan ya por las acciones. Con el registro se rehace el mismo mundo desde cero, como hará el servidor.","Combate: cada golpe cuerpo a cuerpo y cada disparo son acciones con autor y objetivo; la herida de una flecha se anota como impacto del mismo autor. Quien no está en el combate o ya ha caído no puede herir.","Prueba nueva (prueba_acciones.mjs, 25 comprobaciones): falla si una acción se salta el registro, porque el mundo rehecho ya no coincide, y revisa el código del juego para que nada fuera de la lógica pura cambie el mundo directamente.","Decisión provisional (anotada en el registro de decisiones de la construcción): mientras no haya cuentas, el autor es «jugador:local» y el registro vive solo en memoria; el guardado no cambia de formato.","Sin versión jugable nueva: no cambia nada a la vista.","No comprobado: las dos comprobaciones nuevas de navegador (registro de acciones en la construcción y en el combate) no se rompieron a propósito; la prueba de lógica sí (MUTAR=1 falla en 2 comprobaciones)."],"pruebas":"Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, personaje 11, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil; la prueba nueva de acciones se rompió a propósito una vez y falló","capturas":"","estado":"ok"},{"inicio":"2026-10-25T14:20:18+00:00","fin":"2026-10-25T14:59:27+00:00","titulo":"Hito 0b: quitar código muerto","hito":"base","hecho":["Quitado el personaje esculpido abandonado: cuerpo, campos de distancia, datos horneados (560 KB), la herramienta que los horneaba y su prueba. Nada del juego los usaba.","Quitado el muñeco por código de la prueba de estilo, con sus vistas «Personaje» y «Cara» y el botón «Quieto/Andando». La escena no cambia y su límite vuelve a 50 mil triángulos (usa 49,1 mil).","Los guardados de la prueba de estilo se adaptan: si se había quedado en una vista de personaje, vuelve a la general.","Prueba de estilo v9 publicada; las versiones anteriores (con el muñeco) siguen en la web sin tocar.","La prueba de estilo comprueba ahora que no queda nada del muñeco y que un guardado de la v8 se adapta; rota a propósito una vez (MUTAR=1) y falló."],"pruebas":"Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil","capturas":"capturas/estilo-v9","estado":"ok"},{"inicio":"2026-10-25T15:05:18+00:00","fin":"2026-10-25T15:57:44+00:00","titulo":"Hito 0b: taller con versiones fijadas","hito":"base","hecho":["Versiones del taller fijadas en herramientas/taller/versiones.json: Python 3.13, Blender por pip (bpy 5.2.3), numpy, Pillow, MPFB2 en su commit exacto (versión 2.0.18) y los paquetes de node.","Los programas del taller comprueban las versiones al empezar: si algo no coincide, paran y dicen qué; lo encontrado queda anotado junto a los personajes que salen.","Guía para montarlo desde cero (herramientas/taller/LEEME.md) y un programa que lo monta solo con esas versiones.","Comprobado montándolo desde cero en una máquina vacía: los dos personajes salen con las mismas 47 mallas (mismos vértices y tamaño) que los recursos publicados taller-v4.","Visto en las fotos del taller: el cinturón de encima de la cota sobresale hacia los lados (ya estaba publicado así); queda como tarea en el hito de arte.","Prueba nueva sin Blender (formato de las versiones y que una diferencia se detecta), rota a propósito una vez (MUTAR=1): falla."],"pruebas":"Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Después solo cambiaron roadmap, diario y traducciones: repetidas web y traducciones. Sin cambios jugables: no hay versión nueva. No comprobado: que las texturas salgan idénticas píxel a píxel, ni que el commit de MPFB2 sea exactamente el usado al principio (es el último del 24 oct, anterior a montar el taller).","capturas":"","estado":"ok"},{"inicio":"2026-10-25T16:05:19+00:00","fin":"2026-10-25T16:42:46+00:00","titulo":"Hito 0b: diario y traducciones sin choques","hito":"base","hecho":["Herramienta nueva (herramientas/unir_json.mjs) que une diario.json y las traducciones al fusionar ramas: entran las entradas y los textos de las dos ramas, y el diario queda en orden de hora.","Git la usa sola al fusionar (se activa en cada clon con --instalar); solo se para si dos ramas cambian distinto la misma entrada o traducción.","Comprobado rehaciendo las cuatro fusiones anteriores de main: el diario y las traducciones salen con el mismo contenido que se unió a mano y sin conflictos en esos archivos.","Regla en CLAUDE.md: activarla al empezar cada sesión, y si choca la web generada, volver a generarla en vez de unirla a mano.","Prueba nueva con casos pequeños y un caso real con git de dos sesiones en paralelo; rota a propósito una vez (MUTAR=1): falla."],"pruebas":"Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Sin cambios jugables ni visuales: no hay versión nueva ni capturas. No comprobado: el orden exacto del diario en una fusión antigua, donde la entrada se había colocado a mano fuera de su hora.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T17:04:32+00:00","fin":"2026-10-25T17:43:19+00:00","titulo":"Hito 0b: revisión completa","hito":"base","hecho":["Pasadas todas las pruebas del proyecto con probar_todo.sh: las cuatro demos en PC y móvil, inglés, recursos de personaje, taller, traducciones y web.","Revisadas las capturas de construcción, combate, estilo, personaje y web: todo se ve como antes del hito, que no cambia nada a la vista.","Quedaba sin comprobar que las pruebas de navegador del registro de acciones fallan si una acción no se anota: comprobado quitando el apunte en el registro; la de la construcción y las dos del combate fallan.","Arreglada la del combate: con el registro vacío rompía la prueba entera en vez de fallar esa comprobación y seguir.","Sin versión jugable nueva: el hito prepara el proyecto, no cambia nada a la vista.","El hito 0b queda en revisión, esperando a valravnx."],"pruebas":"Todas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil. Construcción y combate repetidas tras el arreglo de la prueba.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T17:52:07+00:00","fin":"2026-10-25T18:19:25+00:00","titulo":"Arreglo: quitar muebles con el ratón","hito":"construccion-mas","hecho":["valravnx: en PC no se podían quitar muebles; al mover el ratón hacia el botón de confirmar se perdía lo elegido.","Causa: en Desmontar, pasar el ratón volvía a elegir lo que hubiera debajo y escondía el botón. Pasaba también con las piezas.","Ahora el clic elige y lo elegido se queda fijo hasta confirmar o cancelar; sin nada elegido, pasar el ratón sigue resaltando lo que se quitaría.","Prueba nueva con el ratón de verdad: clic en un barril, mover el ratón hasta el botón y confirmar. Con el código de antes falla, como le pasaba a valravnx.","Construcción v8 publicada; las versiones anteriores siguen en la web."],"pruebas":"Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de los cuatro prototipos, recursos, inglés y web), PC y móvil. No comprobado: en una pantalla táctil de verdad (el toque no cambia: elige y pide confirmar como antes).","capturas":"capturas/construccion-v8","estado":"ok"},{"inicio":"2026-10-25T18:20:48+00:00","fin":"2026-10-25T19:45:09+00:00","titulo":"Hito 1d: escena común (src/mundo/)","hito":"unificacion","hecho":["Escena común en src/mundo/: estilos.js (paleta, luces, texturas por código), ambiente.js (cielo, sol con sombras blandas, luz del cielo, niebla y gradación ACES) y decorado.js (suelo hasta el horizonte, bosque instanciado, hierba, flores y rocas).","La construcción y el combate dejan su cielo azul liso, su suelo de color y sus árboles de conos y usan la escena del estilo v5. El combate tiene la liza de tierra pisada en el centro.","La prueba de estilo y el visor de personaje usan los mismos módulos; se ven igual que antes (la prueba de estilo difiere de su captura publicada solo por la compresión JPG).","La sombra sigue al jugador. Los cientos de árboles van instanciados: unas pocas llamadas de dibujo en vez de cerca de 900 de la construcción anterior.","Decisión provisional: en la construcción la hierba empieza a 16 m de la salida, porque dentro se construye y asomaría por los cimientos. Anotada en el registro del prototipo.","Decisión provisional por rendimiento: en la construcción y el combate el suelo va sin relieve ni filtrado anisótropo, los árboles lejanos no echan sombra y el cielo lo pinta la página. Medido sin tarjeta gráfica: el relieve del suelo era lo que más costaba.","La prueba de combate espera a que la flecha acabe su vuelo en vez de un tiempo fijo; con fotogramas más lentos fallaba sin que el juego fallase.","Construcción v9 y combate v7 publicados; las versiones anteriores siguen en la web."],"pruebas":"Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de construcción, combate, estilo, personaje, inglés y ruso, y web), PC y móvil; la de recursos de personaje falló por una ruta de importación y, arreglada, pasó repetida. Medido sin tarjeta gráfica (aquí no hay otra): construcción 346 ms por fotograma frente a 142 de la v8, combate 280 frente a 145 de la v6. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil de valravnx (es la tarea de rendimiento de este hito). Las comprobaciones de la prueba de combate cambiadas son las mismas (solo cambia la espera), no se rompieron a propósito.","capturas":"capturas/construccion-v9","estado":"ok"},{"inicio":"2026-10-25T19:54:00+00:00","fin":"2026-10-25T21:07:17+00:00","titulo":"Hito 1d: el personaje del taller en la construcción","hito":"unificacion","hecho":["El jugador de la construcción es el personaje del taller propio (cuerpo de MakeHuman vestido por código) en vez del muñeco: camisa y calzas de lino, sin túnica.","Anda, corre y tala con las animaciones de Quaternius pasadas a su esqueleto. Medida la velocidad natural de las animaciones con el pie en un ciclo: andar 0,97 m/s y correr 2,59 m/s; se aceleran con la velocidad del juego hasta 1,6×.","Talar: junto a un árbol del bosque, Usar (F) hace el gesto de talar y moverse lo para. Solo el gesto: sin hacha en la mano y sin madera, que llega con la recolección del hito 2.","Mientras carga el personaje (o si no se puede cargar) se ve el muñeco de antes, así el juego no se queda sin jugador.","Decisión provisional: lleva zapatos aunque el GDD dice que se empieza descalzo. Comprobado en las ca
