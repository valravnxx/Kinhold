nd comes back when it is removed","Cimientos de piedra y de troncos, suelos de troncos y de tablas y escaleras de mano y de tablas con el estilo de la prueba v5: losas sobre mortero con piedras en los costados, troncos con las testas claras, tablas con veta y rastreles, y varas descortezadas.":"Stone and log foundations, log and plank floors, and ladders and plank stairs in the v5 style test look: flagstones on mortar with stones along the sides, logs with light end grain, grained planks on battens, and peeled poles.","Tejados de paja (dos hiladas, mechones en el alero y cumbrera redonda) y de tablillas (filas solapadas, tabla de remate y caballete) con el estilo v5; bajo el tejado se cierra con tablas de pie, barro y estacas o encalado y postes":"Thatched roofs (two courses, tufts at the eaves and a rounded ridge) and shingle roofs (overlapping rows, barge board and ridge cap) in the v5 style; under the roof the gap is closed with upright boards, mud and stakes, or whitewash and posts","Puertas de varas y de tablas, cerca, portillo, empalizada y su puerta, y mojón con el estilo v5: tablas con peinazos y bisagras de hierro, varas atadas con cuerda, postes con el corte claro, troncos descortezados con la punta tallada y piedras apiladas":"Pole and plank doors, fence, fence gate, palisade and its gate, and boundary stone in the v5 style: planks with battens and iron hinges, poles tied with rope, posts with the light cut end, debarked logs with carved points and stacked stones","Los muebles con el estilo elegido (prueba de estilo v5): camas de paja y de madera, mesa de caballetes, banco, taburete, arcón, barril, estantería, antorcha de pie, alfombra de piel y estandarte":"Furniture in the chosen style (style test v5): straw and wooden beds, trestle table, bench, stool, chest, barrel, shelf, standing torch, hide rug and banner","Pieza fantasma y resaltados con la textura de la pieza (velo verde, rojo o naranja) y hacha en la mano al talar, con el estilo v5":"Ghost piece and highlights with the piece's texture (green, red or orange veil) and an axe in hand when felling, in the v5 style","Combate":"Combat","Campo de pruebas: duelo con espada o palo, prácticas con poste y dianas, carga a distancia.":"Test ground: duel with sword or staff, practice with a post and targets, ranged charge.","Rosa de golpes y defensa en tres capas.":"Strike rose and three-layer defence.","Arco arreglado: tensión mínima, sin tensar corriendo y 0,8 s para encajar flecha.":"Bow fixed: minimum draw, no drawing while running, and 0.8 s to nock an arrow.","Escudo provisional: nueva arma «Espada y escudo» (espada de una mano, 1,7 m de alcance). Al parar se levanta el escudo, que detiene también flechas y piedras de frente y cansa menos que parar con la espada. Nueva opción «Arma del rival»: el rival con escudo lo levanta cuando le apuntas.":"Provisional shield: new \"Sword and shield\" weapon (one-handed sword, 1.7 m reach). Parrying raises the shield, which also stops arrows and stones from the front and is less tiring than parrying with the sword. New \"Opponent's weapon\" option: an opponent with a shield raises it when you aim at them.","Combate en inglés: botón ES/EN arriba a la derecha y todos los textos traducidos (ayuda, avisos, registro, menús y decisiones). En el móvil, el panel de opciones ya no tapa el menú.":"Combat in English: ES/EN button at the top right and all texts translated (help, status, log, menus and decisions). On mobile, the options panel no longer covers the menu.","v6: también en ruso, con el mismo selector de idioma.":"v6: also in Russian, with the same language selector.","Escena común del estilo elegido: cielo, luz, sombras blandas, suelo con textura, bosque, hierba, flores y rocas, con la liza de tierra en el centro":"Shared scene in the chosen style: sky, light, soft shadows, textured ground, forest, grass, flowers and rocks, with a trodden-earth fighting ground in the middle","Los dos luchadores son el personaje del taller: la armadura es su ropa por capas (lino, gambesón, cota sobre gambesón), los brazos agarran el arma con cinemática inversa y las heridas se pegan al cuerpo donde entra el golpe":"Both fighters are the workshop character: the armour is their layered clothing (linen, gambeson, mail over gambeson), the arms grip the weapon with inverse kinematics and wounds stick to the body where the blow lands","Las flechas, dianas y postes ya no dejan memoria gráfica ocupada; aviso y recarga si se pierde el dibujo 3D.":"Arrows, targets and posts no longer leave graphics memory in use; notice and reload if the 3D view is lost.","Alrededor de la liza, la escena como la prueba de estilo v5: hierba densa con flores, matorrales, calvas de tierra, rocas y árboles de copa sueltos":"Around the lists, the scene like the v5 style test: dense grass with flowers, bushes, patches of earth, rocks and loose broadleaf trees","Espadas, palo, arco, escudo, flecha, poste de práctica y diana con el estilo v5; cintas de paño teñido más apagadas":"Swords, staff, bow, shield, arrow, practice post and target in the v5 style; more muted dyed-cloth bands","Prueba de estilo":"Style test","Cabaña en un claro con el estilo propuesto: realismo en miniatura.":"A cabin in a clearing in the proposed style: miniature realism.","Tres estilos (A plano, B suave, C texturas) con cabaña y personaje: elige uno.":"Three styles (A flat, B soft, C textured) with cabin and character: pick one.","Un solo estilo estilizado y ligero: 30 mil triángulos y 12 dibujados, sin personaje (espera tu decisión).":"A single light, stylised style: 30k triangles and 12 draw calls, no character (awaiting your decision).","Maqueta en miniatura: formas redondeadas, luz suave, sombras de contacto y desenfoque; zócalo de piedra continuo.":"Miniature diorama: rounded shapes, soft light, contact shadows and blur; continuous stone plinth.","Realismo en miniatura: la maqueta con texturas por código y el mundo sin recortar.":"Miniature realism: the diorama with code-generated textures and an uncropped world.","Árboles rehechos: copas suaves en racimos y pinos con puntas, sin rayajos.":"Trees redone: soft clustered canopies and pines with drooping tips, no scribbles.","Personaje por código: una sola malla con esqueleto, quieto y andando; vistas Personaje y Cara":"Character built in code: a single mesh with a skeleton, standing and walking; Character and Face views","Prueba de estilo en inglés: botón ES/EN arriba (recuerda el idioma elegido, también el de la web); la escena no cambia.":"Style test in English: ES/EN button at the top (remembers the chosen language, including the website's); the scene is unchanged.","v8: también en ruso. La escena no cambia.":"v8: also in Russian. The scene is unchanged.","Sin el muñeco hecho por código (el personaje está ahora en el visor de personaje); la escena no cambia":"Without the code-made figure (the character is now in the character viewer); the scene does not change","Las notas se colocan justo encima de la barra de vistas, aunque en el móvil esta ocupe dos filas.":"The notes sit just above the views bar, even when on mobile it takes two rows.","Personaje":"Character","Personajes del taller propio: cuerpo de MakeHuman con la ropa por capas hecha por código (camisa, túnica o vestido, gambesón, cota, sobreveste), andando delante de la cabaña.":"Characters from the own workshop: a MakeHuman body with layered clothing made by code (shirt, tunic or dress, gambeson, mail, surcoat), walking in front of the cabin.","Personaje esculpido por código: cara, manos, ropa por capas, esqueleto y andar.":"Character sculpted in code: face, hands, layered clothing, skeleton and walk cycle.","Personaje con bases libres (CC0) ya hechas y personalización: hombre o mujer, ropa, peinado, color de pelo, piel y barba.":"Character from ready-made free (CC0) bases with customisation: man or woman, clothing, hairstyle, hair colour, skin and beard.","Más ligero en el móvil (calidad ligera, un solo esqueleto, menos resolución) con interruptores para medir; sin el traje de explorador.":"Lighter on mobile (light quality, a single skeleton, lower resolution) with switches to measure; ranger outfit removed.","Vuelve la calidad alta por defecto en el móvil (iba perfecto); la ligera sigue como opción.":"High quality is the default on mobile again (it ran perfectly); light quality remains as an option.","Nueva opción «Base del personaje»: el taller propio (cuerpo de MakeHuman con ropa, pelo y barba hechos por código) ya anda, tala y lucha con las animaciones de Quaternius pasadas a su esqueleto.":"New «Character base» option: the own workshop (MakeHuman body with clothing, hair and beard made by code) now walks, chops and fights with the Quaternius animations transferred to its skeleton.","Arreglo: en calidad alta la ropa, el pelo y la cofia del taller propio se veían del revés (la piel se pintaba encima). Prueba nueva que lo vigila.":"Fix: on high quality the workshop's clothing, hair and coif looked inside out (the skin was drawn on top). New test to guard it.","Taller propio: postura arreglada (tronco recto, hombros en su sitio, brazos colgando rectos) y túnica del hombre que ya no marca pecho.":"Own workshop: posture fixed (straight torso, shoulders in place, arms hanging straight) and the man's tunic no longer shows a bust.","El taller propio pasa a ser la base (elegido por valravnx) y sale por defecto. Ropa por capas: camisa de lino, calzas y zapatos siempre; encima túnica o vestido y gambesón acolchado, que se ponen y se quitan con botones.":"The own workshop becomes the base (chosen by valravnx) and is the default. Layered clothing: linen shirt, hose and shoes always; over them a tunic or dress and a padded gambeson, put on and taken off with buttons.","Cota de malla y sobreveste como capas del taller propio, sobre la camisa, la túnica o el vestido y el gambesón.":"Mail and surcoat as layers of the own workshop, over the shirt, the tunic or dress and the gambeson.","Visor de personaje en inglés: botón ES/EN arriba (recuerda el idioma elegido, también el de la web); el personaje no cambia.":"Character viewer in English: ES/EN button at the top (remembers the chosen language, including the website's); the character is unchanged.","v11: también en ruso; en el móvil, el panel de opciones se coloca encima de la barra de vistas aunque esta ocupe dos filas.":"v11: also in Russian; on mobile, the options panel sits above the view bar even when it takes two rows.","Correr más natural: la carrera del paquete, suavizada por código (menos zancada, braceo, bote e inclinación, y los brazos más pegados), y a su velocidad de verdad: antes los pies resbalaban y se veía a cámara lenta. Botón «Correr» en Animación.":"More natural running: the pack's run, softened by code (shorter stride, less arm swing, bounce and lean, and arms closer to the body), and at its real speed: before, the feet slid and it looked like slow motion. «Run» button under Animation.","Brazos naturales al correr: oscilan junto al cuerpo, con la mano de canto y la muñeca recta, en vez de ir torcidos hacia delante.":"Natural arms when running: they swing next to the body, with the hand edge-on and the wrist straight, instead of being twisted forward.","El cinturón de encima de la cota ya no sobresale hacia los brazos (personajes del taller-v7).":"The belt over the mail shirt no longer sticks out to the arms (characters from taller-v7).","Hito 1: construcción (v1 a v3)":"Milestone 1: building (v1 to v3)","Lógica 35/35, modelos 21/21, navegador PC y móvil correctos.":"Logic 35/35, models 21/21, browser PC and mobile correct.","Rejilla anclada a la primera pieza, módulo de 2 m × 2,5 m, apoyos y reparto de carga.":"Grid anchored to the first piece, 2 m × 2.5 m module, supports and load distribution.","Desmontaje en cascada con 75% de recuperación, bloqueado si sobrecarga otra pieza.":"Cascading dismantling with 75% recovery, blocked if it would overload another piece.","v2: los muros se rellenan hasta el tejado y los tejados seguidos forman una pendiente continua.":"v2: walls fill up to the roof and consecutive roofs form a continuous slope.","v3: muros de 10 hiladas de 25 cm, todos exactos a 2,5 m.":"v3: walls of 10 courses of 25 cm, all exactly 2.5 m.","Campo de pruebas de combate v1 y v2":"Combat test ground v1 and v2","Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.":"Logic 52/52 (with mutations that fail as they should); browser PC and mobile: all correct.","v1: cinco líneas de golpe, guardias, heridas por zona sin barras de vida, arco con balística.":"v1: five strike lines, guards, wounds by body zone without health bars, bow with ballistics.","Comparado con juegos de esgrima de referencia: la v1 era poco intuitiva (arrastrar para golpear, elegir lado al parar, cámara a su aire).":"Compared with reference fencing games: v1 was unintuitive (drag to strike, choose a side when parrying, camera doing its own thing).","v2: rosa de golpes sobre el rival, parada sin lado + parada perfecta + golpe maestro, fintas, aliento.":"v2: strike rose over the opponent, side-free parry + perfect parry + master strike, feints, stamina.","Movimiento encarado (los lados rodean al rival), cámara con margen, pausa de impacto, chispas, sangre, sonido y estela.":"Facing movement (sideways circles the opponent), camera with a margin, hit pause, sparks, blood, sound and blade trail.","Dificultad = ritmo + ayudas: aprendiz (lento, con avisos), normal, realista (sin avisos).":"Difficulty = pace + aids: apprentice (slow, with warnings), normal, realistic (no warnings).","Sesión duplicada: arreglo del arco hecho dos veces":"Duplicate session: bow fix done twice","No aplica (trabajo descartado).":"Not applicable (work discarded).","Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.":"This session started at the same time as another one (19:13 Madrid time) and both took the same task: the bow fix.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).":"The other one published combat v3 first; when I went to push mine, the repository already had it. I discard my version so as not to overwrite the published one (versions are never overwritten).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.":"My copy also passed all tests (combat 63/63, browser correct); it adds nothing that isn't already in the published v3.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen.":"Warning: two automatic tasks are running at the same time on the repository. It's best to keep only one so they don't repeat work or overwrite each other.","Infraestructura: repositorio, web de progreso y trabajo automático":"Infrastructure: repository, progress website and automatic work","Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.":"All project tests green (logic, models, combat, browser PC and mobile, website). Fixed a combat test that sometimes failed if the opponent killed you before the panels were clicked.","Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.":"Repository valravnxx/kinhold with code, design documents and working rules.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.":"Progress website on GitHub Pages: play, roadmap, log, times, decisions and documents.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.":"Scheduled task at :19 every hour: does one roadmap task per session and stops at the end of each milestone for your review.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso.":"Waiting on you: enable GitHub Pages (Settings → Pages → main branch, /docs folder); I don't have permission from here.","Alcance del proyecto: arte y seguridad al roadmap":"Project scope: art and security added to the roadmap","Web regenerada y probada en PC y móvil.":"Website rebuilt and tested on PC and mobile.","Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.":"New milestone 1b \"Art direction and characters\", prioritised over new pieces: realistic character, customisation and visible armour. It starts with three style tests for you to choose from.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.":"New milestone 11b \"Administration, logs and security\": roles, admin panel, logs, cheat detection and sanctions.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.":"Milestone 11 expanded (secure accounts) and written into the rules: every action that changes the world has an author, so it can be logged.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil.":"The working rules now include the visual bar: restrained and realistic within low-poly, nothing childish, and able to run on mobile.","Hito 1b: tres pruebas de estilo":"Milestone 1b: three style tests","Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 52/52; browser building, combat, style tests (PC and mobile, with a deliberate MUTAR=1 break that fails as it should) and website: all correct.","Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.":"New prototype \"Style tests\" (v1): the same scene (log cabin with thatched roof, firewood, stump with axe, barrel, fence, trees) and the same character in three styles.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.":"A · Restrained flat: flat faces, little detail, midday light. B · Soft and natural: smooth shading, ambient occlusion baked into vertices, more detail, cinematic tones. C · Painted textures: code-generated textures, low afternoon light, fog and warm grading.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.":"New 1.76 m articulated character: linen shirt, wool tunic, belt with pouch, hose, leg wraps, leather shoes, short hair and beard; face with eyelids, eyebrows, nose, ears and mouth.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).":"Measured in the test browser: A 16k triangles, B 39k, C 86k; between 94 and 129 draw calls per frame after merging static meshes (up to 1000 before).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.":"The building v3 and combat v2 screenshots gave 404 on the website (.gitignore excluded docs/capturas). I fixed it here and the same fix arrived at the same time in another commit; when merging both I kept its screenshots.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil.":"Not verified: fps on a real phone (the test browser has no graphics card; it gives 1-3 fps on all of them). The prototype shows fps in the top right so you can measure it on your phone.","Hito 5: arreglo del arco (combate v3)":"Milestone 5: bow fix (combat v3)","Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.":"Logic 35/35, models 21/21, combat 59/59 (7 new, fail with MUTAR=1); browser building, combat (new: a weak release doesn't shoot), style and website correct.","Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).":"Processed your combat review: two new tasks in milestone 5 (bow fix and provisional shield).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.":"Releasing below 50% draw cancels the shot without firing, with a warning.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.":"Breaking into a run relaxes the bow, and you can't start drawing while running.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.":"After each shot, 0.8 s to nock the next arrow (stones 0.5 s): at most about 8 arrows every 10 s.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto.":"Fixed along the way: running counted as soon as Shift was pressed, even when standing still.","Revisión de las pruebas de estilo: investigación y replanteo":"Style test review: research and rethink","Sin cambios de código en esta parte.":"No code changes in this part.","valravnx: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).":"valravnx: the v1 style tests don't work (three finishes on the same model, B and C very slow, ugly character).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.":"Causes of the slowness: physical (Standard) material in B and C, 2048 shadow, double resolution on mobile and up to 86k triangles in C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.":"Researched: with fewer than 100-150 draw calls, a cheap material, a single light with shadow and 1024 or 512 shadows, the scene runs smoothly on a mid-range phone. A toon material with a gradient texture, merging meshes and instancing also help.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.":"Character: the underlying problem is assembling it from loose pieces (spheres and cylinders stuck together). Proposal: a single continuous mesh with a skeleton, or free CC0 models already animated. Left for you to decide.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido.":"New task in milestone 1b to redo the tests with a measured budget.","Hito 1b: prueba de estilo v2, ligera y estilizada":"Milestone 1b: style test v2, light and stylised","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 59/59; browser building, combat, style v2 (with budget; MUTAR=1 fails as it should) and website: all correct.","Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.":"A single style instead of three finishes: 3-tone cartoon shading, flat faces, muted vertex colours with variation and baked occlusion, no textures.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).":"All the static part (cabin, firewood, stump, barrel, bench, fence) is a single draw call; trees, rocks and bushes are instanced. Measured: 29.6k triangles and 12 draw calls (v1 reached 86k and 1000 before merging).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.":"A single 1024 px shadow; only nearby trees cast shadows. Gradient sky and fog, no post-processing.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.":"Adaptive resolution: starts at 1.5× at most and drops to 0.75× if it doesn't reach 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.":"Thatched roof with rounded edges and colour streaks. Two lightings to compare: morning and afternoon.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).":"Removed the v1 character: the new one awaits your decision (continuous mesh in code or CC0 models).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica).":"Not verified: fps on a real phone or PC (the test browser has no graphics card).","Hito 5: escudo provisional (combate v4)":"Milestone 5: provisional shield (combat v4)","Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos":"Building 35/35, models 21/21, combat 69/69 (10 new for the shield, fail with MUTAR=1), combat browser PC and mobile correct (8 new checks, fail with the shield deliberately broken), style and website correct","Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.":"New \"Sword and shield\" weapon: one-handed sword with 1.7 m reach (the longsword has 1.9), somewhat faster and somewhat less damaging.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.":"Round plank shield with leather rim and boss, on the left arm; when parrying it is raised in front of the chest.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.":"With a shield, Parry also stops arrows and stones coming from the front (70° each side); not from behind or the side.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"Parrying with a shield costs 60% of the stamina it costs with the sword. Perfect parry and master strike work the same.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"New \"Opponent's weapon\" option (same as yours, longsword, sword and shield, or staff). An opponent with a shield raises it when you aim at them with a bow or sling and keeps it up while you reload.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.":"All noted as provisional in the prototype's decision log, for you to review.","Los guardados de opciones anteriores siguen valiendo: si no tienen arma del rival, se usa «Como la tuya».":"Previous option saves still work: if they have no opponent weapon, \"Same as yours\" is used.","Hito 1b: prueba de estilo v3, maqueta en miniatura":"Milestone 1b: style test v3, miniature diorama","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v3 (MUTAR=1 falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 59/59; browser building, combat, style v3 (MUTAR=1 fails as it should) and website: all correct.","Tu revisión de la v2: recordaba a juegos gratuitos de motor genérico y las piedras del cimiento se veían sueltas. Elegiste «maqueta en miniatura».":"Your review of v2: it reminded you of free games made with generic engines, and the foundation stones looked loose. You chose \"miniature diorama\".","La escena es un pedazo de tierra redondo con el corte de tierra visto, sobre fondo liso con degradado. Cámara de teleobjetivo y desenfoque arriba y abajo (se puede quitar).":"The scene is a round patch of land with the cut earth visible, on a plain gradient background. Telephoto camera and blur at top and bottom (can be turned off).","Formas redondeadas: cantos suaves, troncos con puntas abombadas, tejado de paja en tres hiladas gruesas, copas redondas, matorrales y flores de colores apagados.":"Rounded shapes: soft edges, logs with domed ends, thatched roof in three thick courses, round canopies, bushes and flowers in muted colours.","Zócalo de piedra continuo: núcleo de mortero con dos hiladas de piedras bien juntas.":"Continuous stone plinth: a mortar core with two courses of tightly fitted stones.","Luz suave, sombras de bordes blandos y sombras de contacto horneadas en el suelo.":"Soft light, soft-edged shadows and contact shadows baked into the ground.","Medido: 47 mil triángulos (con la pasada de sombra) y 6 dibujados. Subido el presupuesto de 30 a 50 mil por los cantos redondeados; los dibujados bajan de 12 a 6.":"Measured: 47k triangles (with the shadow pass) and 6 draw calls. Budget raised from 30k to 50k because of the rounded edges; draw calls drop from 12 to 6.","Decidido por ti en el chat: los personajes se hacen por código. La tarea del personaje pasa a pendiente.":"Decided by you in the chat: characters are built in code. The character task moves to pending.","No comprobado: los fps en un aparato real.":"Not verified: fps on a real device.","Hito 1b: prueba de estilo v4, realismo en miniatura":"Milestone 1b: style test v4, miniature realism","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v4 (MUTAR=1 falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 59/59; browser building, combat, style v4 (MUTAR=1 fails as it should) and website: all correct.","Tu revisión de la v3: te gusta, pero el mundo no estará recortado; pediste probar el «realismo en miniatura» con algo de textura.":"Your review of v3: you like it, but the world won't be cropped; you asked to try \"miniature realism\" with some texture.","Texturas hechas por código, en gris, que dan detalle y relieve: veta, anillos de los cortes, paja en hebras, piedra, corteza, hojas y suelo. El color sigue saliendo de la paleta.":"Code-generated greyscale textures that add detail and relief: grain, rings on cut ends, thatch in strands, stone, bark, leaves and ground. Colour still comes from the palette.","Las texturas van a escala real: la veta sigue el largo de cada tronco y tabla, la paja baja por la pendiente y los anillos se centran en cada corte.":"Textures are at real scale: the grain follows the length of each log and plank, the thatch runs down the slope and the rings are centred on each cut.","El suelo sigue con lomas hasta el horizonte, con bosque lejano instanciado y niebla del color del cielo.":"The ground keeps rolling to the horizon, with instanced distant forest and fog in the sky's colour.","Medido: 47 mil triángulos y 21 dibujados (una malla por textura), dentro del presupuesto de 50 mil y 60.":"Measured: 47k triangles and 21 draw calls (one mesh per texture), within the budget of 50k and 60.","Hito 1b: prueba de estilo v5, árboles rehechos":"Milestone 1b: style test v5, trees redone","Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v5 y web: todo correcto.":"Logic 35/35, models 21/21, combat 69/69; browser building, combat, style v5 and website: all correct.","Tu revisión de la v4: la casa bien, los árboles fatal, con rayajos raros.":"Your review of v4: the house good, the trees awful, with weird scribbles.","Causa: la textura de hojas se proyectaba cara a cara sobre las copas y salían trazos cortados en cada cara.":"Cause: the leaf texture was projected face by face onto the canopies, producing broken strokes on each face.","Copas nuevas: bolas suaves con bultos, como racimos, más claras arriba y oscuras por dentro, con una textura de manchas redondas que envuelve la copa sin costuras.":"New canopies: soft lumpy balls like clusters, lighter on top and darker inside, with a round-blotch texture wrapping the canopy seamlessly.","Pinos: cada piso acaba en puntas caídas, como ramas, en vez de un cono liso.":"Pines: each tier ends in drooping tips, like branches, instead of a smooth cone.","Medido: 49 mil triángulos y 21 dibujados (algo menos de hierba para no pasar de 50 mil).":"Measured: 49k triangles and 21 draw calls (a little less grass to stay under 50k).","Hito 1b: personaje por código (avance, sin publicar)":"Milestone 1b: character built in code (progress, not published)","Sin prueba de navegador propia todavía (no publicado). Lo demás sin cambios.":"No browser test of its own yet (not published). Everything else unchanged.","Cuerpo hecho por secciones con perfil real (cintura, pecho, muslo, rodilla, pantorrilla, deltoides, codo) en una sola malla con esqueleto de 17 huesos: anda y respira sin abrirse en las articulaciones.":"Body made in sections with a real profile (waist, chest, thigh, knee, calf, deltoid, elbow) in a single mesh with a 17-bone skeleton: it walks and breathes without opening at the joints.","Manos con palma, cuatro dedos recogidos y pulgar; zapatos de una pieza; túnica con pliegues en la falda que sigue a los muslos al andar; camisa en cuello y puños; cinto con hebilla; vendas en las piernas.":"Hands with palm, four curled fingers and thumb; one-piece shoes; tunic with folds in the skirt that follows the thighs when walking; shirt at collar and cuffs; belt with buckle; leg wraps.","Cabeza: esfera moldeada (mandíbula, mentón, ceja, cuencas, pómulos, nariz, boca) con pelo y barba como abultamiento de la misma malla. No da el nivel: de cerca la cara se ve blanda y rara. No se publica.":"Head: a moulded sphere (jaw, chin, brow, eye sockets, cheekbones, nose, mouth) with hair and beard as a bulge of the same mesh. Not good enough: up close the face looks soft and odd. Not published.","Siguiente paso propuesto: hacer la cabeza a partir de una malla base con planos marcados (frente, cuencas, pómulos, nariz, mandíbula), escrita como datos en el código, en vez de deformar una esfera.":"Proposed next step: build the head from a base mesh with defined planes (forehead, eye sockets, cheekbones, nose, jaw), written as data in the code, instead of deforming a sphere.","Personaje: 5,9 mil triángulos.":"Character: 5.9k triangles.","Hito 1b: personaje nuevo por código (prueba de estilo v6)":"Milestone 1b: new character built in code (style test v6)","Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v6 (con pruebas nuevas del personaje; MUTAR=1 falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 69/69; browser building, combat, style v6 (with new character tests; MUTAR=1 fails as it should) and website: all correct.","Personaje hecho todo por código, como decidiste: una sola malla continua, sin piezas sueltas. El cuerpo es una suma suave de formas (cráneo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas y pies) que se convierte en malla.":"Character made entirely in code, as you decided: a single continuous mesh, no loose pieces. The body is a smooth sum of shapes (skull, face, nose, eyebrows, ears, torso, arms, hands with thumb, legs and feet) turned into a mesh.","Más detalle donde se ve: la rejilla es más fina en la cara y las manos. Medido: 9.836 triángulos y 5.611 vértices.":"More detail where it shows: the grid is finer on the face and hands. Measured: 9,836 triangles and 5,611 vertices.","Esqueleto de 17 huesos con pesos calculados por cercanía a las formas de cada hueso. Dos animaciones por código: quieto (respira y se balancea) y andar (va y viene por el camino).":"17-bone skeleton with weights computed by proximity to each bone's shapes. Two animations in code: idle (breathes and sways) and walk (goes back and forth along the path).","Hombre adulto de 1,72 m con barba corta; ropa base pintada en la malla (camisa de lino, cinturón con relieve, calzas y zapatos), provisional hasta la tarea de ropa por capas.":"Adult man, 1.72 m, with a short beard; base clothing painted on the mesh (linen shirt, embossed belt, hose and shoes), provisional until the layered clothing task.","Oclusión ambiental horneada en los vértices y ojos con brillo. Vistas nuevas «Personaje» y «Cara» que le siguen, y botón Quieto/Andando (se recuerda al recargar).":"Ambient occlusion baked into the vertices and eyes with highlights. New \"Character\" and \"Face\" views that follow him, and an Idle/Walking button (remembered on reload).","El presupuesto de la escena sube de 50 mil a 72 mil triángulos (con el personaje y su sombra son 68,8 mil). Anotado en el registro.":"The scene budget rises from 50k to 72k triangles (with the character and its shadow it is 68.8k). Noted in the log.","Se ve tosco de cerca: pelo como casquete liso, cara aún simple y bordes de color algo borrosos en el cuello de la camisa y la barba. Queda preguntado en las decisiones.":"It looks rough up close: hair like a smooth cap, face still simple and somewhat blurry colour edges at the shirt collar and beard. Left as a question in the decisions.","No comprobado: los fps en un móvil de verdad (aquí, sin tarjeta gráfica, no sirve medirlos).":"Not verified: fps on a real phone (here, without a graphics card, measuring them is pointless).","Coincidió con otra sesión (21:13–21:20) que avanzó el personaje por otro camino (src/personaje/, por secciones, sin publicar). Se conservan las dos; esta es la que se publica en la prueba de estilo v6.":"It overlapped with another session (21:13–21:20) that advanced the character a different way (src/personaje/, in sections, not published). Both are kept; this is the one published in style test v6.","Hito 1b: personaje esculpido por código (v1)":"Milestone 1b: character sculpted in code (v1)","Lógica 35/35, modelos 21/21, combate 69/69, personaje horneado 11/11 (nuevas, fallan con MUTAR=1); navegador construcción, combate, estilo, personaje (nueva, falla con MUTAR=1) y web: todo correcto.":"Logic 35/35, models 21/21, combat 69/69, baked character 11/11 (new, fail with MUTAR=1); browser building, combat, style, character (new, fails with MUTAR=1) and web: all correct.","Tu revisión: el avance anterior no valía; pediste investigar y hacerlo de la forma óptima, costase lo que costase.":"Your review: the previous progress wasn't good enough; you asked me to research and do it the optimal way, whatever it cost.","Investigado: la técnica que da criaturas orgánicas solo con código es esculpir con campos de distancia (formas simples fundidas con mezcla suave sobre el esqueleto), pasar a malla fina, simplificar y pesar al esqueleto por cercanía. Es lo que usa un proyecto abierto de animales procedurales para three.js.":"Researched: the technique that gives organic creatures with code alone is sculpting with distance fields (simple shapes smoothly blended over the skeleton), converting to a fine mesh, simplifying, and weighting to the skeleton by proximity. It's what an open-source procedural animals project for three.js uses.","Hecho así: unas 120 formas (cráneo, frente, cejas, pómulos, maxilar, mandíbula, mentón, nariz con aletas y fosas, labios, cuencas con párpados, orejas; músculos del tronco, brazos y piernas; manos con dedos). Ojos aparte con iris y pupila.":"Built that way: about 120 shapes (skull, forehead, brows, cheekbones, upper jaw, jaw, chin, nose with wings and nostrils, lips, eye sockets with eyelids, ears; torso, arm and leg muscles; hands with fingers). Separate eyes with iris and pupil.","Ropa, pelo y barba como capas que siguen al cuerpo (camisa, túnica con pliegues, cinto, calzas, vendas, zapatos). La falda sigue a los muslos al andar.":"Clothing, hair and beard as layers that follow the body (shirt, tunic with folds, belt, hose, leg wraps, shoes). The skirt follows the thighs when walking.","Horneado al construir (herramientas/hornear_personaje.mjs): rejilla de 3 mm, superficie por surface nets, simplificación con meshoptimizer (la cabeza con más presupuesto), normales y oclusión sacadas del campo. Tarda 95 s; en el juego carga al instante.":"Baked at build time (herramientas/hornear_personaje.mjs): 3 mm grid, surface nets, simplification with meshoptimizer (the head gets more budget), normals and occlusion taken from the field. Takes 95 s; loads instantly in the game.","Medido: cerca 22,8 mil triángulos y lejos 4 mil; 17 huesos.":"Measured: 22.8 thousand triangles up close and 4 thousand far away; 17 bones.","Pendiente de pulir: el pelo es algo áspero, la barba tiene el borde irregular, un bulto en el dorso de la muñeca y el cuello de la camisa queda grueso. No comprobado: los fps en un aparato real.":"Still to polish: the hair is a bit rough, the beard edge is uneven, there's a lump on the back of the wrist and the shirt collar is too thick. Not checked: fps on a real device.","Web de progreso en inglés":"Progress website in English","Web en PC y móvil, en español y en inglés (botón, recargar, ?lang=en): todo correcto; quitar una traducción a propósito hace fallar la generación de la web.":"Website on PC and mobile, in Spanish and English (button, reload, ?lang=en): all correct; deliberately removing a translation makes the website build fail.","Selector ES / EN arriba a la derecha; se recuerda al volver y se puede abrir directamente con ?lang=en.":"ES / EN switch at the top right; it is remembered when you come back, and the site can be opened directly with ?lang=en.","Traducidos al inglés los 206 textos del roadmap, el diario, las decisiones y las notas de versión, y todos los textos fijos de la web.":"Translated into English the 206 texts of the roadmap, log, decisions and release notes, plus all fixed texts of the website.","Las traducciones viven en proyecto/idiomas/en.json; la web no se genera si falta alguna, así que todo lo nuevo saldrá también en inglés.":"Translations live in proyecto/idiomas/en.json; the website won't build if any is missing, so everything new will also appear in English.","Preparado para el ruso: basta con añadir proyecto/idiomas/ru.json y sus textos fijos.":"Ready for Russian: just add proyecto/idiomas/ru.json and its fixed texts.","Nuevas tareas: documentos de diseño en inglés y el juego en inglés.":"New tasks: design documents in English and the game in English.","Construcción v4: madera más resistente y casa de dos plantas":"Building v4: stronger wood and a two-storey house","Construcción 46/46 (11 nuevas con casas de 2 y 3 plantas; fallan con MUTAR=1), modelos 21/21, combate 69/69; navegador de construcción (casa de 4×4 de dos plantas con tejado a dos aguas), combate, estilo y web: todo correcto.":"Building 46/46 (11 new with 2- and 3-storey houses; they fail with MUTAR=1), models 21/21, combat 69/69; browser building (4×4 two-storey house with a gable roof), combat, style and website: all correct.","Causa del tejado que no entraba en las esquinas: el cimiento de troncos de cada esquina carga con dos muros por planta y con la segunda planta se pasaba (1320 kg de 1200).":"Why the roof would not go on at the corners: the log foundation at each corner carries two walls per storey, and with the second storey it was overloaded (1320 kg out of 1200).","Más aguante en todas las piezas de madera y piedra. Una casa de troncos de 2 plantas con tejado ya entra entera y ninguna pieza pasa del 75%.":"All wood and stone pieces are stronger. A 2-storey log house with a roof now fits entirely, and no piece goes above 75%.","Siguen existiendo límites: 3 plantas piden cimiento de piedra y el zarzo no da para dos plantas.":"There are still limits: 3 storeys need a stone foundation, and wattle and daub can't take two storeys.","Vano de una casilla: un suelo en alto o un tramo de tejado sin muros debajo se apoya en el de al lado. Hasta 4×4 casillas no hacen falta vigas por dentro; en 5×5 el centro sí las pide.":"One-cell span: an upper floor or a roof section with no walls below rests on the one next to it. Up to 4×4 cells no inner beams are needed; at 5×5 the centre does need them.","Los valores nuevos están en Decisiones dentro del juego, como provisionales.":"The new values are listed under Decisions in the game, as provisional.","Documentos de diseño en inglés":"Design documents in English","Todas correctas: construcción 46/46 (ya con la v4 de otra sesión), modelos 21/21, combate 69/69, navegador de construcción, combate, estilo y web (PC y móvil, documentos en los dos idiomas). Romper a propósito los enlaces o la traducción hace fallar la prueba de la web; cambiar el español sin retraducir hace fallar la generación.":"All passing: building 46/46 (already including v4 from another session), models 21/21, combat 69/69, browser tests for building, combat, style and the site (PC and mobile, documents in both languages). Deliberately breaking the links or the translation makes the site test fail; changing the Spanish without re-translating makes the build fail.","GDD, sistemas y análisis traducidos enteros al inglés, en diseno/en/, con la misma estructura que el original.":"GDD, systems and analysis fully translated into English, in diseno/en/, with the same structure as the original.","Cada documento tiene arriba un selector ES · EN; la web en inglés enlaza directamente a la versión inglesa.":"Each document has an ES · EN selector at the top; the English site links straight to the English version.","Cada traducción guarda la huella del original en español: si el español cambia y no se vuelve a traducir, la web no se genera y dice qué archivo falta.":"Each translation stores a fingerprint of the Spanish original: if the Spanish changes and is not translated again, the site is not built and it says which file is missing.","Decisión provisional: los documentos traducidos son archivos aparte (no van en en.json), porque son textos largos con tablas.":"Provisional decision: the translated documents are separate files (not in en.json), because they are long texts with tables.","Personaje v2: bases libres ya hechas en lugar de esculpirlo por código":"Character v2: ready-made free bases instead of sculpting it in code","Construcción 46/46, modelos 21/21, combate 69/69; navegador: construcción, combate, estilo, personaje v2 (vistas, animación, tres variantes y botones, PC y móvil; MUTAR=1 falla como debe) y web: todo correcto.":"Building 46/46, models 21/21, combat 69/69; browser: building, combat, style, character v2 (views, animation, three variants and buttons, PC and mobile; MUTAR=1 fails as it should) and website: all correct.","Se abandona el personaje esculpido por código (daba grima). Investigado cómo lo resuelven otros proyectos de navegador: parten de bases de personajes ya hechas y libres.":"The character sculpted in code is dropped (it was creepy). Researched how other browser projects do it: they start from ready-made, free character bases.","Elegidos los paquetes CC0 de Quaternius (se pueden usar y vender sin pagar ni citar): cuerpos base, ropa modular por piezas sobre el mismo esqueleto, y librería de animaciones. Licencias y procedencia junto a los modelos.":"Chose Quaternius's CC0 packs (free to use and sell without paying or crediting): base bodies, modular clothing on the same skeleton, and an animation library. Licences and provenance are stored with the models.","Personaje montado con la cabeza de la base (solo cabeza y cuello, el resto lo tapa la ropa), la ropa, el pelo y la barba, atados al mismo esqueleto de 65 huesos. La ropa y las armaduras futuras irán por capas sobre ese esqueleto.":"Character assembled from the base's head (head and neck only; clothing covers the rest), clothing, hair and beard, all bound to the same 65-bone skeleton. Future clothing and armour will go on in layers over that skeleton.","Personalización: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo (6), tono de piel (4) y barba. Animaciones del paquete: quieto, andar, talar, en guardia, golpe y cargar.":"Customisation: man or woman, peasant or ranger clothing, hairstyle, hair colour (6), skin tone (4) and beard. Animations from the pack: idle, walk, chop, guard, strike and carry.","Modelos preparados para el navegador: texturas reducidas y un archivo por pieza. Un personaje carga unos 4 MB la primera vez más 4,4 MB de animaciones compartidas.":"Models prepared for the browser: reduced textures and one file per piece. A character loads about 4 MB the first time, plus 4.4 MB of shared animations.","No comprobado: los fps en un móvil de verdad (aquí no hay tarjeta gráfica). Un personaje tiene entre 20 y 33 mil triángulos según la ropa.":"Not verified: fps on a real phone (there is no graphics card here). A character has between 20k and 33k triangles depending on the clothing.","Personaje v3: más ligero en el móvil":"Character v3: lighter on mobile","Personaje en navegador PC y móvil (vistas, animación, variantes, calidad ligera, esqueleto compartido, interruptores): todo correcto.":"Character in browser on PC and mobile (views, animation, variants, light quality, shared skeleton, switches): all correct.","valravnx: en su móvil el personaje v2 iba a 10 fps y el traje de explorador es demasiado de fantasía.":"valravnx: on his phone character v2 ran at 10 fps, and the ranger outfit is too fantasy.","En pantallas táctiles empieza en calidad ligera: material sencillo con el color, sin relieve ni brillo. Resolución de partida 1× y puede bajar hasta 0,5×.":"On touch screens it starts in light quality: a simple material with just colour, no relief or shine. Starting resolution 1×, and it can drop to 0.5×.","La ropa, el pelo y la barba comparten un solo esqueleto; antes cada malla calculaba el suyo en cada fotograma.":"Clothing, hair and beard share a single skeleton; before, each mesh computed its own every frame.","Interruptores de prueba (calidad, sombras, cabaña y suelo) para ver en el móvil qué pesa, con los fps arriba. En el móvil el panel empieza cerrado para no tapar al personaje.":"Test switches (quality, shadows, cabin and ground) to see what is heavy on the phone, with fps shown at the top. On mobile the panel starts closed so it doesn't cover the character.","Quitado el traje de explorador de las opciones.":"Ranger outfit removed from the options.","No comprobado: si con esto llega a fps buenos en el móvil de valravnx. Aquí no hay tarjeta gráfica y las medidas no se parecen a un móvil.":"Not verified: whether this reaches good fps on valravnx's phone. There is no graphics card here and measurements don't resemble a phone.","Personaje v4 y primera prueba del taller propio con MakeHuman":"Character v4 and first test of our own workshop with MakeHuman","Personaje v4 en navegador PC y móvil: todo correcto. Taller: tres humanos creados y exportables sin errores.":"Character v4 in browser on PC and mobile: all correct. Workshop: three humans created and exportable without errors.","Malentendido corregido: «me va de 10» significaba que iba perfecto, no a 10 fps. Vuelve la calidad alta por defecto también en el móvil; la ligera solo si la eliges tú.":"Misunderstanding fixed: \"me va de 10\" meant it ran perfectly, not at 10 fps. High quality is the default on mobile again; light quality only if you pick it.","Taller propio montado: Blender sin pantalla (instalado con pip) con MakeHuman (MPFB2) desde su repositorio. Crea humanos por código con edad, sexo, músculo, peso, altura y rasgos de la cara, y les pone esqueleto para juegos.":"Our own workshop set up: headless Blender (installed with pip) with MakeHuman (MPFB2) from its repository. It creates humans from code with age, sex, muscle, weight, height and facial features, and gives them a game skeleton.","Primera prueba: tres personas distintas (hombre de mediana edad, mujer joven, anciano) fotografiadas en arcilla. Proporciones y caras anatómicas, y la edad se nota.":"First test: three different people (middle-aged man, young woman, old man) rendered in clay. Anatomical proportions and faces, and age shows.","Lo que falta para usarlo: ojos, pieles, pelo, cejas y barbas vienen en paquetes libres de MakeHuman que solo se bajan de su web (los tiene que bajar valravnx). Su ropa es moderna, no medieval. Cada cuerpo tiene 26,8 mil triángulos y habría que reducirlo para el móvil.":"What is missing to use it: eyes, skins, hair, eyebrows and beards come in free MakeHuman packs that can only be downloaded from their website (valravnx has to download them). Their clothing is modern, not medieval. Each body has 26.8k triangles and would need reducing for mobile.","Taller propio: vestir y acabar por código un humano de MakeHuman":"Own workshop: dressing and finishing a MakeHuman body by code","Prueba de taller, no publicada como versión jugable: dos personajes exportados sin errores, vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.":"Workshop test, not published as a playable version: two characters exported without errors, viewed in Blender and in three.js with no console errors. Not checked: animations or mobile performance.","Ropa y acabado hechos por código encima del cuerpo de MakeHuman, sin paquetes de fuera: túnica, calzas, zapatos, cinturón, vestido largo y cofia con toca de lino.":"Clothing and finishing made by code on top of the MakeHuman body, with no outside packs: tunic, hose, shoes, belt, long dress, and a linen coif with wimple.","Cada prenda sale de las mallas de ayuda que trae la propia base (malla ceñida y falda), así que hereda los pesos de los huesos y se moverá con el esqueleto sin pintar nada a mano.":"Each garment comes from the helper meshes in the base itself (tight suit and skirt), so it inherits the bone weights and will move with the skeleton without any hand painting.","Piel, cejas, labios, rojeces, pelo corto y barba pintados en texturas calculadas punto a punto; los bordes del pelo, la barba, el escote y las mangas salen suaves, sin escalones.":"Skin, eyebrows, lips, flush, short hair and beard painted into textures computed point by point; the edges of hair, beard, neckline and sleeves come out smooth, with no steps.","Se quita la piel que tapa la ropa: unos 19 mil triángulos por personaje (la base sola tenía 26,8 mil).":"The skin hidden under clothing is removed: about 19 thousand triangles per character (the bare base had 26.8 thousand).","Comprobado también en three.js, con la luz y la cabaña de la prueba de estilo: se carga y se ve igual que en Blender.":"Also checked in three.js, with the light and the hut from the style test: it loads and looks the same as in Blender.","Falta: que se mueva (el esqueleto de MakeHuman está en otra postura que las animaciones de Quaternius y hay que pasarlas de uno a otro), caras más finas y más tipos de pelo.":"Still missing: movement (the MakeHuman skeleton is in a different pose from the Quaternius animations, which must be transferred from one to the other), finer faces and more hairstyles.","Juego en inglés: construcción y combate con botón ES/EN":"Game in English: building and combat with an ES/EN button","Todas correctas (probar_todo.sh): lógica 46/46, modelos 21/21, combate 69/69, personaje horneado, textos traducidos 231/231, navegador construcción, combate, estilo, personaje, juego en inglés (PC y móvil) y web. Capturas en inglés miradas en PC y móvil. No comprobado: en un móvil real.":"All passing (probar_todo.sh): logic 46/46, models 21/21, combat 69/69, baked character, translated texts 231/231, browser building, combat, style, character, game in English (PC and mobile) and website. English screenshots checked on PC and mobile. Not checked: on a real phone.","Módulo de idioma común (src/idioma.js): el texto en español es la clave y src/idiomas/en.json da la traducción; el ruso está preparado (ru.json vacío) y se ofrece en cuanto tenga textos.":"Shared language module (src/idioma.js): the Spanish text is the key and src/idiomas/en.json gives the translation; Russian is prepared (empty ru.json) and will be offered as soon as it has texts.","Botón ES/EN arriba a la derecha en la construcción (v5) y en el combate (v5). Recuerda el idioma con la misma clave que la web: si eliges inglés en la web, el juego sale en inglés. Sin elección, manda el idioma del navegador.":"ES/EN button at the top right in building (v5) and combat (v5). It remembers the language with the same key as the website: if you choose English on the website, the game comes up in English. With no choice made, the browser language decides.","Traducidos todos los textos: botones, ayuda, avisos, motivos de la lógica, piezas, materiales, armas, heridas, registro de combate, pantalla final y decisiones (unos 290).":"All texts translated: buttons, help, warnings, logic messages, pieces, materials, weapons, wounds, combat log, end screen and decisions (about 290).","Cambiar de idioma recarga la página sin perder la partida guardada.":"Switching language reloads the page without losing the saved game.","En el móvil solo se ve el botón del otro idioma, para que el menú no crezca; el panel de opciones del combate baja para no tapar el menú.":"On mobile only the other language's button is shown, so the menu doesn't grow; the combat options panel moves down so it doesn't cover the menu.","Pruebas nuevas: prueba_idiomas.mjs (todo texto del código tiene traducción y las mismas variables) y prueba_idioma_navegador.py (PC y móvil, sin textos sin traducir ni palabras en español a la vista, el botón cambia, recuerda y no borra la partida). Las dos se rompieron a propósito una vez (MUTAR=1) y fallaron.":"New tests: prueba_idiomas.mjs (every text in the code has a translation with the same variables) and prueba_idioma_navegador.py (PC and mobile, no untranslated texts or visible Spanish words, the button switches, remembers and doesn't wipe the game). Both were broken on purpose once (MUTAR=1) and failed.","Decisión provisional: las pruebas de estilo y el personaje quedan en español hasta que valravnx revise el personaje (ninguna otra sesión toca su código); queda como tarea en espera.":"Provisional decision: the style tests and the character stay in Spanish until valravnx reviews the character (no other session touches its code); left as a waiting task.","Capturas de la construcción en capturas/construccion-v5.":"Building screenshots in capturas/construccion-v5.","Recursos de personaje v2: comprimidos y con las 39 animaciones extra":"Character assets v2: compressed and with the 39 extra animations","Todas correctas: construcción 46/46, modelos 21/21, combate 69/69, personaje horneado 11/11, textos traducidos, navegador de construcción, combate, estilo, personaje, recursos v2 (PC y móvil), inglés y web. La prueba de recursos falla a propósito con MUTAR=1 (12 fallos).":"All passing: building 46/46, models 21/21, combat 69/69, baked character 11/11, translated texts, browser tests for building, combat, style, character, v2 assets (PC and mobile), English and website. The assets test fails on purpose with MUTAR=1 (12 failures).","Recursos v2 del personaje: los mismos modelos de la v1, con la geometría y las animaciones comprimidas (meshopt) y las texturas en WebP. La v1 publicada no se toca.":"Character assets v2: the same models as v1, with geometry and animations compressed (meshopt) and textures in WebP. The published v1 is left untouched.","Un personaje (hombre campesino con pelo, barba y animaciones) baja 1,7 MB en vez de 8,1 MB; las animaciones, de 4,4 MB a 0,7 MB.":"One character (male peasant with hair, beard and animations) now downloads 1.7 MB instead of 8.1 MB; the animations go from 4.4 MB to 0.7 MB.","Las posiciones de los vértices no se comprimen: así la ropa, el pelo y la barba siguen compartiendo un solo esqueleto, como en la v3 del personaje.":"Vertex positions are not compressed, so clothes, hair and beard still share a single skeleton, as in character v3.","El cargador de personajes abre los archivos comprimidos y, si se le pide, las 39 animaciones extra (vendarse, arco, minar, campo, pesca, espada ligera y pesada, escudo, pasos en todas direcciones, trepar, tumbarse…), cada una con un nombre en español.":"The character loader opens the compressed files and, when asked, the 39 extra animations (bandaging, bow, mining, farming, fishing, light and heavy sword, shield, steps in every direction, climbing, lying down…), each with a Spanish name.","Cinco extra se llaman igual que una básica (bloqueo, escudo, comer, brazos cruzados, empujón): la básica se queda como estaba y la extra va aparte, para no cambiar nada sin querer.":"Five extra clips share a name with a basic one (block, shield, eating, folded arms, knockback): the basic one stays as it was and the extra one is kept separately, so nothing changes by accident.","Prueba nueva en navegador: la v2 se ve igual que la v1 (diferencia media menor de 1 sobre 255), mismos triángulos y esqueletos, y cada animación extra mueve el cuerpo. Hoja con las 39 poses en las capturas.":"New browser test: v2 looks the same as v1 (mean difference below 1 out of 255), same triangles and skeletons, and every extra animation moves the body. A sheet with all 39 poses is in the screenshots.","No se ha cambiado el prototipo del personaje (REVISION.md pide que solo lo toque la sesión del chat hasta que valravnx lo revise): pasarlo a la v2 y añadir el selector de animaciones queda como tarea en espera.":"The character prototype was not changed (REVISION.md asks that only the chat session touch it until valravnx reviews it): switching it to v2 and adding the animation picker is left as a waiting task.","No comprobado: cuánto tarda en bajar en un móvil real.":"Not checked: how long it takes to download on a real phone.","Taller MakeHuman: barba pintada, labios más finos y fotos de la cabeza entera":"MakeHuman workshop: painted beard, thinner lips and full-head shots","Prueba de taller, no publicada como versión jugable: dos personajes exportados y vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.":"Workshop test, not published as a playable version: two characters exported and viewed in Blender and in three.js with no console errors. Not checked: animations or mobile performance.","La barba ya no es una cáscara encima de la cara: va pintada en la piel, con bordes difusos y pelillos, y el bigote baja por las comisuras hasta unirse a la barba.":"The beard is no longer a shell on top of the face: it is painted on the skin, with soft edges and fine hairs, and the moustache runs down the mouth corners to join the beard.","Labios más finos y menos salidos (altura, profundidad y anchura de la boca). Medido: el ajuste de «volumen» de MakeHuman casi no cambia nada; lo que sirve es la altura y la profundidad.":"Thinner, less protruding lips (mouth height, depth and width). Measured: MakeHuman's «volume» setting barely changes anything; height and depth are what work.","Fallo de las fotos corregido (lo vio valravnx): el encuadre de la cara cortaba la barbilla. Ahora sale la cabeza entera, del pelo al cuello, en Blender y en three.js.":"Screenshot bug fixed (spotted by valravnx): the face framing cut off the chin. Now the whole head is shown, from hair to neck, in Blender and in three.js.","Con el encuadre nuevo se veían dos fallos que antes quedaban fuera, ya arreglados: un hueco oscuro en el escote de la túnica y el borde dentado de la toca.":"The new framing showed two flaws that were previously out of shot, now fixed: a dark gap in the tunic neckline and the jagged edge of the wimple.","Personaje v5: el personaje del taller propio ya se mueve":"Character v5: the workshop character now moves","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.":"All tests pass (logic, building, combat, style, character, assets, English and web), on PC and mobile. Not checked: fps on a real phone.","Las animaciones de Quaternius se pasan al esqueleto de MakeHuman con un programa propio: el reposo de MakeHuman (brazos en «A») se lleva a la postura del original y en cada fotograma se copia el giro de cada hueso respecto a su reposo; la pelvis copia también los botes, escalados por la altura.":"The Quaternius animations are transferred to the MakeHuman skeleton with our own program: the MakeHuman rest pose (arms in an «A») is brought to the original's pose, and each frame copies every bone's rotation relative to its rest; the pelvis also copies the bobbing, scaled by height.","Probado con las nueve animaciones que usa el juego: quieto, andar, correr, talar, en guardia, golpe, parar, andar cargando y recoger. Los dos personajes las hacen bien, también la mujer con el vestido.":"Tested with the nine animations the game uses: idle, walk, run, chop, guard, strike, parry, walk carrying and gather. Both characters perform them well, including the woman in the dress.","Personaje v5 publicado: en el visor hay una opción nueva, «Base del personaje», para elegir entre el paquete de Quaternius y el taller propio y compararlos.":"Character v5 published: the viewer has a new option, «Character base», to choose between the Quaternius pack and the own workshop and compare them.","Cada personaje del taller pesa unos 530 KB con ropa, texturas y animaciones (comprimido con WebP y meshopt) y tiene unos 19 mil triángulos.":"Each workshop character weighs about 530 KB with clothing, textures and animations (compressed with WebP and meshopt) and has about 19 thousand triangles.","Pruebas nuevas del taller en el visor: carga, se ve el cuerpo y la cara, y al andar se mueven piernas y brazos. Rotas a propósito: fallan como deben.":"New workshop tests in the viewer: it loads, the body and face are visible, and legs and arms move when walking. Broken on purpose: they fail as they should.","Personaje v6: arreglada la ropa del taller vista del revés":"Character v6: fixed the workshop clothing shown inside out","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.":"All tests pass (logic, building, combat, style, character, assets, English and web), on PC and mobile.","Fallo que vio valravnx en la v5: en calidad alta la túnica, el vestido, el pelo y la cofia del taller propio se veían del revés, con manchas, y el pelo desaparecía.":"Bug valravnx spotted in v5: on high quality the workshop's tunic, dress, hair and coif looked inside out and blotchy, and the hair vanished.","Causa: el cargador de modelos apaga la escritura de profundidad en los materiales con transparencia; al pasarlos a recorte no se volvía a encender, y la piel se pintaba encima. En calidad ligera no pasaba, y las pruebas solo miraban esa.":"Cause: the model loader turns off depth writing on transparent materials; when switching them to alpha cutout it was not turned back on, so the skin was drawn on top. It did not happen on light quality, and the tests only checked that one.","Arreglado y con prueba nueva: en calidad alta todo el personaje del taller tiene que escribir profundidad. Rota a propósito: falla como debe.":"Fixed, with a new test: on high quality the whole workshop character must write depth. Broken on purpose: it fails as it should.","Revisadas las capturas de los dos personajes en calidad alta, en PC y en móvil.":"Screenshots of both characters on high quality reviewed, on PC and mobile.","Personaje v7: postura y pecho del taller propio":"Character v7: posture and chest of the workshop character","valravnx: el hombre marcaba pecho, el cuerpo iba doblado hacia delante y los hombros muy para atrás.":"valravnx: the man showed a bust, the body was bent forward and the shoulders were too far back.","Causa de la postura: las animaciones del paquete llevan el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atrás, a juego con sus muñecos de cabeza grande; además, al igualar la pelvis y las clavículas a las del paquete, la cadera se giraba 35° y los hombros se iban atrás.":"Cause of the posture: the pack's animations have the torso and neck leaning forward and the arms hanging backwards, to suit its big-headed figures; also, matching the pelvis and clavicles to the pack's turned the hips 35° and pushed the shoulders back.","Arreglo: solo los brazos se igualan al paquete; la inclinación del tronco, el cuello y las clavículas se mide en la animación de estar quieto y se quita en todas (queda un 30 %); y los brazos se giran desde el hombro para colgar rectos.":"Fix: only the arms are matched to the pack; the lean of the torso, neck and clavicles is measured in the idle animation and removed from all of them (30% is kept); and the arms are rotated from the shoulder to hang straight.","La túnica del hombre se alisa en el pecho para que caiga como tela, sin meterse dentro del cuerpo.":"The man's tunic is smoothed over the chest so it falls like cloth, without going inside the body.","Recursos nuevos en recursos/personajes/taller-v2 (los de la v1 publicada no se tocan).":"New assets in recursos/personajes/taller-v2 (the published v1 ones are not touched).","Prueba nueva de postura: cabeza y hombros sobre la pelvis y brazos sin irse atrás. Con los modelos de la v6 falla, como debe.":"New posture test: head and shoulders over the pelvis and arms not going back. With the v6 models it fails, as it should.","Decisión de valravnx: el taller propio es la base de los personajes":"valravnx's decision: the own workshop is the base for the characters","Sin cambios de código.":"No code changes.","valravnx, tras ver el personaje v7: «lo veo bien, sigue», y elige el taller propio (cuerpo de MakeHuman con ropa hecha por código) como base de los personajes del juego. El paquete de Quaternius queda solo para comparar y como fuente de animaciones.":"valravnx, after seeing character v7: «looks good, carry on», and he chooses the own workshop (MakeHuman body with clothing made by code) as the base for the game's characters. The Quaternius pack stays only for comparison and as a source of animations.","Se cierran las decisiones del personaje y de la ropa: la ropa histórica se hace por código en el taller; no hace falta comprar paquetes ni encargarla.":"The character and clothing decisions are closed: historical clothing is made by code in the workshop; there is no need to buy packs or commission it.","Las tareas del hito de arte se rehacen para el taller, de una sesión cada una: ropa por capas (camisa y gambesón; cota de malla y sobreveste; capa, calzado y tocados), personalización, más peinados y barbas, las 39 animaciones extra, ropa fabricable y heridas visibles.":"The art milestone's tasks are redone for the workshop, one session each: layered clothing (shirt and gambeson; mail and surcoat; cloak, footwear and headwear), customization, more hairstyles and beards, the 39 extra animations, craftable clothing and visible wounds.","Personaje v8: ropa por capas en el taller propio":"Character v8: layered clothing in the own workshop","Primera tanda de ropa por capas hecha por código sobre el cuerpo de MakeHuman: camisa de lino (en la mujer, larga hasta los tobillos), calzas y zapatos siempre puestos; encima túnica (hombre) o vestido (mujer); y sobre todo, el gambesón acolchado, con los canales cosidos pintados en vertical en el cuerpo y en anillos en las mangas.":"First batch of layered clothing made by code on the MakeHuman body: linen shirt (on the woman, long to the ankles), hose and shoes always on; over them a tunic (man) or dress (woman); and on top, the padded gambeson, with its stitched channels painted vertically on the body and in rings on the sleeves.","Cada capa va algo más separada de la piel que la de debajo, y lo que queda tapado del todo no se dibuja: el cuerpo de una prenda se esconde si lleva otra encima y su falda solo asoma si es más larga. Así no se atraviesan al moverse y se ahorran triángulos (unos 16 a 20 mil por personaje según lo que lleve).":"Each layer sits a little further from the skin than the one below, and whatever is fully covered is not drawn: a garment's body is hidden if another is worn over it, and its skirt only shows if it is longer. That way they do not clip through when moving and triangles are saved (about 16 to 20 thousand per character depending on what it wears).","Un cinturón por capa; solo se ve el de la capa de más fuera.":"One belt per layer; only the outermost layer's belt is shown.","En el visor, botones «Túnica», «Vestido» y «Gambesón» para poner y quitar capas. El taller propio sale por defecto.":"In the viewer, «Tunic», «Dress» and «Gambeson» buttons to put layers on and take them off. The own workshop is the default.","Arreglos vistos en las capturas: las calzas asomaban por la camisa y el vestido por la tripa del gambesón; ya no.":"Fixes spotted in the screenshots: the hose poked through the shirt and the dress through the gambeson's belly; no longer.","Pruebas nuevas: el gambesón se pone encima y tapa el cuerpo de la prenda de debajo, y al quitarlo vuelve como estaba; el taller sale por defecto. Rotas a propósito: fallan.":"New tests: the gambeson goes on top and hides the body of the garment below, and taking it off restores it; the workshop is the default. Broken on purpose: they fail.","Hito 1c: planificación de las piezas nuevas":"Milestone 1c: planning the new pieces","Sin cambios de código. Web reconstruida sin errores.":"No code changes. Website rebuilt without errors.","valravnx, por el chat: «puedes hacer, están haciendo los modelados de ropa; haz algo no relacionado». Elige planificar el hito de construcción, que no toca el personaje. Se hace aunque el hito de arte bloquee empezar hitos nuevos, porque lo pide él.":"valravnx, in the chat: «you can work, they are doing the clothing models; do something unrelated». He chooses planning the building milestone, which does not touch the character. It is done even though the art milestone blocks starting new milestones, because he asks for it.","Comparadas las piezas del documento de sistemas con las que ya hay en el juego. Faltan: escalera de tablas, contraventana, trampilla, tejado de teja, remate de tejado, chimenea, adarve, puente de troncos y parte de la decoración.":"Compared the pieces in the systems document with those already in the game. Missing: plank staircase, shutter, trapdoor, tile roof, roof finishing, chimney, wall walk, log bridge and part of the decoration.","Hito desglosado en 9 tareas de una sesión: escalera de tablas, barandillas y vallas, contraventana y trampilla, tejado de teja, remate de tejado, chimenea, adarve, decoración que falta y revisión final.":"Milestone broken down into 9 one-session tasks: plank staircase, railings and fences, shutter and trapdoor, tile roof, roof finishing, chimney, wall walk, missing decoration and final review.","Los puentes de troncos se dejan para el hito Mundo, porque necesitan agua en el mapa.":"Log bridges are left for the World milestone, because they need water on the map.","Esta sesión no toca proyecto/sesion.json, que es de la sesión de la ropa.":"This session does not touch proyecto/sesion.json, which belongs to the clothing session.","Decisiones de valravnx: estilo, cámara táctil, curación y fuego amigo":"valravnx's decisions: style, touch camera, healing and friendly fire","Estilo del mundo: el «realismo en miniatura» de la prueba de estilo v5 es la base. Se desbloquean terreno, hierba, árboles, más detalle en las piezas de construcción y el rendimiento en el móvil.":"World style: the «miniature realism» of style test v5 is the base. Terrain, grass, trees, more detail in the building pieces and mobile performance are unblocked.","Cámara táctil en el combate: arrastrar un dedo por zona libre gira la cámara, tocar sin arrastrar sigue golpeando, y con el arco la cámara sigue sola a donde apuntas.":"Touch camera in combat: dragging a finger on a free area turns the camera, tapping without dragging still strikes, and with the bow the camera follows wherever you aim.","Curación: base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso); en pleno combate se puede, pero lento y quedando vendido.":"Healing: the analysis table is the base (bandaging, stitching, cauterizing, splinting, herbs, rest); it can be done mid-fight, but slowly and leaving you exposed.","Fuego amigo: sigue al PvP, como dice el diseño (PvP activo, desactivado dentro de la familia): a alguien de tu familia un tajo no le hace nada; a cualquier otro le hiere como un golpe normal.":"Friendly fire: follows PvP, as the design says (PvP on, off within the family): a strike does nothing to a member of your family; anyone else is wounded like a normal hit.","Ya no queda ninguna decisión pendiente: todas las tareas en espera pasan a pendientes.":"No decisions are pending any more: all waiting tasks become pending.","Personaje v9: cota de malla y sobreveste":"Character v9: mail and surcoat","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. Unos 1,5 MB por personaje con todas las prendas. No comprobado: fps en un móvil de verdad.":"All tests pass (logic, building, combat, style, character, assets, English and web), on PC and mobile. About 1.5 MB per character with all garments. Not checked: fps on a real phone.","Cota de malla como capa, sobre el gambesón: hasta la rodilla, mangas hasta medio antebrazo (asoma el gambesón por debajo) y anillas pintadas por código en filas cruzadas, del mismo tamaño en el cuerpo, las mangas y la falda.":"Mail as a layer over the gambeson: to the knee, sleeves to mid-forearm (the gambeson shows below) and rings painted by code in staggered rows, the same size on the body, sleeves and skirt.","El metal va a medias: sin reflejos del entorno, el metal puro salía casi negro en el juego.":"The metal is only partly metallic: without environment reflections, pure metal came out almost black in the game.","Sobreveste sin mangas de lana teñida, por encima de todo, hasta media pierna (en la mujer, hasta los tobillos).":"Sleeveless surcoat of dyed wool over everything, to mid-leg (on the woman, to the ankles).","Cada prenda va ahora partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota y del gambesón; las mangas de debajo solo se dibujan si asoman.":"Each garment is now split into body, sleeves and skirt: the surcoat lets the sleeves and collar of the mail and gambeson show; the sleeves below are drawn only if they show.","Arreglos vistos en las capturas: con la cota se abrían agujeros en lo alto de los hombros (el corte del cuello llegaba hasta ahí) y quedaban huecos entre el cuerpo y las mangas; ya no.":"Fixes spotted in the screenshots: with mail, holes opened on top of the shoulders (the neckline cut reached there) and gaps were left between body and sleeves; no longer.","Prueba nueva: con la sobreveste se ven las mangas y el cuello de la cota. Rota a propósito: falla.":"New test: with the surcoat the mail's sleeves and collar are visible. Broken on purpos
