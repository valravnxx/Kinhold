<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinhold · desarrollo</title>
<style>
:root{
  --fondo:#1b1712; --panel:#26201a; --panel2:#30281f; --tinta:#f1e8d8; --suave:#bfb19a; --tenue:#8c806d;
  --acento:#d9a441; --verde:#7ccf86; --rojo:#e0574f; --azul:#7fb2d9; --naranja:#e89a3c; --linea:rgba(241,232,216,.12);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acento)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.01em}
.envoltura{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:38px;color:var(--acento)}
header p{margin:2px 0 0;color:var(--suave)}
#resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.dato{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.dato b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.dato span{color:var(--suave);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--fondo);display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--linea);overflow-x:auto}
nav button{font:inherit;color:var(--suave);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.sel{background:var(--panel2);color:var(--tinta);font-weight:600}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--acento);color:#241b10;font-size:12px;font-weight:700}
section{display:none;padding-top:18px} section.sel{display:block}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tarjeta img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.tarjeta .cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tarjeta h3{margin:0;font-size:20px}
.tarjeta p{margin:0;color:var(--suave);font-size:14px}
.boton{display:inline-block;text-align:center;background:var(--acento);color:#241b10;font-weight:700;text-decoration:none;padding:10px 14px;border-radius:10px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;color:var(--tinta);background:var(--panel2);border:1px solid var(--linea);border-radius:9px;padding:7px 9px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--suave);white-space:nowrap}
.chip.hecho{background:rgba(124,207,134,.16);color:var(--verde)}
.chip.en_curso{background:rgba(127,178,217,.16);color:var(--azul)}
.chip.revision{background:rgba(217,164,65,.2);color:var(--acento)}
.chip.espera_decision{background:rgba(232,154,60,.16);color:var(--naranja)}
.chip.fallo{background:rgba(224,87,79,.16);color:var(--rojo)}
.hito{background:var(--panel);border:1px solid var(--linea);border-radius:12px;margin-bottom:10px}
.hito > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.hito > summary::-webkit-details-marker{display:none}
.hito .num{font-family:Georgia,serif;font-size:20px;color:var(--tenue);text-align:center}
.hito.activo{border-color:rgba(127,178,217,.5)}
.hito h3{margin:0;font-size:17px}
.barra{height:6px;border-radius:3px;background:rgba(241,232,216,.08);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:3px}
.hito .det{padding:0 14px 14px 68px;color:var(--suave);font-size:14px}
.hito ul{margin:8px 0 0;padding:0;list-style:none}
.hito li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:5px 0;border-top:1px solid var(--linea);color:var(--tinta)}
.hito li em{font-style:normal;color:var(--tenue);font-size:12.5px;white-space:nowrap}
.entrada{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.entrada h3{margin:0 0 2px;font-size:17px}
.entrada .meta{color:var(--tenue);font-size:13px}
.entrada ul{margin:8px 0;padding-left:18px}
.entrada li{margin:3px 0}
.miniaturas{display:flex;gap:6px;overflow-x:auto;padding-top:4px}
.miniaturas a{flex:0 0 auto}
.miniaturas img{height:84px;border-radius:7px;display:block;border:1px solid var(--linea)}
.decision{background:var(--panel);border:1px solid rgba(232,154,60,.35);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.decision .meta{color:var(--tenue);font-size:13px;margin-top:4px}
.nota{color:var(--suave);font-size:14px;background:var(--panel);border-radius:12px;padding:12px 14px;border:1px dashed var(--linea)}
.docs a{display:block;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--tinta)}
.docs a span{display:block;color:var(--suave);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-bottom:1px solid var(--linea);text-align:left}
th{color:var(--suave);font-weight:600}
td.n{text-align:right}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:12px;z-index:20}
#visor img{max-width:100%;max-height:100%;border-radius:8px}
[hidden]{display:none!important}
footer{color:var(--tenue);font-size:13px;margin-top:30px}
#idiomas{display:flex;gap:4px}
#idiomas button{font:inherit;font-size:12.5px;font-weight:700;color:var(--suave);background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:4px 9px;cursor:pointer}
#idiomas button.sel{background:var(--acento);color:#241b10;border-color:transparent}
.derecha{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:640px){
  header h1{font-size:30px}
  #resumen{grid-template-columns:repeat(2,1fr)}
  .hito > summary{grid-template-columns:32px 1fr;}
  .hito > summary .chip{grid-column:2;justify-self:start}
  .hito .det{padding-left:14px}
  .derecha{align-items:flex-start}
}
</style>
</head>

</div>

const DATOS = {"roadmap":{"hitos":[{"id":"infra","num":"0","nombre":"Infraestructura","jugable":"Repositorio en GitHub, web de progreso y trabajo automático por horas.","estado":"en_curso","tareas":[{"nombre":"Repositorio, web de progreso y tarea programada","estado":"hecho","fin":"2026-10-24T18:19:37+02:00","inicio":"2026-10-24T18:04:00+02:00"},{"nombre":"Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos","estado":"hecho","inicio":"2026-10-24T22:06:00+02:00","fin":"2026-10-24T22:11:29+02:00"},{"nombre":"Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma","estado":"hecho","inicio":"2026-10-24T22:19:24+02:00","fin":"2026-10-24T22:43:43+02:00"},{"nombre":"Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso","estado":"pendiente"}],"nota":"Idiomas: español e inglés ya en la web; el ruso, más adelante, cuando Pedro lo pida."},{"id":"construccion","num":"1","nombre":"Construcción","jugable":"Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.","estado":"hecho","tareas":[{"nombre":"Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada","estado":"hecho"},{"nombre":"Piezas low-poly por código y personaje","estado":"hecho"},{"nombre":"Cámara libre y controles PC y táctil","estado":"hecho"},{"nombre":"v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente","estado":"hecho"},{"nombre":"v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)","estado":"hecho"}],"nota":"Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron)."},{"id":"arte","num":"1b","nombre":"Dirección de arte y personajes","estado":"en_curso","jugable":"Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.","nota":"Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.","tareas":[{"nombre":"Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que Pedro elija","estado":"hecho","inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00"},{"nombre":"Rehacer las pruebas de estilo (revisión de Pedro: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio","estado":"hecho","inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00"},{"nombre":"Prueba de estilo v3, «maqueta en miniatura» (elegido por Pedro): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto","estado":"hecho","inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00"},{"nombre":"Prueba de estilo v4, «realismo en miniatura» (pedido por Pedro): la v3 con texturas por código y el mundo sin recortar","estado":"hecho","inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00"},{"nombre":"Prueba de estilo v5: árboles rehechos (Pedro: «los árboles fatal, se ven como rayajos raros; la casa está bien»)","estado":"hecho","inicio":"2026-10-24T20:53:26+02:00","fin":"2026-10-24T21:01:31+02:00"},{"nombre":"Personaje nuevo por código (decidido por Pedro), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas","estado":"hecho","inicio":"2026-10-24T21:19:25+02:00","fin":"2026-10-24T21:41:55+02:00"},{"nombre":"Personaje base articulado con el estilo elegido (también el rival del combate)","estado":"espera_decision"},{"nombre":"Personalización del personaje: complexión, cara, pelo, barba, tono de piel","estado":"espera_decision"},{"nombre":"Ropa y armaduras visibles por capas: lino, gambesón, cota de malla","estado":"espera_decision"},{"nombre":"Terreno, hierba, árboles y luz con el estilo elegido","estado":"espera_decision"},{"nombre":"Piezas de construcción con más detalle: corteza, juntas, tablas, paja","estado":"espera_decision"},{"nombre":"Rendimiento en móvil: medir y ajustar el nivel de detalle","estado":"espera_decision"},{"nombre":"Revisión completa y publicación","estado":"espera_decision"}],"bloquea":true},{"id":"construccion-mas","num":"1c","nombre":"Más piezas de construcción","jugable":"Escaleras de caminar de un bloque, barandillas, vallas y más piezas para que construir dé juego.","estado":"pendiente","tareas":[{"nombre":"Más resistencia en la madera (Pedro: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa","estado":"hecho","inicio":"2026-10-24T22:16:00+02:00","fin":"2026-10-24T22:32:23+02:00"},{"nombre":"Planificar el hito: lista de piezas sacada del GDD y del documento de sistemas","estado":"pendiente"}],"nota":"La primera tarea (madera más resistente) se adelantó el 24 oct porque la casa de dos plantas de Pedro y su pareja no admitía el tejado en las esquinas."},{"id":"equipo","num":"2","nombre":"Equipo y carga por huecos","jugable":"Panel de inventario, cinturones, leñero y otras mochilas; tala, transporte y ralentización por cargar.","estado":"pendiente","tareas":[]},{"id":"crafting","num":"3","nombre":"Estaciones y crafting","jugable":"Primeras estaciones, recetas, desbloqueo por práctica, durabilidad y reparación.","estado":"pendiente","tareas":[]},{"id":"supervivencia","num":"4","nombre":"Supervivencia","jugable":"Necesidades con avisos, ropa contra el frío, cama ligada y muerte con saqueo parcial.","estado":"pendiente","tareas":[]},{"id":"duelo","num":"5","nombre":"Duelo","jugable":"Esgrima contra un bot con heridas.","estado":"en_curso","tareas":[{"nombre":"Combate v1: líneas de golpe, guardias, heridas, arco","estado":"hecho"},{"nombre":"Combate v2: rosa de golpes, parada perfecta, golpe maestro, fintas, peso de los golpes","estado":"hecho"},{"nombre":"Arreglo del arco: no soltar antes del 50% de tensión, correr cancela el tensado, 0,8 s para encajar otra flecha (piedras 0,5 s), con pruebas","estado":"hecho","inicio":"2026-10-24T19:13:50+02:00","fin":"2026-10-24T19:23:09+02:00"},{"nombre":"Escudo provisional: opción «Espada y escudo» (espada de una mano), para flechas y piedras de frente, parada más barata, se ve en el brazo izquierdo y se levanta al parar; también para el rival","estado":"hecho","inicio":"2026-10-24T20:20:27+02:00","fin":"2026-10-24T20:36:27+02:00"},{"nombre":"Cámara táctil con un dedo durante el combate","estado":"espera_decision"},{"nombre":"Curación de heridas","estado":"espera_decision"}],"nota":"El campo de pruebas de combate se adelantó para probar el sistema antes del resto. v1 y v2 hechas el 24 oct entre las 16:45 y las 17:25 aprox."},{"id":"asedio","num":"6","nombre":"Asedio, fuego y mantenimiento","jugable":"Ariete, daño por fuego, mojón con materiales.","estado":"pendiente","tareas":[]},{"id":"fauna","num":"7","nombre":"Fauna y caza","jugable":"Animales realistas.","estado":"pendiente","tareas":[]},{"id":"caballos","num":"8","nombre":"Caballos","jugable":"Domar, montar, cuadra y pasto.","estado":"pendiente","tareas":[]},{"id":"granja","num":"9","nombre":"Granja y estaciones del año","jugable":"Siembras por franja, ganado.","estado":"pendiente","tareas":[]},{"id":"mundo","num":"10","nombre":"Mundo","jugable":"Pseudo-Europa por semilla, 5 países con estilo propio, caminos por uso, puentes.","estado":"pendiente","tareas":[]},{"id":"servidor","num":"11","nombre":"Servidor y cuentas","jugable":"Registro e inicio de sesión seguros, recuperación de cuenta, creación de personaje, mundo persistente con servidor autoritativo.","estado":"pendiente","tareas":[],"nota":"Prioridad alta. Contraseñas con hash, conexión cifrada, límite de intentos, copias de seguridad."},{"id":"admin","num":"11b","nombre":"Administración, registros y seguridad","estado":"pendiente","jugable":"Roles (jugador, moderador, administrador) para la cuenta de Pedro y las que él decida; panel de administración; registros consultables de lo que pasa en el mundo (comercio, saqueos, construcción y destrucción, muertes, conexiones); detección de trampas en el servidor (velocidad, alcance, acciones imposibles); sanciones (aviso, silencio, expulsión, bloqueo) y registro de lo que hace cada administrador.","nota":"Prioridad alta: es un juego online persistente. Desde ya, toda acción que cambia el mundo pasa por la lógica con autor, para poder registrarla después.","tareas":[]},{"id":"pvp","num":"12","nombre":"PvP online y protección offline","jugable":"Combate y asedio entre jugadores; reglas de guerra.","estado":"pendiente","tareas":[]},{"id":"tierras","num":"13","nombre":"Tierras y familias","jugable":"Mojones, radio de exclusión, peajes, conquista, familias, vasallajes, alianzas, escudos de armas.","estado":"pendiente","tareas":[]},{"id":"economia","num":"14","nombre":"Economía y NPCs","jugable":"Encargos y moneda, puestos sin conexión, tomos, NPCs ambulantes a sueldo, centinelas y mensajeros.","estado":"pendiente","tareas":[]},{"id":"distancia","num":"15","nombre":"Combate a caballo y a distancia","jugable":"Arcos, ballestas, lanzas de caballería.","estado":"pendiente","tareas":[]},{"id":"navegacion","num":"16","nombre":"Navegación","jugable":"Astillero, barcos, navegar con otros.","estado":"pendiente","tareas":[]},{"id":"cartografia","num":"17","nombre":"Cartografía","jugable":"Mesa de cartógrafo y mapas como objetos.","estado":"pendiente","tareas":[]}],"prototipos":[{"id":"construccion","nombre":"Construcción","descripcion":"Construye una cabaña: cimientos, suelos, muros, tejados y muebles, con límite de carga.","versiones":[{"v":"v3","fecha":"2026-10-24","archivo":"jugar/construccion/v3.html","capturas":"capturas/construccion-v3","notas":"Muros exactos a 2,5 m por hiladas."},{"v":"v4","fecha":"2026-10-24","archivo":"jugar/construccion/v4.html","capturas":"capturas/construccion-v4","notas":"Madera más resistente: casa de 2 plantas con tejado de troncos; vano de una casilla en suelos y tejados."}]},{"id":"combate","nombre":"Combate","descripcion":"Campo de pruebas: duelo con espada o palo, prácticas con poste y dianas, carga a distancia.","versiones":[{"v":"v2","fecha":"2026-10-24","archivo":"jugar/combate/v2.html","capturas":"capturas/combate-v2","notas":"Rosa de golpes y defensa en tres capas."},{"v":"v3","fecha":"2026-10-24","archivo":"jugar/combate/v3.html","capturas":"capturas/combate-v3","notas":"Arco arreglado: tensión mínima, sin tensar corriendo y 0,8 s para encajar flecha."},{"v":"v4","fecha":"2026-10-24","archivo":"jugar/combate/v4.html","capturas":"capturas/combate-v4","notas":"Escudo provisional: nueva arma «Espada y escudo» (espada de una mano, 1,7 m de alcance). Al parar se levanta el escudo, que detiene también flechas y piedras de frente y cansa menos que parar con la espada. Nueva opción «Arma del rival»: el rival con escudo lo levanta cuando le apuntas."}]},{"id":"estilo","nombre":"Prueba de estilo","descripcion":"Cabaña en un claro con el estilo propuesto: realismo en miniatura.","versiones":[{"v":"v1","fecha":"2026-10-24","archivo":"jugar/estilo/v1.html","capturas":"capturas/estilo-v1","notas":"Tres estilos (A plano, B suave, C texturas) con cabaña y personaje: elige uno."},{"v":"v2","fecha":"2026-10-24","archivo":"jugar/estilo/v2.html","capturas":"capturas/estilo-v2","notas":"Un solo estilo estilizado y ligero: 30 mil triángulos y 12 dibujados, sin personaje (espera tu decisión)."},{"v":"v3","fecha":"2026-10-24","archivo":"jugar/estilo/v3.html","capturas":"capturas/estilo-v3","notas":"Maqueta en miniatura: formas redondeadas, luz suave, sombras de contacto y desenfoque; zócalo de piedra continuo."},{"v":"v4","fecha":"2026-10-24","archivo":"jugar/estilo/v4.html","capturas":"capturas/estilo-v4","notas":"Realismo en miniatura: la maqueta con texturas por código y el mundo sin recortar."},{"v":"v5","fecha":"2026-10-24","archivo":"jugar/estilo/v5.html","capturas":"capturas/estilo-v5","notas":"Árboles rehechos: copas suaves en racimos y pinos con puntas, sin rayajos."},{"v":"v6","fecha":"2026-10-24","archivo":"jugar/estilo/v6.html","capturas":"capturas/estilo-v6","notas":"Personaje por código: una sola malla con esqueleto, quieto y andando; vistas Personaje y Cara"}]}],"decisiones_pendientes":[{"id":"estilo-v4","pregunta":"¿Te vale como base el «realismo en miniatura» de la prueba de estilo v5 (texturas, mundo sin recortar y árboles rehechos)? Mírala también en tu móvil (arriba salen fps y resolución).","desde":"2026-10-24","hito":"arte"},{"id":"camara-tactil","pregunta":"Cámara táctil: ¿arrastrar un dedo en zona libre gira la cámara (tocar sin arrastrar sigue golpeando) y con el arco la cámara sigue sola a donde apuntas?","desde":"2026-10-24","hito":"duelo"},{"id":"curacion","pregunta":"Curación: ¿se usa como base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso)? ¿Curarse en pleno combate debe poder hacerse (lento y vendido) o solo fuera?","desde":"2026-10-24","hito":"duelo"},{"id":"fuego-amigo","pregunta":"Fuego amigo en peleas de grupo: ¿un tajo que alcanza a un aliado le hiere, no le hace nada o solo le empuja? (Propuesta: hiere.)","desde":"2026-10-24","hito":"pvp"},{"id":"personaje-v6","pregunta":"¿Te vale como base el personaje de la prueba de estilo v6 (todo por código, una sola malla con esqueleto, quieto y andando)? Míralo en las vistas «Personaje» y «Cara» y dime qué cambiarías (cara, pelo, proporciones).","desde":"2026-10-24","hito":"arte"}]},"diario":[{"inicio":"2026-10-24T15:55:00+02:00","fin":"2026-10-24T16:40:00+02:00","aprox":true,"titulo":"Hito 1: construcción (v1 a v3)","hito":"construccion","hecho":["Rejilla anclada a la primera pieza, módulo de 2 m × 2,5 m, apoyos y reparto de carga.","Desmontaje en cascada con 75% de recuperación, bloqueado si sobrecarga otra pieza.","v2: los muros se rellenan hasta el tejado y los tejados seguidos forman una pendiente continua.","v3: muros de 10 hiladas de 25 cm, todos exactos a 2,5 m."],"pruebas":"Lógica 35/35, modelos 21/21, navegador PC y móvil correctos.","capturas":"capturas/construccion-v3","estado":"ok"},{"inicio":"2026-10-24T16:45:00+02:00","fin":"2026-10-24T17:25:00+02:00","aprox":true,"titulo":"Campo de pruebas de combate v1 y v2","hito":"duelo","hecho":["v1: cinco líneas de golpe, guardias, heridas por zona sin barras de vida, arco con balística.","Comparado con juegos de esgrima de referencia: la v1 era poco intuitiva (arrastrar para golpear, elegir lado al parar, cámara a su aire).","v2: rosa de golpes sobre el rival, parada sin lado + parada perfecta + golpe maestro, fintas, aliento.","Movimiento encarado (los lados rodean al rival), cámara con margen, pausa de impacto, chispas, sangre, sonido y estela.","Dificultad = ritmo + ayudas: aprendiz (lento, con avisos), normal, realista (sin avisos)."],"pruebas":"Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.","capturas":"capturas/combate-v2","estado":"ok"},{"inicio":"2026-10-24T18:04:00+02:00","fin":"2026-10-24T18:19:37+02:00","titulo":"Infraestructura: repositorio, web de progreso y trabajo automático","hito":"infra","hecho":["Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso."],"pruebas":"Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:36:00+02:00","fin":"2026-10-24T18:37:25+02:00","titulo":"Alcance del proyecto: arte y seguridad al roadmap","hito":"infra","hecho":["Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil."],"pruebas":"Web regenerada y probada en PC y móvil.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00","titulo":"Hito 1b: tres pruebas de estilo","hito":"arte","hecho":["Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil."],"pruebas":"Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v1","estado":"ok"},{"inicio":"2026-10-24T19:13:50+02:00","fin":"2026-10-24T19:23:09+02:00","titulo":"Hito 5: arreglo del arco (combate v3)","hito":"duelo","hecho":["Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.","capturas":"capturas/combate-v3","estado":"ok"},{"inicio":"2026-10-24T17:20:03+00:00","fin":"2026-10-24T17:44:04+00:00","titulo":"Sesión duplicada: arreglo del arco hecho dos veces","hito":"duelo","hecho":["Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen."],"pruebas":"No aplica (trabajo descartado).","capturas":"","estado":"fallo"},{"inicio":"2026-10-24T19:23:09+02:00","fin":"2026-10-24T19:24:41+02:00","titulo":"Revisión de las pruebas de estilo: investigación y replanteo","hito":"arte","hecho":["Pedro: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido."],"pruebas":"Sin cambios de código en esta parte.","capturas":null,"estado":"ok","aprox":true},{"inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00","titulo":"Hito 1b: prueba de estilo v2, ligera y estilizada","hito":"arte","hecho":["Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v2","estado":"ok"},{"inicio":"2026-10-24T20:20:27+02:00","fin":"2026-10-24T20:36:27+02:00","titulo":"Hito 5: escudo provisional (combate v4)","hito":"duelo","hecho":["Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.","Los guardados de opciones anteriores siguen valiendo: si no tienen arma del rival, se usa «Como la tuya»."],"pruebas":"Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos","capturas":"capturas/combate-v4","estado":"ok"},{"inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00","titulo":"Hito 1b: prueba de estilo v3, maqueta en miniatura","hito":"arte","hecho":["Tu revisión de la v2: recordaba a juegos gratuitos de motor genérico y las piedras del cimiento se veían sueltas. Elegiste «maqueta en miniatura».","La escena es un pedazo de tierra redondo con el corte de tierra visto, sobre fondo liso con degradado. Cámara de teleobjetivo y desenfoque arriba y abajo (se puede quitar).","Formas redondeadas: cantos suaves, troncos con puntas abombadas, tejado de paja en tres hiladas gruesas, copas redondas, matorrales y flores de colores apagados.","Zócalo de piedra continuo: núcleo de mortero con dos hiladas de piedras bien juntas.","Luz suave, sombras de bordes blandos y sombras de contacto horneadas en el suelo.","Medido: 47 mil triángulos (con la pasada de sombra) y 6 dibujados. Subido el presupuesto de 30 a 50 mil por los cantos redondeados; los dibujados bajan de 12 a 6.","Decidido por ti en el chat: los personajes se hacen por código. La tarea del personaje pasa a pendiente.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v3 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v3","estado":"ok"},{"inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00","titulo":"Hito 1b: prueba de estilo v4, realismo en miniatura","hito":"arte","hecho":["Tu revisión de la v3: te gusta, pero el mundo no estará recortado; pediste probar el «realismo en miniatura» con algo de textura.","Texturas hechas por código, en gris, que dan detalle y relieve: veta, anillos de los cortes, paja en hebras, piedra, corteza, hojas y suelo. El color sigue saliendo de la paleta.","Las texturas van a escala real: la veta sigue el largo de cada tronco y tabla, la paja baja por la pendiente y los anillos se centran en cada corte.","El suelo sigue con lomas hasta el horizonte, con bosque lejano instanciado y niebla del color del cielo.","Medido: 47 mil triángulos y 21 dibujados (una malla por textura), dentro del presupuesto de 50 mil y 60.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v4 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v4","estado":"ok"},{"inicio":"2026-10-24T20:53:26+02:00","fin":"2026-10-24T21:01:31+02:00","titulo":"Hito 1b: prueba de estilo v5, árboles rehechos","hito":"arte","hecho":["Tu revisión de la v4: la casa bien, los árboles fatal, con rayajos raros.","Causa: la textura de hojas se proyectaba cara a cara sobre las copas y salían trazos cortados en cada cara.","Copas nuevas: bolas suaves con bultos, como racimos, más claras arriba y oscuras por dentro, con una textura de manchas redondas que envuelve la copa sin costuras.","Pinos: cada piso acaba en puntas caídas, como ramas, en vez de un cono liso.","Medido: 49 mil triángulos y 21 dibujados (algo menos de hierba para no pasar de 50 mil)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v5 y web: todo correcto.","capturas":"capturas/estilo-v5","estado":"ok"},{"inicio":"2026-10-24T21:13:13+02:00","fin":"2026-10-24T21:20:45+02:00","titulo":"Hito 1b: personaje por código (avance, sin publicar)","hito":"arte","hecho":["Cuerpo hecho por secciones con perfil real (cintura, pecho, muslo, rodilla, pantorrilla, deltoides, codo) en una sola malla con esqueleto de 17 huesos: anda y respira sin abrirse en las articulaciones.","Manos con palma, cuatro dedos recogidos y pulgar; zapatos de una pieza; túnica con pliegues en la falda que sigue a los muslos al andar; camisa en cuello y puños; cinto con hebilla; vendas en las piernas.","Cabeza: esfera moldeada (mandíbula, mentón, ceja, cuencas, pómulos, nariz, boca) con pelo y barba como abultamiento de la misma malla. No da el nivel: de cerca la cara se ve blanda y rara. No se publica.","Siguiente paso propuesto: hacer la cabeza a partir de una malla base con planos marcados (frente, cuencas, pómulos, nariz, mandíbula), escrita como datos en el código, en vez de deformar una esfera.","Personaje: 5,9 mil triángulos."],"pruebas":"Sin prueba de navegador propia todavía (no publicado). Lo demás sin cambios.","capturas":null,"estado":"fallo"},{"inicio":"2026-10-24T21:19:25+02:00","fin":"2026-10-24T21:41:55+02:00","titulo":"Hito 1b: personaje nuevo por código (prueba de estilo v6)","hito":"arte","hecho":["Personaje hecho todo por código, como decidiste: una sola malla continua, sin piezas sueltas. El cuerpo es una suma suave de formas (cráneo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas y pies) que se convierte en malla.","Más detalle donde se ve: la rejilla es más fina en la cara y las manos. Medido: 9.836 triángulos y 5.611 vértices.","Esqueleto de 17 huesos con pesos calculados por cercanía a las formas de cada hueso. Dos animaciones por código: quieto (respira y se balancea) y andar (va y viene por el camino).","Hombre adulto de 1,72 m con barba corta; ropa base pintada en la malla (camisa de lino, cinturón con relieve, calzas y zapatos), provisional hasta la tarea de ropa por capas.","Oclusión ambiental horneada en los vértices y ojos con brillo. Vistas nuevas «Personaje» y «Cara» que le siguen, y botón Quieto/Andando (se recuerda al recargar).","El presupuesto de la escena sube de 50 mil a 72 mil triángulos (con el personaje y su sombra son 68,8 mil). Anotado en el registro.","Se ve tosco de cerca: pelo como casquete liso, cara aún simple y bordes de color algo borrosos en el cuello de la camisa y la barba. Queda preguntado en las decisiones.","No comprobado: los fps en un móvil de verdad (aquí, sin tarjeta gráfica, no sirve medirlos).","Coincidió con otra sesión (21:13–21:20) que avanzó el personaje por otro camino (src/personaje/, por secciones, sin publicar). Se conservan las dos; esta es la que se publica en la prueba de estilo v6."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v6 (con pruebas nuevas del personaje; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v6","estado":"ok"},{"inicio":"2026-10-24T22:06:00+02:00","fin":"2026-10-24T22:11:29+02:00","titulo":"Web de progreso en inglés","hito":"infra","hecho":["Selector ES / EN arriba a la derecha; se recuerda al volver y se puede abrir directamente con ?lang=en.","Traducidos al inglés los 206 textos del roadmap, el diario, las decisiones y las notas de versión, y todos los textos fijos de la web.","Las traducciones viven en proyecto/idiomas/en.json; la web no se genera si falta alguna, así que todo lo nuevo saldrá también en inglés.","Preparado para el ruso: basta con añadir proyecto/idiomas/ru.json y sus textos fijos.","Nuevas tareas: documentos de diseño en inglés y el juego en inglés."],"pruebas":"Web en PC y móvil, en español y en inglés (botón, recargar, ?lang=en): todo correcto; quitar una traducción a propósito hace fallar la generación de la web.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T22:16:00+02:00","fin":"2026-10-24T22:32:23+02:00","titulo":"Construcción v4: madera más resistente y casa de dos plantas","hito":"construccion-mas","hecho":["Causa del tejado que no entraba en las esquinas: el cimiento de troncos de cada esquina carga con dos muros por planta y con la segunda planta se pasaba (1320 kg de 1200).","Más aguante en todas las piezas de madera y piedra. Una casa de troncos de 2 plantas con tejado ya entra entera y ninguna pieza pasa del 75%.","Siguen existiendo límites: 3 plantas piden cimiento de piedra y el zarzo no da para dos plantas.","Vano de una casilla: un suelo en alto o un tramo de tejado sin muros debajo se apoya en el de al lado. Hasta 4×4 casillas no hacen falta vigas por dentro; en 5×5 el centro sí las pide.","Los valores nuevos están en Decisiones dentro del juego, como provisionales."],"pruebas":"Construcción 46/46 (11 nuevas con casas de 2 y 3 plantas; fallan con MUTAR=1), modelos 21/21, combate 69/69; navegador de construcción (casa de 4×4 de dos plantas con tejado a dos aguas), combate, estilo y web: todo correcto.","capturas":"capturas/construccion-v4","estado":"ok"},{"inicio":"2026-10-24T22:19:24+02:00","fin":"2026-10-24T22:43:43+02:00","titulo":"Documentos de diseño en inglés","hito":"infra","hecho":["GDD, sistemas y análisis traducidos enteros al inglés, en diseno/en/, con la misma estructura que el original.","Cada documento tiene arriba un selector ES · EN; la web en inglés enlaza directamente a la versión inglesa.","Cada traducción guarda la huella del original en español: si el español cambia y no se vuelve a traducir, la web no se genera y dice qué archivo falta.","Decisión provisional: los documentos traducidos son archivos aparte (no van en en.json), porque son textos largos con tablas."],"pruebas":"Todas correctas: construcción 46/46 (ya con la v4 de otra sesión), modelos 21/21, combate 69/69, navegador de construcción, combate, estilo y web (PC y móvil, documentos en los dos idiomas). Romper a propósito los enlaces o la traducción hace fallar la prueba de la web; cambiar el español sin retraducir hace fallar la generación.","capturas":"capturas/documentos-en","estado":"ok"}],"capturas":{"capturas/construccion-v3":["01_cabana_vista_general.jpg","02_interior_sin_tejado.jpg","03_rechazo_por_carga.jpg","04_desmontar_cascada.jpg","05_barra_construccion_pc.jpg","06_movil_mover.jpg","07_movil_construir.jpg","08_cobertizo_pendiente_continua.jpg","09_cabana_desde_atras.jpg","10_primer_plano_fachada.jpg","11_primer_plano_trasera_ventana.jpg"],"capturas/construccion-v4":["01_cabana_vista_general.jpg","02_interior_sin_tejado.jpg","03_rechazo_por_carga.jpg","04_d _gdd_es.jpg","pc_11_doc_analisis_en.jpg","pc_11_doc_gdd_en.jpg","pc_11_doc_sistemas_en.jpg"]},"idiomas":{"en":{"Infraestructura":"Infrastructure","Repositorio en GitHub, web de progreso y trabajo automático por horas.":"GitHub repository, progress website and hourly automatic work.","Idiomas: español e inglés ya en la web; el ruso, más adelante, cuando Pedro lo pida.":"Languages: Spanish and English are already on the website; Russian later, when Pedro asks for it.","Repositorio, web de progreso y tarea programada":"Repository, progress website and scheduled task","Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos":"Progress website in English: ES/EN switch and the whole roadmap and log translated","Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma":"Design documents in English (GDD, systems and analysis), with a language switch","Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso":"Game in English: prototype texts with a language switch, ready for adding Russian","Construcción":"Building","Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.":"Move with a free camera (PC and touch) and build on an anchored grid with load limits, cascading dismantling with 75% recovery, and free decoration.","Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron).":"Done on 24 Oct between about 15:55 and 16:40 (taken from file dates; exact times for this part were not recorded).","Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada":"Logic: anchored grid, supports, load, cascading dismantling","Piezas low-poly por código y personaje":"Low-poly pieces built in code, and the character","Cámara libre y controles PC y táctil":"Free camera and PC and touch controls","v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente":"v2: walls close up to the roof and consecutive roofs form a single slope","v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)":"v3: all walls reach exactly 2.5 m (10 courses of 25 cm)","Dirección de arte y personajes":"Art direction and characters","Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.":"A character with realistic proportions and detail, customisation (body, face, hair, skin) and clothing and armour that show when worn; restrained light, materials and palette; terrain and building pieces with more detail. Low-poly built in code, but good-looking and able to run on mobile.","Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.":"High priority: before adding more pieces or systems, so they don't have to be redone in the new style later.","Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que Pedro elija":"Three style tests (character and a scene with a cabin) with different lighting, materials and level of detail, for Pedro to choose from","Rehacer las pruebas de estilo (revisión de Pedro: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio":"Redo the style tests (Pedro's review: B and C are very slow and the character doesn't work): a single light, stylised style (cheap toon or Lambert material, palette in a small texture, one light with a 1024 shadow, adaptive resolution), measured budget: scene ≤ 30k triangles and ≤ 60 draw calls, 60 fps on a mid-range phone","Prueba de estilo v3, «maqueta en miniatura» (elegido por Pedro): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto":"Style test v3, \"miniature diorama\" (chosen by Pedro): clean, rounded shapes, soft light with contact shadows, blurred background; continuous stone foundation (not loose stones); same budget","Prueba de estilo v4, «realismo en miniatura» (pedido por Pedro): la v3 con texturas por código y el mundo sin recortar":"Style test v4, \"miniature realism\" (requested by Pedro): v3 with code-generated textures and an uncropped world","Prueba de estilo v5: árboles rehechos (Pedro: «los árboles fatal, se ven como rayajos raros; la casa está bien»)":"Style test v5: trees redone (Pedro: \"the trees are awful, they look like weird scribbles; the house is fine\")","Personaje nuevo por código (decidido por Pedro), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas":"New character built in code (Pedro's decision), eye-catching and in the diorama style: a single continuous mesh with skeleton and animation, believable, slightly stylised proportions","Personaje base articulado con el estilo elegido (también el rival del combate)":"Articulated base character in the chosen style (also the combat opponent)","Personalización del personaje: complexión, cara, pelo, barba, tono de piel":"Character customisation: build, face, hair, beard, skin tone","Ropa y armaduras visibles por capas: lino, gambesón, cota de malla":"Clothing and armour visible in layers: linen, gambeson, mail","Terreno, hierba, árboles y luz con el estilo elegido":"Terrain, grass, trees and lighting in the chosen style","Piezas de construcción con más detalle: corteza, juntas, tablas, paja":"Building pieces with more detail: bark, joints, planks, thatch","Rendimiento en móvil: medir y ajustar el nivel de detalle":"Mobile performance: measure and adjust the level of detail","Revisión completa y publicación":"Full review and release","Más piezas de construcción":"More building pieces","Escaleras de caminar de un bloque, barandillas, vallas y más piezas para que construir dé juego.":"Walkable one-block stairs, railings, fences and more pieces to make building more interesting.","La primera tarea (madera más resistente) se adelantó el 24 oct porque la casa de dos plantas de Pedro y su pareja no admitía el tejado en las esquinas.":"The first task (stronger wood) was brought forward on 24 Oct because the two-storey house built by Pedro and his partner would not take the roof at the corners.","Más resistencia en la madera (Pedro: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa":"More strength for wood (Pedro: \"wood is too weak, it won't allow 2 storeys with a roof\"): a 2-storey house with a roof made only of basic wooden pieces (log foundation, walls and floor) must be buildable without tricks; building shouldn't drive you mad, but you should be able to do things. A logic test that guarantees it, and screenshots of the house","Planificar el hito: lista de piezas sacada del GDD y del documento de sistemas":"Plan the milestone: list of pieces taken from the GDD and the systems document","Equipo y carga por huecos":"Equipment and slot-based carrying","Panel de inventario, cinturones, leñero y otras mochilas; tala, transporte y ralentización por cargar.":"Inventory panel, belts, firewood frame and other backpacks; felling, hauling and slowing down when carrying.","Estaciones y crafting":"Workstations and crafting","Primeras estaciones, recetas, desbloqueo por práctica, durabilidad y reparación.":"First workstations, recipes, unlocking through practice, durability and repair.","Supervivencia":"Survival","Necesidades con avisos, ropa contra el frío, cama ligada y muerte con saqueo parcial.":"Needs with warnings, clothing against the cold, bound bed, and death with partial looting.","Duelo":"Duel","Esgrima contra un bot con heridas.":"Fencing against a bot, with wounds.","El campo de pruebas de combate se adelantó para probar el sistema antes del resto. v1 y v2 hechas el 24 oct entre las 16:45 y las 17:25 aprox.":"The combat test ground was brought forward to try the system before everything else. v1 and v2 done on 24 Oct between about 16:45 and 17:25.","Combate v1: líneas de golpe, guardias, heridas, arco":"Combat v1: strike lines, guards, wounds, bow","Combate v2: rosa de golpes, parada perfecta, golpe maestro, fintas, peso de los golpes":"Combat v2: strike rose, perfect parry, master strike, feints, weight of blows","Arreglo del arco: no soltar antes del 50% de tensión, correr cancela el tensado, 0,8 s para encajar otra flecha (piedras 0,5 s), con pruebas":"Bow fix: no release below 50% draw, running cancels the draw, 0.8 s to nock another arrow (stones 0.5 s), with tests","Escudo provisional: opción «Espada y escudo» (espada de una mano), para flechas y piedras de frente, parada más barata, se ve en el brazo izquierdo y se levanta al parar; también para el rival":"Provisional shield: \"Sword and shield\" option (one-handed sword), stops arrows and stones from the front, cheaper parry, visible on the left arm and raised when parrying; also for the opponent","Cámara táctil con un dedo durante el combate":"One-finger touch camera during combat","Curación de heridas":"Wound healing","Asedio, fuego y mantenimiento":"Siege, fire and upkeep","Ariete, daño por fuego, mojón con materiales.":"Battering ram, fire damage, boundary stone with materials.","Fauna y caza":"Wildlife and hunting","Animales realistas.":"Realistic animals.","Caballos":"Horses","Domar, montar, cuadra y pasto.":"Taming, riding, stable and pasture.","Granja y estaciones del año":"Farming and seasons","Siembras por franja, ganado.":"Sowing by climate band, livestock.","Mundo":"World","Pseudo-Europa por semilla, 5 países con estilo propio, caminos por uso, puentes.":"Pseudo-Europe from a seed, 5 countries each with its own style, roads formed by use, bridges.","Servidor y cuentas":"Server and accounts","Registro e inicio de sesión seguros, recuperación de cuenta, creación de personaje, mundo persistente con servidor autoritativo.":"Secure registration and login, account recovery, character creation, persistent world with an authoritative server.","Prioridad alta. Contraseñas con hash, conexión cifrada, límite de intentos, copias de seguridad.":"High priority. Hashed passwords, encrypted connection, attempt limits, backups.","Administración, registros y seguridad":"Administration, logs and security","Roles (jugador, moderador, administrador) para la cuenta de Pedro y las que él decida; panel de administración; registros consultables de lo que pasa en el mundo (comercio, saqueos, construcción y destrucción, muertes, conexiones); detección de trampas en el servidor (velocidad, alcance, acciones imposibles); sanciones (aviso, silencio, expulsión, bloqueo) y registro de lo que hace cada administrador.":"Roles (player, moderator, administrator) for Pedro's account and those he chooses; admin panel; searchable logs of what happens in the world (trade, looting, building and destruction, deaths, connections); server-side cheat detection (speed, reach, impossible actions); sanctions (warning, mute, kick, ban) and a log of what each administrator does.","Prioridad alta: es un juego online persistente. Desde ya, toda acción que cambia el mundo pasa por la lógica con autor, para poder registrarla después.":"High priority: this is a persistent online game. From now on, every action that changes the world goes through the logic with an author, so it can be logged later.","PvP online y protección offline":"Online PvP and offline protection","Combate y asedio entre jugadores; reglas de guerra.":"Combat and sieges between players; rules of war.","Tierras y familias":"Lands and families","Mojones, radio de exclusión, peajes, conquista, familias, vasallajes, alianzas, escudos de armas.":"Boundary stones, exclusion radius, tolls, conquest, families, vassalage, alliances, coats of arms.","Economía y NPCs":"Economy and NPCs","Encargos y moneda, puestos sin conexión, tomos, NPCs ambulantes a sueldo, centinelas y mensajeros.":"Commissions and currency, offline stalls, tomes, hired travelling NPCs, sentries and messengers.","Combate a caballo y a distancia":"Mounted and ranged combat","Arcos, ballestas, lanzas de caballería.":"Bows, crossbows, cavalry lances.","Navegación":"Sailing","Astillero, barcos, navegar con otros.":"Shipyard, ships, sailing with others.","Cartografía":"Cartography","Mesa de cartógrafo y mapas como objetos.":"Cartographer's table and maps as objects.","Construye una cabaña: cimientos, suelos, muros, tejados y muebles, con límite de carga.":"Build a cabin: foundations, floors, walls, roofs and furniture, with load limits.","Muros exactos a 2,5 m por hiladas.":"Walls exactly 2.5 m high, built in courses.","Madera más resistente: casa de 2 plantas con tejado de troncos; vano de una casilla en suelos y tejados.":"Stronger wood: a 2-storey log house with a roof; one-cell span for floors and roofs.","Combate":"Combat","Campo de pruebas: duelo con espada o palo, prácticas con poste y dianas, carga a distancia.":"Test ground: duel with sword or staff, practice with a post and targets, ranged charge.","Rosa de golpes y defensa en tres capas.":"Strike rose and three-layer defence.","Arco arreglado: tensión mínima, sin tensar corriendo y 0,8 s para encajar flecha.":"Bow fixed: minimum draw, no drawing while running, and 0.8 s to nock an arrow.","Escudo provisional: nueva arma «Espada y escudo» (espada de una mano, 1,7 m de alcance). Al parar se levanta el escudo, que detiene también flechas y piedras de frente y cansa menos que parar con la espada. Nueva opción «Arma del rival»: el rival con escudo lo levanta cuando le apuntas.":"Provisional shield: new \"Sword and shield\" weapon (one-handed sword, 1.7 m reach). Parrying raises the shield, which also stops arrows and stones from the front and is less tiring than parrying with the sword. New \"Opponent's weapon\" option: an opponent with a shield raises it when you aim at them.","Prueba de estilo":"Style test","Cabaña en un claro con el estilo propuesto: realismo en miniatura.":"A cabin in a clearing in the proposed style: miniature realism.","Tres estilos (A plano, B suave, C texturas) con cabaña y personaje: elige uno.":"Three styles (A flat, B soft, C textured) with cabin and character: pick one.","Un solo estilo estilizado y ligero: 30 mil triángulos y 12 dibujados, sin personaje (espera tu decisión).":"A single light, stylised style: 30k triangles and 12 draw calls, no character (awaiting your decision).","Maqueta en miniatura: formas redondeadas, luz suave, sombras de contacto y desenfoque; zócalo de piedra continuo.":"Miniature diorama: rounded shapes, soft light, contact shadows and blur; continuous stone plinth.","Realismo en miniatura: la maqueta con texturas por código y el mundo sin recortar.":"Miniature realism: the diorama with code-generated textures and an uncropped world.","Árboles rehechos: copas suaves en racimos y pinos con puntas, sin rayajos.":"Trees redone: soft clustered canopies and pines with drooping tips, no scribbles.","Personaje por código: una sola malla con esqueleto, quieto y andando; vistas Personaje y Cara":"Character built in code: a single mesh with a skeleton, standing and walking; Character and Face views","¿Te vale como base el «realismo en miniatura» de la prueba de estilo v5 (texturas, mundo sin recortar y árboles rehechos)? Mírala también en tu móvil (arriba salen fps y resolución).":"Will the \"miniature realism\" of style test v5 (textures, uncropped world and redone trees) work as the base? Look at it on your phone too (fps and resolution are shown at the top).","Cámara táctil: ¿arrastrar un dedo en zona libre gira la cámara (tocar sin arrastrar sigue golpeando) y con el arco la cámara sigue sola a donde apuntas?":"Touch camera: should dragging one finger on an empty area rotate the camera (tapping without dragging still strikes), and should the camera follow your aim automatically with the bow?","Curación: ¿se usa como base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso)? ¿Curarse en pleno combate debe poder hacerse (lento y vendido) o solo fuera?":"Healing: do we use the table from the analysis as the base (bandaging, stitching, cauterising, splinting, herbs, rest)? Should healing be possible in the middle of combat (slow and leaving you exposed) or only outside it?","Fuego amigo en peleas de grupo: ¿un tajo que alcanza a un aliado le hiere, no le hace nada o solo le empuja? (Propuesta: hiere.)":"Friendly fire in group fights: does a cut that hits an ally wound them, do nothing, or only push them? (Proposal: it wounds.)","¿Te vale como base el personaje de la prueba de estilo v6 (todo por código, una sola malla con esqueleto, quieto y andando)? Míralo en las vistas «Personaje» y «Cara» y dime qué cambiarías (cara, pelo, proporciones).":"Will the character from style test v6 work as the base (all built in code, a single mesh with a skeleton, standing and walking)? Look at it in the \"Character\" and \"Face\" views and tell me what you would change (face, hair, proportions).","Hito 1: construcción (v1 a v3)":"Milestone 1: building (v1 to v3)","Lógica 35/35, modelos 21/21, navegador PC y móvil correctos.":"Logic 35/35, models 21/21, browser PC and mobile correct.","Rejilla anclada a la primera pieza, módulo de 2 m × 2,5 m, apoyos y reparto de carga.":"Grid anchored to the first piece, 2 m × 2.5 m module, supports and load distribution.","Desmontaje en cascada con 75% de recuperación, bloqueado si sobrecarga otra pieza.":"Cascading dismantling with 75% recovery, blocked if it would overload another piece.","v2: los muros se rellenan hasta el tejado y los tejados seguidos forman una pendiente continua.":"v2: walls fill up to the roof and consecutive roofs form a continuous slope.","v3: muros de 10 hiladas de 25 cm, todos exactos a 2,5 m.":"v3: walls of 10 courses of 25 cm, all exactly 2.5 m.","Campo de pruebas de combate v1 y v2":"Combat test ground v1 and v2","Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.":"Logic 52/52 (with mutations that fail as they should); browser PC and mobile: all correct.","v1: cinco líneas de golpe, guardias, heridas por zona sin barras de vida, arco con balística.":"v1: five strike lines, guards, wounds by body zone without health bars, bow with ballistics.","Comparado con juegos de esgrima de referencia: la v1 era poco intuitiva (arrastrar para golpear, elegir lado al parar, cámara a su aire).":"Compared with reference fencing games: v1 was unintuitive (drag to strike, choose a side when parrying, camera doing its own thing).","v2: rosa de golpes sobre el rival, parada sin lado + parada perfecta + golpe maestro, fintas, aliento.":"v2: strike rose over the opponent, side-free parry + perfect parry + master strike, feints, stamina.","Movimiento encarado (los lados rodean al rival), cámara con margen, pausa de impacto, chispas, sangre, sonido y estela.":"Facing movement (sideways circles the opponent), camera with a margin, hit pause, sparks, blood, sound and blade trail.","Dificultad = ritmo + ayudas: aprendiz (lento, con avisos), normal, realista (sin avisos).":"Difficulty = pace + aids: apprentice (slow, with warnings), normal, realistic (no warnings).","Infraestructura: repositorio, web de progreso y trabajo automático":"Infrastructure: repository, progress website and automatic work","Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.":"All project tests green (logic, models, combat, browser PC and mobile, website). Fixed a combat test that sometimes failed if the opponent killed you before the panels were clicked.","Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.":"Repository valravnxx/kinhold with code, design documents and working rules.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.":"Progress website on GitHub Pages: play, roadmap, log, times, decisions and documents.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.":"Scheduled task at :19 every hour: does one roadmap task per session and stops at the end of each milestone for your review.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso.":"Waiting on you: enable GitHub Pages (Settings → Pages → main branch, /docs folder); I don't have permission from here.","Alcance del proyecto: arte y seguridad al roadmap":"Project scope: art and security added to the roadmap","Web regenerada y probada en PC y móvil.":"Website rebuilt and tested on PC and mobile.","Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.":"New milestone 1b \"Art direction and characters\", prioritised over new pieces: realistic character, customisation and visible armour. It starts with three style tests for you to choose from.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.":"New milestone 11b \"Administration, logs and security\": roles, admin panel, logs, cheat detection and sanctions.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.":"Milestone 11 expanded (secure accounts) and written into the rules: every action that changes the world has an author, so it can be logged.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil.":"The working rules now include the visual bar: restrained and realistic within low-poly, nothing childish, and able to run on mobile.","Hito 1b: tres pruebas de estilo":"Milestone 1b: three style tests","Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 52/52; browser building, combat, style tests (PC and mobile, with a deliberate MUTAR=1 break that fails as it should) and website: all correct.","Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.":"New prototype \"Style tests\" (v1): the same scene (log cabin with thatched roof, firewood, stump with axe, barrel, fence, trees) and the same character in three styles.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.":"A · Restrained flat: flat faces, little detail, midday light. B · Soft and natural: smooth shading, ambient occlusion baked into vertices, more detail, cinematic tones. C · Painted textures: code-generated textures, low afternoon light, fog and warm grading.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.":"New 1.76 m articulated character: linen shirt, wool tunic, belt with pouch, hose, leg wraps, leather shoes, short hair and beard; face with eyelids, eyebrows, nose, ears and mouth.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).":"Measured in the test browser: A 16k triangles, B 39k, C 86k; between 94 and 129 draw calls per frame after merging static meshes (up to 1000 before).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.":"The building v3 and combat v2 screenshots gave 404 on the website (.gitignore excluded docs/capturas). I fixed it here and the same fix arrived at the same time in another commit; when merging both I kept its screenshots.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil.":"Not verified: fps on a real phone (the test browser has no graphics card; it gives 1-3 fps on all of them). The prototype shows fps in the top right so you can measure it on your phone.","Hito 5: arreglo del arco (combate v3)":"Milestone 5: bow fix (combat v3)","Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.":"Logic 35/35, models 21/21, combat 59/59 (7 new, fail with MUTAR=1); browser building, combat (new: a weak release doesn't shoot), style and website correct.","Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).":"Processed your combat review: two new tasks in milestone 5 (bow fix and provisional shield).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.":"Releasing below 50% draw cancels the shot without firing, with a warning.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.":"Breaking into a run relaxes the bow, and you can't start drawing while running.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.":"After each shot, 0.8 s to nock the next arrow (stones 0.5 s): at most about 8 arrows every 10 s.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto.":"Fixed along the way: running counted as soon as Shift was pressed, even when standing still.","Sesión duplicada: arreglo del arco hecho dos veces":"Duplicate session: bow fix done twice","No aplica (trabajo descartado).":"Not applicable (work discarded).","Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.":"This session started at the same time as another one (19:13 Madrid time) and both took the same task: the bow fix.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).":"The other one published combat v3 first; when I went to push mine, the repository already had it. I discard my version so as not to overwrite the published one (versions are never overwritten).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.":"My copy also passed all tests (combat 63/63, browser correct); it adds nothing that isn't already in the published v3.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen.":"Warning: two automatic tasks are running at the same time on the repository. It's best to keep only one so they don't repeat work or overwrite each other.","Revisión de las pruebas de estilo: investigación y replanteo":"Style test review: research and rethink","Sin cambios de código en esta parte.":"No code changes in this part.","Pedro: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).":"Pedro: the v1 style tests don't work (three finishes on the same model, B and C very slow, ugly character).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.":"Causes of the slowness: physical (Standard) material in B and C, 2048 shadow, double resolution on mobile and up to 86k triangles in C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.":"Researched: with fewer than 100-150 draw calls, a cheap material, a single light with shadow and 1024 or 512 shadows, the scene runs smoothly on a mid-range phone. A toon material with a gradient texture, merging meshes and instancing also help.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.":"Character: the underlying problem is assembling it from loose pieces (spheres and cylinders stuck together). Proposal: a single continuous mesh with a skeleton, or free CC0 models already animated. Left for you to decide.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido.":"New task in milestone 1b to redo the tests with a measured budget.","Hito 1b: prueba de estilo v2, ligera y estilizada":"Milestone 1b: style test v2, light and stylised","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.":"Logic 35/35, models 21/21, combat 59/59; browser building, combat, style v2 (with budget; MUTAR=1 fails as it should) and website: all correct.","Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.":"A single style instead of three finishes: 3-tone cartoon shading, flat faces, muted vertex colours with variation and baked occlusion, no textures.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).":"All the static part (cabin, firewood, stump, barrel, bench, fence) is a single draw call; trees, rocks and bushes are instanced. Measured: 29.6k triangles and 12 draw calls (v1 reached 86k and 1000 before merging).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.":"A single 1024 px shadow; only nearby trees cast shadows. Gradient sky and fog, no post-processing.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.":"Adaptive resolution: starts at 1.5× at most and drops to 0.75× if it doesn't reach 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.":"Thatched roof with rounded edges and colour streaks. Two lightings to compare: morning and afternoon.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).":"Removed the v1 character: the new one awaits your decision (continuous mesh in code or CC0 models).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica).":"Not verified: fps on a real phone or PC (the test browser has no graphics card).","Hito 5: escudo provisional (combate v4)":"Milestone 5: provisional shield (combat v4)","Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos":"Building 35/35, models 21/21, combat 69/69 (10 new for the shield, fail with MUTAR=1), combat browser PC and mobile correct (8 new checks, fail with the shield deliberately broken), style and website correct","Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.":"New \"Sword and shield\" weapon: one-handed sword with 1.7 m reach (the longsword has 1.9), somewhat faster and somewhat less damaging.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.":"Round plank shield with leather rim and boss, on the left arm; when parrying it is raised in front of the chest.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.":"With a shield, Parry also stops arrows and stones coming from the front (70° each side); not from behind or the side.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"Parrying with a shield costs 60% of the stamina it costs with the sword. Perfect parry and master strike work the same.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"New \"Opponent's weapon\" option (same as yours, longsword, sword and shield, or staff). An opponent with a shield raises it when you aim at them with a bow or sling and keeps it up while you reload.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.":"All noted as provisional in the prototype's decision log,
