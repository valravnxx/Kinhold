<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinhold · desarrollo</title>
<style>
:root{
  --fondo:#1b1712; --panel:#26201a; --panel2:#30281f; --tinta:#f1e8d8; --suave:#bfb19a; --tenue:#8c806d;
  --acento:#d9a441; --verde:#7ccf86; --rojo:#e0574f; --azul:#7fb2d9; --naranja:#e89a3c; --linea:rgba(241,232,216,.12);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acento)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.01em}
.envoltura{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:38px;color:var(--acento)}
header p{margin:2px 0 0;color:var(--suave)}
#resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.dato{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.dato b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.dato span{color:var(--suave);font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--fondo);display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--linea);overflow-x:auto}
nav button{font:inherit;color:var(--suave);background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.sel{background:var(--panel2);color:var(--tinta);font-weight:600}
nav button .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--acento);color:#241b10;font-size:12px;font-weight:700}
section{display:none;padding-top:18px} section.sel{display:block}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tarjeta img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.tarjeta .cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tarjeta h3{margin:0;font-size:20px}
.tarjeta p{margin:0;color:var(--suave);font-size:14px}
.boton{display:inline-block;text-align:center;background:var(--acento);color:#241b10;font-weight:700;text-decoration:none;padding:10px 14px;border-radius:10px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:inherit;color:var(--tinta);background:var(--panel2);border:1px solid var(--linea);border-radius:9px;padding:7px 9px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--suave);white-space:nowrap}
.chip.hecho{background:rgba(124,207,134,.16);color:var(--verde)}
.chip.en_curso{background:rgba(127,178,217,.16);color:var(--azul)}
.chip.revision{background:rgba(217,164,65,.2);color:var(--acento)}
.chip.espera_decision{background:rgba(232,154,60,.16);color:var(--naranja)}
.chip.fallo{background:rgba(224,87,79,.16);color:var(--rojo)}
.hito{background:var(--panel);border:1px solid var(--linea);border-radius:12px;margin-bottom:10px}
.hito > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.hito > summary::-webkit-details-marker{display:none}
.hito .num{font-family:Georgia,serif;font-size:20px;color:var(--tenue);text-align:center}
.hito.activo{border-color:rgba(127,178,217,.5)}
.hito h3{margin:0;font-size:17px}
.barra{height:6px;border-radius:3px;background:rgba(241,232,216,.08);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:3px}
.hito .det{padding:0 14px 14px 68px;color:var(--suave);font-size:14px}
.hito ul{margin:8px 0 0;padding:0;list-style:none}
.hito li{display:flex;gap:8px;align-items:baseline;justify-content:space-between;padding:5px 0;border-top:1px solid var(--linea);color:var(--tinta)}
.hito li em{font-style:normal;color:var(--tenue);font-size:12.5px;white-space:nowrap}
.entrada{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.entrada h3{margin:0 0 2px;font-size:17px}
.entrada .meta{color:var(--tenue);font-size:13px}
.entrada ul{margin:8px 0;padding-left:18px}
.entrada li{margin:3px 0}
.miniaturas{display:flex;gap:6px;overflow-x:auto;padding-top:4px}
.miniaturas a{flex:0 0 auto}
.miniaturas img{height:84px;border-radius:7px;display:block;border:1px solid var(--linea)}
.decision{background:var(--panel);border:1px solid rgba(232,154,60,.35);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.decision .meta{color:var(--tenue);font-size:13px;margin-top:4px}
.nota{color:var(--suave);font-size:14px;background:var(--panel);border-radius:12px;padding:12px 14px;border:1px dashed var(--linea)}
.docs a{display:block;background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--tinta)}
.docs a span{display:block;color:var(--suave);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-bottom:1px solid var(--linea);text-align:left}
th{color:var(--suave);font-weight:600}
td.n{text-align:right}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:12px;z-index:20}
#visor img{max-width:100%;max-height:100%;border-radius:8px}
[hidden]{display:none!important}
footer{color:var(--tenue);font-size:13px;margin-top:30px}
#idiomas{display:flex;gap:4px}
#idiomas button{font:inherit;font-size:12.5px;font-weight:700;color:var(--suave);background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:4px 9px;cursor:pointer}
#idiomas button.sel{background:var(--acento);color:#241b10;border-color:transparent}
.derecha{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:640px){
  header h1{font-size:30px}
  #resumen{grid-template-columns:repeat(2,1fr)}
  .hito > summary{grid-template-columns:32px 1fr;}
  .hito > summary .chip{grid-column:2;justify-self:start}
  .hito .det{padding-left:14px}
  .derecha{align-items:flex-start}
}
</style>
</head>

parte no se registraron)."},{"id":"arte","num":"1b","nombre":"Dirección de arte y personajes","estado":"en_curso","jugable":"Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.","nota":"Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.","tareas":[{"nombre":"Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que Pedro elija","estado":"hecho","inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00"},{"nombre":"Rehacer las pruebas de estilo (revisión de Pedro: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio","estado":"hecho","inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00"},{"nombre":"Prueba de estilo v3, «maqueta en miniatura» (elegido por Pedro): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto","estado":"hecho","inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00"},{"nombre":"Prueba de estilo v4, «realismo en miniatura» (pedido por Pedro): la v3 con texturas por código y el mundo sin recortar","estado":"hecho","inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00"},{"nombre":"Prueba de estilo v5: árboles rehechos (Pedro: «los árboles fatal, se ven como rayajos raros; la casa está bien»)","estado":"hecho","inicio":"2026-10-24T20:53:26+02:00","fin":"2026-10-24T21:01:31+02:00"},{"nombre":"Personaje nuevo por código (decidido por Pedro), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas","estado":"hecho","inicio":"2026-10-24T21:19:25+02:00","fin":"2026-10-24T21:41:55+02:00"},{"nombre":"Personaje base articulado con el estilo elegido (también el rival del combate) (hecho con el personaje nuevo por código)","estado":"hecho"},{"nombre":"Personaje v2 con bases libres (CC0) ya hechas en vez de esculpirlo por código (Pedro: «horripilante»): cabeza, ropa, pelo y animaciones del paquete, con personalización","estado":"hecho","inicio":"2026-10-24T23:05:00+02:00","fin":"2026-10-24T23:31:24+02:00"},{"nombre":"Personaje v3: rendimiento en el móvil (iba a 10 fps) y fuera el traje de explorador por ser de fantasía","estado":"hecho","inicio":"2026-10-24T23:38:00+02:00","fin":"2026-10-24T23:49:54+02:00"},{"nombre":"Recursos de personaje v2: todo comprimido (las animaciones bajan de 4,4 MB a unos 0,7 MB) y el personaje con las 39 animaciones extra (trabajos, arco, espada ligera y pesada, bloqueo, vendarse, pasos en todas direcciones)","estado":"hecho","inicio":"2026-10-25T02:20:44+01:00","fin":"2026-10-25T02:48:34+01:00"},{"nombre":"Taller propio sin pantalla (Blender por pip) para reasignar animaciones, reducir mallas y probar a crear cuerpos y caras propios con MakeHuman (MPFB2), con su esqueleto compatible","estado":"hecho","inicio":"2026-10-24T23:58:00+02:00","fin":"2026-10-25T07:15:00+01:00"},{"nombre":"Taller: ropa por capas, primera tanda — camisa de lino bajo la túnica y gambesón acolchado encima, hechos por código sobre el cuerpo de MakeHuman, que se ponen y se quitan como capas","estado":"hecho","inicio":"2026-10-25T09:15:48+01:00","fin":"2026-10-25T09:54:03+01:00"},{"nombre":"Taller: cota de malla (anillas por código) y sobreveste encima, como capas","estado":"hecho","inicio":"2026-10-25T09:59:09+01:00","fin":"2026-10-25T10:57:23+01:00"},{"nombre":"Taller: capa con capucha, calzado y tocados (capucha suelta, sombrero de paja, toca)","estado":"pendiente"},{"nombre":"Taller: personalización — altura, complexión y cara con los ajustes de MakeHuman, tono de piel, color de ojos, peinado y barba","estado":"pendiente"},{"nombre":"Taller: más peinados (melena, coleta, trenzas) y barbas (corta, larga, perilla), y arreglar la claridad de la barbilla","estado":"pendiente"},{"nombre":"Taller: pasar también las 39 animaciones extra (trabajos, arco, espada, bloqueo, vendarse, pasos) al esqueleto de MakeHuman","estado":"pendiente"},{"nombre":"Ropa y armadura crafteables por capas (camisa, gambesón, cota de malla, sobreveste): cada pieza fabricada cambia su aspecto según material, tinte y calidad, sobre el mismo esqueleto","estado":"pendiente"},{"nombre":"Heridas y sangrado visibles en el personaje: corte, golpe y estocada se pintan donde entran (también rompen y manchan la ropa), el sangrado se extiende con el tiempo y el vendaje se ve puesto","estado":"pendiente"},{"nombre":"Terreno, hierba, árboles y luz con el estilo elegido","estado":"pendiente"},{"nombre":"Piezas de construcción con más detalle: corteza, juntas, tablas, paja","estado":"pendiente"},{"nombre":"Rendimiento en móvil: medir y ajustar el nivel de detalle","estado":"pendiente"},{"nombre":"Revisión completa y publicación","estado":"pendiente"}],"bloquea":true},{"id":"construccion-mas","num":"1c","nombre":"Más piezas de construcción","jugable":"Escaleras de caminar de un bloque, barandillas, vallas y más piezas para que construir dé juego.","estado":"en_curso","tareas":[{"nombre":"Más resistencia en la madera (Pedro: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa","estado":"hecho","inicio":"2026-10-24T22:16:00+02:00","fin":"2026-10-24T22:32:23+02:00"},{"nomb sin avisos)."],"pruebas":"Lógica 52/52 (con mutaciones que fallan como deben); navegador PC y móvil: todo correcto.","capturas":"capturas/combate-v2","estado":"ok"},{"inicio":"2026-10-24T17:20:03+00:00","fin":"2026-10-24T17:44:04+00:00","titulo":"Sesión duplicada: arreglo del arco hecho dos veces","hito":"duelo","hecho":["Esta sesión empezó a la vez que otra (19:13 hora de Madrid) y las dos cogieron la misma tarea: el arreglo del arco.","La otra publicó antes la combate v3; al ir a subir la mía, el repositorio ya la tenía. Descarto mi versión para no pisar la publicada (las versiones no se sobrescriben).","Mi copia también pasaba todas las pruebas (combate 63/63, navegador correcto); no aporta nada que no esté ya en la v3 publicada.","Aviso: hay dos tareas automáticas corriendo a la vez sobre el repositorio. Conviene dejar solo una para que no repitan trabajo ni se pisen."],"pruebas":"No aplica (trabajo descartado).","capturas":"","estado":"fallo"},{"inicio":"2026-10-24T18:04:00+02:00","fin":"2026-10-24T18:19:37+02:00","titulo":"Infraestructura: repositorio, web de progreso y trabajo automático","hito":"infra","hecho":["Repositorio valravnxx/kinhold con código, documentos de diseño y reglas de trabajo.","Web de progreso en GitHub Pages: jugar, roadmap, diario, tiempos, decisiones y documentos.","Tarea programada a los :19 de cada hora: hace una tarea del roadmap por sesión y se para al terminar cada hito para tu revisión.","Pendiente de ti: activar GitHub Pages (Settings → Pages → rama main, carpeta /docs); desde aquí no tengo permiso."],"pruebas":"Todas las pruebas del proyecto en verde (lógica, modelos, combate, navegador PC y móvil, web). Corregida una prueba del combate que fallaba a veces si el rival te mataba antes de pulsar los paneles.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:36:00+02:00","fin":"2026-10-24T18:37:25+02:00","titulo":"Alcance del proyecto: arte y seguridad al roadmap","hito":"infra","hecho":["Nuevo hito 1b «Dirección de arte y personajes», con prioridad sobre las piezas nuevas: personaje realista, personalización y armaduras visibles. Empieza con tres pruebas de estilo para que elijas.","Nuevo hito 11b «Administración, registros y seguridad»: roles, panel de administración, registros, detección de trampas y sanciones.","Ampliado el hito 11 (cuentas seguras) y fijado en las reglas: toda acción que cambia el mundo lleva autor, para poder registrarla.","Las reglas de trabajo recogen el listón visual: sobrio y realista dentro del low-poly, nada de estética infantil, y que aguante en móvil."],"pruebas":"Web regenerada y probada en PC y móvil.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T18:41:34+02:00","fin":"2026-10-24T19:12:43+02:00","titulo":"Hito 1b: tres pruebas de estilo","hito":"arte","hecho":["Nuevo prototipo «Pruebas de estilo» (v1): la misma escena (cabaña de troncos con tejado de paja, leña, tocón con hacha, barril, cerca, árboles) y el mismo personaje en tres estilos.","A · Plano sobrio: caras planas, poco detalle, luz de mediodía. B · Suave y natural: sombreado suave, oclusión horneada en vértices, más detalle, tonos de cine. C · Texturas pintadas: texturas hechas por código, luz baja de tarde, niebla y gradación cálida.","Personaje nuevo de 1,76 m, articulado: camisa de lino, túnica de lana, cinto con bolsa, calzas, vendas en las piernas, zapatos de cuero, pelo y barba cortos; cara con párpados, cejas, nariz, orejas y boca.","Medido en el navegador de pruebas: A 16 mil triángulos, B 39 mil, C 86 mil; entre 94 y 129 dibujados por fotograma tras juntar las mallas fijas (antes hasta 1000).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil."],"pruebas":"Lógica 35/35, modelos 21/21, combate 52/52; navegador construcción, combate, pruebas de estilo (PC y móvil, con rotura a propósito MUTAR=1 que falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v1","estado":"ok"},{"inicio":"2026-10-24T19:13:50+02:00","fin":"2026-10-24T19:23:09+02:00","titulo":"Hito 5: arreglo del arco (combate v3)","hito":"duelo","hecho":["Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.","capturas":"capturas/combate-v3","estado":"ok"},{"inicio":"2026-10-24T19:23:09+02:00","fin":"2026-10-24T19:24:41+02:00","titulo":"Revisión de las pruebas de estilo: investigación y replanteo","hito":"arte","hecho":["Pedro: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido."],"pruebas":"Sin cambios de código en esta parte.","capturas":null,"estado":"ok","aprox":true},{"inicio":"2026-10-24T19:26:45+02:00","fin":"2026-10-24T19:42:11+02:00","titulo":"Hito 1b: prueba de estilo v2, ligera y estilizada","hito":"arte","hecho":["Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v2","estado":"ok"},{"inicio":"2026-10-24T20:20:27+02:00","fin":"2026-10-24T20:36:27+02:00","titulo":"Hito 5: escudo provisional (combate v4)","hito":"duelo","hecho":["Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.","Los guardados de opciones anteriores siguen valiendo: si no tienen arma del rival, se usa «Como la tuya»."],"pruebas":"Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos","capturas":"capturas/combate-v4","estado":"ok"},{"inicio":"2026-10-24T20:21:00+02:00","fin":"2026-10-24T20:30:15+02:00","titulo":"Hito 1b: prueba de estilo v3, maqueta en miniatura","hito":"arte","hecho":["Tu revisión de la v2: recordaba a juegos gratuitos de motor genérico y las piedras del cimiento se veían sueltas. Elegiste «maqueta en miniatura».","La escena es un pedazo de tierra redondo con el corte de tierra visto, sobre fondo liso con degradado. Cámara de teleobjetivo y desenfoque arriba y abajo (se puede quitar).","Formas redondeadas: cantos suaves, troncos con puntas abombadas, tejado de paja en tres hiladas gruesas, copas redondas, matorrales y flores de colores apagados.","Zócalo de piedra continuo: núcleo de mortero con dos hiladas de piedras bien juntas.","Luz suave, sombras de bordes blandos y sombras de contacto horneadas en el suelo.","Medido: 47 mil triángulos (con la pasada de sombra) y 6 dibujados. Subido el presupuesto de 30 a 50 mil por los cantos redondeados; los dibujados bajan de 12 a 6.","Decidido por ti en el chat: los personajes se hacen por código. La tarea del personaje pasa a pendiente.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v3 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v3","estado":"ok"},{"inicio":"2026-10-24T20:34:49+02:00","fin":"2026-10-24T20:50:32+02:00","titulo":"Hito 1b: prueba de estilo v4, realismo en miniatura","hito":"arte","hecho":["Tu revisión de la v3: te gusta, pero el mundo no estará recortado; pediste probar el «realismo en miniatura» con algo de textura.","Texturas hechas por código, en gris, que dan detalle y relieve: veta, anillos de los cortes, paja en hebras, piedra, corteza, hojas y suelo. El color sigue saliendo de la paleta.","Las texturas van a escala real: la veta sigue el largo de cada tronco y tabla, la paja baja por la pendiente y los anillos se centran en cada corte.","El suelo sigue con lomas hasta el horizonte, con bosque lejano instanciado y niebla del color del cielo.","Medido: 47 mil triángulos y 21 dibujados (una malla por textura), dentro del presupuesto de 50 mil y 60.","No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v4 (MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v4","estado":"ok"},{"inicio":"2026-10-24T20:53:26+02:00","fin":"2026-10-24T21:01:31+02:00","titulo":"Hito 1b: prueba de estilo v5, árboles rehechos","hito":"arte","hecho":["Tu revisión de la v4: la casa bien, los árboles fatal, con rayajos raros.","Causa: la textura de hojas se proyectaba cara a cara sobre las copas y salían trazos cortados en cada cara.","Copas nuevas: bolas suaves con bultos, como racimos, más claras arriba y oscuras por dentro, con una textura de manchas redondas que envuelve la copa sin costuras.","Pinos: cada piso acaba en puntas caídas, como ramas, en vez de un cono liso.","Medido: 49 mil triángulos y 21 dibujados (algo menos de hierba para no pasar de 50 mil)."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v5 y web: todo correcto.","capturas":"capturas/estilo-v5","estado":"ok"},{"inicio":"2026-10-24T21:13:13+02:00","fin":"2026-10-24T21:20:45+02:00","titulo":"Hito 1b: personaje por código (avance, sin publicar)","hito":"arte","hecho":["Cuerpo hecho por secciones con perfil real (cintura, pecho, muslo, rodilla, pantorrilla, deltoides, codo) en una sola malla con esqueleto de 17 huesos: anda y respira sin abrirse en las articulaciones.","Manos con palma, cuatro dedos recogidos y pulgar; zapatos de una pieza; túnica con pliegues en la falda que sigue a los muslos al andar; camisa en cuello y puños; cinto con hebilla; vendas en las piernas.","Cabeza: esfera moldeada (mandíbula, mentón, ceja, cuencas, pómulos, nariz, boca) con pelo y barba como abultamiento de la misma malla. No da el nivel: de cerca la cara se ve blanda y rara. No se publica.","Siguiente paso propuesto: hacer la cabeza a partir de una malla base con planos marcados (frente, cuencas, pómulos, nariz, mandíbula), escrita como datos en el código, en vez de deformar una esfera.","Personaje: 5,9 mil triángulos."],"pruebas":"Sin prueba de navegador propia todavía (no publicado). Lo demás sin cambios.","capturas":null,"estado":"fallo"},{"inicio":"2026-10-24T21:19:25+02:00","fin":"2026-10-24T21:41:55+02:00","titulo":"Hito 1b: personaje nuevo por código (prueba de estilo v6)","hito":"arte","hecho":["Personaje hecho todo por código, como decidiste: una sola malla continua, sin piezas sueltas. El cuerpo es una suma suave de formas (cráneo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas y pies) que se convierte en malla.","Más detalle donde se ve: la rejilla es más fina en la cara y las manos. Medido: 9.836 triángulos y 5.611 vértices.","Esqueleto de 17 huesos con pesos calculados por cercanía a las formas de cada hueso. Dos animaciones por código: quieto (respira y se balancea) y andar (va y viene por el camino).","Hombre adulto de 1,72 m con barba corta; ropa base pintada en la malla (camisa de lino, cinturón con relieve, calzas y zapatos), provisional hasta la tarea de ropa por capas.","Oclusión ambiental horneada en los vértices y ojos con brillo. Vistas nuevas «Personaje» y «Cara» que le siguen, y botón Quieto/Andando (se recuerda al recargar).","El presupuesto de la escena sube de 50 mil a 72 mil triángulos (con el personaje y su sombra son 68,8 mil). Anotado en el registro.","Se ve tosco de cerca: pelo como casquete liso, cara aún simple y bordes de color algo borrosos en el cuello de la camisa y la barba. Queda preguntado en las decisiones.","No comprobado: los fps en un móvil de verdad (aquí, sin tarjeta gráfica, no sirve medirlos).","Coincidió con otra sesión (21:13–21:20) que avanzó el personaje por otro camino (src/personaje/, por secciones, sin publicar). Se conservan las dos; esta es la que se publica en la prueba de estilo v6."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v6 (con pruebas nuevas del personaje; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/estilo-v6","estado":"ok"},{"inicio":"2026-10-24T22:05:00+02:00","fin":"2026-10-24T22:40:12+02:00","aprox":true,"titulo":"Hito 1b: personaje esculpido por código (v1)","hito":"arte","hecho":["Tu revisión: el avance anterior no valía; pediste investigar y hacerlo de la forma óptima, costase lo que costase.","Investigado: la técnica que da criaturas orgánicas solo con código es esculpir con campos de distancia (formas simples fundidas con mezcla suave sobre el esqueleto), pasar a malla fina, simplificar y pesar al esqueleto por cercanía. Es lo que usa un proyecto abierto de animales procedurales para three.js.","Hecho así: unas 120 formas (cráneo, frente, cejas, pómulos, maxilar, mandíbula, mentón, nariz con aletas y fosas, labios, cuencas con párpados, orejas; músculos del tronco, brazos y piernas; manos con dedos). Ojos aparte con iris y pupila.","Ropa, pelo y barba como capas que siguen al cuerpo (camisa, túnica con pliegues, cinto, calzas, vendas, zapatos). La falda sigue a los muslos al andar.","Horneado al construir (herramientas/hornear_personaje.mjs): rejilla de 3 mm, superficie por surface nets, simplificación con meshoptimizer (la cabeza con más presupuesto), normales y oclusión sacadas del campo. Tarda 95 s; en el juego carga al instante.","Medido: cerca 22,8 mil triángulos y lejos 4 mil; 17 huesos.","Pendiente de pulir: el pelo es algo áspero, la barba tiene el borde irregular, un bulto en el dorso de la muñeca y el cuello de la camisa queda grueso. No comprobado: los fps en un aparato real."],"pruebas":"Lógica 35/35, modelos 21/21, combate 69/69, personaje horneado 11/11 (nuevas, fallan con MUTAR=1); navegador construcción, combate, estilo, personaje (nueva, falla con MUTAR=1) y web: todo correcto.","capturas":"capturas/personaje-v1","estado":"ok"},{"inicio":"2026-10-24T22:06:00+02:00","fin":"2026-10-24T22:11:29+02:00","titulo":"Web de progreso en inglés","hito":"infra","hecho":["Selector ES / EN arriba a la derecha; se recuerda al volver y se puede abrir directamente con ?lang=en.","Traducidos al inglés los 206 textos del roadmap, el diario, las decisiones y las notas de versión, y todos los textos fijos de la web.","Las traducciones viven en proyecto/idiomas/en.json; la web no se genera si falta alguna, así que todo lo nuevo saldrá también en inglés.","Preparado para el ruso: basta con añadir proyecto/idiomas/ru.json y sus textos fijos.","Nuevas tareas: documentos de diseño en inglés y el juego en inglés."],"pruebas":"Web en PC y móvil, en español y en inglés (botón, recargar, ?lang=en): todo correcto; quitar una traducción a propósito hace fallar la generación de la web.","capturas":null,"estado":"ok"},{"inicio":"2026-10-24T22:16:00+02:00","fin":"2026-10-24T22:32:23+02:00","titulo":"Construcción v4: madera más resistente y casa de dos plantas","hito":"construccion-mas","hecho":["Causa del tejado que no entraba en las esquinas: el cimiento de troncos de cada esquina carga con dos muros por planta y con la segunda planta se pasaba (1320 kg de 1200).","Más aguante en todas las piezas de madera y piedra. Una casa de troncos de 2 plantas con tejado ya entra entera y ninguna pieza pasa del 75%.","Siguen existiendo límites: 3 plantas piden cimiento de piedra y el zarzo no da para dos plantas.","Vano de una casilla: un suelo en alto o un tramo de tejado sin muros debajo se apoya en el de al lado. Hasta 4×4 casillas no hacen falta vigas por dentro; en 5×5 el centro sí las pide.","Los valores nuevos están en Decisiones dentro del juego, como provisionales."],"pruebas":"Construcción 46/46 (11 nuevas con casas de 2 y 3 plantas; fallan con MUTAR=1), modelos 21/21, combate 69/69; navegador de construcción (casa de 4×4 de dos plantas con tejado a dos aguas), combate, estilo y web: todo correcto.","capturas":"capturas/construccion-v4","estado":"ok"},{"inicio":"2026-10-24T22:19:24+02:00","fin":"2026-10-24T22:43:43+02:00","titulo":"Documentos de diseño en inglés","hito":"infra","hecho":["GDD, sistemas y análisis traducidos enteros al inglés, en diseno/en/, con la misma estructura que el original.","Cada documento tiene arriba un selector ES · EN; la web en inglés enlaza directamente a la versión inglesa.","Cada traducción guarda la huella del original en español: si el español cambia y no se vuelve a traducir, la web no se genera y dice qué archivo falta.","Decisión provisional: los documentos traducidos son archivos aparte (no van en en.json), porque son textos largos con tablas."],"pruebas":"Todas correctas: construcción 46/46 (ya con la v4 de otra sesión), modelos 21/21, combate 69/69, navegador de construcción, combate, estilo y web (PC y móvil, documentos en los dos idiomas). Romper a propósito los enlaces o la traducción hace fallar la prueba de la web; cambiar el español sin retraducir hace fallar la generación.","capturas":"capturas/documentos-en","estado":"ok"},{"inicio":"2026-10-24T23:05:00+02:00","fin":"2026-10-24T23:31:24+02:00","titulo":"Personaje v2: bases libres ya hechas en lugar de esculpirlo por código","hito":"arte","hecho":["Se abandona el personaje esculpido por código (daba grima). Investigado cómo lo resuelven otros proyectos de navegador: parten de bases de personajes ya hechas y libres.","Elegidos los paquetes CC0 de Quaternius (se pueden usar y vender sin pagar ni citar): cuerpos base, ropa modular por piezas sobre el mismo esqueleto, y librería de animaciones. Licencias y procedencia junto a los modelos.","Personaje montado con la cabeza de la base (solo cabeza y cuello, el resto lo tapa la ropa), la ropa, el pelo y la barba, atados al mismo esqueleto de 65 huesos. La ropa y las armaduras futuras irán por capas sobre ese esqueleto.","Personalización: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo (6), tono de piel (4) y barba. Animaciones del paquete: quieto, andar, talar, en guardia, golpe y cargar.","Modelos preparados para el navegador: texturas reducidas y un archivo por pieza. Un personaje carga unos 4 MB la primera vez más 4,4 MB de animaciones compartidas.","No comprobado: los fps en un móvil de verdad (aquí no hay tarjeta gráfica). Un personaje tiene entre 20 y 33 mil triángulos según la ropa."],"pruebas":"Construcción 46/46, modelos 21/21, combate 69/69; navegador: construcción, combate, estilo, personaje v2 (vistas, animación, tres variantes y botones, PC y móvil; MUTAR=1 falla como debe) y web: todo correcto.","capturas":"capturas/personaje-v2","estado":"ok"},{"inicio":"2026-10-24T23:38:00+02:00","fin":"2026-10-24T23:49:54+02:00","titulo":"Personaje v3: más ligero en el móvil","hito":"arte","hecho":["Pedro: en su móvil el personaje v2 iba a 10 fps y el traje de explorador es demasiado de fantasía.","En pantallas táctiles empieza en calidad ligera: material sencillo con el color, sin relieve ni brillo. Resolución de partida 1× y puede bajar hasta 0,5×.","La ropa, el pelo y la barba comparten un solo esqueleto; antes cada malla calculaba el suyo en cada fotograma.","Interruptores de prueba (calidad, sombras, cabaña y suelo) para ver en el móvil qué pesa, con los fps arriba. En el móvil el panel empieza cerrado para no tapar al personaje.","Quitado el traje de explorador de las opciones.","No comprobado: si con esto llega a fps buenos en el móvil de Pedro. Aquí no hay tarjeta gráfica y las medidas no se parecen a un móvil."],"pruebas":"Personaje en navegador PC y móvil (vistas, animación, variantes, calidad ligera, esqueleto compartido, interruptores): todo correcto.","capturas":"capturas/personaje-v3","estado":"ok"},{"inicio":"2026-10-24T23:58:00+02:00","fin":"2026-10-25T00:07:59+02:00","titulo":"Personaje v4 y primera prueba del taller propio con MakeHuman","hito":"arte","hecho":["Malentendido corregido: «me va de 10» significaba que iba perfecto, no a 10 fps. Vuelve la calidad alta por defecto también en el móvil; la ligera solo si la eliges tú.","Taller propio montado: Blender sin pantalla (instalado con pip) con MakeHuman (MPFB2) desde su repositorio. Crea humanos por código con edad, sexo, músculo, peso, altura y rasgos de la cara, y les pone esqueleto para juegos.","Primera prueba: tres personas distintas (hombre de mediana edad, mujer joven, anciano) fotografiadas en arcilla. Proporciones y caras anatómicas, y la edad se nota.","Lo que falta para usarlo: ojos, pieles, pelo, cejas y barbas vienen en paquetes libres de MakeHuman que solo se bajan de su web (los tiene que bajar Pedro). Su ropa es moderna, no medieval. Cada cuerpo tiene 26,8 mil triángulos y habría que reducirlo para el móvil."],"pruebas":"Personaje v4 en navegador PC y móvil: todo correcto. Taller: tres humanos creados y exportables sin errores.","capturas":"capturas/taller-makehuman","estado":"ok"},{"inicio":"2026-10-25T00:13:00+02:00","fin":"2026-10-25T01:12:00+02:00","titulo":"Taller propio: vestir y acabar por código un humano de MakeHuman","hito":"arte","hecho":["Ropa y acabado hechos por código encima del cuerpo de MakeHuman, sin paquetes de fuera: túnica, calzas, zapatos, cinturón, vestido largo y cofia con toca de lino.","Cada prenda sale de las mallas de ayuda que trae la propia base (malla ceñida y falda), así que hereda los pesos de los huesos y se moverá con el esqueleto sin pintar nada a mano.","Piel, cejas, labios, rojeces, pelo corto y barba pintados en texturas calculadas punto a punto; los bordes del pelo, la barba, el escote y las mangas salen suaves, sin escalones.","Se quita la piel que tapa la ropa: unos 19 mil triángulos por personaje (la base sola tenía 26,8 mil).","Comprobado también en three.js, con la luz y la cabaña de la prueba de estilo: se carga y se ve igual que en Blender.","Falta: que se mueva (el esqueleto de MakeHuman está en otra postura que las animaciones de Quaternius y hay que pasarlas de uno a otro), caras más finas y más tipos de pelo."],"pruebas":"Prueba de taller, no publicada como versión jugable: dos personajes exportados sin errores, vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.","capturas":"capturas/taller-vestir","estado":"ok"},{"inicio":"2026-10-25T01:20:28+02:00","fin":"2026-10-25T02:03:30+02:00","titulo":"Juego en inglés: construcción y combate con botón ES/EN","hito":"infra","hecho":["Módulo de idioma común (src/idioma.js): el texto en español es la clave y src/idiomas/en.json da la traducción; el ruso está preparado (ru.json vacío) y se ofrece en cuanto tenga textos.","Botón ES/EN arriba a la derecha en la construcción (v5) y en el combate (v5). Recuerda el idioma con la misma clave que la web: si eliges inglés en la web, el juego sale en inglés. Sin elección, manda el idioma del navegador.","Traducidos todos los textos: botones, ayuda, avisos, motivos de la lógica, piezas, materiales, armas, heridas, registro de combate, pantalla final y decisiones (unos 290).","Cambiar de idioma recarga la página sin perder la partida guardada.","En el móvil solo se ve el botón del otro idioma, para que el menú no crezca; el panel de opciones del combate baja para no tapar el menú.","Pruebas nuevas: prueba_idiomas.mjs (todo texto del código tiene traducción y las mismas variables) y prueba_idioma_navegador.py (PC y móvil, sin textos sin traducir ni palabras en español a la vista, el botón cambia, recuerda y no borra la partida). Las dos se rompieron a propósito una vez (MUTAR=1) y fallaron.","Decisión provisional: las pruebas de estilo y el personaje quedan en español hasta que Pedro revise el personaje (ninguna otra sesión toca su código); queda como tarea en espera.","Capturas de la construcción en capturas/construccion-v5."],"pruebas":"Todas correctas (probar_todo.sh): lógica 46/46, modelos 21/21, combate 69/69, personaje horneado, textos traducidos 231/231, navegador construcción, combate, estilo, personaje, juego en inglés (PC y móvil) y web. Capturas en inglés miradas en PC y móvil. No comprobado: en un móvil real.","capturas":"capturas/combate-v5","estado":"ok"},{"inicio":"2026-10-25T02:20:44+01:00","fin":"2026-10-25T02:48:34+01:00","titulo":"Recursos de personaje v2: comprimidos y con las 39 animaciones extra","hito":"arte","hecho":["Recursos v2 del personaje: los mismos modelos de la v1, con la geometría y las animaciones comprimidas (meshopt) y las texturas en WebP. La v1 publicada no se toca.","Un personaje (hombre campesino con pelo, barba y animaciones) baja 1,7 MB en vez de 8,1 MB; las animaciones, de 4,4 MB a 0,7 MB.","Las posiciones de los vértices no se comprimen: así la ropa, el pelo y la barba siguen compartiendo un solo esqueleto, como en la v3 del personaje.","El cargador de personajes abre los archivos comprimidos y, si se le pide, las 39 animaciones extra (vendarse, arco, minar, campo, pesca, espada ligera y pesada, escudo, pasos en todas direcciones, trepar, tumbarse…), cada una con un nombre en español.","Cinco extra se llaman igual que una básica (bloqueo, escudo, comer, brazos cruzados, empujón): la básica se queda como estaba y la extra va aparte, para no cambiar nada sin querer.","Prueba nueva en navegador: la v2 se ve igual que la v1 (diferencia media menor de 1 sobre 255), mismos triángulos y esqueletos, y cada animación extra mueve el cuerpo. Hoja con las 39 poses en las capturas.","No se ha cambiado el prototipo del personaje (REVISION.md pide que solo lo toque la sesión del chat hasta que Pedro lo revise): pasarlo a la v2 y añadir el selector de animaciones queda como tarea en espera.","No comprobado: cuánto tarda en bajar en un móvil real."],"pruebas":"Todas correctas: construcción 46/46, modelos 21/21, combate 69/69, personaje horneado 11/11, textos traducidos, navegador de construcción, combate, estilo, personaje, recursos v2 (PC y móvil), inglés y web. La prueba de recursos falla a propósito con MUTAR=1 (12 fallos).","capturas":"capturas/recursos-personaje-v2","estado":"ok"},{"inicio":"2026-10-25T05:42:02+01:00","fin":"2026-10-25T06:35:50+01:00","titulo":"Taller MakeHuman: barba pintada, labios más finos y fotos de la cabeza entera","hito":"arte","hecho":["La barba ya no es una cáscara encima de la cara: va pintada en la piel, con bordes difusos y pelillos, y el bigote baja por las comisuras hasta unirse a la barba.","Labios más finos y menos salidos (altura, profundidad y anchura de la boca). Medido: el ajuste de «volumen» de MakeHuman casi no cambia nada; lo que sirve es la altura y la profundidad.","Fallo de las fotos corregido (lo vio Pedro): el encuadre de la cara cortaba la barbilla. Ahora sale la cabeza entera, del pelo al cuello, en Blender y en three.js.","Con el encuadre nuevo se veían dos fallos que antes quedaban fuera, ya arreglados: un hueco oscuro en el escote de la túnica y el borde dentado de la toca."],"pruebas":"Prueba de taller, no publicada como versión jugable: dos personajes exportados y vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.","capturas":"capturas/taller-vestir-2","estado":"ok"},{"inicio":"2026-10-25T06:39:00+01:00","fin":"2026-10-25T07:16:00+01:00","titulo":"Personaje v5: el personaje del taller propio ya se mueve","hito":"arte","hecho":["Las animaciones de Quaternius se pasan al esqueleto de MakeHuman con un programa propio: el reposo de MakeHuman (brazos en «A») se lleva a la postura del original y en cada fotograma se copia el giro de cada hueso respecto a su reposo; la pelvis copia también los botes, escalados por la altura.","Probado con las nueve animaciones que usa el juego: quieto, andar, correr, talar, en guardia, golpe, parar, andar cargando y recoger. Los dos personajes las hacen bien, también la mujer con el vestido.","Personaje v5 publicado: en el visor hay una opción nueva, «Base del personaje», para elegir entre el paquete de Quaternius y el taller propio y compararlos.","Cada personaje del taller pesa unos 530 KB con ropa, texturas y animaciones (comprimido con WebP y meshopt) y tiene unos 19 mil triángulos.","Pruebas nuevas del taller en el visor: carga, se ve el cuerpo y la cara, y al andar se mueven piernas y brazos. Rotas a propósito: fallan como deben."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v5","estado":"ok"},{"inicio":"2026-10-25T07:37:00+01:00","fin":"2026-10-25T08:14:46+01:00","titulo":"Personaje v6: arreglada la ropa del taller vista del revés","hito":"arte","hecho":["Fallo que vio Pedro en la v5: en calidad alta la túnica, el vestido, el pelo y la cofia del taller propio se veían del revés, con manchas, y el pelo desaparecía.","Causa: el cargador de modelos apaga la escritura de profundidad en los materiales con transparencia; al pasarlos a recorte no se volvía a encender, y la piel se pintaba encima. En calidad ligera no pasaba, y las pruebas solo miraban esa.","Arreglado y con prueba nueva: en calidad alta todo el personaje del taller tiene que escribir profundidad. Rota a propósito: falla como debe.","Revisadas las capturas de los dos personajes en calidad alta, en PC y en móvil."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.","capturas":"capturas/personaje-v6","estado":"ok"},{"inicio":"2026-10-25T08:22:00+01:00","fin":"2026-10-25T09:07:48+01:00","titulo":"Personaje v7: postura y pecho del taller propio","hito":"arte","hecho":["Pedro: el hombre marcaba pecho, el cuerpo iba doblado hacia delante y los hombros muy para atrás.","Causa de la postura: las animaciones del paquete llevan el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atrás, a juego con sus muñecos de cabeza grande; además, al igualar la pelvis y las clavículas a las del paquete, la cadera se giraba 35° y los hombros se iban atrás.","Arreglo: solo los brazos se igualan al paquete; la inclinación del tronco, el cuello y las clavículas se mide en la animación de estar quieto y se quita en todas (queda un 30 %); y los brazos se giran desde el hombro para colgar rectos.","La túnica del hombre se alisa en el pecho para que caiga como tela, sin meterse dentro del cuerpo.","Recursos nuevos en recursos/personajes/taller-v2 (los de la v1 publicada no se tocan).","Prueba nueva de postura: cabeza y hombros sobre la pelvis y brazos sin irse atrás. Con los modelos de la v6 falla, como debe."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.","capturas":"capturas/personaje-v7","estado":"ok"},{"inicio":"2026-10-25T09:15:48+01:00","fin":"2026-10-25T09:15:48+01:00","titulo":"Decisión de Pedro: el taller propio es la base de los personajes","hito":"arte","hecho":["Pedro, tras ver el personaje v7: «lo veo bien, sigue», y elige el taller propio (cuerpo de MakeHuman con ropa hecha por código) como base de los personajes del juego. El paquete de Quaternius queda solo para comparar y como fuente de animaciones.","Se cierran las decisiones del personaje y de la ropa: la ropa histórica se hace por código en el taller; no hace falta comprar paquetes ni encargarla.","Las tareas del hito de arte se rehacen para el taller, de una sesión cada una: ropa por capas (camisa y gambesón; cota de malla y sobreveste; capa, calzado y tocados), personalización, más peinados y barbas, las 39 animaciones extra, ropa fabricable y heridas visibles."],"pruebas":"Sin cambios de código.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:15:48+01:00","fin":"2026-10-25T09:54:03+01:00","titulo":"Personaje v8: ropa por capas en el taller propio","hito":"arte","hecho":["Primera tanda de ropa por capas hecha por código sobre el cuerpo de MakeHuman: camisa de lino (en la mujer, larga hasta los tobillos), calzas y zapatos siempre puestos; encima túnica (hombre) o vestido (mujer); y sobre todo, el gambesón acolchado, con los canales cosidos pintados en vertical en el cuerpo y en anillos en las mangas.","Cada capa va algo más separada de la piel que la de debajo, y lo que queda tapado del todo no se dibuja: el cuerpo de una prenda se esconde si lleva otra encima y su falda solo asoma si es más larga. Así no se atraviesan al moverse y se ahorran triángulos (unos 16 a 20 mil por personaje según lo que lleve).","Un cinturón por capa; solo se ve el de la capa de más fuera.","En el visor, botones «Túnica», «Vestido» y «Gambesón» para poner y quitar capas. El taller propio sale por defecto.","Arreglos vistos en las capturas: las calzas asomaban por la camisa y el vestido por la tripa del gambesón; ya no.","Pruebas nuevas: el gambesón se pone encima y tapa el cuerpo de la prenda de debajo, y al quitarlo vuelve como estaba; el taller sale por defecto. Rotas a propósito: fallan."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v8","estado":"ok"},{"inicio":"2026-10-25T09:39:58+01:00","fin":"2026-10-25T09:42:16+01:00","titulo":"Hito 1c: planificación de las piezas nuevas","hito":"construccion-mas","hecho":["Pedro, por el chat: «puedes hacer, están haciendo los modelados de ropa; haz algo no relacionado». Elige planificar el hito de construcción, que no toca el personaje. Se hace aunque el hito de arte bloquee empezar hitos nuevos, porque lo pide él.","Comparadas las piezas del documento de sistemas con las que ya hay en el juego. Faltan: escalera de tablas, contraventana, trampilla, tejado de teja, remate de tejado, chimenea, adarve, puente de troncos y parte de la decoración.","Hito desglosado en 9 tareas de una sesión: escalera de tablas, barandillas y vallas, contraventana y trampilla, tejado de teja, remate de tejado, chimenea, adarve, decoración que falta y revisión final.","Los puentes de troncos se dejan para el hito Mundo, porque necesitan agua en el mapa.","Esta sesión no toca proyecto/sesion.json, que es de la sesión de la ropa."],"pruebas":"Sin cambios de código. Web reconstruida sin errores.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:58:47+01:00","fin":"2026-10-25T09:58:47+01:00","titulo":"Decisiones de Pedro: estilo, cámara táctil, curación y fuego amigo","hito":"arte","hecho":["Estilo del mundo: el «realismo en miniatura» de la prueba de estilo v5 es la base. Se desbloquean terreno, hierba, árboles, más detalle en las piezas de construcción y el rendimiento en el móvil.","Cámara táctil en el combate: arrastrar un dedo por zona libre gira la cámara, tocar sin arrastrar sigue golpeando, y con el arco la cámara sigue sola a donde apuntas.","Curación: base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso); en pleno combate se puede, pero lento y quedando vendido.","Fuego amigo: sigue al PvP, como dice el diseño (PvP activo, desactivado dentro de la familia): a alguien de tu familia un tajo no le hace nada; a cualquier otro le hiere como un golpe normal.","Ya no queda ninguna decisión pendiente: todas las tareas en espera pasan a pendientes."],"pruebas":"Sin cambios de código.","capturas":"","estado":"ok"},{"inicio":"2026-10-25T09:59:09+01:00","fin":"2026-10-25T10:57:23+01:00","titulo":"Personaje v9: cota de malla y sobreveste","hito":"arte","hecho":["Cota de malla como capa, sobre el gambesón: hasta la rodilla, mangas hasta medio antebrazo (asoma el gambesón por debajo) y anillas pintadas por código en filas cruzadas, del mismo tamaño en el cuerpo, las mangas y la falda.","El metal va a medias: sin reflejos del entorno, el metal puro salía casi negro en el juego.","Sobreveste sin mangas de lana teñida, por encima de todo, hasta media pierna (en la mujer, hasta los tobillos).","Cada prenda va ahora partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota y del gambesón; las mangas de debajo solo se dibujan si asoman.","Arreglos vistos en las capturas: con la cota se abrían agujeros en lo alto de los hombros (el corte del cuello llegaba hasta ahí) y quedaban huecos entre el cuerpo y las mangas; ya no.","Prueba nueva: con la sobreveste se ven las mangas y el cuello de la cota. Rota a propósito: falla."],"pruebas":"Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. Unos 1,5 MB por personaje con todas las prendas. No comprobado: fps en un móvil de verdad.","capturas":"capturas/personaje-v9","estado":"ok"},{"inicio":"2026-10-25T10:19:54+01:00","fin":"2026-10-25T10:48:43+01:00","titulo":"Hito 1c: escalera de tablas","hito":"construccion-mas","hecho":["Pieza nueva «Escalera de tablas» (6 tablas y 6 clavos, 100 kg, en Acceso): ocupa una casilla y sube una planta.","Se sube y se baja andando, sin botón: se entra por el lado bajo y se sale arriba a la casilla de al lado; gira con R hacia dónde sube.","Encima queda el hueco abierto: no deja poner suelo sobre la escalera, ni la escalera bajo un suelo; en la última planta no cabe.","Se apoya en el cimiento o suelo de su casilla (o en la tierra en la planta baja) y suma su peso; si se quita ese suelo, cae.","Por debajo del tramo alto se puede pasar sin subir. Por el hueco se puede caer a la escalera desde arriba: las barandillas llegan en la tarea siguiente (anotado en el registro de decisiones).","Construcción v6 publicada."],"pruebas":"Todas con herramientas/probar_todo.sh: lógica de construcción 63/63 (17 nuevas de la escalera), modelos 21/21, combate 69/69, personaje 11/11, textos traducidos, y navegador de construcción (subir y bajar andando, hueco, pasar por debajo), combate, estilo, personaje, recursos, inglés y web correctos. Las pruebas nuevas se rompieron a propósito una vez (sin hueco, sin giro, sin subir andando) y fallaron.","capturas":"capturas/construccion-v6","estado":"ok"}],"capturas":{"capturas/construccion-v3":["01_cabana_vista_general.jpg","02_interior_sin_tejado.jpg","03_rechazo_por_carga.jpg","04_desmontar_cascada.jpg","05_barra_construccion_pc.jpg","06_movil_mover.jpg","07_movil_construir.jpg","08_cobertizo_pendiente_continua.jpg","09_cabana_desde_atras.jpg","10_primer_plano_fachada.jpg","11_primer_plano_trasera_ventana.jpg"],"capturas/construccion-v4":["01_cabana_vista_general.jpg","02_interior_sin_tejado.jpg","03_rechazo_por_carga.jpg","04_desmontar_cascada.jpg","05_barra_construccion_pc.jpg","06_movil_mover.jpg","07_movil_construir.jpg","08_cobertizo_pendiente_continua.jpg","09_cabana_desde_atras.jpg","10_primer_plano_fachada.jpg","11_primer_plano_trasera_ventana.jpg","12_casa_dos_plantas.jpg","13_casa_dos_plantas_detras.jpg"],"capturas/construccion-v5":["01_cabana_vista_general.jpg","construccion_movil_01_inicio.jpg","construccion_movil_02_construir.jpg","construccion_movil_03_ayuda.jpg","construccion_movil_04_decisiones.jpg","construccion_pc_01_inicio.jpg","construccion_pc_02_construir.jpg","construccion_pc_03_ayuda.jpg","construccion_pc_04_decisiones.jpg"],"capturas/construccion-v6":["01_cabana_vista_general.jpg","02_interior_sin_tejado.jpg","03_rechazo_por_carga.jpg","04_desmontar_cascada.jpg","05_barra_construccion_pc.jpg","0 estructura":"Infrastructure","Repositorio en GitHub, web de progreso y trabajo automático por horas.":"GitHub repository, progress website and hourly automatic work.","Idiomas: español e inglés ya en la web; el ruso, más adelante, cuando Pedro lo pida.":"Languages: Spanish and English are already on the website; Russian later, when Pedro asks for it.","Repositorio, web de progreso y tarea programada":"Repository, progress website and scheduled task","Web de progreso en inglés: selector ES/EN y todo el roadmap y el diario traducidos":"Progress website in English: ES/EN switch and the whole roadmap and log translated","Documentos de diseño en inglés (GDD, sistemas y análisis), con selector de idioma":"Design documents in English (GDD, systems and analysis), with a language switch","Juego en inglés: textos de los prototipos con selector de idioma, preparado para añadir ruso":"Game in English: prototype texts with a language switch, ready for adding Russian","Pruebas de estilo y personaje en inglés (con el mismo módulo de idioma), cuando Pedro haya revisado el personaje: ahora mismo nadie más toca su código":"Style tests and character in English (with the same language module), once Pedro has reviewed the character: right now nobody else touches its code","Construcción":"Building","Moverse con cámara libre (PC y táctil) y construir con rejilla anclada, carga, desmontaje en cascada con 75% de recuperación y decoración libre.":"Move with a free camera (PC and touch) and build on an anchored grid with load limits, cascading dismantling with 75% recovery, and free decoration.","Hecho el 24 oct entre las 15:55 y las 16:40 aprox. (sacado de las fechas de los archivos; los tiempos exactos de esta parte no se registraron).":"Done on 24 Oct between about 15:55 and 16:40 (taken from file dates; exact times for this part were not recorded).","Lógica: rejilla anclada, apoyos, carga, desmontaje en cascada":"Logic: anchored grid, supports, load, cascading dismantling","Piezas low-poly por código y personaje":"Low-poly pieces built in code, and the character","Cámara libre y controles PC y táctil":"Free camera and PC and touch controls","v2: los muros cierran hasta el tejado y los tejados seguidos forman una sola pendiente":"v2: walls close up to the roof and consecutive roofs form a single slope","v3: todos los muros llegan exactamente a 2,5 m (10 hiladas de 25 cm)":"v3: all walls reach exactly 2.5 m (10 courses of 25 cm)","Dirección de arte y personajes":"Art direction and characters","Personaje con proporciones y detalle realistas, personalización (cuerpo, cara, pelo, piel) y ropa y armaduras que se ven puestas; luz, materiales y paleta sobrios; terreno y piezas de construcción con más detalle. Low-poly por código, pero que se vea bien y aguante en móvil.":"A character with realistic proportions and detail, customisation (body, face, hair, skin) and clothing and armour that show when worn; restrained light, materials and palette; terrain and building pieces with more detail. Low-poly built in code, but good-looking and able to run on mobile.","Prioridad alta: antes de añadir más piezas o sistemas, para no rehacerlos luego con el estilo nuevo.":"High priority: before adding more pieces or systems, so they don't have to be redone in the new style later.","Tres pruebas de estilo (personaje y una escena con cabaña) con distinta luz, materiales y nivel de detalle, para que Pedro elija":"Three style tests (character and a scene with a cabin) with different lighting, materials and level of detail, for Pedro to choose from","Rehacer las pruebas de estilo (revisión de Pedro: B y C van muy lentos y el personaje no vale): un solo estilo estilizado y ligero (material barato tipo toon o Lambert, paleta en una textura pequeña, una luz con sombra de 1024, resolución adaptativa), presupuesto medido: escena ≤ 30 mil triángulos y ≤ 60 dibujados, 60 fps en móvil medio":"Redo the style tests (Pedro's review: B and C are very slow and the character doesn't work): a single light, stylised style (cheap toon or Lambert material, palette in a small texture, one light with a 1024 shadow, adaptive resolution), measured budget: scene ≤ 30k triangles and ≤ 60 draw calls, 60 fps on a mid-range phone","Prueba de estilo v3, «maqueta en miniatura» (elegido por Pedro): formas limpias y redondeadas, luz suave con sombras de contacto, fondo desenfocado; cimiento de piedra continuo (no piedras sueltas); mismo presupuesto":"Style test v3, \"miniature diorama\" (chosen by Pedro): clean, rounded shapes, soft light with contact shadows, blurred background; continuous stone foundation (not loose stones); same budget","Prueba de estilo v4, «realismo en miniatura» (pedido por Pedro): la v3 con texturas por código y el mundo sin recortar":"Style test v4, \"miniature realism\" (requested by Pedro): v3 with code-generated textures and an uncropped world","Prueba de estilo v5: árboles rehechos (Pedro: «los árboles fatal, se ven como rayajos raros; la casa está bien»)":"Style test v5: trees redone (Pedro: \"the trees are awful, they look like weird scribbles; the house is fine\")","Personaje nuevo por código (decidido por Pedro), vistoso y con el estilo de maqueta: una sola malla continua con esqueleto y animación, proporciones creíbles algo estilizadas":"New character built in code (Pedro's decision), eye-catching and in the diorama style: a single continuous mesh with skeleton and animation, believable, slightly stylised proportions","Personaje base articulado con el estilo elegido (también el rival del combate) (hecho con el personaje nuevo por código)":"Articulated base character in the chosen style (also the combat opponent) (done with the new code-made character)","Personaje v2 con bases libres (CC0) ya hechas en vez de esculpirlo por código (Pedro: «horripilante»): cabeza, ropa, pelo y animaciones del paquete, con personalización":"Character v2 from ready-made free (CC0) bases instead of sculpting it in code (Pedro: \"horrifying\"): head, clothing, hair and animations from the pack, with customisation","Personaje v3: rendimiento en el móvil (iba a 10 fps) y fuera el traje de explorador por ser de fantasía":"Character v3: mobile performance (it ran at 10 fps) and the ranger outfit removed for being too fantasy","Recursos de personaje v2: todo comprimido (las animaciones bajan de 4,4 MB a unos 0,7 MB) y el personaje con las 39 animaciones extra (trabajos, arco, espada ligera y pesada, bloqueo, vendarse, pasos en todas direcciones)":"Character assets v2: everything compressed (animations drop from 4.4 MB to about 0.7 MB) and the character with the 39 extra animations (work, bow, light and heavy sword, block, bandaging, steps in every direction)","Taller propio sin pantalla (Blender por pip) para reasignar animaciones, reducir mallas y probar a crear cuerpos y caras propios con MakeHuman (MPFB2), con su esqueleto compatible":"Our own headless workshop (Blender via pip) to retarget animations, reduce meshes and try creating our own bodies and faces with MakeHuman (MPFB2), whose skeleton is compatible","Taller: ropa por capas, primera tanda — camisa de lino bajo la túnica y gambesón acolchado encima, hechos por código sobre el cuerpo de MakeHuman, que se ponen y se quitan como capas":"Workshop: layered clothing, first batch — linen shirt under the tunic and a padded gambeson over it, made by code on the MakeHuman body, put on and taken off as layers","Taller: cota de malla (anillas por código) y sobreveste encima, como capas":"Workshop: mail (rings made by code) and a surcoat over it, as layers","Taller: capa con capucha, calzado y tocados (capucha suelta, sombrero de paja, toca)":"Workshop: hooded cloak, footwear and headwear (loose hood, straw hat, coif)","Taller: personalización — altura, complexión y cara con los ajustes de MakeHuman, tono de piel, color de ojos, peinado y barba":"Workshop: customization — height, build and face with the MakeHuman settings, skin tone, eye colour, hairstyle and beard","Taller: más peinados (melena, coleta, trenzas) y barbas (corta, larga, perilla), y arreglar la claridad de la barbilla":"Workshop: more hairstyles (long, ponytail, braids) and beards (short, long, goatee), and fix the light patch on the chin","Taller: pasar también las 39 animaciones extra (trabajos, arco, espada, bloqueo, vendarse, pasos) al esqueleto de MakeHuman":"Workshop: also transfer the 39 extra animations (jobs, bow, sword, block, bandaging, steps) to the MakeHuman skeleton","Ropa y armadura crafteables por capas (camisa, gambesón, cota de malla, sobreveste): cada pieza fabricada cambia su aspecto según material, tinte y calidad, sobre el mismo esqueleto":"Craftable layered clothing and armour (shirt, gambeson, mail, surcoat): each crafted piece changes its look by material, dye and quality, on the same skeleton","Heridas y sangrado visibles en el personaje: corte, golpe y estocada se pintan donde entran (también rompen y manchan la ropa), el sangrado se extiende con el tiempo y el vendaje se ve puesto":"Visible wounds and bleeding on the character: cuts, blows and thrusts are painted where they land (they also tear and stain the clothing), bleeding spreads over time and bandages show when applied","Terreno, hierba, árboles y luz con el estilo elegido":"Terrain, grass, trees and lighting in the chosen style","Piezas de construcción con más detalle: corteza, juntas, tablas, paja":"Building pieces with more detail: bark, joints, planks, thatch","Rendimiento en móvil: medir y ajustar el nivel de detalle":"Mobile performance: measure and adjust the level of detail","Revisión completa y publicación":"Full review and release","Más piezas de construcción":"More building pieces","Escaleras de caminar de un bloque, barandillas, vallas y más piezas para que construir dé juego.":"Walkable one-block stairs, railings, fences and more pieces to make building more interesting.","La primera tarea (madera más resistente) se adelantó el 24 oct porque la casa de dos plantas de Pedro y su pareja no admitía el tejado en las esquinas. Planificado el 25 oct a petición de Pedro por el chat, en paralelo a la sesión de la ropa. Los puentes de troncos no entran: necesitan agua en el mapa y llegan con el hito Mundo.":"The first task (sturdier wood) was brought forward on 24 Oct because Pedro and his partner's two-storey house would not accept the roof at the corners. Planned on 25 Oct at Pedro's request in the chat, in parallel with the clothing session. Log bridges are not included: they need water on the map and come with the World milestone.","Más resistencia en la madera (Pedro: «la madera es demasiado débil, no deja hacer 2 pisos con tejado»): una casa de 2 plantas con tejado hecha solo con piezas básicas de madera (cimiento, muros y suelo de troncos) tiene que poder construirse sin trucos; construir sin volverse loco, pero que se puedan hacer cosas. Prueba de lógica que lo garantice y capturas de la casa":"More strength for wood (Pedro: \"wood is too weak, it won't allow 2 storeys with a roof\"): a 2-storey house with a roof made only of basic wooden pieces (log foundation, walls and floor) must be buildable without tricks; building shouldn't drive you mad, but you should be able to do things. A logic test that guarantees it, and screenshots of the house","Planificar el hito: lista de piezas sacada del GDD y del documento de sistemas":"Plan the milestone: list of pieces taken from the GDD and the systems document","Escalera de tablas (N2: 6 tablas y clavos): ocupa una casilla, sube una planta y se sube andando, sin botón; deja el hueco abierto en el suelo de arriba. Pruebas de lógica (apoyos y hueco) y de navegador (subir y bajar andando)":"Plank staircase (T2: 6 planks and nails): takes one tile, climbs one floor and is walked up, no button needed; leaves the hole open in the floor above. Logic tests (supports and hole) and browser tests (walking up and down)","Barandillas y vallas: medio muro como barandilla en el borde de un suelo en alto (no se puede caer por ahí) y portillo para la cerca de varas (corrales), que se abre con Usar como las puertas":"Railings and fences: half wall as a railing on the edge of a raised floor (you cannot fall off there) and a gate for the stick fence (pens), opened with Use like doors","Contraventana y trampilla (N2: 2 tablas y clavos): la contraventana cierra la ventana de un muro y la trampilla tapa el hueco de una escalera; las dos se abren y cierran con Usar. Añadir también el muro de tablas con ventana, que falta":"Shutter and trapdoor (T2: 2 planks and nails): the shutter closes a wall's window and the trapdoor covers a staircase hole; both open and close with Use. Also add the plank wall with window, which is missing","Tejado de teja (N2: 10 tejas y vigas, pesa 200 kg, no se pudre ni arde fácil): material nuevo «teja» y su prueba de carga":"Tile roof (T2: 10 tiles and beams, weighs 200 kg, does not rot or burn easily): new «tile» material and its load test","Remate de tejado: cumbrera y esquinas, para que los tejados de dos tramos que se cruzan en una esquina queden cerrados":"Roof finishing: ridge and corners, so that two-section roofs meeting at a corner are closed","Chimenea u hogar interior (N2: piedras y barro, 600 kg): solo sobre cimiento de piedra, con fuego, luz y humo que sale por el tejado":"Chimney or indoor hearth (T2: stones and mud, 600 kg): only on a stone foundation, with fire, light and smoke coming out through the roof","Adarve (pasarela por detrás de la empalizada: tablas y postes, sostiene 300 kg), al que se sube por escalera de mano o de tablas":"Wall walk (walkway behind the palisade: planks and posts, holds 300 kg), reached by a ladder or a plank staircase","Decoración que falta del documento de sistemas: tinaja, antorcha de pared, tapiz y ganchos para herramientas":"Missing decoration from the systems document: storage jar, wall torch, tapestry and tool hooks","Equipo y carga por huecos":"Equipment and slot-based carrying","Panel de inventario, cinturones, leñero y otras mochilas; tala, transporte y ralentización por cargar.":"Inventory panel, belts, firewood frame and other backpacks; felling, hauling and slowing down when carrying.","Estaciones y crafting":"Workstations and crafting","Primeras estaciones, recetas, desbloqueo por práctica, durabilidad y reparación.":"First workstations, recipes, unlocking through practice, durability and repair.","Supervivencia":"Survival","Necesidades con avisos, ropa contra el frío, cama ligada y muerte con saqueo parcial.":"Needs with warnings, clothing against the cold, bound bed, and death with partial looting.","Duelo":"Duel","Esgrima contra un bot con heridas.":"Fencing against a bot, with wounds.","El campo de pruebas de combate se adelantó para probar el sistema antes del resto. v1 y v2 hechas el 24 oct entre las 16:45 y las 17:25 aprox.":"The combat test ground was brought forward to try the system before everything else. v1 and v2 done on 24 Oct between about 16:45 and 17:25.","Combate v1: líneas de golpe, guardias, heridas, arco":"Combat v1: strike lines, guards, wounds, bow","Combate v2: rosa de golpes, parada perfecta, golpe maestro, fintas, peso de los golpes":"Combat v2: strike rose, perfect parry, master strike, feints, weight of blows","Arreglo del arco: no soltar antes del 50% de tensión, correr cancela el tensado, 0,8 s para encajar otra flecha (piedras 0,5 s), con pruebas":"Bow fix: no release below 50% draw, running cancels the draw, 0.8 s to nock another arrow (stones 0.5 s), with tests","Escudo provisional: opción «Espada y escudo» (espada de una mano), para flechas y piedras de frente, parada más barata, se ve en el brazo izquierdo y se levanta al parar; también para el rival":"Provisional shield: \"Sword and shield\" option (one-handed sword), stops arrows and stones from the front, cheaper parry, visible on the left arm and raised when parrying; also for the opponent","Cámara táctil con un dedo durante el combate":"One-finger touch camera during combat","Curación de heridas":"Wound healing","Asedio, fuego y mantenimiento":"Siege, fire and upkeep","Ariete, daño por fuego, mojón con materiales.":"Battering ram, fire damage, boundary stone with materials.","Fauna y caza":"Wildlife and hunting","Animales realistas.":"Realistic animals.","Caballos":"Horses","Domar, montar, cuadra y pasto.":"Taming, riding, stable and pasture.","Granja y estaciones del año":"Farming and seasons","Siembras por franja, ganado.":"Sowing by climate band, livestock.","Mundo":"World","Pseudo-Europa por semilla, 5 países con estilo propio, caminos por uso, puentes.":"Pseudo-Europe from a seed, 5 countries each with its own style, roads formed by use, bridges.","Servidor y cuentas":"Server and accounts","Registro e inicio de sesión seguros, recuperación de cuenta, creación de personaje, mundo persistente con servidor autoritativo.":"Secure registration and login, account recovery, character creation, persistent world with an authoritative server.","Prioridad alta. Contraseñas con hash, conexión cifrada, límite de intentos, copias de seguridad.":"High priority. Hashed passwords, encrypted connection, attempt limits, backups.","Administración, registros y seguridad":"Administration, logs and security","Roles (jugador, moderador, administrador) para la cuenta de Pedro y las que él decida; panel de administración; registros consultables de lo que pasa en el mundo (comercio, saqueos, construcción y destrucción, muertes, conexiones); detección de trampas en el servidor (velocidad, alcance, acciones imposibles); sanciones (aviso, silencio, expulsión, bloqueo) y registro de lo que hace cada administrador.":"Roles (player, moderator, administrator) for Pedro's account and those he chooses; admin panel; searchable logs of what happens in the world (trade, looting, building and destruction, deaths, connections); server-side cheat detection (speed, reach, impossible actions); sanctions (warning, mute, kick, ban) and a log of what each administrator does.","Prioridad alta: es un juego online persistente. Desde ya, toda acción que cambia el mundo pasa por la lógica con autor, para poder registrarla después.":"High priority: this is a persistent online game. From now on, every action that changes the world goes through the logic with an author, so it can be logged later.","PvP online y protección offline":"Online PvP and offline protection","Combate y asedio entre jugadores; reglas de guerra.":"Combat and sieges between players; rules of war.","Tierras y familias":"Lands and families","Mojones, radio de exclusión, peajes, conquista, familias, vasallajes, alianzas, escudos de armas.":"Boundary stones, exclusion radius, tolls, conquest, families, vassalage, alliances, coats of arms.","Economía y NPCs":"Economy and NPCs","Encargos y moneda, puestos sin conexión, tomos, NPCs ambulantes a sueldo, centinelas y mensajeros.":"Commissions and currency, offline stalls, tomes, hired travelling NPCs, sentries and messengers.","Combate a caballo y a distancia":"Mounted and ranged combat","Arcos, ballestas, lanzas de caballería.":"Bows, crossbows, cavalry lances.","Navegación":"Sailing","Astillero, barcos, navegar con otros.":"Shipyard, ships, sailing with others.","Cartografía":"Cartography","Mesa de cartógrafo y mapas como objetos.":"Cartographer's table and maps as objects.","Construye una cabaña: cimientos, suelos, muros, tejados y muebles, con límite de carga.":"Build a cabin: foundations, floors, walls, roofs and furniture, with load limits.","Muros exactos a 2,5 m por hiladas.":"Walls exactly 2.5 m high, built in courses.","Madera más resistente: casa de 2 plantas con tejado de troncos; vano de una casilla en suelos y tejados.":"Stronger wood: a 2-storey log house with a roof; one-cell span for floors and roofs.","Juego en inglés: botón ES/EN arriba a la derecha (recuerda el idioma elegido, también el de la web) y todos los textos traducidos; la partida no se pierde al cambiar.":"Game in English: ES/EN button at the top right (remembers the chosen language, including the website's) and all texts translated; your game isn't lost when switching.","Escalera de tablas: ocupa una casilla y se sube andando, sin botón; encima deja el hueco abierto.":"Plank stairs: they take one tile and you climb them by walking, no button; they leave the opening above open.","Combate":"Combat","Campo de pruebas: duelo con espada o palo, prácticas con poste y dianas, carga a distancia.":"Test ground: duel with sword or staff, practice with a post and targets, ranged charge.","Rosa de golpes y defensa en tres capas.":"Strike rose and three-layer defence.","Arco arreglado: tensión mínima, sin tensar corriendo y 0,8 s para encajar flecha.":"Bow fixed: minimum draw, no drawing while running, and 0.8 s to nock an arrow.","Escudo provisional: nueva arma «Espada y escudo» (espada de una mano, 1,7 m de alcance). Al parar se levanta el escudo, que detiene también flechas y piedras de frente y cansa menos que parar con la espada. Nueva opción «Arma del rival»: el rival con escudo lo levanta cuando le apuntas.":"Provisional shield: new \"Sword and shield\" weapon (one-handed sword, 1.7 m reach). Parrying raises the shield, which also stops arrows and stones from the front and is less tiring than parrying with the sword. New \"Opponent's weapon\" option: an opponent with a shield raises it when you aim at them.","Combate en inglés: botón ES/EN arriba a la derecha y todos los textos traducidos (ayuda, avisos, registro, menús y decisiones). En el móvil, el panel de opciones ya no tapa el menú.":"Combat in English: ES/EN button at the top right and all texts translated (help, status, log, menus and decisions). On mobile, the options panel no longer covers the menu.","Prueba de estilo":"Style test","Cabaña en un claro con el estilo propuesto: realismo en miniatura.":"A cabin in a clearing in the proposed style: miniature realism.","Tres estilos (A plano, B suave, C texturas) con cabaña y personaje: elige uno.":"Three styles (A flat, B soft, C textured) with cabin and character: pick one.","Un solo estilo estilizado y ligero: 30 mil triángulos y 12 dibujados, sin personaje (espera tu decisión).":"A single light, stylised style: 30k triangles and 12 draw calls, no character (awaiting your decision).","Maqueta en miniatura: formas redondeadas, luz suave, sombras de contacto y desenfoque; zócalo de piedra continuo.":"Miniature diorama: rounded shapes, soft light, contact shadows and blur; continuous stone plinth.","Realismo en miniatura: la maqueta con texturas por código y el mundo sin recortar.":"Miniature realism: the diorama with code-generated textures and an uncropped world.","Árboles rehechos: copas suaves en racimos y pinos con puntas, sin rayajos.":"Trees redone: soft clustered canopies and pines with drooping tips, no scribbles.","Personaje por código: una sola malla con esqueleto, quieto y andando; vistas Personaje y Cara":"Character built in code: a single mesh with a skeleton, standing and walking; Character and Face views","Personaje":"Character","El humano base esculpido por código, con ropa por capas, esqueleto y andar, delante de la cabaña.":"The base human sculpted in code, with layered clothing, skeleton and walk cycle, in front of the cabin.","Personaje esculpido por código: cara, manos, ropa por capas, esqueleto y andar.":"Character sculpted in code: face, hands, layered clothing, skeleton and walk cycle.","Personaje con bases libres (CC0) ya hechas y personalización: hombre o mujer, ropa, peinado, color de pelo, piel y barba.":"Character from ready-made free (CC0) bases with customisation: man or woman, clothing, hairstyle, hair colour, skin and beard.","Más ligero en el móvil (calidad ligera, un solo esqueleto, menos resolución) con interruptores para medir; sin el traje de explorador.":"Lighter on mobile (light quality, a single skeleton, lower resolution) with switches to measure; ranger outfit removed.","Vuelve la calidad alta por defecto en el móvil (iba
