иль, персонаж, ресурсы, английский и сайт). После этого менялись только план, дневник и переводы: тесты сайта и переводов повторены. Игровых изменений нет: новой версии нет. Не проверено: что текстуры получаются идентичными попиксельно и что коммит MPFB2 — именно тот, что использовался вначале (это последний коммит от 24 окт., до установки мастерской).","Versiones del taller fijadas en herramientas/taller/versiones.json: Python 3.13, Blender por pip (bpy 5.2.3), numpy, Pillow, MPFB2 en su commit exacto (versión 2.0.18) y los paquetes de node.":"Версии мастерской зафиксированы в herramientas/taller/versiones.json: Python 3.13, Blender через pip (bpy 5.2.3), numpy, Pillow, MPFB2 на точном коммите (версия 2.0.18) и пакеты node.","Los programas del taller comprueban las versiones al empezar: si algo no coincide, paran y dicen qué; lo encontrado queda anotado junto a los personajes que salen.":"Программы мастерской проверяют версии при запуске: если что-то не совпадает, они останавливаются и сообщают, что именно; найденное записывается рядом с созданными персонажами.","Guía para montarlo desde cero (herramientas/taller/LEEME.md) y un programa que lo monta solo con esas versiones.":"Руководство по установке с нуля (herramientas/taller/LEEME.md) и программа, которая сама всё устанавливает с этими версиями.","Comprobado montándolo desde cero en una máquina vacía: los dos personajes salen con las mismas 47 mallas (mismos vértices y tamaño) que los recursos publicados taller-v4.":"Проверено установкой с нуля на пустой машине: оба персонажа получаются с теми же 47 сетками (те же вершины и размер), что и в опубликованных ресурсах taller-v4.","Visto en las fotos del taller: el cinturón de encima de la cota sobresale hacia los lados (ya estaba publicado así); queda como tarea en el hito de arte.":"Замечено на фотографиях мастерской: пояс поверх кольчуги выступает в стороны (так уже было опубликовано); оставлено задачей в этапе графики.","Prueba nueva sin Blender (formato de las versiones y que una diferencia se detecta), rota a propósito una vez (MUTAR=1): falla.":"Новый тест без Blender (формат версий и обнаружение различий), один раз намеренно сломан (MUTAR=1): он не проходит.","Hito 0b: diario y traducciones sin choques":"Этап 0b: дневник и переводы без конфликтов","Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Sin cambios jugables ni visuales: no hay versión nueva ni capturas. No comprobado: el orden exacto del diario en una fusión antigua, donde la entrada se había colocado a mano fuera de su hora.":"Все тесты пройдены (логика 63, модели 21, бой 69, действия 25, слияние 19, мастерская, переводы и браузер: строительство, бой, стиль, персонаж, ресурсы, английский и сайт). Игровых и визуальных изменений нет: новой версии и снимков нет. Не проверено: точный порядок дневника в одном старом слиянии, где запись вручную поставили не по времени.","Herramienta nueva (herramientas/unir_json.mjs) que une diario.json y las traducciones al fusionar ramas: entran las entradas y los textos de las dos ramas, y el diario queda en orden de hora.":"Новый инструмент (herramientas/unir_json.mjs), который объединяет diario.json и переводы при слиянии веток: записи и тексты из обеих веток попадают в итог, а дневник остаётся в порядке времени.","Git la usa sola al fusionar (se activa en cada clon con --instalar); solo se para si dos ramas cambian distinto la misma entrada o traducción.":"Git использует его сам при слиянии (включается в каждом клоне через --instalar); он останавливается, только если две ветки по-разному меняют одну и ту же запись или перевод.","Comprobado rehaciendo las cuatro fusiones anteriores de main: el diario y las traducciones salen con el mismo contenido que se unió a mano y sin conflictos en esos archivos.":"Проверено повтором четырёх прежних слияний в main: дневник и переводы получаются с тем же содержимым, что объединяли вручную, и без конфликтов в этих файлах.","Regla en CLAUDE.md: activarla al empezar cada sesión, y si choca la web generada, volver a generarla en vez de unirla a mano.":"Правило в CLAUDE.md: включать его в начале каждой сессии, а если конфликтует сгенерированный сайт — сгенерировать его заново, а не объединять вручную.","Prueba nueva con casos pequeños y un caso real con git de dos sesiones en paralelo; rota a propósito una vez (MUTAR=1): falla.":"Новый тест с небольшими случаями и реальным случаем в git с двумя параллельными сессиями; один раз специально сломан (MUTAR=1): падает.","Hito 0b: revisión completa":"Этап 0b: полная проверка","Todas correctas (lógica 63, modelos 21, combate 69, acciones 25, unión 19, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil. Construcción y combate repetidas tras el arreglo de la prueba.":"Все пройдены (логика 63, модели 21, бой 69, действия 25, слияние 19, мастерская, переводы и браузер: строительство, бой, стиль, персонаж, ресурсы, английский и сайт), ПК и телефон. Строительство и бой повторены после исправления теста.","Pasadas todas las pruebas del proyecto con probar_todo.sh: las cuatro demos en PC y móvil, inglés, recursos de personaje, taller, traducciones y web.":"Пройдены все тесты проекта через probar_todo.sh: четыре демо на ПК и телефоне, английский, ресурсы персонажей, мастерская, переводы и сайт.","Revisadas las capturas de construcción, combate, estilo, personaje y web: todo se ve como antes del hito, que no cambia nada a la vista.":"Просмотрены снимки строительства, боя, стиля, персонажа и сайта: всё выглядит как до этапа, который ничего видимого не меняет.","Quedaba sin comprobar que las pruebas de navegador del registro de acciones fallan si una acción no se anota: comprobado quitando el apunte en el registro; la de la construcción y las dos del combate fallan.":"Оставалось не проверено, что браузерные тесты журнала действий падают, если действие не записано: проверено, убрав запись в журнал; тест строительства и оба теста боя падают.","Arreglada la del combate: con el registro vacío rompía la prueba entera en vez de fallar esa comprobación y seguir.":"Исправлен тест боя: при пустом журнале он обрушивал весь тест вместо того, чтобы провалить эту проверку и продолжить.","Sin versión jugable nueva: el hito prepara el proyecto, no cambia nada a la vista.":"Новой играбельной версии нет: этап готовит проект и ничего видимого не меняет.","El hito 0b queda en revisión, esperando a valravnx.":"Этап 0b на проверке, ждёт valravnx.","Arreglo: quitar muebles con el ratón":"Исправление: убрать мебель мышью","Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de los cuatro prototipos, recursos, inglés y web), PC y móvil. No comprobado: en una pantalla táctil de verdad (el toque no cambia: elige y pide confirmar como antes).":"Все пройдены через probar_todo.sh (логика, модели, бой, действия, слияние, мастерская, переводы и браузер четырёх прототипов, ресурсы, английский и сайт), ПК и телефон. Не проверено: на настоящем сенсорном экране (касание не изменилось: выбирает и просит подтвердить, как раньше).","valravnx: en PC no se podían quitar muebles; al mover el ratón hacia el botón de confirmar se perdía lo elegido.":"valravnx: на ПК нельзя было убрать мебель; при движении мыши к кнопке подтверждения выбор терялся.","Causa: en Desmontar, pasar el ratón volvía a elegir lo que hubiera debajo y escondía el botón. Pasaba también con las piezas.":"Причина: в режиме разборки наведение мыши заново выбирало то, что под ней, и прятало кнопку. То же было и с деталями.","Ahora el clic elige y lo elegido se queda fijo hasta confirmar o cancelar; sin nada elegido, pasar el ratón sigue resaltando lo que se quitaría.":"Теперь щелчок выбирает, и выбор остаётся до подтверждения или отмены; когда ничего не выбрано, наведение по-прежнему подсвечивает то, что уберётся.","Prueba nueva con el ratón de verdad: clic en un barril, mover el ratón hasta el botón y confirmar. Con el código de antes falla, como le pasaba a valravnx.":"Новый тест с настоящей мышью: щелчок по бочке, движение мыши к кнопке и подтверждение. Со старым кодом он падает, как и у valravnx.","Construcción v8 publicada; las versiones anteriores siguen en la web.":"Опубликовано строительство v8; прежние версии остаются на сайте.","Hito 1d: escena común (src/mundo/)":"Этап 1d: общая сцена (src/mundo/)","Todas correctas con probar_todo.sh (lógica, modelos, combate, acciones, unión, taller, traducciones y navegador de construcción, combate, estilo, personaje, inglés y ruso, y web), PC y móvil; la de recursos de personaje falló por una ruta de importación y, arreglada, pasó repetida. Medido sin tarjeta gráfica (aquí no hay otra): construcción 346 ms por fotograma frente a 142 de la v8, combate 280 frente a 145 de la v6. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil de valravnx (es la tarea de rendimiento de este hito). Las comprobaciones de la prueba de combate cambiadas son las mismas (solo cambia la espera), no se rompieron a propósito.":"Всё проходит с probar_todo.sh (логика, модели, бой, действия, слияние, мастерская, переводы и браузерные тесты строительства, боя, стиля, персонажа, английского и русского, и сайта), ПК и телефон; тест ресурсов персонажа упал из‑за пути импорта и после исправления прошёл при повторе. Измерено без видеокарты (здесь её нет): строительство 346 мс на кадр против 142 у v8, бой 280 против 145 у v6. Не проверено: кадры с видеокартой и на телефоне valravnx (это задача о производительности этого этапа). Изменённые проверки в тесте боя — те же проверки (меняется только ожидание); их не ломали нарочно.","Escena común en src/mundo/: estilos.js (paleta, luces, texturas por código), ambiente.js (cielo, sol con sombras blandas, luz del cielo, niebla y gradación ACES) y decorado.js (suelo hasta el horizonte, bosque instanciado, hierba, flores y rocas).":"Общая сцена в src/mundo/: estilos.js (палитра, освещение, текстуры из кода), ambiente.js (небо, солнце с мягкими тенями, свет неба, туман и цветокоррекция ACES) и decorado.js (земля до горизонта, лес инстансингом, трава, цветы и камни).","La construcción y el combate dejan su cielo azul liso, su suelo de color y sus árboles de conos y usan la escena del estilo v5. El combate tiene la liza de tierra pisada en el centro.":"Строительство и бой больше не используют ровное голубое небо, цветную землю и деревья из конусов, а берут сцену стиля v5. В бою в центре площадка утоптанной земли.","La prueba de estilo y el visor de personaje usan los mismos módulos; se ven igual que antes (la prueba de estilo difiere de su captura publicada solo por la compresión JPG).":"Проба стиля и просмотр персонажа используют те же модули; выглядят как раньше (проба стиля отличается от опубликованного снимка только сжатием JPG).","La sombra sigue al jugador. Los cientos de árboles van instanciados: unas pocas llamadas de dibujo en vez de cerca de 900 de la construcción anterior.":"Тень следует за игроком. Сотни деревьев рисуются инстансингом: несколько вызовов отрисовки вместо почти 900 в прежнем строительстве.","Decisión provisional: en la construcción la hierba empieza a 16 m de la salida, porque dentro se construye y asomaría por los cimientos. Anotada en el registro del prototipo.":"Временное решение: в строительстве трава начинается в 16 м от места появления, потому что внутри строят, и трава проступала бы сквозь фундаменты. Записано в журнале прототипа.","Decisión provisional por rendimiento: en la construcción y el combate el suelo va sin relieve ni filtrado anisótropo, los árboles lejanos no echan sombra y el cielo lo pinta la página. Medido sin tarjeta gráfica: el relieve del suelo era lo que más costaba.":"Временное решение ради производительности: в строительстве и бою земля без рельефа и анизотропной фильтрации, дальние деревья не отбрасывают тень, а небо рисует страница. Измерено без видеокарты: рельеф земли был самым дорогим.","La prueba de combate espera a que la flecha acabe su vuelo en vez de un tiempo fijo; con fotogramas más lentos fallaba sin que el juego fallase.":"Тест боя ждёт, пока стрела закончит полёт, а не фиксированное время; при более медленных кадрах он падал, хотя игра работала.","Construcción v9 y combate v7 publicados; las versiones anteriores siguen en la web.":"Опубликованы строительство v9 и бой v7; прежние версии остаются на сайте.","Hito 1d: el personaje del taller en la construcción":"Этап 1d: персонаж из мастерской в строительстве","Todas correctas con probar_todo.sh, PC y móvil, salvo la de idiomas, que fallaba porque abría la construcción sin servidor y el modelo no se carga así; servida por HTTP, pasa entera (repetida aparte). La prueba nueva del personaje se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas de cerca miradas: quieto, de espaldas, corriendo, talando y en el móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (es la tarea de rendimiento de este hito); la prueba de idiomas no se rompió a propósito tras el cambio (solo cambia cómo se sirven las páginas).":"Всё прошло с probar_todo.sh, на ПК и телефоне, кроме теста языков, который падал, потому что открывал строительство без сервера, а так модель не загружается; при раздаче по HTTP он проходит полностью (повторён отдельно). Новый тест персонажа был намеренно сломан (MUTAR=1, модели в несуществующей папке) и упал, как и должен. Просмотрены снимки крупным планом: стоя, со спины, на бегу, за рубкой и на телефоне. Не проверено: частота кадров с видеокартой и на телефоне (это задача производительности этого этапа); тест языков после изменения намеренно не ломали (изменилось только то, как раздаются страницы).","El jugador de la construcción es el personaje del taller propio (cuerpo de MakeHuman vestido por código) en vez del muñeco: camisa y calzas de lino, sin túnica.":"Игрок в строительстве — персонаж из собственной мастерской (тело MakeHuman, одетое кодом) вместо манекена: льняная рубаха и шоссы, без туники.","Anda, corre y tala con las animaciones de Quaternius pasadas a su esqueleto. Medida la velocidad natural de las animaciones con el pie en un ciclo: andar 0,97 m/s y correr 2,59 m/s; se aceleran con la velocidad del juego hasta 1,6×.":"Он ходит, бегает и рубит с анимациями Quaternius, перенесёнными на его скелет. Естественная скорость анимаций измерена по стопе за один цикл: ходьба 0,97 м/с и бег 2,59 м/с; они ускоряются вместе со скоростью в игре до 1,6×.","Talar: junto a un árbol del bosque, Usar (F) hace el gesto de talar y moverse lo para. Solo el gesto: sin hacha en la mano y sin madera, que llega con la recolección del hito 2.":"Рубка: рядом с деревом в лесу «Использовать» (F) запускает движение рубки, а движение персонажа его прерывает. Только движение: без топора в руке и без древесины, которая появится со сбором ресурсов на этапе 2.","Mientras carga el personaje (o si no se puede cargar) se ve el muñeco de antes, así el juego no se queda sin jugador.":"Пока персонаж загружается (или если не может загрузиться), виден прежний манекен, так что игра не остаётся без игрока.","Decisión provisional: lleva zapatos aunque el GDD dice que se empieza descalzo. Comprobado en las capturas: sin zapatos se ve sin pies, porque el cuerpo del taller no los tiene debajo. Tarea nueva en el hito de arte para los pies descalzos.":"Временное решение: на нём башмаки, хотя по GDD игра начинается босиком. Проверено на снимках: без башмаков он выглядит без ступней, потому что у тела из мастерской их нет под обувью. Новая задача в этапе графики — босые ноги.","Decisión provisional: las velocidades del juego (3,6 m/s andando y 6 con Mayús) no se cambian; con ellas se usa la animación de correr y a 6 m/s los pies resbalan algo. Anotado en el registro del prototipo.":"Временное решение: скорости в игре (3,6 м/с шагом и 6 с Shift) не меняются; при них используется анимация бега, и на 6 м/с ноги немного скользят. Записано в журнал прототипа.","Las pruebas de navegador de la construcción y de idiomas sirven las páginas por HTTP, como en la web, para poder cargar el modelo.":"Браузерные тесты строительства и языков раздают страницы по HTTP, как на сайте, чтобы модель могла загрузиться.","Construcción v10 publicada; las versiones anteriores siguen en la web.":"Опубликовано строительство v10; прежние версии остаются на сайте.","Hito 1d: el personaje del taller en el combate":"Этап 1d: персонаж из мастерской в бою","Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, navegador de construcción, combate, estilo, personaje, recursos, idiomas y web), en PC y móvil. La prueba nueva del combate se rompió a propósito (MUTAR=1, modelos en una carpeta que no existe) y falló como debía. Capturas miradas: de cerca en guardia, golpes de las cinco líneas, heridas, cara, rival con cota, escudo, palo y arco; y el duelo entero en PC y móvil. No comprobado: los fotogramas con tarjeta gráfica ni en el móvil (cada luchador tiene unos 16.000 a 18.000 triángulos; es la tarea de rendimiento de este hito). A medio golpe las cinco líneas se ven parecidas: es el movimiento de antes, y los golpes con animación propia son otra tarea del duelo.":"Всё проходит с probar_todo.sh (логика 63/63, модели 21/21, бой 69/69, действия 25/25, браузерные проверки строительства, боя, стиля, персонажа, ресурсов, языков и сайта), на ПК и телефоне. Новую проверку боя намеренно сломали (MUTAR=1, модели в несуществующей папке), и она упала, как и должна. Просмотрены снимки: крупно в стойке, удары по пяти линиям, раны, лицо, соперник в кольчуге, щит, посох и лук; и весь поединок на ПК и телефоне. Не проверено: частота кадров с видеокартой и на телефоне (у каждого бойца примерно 16 000–18 000 треугольников; это задача производительности этого этапа). В середине удара пять линий выглядят похоже: это прежнее движение, а удары со своей анимацией — отдельная задача поединка.","Los dos luchadores del duelo son el personaje del taller propio en vez del muñeco de cubos; mientras carga (o si no carga) se ve el muñeco de antes.":"Оба бойца в поединке — собственный персонаж из мастерской вместо манекена из кубов; пока он загружается (или если не загрузился), виден прежний манекен.","La armadura del duelo es la ropa por capas del taller: lino = camisa y calzas, gambesón = gambesón, cota de malla = cota encima del gambesón. Lo que protege sigue en la lógica de combate, que no cambia.":"Доспех в поединке — одежда слоями из мастерской: лён = рубаха и шоссы, стёганка = стёганка, кольчуга = кольчуга поверх стёганки. То, что он защищает, остаётся в логике боя, которая не меняется.","Piernas y cuerpo con las animaciones del taller (guardia de espada quieto, andar y correr). Los brazos se colocan cada fotograma con cinemática inversa de dos huesos para que las manos agarren el arma donde la ponen las poses de siempre; si el brazo no llega, el arma se queda en la mano. Con escudo, la mano izquierda lo coge por el asa; con arco, una mano en el arco y otra en la cuerda.":"Ноги и тело двигаются анимациями мастерской (стойка с мечом на месте, ходьба и бег). Руки каждый кадр ставятся обратной кинематикой по двум костям, чтобы кисти держали оружие там, где его ставят прежние позы; если рука не дотягивается, оружие остаётся в руке. Со щитом левая рука держит его за рукоять; с луком одна рука на луке, другая на тетиве.","El arma sube o baja con los hombros del personaje: las poses estaban hechas para hombros a 1,48 m y el del taller los tiene más bajos, y más aún agachado en guardia.":"Оружие поднимается и опускается вместе с плечами персонажа: позы были сделаны для плеч на высоте 1,48 м, а у персонажа из мастерской они ниже, а в стойке, пригнувшись, ещё ниже.","La mano izquierda venía abierta en la animación de guardia (es de espada de una mano): ahora copia el puño cerrado de la derecha.":"В анимации стойки левая кисть была раскрыта (она для одноручного меча): теперь она повторяет сжатый кулак правой.","Las heridas se pintan como antes (sangre o moratón, más grande cuanto más grave), pero pegadas a la superficie del cuerpo o de la ropa donde entra el golpe y colgadas del hueso, así que siguen al personaje. En la cara, más pequeñas.":"Раны рисуются как раньше (кровь или синяк, тем больше, чем тяжелее), но прилеплены к поверхности тела или одежды там, куда пришёлся удар, и привязаны к кости, так что следуют за персонажем. На лице они меньше.","La cinta azul o amarilla va en el pecho, encima de la ropa: los dos luchadores son el mismo hombre del taller y es lo que los distingue.":"Синяя или жёлтая лента на груди, поверх одежды: оба бойца — один и тот же мужчина из мастерской, и только она их различает.","Decisión provisional, anotada en el registro del combate: cojear ya no se ve; lo hacía el muñeco y las animaciones del taller no lo traen.":"Временное решение, записано в журнал боя: хромота больше не видна; её показывал манекен, а в анимациях мастерской её нет.","La prueba de navegador del combate sirve la página por HTTP, como en la web, y tiene comprobaciones nuevas: los dos son el personaje del taller, llevan las capas de su armadura, el muñeco no se ve, las manos están en el puño en guardia y en las cinco líneas de golpe, el escudo se agarra por el asa y cada herida se pega en su hueso.":"Браузерная проверка боя открывает страницу по HTTP, как на сайте, и в ней новые проверки: оба — персонаж из мастерской, на них слои их доспеха, манекен не виден, руки на рукояти в стойке и на пяти линиях удара, щит держится за рукоять и каждая рана прилипает к своей кости.","Combate v8 publicado; las versiones anteriores siguen en la web.":"Бой v8 опубликован; прежние версии остаются на сайте.","Hito 1d: demo única":"Этап 1d: единое демо","Todas correctas con probar_todo.sh (lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, textos traducidos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web), en PC y móvil. La prueba nueva de la demo se rompió a propósito (MUTAR=1 borra lo guardado al cambiar de parte) y falló como debía. Capturas miradas del menú, el personaje, la construcción y el duelo con la mujer de vestido y gambesón, en PC y móvil, y el menú en ruso. Visto en las capturas: en el móvil el aviso de la construcción sigue tapando «Reiniciar», y con el botón «Menú» la barra de arriba ocupa una fila más; es la tarea siguiente del hito. No comprobado: los fotogramas con tarjeta gráfica ni en un móvil de verdad (es la tarea de rendimiento).":"Всё проходит в probar_todo.sh (логика 63/63, модели 21/21, бой 69/69, действия 25/25, переведённые тексты, браузерные проверки строительства, боя, стиля, персонажа, демо, ресурсов, языков и сайта), на ПК и телефоне. Новую проверку демо намеренно сломали (MUTAR=1 стирает сохранённое при смене части), и она упала, как и должна. Просмотрены снимки меню, персонажа, строительства и поединка с женщиной в платье и стёганке, на ПК и телефоне, и меню на русском. На снимках видно: на телефоне подсказка строительства всё ещё закрывает «Начать заново», а с кнопкой «Меню» верхняя панель занимает ещё один ряд; это следующая задача этапа. Не проверено: частота кадров с видеокартой и на настоящем телефоне (это задача производительности).","Demo única publicada (jugar/demo/v1): una página con menú y tres partes, Construir, Duelo y Personaje, que son los últimos prototipos de cada cosa (construcción v10, combate v8, personaje v11). three.js va una sola vez: la página pesa 1,2 MB, frente a 1 MB de cada prototipo suelto.":"Опубликовано единое демо (jugar/demo/v1): одна страница с меню и тремя частями — Строительство, Поединок и Персонаж, — это последние прототипы каждой части (строительство v10, бой v8, персонаж v11). three.js включён один раз: страница весит 1,2 МБ, а каждый отдельный прототип — 1 МБ.","Cada parte se abre con ?modo= y el botón «Menú» de arriba vuelve al menú recargando la página, para que nunca haya dos escenas ni dos WebGL a la vez en el móvil. Lo construido, las opciones del duelo y el personaje siguen guardados en el navegador al volver.":"Каждая часть открывается через ?modo=, а кнопка «Меню» вверху возвращает в меню с перезагрузкой страницы, чтобы в телефоне никогда не было двух сцен или двух WebGL одновременно. Построенное, настройки поединка и персонаж остаются сохранёнными в браузере при возвращении.","El personaje elegido en «Personaje» (hombre o mujer y su ropa por capas) es el que construye y el que lucha; el menú resume cuál es. Las próximas versiones de los prototipos sueltos también lo leerán (las ya publicadas no cambian).":"Персонаж, выбранный в «Персонаже» (мужчина или женщина и одежда по слоям), — тот, кто строит и сражается; меню кратко показывает, какой он. Следующие версии отдельных прототипов тоже будут его читать (уже опубликованные не меняются).","Decisiones provisionales, anotadas en el registro de la demo: sin personaje elegido, en la construcción se sale con camisa y calzas de lino (GDD); en el duelo manda la armadura de sus opciones (con lino, tu ropa sin gambesón ni cota; con gambesón o cota, esas piezas y la sobreveste si la elegiste); el rival sigue siendo el hombre de siempre.":"Временные решения, записанные в журнал демо: если персонаж не выбран, строительство начинается в льняной рубахе и шоссах (GDD); в поединке главное — доспех из его настроек (со льном — ваша одежда без стёганки и кольчуги; со стёганкой или кольчугой — эти вещи и сюрко, если вы его выбрали); соперник — всё тот же мужчина.","La web pone la demo única la primera en «Jugar»; las versiones antiguas de cada prototipo se quedan.":"Сайт ставит единое демо первым в разделе «Играть»; старые версии каждого прототипа остаются.","Prueba nueva de navegador de la demo (menú, las tres partes, el botón Menú, el personaje elegido en construcción y duelo, menú en inglés y ruso), metida en probar_todo.sh.":"Новая браузерная проверка демо (меню, три части, кнопка «Меню», выбранный персонаж в строительстве и поединке, меню на английском и русском), добавлена в probar_todo.sh.","Hito 1d: rendimiento de la demo única":"Этап 1d: производительность единого демо","Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas de la demo miradas en PC y móvil":"Все проходят (bash herramientas/probar_todo.sh): логика, модели, бой, действия, мастерская, слияние, тексты, браузерные тесты строительства, боя, стиля, персонажа, демо, ресурсов, языков и сайта; скриншоты демо просмотрены на ПК и телефоне","Medida de rendimiento común (src/mundo/rendimiento.js): cada parte registra su renderer y se cuentan los fotogramas por segundo, el tiempo medio y el peor de cada fotograma, los triángulos y las llamadas de dibujo, la memoria gráfica (geometrías y texturas), la de JavaScript (solo en Chrome y similares) y los personajes en escena.":"Общий замер производительности (src/mundo/rendimiento.js): каждая часть регистрирует свой рендерер, и считаются кадры в секунду, среднее и худшее время кадра, треугольники и вызовы отрисовки, графическая память (геометрии и текстуры), память JavaScript (только в Chrome и подобных) и персонажи в сцене.","Demo única v2 publicada (jugar/demo/v2): los fps salen en un botón junto a «Menú» y al pulsarlo se abre el detalle con una nota para valravnx. En el móvil, si junto a «Menú» no cabe sin añadir otra fila de botones, va suelto a la izquierda de la pantalla.":"Опубликовано единое демо v2 (jugar/demo/v2): к/с показаны на кнопке рядом с «Меню», а по нажатию открываются подробности с запиской для valravnx. На телефоне, если рядом с «Меню» кнопка не помещается без нового ряда кнопок, она стоит отдельно у левого края экрана.","En «Construir», «Personajes de prueba» (0, 4, 8 o 16): personajes del taller que pasean en corro alrededor del jugador, solo para medir con gente; no cambian el mundo.":"В «Строить» — «Тестовые персонажи» (0, 4, 8 или 16): персонажи из мастерской, которые гуляют по кругу вокруг игрока, только для замеров с людьми вокруг; мир они не меняют.","Medido en el navegador de pruebas (dibujo por software, sus fps no valen): personaje 89 mil triángulos y 41 dibujos; construcción con 1 personaje 130 mil triángulos y 29 dibujos; con 9 personajes 426 mil y 185 (cada personaje suma unos 37 mil triángulos contando su sombra, unas 10 geometrías y 12 texturas); duelo con 2 personajes 143 mil y 72.":"Замерено в тестовом браузере (программная отрисовка, его к/с ничего не значат): персонаж — 89 тыс. треугольников и 41 вызов отрисовки; строительство с 1 персонажем — 130 тыс. треугольников и 29 вызовов; с 9 персонажами — 426 тыс. и 185 (каждый персонаж добавляет около 37 тыс. треугольников с учётом тени, около 10 геометрий и 12 текстур); поединок с 2 персонажами — 143 тыс. и 72.","Pregunta añadida a valravnx en las decisiones pendientes: los fps en su móvil.":"В ожидающие решения добавлен вопрос для valravnx: к/с на его телефоне.","Prueba de la demo ampliada: botón de fps libre, panel con los números, cuenta de personajes en cada parte, más triángulos con 8 personajes de prueba y que el botón no tape el menú; con MUTAR_REND=1 falla como debe.":"Тест демо расширен: кнопка к/с ничем не закрыта, панель с цифрами, подсчёт персонажей в каждой части, больше треугольников с 8 тестовыми персонажами, кнопка не закрывает меню; с MUTAR_REND=1 тест падает, как и должен.","Hito 1d: los avisos y las notas ya no tapan los menús en el móvil":"Этап 1d: подсказки и заметки больше не закрывают меню на телефоне","Todas correctas (bash herramientas/probar_todo.sh): lógica, modelos, combate, acciones, taller, unión, textos, navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web; capturas miradas en PC y móvil":"Все пройдены (bash herramientas/probar_todo.sh): логика, модели, бой, действия, мастерская, слияние, тексты, проверки в браузере строительства, боя, стиля, персонажа, демо, ресурсов, языков и сайта; снимки просмотрены на ПК и телефоне","En el móvil, el aviso de la construcción se coloca según lo que mide de verdad el menú de arriba (que en inglés y en ruso ocupa más filas, y en la demo lleva también «Menú» y los fps) y a la izquierda de los botones de modo: ya no tapa «Reiniciar» ni ningún otro botón. En PC sigue centrado, justo debajo del menú.":"На телефоне подсказка строительства ставится по настоящему размеру верхнего меню (по-английски и по-русски оно занимает больше строк, а в демо там ещё «Меню» и к/с) и слева от кнопок режимов: она больше не закрывает «Начать заново» и другие кнопки. На ПК она по-прежнему по центру, прямо под меню.","Las notas de la prueba de estilo se colocan justo encima de la barra de vistas, aunque esta ocupe dos filas, y nunca suben por encima de la barra de arriba.":"Заметки пробы стиля стоят прямо над панелью видов, даже когда она занимает две строки, и никогда не поднимаются выше верхней панели.","Pruebas nuevas: en la de idiomas, que el aviso no tapa ningún botón (en inglés y en ruso, PC y móvil); en la de estilo, que las notas no tapan las barras, también con la barra de vistas estrechada a dos filas. Con MUTAR_SOLAPE=1 (aviso y notas a la altura fija de antes) fallan las dos, como deben.":"Новые проверки: в проверке языков — что подсказка не закрывает ни одной кнопки (по-английски и по-русски, ПК и телефон); в проверке стиля — что заметки не закрывают панели, в том числе когда панель видов сужена до двух строк. С MUTAR_SOLAPE=1 (подсказка и заметки на прежней фиксированной высоте) обе падают, как и должны.","Publicadas construcción v11, prueba de estilo v10 y demo única v3 (con la construcción v11).":"Опубликованы строительство v11, проба стиля v10 и единое демо v3 (со строительством v11).","No comprobado: en un móvil de verdad; solo en el navegador de pruebas a 390×844 (y a 320 de ancho en una prueba aparte).":"Не проверено: на настоящем телефоне; только в тестовом браузере 390×844 (и при ширине 320 отдельной проверкой).","Correr más natural (personaje v12)":"Бег естественнее (персонаж v12)","Lógica 63/63, modelos 21/21, combate 69/69, acciones 25/25, idiomas y unión correctos; navegador: construcción, combate, demo, estilo, personaje e idiomas correctos en PC y móvil. La prueba nueva falla con MUTAR=1. No comprobado: cómo se ve en un móvil de verdad.":"Логика 63/63, модели 21/21, бой 69/69, действия 25/25, языки и слияние в порядке; браузер: строительство, бой, демо, стиль, персонаж и языки в порядке на ПК и телефоне. Новая проверка не проходит с MUTAR=1. Не проверено: как это выглядит на настоящем телефоне.","La carrera del paquete se suaviza por código al pasarla al taller: cada hueso se mueve menos alrededor de su postura media (brazos 50 %, tronco 55 %, piernas 60 %), el tronco se endereza, los brazos se acercan al cuerpo como al andar y la pelvis bota 10 cm en vez de 25.":"Бег из набора смягчается кодом при переносе в мастерскую: каждая кость меньше отклоняется от своей средней позы (руки 50 %, корпус 55 %, ноги 60 %), корпус выпрямляется, руки прижимаются ближе к телу, как при ходьбе, а таз подпрыгивает на 10 см вместо 25.","Las demás animaciones salen idénticas (comprobado: diferencia máxima de 2·10⁻⁷ en sus datos).":"Остальные анимации выходят такими же (проверено: наибольшая разница в данных 2·10⁻⁷).","Encontrado un fallo de antes: el juego trataba la carrera como si su velocidad natural fuera 2,59 m/s, pero medida con el pie apoyado era 5,8 m/s; a 3,6 m/s los pies resbalaban y se veía a cámara lenta. Ahora la velocidad natural de andar y correr se mide en el propio clip al cargar (carrera nueva: 3,5 m/s el hombre y 2,9 la mujer).":"Найдена старая ошибка: игра считала, что естественная скорость бега 2,59 м/с, но если мерить по опорной ноге, она была 5,8 м/с; при 3,6 м/с ноги скользили и всё выглядело как замедленная съёмка. Теперь естественная скорость ходьбы и бега измеряется по самому клипу при загрузке (новый бег: 3,5 м/с у мужчины и 2,9 у женщины).","Personajes nuevos en recursos/personajes/taller-v5/ (la ropa, igual que la v4); la construcción, el duelo y el visor ya los usan.":"Новые персонажи в recursos/personajes/taller-v5/ (одежда как в v4); строительство, поединок и просмотр уже используют их.","Botón «Correr» en el visor de personaje y prueba nueva: zancada natural y poco bote (falla con la carrera de antes).":"Кнопка «Бег» в просмотре персонажа и новая проверка: естественный шаг и слабое подпрыгивание (со старым бегом она не проходит).","Personaje v12 publicado. La demo única recoge la carrera nueva en su próxima versión.":"Персонаж v12 опубликован. Единое демо получит новый бег в следующей версии.","Hito 1d: revisión completa":"Этап 1d: полная проверка","Todas correctas (bash herramientas/probar_todo.sh), PC y móvil; capturas miradas.":"Все пройдены (bash herramientas/probar_todo.sh), ПК и телефон; снимки просмотрены.","Pasadas todas las pruebas del proyecto con probar_todo.sh: lógica, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo única, recursos, idiomas y web.":"Все тесты проекта пройдены с probar_todo.sh: логика, модели, бой, действия, мастерская, слияние, тексты и браузерные тесты стройки, боя, стиля, персонажа, единой демо, ресурсов, языков и сайта.","Revisadas las capturas de la demo única en PC y móvil (menú en español, inglés y ruso, Construir, Duelo y Personaje), de la construcción, del combate y de la web: el mismo personaje del taller y la misma escena en todo, y ningún aviso tapa los menús.":"Просмотрены снимки единой демо на ПК и телефоне (меню на испанском, английском и русском, Строить, Поединок и Персонаж), стройки, боя и сайта: везде один и тот же персонаж мастерской и та же сцена, и ни одно сообщение не закрывает меню.","Sin versión jugable nueva: desde la demo v3 no ha cambiado nada que se juegue.":"Без новой играбельной версии: с демо v3 ничего играбельного не изменилось.","Los fps de las capturas (1 a 4) son del navegador de pruebas sin tarjeta gráfica, no de un dispositivo de verdad; en su móvil valravnx dijo que van bien.":"Кадры в секунду на снимках (от 1 до 4) — из тестового браузера без видеокарты, а не с настоящего устройства; на своём телефоне, по словам valravnx, всё идёт хорошо.","El hito 1d queda en revisión, esperando a valravnx.":"Этап 1d на проверке, ждёт valravnx.","Hito 1c: barandillas y portillo (sin publicar)":"Этап 1c: перила и калитка (не опубликовано)","Lógica 81/81, modelos, acciones, idiomas, navegador de construcción (PC y móvil), estilo, personaje, demo, recursos, inglés y web correctos. FALLA el navegador de combate: «soltar flojo no dispara y avisa» y «la retícula se cierra a plena tensión». Falla igual en main sin mis cambios (desde la unión de la carrera nueva); aislado, soltar flojo sí avisa, así que parece de tiempos de la prueba. No comprobado: la causa exacta.":"Логика 81/81, модели, действия, языки, браузерная проверка строительства (ПК и телефон), стиль, персонаж, демо, ресурсы, английский и сайт — всё верно. Браузерная проверка боя НЕ ПРОХОДИТ: «слабое натяжение не стреляет и предупреждает» и «прицел сужается при полном натяжении». На main без моих изменений она падает так же (после слияния нового бега); отдельно слабое натяжение предупреждает, так что похоже на тайминги проверки. Не проверено: точная причина.","Portillo de varas para la cerca (4 varas y 1 cuerda, como la puerta de varas): va en el suelo y se abre y se cierra con Usar; abierto deja pasar.":"Плетёная калитка для изгороди (4 жерди и 1 верёвка, как плетёная дверь): ставится на землю и открывается и закрывается кнопкой «Использовать»; открытая пропускает.","Las piezas que se abren se leen ahora de la marca «portón» de cada pieza, no de una lista fija.":"Какие детали открываются, теперь берётся из отметки «ворота» у каждой детали, а не из постоянного списка.","El medio muro sirve de barandilla en el borde de un suelo en alto y alrededor del hueco de la escalera: comprobado en el navegador que con él no se cae y sin él sí.":"Полустена служит перилами на краю верхнего пола и вокруг проёма лестницы: в браузере проверено, что с ней не падаешь, а без неё падаешь.","Pruebas nuevas de lógica (17) y de navegador (barandilla y portillo), rotas a propósito una vez: fallan como deben.":"Новые проверки логики (17) и браузера (перила и калитка), один раз намеренно сломанные: падают, как должны.","Todo queda en la rama trabajo/20261026-0519, ya unida con main.":"Всё остаётся в ветке trabajo/20261026-0519, уже слитой с main.","Demo única v4: la carrera nueva en todo":"Единое демо v4: новый бег везде","Demo única correcta en PC y móvil (menú, construir, duelo, personaje, idiomas); textos traducidos correctos. Las demás pruebas, correctas en la sesión anterior con el mismo código. No comprobado: cómo se ve en un móvil de verdad.":"Единое демо в порядке на ПК и телефоне (меню, строительство, поединок, персонаж, языки); переводы в порядке. Остальные проверки прошли в предыдущей сессии с тем же кодом. Не проверено: как это выглядит на настоящем телефоне.","valravnx pidió integrar la carrera nueva y todo en la demo única.":"valravnx попросил встроить новый бег и всё остальное в единое демо.","Demo única v4 publicada: construcción v11, combate v8 y personaje v12, con los personajes del taller-v5 (carrera suavizada y a su velocidad natural).":"Опубликовано единое демо v4: строительство v11, бой v8 и персонаж v12, с персонажами мастерской v5 (смягчённый бег с естественной скоростью).","Prueba nueva en la demo: en «Construir» el personaje corre con la carrera nueva a su ritmo natural (falla con MUTAR=1).":"Новая проверка в демо: в «Строительстве» персонаж бежит новым бегом в естественном темпе (с MUTAR=1 она не проходит).","Brazos naturales al correr (personaje v13, demo v5)":"Естественные руки при беге (персонаж v13, демо v5)","Todas correctas en PC y móvil. La prueba del combate falló una vez con el servidor cargado (tiempos del arco y la pausa de impacto, que se miden en tiempo real) y pasó entera al repetirla sola. No comprobado: cómo se ve en un móvil de verdad.":"Всё в порядке на ПК и телефоне. Проверка боя один раз не прошла при загруженном сервере (тайминги лука и пауза удара, которые меряются в реальном времени) и полностью прошла при повторе отдельно. Не проверено: как это выглядит на настоящем телефоне.","valravnx: los brazos de la carrera nueva van torcidos hacia delante, en pose nada natural; arreglado eso, la aprueba (pregunta de la carrera cerrada: no hacen falta las de Rokoko).":"valravnx: руки в новом беге вывернуты вперёд, поза неестественная; когда это исправлено, он его одобряет (вопрос о беге закрыт: записи Rokoko не нужны).","Los brazos se corrigen por código en la misma carrera: el brazo oscila alrededor de la vertical (de unos 25° atrás a unos 18° delante), el antebrazo va un poco hacia arriba y hacia dentro, la mano de canto con el pulgar arriba y la muñeca recta.":"Руки исправлены кодом в том же беге: рука качается вокруг вертикали (примерно от 25° назад до 18° вперёд), предплечье направлено немного вверх и внутрь, кисть ребром, большим пальцем вверх, запястье прямое.","Personajes en recursos/personajes/taller-v6/ (las demás animaciones salen idénticas: diferencia máxima de 2·10⁻⁷).":"Персонажи в recursos/personajes/taller-v6/ (остальные анимации такие же: наибольшая разница 2·10⁻⁷).","Personaje v13 y demo única v5 publicados.":"Опубликованы персонаж v13 и единое демо v5.","Cinturón de la cota ceñido (taller-v7)":"Пояс поверх кольчуги прилегает (taller-v7)","Todas correctas con probar_todo.sh salvo el combate, que pasó aparte con los márgenes portados. Fotos del taller antes y después, y visor y demo en PC y móvil mirados.":"Всё проходит в probar_todo.sh, кроме боя, который прошёл отдельно с перенесёнными запасами. Фото мастерской до и после, просмотрщик и демо на ПК и телефоне просмотрены.","valravnx aprobó el hito 1d (una sola demo).":"valravnx одобрил этап 1d (единое демо).","El cinturón de encima de la cota del hombre se estiraba hasta los brazos (0,32 m de medio ancho frente a 0,18 de la cota): al medir el contorno de la cintura se contaban también las mangas, y las de la cota bajan hasta la mano. Ahora solo cuentan el cuerpo y la falda de la prenda.":"Пояс поверх кольчуги у мужчины тянулся до рук (0,32 м полуширины против 0,18 у кольчуги): при измерении обхвата талии учитывались и рукава, а рукава кольчуги доходят до кисти. Теперь учитываются только корпус и подол одежды.","Personajes nuevos en recursos/personajes/taller-v7, encima de la v6 de los brazos al correr: solo cambia ese cinturón (comprobado malla a malla); las animaciones salen idénticas.":"Новые персонажи в recursos/personajes/taller-v7, поверх v6 с руками при беге: меняется только этот пояс (проверено по каждой сетке); анимации совпадают.","Prueba nueva de los cinturones de todos los personajes y comprobación en el visor con el hombre y la cota; las dos fallan con la taller-v6.":"Новая проверка поясов всех персонажей и проверка в просмотрщике с мужчиной в кольчуге; обе падают с taller-v6.","Portado el arreglo de tiempos de la prueba del combate de la sesión automática (sin él fallaba el arco a 2 fps).":"Перенесено исправление таймингов проверки боя из автоматической сессии (без него лук падал при 2 кадрах в секунду).","Personaje v14 y demo única v6 publicados.":"Опубликованы персонаж v14 и единое демо v6.","Pantalla en blanco en el móvil arreglada; muros con el estilo (construcción v12)":"Белый экран на телефоне исправлен; стены в стиле (строительство v12)","Todas correctas en PC y móvil. Pruebas nuevas, que fallan al romperlas: memoria gráfica estable al rehacer las piezas (MUTAR_FUGA=1: 822 → 16.672 geometrías), aviso y recarga al perder el dibujo 3D, huecos de puertas y ventanas mirados triángulo a triángulo. No comprobado: en el móvil de valravnx.":"Всё в порядке на ПК и телефоне. Новые проверки, которые не проходят, если их сломать: графическая память стабильна при пересборке деталей (MUTAR_FUGA=1: 822 → 16 672 геометрии), сообщение и перезагрузка при потере 3D-изображения, проёмы дверей и окон проверены по треугольникам. Не проверено: на телефоне valravnx.","valravnx: la pantalla se queda en blanco jugando (con los botones vivos y a más de 80 fps) y sigue así aunque recargue.":"valravnx: экран становится белым во время игры (кнопки работают, больше 80 fps) и остаётся таким даже после перезагрузки.","Causa encontrada y medida: al colocar o quitar algo se rehacían todas las piezas y las viejas no se liberaban de la memoria gráfica (con 9 piezas, 20 reconstrucciones pasaban de 870 a 4.050 mallas). Con una casa grande, cada pieza colocada dejaba miles, hasta agotar la memoria del móvil.":"Причина найдена и измерена: при установке или удалении чего-либо все детали пересоздавались, а старые не освобождались из графической памяти (с 9 деталями 20 пересборок поднимали число сеток с 870 до 4050). С большим домом каждая поставленная деталь оставляла тысячи, пока память телефона не заканчивалась.","Arreglado: las piezas, el mojón, el anillo de la tierra y la pieza fantasma se liberan al quitarlos (la cuenta queda igual tras 20 reconstrucciones). En el duelo, las flechas, dianas y postes también.":"Исправлено: детали, межевой камень, кольцо земли и призрачная деталь освобождаются при удалении (после 20 пересборок число не меняется). В поединке — также стрелы, мишени и столбы.","Si aun así el navegador pierde el dibujo 3D: aviso, recarga sola con lo construido guardado y, si vuelve a pasar enseguida, botón «Recargar» en vez de recargar en bucle.":"Если браузер всё же теряет 3D-изображение: сообщение, автоматическая перезагрузка с сохранённым построенным, а если это сразу повторяется — кнопка «Перезагрузить» вместо перезагрузки по кругу.","Muros, postes y vigas con el estilo elegido (troncos redondos con testas, zarzo, entramado y tablas), cada pieza en una malla por textura. Muestrario nuevo para fotos de cerca (herramientas/muestrario/).":"Стены, столбы и балки в выбранном стиле (круглые брёвна с торцами, плетень, фахверк и доски), каждая деталь — одна сетка на текстуру. Новый образец для фото крупным планом (herramientas/muestrario/).","Publicados construcción v12, combate v9 y demo única v7. Se colaron en el repositorio dos enlaces a node_modules (de una copia de trabajo): quitados y ahora ignorados.":"Опубликованы строительство v12, бой v9 и единое демо v7. В репозиторий попали две ссылки на node_modules (из рабочей копии): удалены и теперь игнорируются.","Decisiones de valravnx: mundo a escala real, agua y nado, y obras con materiales (GDD v0.8)":"Решения valravnx: мир в реальном масштабе, вода и плавание, стройка с материалами (диздок v0.8)","Web y textos traducidos correctos. Sin cambios de código.":"Сайт и переводы в порядке. Код не менялся.","valravnx aprueba («sí, todo») la propuesta del mundo, el nado y las obras.":"valravnx одобряет («да, всё») предложение по миру, плаванию и стройке.","Mundo a escala real: cordilleras como los Pirineos (cumbres de unos 3.000 m, valles de unos 1.000 m, collados), llanuras en las cuencas, ríos de tres gruesos según el agua que recogen, bosques frondosos, pendientes que frenan y obligan a nivelar. Se genera primero la red de ríos y después el terreno.":"Мир в реальном масштабе: хребты вроде Пиренеев (вершины около 3000 м, долины около 1000 м, перевалы), равнины в бассейнах, реки трёх размеров в зависимости от собранной воды, густые леса, склоны, которые замедляют и требуют выравнивания. Сначала создаётся речная сеть, затем рельеф.","Agua y nado (no estaba en el GDD): se vadea andando, en el agua honda se nada despacio y cansa, no con armadura o mucha carga, la corriente de los ríos grandes arrastra; los carros solo cruzan por vados y puentes.":"Вода и плавание (в диздоке этого не было): вброд переходят пешком, в глубокой воде плывут медленно и устают, нельзя в доспехах или с большим грузом, течение больших рек сносит; телеги пересекают реки только по бродам и мостам.","Obras: marco, materiales y tiempo; clases de peso (ligero, pesado, muy pesado); escalera, varas para rodar troncos, andamio, polea, polipasto con torno y grúa de rueda. Solo o en pareja, una cabaña de troncos; en grupo, la piedra.":"Стройка: каркас, материалы и время; классы веса (лёгкий, тяжёлый, очень тяжёлый); лестница, жерди для закатывания брёвен, леса, блок, полиспаст с воротом и кран с топчаковым колесом. Одному или вдвоём — бревенчатая изба; группой — камень.","GDD v0.8 en español, inglés y ruso. Cinco tareas nuevas en el hito 1c (las obras, antes de las piezas nuevas, y los muros de piedra con grúa) y el hito 10 (Mundo) puesto al día.":"Диздок v0.8 на испанском, английском и русском. Пять новых задач в этапе 1c (стройка — до новых деталей — и каменные стены с краном) и обновлённый этап 10 (Мир).","Hito 1c: barandillas y portillo publicados (construcción v13, demo v8)":"Этап 1c: перила и калитка опубликованы (строительство v13, демо v8)","Todas correctas con probar_todo.sh sobre el código final: lógica 81/81, modelos, combate, acciones, taller, unión, textos y navegador de construcción, combate, estilo, personaje, demo, recursos, idiomas y web. Un intento de pasar las pruebas de navegador en paralelo falló por falta de máquina (2 núcleos) y se descartó. No comprobado: cómo se ve en un móvil de verdad.":"Все проходят с probar_todo.sh на итоговом коде: логика 81/81, модели, бой, действия, мастерская, слияние, тексты и браузерные тесты строительства, боя, стиля, персонажа, демо, ресурсов, языков и сайта. Попытка запустить браузерные тесты параллельно провалилась из-за нехватки машины (2 ядра) и была отброшена. Не проверено: как это выглядит на настоящем телефоне.","Arreglada la prueba del combate que impedía publicar: no era un fallo del juego sino de tiempos. Sin tarjeta gráfica el navegador de pruebas va a 2 fps y el juego limita cada paso a 0,05 s, así que el tiempo de juego corre hasta 10 veces más lento que el real; la prueba esperaba como mucho 3 a 6 s reales a que se encajara la flecha o se tensara el arco. Ahora espera a esas condiciones con margen amplio (30 s), sin tiempos fijos.":"Исправлен тест боя, мешавший публикации: это была не ошибка игры, а ошибка времени. Без видеокарты тестовый браузер идёт на 2 fps, а игра ограничивает каждый шаг 0,05 с, так что игровое время идёт до 10 раз медленнее реального; тест ждал не более 3–6 реальных секунд, пока стрела ляжет на тетиву или лук натянется. Теперь он ждёт этих условий с большим запасом (30 с), без фиксированных пауз.","Unida la rama de la sesión anterior (barandillas y portillo) con main, tres veces, porque mientras pasaban las pruebas las sesiones de chat publicaron la carrera, los brazos, el cinturón, los muros con el estilo y el arreglo de la pantalla en blanco.":"Ветка прошлой сессии (перила и калитка) слита с main трижды, потому что пока шли тесты, сессии в чате опубликовали бег, руки, пояс, стены в новом стиле и исправление белого экрана.","Publicadas la construcción v13 y la demo única v8: el medio muro hace de barandilla en el borde de un suelo en alto y junto al hueco de la escalera, y hay portillo de varas para la cerca que se abre con Usar.":"Опубликованы строительство v13 и единое демо v8: полустена служит перилами на краю поднятого пола и у проёма лестницы, и есть калитка из жердей для изгороди, открывающаяся кнопкой «Использовать».","Mirado en las capturas que el portillo y la barandilla quedan bien junto a los muros nuevos con el estilo, en PC y en móvil.":"По скриншотам проверено, что калитка и перила хорошо смотрятся рядом с новыми стенами в выбранном стиле, на ПК и на телефоне.","Capa, botas y tocados en el taller (a medias)":"Плащ, сапоги и головные уборы в мастерской (наполовину)","Lógica, modelos, acciones, cinturones, piezas nuevas, idiomas y navegador de construcción correctos. No comprobado: navegador de combate, personaje, demo y web (cortadas por tiempo).":"Логика, модели, действия, пояса, новые предметы, языки и браузерный тест строительства — без ошибок. Не проверено: браузерные тесты боя, персонажа, демо и сайта (прерваны из-за времени).","Taller: capa de lana abierta por delante, botas de cuero hasta debajo de la rodilla, capucha con esclavina, sombrero de paja (malla propia en el hueso de la cabeza) y, en la mujer, toca. Las orejas van en una malla aparte para esconderlas bajo la capucha y la toca.":"Мастерская: шерстяной плащ, открытый спереди, кожаные сапоги ниже колена, капюшон с оплечьем, соломенная шляпа (отдельная сетка на кости головы) и, у женщины, апостольник. Уши — отдельная сетка, чтобы прятать их под капюшоном и апостольником.","Cargador y visor: los tocados van de uno en uno, las botas sustituyen a los zapatos y la capa deja ver la ropa y el cinturón de debajo; en el duelo se conservan con cualquier armadura.":"Загрузчик и просмотрщик: головные уборы — по одному, сапоги заменяют башмаки, а под плащом видны одежда и пояс; в поединке они остаются при любой броне.","Prueba nueva de las piezas en los modelos (prueba_prendas.mjs: 10 correctas; con la taller-v7 falla, como debe) y comprobaciones nuevas en la prueba del visor.":"Новый тест предметов в моделях (prueba_prendas.mjs: 10 успешных; с taller-v7 он падает, как и должен) и новые проверки в тесте просмотрщика.","Falla y no se publica: en las fotos, la capucha deja un hueco con forma de oreja y el borde de la cara sale en escalones. La capa parece un sobretodo abierto: no cae por encima de los brazos. El sombrero y las botas se ven bien.":"Не готово и не опубликовано: на фото в капюшоне остаётся дыра в форме уха, а край вокруг лица выходит ступеньками. Плащ похож на распахнутый кафтан: он не ниспадает на руки. Шляпа и сапоги выглядят хорошо.","Todo el avance está en la rama trabajo/20261026-1338 para la sesión siguiente (taller-v8 sin publicar).":"Весь прогресс — в ветке trabajo/20261026-1338 для следующей сессии (taller-v8 не опубликован).","Hito 1e: la escena común como la prueba de estilo v5":"Этап 1e: общая сцена как в пробе стиля v5","Lógica 81/81, modelos 22/22, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos e idioma correctos en PC y móvil.":"Логика 81/81, модели 22/22, бой 69/69, действия 25/25, пояса 8/8, слияние 19/19, языки, мастерская; браузерные проверки строительства, боя, стиля, персонажа, демо, ресурсов и языка проходят на ПК и телефоне.","Escena común (src/mundo/decorado.js) más cerca de la prueba de estilo v5: hierba densa con flores también en el centro, matorrales de tres bultos de hojas, calvas de tierra pisada, rocas más cerca y árboles de copa sueltos antes del bosque.":"Общая сцена (src/mundo/decorado.js) ближе к пробе стиля v5: густая трава с цветами и в центре, кусты из трёх лиственных шаров, пятна утоптанной земли, камни ближе и отдельные лиственные деревья перед лесом.","En la construcción la hierba, las flores y las matas se esconden solas bajo lo construido en la planta baja, los muebles del suelo y el mojón, y vuelven al quitarlo; las matas escondidas dejan de chocar.":"В строительстве трава, цветы и кусты сами прячутся под постройками нижнего этажа, мебелью на земле и межевым камнем и возвращаются, когда их убирают; спрятанные кусты перестают мешать проходу.","Los árboles sueltos son solo de copa: con pinos cerca, sus ramas bajas tapaban la cámara al talar.":"Отдельные деревья только лиственные: с соснами рядом их низкие ветви закрывали камеру при рубке.","Publicadas construcción v14, combate v10 y demo única v9, con comparación lado a lado con la v5 en las capturas.":"Опубликованы строительство v14, бой v10 и единая демо v9, со сравнением с v5 бок о бок на снимках.","Pruebas nuevas: ninguna planta asoma por los cimientos (rota a propósito con MUTAR_HIERBA=1: falla) y al quitarlo todo vuelven todas (rota a propósito sin despejar: falla).":"Новые проверки: ни одно растение не торчит сквозь фундаменты (нарочно сломано с MUTAR_HIERBA=1: падает), и если всё убрать, все возвращаются (нарочно сломано без расчистки: падает).","Algunas pruebas de navegador esperaban tiempos fijos y fallaban con el navegador de pruebas a 1-2 fps; ahora esperan a la condición con márgenes amplios (golpe maestro, rodeo lateral, parada normal, arranque en el móvil, dibujo 3D perdido).":"Некоторые браузерные проверки ждали фиксированное время и падали при 1-2 кадрах в секунду; теперь они ждут условия с большим запасом (мастерский удар, обход сбоку, обычное парирование, запуск на телефоне, потеря 3D-изображения).","Rendimiento medido solo en el navegador de pruebas sin tarjeta gráfica: en «Construir» con 8 personajes de prueba, 503 mil triángulos y 191 llamadas de dibujo (antes 426 mil y 185). No comprobado en un móvil de verdad.":"Производительность измерена только в тестовом браузере без видеокарты: в «Строительстве» с 8 тестовыми персонажами 503 тыс. треугольников и 191 вызов отрисовки (раньше 426 тыс. и 185). На настоящем телефоне не проверено.","Hito 1e: cimientos, suelos y escaleras con el estilo v5":"Этап 1e: фундаменты, полы и лестницы в стиле v5","Todas correctas con probar_todo.sh: lógica 81/81, modelos 36/36, combate 69/69, acciones 25/25, cinturones 8/8, unión 19/19, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"Всё проходит с probar_todo.sh: логика 81/81, модели 36/36, бой 69/69, действия 25/25, пояса 8/8, слияние 19/19, языки, мастерская; браузерные тесты строительства, боя, стиля, персонажа, демо, ресурсов, языка и сайта на ПК и телефоне.","Cimiento de piedra rehecho como el zócalo de la cabaña de la prueba v5: macizo de mortero, 16 losas con juntas y un tono distinto cada una, y una hilada de piedras redondeadas en los costados.":"Каменный фундамент переделан как цоколь избы из пробы v5: основа из раствора, 16 плит со швами, у каждой свой оттенок, и ряд скруглённых камней по бокам.","Cimiento de troncos, suelo de troncos (troncos partidos sobre dos durmientes de corteza) y suelo de tablas (tablas con veta a lo largo sobre dos rastreles) con las texturas por código y la oclusión horneada de la v5; lo que se pisa sigue a la misma altura.":"Бревенчатый фундамент, пол из брёвен (колотые брёвна на двух лагах в коре) и дощатый пол (доски с продольными волокнами на двух лагах) с процедурными текстурами и запечённым затенением v5; поверхность для ходьбы на прежней высоте.","Escalera de mano de varas descortezadas y escalera de tablas con zancas y peldaños con veta; cada pieza es ahora una sola malla por textura en vez de hasta 17 sueltas.":"Приставная лестница из окорённых жердей и дощатая лестница с тетивами и ступенями с волокнами; каждая деталь теперь одна сетка на текстуру вместо до 17 отдельных.","Prueba nueva en prueba_modelos.mjs: cimientos y suelos se pisan a la altura de la lógica, no salen de su casilla y las seis piezas están hechas con el estilo v5 (rota a propósito con MUTAR_SUELO=1: falla).":"Новый тест в prueba_modelos.mjs: по фундаментам и полам ходят на высоте, заданной логикой, они не выходят за свою клетку, и все шесть деталей сделаны в стиле v5 (намеренно сломан с MUTAR_SUELO=1: падает).","Publicadas construcción v15 y demo única v10, con fotos de cerca de cada pieza y una comparación lado a lado con la prueba v5.":"Опубликованы строительство v15 и единое демо v10, с крупными снимками каждой детали и сравнением бок о бок с пробой v5.","Triángulos por pieza medidos en node: cimiento de piedra 2476 (antes 588), suelo de tablas 1080 (antes 108), escalera de tablas 1404 (antes 156); llamadas de dibujo por pieza de 6-17 a 1-3. No comprobado en un móvil de verdad.":"Треугольники на деталь, измерено в node: каменный фундамент 2476 (было 588), дощатый пол 1080 (было 108), дощатая лестница 1404 (было 156); вызовы отрисовки на деталь с 6-17 до 1-3. На настоящем телефоне не проверено.","Hito 1e: tejados de paja y de tablillas y hastiales con el estilo v5":"Этап 1e: соломенные крыши, крыши из дранки и фронтоны в стиле v5","Todas correctas con probar_todo.sh: lógica 86/86, modelos 47/47, combate, acciones, cinturones, unión, idiomas, taller; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"Всё проходит в probar_todo.sh: логика 86/86, модели 47/47, бой, действия, пояса, слияние, языки, мастерская; браузерные тесты строительства, боя, стиля, персонажа, демо, ресурсов, языка и сайта на ПК и телефоне.","Tejado de paja como el de la cabaña de la prueba v5: dos hiladas gruesas con el canto redondeado (la del alero monta sobre la de arriba), una fila de manojos de paja asomando en el alero y la cumbrera redonda con sus remates.":"Соломенная крыша как на хижине из пробы стиля v5: два толстых ряда со скруглённым краем (нижний ряд лежит поверх верхнего), ряд пучков соломы на свесе и круглый конёк с торцами.","Las hiladas de paja tienen los lados planos: los tramos que van de lado se juntan sin surco y el tejado grande ya no se ve a cuadros. Solo vuelan 20 cm los lados que no tienen otro tramo al lado.":"У рядов соломы плоские бока: соседние секции сходятся без шва, и большая крыша больше не выглядит стёганой. На 20 см выступают только бока без соседней секции.","Tejado de tablillas: tablazón debajo y filas de tablillas solapadas, desplazadas media tablilla y con el pie levantado; tabla de remate en los lados que vuelan y caballete en la cumbrera.":"Крыша из дранки: обрешётка снизу и ряды дранки внахлёст со сдвигом на полдощечки и приподнятым нижним краем; торцевая доска на выступающих боках и коньковый брус.","Lo que cierra bajo el tejado (los hastiales automáticos): tablas de pie cortadas con la pendiente en muros de troncos y de tablas; barro con estacas en el zarzo y encalado con postes en el entramado. El hastial suelto antiguo también, con tablas de pie.":"То, что закрывает проём под крышей (автоматические фронтоны): стоячие доски, срезанные по скату, у стен из брёвен и досок; глина с кольями у плетня и побелка со стойками у фахверка. Старый отдельный фронтон тоже из стоячих досок.","La lógica (geometriaTejados) dice ahora qué lados de cada tramo vuelan, qué tramo pone la cumbrera (uno solo de los dos) y su paridad; el dibujo lo usa.":"Логика (geometriaTejados) теперь сообщает, какие бока каждой секции выступают, какая секция ставит конёк (только одна из двух) и её чётность; отрисовка это использует.","Muestrario nuevo de casas con tejado (herramientas/muestrario/tejados.js, fotos.py casas=1) para sacar fotos de cerca.":"Новая витрина домов с крышами (herramientas/muestrario/tejados.js, fotos.py casas=1) для снимков вблизи.","Pruebas nuevas: cumbrera de un solo tramo, lados que vuelan y paridad (lógica, rotas a propósito: fallan); tejados con el estilo v5, nada por debajo del plano del tejado, lados planos de la paja (rota con MUTAR_TEJADO=1: falla) y rellenos que llegan al tejado sin atravesarlo (modelos).":"Новые тесты: конёк от одной секции, выступающие бока и чётность (логика, нарочно сломаны: падают); крыши в стиле v5, ничего ниже плоскости крыши, плоские бока соломы (сломан с MUTAR_TEJADO=1: падает) и заполнения, доходящие до крыши, не протыкая её (модели).","Publicadas construcción v16 y demo única v11, con comparación lado a lado con la prueba v5.":"Опубликованы строительство v16 и единая демо v11 со сравнением бок о бок с пробой стиля v5.","Triángulos por tramo medidos en node: paja 2072 (2520 con cumbrera), tablillas 2244, relleno de tablas 108 (antes unos 48 el tramo). No comprobado en un móvil de verdad.":"Треугольники на секцию, измерено в node: солома 2072 (2520 с коньком), дранка 2244, заполнение досками 108 (раньше около 48 на секцию). На настоящем телефоне не проверено.","Hito 1e: puertas, cercas, portillo, empalizada y mojón con el estilo v5":"Этап 1e: двери, изгороди, калитка, частокол и межевой камень в стиле v5","Todas correctas con probar_todo.sh: lógica 86/86, modelos 64/64, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"Всё проходит с probar_todo.sh: логика 86/86, модели 64/64, бой 69/69, действия 25/25, пояса, мастерская, слияние, языки; браузерные проверки строительства, боя, стиля, персонажа, демо, ресурсов, языка и сайта, на ПК и телефоне.","Puertas con el estilo v5: la de tablas como la de la cabaña de la prueba (cuatro tablas, peinazos por detrás, bisagras largas de hierro con clavos y tirador de argolla); la de varas, varas atadas con cuerda a dos travesaños, con tornapunta.":"Двери в стиле v5: дощатая — как у избушки из пробы (четыре доски, планки сзади, длинные железные петли с гвоздями и кольцо-ручка); из жердей — жерди, привязанные верёвкой к двум поперечинам, с подкосом.","Cerca de varas como la de la prueba v5: postes redondos con el corte claro arriba, dos varas atadas con lazadas de cuerda que llegan al borde de la casilla.":"Изгородь из жердей как в пробе v5: круглые столбы со светлым срезом сверху и две жерди, привязанные верёвочными петлями, доходящие до края клетки.","Portillo: postes más gruesos y hoja de varas con tornapunta, ataduras y lazos de cuerda que hacen de bisagra.":"Калитка: столбы потолще и створка из жердей с подкосом, обвязками и верёвочными петлями вместо петель.","Empalizada: troncos descortezados como los de los muros, de distinto alto y algo torcidos, con la punta tallada clara y dos traviesas detrás. Su puerta: tablones con punta, traviesas por detrás, pletinas de hierro con clavos y argolla.":"Частокол: окорённые брёвна, как в стенах, разной высоты и слегка кривые, со светлым затёсанным остриём и двумя поперечинами сзади. Его ворота: заострённые доски, поперечины сзади, железные полосы с гвоздями и кольцо.","Mojón: piedras apiladas de caras planas, como las de los cimientos, y una vara con un trapo atado.":"Межевой камень: сложенные камни с плоскими гранями, как в фундаментах, и шест с привязанной тряпицей.","Lo que se abre (puertas, portillo y puerta de la empalizada) va en su propia malla, que gira en las bisagras; el resto, junto en una malla por textura como las demás piezas del estilo.":"То, что открывается (двери, калитка и ворота частокола), — отдельная сетка, которая поворачивается на петлях; остальное собрано в одну сетку на текстуру, как у других деталей в этом стиле.","Las barandillas son el medio muro de troncos, que ya tenía el estilo desde la construcción v12.":"Перила — это полустена из брёвен, у которой стиль уже был со строительства v12.","El muestrario de piezas acepta «tipo@abierta» (hoja abierta) y «mojon».":"Образцы деталей принимают «тип@abierta» (открытая створка) и «mojon».","Pruebas nuevas de modelos: estas piezas y el mojón hechos con el estilo v5, la hoja aparte, la puerta cabe en el hueco del muro y abierta lo deja libre (rota con MUTAR_PUERTA=1: falla), las varas de la cerca llegan al borde y el alto de la empalizada.":"Новые проверки моделей: эти детали и межевой камень сделаны в стиле v5, створка отдельно, дверь помещается в проём стены и в открытом виде его освобождает (сломано с MUTAR_PUERTA=1: падает), жерди изгороди доходят до края, высота частокола.","Publicadas construcción v17 y demo única v12, con comparación lado a lado con la prueba v5.":"Опубликованы строительство v17 и единое демо v12, со сравнением рядом с пробой стиля v5.","Triángulos por pieza medidos en node: puerta de varas 936, puerta de tablas 1180, cerca 552, portillo 640, empalizada 426, puerta de empalizada 2112, mojón 440. No comprobado en un móvil de verdad.":"Треугольники на деталь, измерено в node: дверь из жердей 936, дощатая дверь 1180, изгородь 552, калитка 640, частокол 426, ворота частокола 2112, межевой камень 440. На настоящем телефоне не проверено.","Hito 1e: muebles con el estilo v5":"Этап 1e: мебель в стиле v5","Todas correctas con probar_todo.sh: lógica 86/86, modelos 88/88, combate 69/69, acciones 25/25, cinturones, taller, unión, idiomas; navegador de construcción, combate, estilo, personaje, demo, recursos, idioma y web, en PC y móvil.":"Всё проходит в probar_todo.sh: логика 86/86, модели 88/88, бой 69/69, действия 25/25, пояса, мастерская, слияние, языки; браузерные проверки строительства, боя, стиля, персонажа, демо, ресурсов, языка и сайта на ПК и телефоне.","Los once muebles rehechos con el estilo v5, como el banco, el barril y el tocón de la prueba: madera con veta, cortes claros, hierro oscuro y oclusión horneada, juntos en una malla por textura.":"Все одиннадцать предметов мебели переделаны в стиле v5, как скамья, бочка и пень из пробы: дерево с волокнами, светлые срезы, тёмное железо и запечённое затенение, всё в одной сетке на текстуру.","Cama de paja: marco de cuatro troncos con las testas a la vista, paja amontonada con mechones que asoman, jergón de lino y manta de lana doblada. Cama de madera: postes, largueros y cabecero de tablas, somier de tablas, colchón y almohada de lino, manta con el embozo vuelto.":"Соломенная постель: рама из четырёх брёвен с видными торцами, охапка соломы с торчащими пучками, льняной тюфяк и сложенное шерстяное одеяло. Деревянная кровать: столбики, боковины и дощатое изголовье, дощатое основание, льняной матрас и подушка, одеяло с отвёрнутым краем.","Mesa de tres tablas sobre dos caballetes con patas en tijera y travesaño; banco como el de la prueba, con la espiga pasante a ras; taburete de una rodaja (se ve el corte) con tres patas abiertas.":"Стол из трёх досок на двух козлах с ножками ножницами и перекладиной; скамья как в пробе, со сквозным шипом вровень; табурет из спила бревна (виден срез) на трёх растопыренных ножках.","Arcón de tablas con patines, flejes, clavos, cerradura y aldaba de hierro; barril de catorce duelas abombadas con juntas, dos aros y tapa de tablas; estantería con trasera de tablas, vasijas de barro torneadas, un cuenco, un rollo de paño y un manojo.":"Дощатый сундук на полозьях с железными полосами, гвоздями, замком и накладкой; бочка из четырнадцати выпуклых клёпок с зазорами, два обруча и дощатая крышка; полка с дощатой задней стенкой, точёными глиняными горшками, миской, свёртком ткани и пучком.","Antorcha de pie: vara entre piedras con un cesto de hierro y estopa; la llama va aparte, brilla y no da sombra. Alfombra: piel curtida con su forma (patas y cuello) y el lomo más oscuro. Estandarte: asta con regatón entre piedras, travesaño atado y paño en pliegues con dos puntas y una banda.":"Напольный факел: шест среди камней с железной корзинкой и паклей; пламя отдельно, светится и не отбрасывает тени. Ковёр: выделанная шкура со своей формой (лапы и шея) и более тёмной спиной. Знамя: древко с железным наконечником среди камней, привязанная перекладина и полотнище в складках с двумя концами и полосой.","Textura nueva por código para los paños (tejido de lino y lana) y colores de lino, lana, paño, piel y barro en la paleta.":"Новая текстура ткани, созданная кодом (льняное и шерстяное плетение), и цвета льна, шерсти, сукна, шкуры и глины в палитре.","Mismo tamaño y apoyo que antes: la lógica y los guardados no cambian.":"Тот же размер и опора, что и раньше: логика и сохранения не меняются.","Pruebas nuevas de modelos: cada mueble hecho con el estilo v5, apoyado en el suelo y dentro de su sitio, y la llama de la antorcha (rota con MUTAR_MUEBLE=1: falla). La de navegador pone los once muebles en fila y saca fotos de cerca.":"Новые проверки моделей: каждый предмет мебели в стиле v5, стоит на земле и в своих пределах, и пламя факела (с MUTAR_MUEBLE=1 проверка ломается: падает). Браузерная проверка ставит все одиннадцать в ряд и делает снимки вблизи.","Publicadas construcción v18 y demo única v13, con comparación lado a lado con la prueba v5.":"Опубликованы строительство v18 и единая демо v13, со сравнением бок о бок с пробой v5.","Triángulos por mueble medidos en node: cama de paja 1356, cama de madera 3224, mesa 676, banco 540, taburete 154, arcón 2388, barril 1272, estantería 1824, antorcha 720, alfombra 552, estandarte 1720. No comprobado en un móvil de verdad.":"Треугольники на предмет мебели, измерено в node: соломенная постель 1356, деревянная кровать 3224, стол 676, скамья 540, табурет 154, сундук 2388, бочка 1272, полка 1824, факел 720, ковёр 552, знамя 1720. На настоящем телефоне не проверено.","Hito 1e: armas, hacha, pieza fantasma y resaltados con el estilo v5":"Этап 1e: оружие, топор, призрачная деталь и выделения в стиле v5","Todas las pruebas de herramientas/probar_todo.sh correctas (modelos 104/104, construcción, combate, estilo, personaje, demo, idiomas y web en el navegador); capturas revisadas en PC y móvil":"Все проверки herramientas/probar_todo.sh пройдены (модели 104/104, строительство, бой, стиль, персонаж, демо, языки и сайт в браузере); снимки просмотрены на ПК и телефоне","Armas del duelo rehechas con el estilo v5: espadas con la hoja de sección de rombo y su vaceo, puño forrado de cuero con atadura, cruz y pomo de rueda de hierro; palo de vara descortezada con nudos y los cortes a la vista; arco de una pieza que adelgaza hacia las puntas, con puño de cuero.":"Оружие для поединка переделано в стиле v5: у мечей клинок ромбического сечения с долом, рукоять, обтянутая кожей с обмоткой, железная крестовина и дисковое навершие; посох — ошкуренная жердь с сучками и видимыми срезами; лук — цельный, тоньше к концам, с кожаной рукоятью.","Escudo de seis tablas con veta que llenan el círculo, canto forrado de cuero cosido y umbo con su aro y clavos; flecha con punta de hierro y tres plumas atadas; piedra de honda con textura de piedra.":"Щит из шести досок с текстурой дерева, заполняющих круг, обод, обшитый кожей, и умбон с кольцом и гвоздями; стрела с железным наконечником и тремя привязанными перьями; камень для пращи с текстурой камня.","Poste de práctica con dos haces de paja atados con cuerda y piedras calzando el pie; diana de paja con un paño pintado con tierras (ocre, almagre y carbón) en vez de los anillos azul, rojo y amarillo vivos. Las cintas de los luchadores, de paño teñido y más apagadas.":"Тренировочный столб с двумя снопами соломы, перевязанными верёвкой, и камнями у основания; соломенная мишень с полотном, расписанным земляными красками (охра, красная охра и уголь), вместо ярких синих, красных и жёлтых колец. Ленты бойцов — из крашеного сукна и более приглушённые.","La pieza fantasma al construir ya no es un bloque verde o rojo: es la propia pieza con su textura y su color, translúcida, con un velo verde si cabe o rojo si no. Lo marcado al desmontar (naranja lo que se quita, rojo lo que caería) también conserva su textura.":"Призрачная деталь при строительстве больше не зелёный или красный блок: это сама деталь со своей текстурой и цветом, полупрозрачная, с зелёной вуалью, если помещается, или красной, если нет. То, что выделяется при разборке (оранжевым — что снимается, красным — что упадёт), тоже сохраняет текстуру.","Hacha en la mano al talar, como la del tocón de la prueba v5: mango de fresno con veta y cabeza de hierro con la pala abierta y el filo más claro. Se coloca con los huesos de la mano (mango atravesado a los dedos, filo hacia los nudillos) y solo se ve mientras tala.":"Топор в руке при рубке, как у топора на пне в пробе v5: ясеневое топорище с текстурой и железный обух с расширяющимся лезвием и более светлой кромкой. Он ставится по костям кисти (топорище поперёк пальцев, лезвие к костяшкам) и виден только во время рубки.","Lo que se lleva en la mano echa sombra pero no la recibe: con una hoja de 9 mm el mapa de sombras la sombreaba entera y se veía negra.":"То, что держат в руке, отбрасывает тень, но не принимает её: при клинке в 9 мм карта теней затеняла его целиком, и он выглядел чёрным.","Quitadas de modelos.js las funciones del aspecto inicial que ya no usaba nada (árbol, roca, cajas y cilindros de color plano); los recursos del suelo (árboles y rocas) ya eran los del decorado con el estilo v5.":"Из modelos.js убраны функции начального вида, которые больше ничем не использовались (дерево, скала, коробки и цилиндры плоского цвета); ресурсы на земле (деревья и скалы) уже были из декора в стиле v5.","Prueba nueva en prueba_modelos.mjs: armas, escudo, flecha, piedra, poste, diana y hacha hechos con el estilo v5, la hoja llega a la punta que marca el arma, las tablas del escudo llenan el círculo y el hacha mide lo que debe (rota a propósito con MUTAR_ARMA=1: falla).":"Новая проверка в prueba_modelos.mjs: оружие, щит, стрела, камень, столб, мишень и топор сделаны в стиле v5, клинок доходит до острия, отмеченного у оружия, доски щита заполняют круг, а топор нужного размера (нарочно сломана с MUTAR_ARMA=1: не проходит).","El muestrario de piezas saca también fotos de las armas (armas=…). Publicadas construcción v19, combate v11 y demo única v14, con fotos de cerca y una comparación lado a lado con la prueba v5.":"Витрина деталей теперь фотографирует и оружие (armas=…). Опубликованы строительство v19, бой v11 и единая демо v14, с фотографиями крупным планом и сравнением рядом с пробой v5.","No cambiado: el anillo claro que marca la tierra del mojón (es una marca del juego, no una pieza) y el muñeco que se ve un instante mientras carga el personaje.":"Не изменено: светлое кольцо, отмечающее землю межевого камня (это отметка игры, а не деталь), и манекен, который виден мгновение, пока загружается персонаж."}},"generado":"2026-10-27T02:52:28.004Z"};
