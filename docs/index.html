 от 94 до 129 вызовов отрисовки за кадр после объединения статичных сеток (раньше до 1000).","Las capturas de construcción v3 y combate v2 daban 404 en la web (el .gitignore excluía docs/capturas). Lo arreglé aquí y a la vez llegó el mismo arreglo en otro commit; al juntar ambos me quedé con sus capturas.":"Скриншоты строительства v3 и боя v2 давали на сайте 404 (.gitignore исключал docs/capturas). Я исправил это здесь, и одновременно то же исправление пришло в другом коммите; при слиянии я оставил его скриншоты.","No comprobado: los fps en un móvil real (el navegador de pruebas no tiene tarjeta gráfica; da 1-3 fps en todos). El prototipo muestra los fps arriba a la derecha para medirlo en tu móvil.":"Не проверено: fps на реальном телефоне (у тестового браузера нет видеокарты; везде 1-3 fps). Прототип показывает fps вверху справа, чтобы вы могли замерить на своём телефоне.","Hito 5: arreglo del arco (combate v3)":"Этап 5: исправление лука (бой v3)","Lógica 35/35, modelos 21/21, combate 59/59 (7 nuevas, fallan con MUTAR=1); navegador construcción, combate (nueva: soltar flojo no dispara), estilo y web correctos.":"Логика 35/35, модели 21/21, бой 59/59 (7 новых, проваливаются с MUTAR=1); браузер: строительство, бой (новое: слабое отпускание не стреляет), стиль и сайт — без ошибок.","Procesada tu revisión del combate: dos tareas nuevas en el hito 5 (arreglo del arco y escudo provisional).":"Обработан ваш отзыв о бое: две новые задачи в этапе 5 (исправление лука и временный щит).","Soltar por debajo del 50% de tensión cancela el tiro sin disparar, con aviso.":"Если отпустить тетиву при натяжении меньше 50%, выстрел отменяется без стрельбы, с предупреждением.","Echar a correr afloja el arco y no se puede empezar a tensar corriendo.":"Если перейти на бег, лук ослабляется, и начать натягивать на бегу нельзя.","Tras cada disparo, 0,8 s para encajar la siguiente flecha (piedras 0,5 s): como mucho unas 8 flechas cada 10 s.":"После каждого выстрела 0,8 с на то, чтобы наложить следующую стрелу (камни — 0,5 с): не больше примерно 8 стрел за 10 с.","Arreglado de paso: correr contaba con solo pulsar Mayúsculas aunque estuvieras quieto.":"Попутно исправлено: бег засчитывался при одном нажатии Shift, даже если персонаж стоял на месте.","Revisión de las pruebas de estilo: investigación y replanteo":"Отзыв о пробах стиля: исследование и пересмотр","Sin cambios de código en esta parte.":"В этой части код не менялся.","valravnx: las pruebas de estilo v1 no valen (tres acabados sobre el mismo modelo, B y C muy lentos, personaje feo).":"valravnx: пробы стиля v1 не годятся (три отделки одной и той же модели, B и C очень медленные, персонаж уродливый).","Causas de la lentitud: material físico (Standard) en B y C, sombra de 2048, resolución doble en móvil y hasta 86 mil triángulos en C.":"Причины медлительности: физический материал (Standard) в B и C, тень 2048, двойное разрешение на телефоне и до 86 тыс. треугольников в C.","Investigado: con menos de 100-150 dibujados, un material barato, una sola luz con sombra y sombras de 1024 o 512, la escena va fluida en móvil medio. Ayudan también el material toon con textura de degradado, juntar mallas e instanciar.":"Исследовано: при менее чем 100-150 вызовах отрисовки, дешёвом материале, одном источнике света с тенью и тенях 1024 или 512 сцена идёт плавно на телефоне среднего уровня. Также помогают toon-материал с градиентной текстурой, объединение сеток и инстансинг.","Personaje: el problema de fondo es montarlo con piezas sueltas (esferas y cilindros pegados). Propuesta: una sola malla continua con esqueleto, o modelos libres CC0 ya animados. Queda para que decidas.":"Персонаж: корень проблемы — сборка из отдельных частей (склеенные сферы и цилиндры). Предложение: одна сплошная сетка со скелетом или свободные CC0-модели с готовой анимацией. Решать вам.","Nueva tarea en el hito 1b para rehacer las pruebas con presupuesto medido.":"Новая задача в этапе 1b: переделать пробы с измеренным бюджетом.","Hito 1b: prueba de estilo v2, ligera y estilizada":"Этап 1b: проба стиля v2, лёгкая и стилизованная","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v2 (con presupuesto; MUTAR=1 falla como debe) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 59/59; браузер: строительство, бой, стиль v2 (с бюджетом; MUTAR=1 проваливается, как и должна) и сайт — всё в порядке.","Un solo estilo en vez de tres acabados: sombreado de dibujo de 3 tonos, caras planas, colores apagados en los vértices con variación y oclusión horneada, sin texturas.":"Один стиль вместо трёх отделок: рисованное затенение в 3 тона, плоские грани, приглушённые цвета в вершинах с вариациями и запечённым затенением, без текстур.","Toda la parte fija (cabaña, leña, tocón, barril, banco, cerca) es un solo dibujado; árboles, rocas y matas, instanciados. Medido: 29,6 mil triángulos y 12 dibujados (la v1 llegaba a 86 mil y 1000 antes de juntarla).":"Вся статичная часть (хижина, дрова, пень, бочка, скамья, изгородь) — один вызов отрисовки; деревья, камни и кусты — через инстансинг. Замерено: 29,6 тыс. треугольников и 12 вызовов отрисовки (v1 доходила до 86 тыс. и 1000 до объединения).","Una sola sombra de 1024 px; solo echan sombra los árboles cercanos. Cielo con degradado y niebla, sin posproceso.":"Одна тень 1024 px; тень отбрасывают только ближние деревья. Небо с градиентом и туман, без постобработки.","Resolución adaptativa: empieza a 1,5× como mucho y baja hasta 0,75× si no llega a 50 fps.":"Адаптивное разрешение: начинается максимум с 1,5× и снижается до 0,75×, если не набирается 50 fps.","Tejado de paja con bordes redondeados y vetas de color. Dos luces para comparar: mañana y tarde.":"Соломенная крыша со скруглёнными краями и цветными прожилками. Два варианта освещения для сравнения: утро и вечер.","Quitado el personaje de la v1: el nuevo espera tu decisión (malla continua por código o modelos CC0).":"Персонаж из v1 убран: новый ждёт вашего решения (сплошная сетка из кода или CC0-модели).","No comprobado: los fps en un móvil o PC real (el navegador de pruebas no tiene tarjeta gráfica).":"Не проверено: fps на реальном телефоне или ПК (у тестового браузера нет видеокарты).","Hito 5: escudo provisional (combate v4)":"Этап 5: временный щит (бой v4)","Construcción 35/35, modelos 21/21, combate 69/69 (10 nuevas del escudo, fallan con MUTAR=1), navegador de combate PC y móvil correcto (8 comprobaciones nuevas, fallan con el escudo roto a propósito), estilo y web correctos":"Строительство 35/35, модели 21/21, бой 69/69 (10 новых для щита, проваливаются с MUTAR=1), браузер боя на ПК и телефоне без ошибок (8 новых проверок, проваливаются с намеренно сломанным щитом), стиль и сайт без ошибок","Nueva arma «Espada y escudo»: espada de una mano con 1,7 m de alcance (la larga 1,9), algo más rápida y algo menos dañina.":"Новое оружие «Меч и щит»: одноручный меч с досягаемостью 1,7 м (у длинного 1,9), чуть быстрее и чуть слабее.","Escudo redondo de tablas con borde de cuero y umbo, en el brazo izquierdo; al parar se levanta delante del pecho.":"Круглый дощатый щит с кожаной окантовкой и умбоном, на левой руке; при защите поднимается перед грудью.","Con escudo, Parar detiene también flechas y piedras que vienen de frente (70° a cada lado); de espaldas o de lado no.":"Со щитом «Защита» останавливает также стрелы и камни, летящие спереди (70° в каждую сторону); сзади или сбоку — нет.","Parar con escudo cuesta el 60% del aliento que cuesta con la espada. La parada perfecta y el golpe maestro funcionan igual.":"Защита щитом стоит 60% дыхания от защиты мечом. Идеальная защита и мастерский удар работают так же.","Nueva opción «Arma del rival» (como la tuya, espada larga, espada y escudo o palo). El rival con escudo lo levanta cuando le apuntas con arco u honda y lo mantiene mientras recargas.":"Новая настройка «Оружие противника» (как у вас, длинный меч, меч и щит или палка). Противник со щитом поднимает его, когда вы целитесь в него из лука или пращи, и держит, пока вы перезаряжаете.","Todo apuntado como provisional en el registro de decisiones del prototipo, para que lo revises.":"Всё записано как временное в журнал решений прототипа, чтобы вы проверили.","Los guardados de opciones anteriores siguen valiendo: si no tienen arma del rival, se usa «Como la tuya».":"Прежние сохранённые настройки по-прежнему работают: если в них нет оружия соперника, используется «Как у тебя».","Hito 1b: prueba de estilo v3, maqueta en miniatura":"Этап 1b: проба стиля v3, миниатюрный макет","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v3 (MUTAR=1 falla como debe) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 59/59; браузер: строительство, бой, стиль v3 (MUTAR=1 падает, как и должен) и сайт: всё в порядке.","Tu revisión de la v2: recordaba a juegos gratuitos de motor genérico y las piedras del cimiento se veían sueltas. Elegiste «maqueta en miniatura».":"Твой отзыв о v2: напоминало бесплатные игры на типовом движке, а камни фундамента выглядели разрозненными. Ты выбрал «миниатюрный макет».","La escena es un pedazo de tierra redondo con el corte de tierra visto, sobre fondo liso con degradado. Cámara de teleobjetivo y desenfoque arriba y abajo (se puede quitar).":"Сцена — круглый клочок земли с видимым срезом грунта на ровном фоне с градиентом. Камера с телеобъективом и размытие сверху и снизу (можно отключить).","Formas redondeadas: cantos suaves, troncos con puntas abombadas, tejado de paja en tres hiladas gruesas, copas redondas, matorrales y flores de colores apagados.":"Скруглённые формы: мягкие рёбра, брёвна с выпуклыми торцами, соломенная крыша в три толстых ряда, круглые кроны, кусты и цветы приглушённых цветов.","Zócalo de piedra continuo: núcleo de mortero con dos hiladas de piedras bien juntas.":"Сплошной каменный цоколь: сердцевина из раствора с двумя рядами плотно подогнанных камней.","Luz suave, sombras de bordes blandos y sombras de contacto horneadas en el suelo.":"Мягкий свет, тени с мягкими краями и запечённые в землю контактные тени.","Medido: 47 mil triángulos (con la pasada de sombra) y 6 dibujados. Subido el presupuesto de 30 a 50 mil por los cantos redondeados; los dibujados bajan de 12 a 6.":"Измерено: 47 тыс. треугольников (с проходом теней) и 6 вызовов отрисовки. Бюджет поднят с 30 до 50 тыс. из-за скруглённых рёбер; вызовов отрисовки стало 6 вместо 12.","Decidido por ti en el chat: los personajes se hacen por código. La tarea del personaje pasa a pendiente.":"Решено тобой в чате: персонажи делаются кодом. Задача персонажа переходит в ожидающие.","No comprobado: los fps en un aparato real.":"Не проверено: fps на реальном устройстве.","Hito 1b: prueba de estilo v4, realismo en miniatura":"Этап 1b: проба стиля v4, миниатюрный реализм","Lógica 35/35, modelos 21/21, combate 59/59; navegador construcción, combate, estilo v4 (MUTAR=1 falla como debe) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 59/59; браузер: строительство, бой, стиль v4 (MUTAR=1 падает, как и должен) и сайт: всё в порядке.","Tu revisión de la v3: te gusta, pero el mundo no estará recortado; pediste probar el «realismo en miniatura» con algo de textura.":"Твой отзыв о v3: нравится, но мир не будет обрезанным; ты попросил попробовать «миниатюрный реализм» с текстурой.","Texturas hechas por código, en gris, que dan detalle y relieve: veta, anillos de los cortes, paja en hebras, piedra, corteza, hojas y suelo. El color sigue saliendo de la paleta.":"Текстуры, созданные кодом, в оттенках серого, дают детали и рельеф: волокна дерева, годичные кольца на срезах, солому прядями, камень, кору, листья и землю. Цвет по-прежнему берётся из палитры.","Las texturas van a escala real: la veta sigue el largo de cada tronco y tabla, la paja baja por la pendiente y los anillos se centran en cada corte.":"Текстуры в реальном масштабе: волокна идут вдоль каждого бревна и доски, солома спускается по скату, а кольца центрированы на каждом срезе.","El suelo sigue con lomas hasta el horizonte, con bosque lejano instanciado y niebla del color del cielo.":"Земля по-прежнему тянется холмами до горизонта, с инстансированным дальним лесом и туманом цвета неба.","Medido: 47 mil triángulos y 21 dibujados (una malla por textura), dentro del presupuesto de 50 mil y 60.":"Измерено: 47 тыс. треугольников и 21 вызов отрисовки (одна сетка на текстуру), в пределах бюджета 50 тыс. и 60.","Hito 1b: prueba de estilo v5, árboles rehechos":"Этап 1b: проба стиля v5, деревья переделаны","Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v5 y web: todo correcto.":"Логика 35/35, модели 21/21, бой 69/69; браузер: строительство, бой, стиль v5 и сайт: всё в порядке.","Tu revisión de la v4: la casa bien, los árboles fatal, con rayajos raros.":"Твой отзыв о v4: дом хороший, деревья ужасные, со странными каракулями.","Causa: la textura de hojas se proyectaba cara a cara sobre las copas y salían trazos cortados en cada cara.":"Причина: текстура листьев проецировалась на кроны грань за гранью, и на каждой грани получались обрубленные штрихи.","Copas nuevas: bolas suaves con bultos, como racimos, más claras arriba y oscuras por dentro, con una textura de manchas redondas que envuelve la copa sin costuras.":"Новые кроны: мягкие бугристые шары, как гроздья, светлее сверху и темнее внутри, с текстурой из круглых пятен, которая обёртывает крону без швов.","Pinos: cada piso acaba en puntas caídas, como ramas, en vez de un cono liso.":"Сосны: каждый ярус заканчивается свисающими кончиками, как ветви, а не гладким конусом.","Medido: 49 mil triángulos y 21 dibujados (algo menos de hierba para no pasar de 50 mil).":"Измерено: 49 тыс. треугольников и 21 вызов отрисовки (травы чуть меньше, чтобы не превысить 50 тыс.).","Hito 1b: personaje por código (avance, sin publicar)":"Этап 1b: персонаж кодом (промежуточный результат, не опубликован)","Sin prueba de navegador propia todavía (no publicado). Lo demás sin cambios.":"Собственного браузерного теста пока нет (не опубликовано). Остальное без изменений.","Cuerpo hecho por secciones con perfil real (cintura, pecho, muslo, rodilla, pantorrilla, deltoides, codo) en una sola malla con esqueleto de 17 huesos: anda y respira sin abrirse en las articulaciones.":"Тело собрано из секций с реальным профилем (талия, грудь, бедро, колено, икра, дельтовидная мышца, локоть) в единой сетке со скелетом из 17 костей: ходит и дышит, не расходясь в суставах.","Manos con palma, cuatro dedos recogidos y pulgar; zapatos de una pieza; túnica con pliegues en la falda que sigue a los muslos al andar; camisa en cuello y puños; cinto con hebilla; vendas en las piernas.":"Кисти с ладонью, четырьмя согнутыми пальцами и большим пальцем; цельные башмаки; туника со складками на подоле, который следует за бёдрами при ходьбе; рубаха видна у ворота и на манжетах; пояс с пряжкой; обмотки на ногах.","Cabeza: esfera moldeada (mandíbula, mentón, ceja, cuencas, pómulos, nariz, boca) con pelo y barba como abultamiento de la misma malla. No da el nivel: de cerca la cara se ve blanda y rara. No se publica.":"Голова: вылепленная сфера (нижняя челюсть, подбородок, надбровье, глазницы, скулы, нос, рот), волосы и борода — выпуклость той же сетки. Не дотягивает: вблизи лицо выглядит рыхлым и странным. Не публикуется.","Siguiente paso propuesto: hacer la cabeza a partir de una malla base con planos marcados (frente, cuencas, pómulos, nariz, mandíbula), escrita como datos en el código, en vez de deformar una esfera.":"Предлагаемый следующий шаг: делать голову из базовой сетки с чёткими плоскостями (лоб, глазницы, скулы, нос, челюсть), записанной в коде как данные, вместо деформации сферы.","Personaje: 5,9 mil triángulos.":"Персонаж: 5,9 тыс. треугольников.","Hito 1b: personaje nuevo por código (prueba de estilo v6)":"Этап 1b: новый персонаж кодом (проба стиля v6)","Lógica 35/35, modelos 21/21, combate 69/69; navegador construcción, combate, estilo v6 (con pruebas nuevas del personaje; MUTAR=1 falla como debe) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 69/69; браузер: строительство, бой, стиль v6 (с новыми тестами персонажа; MUTAR=1 падает, как и должен) и сайт: всё в порядке.","Personaje hecho todo por código, como decidiste: una sola malla continua, sin piezas sueltas. El cuerpo es una suma suave de formas (cráneo, cara, nariz, cejas, orejas, tronco, brazos, manos con pulgar, piernas y pies) que se convierte en malla.":"Персонаж целиком сделан кодом, как ты решил: одна сплошная сетка, без отдельных деталей. Тело — плавная сумма форм (череп, лицо, нос, брови, уши, туловище, руки, кисти с большим пальцем, ноги и ступни), превращённая в сетку.","Más detalle donde se ve: la rejilla es más fina en la cara y las manos. Medido: 9.836 triángulos y 5.611 vértices.":"Больше деталей там, где видно: на лице и кистях сетка мельче. Измерено: 9836 треугольников и 5611 вершин.","Esqueleto de 17 huesos con pesos calculados por cercanía a las formas de cada hueso. Dos animaciones por código: quieto (respira y se balancea) y andar (va y viene por el camino).":"Скелет из 17 костей с весами, рассчитанными по близости к формам каждой кости. Две анимации кодом: стойка (дышит и покачивается) и ходьба (ходит туда-сюда по дорожке).","Hombre adulto de 1,72 m con barba corta; ropa base pintada en la malla (camisa de lino, cinturón con relieve, calzas y zapatos), provisional hasta la tarea de ropa por capas.":"Взрослый мужчина ростом 1,72 м с короткой бородой; базовая одежда нарисована на сетке (льняная рубаха, рельефный пояс, шоссы и башмаки), временно — до задачи многослойной одежды.","Oclusión ambiental horneada en los vértices y ojos con brillo. Vistas nuevas «Personaje» y «Cara» que le siguen, y botón Quieto/Andando (se recuerda al recargar).":"Фоновое затенение запечено в вершины, у глаз есть блики. Новые виды «Персонаж» и «Лицо», которые следуют за ним, и кнопка Стоит/Идёт (запоминается после перезагрузки).","El presupuesto de la escena sube de 50 mil a 72 mil triángulos (con el personaje y su sombra son 68,8 mil). Anotado en el registro.":"Бюджет сцены вырос с 50 до 72 тыс. треугольников (с персонажем и его тенью — 68,8 тыс.). Записано в журнал решений.","Se ve tosco de cerca: pelo como casquete liso, cara aún simple y bordes de color algo borrosos en el cuello de la camisa y la barba. Queda preguntado en las decisiones.":"Вблизи выглядит грубо: волосы как гладкая шапочка, лицо ещё простое, края цвета у ворота рубахи и бороды немного размыты. Вопрос оставлен в решениях.","No comprobado: los fps en un móvil de verdad (aquí, sin tarjeta gráfica, no sirve medirlos).":"Не проверено: fps на настоящем телефоне (здесь, без видеокарты, мерить бессмысленно).","Coincidió con otra sesión (21:13–21:20) que avanzó el personaje por otro camino (src/personaje/, por secciones, sin publicar). Se conservan las dos; esta es la que se publica en la prueba de estilo v6.":"Совпала по времени с другой сессией (21:13–21:20), которая продвинула персонажа иным путём (src/personaje/, по секциям, не опубликовано). Сохранены оба; опубликован в пробе стиля v6 этот.","Hito 1b: personaje esculpido por código (v1)":"Этап 1b: персонаж, вылепленный кодом (v1)","Lógica 35/35, modelos 21/21, combate 69/69, personaje horneado 11/11 (nuevas, fallan con MUTAR=1); navegador construcción, combate, estilo, personaje (nueva, falla con MUTAR=1) y web: todo correcto.":"Логика 35/35, модели 21/21, бой 69/69, запечённый персонаж 11/11 (новые, падают с MUTAR=1); браузер: строительство, бой, стиль, персонаж (новый, падает с MUTAR=1) и сайт: всё в порядке.","Tu revisión: el avance anterior no valía; pediste investigar y hacerlo de la forma óptima, costase lo que costase.":"Твой отзыв: прежний промежуточный результат никуда не годился; ты попросил изучить вопрос и сделать оптимально, чего бы это ни стоило.","Investigado: la técnica que da criaturas orgánicas solo con código es esculpir con campos de distancia (formas simples fundidas con mezcla suave sobre el esqueleto), pasar a malla fina, simplificar y pesar al esqueleto por cercanía. Es lo que usa un proyecto abierto de animales procedurales para three.js.":"Изучено: техника, дающая органических существ одним кодом, — лепка полями расстояний (простые формы, плавно сливающиеся поверх скелета), перевод в мелкую сетку, упрощение и привязка весов к скелету по близости. Так делает открытый проект процедурных животных для three.js.","Hecho así: unas 120 formas (cráneo, frente, cejas, pómulos, maxilar, mandíbula, mentón, nariz con aletas y fosas, labios, cuencas con párpados, orejas; músculos del tronco, brazos y piernas; manos con dedos). Ojos aparte con iris y pupila.":"Сделано так: около 120 форм (череп, лоб, брови, скулы, верхняя челюсть, нижняя челюсть, подбородок, нос с крыльями и ноздрями, губы, глазницы с веками, уши; мышцы туловища, рук и ног; кисти с пальцами). Отдельные глаза с радужкой и зрачком.","Ropa, pelo y barba como capas que siguen al cuerpo (camisa, túnica con pliegues, cinto, calzas, vendas, zapatos). La falda sigue a los muslos al andar.":"Одежда, волосы и борода — слои, следующие за телом (рубаха, туника со складками, пояс, шоссы, обмотки, башмаки). Подол следует за бёдрами при ходьбе.","Horneado al construir (herramientas/hornear_personaje.mjs): rejilla de 3 mm, superficie por surface nets, simplificación con meshoptimizer (la cabeza con más presupuesto), normales y oclusión sacadas del campo. Tarda 95 s; en el juego carga al instante.":"Запекается при сборке (herramientas/hornear_personaje.mjs): сетка 3 мм, поверхность методом surface nets, упрощение через meshoptimizer (голове больше бюджета), нормали и затенение берутся из поля. Занимает 95 s; в игре загружается мгновенно.","Medido: cerca 22,8 mil triángulos y lejos 4 mil; 17 huesos.":"Измерено: вблизи 22,8 тыс. треугольников, вдали 4 тыс.; 17 костей.","Pendiente de pulir: el pelo es algo áspero, la barba tiene el borde irregular, un bulto en el dorso de la muñeca y el cuello de la camisa queda grueso. No comprobado: los fps en un aparato real.":"Ещё доработать: волосы грубоваты, край бороды неровный, бугор на тыльной стороне запястья, ворот рубахи слишком толстый. Не проверено: fps на реальном устройстве.","Web de progreso en inglés":"Сайт прогресса на английском","Web en PC y móvil, en español y en inglés (botón, recargar, ?lang=en): todo correcto; quitar una traducción a propósito hace fallar la generación de la web.":"Сайт на ПК и телефоне, на испанском и английском (кнопка, перезагрузка, ?lang=en): всё в порядке; если нарочно убрать перевод, сборка сайта падает.","Selector ES / EN arriba a la derecha; se recuerda al volver y se puede abrir directamente con ?lang=en.":"Переключатель ES / EN справа вверху; запоминается при возвращении, сайт можно открыть сразу с ?lang=en.","Traducidos al inglés los 206 textos del roadmap, el diario, las decisiones y las notas de versión, y todos los textos fijos de la web.":"Переведены на английский 206 текстов дорожной карты, дневника, решений и заметок к версиям, а также все постоянные тексты сайта.","Las traducciones viven en proyecto/idiomas/en.json; la web no se genera si falta alguna, así que todo lo nuevo saldrá también en inglés.":"Переводы лежат в proyecto/idiomas/en.json; без любого из них сайт не собирается, так что всё новое тоже появится на английском.","Preparado para el ruso: basta con añadir proyecto/idiomas/ru.json y sus textos fijos.":"Готово для русского: достаточно добавить proyecto/idiomas/ru.json и его постоянные тексты.","Nuevas tareas: documentos de diseño en inglés y el juego en inglés.":"Новые задачи: дизайн-документы на английском и игра на английском.","Construcción v4: madera más resistente y casa de dos plantas":"Строительство v4: прочнее дерево и двухэтажный дом","Construcción 46/46 (11 nuevas con casas de 2 y 3 plantas; fallan con MUTAR=1), modelos 21/21, combate 69/69; navegador de construcción (casa de 4×4 de dos plantas con tejado a dos aguas), combate, estilo y web: todo correcto.":"Строительство 46/46 (11 новых с домами в 2 и 3 этажа; падают с MUTAR=1), модели 21/21, бой 69/69; браузер: строительство (двухэтажный дом 4×4 с двускатной крышей), бой, стиль и сайт: всё в порядке.","Causa del tejado que no entraba en las esquinas: el cimiento de troncos de cada esquina carga con dos muros por planta y con la segunda planta se pasaba (1320 kg de 1200).":"Почему крыша не ставилась по углам: бревенчатый фундамент на каждом углу несёт две стены на этаж, и со вторым этажом был перегружен (1320 kg из 1200).","Más aguante en todas las piezas de madera y piedra. Una casa de troncos de 2 plantas con tejado ya entra entera y ninguna pieza pasa del 75%.":"Все деревянные и каменные детали стали прочнее. Бревенчатый дом в 2 этажа с крышей теперь помещается целиком, и ни одна деталь не превышает 75%.","Siguen existiendo límites: 3 plantas piden cimiento de piedra y el zarzo no da para dos plantas.":"Ограничения остаются: для 3 этажей нужен каменный фундамент, а плетень с глиной не выдерживает двух этажей.","Vano de una casilla: un suelo en alto o un tramo de tejado sin muros debajo se apoya en el de al lado. Hasta 4×4 casillas no hacen falta vigas por dentro; en 5×5 el centro sí las pide.":"Пролёт в одну клетку: верхний пол или участок крыши без стен под ним опирается на соседний. До 4×4 клеток внутренние балки не нужны; при 5×5 они нужны в центре.","Los valores nuevos están en Decisiones dentro del juego, como provisionales.":"Новые значения указаны в «Решениях» внутри игры как временные.","Documentos de diseño en inglés":"Дизайн-документы на английском","Todas correctas: construcción 46/46 (ya con la v4 de otra sesión), modelos 21/21, combate 69/69, navegador de construcción, combate, estilo y web (PC y móvil, documentos en los dos idiomas). Romper a propósito los enlaces o la traducción hace fallar la prueba de la web; cambiar el español sin retraducir hace fallar la generación.":"Всё проходит: строительство 46/46 (уже с v4 из другой сессии), модели 21/21, бой 69/69, браузерные тесты строительства, боя, стиля и сайта (ПК и телефон, документы на обоих языках). Если нарочно сломать ссылки или перевод, тест сайта падает; если изменить испанский текст без повторного перевода, падает сборка.","GDD, sistemas y análisis traducidos enteros al inglés, en diseno/en/, con la misma estructura que el original.":"GDD, системы и анализ полностью переведены на английский, в diseno/en/, с той же структурой, что и оригинал.","Cada documento tiene arriba un selector ES · EN; la web en inglés enlaza directamente a la versión inglesa.":"У каждого документа вверху есть переключатель ES · EN; английская версия сайта ведёт прямо на английские документы.","Cada traducción guarda la huella del original en español: si el español cambia y no se vuelve a traducir, la web no se genera y dice qué archivo falta.":"Каждый перевод хранит отпечаток испанского оригинала: если испанский текст изменился, а перевод не обновлён, сайт не собирается и сообщает, какого файла не хватает.","Decisión provisional: los documentos traducidos son archivos aparte (no van en en.json), porque son textos largos con tablas.":"Временное решение: переведённые документы — отдельные файлы (не в en.json), потому что это длинные тексты с таблицами.","Personaje v2: bases libres ya hechas en lugar de esculpirlo por código":"Персонаж v2: готовые свободные основы вместо лепки кодом","Construcción 46/46, modelos 21/21, combate 69/69; navegador: construcción, combate, estilo, personaje v2 (vistas, animación, tres variantes y botones, PC y móvil; MUTAR=1 falla como debe) y web: todo correcto.":"Строительство 46/46, модели 21/21, бой 69/69; браузер: строительство, бой, стиль, персонаж v2 (виды, анимация, три варианта и кнопки, ПК и телефон; MUTAR=1 падает, как и должен) и сайт: всё в порядке.","Se abandona el personaje esculpido por código (daba grima). Investigado cómo lo resuelven otros proyectos de navegador: parten de bases de personajes ya hechas y libres.":"От персонажа, вылепленного кодом, отказываемся (он вызывал отвращение). Изучено, как это решают другие браузерные проекты: они берут готовые свободные основы персонажей.","Elegidos los paquetes CC0 de Quaternius (se pueden usar y vender sin pagar ni citar): cuerpos base, ropa modular por piezas sobre el mismo esqueleto, y librería de animaciones. Licencias y procedencia junto a los modelos.":"Выбраны паки CC0 от Quaternius (можно использовать и продавать без оплаты и указания авторства): базовые тела, модульная одежда из деталей на том же скелете и библиотека анимаций. Лицензии и происхождение лежат рядом с моделями.","Personaje montado con la cabeza de la base (solo cabeza y cuello, el resto lo tapa la ropa), la ropa, el pelo y la barba, atados al mismo esqueleto de 65 huesos. La ropa y las armaduras futuras irán por capas sobre ese esqueleto.":"Персонаж собран из головы основы (только голова и шея, остальное закрывает одежда), одежды, волос и бороды, привязанных к одному скелету из 65 костей. Будущая одежда и доспехи будут надеваться слоями на этот скелет.","Personalización: hombre o mujer, ropa de campesino o de explorador, peinado, color del pelo (6), tono de piel (4) y barba. Animaciones del paquete: quieto, andar, talar, en guardia, golpe y cargar.":"Настройка: мужчина или женщина, одежда крестьянина или следопыта, причёска, цвет волос (6), тон кожи (4) и борода. Анимации из пака: стойка, ходьба, рубка, защитная стойка, удар и ноша.","Modelos preparados para el navegador: texturas reducidas y un archivo por pieza. Un personaje carga unos 4 MB la primera vez más 4,4 MB de animaciones compartidas.":"Модели подготовлены для браузера: уменьшенные текстуры и по файлу на деталь. Персонаж в первый раз загружает около 4 MB плюс 4,4 MB общих анимаций.","No comprobado: los fps en un móvil de verdad (aquí no hay tarjeta gráfica). Un personaje tiene entre 20 y 33 mil triángulos según la ropa.":"Не проверено: fps на настоящем телефоне (здесь нет видеокарты). У персонажа от 20 до 33 тыс. треугольников в зависимости от одежды.","Personaje v3: más ligero en el móvil":"Персонаж v3: легче на телефоне","Personaje en navegador PC y móvil (vistas, animación, variantes, calidad ligera, esqueleto compartido, interruptores): todo correcto.":"Персонаж в браузере на ПК и телефоне (виды, анимация, варианты, лёгкое качество, общий скелет, переключатели): всё в порядке.","valravnx: en su móvil el personaje v2 iba a 10 fps y el traje de explorador es demasiado de fantasía.":"valravnx: на его телефоне персонаж v2 шёл на 10 fps, а костюм следопыта слишком фэнтезийный.","En pantallas táctiles empieza en calidad ligera: material sencillo con el color, sin relieve ni brillo. Resolución de partida 1× y puede bajar hasta 0,5×.":"На сенсорных экранах начинается с лёгкого качества: простой материал только с цветом, без рельефа и блеска. Начальное разрешение 1×, может снижаться до 0,5×.","La ropa, el pelo y la barba comparten un solo esqueleto; antes cada malla calculaba el suyo en cada fotograma.":"Одежда, волосы и борода используют один общий скелет; раньше каждая сетка просчитывала свой в каждом кадре.","Interruptores de prueba (calidad, sombras, cabaña y suelo) para ver en el móvil qué pesa, con los fps arriba. En el móvil el panel empieza cerrado para no tapar al personaje.":"Тестовые переключатели (качество, тени, хижина и земля), чтобы увидеть на телефоне, что нагружает сильнее, с fps вверху. На телефоне панель сначала свёрнута, чтобы не закрывать персонажа.","Quitado el traje de explorador de las opciones.":"Костюм следопыта убран из вариантов.","No comprobado: si con esto llega a fps buenos en el móvil de valravnx. Aquí no hay tarjeta gráfica y las medidas no se parecen a un móvil.":"Не проверено: достигает ли это хороших fps на телефоне valravnx. Здесь нет видеокарты, и замеры не похожи на телефонные.","Personaje v4 y primera prueba del taller propio con MakeHuman":"Персонаж v4 и первая проба собственной мастерской с MakeHuman","Personaje v4 en navegador PC y móvil: todo correcto. Taller: tres humanos creados y exportables sin errores.":"Персонаж v4 в браузере на ПК и телефоне: всё в порядке. Мастерская: три человека созданы и экспортируются без ошибок.","Malentendido corregido: «me va de 10» significaba que iba perfecto, no a 10 fps. Vuelve la calidad alta por defecto también en el móvil; la ligera solo si la eliges tú.":"Исправлено недоразумение: «me va de 10» означало «работает на отлично», а не «10 fps». Высокое качество снова по умолчанию и на телефоне; лёгкое — только если выберешь его сам.","Taller propio montado: Blender sin pantalla (instalado con pip) con MakeHuman (MPFB2) desde su repositorio. Crea humanos por código con edad, sexo, músculo, peso, altura y rasgos de la cara, y les pone esqueleto para juegos.":"Собрана своя мастерская: Blender без интерфейса (установлен через pip) с MakeHuman (MPFB2) из его репозитория. Она создаёт людей из кода с заданными возрастом, полом, мускулатурой, весом, ростом и чертами лица и даёт им игровой скелет.","Primera prueba: tres personas distintas (hombre de mediana edad, mujer joven, anciano) fotografiadas en arcilla. Proporciones y caras anatómicas, y la edad se nota.":"Первый тест: три разных человека (мужчина средних лет, молодая женщина, старик), снятые в «глине». Анатомичные пропорции и лица, возраст заметен.","Lo que falta para usarlo: ojos, pieles, pelo, cejas y barbas vienen en paquetes libres de MakeHuman que solo se bajan de su web (los tiene que bajar valravnx). Su ropa es moderna, no medieval. Cada cuerpo tiene 26,8 mil triángulos y habría que reducirlo para el móvil.":"Чего не хватает для использования: глаза, кожа, волосы, брови и бороды входят в бесплатные наборы MakeHuman, которые скачиваются только с их сайта (их должен скачать valravnx). Их одежда современная, не средневековая. В каждом теле 26,8 тыс. треугольников, для мобильных его пришлось бы упростить.","Taller propio: vestir y acabar por código un humano de MakeHuman":"Своя мастерская: одеть и доделать тело MakeHuman из кода","Prueba de taller, no publicada como versión jugable: dos personajes exportados sin errores, vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.":"Тест мастерской, не опубликован как играбельная версия: два персонажа экспортированы без ошибок, просмотрены в Blender и в three.js без ошибок в консоли. Не проверено: анимации и производительность на мобильных.","Ropa y acabado hechos por código encima del cuerpo de MakeHuman, sin paquetes de fuera: túnica, calzas, zapatos, cinturón, vestido largo y cofia con toca de lino.":"Одежда и отделка сделаны из кода поверх тела MakeHuman, без сторонних наборов: туника, шоссы, башмаки, пояс, длинное платье и льняной чепец с апостольником.","Cada prenda sale de las mallas de ayuda que trae la propia base (malla ceñida y falda), así que hereda los pesos de los huesos y se moverá con el esqueleto sin pintar nada a mano.":"Каждая вещь получается из вспомогательных сеток самой базы (облегающий костюм и юбка), поэтому наследует веса костей и будет двигаться со скелетом без ручной покраски.","Piel, cejas, labios, rojeces, pelo corto y barba pintados en texturas calculadas punto a punto; los bordes del pelo, la barba, el escote y las mangas salen suaves, sin escalones.":"Кожа, брови, губы, румянец, короткие волосы и борода нарисованы в текстурах, рассчитанных точка за точкой; края волос, бороды, выреза и рукавов получаются мягкими, без ступенек.","Se quita la piel que tapa la ropa: unos 19 mil triángulos por personaje (la base sola tenía 26,8 mil).":"Кожа, скрытая под одеждой, убирается: около 19 тысяч треугольников на персонажа (у голой базы было 26,8 тысячи).","Comprobado también en three.js, con la luz y la cabaña de la prueba de estilo: se carga y se ve igual que en Blender.":"Проверено и в three.js, со светом и хижиной из теста стиля: загружается и выглядит так же, как в Blender.","Falta: que se mueva (el esqueleto de MakeHuman está en otra postura que las animaciones de Quaternius y hay que pasarlas de uno a otro), caras más finas y más tipos de pelo.":"Ещё не хватает: движения (скелет MakeHuman стоит в другой позе, чем анимации Quaternius, и их нужно переносить с одного на другой), более тонких лиц и большего числа причёсок.","Juego en inglés: construcción y combate con botón ES/EN":"Игра на английском: строительство и бой с кнопкой ES/EN","Todas correctas (probar_todo.sh): lógica 46/46, modelos 21/21, combate 69/69, personaje horneado, textos traducidos 231/231, navegador construcción, combate, estilo, personaje, juego en inglés (PC y móvil) y web. Capturas en inglés miradas en PC y móvil. No comprobado: en un móvil real.":"Все проходят (probar_todo.sh): логика 46/46, модели 21/21, бой 69/69, запечённый персонаж, переведённые тексты 231/231, браузер: строительство, бой, стиль, персонаж, игра на английском (ПК и мобильный) и сайт. Английские скриншоты просмотрены на ПК и мобильном. Не проверено: на настоящем телефоне.","Módulo de idioma común (src/idioma.js): el texto en español es la clave y src/idiomas/en.json da la traducción; el ruso está preparado (ru.json vacío) y se ofrece en cuanto tenga textos.":"Общий языковой модуль (src/idioma.js): ключом служит испанский текст, а src/idiomas/en.json даёт перевод; русский подготовлен (пустой ru.json) и появится, как только в нём будут тексты.","Botón ES/EN arriba a la derecha en la construcción (v5) y en el combate (v5). Recuerda el idioma con la misma clave que la web: si eliges inglés en la web, el juego sale en inglés. Sin elección, manda el idioma del navegador.":"Кнопка ES/EN справа вверху в строительстве (v5) и в бою (v5). Язык запоминается по тому же ключу, что и на сайте: если выбрать английский на сайте, игра откроется на английском. Если выбора не было, решает язык браузера.","Traducidos todos los textos: botones, ayuda, avisos, motivos de la lógica, piezas, materiales, armas, heridas, registro de combate, pantalla final y decisiones (unos 290).":"Переведены все тексты: кнопки, справка, предупреждения, сообщения логики, детали, материалы, оружие, раны, журнал боя, финальный экран и решения (около 290).","Cambiar de idioma recarga la página sin perder la partida guardada.":"Смена языка перезагружает страницу, не теряя сохранённую игру.","En el móvil solo se ve el botón del otro idioma, para que el menú no crezca; el panel de opciones del combate baja para no tapar el menú.":"На мобильном видна только кнопка другого языка, чтобы меню не разрасталось; панель настроек боя опускается, чтобы не закрывать меню.","Pruebas nuevas: prueba_idiomas.mjs (todo texto del código tiene traducción y las mismas variables) y prueba_idioma_navegador.py (PC y móvil, sin textos sin traducir ni palabras en español a la vista, el botón cambia, recuerda y no borra la partida). Las dos se rompieron a propósito una vez (MUTAR=1) y fallaron.":"Новые тесты: prueba_idiomas.mjs (у каждого текста в коде есть перевод с теми же переменными) и prueba_idioma_navegador.py (ПК и мобильный, нет непереведённых текстов и видимых испанских слов, кнопка переключает, запоминает и не стирает игру). Оба один раз намеренно сломаны (MUTAR=1) и упали.","Decisión provisional: las pruebas de estilo y el personaje quedan en español hasta que valravnx revise el personaje (ninguna otra sesión toca su código); queda como tarea en espera.":"Временное решение: тесты стиля и персонаж остаются на испанском, пока valravnx не посмотрит персонажа (никакая другая сессия не трогает его код); оставлено как задача в ожидании.","Capturas de la construcción en capturas/construccion-v5.":"Скриншоты строительства в capturas/construccion-v5.","Recursos de personaje v2: comprimidos y con las 39 animaciones extra":"Ресурсы персонажей v2: сжатые и с 39 дополнительными анимациями","Todas correctas: construcción 46/46, modelos 21/21, combate 69/69, personaje horneado 11/11, textos traducidos, navegador de construcción, combate, estilo, personaje, recursos v2 (PC y móvil), inglés y web. La prueba de recursos falla a propósito con MUTAR=1 (12 fallos).":"Все проходят: строительство 46/46, модели 21/21, бой 69/69, запечённый персонаж 11/11, переведённые тексты, браузерные тесты строительства, боя, стиля, персонажа, ресурсов v2 (ПК и мобильный), английского и сайта. Тест ресурсов намеренно падает с MUTAR=1 (12 ошибок).","Recursos v2 del personaje: los mismos modelos de la v1, con la geometría y las animaciones comprimidas (meshopt) y las texturas en WebP. La v1 publicada no se toca.":"Ресурсы персонажа v2: те же модели, что в v1, с сжатыми геометрией и анимациями (meshopt) и текстурами в WebP. Опубликованная v1 не тронута.","Un personaje (hombre campesino con pelo, barba y animaciones) baja 1,7 MB en vez de 8,1 MB; las animaciones, de 4,4 MB a 0,7 MB.":"Один персонаж (крестьянин с волосами, бородой и анимациями) теперь загружает 1,7 MB вместо 8,1 MB; анимации — с 4,4 MB до 0,7 MB.","Las posiciones de los vértices no se comprimen: así la ropa, el pelo y la barba siguen compartiendo un solo esqueleto, como en la v3 del personaje.":"Позиции вершин не сжимаются: так одежда, волосы и борода по-прежнему делят один скелет, как в v3 персонажа.","El cargador de personajes abre los archivos comprimidos y, si se le pide, las 39 animaciones extra (vendarse, arco, minar, campo, pesca, espada ligera y pesada, escudo, pasos en todas direcciones, trepar, tumbarse…), cada una con un nombre en español.":"Загрузчик персонажей открывает сжатые файлы и, если попросить, 39 дополнительных анимаций (перевязка, лук, добыча руды, работа в поле, рыбалка, лёгкий и тяжёлый меч, щит, шаги во все стороны, лазание, лечь…), каждая с испанским названием.","Cinco extra se llaman igual que una básica (bloqueo, escudo, comer, brazos cruzados, empujón): la básica se queda como estaba y la extra va aparte, para no cambiar nada sin querer.":"Пять дополнительных называются так же, как базовые (блок, щит, еда, скрещённые руки, толчок): базовая остаётся как была, а дополнительная хранится отдельно, чтобы ничего не изменилось случайно.","Prueba nueva en navegador: la v2 se ve igual que la v1 (diferencia media menor de 1 sobre 255), mismos triángulos y esqueletos, y cada animación extra mueve el cuerpo. Hoja con las 39 poses en las capturas.":"Новый браузерный тест: v2 выглядит так же, как v1 (средняя разница меньше 1 из 255), те же треугольники и скелеты, и каждая дополнительная анимация двигает тело. Лист со всеми 39 позами — в скриншотах.","No se ha cambiado el prototipo del personaje (REVISION.md pide que solo lo toque la sesión del chat hasta que valravnx lo revise): pasarlo a la v2 y añadir el selector de animaciones queda como tarea en espera.":"Прототип персонажа не менялся (REVISION.md просит, чтобы его трогала только сессия чата, пока valravnx его не посмотрит): перевод его на v2 и выбор анимаций оставлены как задача в ожидании.","No comprobado: cuánto tarda en bajar en un móvil real.":"Не проверено: сколько времени занимает загрузка на настоящем телефоне.","Taller MakeHuman: barba pintada, labios más finos y fotos de la cabeza entera":"Мастерская MakeHuman: нарисованная борода, более тонкие губы и снимки всей головы","Prueba de taller, no publicada como versión jugable: dos personajes exportados y vistos en Blender y en three.js sin errores en consola. No comprobado: animaciones ni rendimiento en móvil.":"Тест мастерской, не опубликован как играбельная версия: два персонажа экспортированы и просмотрены в Blender и в three.js без ошибок в консоли. Не проверено: анимации и производительность на мобильных.","La barba ya no es una cáscara encima de la cara: va pintada en la piel, con bordes difusos y pelillos, y el bigote baja por las comisuras hasta unirse a la barba.":"Борода больше не оболочка поверх лица: она нарисована на коже, с размытыми краями и волосками, а усы спускаются по уголкам рта и соединяются с бородой.","Labios más finos y menos salidos (altura, profundidad y anchura de la boca). Medido: el ajuste de «volumen» de MakeHuman casi no cambia nada; lo que sirve es la altura y la profundidad.":"Губы тоньше и меньше выступают (высота, глубина и ширина рта). Измерено: настройка «объём» в MakeHuman почти ничего не меняет; работают высота и глубина.","Fallo de las fotos corregido (lo vio valravnx): el encuadre de la cara cortaba la barbilla. Ahora sale la cabeza entera, del pelo al cuello, en Blender y en three.js.":"Исправлена ошибка снимков (заметил valravnx): кадр лица обрезал подбородок. Теперь видна вся голова, от волос до шеи, в Blender и в three.js.","Con el encuadre nuevo se veían dos fallos que antes quedaban fuera, ya arreglados: un hueco oscuro en el escote de la túnica y el borde dentado de la toca.":"Новый кадр показал два изъяна, которые раньше не попадали в кадр, теперь исправлены: тёмная щель в вырезе туники и зубчатый край апостольника.","Personaje v5: el personaje del taller propio ya se mueve":"Персонаж v5: персонаж из своей мастерской уже двигается","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. No comprobado: fps en un móvil de verdad.":"Все тесты проходят (логика, строительство, бой, стиль, персонаж, ресурсы, английский и сайт), на ПК и мобильном. Не проверено: fps на настоящем телефоне.","Las animaciones de Quaternius se pasan al esqueleto de MakeHuman con un programa propio: el reposo de MakeHuman (brazos en «A») se lleva a la postura del original y en cada fotograma se copia el giro de cada hueso respecto a su reposo; la pelvis copia también los botes, escalados por la altura.":"Анимации Quaternius переносятся на скелет MakeHuman своей программой: исходная поза MakeHuman (руки буквой «А») приводится к позе оригинала, и в каждом кадре копируется поворот каждой кости относительно её исходной позы; таз копирует и покачивания, масштабированные по росту.","Probado con las nueve animaciones que usa el juego: quieto, andar, correr, talar, en guardia, golpe, parar, andar cargando y recoger. Los dos personajes las hacen bien, también la mujer con el vestido.":"Проверено на девяти анимациях, которые использует игра: стойка, шаг, бег, рубка, защитная стойка, удар, парирование, ходьба с грузом и сбор. Оба персонажа выполняют их хорошо, в том числе женщина в платье.","Personaje v5 publicado: en el visor hay una opción nueva, «Base del personaje», para elegir entre el paquete de Quaternius y el taller propio y compararlos.":"Опубликован персонаж v5: в просмотрщике новая опция «База персонажа», чтобы выбрать между набором Quaternius и своей мастерской и сравнить их.","Cada personaje del taller pesa unos 530 KB con ropa, texturas y animaciones (comprimido con WebP y meshopt) y tiene unos 19 mil triángulos.":"Каждый персонаж мастерской весит около 530 KB с одеждой, текстурами и анимациями (сжатие WebP и meshopt) и содержит около 19 тысяч треугольников.","Pruebas nuevas del taller en el visor: carga, se ve el cuerpo y la cara, y al andar se mueven piernas y brazos. Rotas a propósito: fallan como deben.":"Новые тесты мастерской в просмотрщике: загружается, видно тело и лицо, при ходьбе двигаются ноги и руки. Намеренно сломаны: падают, как и должны.","Personaje v6: arreglada la ropa del taller vista del revés":"Персонаж v6: исправлена одежда мастерской, отображавшаяся наизнанку","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil.":"Все тесты проходят (логика, строительство, бой, стиль, персонаж, ресурсы, английский и сайт), на ПК и мобильном.","Fallo que vio valravnx en la v5: en calidad alta la túnica, el vestido, el pelo y la cofia del taller propio se veían del revés, con manchas, y el pelo desaparecía.":"Ошибка, которую valravnx заметил в v5: на высоком качестве туника, платье, волосы и чепец из своей мастерской выглядели вывернутыми наизнанку, в пятнах, а волосы пропадали.","Causa: el cargador de modelos apaga la escritura de profundidad en los materiales con transparencia; al pasarlos a recorte no se volvía a encender, y la piel se pintaba encima. En calidad ligera no pasaba, y las pruebas solo miraban esa.":"Причина: загрузчик моделей отключает запись глубины у прозрачных материалов; при переводе их на отсечение по альфе она не включалась обратно, и кожа рисовалась поверх. На лёгком качестве такого не было, а тесты проверяли только его.","Arreglado y con prueba nueva: en calidad alta todo el personaje del taller tiene que escribir profundidad. Rota a propósito: falla como debe.":"Исправлено, и добавлен новый тест: на высоком качестве весь персонаж мастерской должен записывать глубину. Намеренно сломан: падает, как и должен.","Revisadas las capturas de los dos personajes en calidad alta, en PC y en móvil.":"Просмотрены скриншоты обоих персонажей на высоком качестве, на ПК и мобильном.","Personaje v7: postura y pecho del taller propio":"Персонаж v7: осанка и грудь персонажа своей мастерской","valravnx: el hombre marcaba pecho, el cuerpo iba doblado hacia delante y los hombros muy para atrás.":"valravnx: у мужчины выделялась грудь, тело было согнуто вперёд, а плечи слишком отведены назад.","Causa de la postura: las animaciones del paquete llevan el tronco y el cuello inclinados hacia delante y los brazos colgando hacia atrás, a juego con sus muñecos de cabeza grande; además, al igualar la pelvis y las clavículas a las del paquete, la cadera se giraba 35° y los hombros se iban atrás.":"Причина осанки: в анимациях набора туловище и шея наклонены вперёд, а руки свисают назад — под его большеголовых человечков; к тому же при подгонке таза и ключиц под набор бёдра поворачивались на 35°, а плечи уходили назад.","Arreglo: solo los brazos se igualan al paquete; la inclinación del tronco, el cuello y las clavículas se mide en la animación de estar quieto y se quita en todas (queda un 30 %); y los brazos se giran desde el hombro para colgar rectos.":"Исправление: под набор подгоняются только руки; наклон туловища, шеи и ключиц измеряется в анимации стойки и убирается из всех (остаётся 30 %); руки поворачиваются от плеча, чтобы висели прямо.","La túnica del hombre se alisa en el pecho para que caiga como tela, sin meterse dentro del cuerpo.":"Туника мужчины разглажена на груди, чтобы падала как ткань и не уходила внутрь тела.","Recursos nuevos en recursos/personajes/taller-v2 (los de la v1 publicada no se tocan).":"Новые ресурсы в recursos/personajes/taller-v2 (ресурсы опубликованной v1 не тронуты).","Prueba nueva de postura: cabeza y hombros sobre la pelvis y brazos sin irse atrás. Con los modelos de la v6 falla, como debe.":"Новый тест осанки: голова и плечи над тазом, руки не уходят назад. С моделями v6 падает, как и должен.","Decisión de valravnx: el taller propio es la base de los personajes":"Решение valravnx: своя мастерская — основа персонажей","Sin cambios de código.":"Код не менялся.","valravnx, tras ver el personaje v7: «lo veo bien, sigue», y elige el taller propio (cuerpo de MakeHuman con ropa hecha por código) como base de los personajes del juego. El paquete de Quaternius queda solo para comparar y como fuente de animaciones.":"valravnx, посмотрев персонажа v7: «по-моему, хорошо, продолжай», и выбирает свою мастерскую (тело MakeHuman с одеждой из кода) основой для персонажей игры. Набор Quaternius остаётся только для сравнения и как источник анимаций.","Se cierran las decisiones del personaje y de la ropa: la ropa histórica se hace por código en el taller; no hace falta comprar paquetes ni encargarla.":"Решения о персонаже и об одежде закрыты: историческая одежда делается из кода в мастерской; покупать наборы или заказывать её не нужно.","Las tareas del hito de arte se rehacen para el taller, de una sesión cada una: ropa por capas (camisa y gambesón; cota de malla y sobreveste; capa, calzado y tocados), personalización, más peinados y barbas, las 39 animaciones extra, ropa fabricable y heridas visibles.":"Задачи этапа графики переделаны под мастерскую, по одной сессии на каждую: многослойная одежда (рубаха и гамбезон; кольчуга и сюрко; плащ, обувь и головные уборы), настройка внешности, больше причёсок и бород, 39 дополнительных анимаций, изготавливаемая одежда и видимые раны.","Personaje v8: ropa por capas en el taller propio":"Персонаж v8: многослойная одежда в своей мастерской","Primera tanda de ropa por capas hecha por código sobre el cuerpo de MakeHuman: camisa de lino (en la mujer, larga hasta los tobillos), calzas y zapatos siempre puestos; encima túnica (hombre) o vestido (mujer); y sobre todo, el gambesón acolchado, con los canales cosidos pintados en vertical en el cuerpo y en anillos en las mangas.":"Первая партия многослойной одежды из кода на теле MakeHuman: льняная рубаха (у женщины — длинная, до щиколоток), шоссы и башмаки всегда надеты; поверх — туника (мужчина) или платье (женщина); и поверх всего — стёганый гамбезон с прошитыми каналами, нарисованными вертикально на корпусе и кольцами на рукавах.","Cada capa va algo más separada de la piel que la de debajo, y lo que queda tapado del todo no se dibuja: el cuerpo de una prenda se esconde si lleva otra encima y su falda solo asoma si es más larga. Así no se atraviesan al moverse y se ahorran triángulos (unos 16 a 20 mil por personaje según lo que lleve).":"Каждый слой отстоит от кожи чуть дальше, чем нижний, а то, что полностью закрыто, не рисуется: корпус вещи прячется, если поверх надета другая, а её подол виден, только если он длиннее. Так при движении слои не проходят друг сквозь друга и экономятся треугольники (около 16–20 тысяч на персонажа в зависимости от одежды).","Un cinturón por capa; solo se ve el de la capa de más fuera.":"По поясу на каждый слой; виден только пояс самого внешнего слоя.","En el visor, botones «Túnica», «Vestido» y «Gambesón» para poner y quitar capas. El taller propio sale por defecto.":"В просмотрщике кнопки «Туника», «Платье» и «Гамбезон», чтобы надевать и снимать слои. Своя мастерская выбрана по умолчанию.","Arreglos vistos en las capturas: las calzas asomaban por la camisa y el vestido por la tripa del gambesón; ya no.":"Исправления, замеченные на скриншотах: шоссы проступали сквозь рубаху, а платье — сквозь живот гамбезона; больше нет.","Pruebas nuevas: el gambesón se pone encima y tapa el cuerpo de la prenda de debajo, y al quitarlo vuelve como estaba; el taller sale por defecto. Rotas a propósito: fallan.":"Новые тесты: гамбезон надевается сверху и скрывает корпус нижней вещи, а если его снять, всё возвращается как было; мастерская выбрана по умолчанию. Намеренно сломаны: падают.","Hito 1c: planificación de las piezas nuevas":"Этап 1c: планирование новых деталей","Sin cambios de código. Web reconstruida sin errores.":"Код не менялся. Сайт пересобран без ошибок.","valravnx, por el chat: «puedes hacer, están haciendo los modelados de ropa; haz algo no relacionado». Elige planificar el hito de construcción, que no toca el personaje. Se hace aunque el hito de arte bloquee empezar hitos nuevos, porque lo pide él.":"valravnx в чате: «можешь работать, сейчас делают модели одежды; займись чем-нибудь несвязанным». Выбрано планирование этапа строительства, который не касается персонажа. Это делается, хотя этап графики блокирует начало новых этапов, потому что об этом просит он.","Comparadas las piezas del documento de sistemas con las que ya hay en el juego. Faltan: escalera de tablas, contraventana, trampilla, tejado de teja, remate de tejado, chimenea, adarve, puente de troncos y parte de la decoración.":"Детали из документа систем сравнены с уже имеющимися в игре. Не хватает: лестницы из досок, ставня, люка, черепичной крыши, конька крыши, дымохода, боевого хода, бревенчатого моста и части декора.","Hito desglosado en 9 tareas de una sesión: escalera de tablas, barandillas y vallas, contraventana y trampilla, tejado de teja, remate de tejado, chimenea, adarve, decoración que falta y revisión final.":"Этап разбит на 9 задач по одной сессии: лестница из досок, перила и ограды, ставень и люк, черепичная крыша, конёк крыши, дымоход, боевой ход, недостающий декор и итоговая проверка.","Los puentes de troncos se dejan para el hito Mundo, porque necesitan agua en el mapa.":"Бревенчатые мосты отложены до этапа «Мир», потому что для них нужна вода на карте.","Esta sesión no toca proyecto/sesion.json, que es de la sesión de la ropa.":"Эта сессия не трогает proyecto/sesion.json, который принадлежит сессии одежды.","Decisiones de valravnx: estilo, cámara táctil, curación y fuego amigo":"Решения valravnx: стиль, сенсорная камера, лечение и огонь по своим","Estilo del mundo: el «realismo en miniatura» de la prueba de estilo v5 es la base. Se desbloquean terreno, hierba, árboles, más detalle en las piezas de construcción y el rendimiento en el móvil.":"Стиль мира: основой становится «миниатюрный реализм» из теста стиля v5. Разблокированы рельеф, трава, деревья, больше деталей в строительных элементах и производительность на мобильных.","Cámara táctil en el combate: arrastrar un dedo por zona libre gira la cámara, tocar sin arrastrar sigue golpeando, y con el arco la cámara sigue sola a donde apuntas.":"Сенсорная камера в бою: если провести пальцем по свободной области, камера поворачивается, касание без перетаскивания по-прежнему наносит удар, а с луком камера сама следует туда, куда вы целитесь.","Curación: base la tabla del análisis (vendar, coser, cauterizar, entablillar, hierbas, descanso); en pleno combate se puede, pero lento y quedando vendido.":"Лечение: за основу взята таблица из анализа (перевязка, зашивание, прижигание, наложение шины, травы, отдых); в разгар боя лечиться можно, но медленно и оставаясь беззащитным.","Fuego amigo: sigue al PvP, como dice el diseño (PvP activo, desactivado dentro de la familia): a alguien de tu familia un tajo no le hace nada; a cualquier otro le hiere como un golpe normal.":"Огонь по своим: следует правилам PvP, как сказано в дизайне (PvP включён, отключён внутри семьи): члену вашей семьи удар ничего не делает; любого другого он ранит как обычный удар.","Ya no queda ninguna decisión pendiente: todas las tareas en espera pasan a pendientes.":"Нерешённых вопросов больше не осталось: все ожидающие задачи переходят в «ожидает выполнения».","Personaje v9: cota de malla y sobreveste":"Персонаж v9: кольчуга и сюрко","Todas las pruebas correctas (lógica, construcción, combate, estilo, personaje, recursos, inglés y web), en PC y móvil. Unos 1,5 MB por personaje con todas las prendas. No comprobado: fps en un móvil de verdad.":"Все тесты пройдены (логика, строительство, бой, стиль, персонаж, ресурсы, английский и сайт) на ПК и мобильном. Около 1,5 MB на персонажа со всей одеждой. Не проверено: fps на настоящем телефоне.","Cota de malla como capa, sobre el gambesón: hasta la rodilla, mangas hasta medio antebrazo (asoma el gambesón por debajo) y anillas pintadas por código en filas cruzadas, del mismo tamaño en el cuerpo, las mangas y la falda.":"Кольчуга как слой поверх гамбезона: до колена, рукава до середины предплечья (снизу виден гамбезон), кольца нарисованы кодом смещёнными рядами, одного размера на корпусе, рукавах и подоле.","El metal va a medias: sin reflejos del entorno, el metal puro salía casi negro en el juego.":"Металл сделан лишь отчасти металлическим: без отражений окружения чистый металл в игре выходил почти чёрным.","Sobreveste sin mangas de lana teñida, por encima de todo, hasta media pierna (en la mujer, hasta los tobillos).":"Сюрко без рукавов из крашеной шерсти поверх всего, до середины голени (у женщины — до щиколоток).","Cada prenda va ahora partida en cuerpo, mangas y falda: la sobreveste deja ver las mangas y el cuello de la cota y del gambesón; las mangas de debajo solo se dibujan si asoman.":"Каждая вещь теперь разделена на корпус, рукава и подол: из-под сюрко видны рукава и ворот кольчуги и гамбезона; нижние рукава рисуются, только если они видны.","Arreglos vistos en las capturas: con la cota se abrían agujeros en lo alto de los hombros (el corte del cuello llegaba hasta ahí) y quedaban huecos entre el cuerpo y las mangas; ya no.":"Исправления, замеченные на скриншотах: с кольчугой на верху плеч появлялись дыры (вырез ворота доходил до туда) и оставались щели между корпусом и рукавами; теперь нет.","Prueba nueva: con la sobreveste se ven las mangas y el cuello de la cota. Rota a propósito: falla.":"Новый тест: с сюрко видны рукава и ворот кольчуги. Сломан намеренно: падает.","Hito 1c: escalera de tablas":"Этап 1c: дощатая лестница","Todas con herramientas/probar_todo.sh: lógica de construcción 63/63 (17 nuevas de la escalera), modelos 21/21, combate 69/69, personaje 11/11, textos traducidos, y navegador de construcción (subir y bajar andando, hueco, pasar por debajo), combate, estilo, personaje, recursos, inglés y web correctos. Las pruebas nuevas se rompieron a propósito una vez (sin hueco, sin giro, sin subir andando) y fallaron.":"Все через herramientas/probar_todo.sh: логика строительства 63/63 (17 новых для лестницы), модели 21/21, бой 69/69, персонаж 11/11, переведённые тексты, а также браузерные тесты строительства (подъём и спуск пешком, проём, проход под лестницей), боя, стиля, персонажа, ресурсов, английского и сайта — всё верно. Новые тесты один раз намеренно сломали (без проёма, без поворота, без подъёма пешком), и они упали.","Pieza nueva «Escalera de tablas» (6 tablas y 6 clavos, 100 kg, en Acceso): ocupa una casilla y sube una planta.":"Новая деталь «Дощатая лестница» (6 досок и 6 гвоздей, 100 kg, в разделе «Проходы»): занимает одну клетку и поднимается на один этаж.","Se sube y se baja andando, sin botón: se entra por el lado bajo y se sale arriba a la casilla de al lado; gira con R hacia dónde sube.":"Подниматься и спускаться можно пешком, без кнопки: входите с низкой стороны и выходите наверху на соседнюю клетку; клавишей R выбирается, в какую сторону она поднимается.","Encima queda el hueco abierto: no deja poner suelo sobre la escalera, ni la escalera bajo un suelo; en la última planta no cabe.":"Сверху остаётся открытый проём: над лестницей нельзя положить пол, а лестницу нельзя поставить под полом; на верхнем этаже она не помещается.","Se apoya en el cimiento o suelo de su casilla (o en la tierra en la planta baja) y suma su peso; si se quita ese suelo, cae.":"Лестница опирается на фундамент или пол своей клетки (или на землю на первом этаже) и добавляет свой вес; если этот пол убрать, она падает.","Por debajo del tramo alto se puede pasar sin subir. Por el hueco se puede caer a la escalera desde arriba: las barandillas llegan en la tarea siguiente (anotado en el registro de decisiones).":"Под высоким концом пролёта можно пройти, не поднимаясь. Через проём можно упасть на лестницу сверху: перила появятся в следующей задаче (отмечено в журнале решений).","Construcción v6 publicada.":"Опубликована версия «Строительство» v6.","Análisis del estado del proyecto, GDD v0.7 y plan para unificar las demos":"Анализ состояния проекта, GDD v0.7 и план объединения демо","Web regenerada y comprobada (enlaces, inglés y documentos). Sin cambios de código del juego.":"Сайт пересобран и проверен (ссылки, английский и документы). Код игры не менялся.","Análisis pedido por valravnx: lo hecho frente al GDD, lo que falta y los problemas del desarrollo.":"Анализ по просьбе valravnx: что сделано в сравнении с GDD, чего не хватает и какие проблемы есть в разработке.","Problemas encontrados: las acciones aún no llevan autor (lo pide CLAUDE.md para el servidor); cuatro prototipos separados (construcción y combate siguen con muñecos hechos a mano y sin el estilo elegido); los golpes por dirección del combate no tienen animaciones; falta medir el rendimiento con mucha gente y en un móvil de verdad; el mundo grande por trozos y el servidor no están empezados; la ropa por capas aún no protege ni abriga; el GDD se había quedado atrás; el taller depende de versiones sin fijar; choques al fusionar el diario entre sesiones; código muerto del personaje esculpido; el ruso está sin empezar.":"Найденные проблемы: действия пока не несут автора (этого требует CLAUDE.md для сервера); четыре отдельных прототипа (строительство и бой по-прежнему с фигурками, сделанными вручную, и без выбранного стиля); у направленных ударов в бою нет анимаций; не измерена производительность при большом числе людей и на настоящем телефоне; большой мир по частям и сервер ещё не начаты; многослойная одежда пока не защищает и не греет; GDD отстал; мастерская зависит от незафиксированных версий; конфликты при слиянии дневника между сессиями; мёртвый код вылепленного персонажа; русский ещё не начат.","Hito nuevo 0b «Bases técnicas»: acciones con autor y registro, quitar código muerto, taller con versiones fijadas y diario sin choques. Va primero.":"Новый этап 0b «Технические основы»: действия с автором и журналом, удаление мёртвого кода, мастерская с зафиксированными версиями и дневник без конфликтов. Идёт первым.","Hito nuevo 1d «Una sola demo»: escena común con el estilo v5, personaje del taller en la construcción y en el combate, una página con menú y medida de rendimiento. Va antes que el resto del arte y de las piezas de construcción.":"Новый этап 1d «Единое демо»: общая сцена в стиле v5, персонаж из мастерской в строительстве и в бою, одна страница с меню и замер производительности. Идёт раньше остального арта и строительных деталей.","Tareas nuevas en otros hitos: ruso (infraestructura), prueba de golpes en cinco direcciones con el personaje nuevo (duelo), niveles de detalle del personaje y terreno por trozos (arte), datos de cada prenda (equipo) y comparar alojamientos para el servidor (servidor).":"Новые задачи в других этапах: русский (инфраструктура), тест ударов в пяти направлениях с новым персонажем (дуэль), уровни детализации персонажа и местность по частям (арт), данные каждой вещи (снаряжение) и сравнение хостингов для сервера (сервер).","GDD v0.7: estilo y personajes decididos, ropa por capas personalizable, combate con la rosa y las decisiones de hoy (cámara táctil, curación, fuego amigo), acciones con autor, escena común, mundo por trozos y los hitos 0b, 1b, 1c, 1d y 11b. También en inglés.":"GDD v0.7: стиль и персонажи выбраны, настраиваемая многослойная одежда, бой с розой и сегодняшние решения (сенсорная камера, лечение, огонь по своим), действия с автором, общая сцена, мир по частям и этапы 0b, 1b, 1c, 1d и 11b. Также на английском.","Prueba de estilo y visor de personaje en inglés":"Тест стиля и просмотрщик персонажа на английском","Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 321/321, navegador de construcción, combate, estilo, personaje, recursos, inglés y web), PC y móvil":"Всё проходит с probar_todo.sh (логика, модели, бой, запечённый персонаж, переведённые тексты 321/321, браузерные тесты строительства, боя, стиля, персонажа, ресурсов, английского и сайта), ПК и телефон","La prueba de estilo (v7) y el visor de personaje (v10) usan el mismo módulo de idioma que la construcción y el combate: botón ES/EN arriba, que recuerda el idioma elegido (también el de la web).":"Тест стиля (v7) и просмотрщик персонажа (v10) используют тот же языковой модуль, что строительство и бой: кнопка ES/EN вверху, которая запоминает выбранный язык (в том числе язык сайта).","Traducidos al inglés todos sus textos: botones, vistas, opciones del personaje (base, cuerpo, capas de ropa, pelo, piel, barba, calidad, animación), la medida de fps y las notas de cada versión (99 textos nuevos).":"Все их тексты переведены на английский: кнопки, виды, параметры персонажа (основа, телосложение, слои одежды, волосы, кожа, борода, качество, анимация), показатель fps и примечания к каждой версии (99 новых текстов).","Las opciones del visor de personaje pasan a src/personaje/textos.js para que la prueba de idiomas las lea sin navegador.":"Параметры просмотрщика персонажа перенесены в src/personaje/textos.js, чтобы тест языков читал их без браузера.","Prueba de idiomas ampliada a estilo y personaje; la de navegador del inglés recorre ahora también las vistas y las notas de los dos, en PC y móvil. Rota a propósito (quitando dos traducciones) falla donde debe.":"Тест языков расширен на стиль и персонажа; браузерный тест английского теперь также проходит по видам и примечаниям обоих, на ПК и телефоне. Намеренно сломанный (удалены два перевода), он падает там, где должен.","Las pruebas de navegador de estilo y personaje se abren con el navegador en español, para que sus capturas sigan en español; el inglés lo prueba la de idiomas.":"Браузерные тесты стиля и персонажа открываются с браузером на испанском, чтобы их скриншоты оставались на испанском; английский проверяет тест языков.","Capturas de la prueba de estilo en capturas/estilo-v7.":"Скриншоты теста стиля — в capturas/estilo-v7.","Juego y web en ruso":"Игра и сайт на русском","Todas correctas con probar_todo.sh (lógica, modelos, combate, personaje horneado, textos traducidos 322/322 en inglés y ruso, navegador de construcción, combate, estilo, personaje, recursos, inglés y ruso, y web), PC y móvil":"Всё проходит с probar_todo.sh (логика, модели, бой, запечённый персонаж, переведённые тексты 322/322 на английском и русском, браузерные тесты строительства, боя, стиля, персонажа, ресурсов, английского и русского, и сайта), ПК и телефон","Los cuatro prototipos (construcción v7, combate v6, prueba de estilo v8 y personaje v11) están también en ruso: 398 textos del juego en src/idiomas/ru.json.":"Все четыре прототипа (строительство v7, бой v6, тест стиля v8 и персонаж v11) теперь есть и на русском: 398 игровых текстов в src/idiomas/ru.json.","La web de progreso tiene botón RU: textos fijos, roadmap y diario en ruso (427 textos en proyecto/idiomas/ru.json); construir_web.mjs exige ahora el ruso completo, igual que el inglés.":"На сайте прогресса есть кнопка RU: постоянные тексты, план и дневник на русском (427 текстов в proyecto/idiomas/ru.json); construir_web.mjs теперь требует полного русского перевода, как и английского.","Los documentos de diseño aún no están en ruso: la web en ruso enlaza a los de inglés. Queda como tarea nueva del hito de infraestructura.":"Дизайн-документы пока не переведены на русский: сайт на русском ссылается на английские. Это новая задача этапа инфраструктуры.","En el móvil no cabían tres botones de idioma: ahora hay un desplegable con el idioma (en PC siguen los botones ES · EN · RU).":"На телефоне три кнопки языка не помещались: теперь там выпадающий список (на ПК остаются кнопки ES · EN · RU).","En el móvil, los botones de modo de la construcción se colocan debajo del menú de arriba según lo que mide de verdad (en ruso el menú ocupa tres filas y los tapaba), y el panel de opciones del personaje se coloca encima de la barra de vistas aunque esta ocupe dos filas.":"На телефоне кнопки режимов строительства ставятся под верхним меню по его реальному размеру (на русском меню занимает три строки и закрывало их), а панель настроек персонажа стоит над панелью видов, даже если та занимает две строки.","En ruso, el botón «Parar» del combate (Парировать) va con letra algo más pequeña para que quepa en el círculo.":"На русском кнопка «Парировать» в бою набрана чуть меньшим шрифтом, чтобы поместиться в круг.","La prueba de idiomas comprueba también el ruso (que no falte ningún texto, que las variables coincidan y que esté en cirílico); rota a propósito con MUTAR=ru, falla donde debe.":"Тест языков теперь проверяет и русский (ни один текст не пропущен, переменные совпадают, всё написано кириллицей); намеренно сломанный через MUTAR=ru, он падает там, где должен.","La prueba de navegador de idiomas recorre todas las vistas de los cuatro prototipos en ruso, en PC y móvil: sin textos sin traducir, sin español ni inglés a la vista, nada que se salga por los lados y el menú que no tapa los botones de modo. La de la web prueba el botón RU.":"Браузерный тест языков проходит по всем видам четырёх прототипов на русском, на ПК и телефоне: нет непереведённых текстов, на экране нет испанского и английского, ничего не вылезает по бокам и меню не закрывает кнопки режимов. Тест сайта проверяет кнопку RU.","Visto en las capturas y apuntado como tarea: en el móvil, el aviso de la construcción tapa «Reiniciar» (ya pasaba en inglés) y las notas de la prueba de estilo tapan la barra de vistas.":"Замечено на скриншотах и записано как задача: на телефоне сообщение в строительстве закрывает «Начать заново» (так было и на английском), а примечания теста стиля закрывают панель видов.","No comprobado: la prueba de navegador del ruso y la de la web rotas a propósito (MUTAR=1); las traducciones al ruso no las ha revisado una persona que hable ruso.":"Не проверено: русский браузерный тест и тест сайта в намеренно сломанном виде (MUTAR=1); русские переводы не проверял носитель языка.","Documentos de diseño en ruso":"Дизайн-документы на русском","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, personaje 11, textos traducidos, navegador de los cuatro prototipos, idiomas y web 109 comprobaciones), PC y móvil; la prueba nueva de los documentos en ruso se rompió a propósito una vez y falló":"Все проходят с probar_todo.sh (логика 63, модели 21, бой 69, персонаж 11, переведённые тексты, браузерные тесты четырёх прототипов, языков и сайта — 109 проверок), ПК и телефон; новый тест русских документов один раз нарочно сломан и упал","El GDD, el documento de sistemas y el de análisis están en ruso, en diseno/ru/, con la huella del original como los de inglés.":"GDD, документ систем и разбор теперь на русском, в diseno/ru/, с отпечатком оригинала, как и английские.","Cada documento tiene arriba el selector ES · EN · RU, y la web en ruso enlaza ya a los documentos en ruso (antes iban al inglés).":"У каждого документа вверху переключатель ES · EN · RU, а русская версия сайта теперь ведёт на русские документы (раньше — на английские).","construir_web.mjs comprueba también el ruso: falla si falta una traducción o si el español ha cambiado desde que se tradujo.":"construir_web.mjs проверяет и русский: падает, если перевода нет или испанский текст изменился после перевода.","Con esto se terminan las tareas del hito de infraestructura: queda en revisión para valravnx.":"На этом задачи этапа «Инфраструктура» закончены: он ждёт проверки valravnx.","No comprobado: las traducciones al ruso no las ha revisado una persona que hable ruso.":"Не проверено: русские переводы не вычитывал носитель языка.","Hito 0b: acciones con autor":"Этап 0b: действия с автором","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, personaje 11, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil; la prueba nueva de acciones se rompió a propósito una vez y falló":"Всё проходит в probar_todo.sh (логика 63, модели 21, бой 69, действия 25, персонаж 11, переводы, браузер для четырёх прототипов, ресурсы, языки и сайт), ПК и мобильный; новый тест действий был намеренно сломан один раз и упал","Nuevo módulo de lógica pura src/logica/acciones.js: cada acción es un mensaje con autor, tipo y datos sencillos; se comprueba, se aplica y se anota en un registro, salga bien o mal (con el motivo).":"Новый модуль чистой логики src/logica/acciones.js: каждое действие — сообщение с автором, типом и простыми данными; оно проверяется, применяется и записывается в журнал, удачно оно или нет (с причиной).","Construcción: el mojón, colocar y desmontar piezas, poner y quitar muebles, abrir y cerrar puertas y el botón de materiales pasan ya por las acciones. Con el registro se rehace el mismo mundo desde cero, como hará el servidor.":"Строительство: межевой камень, установка и разборка деталей, мебель, открытие и закрытие дверей и кнопка материалов теперь проходят через действия. По журналу тот же мир восстанавливается с нуля, как это будет делать сервер.","Combate: cada golpe cuerpo a cuerpo y cada disparo son acciones con autor y objetivo; la herida de una flecha se anota como impacto del mismo autor. Quien no está en el combate o ya ha caído no puede herir.":"Бой: каждый удар в ближнем бою и каждый выстрел — действие с автором и целью; рана от стрелы записывается как попадание того же автора. Тот, кто не участвует в бою или уже пал, ранить не может.","Prueba nueva (prueba_acciones.mjs, 25 comprobaciones): falla si una acción se salta el registro, porque el mundo rehecho ya no coincide, y revisa el código del juego para que nada fuera de la lógica pura cambie el mundo directamente.":"Новый тест (prueba_acciones.mjs, 25 проверок): он падает, если действие минует журнал, потому что восстановленный мир уже не совпадает, и проверяет код игры, чтобы ничто вне чистой логики не меняло мир напрямую.","Decisión provisional (anotada en el registro de decisiones de la construcción): mientras no haya cuentas, el autor es «jugador:local» y el registro vive solo en memoria; el guardado no cambia de formato.":"Временное решение (записано в журнале решений строительства): пока нет учётных записей, автор — «jugador:local», а журнал хранится только в памяти; формат сохранения не меняется.","Sin versión jugable nueva: no cambia nada a la vista.":"Новой играбельной версии нет: внешне ничего не меняется.","No comprobado: las dos comprobaciones nuevas de navegador (registro de acciones en la construcción y en el combate) no se rompieron a propósito; la prueba de lógica sí (MUTAR=1 falla en 2 comprobaciones).":"Не проверено: две новые проверки в браузере (журнал действий в строительстве и в бою) не ломались намеренно; логический тест — да (MUTAR=1 проваливает 2 проверки).","Hito 0b: quitar código muerto":"Этап 0b: удаление мёртвого кода","Todas correctas con probar_todo.sh (lógica 63, modelos 21, combate 69, acciones 25, textos traducidos, navegador de los cuatro prototipos, recursos, idiomas y web), PC y móvil":"Все проходят с probar_todo.sh (логика 63, модели 21, бой 69, действия 25, переведённые тексты, браузер для всех четырёх прототипов, ресурсы, языки и сайт), ПК и телефон","Quitado el personaje esculpido abandonado: cuerpo, campos de distancia, datos horneados (560 KB), la herramienta que los horneaba y su prueba. Nada del juego los usaba.":"Удалён заброшенный вылепленный персонаж: тело, поля расстояний, запечённые данные (560 КБ), инструмент, который их запекал, и его тест. Ничто в игре их не использовало.","Quitado el muñeco por código de la prueba de estilo, con sus vistas «Personaje» y «Cara» y el botón «Quieto/Andando». La escena no cambia y su límite vuelve a 50 mil triángulos (usa 49,1 mil).":"Из пробы стиля убрана фигура, сделанная кодом, вместе с видами «Персонаж» и «Лицо» и кнопкой «Стоит/Идёт». Сцена не меняется, её предел снова 50 тысяч треугольников (используется 49,1 тысячи).","Los guardados de la prueba de estilo se adaptan: si se había quedado en una vista de personaje, vuelve a la general.":"Сохранения пробы стиля адаптируются: если был выбран вид персонажа, возвращается общий вид.","Prueba de estilo v9 publicada; las versiones anteriores (con el muñeco) siguen en la web sin tocar.":"Опубликована проба стиля v9; прежние версии (с фигурой) остаются на сайте без изменений.","La prueba de estilo comprueba ahora que no queda nada del muñeco y que un guardado de la v8 se adapta; rota a propósito una vez (MUTAR=1) y falló.":"Тест пробы стиля теперь проверяет, что от фигуры ничего не осталось и что сохранение v8 адаптируется; один раз намеренно сломан (MUTAR=1) и упал.","Hito 0b: taller con versiones fijadas":"Этап 0b: мастерская с зафиксированными версиями","Todas las pruebas correctas (lógica 63, modelos 21, combate 69, acciones 25, taller, traducciones y navegador: construcción, combate, estilo, personaje, recursos, inglés y web). Después solo cambiaron roadmap, diario y traducciones: repetidas web y traducciones. Sin cambios jugables: no hay versión nueva. No comprobado: que las texturas salgan idénticas píxel a píxel, ni que el commit de MPFB2 sea exactamente el usado al principio (es el último del 24 oct, anterior a montar el taller).":"Все тесты пройдены (логика 63, модели 21, бой 69, действия 25, мастерская, переводы и браузер: строительство, бой, ст
