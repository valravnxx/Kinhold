<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Garamond;src:url(garamond.woff2) format('woff2');font-weight:400}
@font-face{font-family:Garamond;src:url(garamond6.woff2) format('woff2');font-weight:600}
@font-face{font-family:Fell;src:url(fell.woff2) format('woff2')}
:root{--claro:#f1e6cf;--oro:#f0cf8a;--gris:#bba98a;--mal:#e8836a;--aviso:#e9c27a;--bien:#9cc79f;--frio:#9cc3ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:16px/1.3 Garamond,Georgia,serif;color:var(--claro)}
body{background:#777 center/cover no-repeat}
body.pc{background-image:url(fondo_pc.png)} body.movil{background-image:url(fondo_movil.png)}
.fix{position:fixed}
.sombra{text-shadow:0 1px 1px #000,0 0 3px #000,0 0 10px rgba(0,0,0,.75)}
.fell{font-family:Fell,Georgia,serif}
/* ---- piezas renderizadas (kit/) ---- */
.br{position:fixed;display:grid;place-items:center;background:url(kit/boton.png) center/contain no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.br>img{width:52%;height:52%}
.br .k{position:absolute;right:-6px;bottom:-6px}
.accion{position:fixed;display:grid;place-items:center;background:url(kit/accion.png) center/contain no-repeat;filter:drop-shadow(0 5px 6px rgba(0,0,0,.6))}
.accion>img{width:58%;height:58%;object-fit:contain}
.accion>img.g{width:46%;height:46%}
.accion .verbo{position:absolute;top:100%;margin-top:4px;left:50%;transform:translateX(-50%);font:18px Fell,serif;white-space:nowrap}
.accion svg.prog{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg)}
.hueco{position:relative;display:grid;place-items:center;background:url(kit/hueco.png) center/contain no-repeat;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.hueco>img{width:84%;height:84%;object-fit:contain}
.hueco.vacio>img{opacity:.22;filter:grayscale(1) brightness(1.6)}
.hueco .n{position:absolute;right:9%;bottom:4%;font:600 16px Garamond,serif;text-shadow:0 1px 2px #000,0 0 4px #000}
.hueco .k{position:absolute;left:-6px;bottom:-6px}
.hueco.sel:after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:0 0 0 2px #f0cf8a,0 0 14px 2px rgba(240,190,100,.7)}
.hueco.bloq{opacity:.45}
.hueco.bloq:before{content:"";position:absolute;inset:18%;background:url(kit/g_cerrar.png) center/contain no-repeat;opacity:.0}
.hueco .et{position:absolute;top:100%;margin-top:2px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--gris);white-space:nowrap}
.med{position:relative;display:grid;place-items:center;background:url(kit/medallon.png) center/contain no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.med svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.med>img{width:44%;height:44%;position:relative}
.med.quieto{opacity:.55}
.med .fl{position:absolute;right:-3px;top:-5px;font:700 14px Garamond,serif;text-shadow:0 1px 2px #000}
.med .nom{position:absolute;top:100%;margin-top:1px;left:50%;transform:translateX(-50%);font:16px Fell,serif;white-space:nowrap}
.k{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border-radius:4px;background:linear-gradient(#625a50,#2b2520);color:var(--claro);font:600 12.5px Garamond,serif;border:1px solid #8a7550;box-shadow:0 2px 0 #120d09}
/* tablero de roble con marco de hierro (9 trozos). La madera va DEBAJO del marco (::before, metida bajo los cantos de
   roble del marco) y el marco encima (::after); el contenido, con su margen por dentro de los cantos y de las escuadras.
   Cuentas: marco.png de 512 px, cantos de 59 px y escuadras hasta 104 px; cortado a 104 y dibujado a 38 px (0,365):
   cantos de 22 px y escuadras de 38 px. A 26 px (fino): cantos de 15 px y escuadras de 26 px. */
.tablero{position:fixed;padding:40px 42px 38px;box-shadow:0 18px 40px rgba(0,0,0,.55);border-radius:4px;isolation:isolate}
.tablero:before{content:"";position:absolute;inset:12px;z-index:-1;background:radial-gradient(ellipse at 50% 40%,rgba(30,18,9,.2),rgba(14,8,4,.6)),url(kit/tablero.jpg) top center/1536px auto repeat-y;border-radius:2px}
.tablero:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border:38px solid transparent;border-image:url(kit/marco.png) 104 / 38px stretch}
.tablero.fino{padding:28px 30px 26px}
.tablero.fino:before{inset:8px}
.tablero.fino:after{border-width:26px;border-image-width:26px}
.tablero .dentro{margin:0;position:relative;z-index:1}
.placa{background:url(kit/cuero.jpg) center/cover;box-shadow:inset 0 0 0 1px rgba(193,154,85,.55),inset 0 0 18px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.55);border-radius:6px}
.etq{position:fixed;transform:translate(-50%,-100%);display:flex;gap:8px;align-items:center;font-size:17px;padding:6px 13px;white-space:nowrap}
.etq small{color:var(--gris);font-size:14.5px}
.etq:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#2a1a0e;border-bottom:0}
.aro-suelo{position:fixed;transform:translate(-50%,-50%);border:2px solid rgba(240,205,140,.9);border-radius:50%;box-shadow:0 0 10px rgba(240,190,100,.65),inset 0 0 10px rgba(240,190,100,.45)}
/* correa (pestañas, pastillas) */
.correa{border:14px solid transparent;border-image:url(kit/correa.png) 30 46 / 14px 22px stretch;background:url(kit/cuero.jpg) center/cover;background-clip:padding-box}
.tab{font:17px Fell,serif;color:#cdbb9a;padding:2px 6px;white-space:nowrap}
.tab.sel{color:var(--oro);text-shadow:0 0 8px rgba(240,190,100,.5)}
.tabs{display:flex;align-items:center;gap:4px}
.correa.tabs{padding:0 18px !important}
.tabs .sep{width:1px;height:18px;background:linear-gradient(transparent,rgba(193,154,85,.6),transparent)}
.titulo{font:24px Fell,serif;color:var(--oro);display:flex;align-items:center;gap:10px}
.titulo img{width:30px;height:30px}
.sub{color:var(--gris);font-style:italic;font-size:15px}
.seccion{font:15px Fell,serif;color:#d8bf8e;letter-spacing:.06em;display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.seccion:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(193,154,85,.6),transparent)}
.rej{display:grid;gap:8px}
.ficha h3{margin:0;font:22px Fell,serif;color:var(--oro)}
.ficha p{margin:3px 0}
.boton-t{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 16px;font:17px Fell,serif;color:var(--claro);border-radius:5px;background:linear-gradient(#5a4128,#2e2013);box-shadow:inset 0 0 0 1px rgba(240,207,138,.55),inset 0 1px 0 rgba(255,230,180,.25),0 3px 6px rgba(0,0,0,.5)}
.boton-t.prim{background:linear-gradient(#b48a45,#6e4f22);color:#fff5df;box-shadow:inset 0 0 0 1px rgba(255,230,170,.8),inset 0 1px 0 rgba(255,240,200,.5),0 3px 8px rgba(0,0,0,.5)}
.boton-t.sec{background:transparent;box-shadow:inset 0 0 0 1px rgba(193,154,85,.55)}
.barra{height:6px;border-radius:3px;background:rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(193,154,85,.4)}
.barra i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#a8792f,#efc777)}
.fondo-menu{position:fixed;inset:-20px;background:inherit;background-size:cover;filter:blur(7px) brightness(.38) saturate(.75)}
.feed{position:fixed;display:flex;flex-direction:column;gap:4px}
.feed div{display:flex;align-items:center;gap:8px;font-size:16.5px;padding:2px 14px 2px 4px;border-radius:4px;background:linear-gradient(90deg,rgba(14,9,6,.72),transparent)}
.feed img{width:32px;height:32px}
.feed b{color:var(--aviso);font-weight:600}
.joy{position:fixed;border-radius:50%;border:2px solid rgba(193,154,85,.35);background:radial-gradient(circle,rgba(20,14,9,.28),rgba(20,14,9,.06));display:grid;place-items:center}
.joy i{width:40%;height:40%;border-radius:50%;background:url(kit/boton.png) center/contain;display:block;opacity:.75}
.manos{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end}
.manos .sep{width:1px;align-self:stretch;margin:8px 4px;background:linear-gradient(transparent,rgba(193,154,85,.7),transparent)}
.carga{position:absolute;left:6px;right:6px;bottom:-12px;height:4px}
.escarcha{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 60%,rgba(190,215,240,.2) 76%,rgba(225,238,252,.6) 100%)}
.coste{display:flex;gap:6px;flex-wrap:wrap}
.coste span{display:inline-flex;align-items:center;gap:3px;font-size:14.5px}
.coste img{width:24px;height:24px}
.coste .falta{color:var(--mal)}
.pieza{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 7px;border-radius:7px;text-align:center;font:16px Fell,serif;background:rgba(10,6,3,.35);box-shadow:inset 0 0 0 1px rgba(193,154,85,.3)}
.pieza.sel{box-shadow:inset 0 0 0 1px rgba(255,225,160,.95),0 0 0 2px #c19a55,0 0 14px rgba(240,190,100,.5)}
.pieza.no{opacity:.6}
.pieza .im{width:100%;height:58px;display:grid;place-items:center}
.pieza .im img{max-height:58px;max-width:90%}
.fantasma{position:fixed;transform:translate(-50%,-50%) skewX(-28deg);border:2px solid rgba(140,210,150,.95);background:rgba(110,180,120,.22);box-shadow:0 0 14px rgba(120,200,130,.5)}
.lista{display:flex;flex-direction:column;gap:5px}
.fila{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;font-size:17px}
.fila img{width:38px;height:38px}
.fila.sel{box-shadow:inset 0 0 0 1px rgba(255,225,160,.95),0 0 0 2px #c19a55,0 0 12px rgba(240,190,100,.45)}
.fila .k{margin-left:auto}
.frases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.frase{padding:7px 10px;font:17px Fell,serif;display:flex;gap:8px;align-items:center}
.frase b{font:600 12px Garamond,serif;color:#b89a68}
/* las cosas (imágenes del juego): un filo claro muy fino y su sombra, para leerse sobre el cuero y el roble oscuros */
img[src^="kit/"]:not([src*="kit/g_"]){filter:drop-shadow(0 0 1px rgba(255,236,200,.5)) drop-shadow(0 2px 2px rgba(0,0,0,.65))}
.hueco{background:radial-gradient(circle at 50% 46%,rgba(160,118,74,.38),rgba(0,0,0,0) 60%),url(kit/hueco.png) center/contain no-repeat}
.pieza .im{background:radial-gradient(ellipse at 50% 50%,rgba(160,118,74,.32),rgba(0,0,0,0) 65%)}
/* el menú en el móvil: una columna que ocupa la pantalla; nada se sale de su tablero */
.hubm{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;padding:8px 6px 6px}
.hubm .tablero{position:relative;flex:none}
.hubm .tablero.crece{flex:1;min-height:0}
.hubm .tablero.crece .dentro{height:100%;overflow:hidden}
.hubm .pieza{font-size:15px;padding:5px 3px 6px} .hubm .pieza .im{height:50px} .hubm .pieza .im img{max-height:50px}
.itabs{display:flex;align-items:flex-start;gap:0;flex:1;margin-right:6px}
.itab{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0;font:12.5px Fell,serif;white-space:nowrap;color:#bba987;text-shadow:0 1px 2px #000}
.itab .o{width:44px;height:44px;background:url(kit/boton.png) center/contain no-repeat;display:grid;place-items:center;opacity:.7}
.itab .o img{width:52%;height:52%}
.itab.sel{color:var(--oro)} .itab.sel .o{opacity:1;filter:drop-shadow(0 0 7px rgba(240,190,100,.75))}
</style></head><body>
<script>
const q = new URLSearchParams(location.search), E = q.get('e') || 'normal', D = q.get('d') || 'pc', pc = D === 'pc';
document.body.className = D;
const h = (s) => document.body.insertAdjacentHTML('beforeend', s);
const G = (n) => `<img src="kit/g_${n}.png" alt="">`;
const PEST = [['Equipo', 'equipo'], ['Fabricar', 'fabricar'], ['Construir', 'construir'], ['Mapa', 'mapa'], ['Tu tierra', 'mojon']];
const cabMovil = (sel) => `<div style="display:flex;align-items:flex-start;justify-content:space-between"><div class="itabs">${PEST.map(([t, g], i) => `<div class="itab${i === sel ? ' sel' : ''}"><span class="o">${G(g)}</span>${t}</div>`).join('')}</div><div class="br" style="position:relative;width:46px;height:46px;flex:none">${G('cerrar')}</div></div>`;
const I = (n) => `kit/${n}.png`;
const COL = { bien: '#7fb383', aviso: '#e2aa4c', mal: '#d9583a', frio: '#86b4e6', calor: '#d39a55' };
function med(k, v, est, { t = 44, nom = '', fl = '', quieto = false } = {}) {
  const c = COL[est], R = 36.5, L = 2 * Math.PI * R;
  return `<div class="med${quieto ? ' quieto' : ''}" style="width:${t}px;height:${t}px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L * v} ${L}" style="filter:drop-shadow(0 0 2.5px ${c})" opacity=".92"/></svg>${G(k)}
    ${fl ? `<span class="fl" style="color:${c}">${fl}</span>` : ''}${nom ? `<span class="nom sombra" style="color:${c}">${nom}</span>` : ''}</div>`;
}
const BIEN = (t) => [med('hambre', .82, 'bien', { t, quieto: 1 }), med('sed', .7, 'bien', { t, quieto: 1 }), med('calor', .5, 'calor', { t, quieto: 1 }), med('cansancio', .9, 'bien', { t, quieto: 1 })];
function necesidades(l) {
  h(`<div class="fix" style="display:flex;gap:${pc ? 10 : 7}px;right:${pc ? 18 : 12}px;top:${pc ? 16 : 16}px;align-items:flex-start">${l.join('')}</div>`);
}
function arriba({ chat = true, tierra = false } = {}) {
  const t = pc ? 50 : 50;
  h(`<div class="br" style="left:14px;top:12px;width:${t}px;height:${t}px">${G('menu')}${pc ? '<span class="k">Tab</span>' : ''}</div>`);
  h(`<div class="br" style="left:${14 + t + 12}px;top:12px;width:${t}px;height:${t}px">${G('hablar')}${pc ? '<span class="k">↵</span>' : ''}</div>`);
  if (tierra && pc) h(`<div class="br" style="left:${14 + 2 * (t + 12)}px;top:12px;width:${t}px;height:${t}px">${G('mojon')}</div>`);
  if (chat) h(`<div class="fix sombra" style="left:18px;top:${t + 22}px;font-size:16.5px"><b style="color:var(--aviso);font-weight:600">Ingrid:</b> ven a la orilla, hay juncos</div>`);
}
function manos({ der = 'hacha_piedra', izq = 'piedra', n = 3, cin = 'cuchillo', hombro = null, sel = 'izq' } = {}) {
  const s = pc ? 64 : 64, sc = pc ? 50 : 52, b = pc ? 22 : 30;
  const bloq = !!hombro;
  const hu = (it, k, extra = '', size = s, num = '') => `<div class="hueco${it ? '' : ' vacio'}${extra}" style="width:${size}px;height:${size}px">${it ? `<img src="${I(it)}">` : ''}${num ? `<span class="n">${num}</span>` : ''}${pc && k ? `<span class="k">${k}</span>` : ''}</div>`;
  h(`<div class="manos" style="bottom:${b}px">
    ${hu(bloq ? null : der, '1', `${!bloq && sel === 'der' ? ' sel' : ''}${bloq ? ' bloq' : ''}`)}
    ${hu(bloq ? null : izq, '2', `${!bloq && sel === 'izq' ? ' sel' : ''}${bloq ? ' bloq' : ''}`, s, bloq ? '' : n)}
    ${hombro ? `<div class="sep"></div>${hu(hombro, '', ' sel', s + 6)}` : ''}
    <div class="sep"></div>${hu(cin, 'C', '', sc)}
    <div class="carga barra"><i style="width:${hombro ? 78 : 42}%"></i></div></div>`);
}
function feed() {
  h(`<div class="feed sombra" style="left:${pc ? 16 : 12}px;bottom:${pc ? 120 : 330}px"><div><img src="${I('rama')}"><b>+2</b> Ramas</div><div style="opacity:.55"><img src="${I('piedra')}"><b>+1</b> Piedra</div></div>`);
}
function movil({ accion = `<img src="${I('piedra')}">`, verbo = 'Coger', atajos = true, prog = 0 } = {}) {
  h(`<div class="joy" style="left:22px;bottom:150px;width:124px;height:124px"><i></i></div>`);
  const L = 2 * Math.PI * 47;
  h(`<div class="accion" style="right:22px;bottom:146px;width:96px;height:96px">${accion}<span class="verbo sombra">${verbo}</span>${prog ? `<svg class="prog" viewBox="0 0 110 110"><circle cx="55" cy="55" r="51" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="5"/><circle cx="55" cy="55" r="51" fill="none" stroke="#f0c46e" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L * prog} ${L}" style="filter:drop-shadow(0 0 4px #f0c46e)"/></svg>` : ''}</div>`);
  if (atajos) {
    h(`<div class="br" style="right:128px;bottom:150px;width:54px;height:54px">${G('fabricar')}</div>`);
    h(`<div class="br" style="right:40px;bottom:270px;width:54px;height:54px">${G('construir')}</div>`);
  }
}
const pPC = { x: 398, y: 323 }, pMV = { x: 214, y: 262 };
function etq(x, y, html, extra = '') { h(`<div class="etq placa ${extra}" style="left:${x}px;top:${y}px">${html}</div>`); }

// ============ estados ============
if (E === 'normal') {
  arriba({ tierra: true }); necesidades(BIEN(pc ? 44 : 40)); manos(); feed();
  const p = pc ? pPC : pMV;
  h(`<div class="aro-suelo" style="left:${p.x}px;top:${p.y}px;width:${pc ? 56 : 40}px;height:${pc ? 20 : 15}px"></div>`);
  etq(p.x, p.y - 18, `${pc ? '<span class="k">F</span>' : ''}Coger la piedra`);
  if (pc) h(`<div class="fix sombra" style="right:18px;bottom:20px;display:flex;gap:14px;font-size:15px;opacity:.8">${[['I', 'Equipo'], ['H', 'Fabricar'], ['B', 'Construir'], ['M', 'Mapa']].map(([k, t]) => `<span style="display:flex;gap:5px;align-items:center"><span class="k">${k}</span>${t}</span>`).join('')}</div>`);
  else movil();
} else if (E === 'hombro') {
  // con un tronco al hombro: las manos no llevan nada (se ven cerradas), y la obra de cerca dice lo que le falta
  arriba({ chat: false, tierra: true }); necesidades(BIEN(pc ? 44 : 40)); manos({ hombro: 'tronco_delgado' });
  const x = pc ? 560 : 205, y = pc ? 360 : 400;
  h(`<div class="fantasma" style="left:${x}px;top:${y + 40}px;width:${pc ? 150 : 110}px;height:${pc ? 90 : 70}px;border-color:rgba(240,205,140,.9);background:rgba(240,205,140,.12);box-shadow:0 0 14px rgba(240,190,100,.4)"></div>`);
  etq(x, y - 6, `<div style="display:flex;flex-direction:column;gap:4px;min-width:${pc ? 220 : 200}px"><div style="display:flex;gap:8px;align-items:center">${pc ? '<span class="k">F</span>' : ''}<span>Dejar el tronco en la obra</span></div><small style="display:flex;gap:6px;align-items:center"><img src="${I('tronco_delgado')}" style="width:24px;height:24px">Muro de troncos: 2 de 4 troncos</small><div class="barra" style="height:5px"><i style="width:50%"></i></div></div>`);
  if (!pc) movil({ accion: `<img src="${I('tronco_delgado')}">`, verbo: 'Dejar', atajos: false });
  else h(`<div class="fix sombra" style="right:18px;bottom:20px;display:flex;gap:14px;font-size:15px;opacity:.8"><span style="display:flex;gap:5px;align-items:center"><span class="k">G</span>Soltarlo al suelo</span></div>`);
} else if (E === 'estado') {
  h(`<div class="escarcha"></div>`);
  arriba({ chat: false });
  const t = pc ? 44 : 40;
  necesidades([med('sed', .2, 'mal', { t: pc ? 58 : 52, nom: 'Sed', fl: '▼' }), med('frio', .7, 'frio', { t: t + 4, nom: pc ? 'Frío' : '', fl: '▼' }), med('hambre', .55, 'aviso', { t }), med('herida', 1, 'mal', { t })]);
  manos();
  const pos = pc ? 'right:14px;top:104px;width:300px' : 'left:10px;right:10px;top:100px';
  h(`<div class="tablero fino" style="${pos}"><div class="dentro ficha" style="padding:4px 6px"><h3 style="color:var(--mal);display:flex;gap:8px;align-items:center"><img src="kit/g_sed.png" style="width:24px">Sed</h3>
     <p>Te cansas antes.</p><p><b style="color:var(--aviso)">Bebe:</b> el río, 140 pasos a levante.</p></div></div>`);
  if (!pc) movil();
} else if (E === 'equipo' || E === 'ropa') {
  h(`<div class="fondo-menu"></div>`);
  const tabs = ['Equipo', 'Fabricar', 'Construir', 'Mapa', 'Tu tierra'];
  const cab = `<div class="tabs correa" style="padding:0 6px">${tabs.map((t, i) => `${i ? '<span class="sep"></span>' : ''}<span class="tab${i === 0 ? ' sel' : ''}">${t}</span>`).join('')}</div>`;
