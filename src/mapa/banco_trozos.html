<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kinhold · banco de trozos</title>
<style>
:root{ --panel: rgba(36,30,24,.86); --ink:#f1e8d8; --acento:#d9a441; --linea: rgba(241,232,216,.15); color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fa3ad;font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;color:var(--ink);background:rgba(58,48,38,.94);border:1px solid var(--linea);border-radius:10px;padding:7px 12px;cursor:pointer}
button.on{background:#6b5534;border-color:var(--acento)}
[hidden]{display:none!important}
#botones{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;display:flex;gap:6px}
#datos{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:640px;background:var(--panel);border-radius:10px;padding:7px 11px;font-size:12px}
#cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,26,22,.6);font-size:15px}
#cargando div{background:var(--panel);padding:12px 18px;border-radius:12px;text-align:center}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="botones"><button id="btnAndar">Andar</button><button id="btnCorrer">Correr</button></div>
<div id="datos">…</div>
<div id="cargando"><div>Generando el mundo… <span id="fase">0 %</span></div></div>
<script>/*APP*/</script>
</body>
</html>
