<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kinhold Posprocesado</title>
<style>
:root{ --panel: rgba(36,30,24,.86); --panel2: rgba(58,48,38,.92); --ink:#f1e8d8; --muted:#bfb19a; --acento:#d9a441; --linea: rgba(241,232,216,.15); color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b241c;font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:7px 11px;cursor:pointer}
button.sel{background:var(--acento);color:#241b10;border-color:transparent;font-weight:600}
button:disabled{opacity:.38;cursor:default}
[hidden]{display:none!important}
#superior{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#superior > *{pointer-events:auto}
#perfiles,#luces{display:flex;gap:6px;flex-wrap:wrap}
#fps{margin-left:auto;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
#idiomas{display:flex;gap:4px}
#resumen{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100vw - 20px));background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted)}
#efectos{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(104px + env(safe-area-inset-top,0px));width:220px;display:flex;flex-direction:column;gap:5px}
#efectos button{text-align:left;padding:6px 10px}
#efectos button small{display:block;font-weight:400;font-size:11px;opacity:.8}
#btnEfectos{display:none}
#inferior{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100vw - 20px)}
#medicion{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 24px));max-height:80vh;overflow:auto;background:var(--panel);border-radius:12px;padding:12px 14px;font-size:13px}
#medicion table{width:100%;border-collapse:collapse;margin:6px 0 10px}
#medicion td{padding:3px 4px;border-bottom:1px solid var(--linea);overflow-wrap:anywhere}
#medicion td:nth-child(2){text-align:right;white-space:nowrap}
@media (max-width:700px){
  #perfiles button,#luces button,#inferior button{padding:6px 8px;font-size:12.5px}
  #fps{margin-left:0}
  #btnEfectos{display:inline-block}
  #efectos{top:auto;bottom:calc(108px + env(safe-area-inset-bottom,0px));width:min(260px,calc(100vw - 20px));display:none;max-height:56vh;overflow:auto}
  #efectos.abierto{display:flex}
  #resumen{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="superior">
  <div id="perfiles"></div>
  <div id="luces"><button data-luz="manana">Mañana</button><button data-luz="tarde">Tarde</button><button data-luz="ocaso">Atardecer</button></div>
  <div id="fps">…</div>
  <div id="idiomas"></div>
</div>
<div id="efectos"></div>
<div id="resumen"></div>
<div id="inferior"><button data-vista="maqueta">General</button><button data-vista="cabana">Cabaña</button><button data-vista="rincon">Rincón</button><button data-vista="contraluz">Contraluz</button><button id="btnEfectos">Efectos</button><button id="btnMedir">Medir</button></div>
<div id="medicion" hidden></div>
<script>/*APP*/</script>
</body>
</html>
